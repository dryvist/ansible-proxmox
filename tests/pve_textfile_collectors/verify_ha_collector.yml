---
- name: Verify the HA textfile collector with local fixtures
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Create the HA collector fixture workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: pve-ha-collector-
      register: pve_textfile_collectors_ha_temp
      changed_when: false

    - name: Set the HA collector fixture path
      ansible.builtin.set_fact:
        pve_textfile_collectors_ha_work: "{{ pve_textfile_collectors_ha_temp.path }}"

    - name: Create fixture directories
      ansible.builtin.file:
        path: "{{ pve_textfile_collectors_ha_work }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - bin
        - scripts
        - output/healthy
        - output/degraded
        - output/failing
        - output/absent

    - name: Load collector defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/pve_textfile_collectors/defaults/main.yml"

    - name: Install the fixture HA manager command
      ansible.builtin.copy:
        dest: "{{ pve_textfile_collectors_ha_work }}/bin/ha-manager"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          case "${HA_FIXTURE_CASE:-}" in
            healthy)
              printf '%s\n' \
                'quorum OK' \
                'master node-a (active, Tue Oct 13 20:04:41 2026)' \
                'fencing armed (CRM watchdog active)' \
                'lrm node-b (idle, watchdog standby, Tue Oct 13 20:04:37 2026)' \
                'lrm node-a (active, watchdog active, Tue Oct 13 20:04:33 2026)' \
                'lrm node-c (active, watchdog active, Tue Oct 13 20:04:41 2026)' \
                'lrm node-d (idle, watchdog standby, Tue Oct 13 20:04:41 2026)' \
                'service ct:100001 (node-c, started)' \
                'service vm:100002 (node-a, started)'
              ;;
            degraded)
              printf '%s\n' \
                'quorum lost' \
                'master node-a (standby, Tue Oct 13 20:04:41 2026)' \
                'fencing disarmed (CRM watchdog inactive)' \
                'lrm node-b (old timestamp)' \
                'service ct:100001 (node-c, error)' \
                'service vm:100002 (node-a, fence)'
              ;;
            failing) exit 1 ;;
            *) exit 2 ;;
          esac

    - name: Render the HA collector into the fixture workspace
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/pve_textfile_collectors/templates/ha.sh.j2"
        dest: "{{ pve_textfile_collectors_ha_work }}/scripts/ha"
        mode: "0755"
      vars:
        pve_textfile_collectors_textfile_dir: "{{ pve_textfile_collectors_ha_work }}/output"
        pve_textfile_collectors_ha_manager_command: "{{ pve_textfile_collectors_ha_work }}/bin/ha-manager"

    - name: Check the rendered script with bash
      ansible.builtin.command:
        cmd: "bash -n {{ pve_textfile_collectors_ha_work }}/scripts/ha"
      changed_when: false

    - name: Run the HA collector against each fixture case
      ansible.builtin.command:
        cmd: "{{ pve_textfile_collectors_ha_work }}/scripts/ha"
      environment:
        OUTPUT_DIR: "{{ pve_textfile_collectors_ha_work }}/output/{{ item.name }}"
        TIMEOUT: "2"
        HA_MANAGER: >-
          {{ '/missing/ha-manager' if item.name == 'absent' else
             pve_textfile_collectors_ha_work ~ '/bin/ha-manager' }}
        HA_FIXTURE_CASE: "{{ item.name }}"
      changed_when: false
      loop:
        - {name: healthy}
        - {name: degraded}
        - {name: failing}
        - {name: absent}

    - name: Read fixture output
      ansible.builtin.set_fact:
        pve_textfile_collectors_ha_healthy: >-
          {{ lookup('ansible.builtin.file', pve_textfile_collectors_ha_work ~ '/output/healthy/ha.prom') }}
        pve_textfile_collectors_ha_degraded: >-
          {{ lookup('ansible.builtin.file', pve_textfile_collectors_ha_work ~ '/output/degraded/ha.prom') }}
        pve_textfile_collectors_ha_failing: >-
          {{ lookup('ansible.builtin.file', pve_textfile_collectors_ha_work ~ '/output/failing/ha.prom') }}
        pve_textfile_collectors_ha_absent: >-
          {{ lookup('ansible.builtin.file', pve_textfile_collectors_ha_work ~ '/output/absent/ha.prom') }}

    - name: Assert healthy HA metrics
      ansible.builtin.assert:
        that:
          - "'pve_textfile_success{script=\"ha\"} 1' in pve_textfile_collectors_ha_healthy"
          - "'pve_textfile_duration_seconds{script=\"ha\"}' in pve_textfile_collectors_ha_healthy"
          - "'pve_ha_quorum_ok 1' in pve_textfile_collectors_ha_healthy"
          - >-
            'pve_ha_master_active{node="node-a"} 1' in pve_textfile_collectors_ha_healthy
          - "'pve_ha_fencing_armed 1' in pve_textfile_collectors_ha_healthy"
          - >-
            'pve_ha_lrm_state{node="node-b",state="idle"} 1'
            in pve_textfile_collectors_ha_healthy
          - >-
            'pve_ha_service_state{sid="ct:100001",node="node-c",state="started"} 1'
            in pve_textfile_collectors_ha_healthy
        quiet: true

    - name: Assert degraded HA metrics retain reported states
      ansible.builtin.assert:
        that:
          - "'pve_ha_quorum_ok 0' in pve_textfile_collectors_ha_degraded"
          - >-
            'pve_ha_master_active{node="node-a"} 0' in pve_textfile_collectors_ha_degraded
          - "'pve_ha_fencing_armed 0' in pve_textfile_collectors_ha_degraded"
          - >-
            'pve_ha_lrm_state{node="node-b",state="old"} 1'
            in pve_textfile_collectors_ha_degraded
          - >-
            'pve_ha_service_state{sid="ct:100001",node="node-c",state="error"} 1'
            in pve_textfile_collectors_ha_degraded
          - >-
            'pve_ha_service_state{sid="vm:100002",node="node-a",state="fence"} 1'
            in pve_textfile_collectors_ha_degraded
        quiet: true

    - name: Assert failed and absent commands emit no HA samples
      ansible.builtin.assert:
        that:
          - "'pve_textfile_success{script=\"ha\"} 0' in pve_textfile_collectors_ha_failing"
          - "'pve_textfile_success{script=\"ha\"} 1' in pve_textfile_collectors_ha_absent"
          - >-
            (pve_textfile_collectors_ha_failing ~ pve_textfile_collectors_ha_absent)
            | regex_findall('(?m)^pve_ha_(quorum_ok|master_active|fencing_armed|lrm_state|service_state)(\\{[^}]*\\})? [01]$')
            | length == 0
        quiet: true
