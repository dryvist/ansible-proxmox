---
- name: Probe the container start check-mode gate
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    tofu_data:
      containers:
        example-agent:
          hostname: example-agent
          node: example-node
          vmid: 900001
    container_start_services: >-
      {{ container_start_check_mode_probe_services | default(['example-agent']) }}

  roles:
    - role: container_start
