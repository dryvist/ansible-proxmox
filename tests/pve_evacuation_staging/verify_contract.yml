---
- name: Verify the issue-816 evacuation staging static contract
  hosts: localhost
  gather_facts: false

  vars:
    pve_evacuation_staging_role_root: "{{ playbook_dir }}/../../roles/pve_evacuation_staging"
    pve_evacuation_staging_defaults: >-
      {{ lookup('file', pve_evacuation_staging_role_root ~ '/defaults/main.yml') | from_yaml }}
    pve_evacuation_staging_server_tasks: >-
      {{ lookup('file', pve_evacuation_staging_role_root ~ '/tasks/server.yml') }}
    pve_evacuation_staging_client_tasks: >-
      {{ lookup('file', pve_evacuation_staging_role_root ~ '/tasks/client.yml') }}
    pve_evacuation_staging_playbook: >-
      {{ lookup('file', playbook_dir ~ '/../../playbooks/pve2_evacuation_staging.yml') }}

  tasks:
    - name: Assert the role is inert and uses the dedicated dataset
      ansible.builtin.assert:
        that:
          - not pve_evacuation_staging_defaults.pve_evacuation_staging_enabled
          - pve_evacuation_staging_defaults.pve_evacuation_staging_pool == 'bulk'
          - pve_evacuation_staging_defaults.pve_evacuation_staging_dataset_name == 'evacuation-816'
          - pve_evacuation_staging_defaults.pve_evacuation_staging_storage_id == 'evacuation-816'
          - pve_evacuation_staging_defaults.pve_evacuation_staging_manifest_directory is defined
          - pve_evacuation_staging_defaults.pve_evacuation_staging_evidence_directory is defined
          - pve_evacuation_staging_defaults.pve_evacuation_staging_nfs_anonymous_user == 'nobody'
          - pve_evacuation_staging_defaults.pve_evacuation_staging_nfs_anonymous_group == 'nogroup'
          - "'bulk/scratch' not in pve_evacuation_staging_server_tasks"
          - "'zfs snapshot' not in pve_evacuation_staging_server_tasks"
          - "'zfs destroy' not in pve_evacuation_staging_server_tasks"
          - "'pvesm remove' not in pve_evacuation_staging_client_tasks"
        fail_msg: "issue-816 staging must stay inert, dedicated, and non-destructive"

    - name: Assert NFS export and independent client views remain explicit
      ansible.builtin.assert:
        that:
          - "'root_squash' in pve_evacuation_staging_server_tasks"
          - "'sync' in pve_evacuation_staging_server_tasks"
          - "'runuser' in pve_evacuation_staging_server_tasks"
          - "'manifest_directory' in pve_evacuation_staging_server_tasks"
          - "'evidence_directory' in pve_evacuation_staging_server_tasks"
          - "'--content' in pve_evacuation_staging_client_tasks"
          - "'backup' in pve_evacuation_staging_client_tasks"
          - "'hosts: pve2' in pve_evacuation_staging_playbook"
          - "'hosts: pve540' in pve_evacuation_staging_playbook"
        fail_msg: >-
          issue-816 staging must retain root-squashed synchronous export and
          independently configured pve2 and pve540 backup-only views.
