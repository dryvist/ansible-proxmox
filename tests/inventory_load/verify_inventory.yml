---
- name: Load OpenTofu host services
  import_playbook: ../../playbooks/load_tofu.yml

- name: Verify OpenTofu inventory loading
  hosts: localhost
  become: false
  gather_facts: false

  tasks:
    - name: Assert the share-serving node received its NAS contract
      ansible.builtin.assert:
        that:
          - hostvars['pve-w1700'] is defined
          - hostvars['pve-w1700'].nas_storage_from_tofu is defined
          - hostvars['pve-w1700'].nas_storage_from_tofu.group_name == "nas"
          - hostvars['pve-w1700'].nas_storage_from_tofu.managed_users[0].name == "jevans"
          - hostvars['pve-w1700'].nas_storage_from_tofu.managed_users[0].password_secret_env
            == "NAS_JEVANS_SMB_PASSWORD"
          # Exactly the two datasets that declared `smb` -- the third has a
          # quota and no share, and must NOT appear.
          - (hostvars['pve-w1700'].nas_storage_from_tofu.shares
             | map(attribute='name') | sort) == ['jdrive', 'timemachine']
          # The share's path comes from the dataset's own mountpoint, which is
          # what makes it impossible to point a share at a dataset that does
          # not exist.
          - (hostvars['pve-w1700'].nas_storage_from_tofu.shares
             | selectattr('name', 'eq', 'jdrive') | first).path == "/bulk/jdrive"
        fail_msg: >-
          load_tofu.yml did not derive the NAS contract from
          node_storage.<node> for the share-serving node.

    # The counterpart assertion, and the one the old global host_services.nas
    # could not express: a node that declares no share gets nothing, so
    # playbooks/site.yml skips nas_storage there instead of failing it.
    - name: Assert a node with no declared share receives no NAS contract
      ansible.builtin.assert:
        that:
          - (hostvars['pve-r540'].nas_storage_from_tofu | default({}, true)) == {}
        fail_msg: >-
          A node with no `smb` block still received a NAS contract. Every node
          would build an identical NAS again, which is the exact shape the
          per-dataset contract replaced.

    - name: Assert pve-w1700 host received OpenTofu replication identity (containers + splunk_vm)
      ansible.builtin.assert:
        that:
          - hostvars['pve-w1700'].containers_from_tofu is defined
          - hostvars['pve-w1700'].containers_from_tofu['s3'].vmid == 902000
          - hostvars['pve-w1700'].splunk_vm_from_tofu.splunk.vmid == 90200
        fail_msg: >-
          load_tofu.yml did not inject the container/splunk identity that
          sanoid_datasets and syncoid_jobs derive VMIDs from.

    - name: Assert the storage node declares a snapshot policy for the state it holds
      ansible.builtin.assert:
        that:
          - hostvars['pve-r540'].sanoid_timer_enabled | bool
          - "'bulk/databases' in hostvars['pve-r540'].sanoid_datasets"
          - "'bulk/appdata' in hostvars['pve-r540'].sanoid_datasets"
          - hostvars['pve-r540'].sanoid_datasets['bulk/databases'].hourly | int > 0
          - hostvars['pve-r540'].sanoid_datasets['bulk/appdata'].recursive == 'yes'
          - "'bulk/subvol-902000-disk-1' in hostvars['pve-r540'].sanoid_datasets"
        fail_msg: >-
          The storage node holds live application state and the dump archive, so
          it must declare a sanoid policy for both. syncoid runs --no-sync-snap:
          with no snapshot here there is nothing for the DR leg to send, and the
          off-pool copy silently never happens.
