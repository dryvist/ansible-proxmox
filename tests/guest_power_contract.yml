---
- name: Verify the guest power request contract
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  tasks:
    # The node gate accepts only proxmox inventory hosts; this run has none.
    - name: Add one proxmox node to the inventory for the node-wide requests
      ansible.builtin.add_host:
        name: example-node
        groups: proxmox
      changed_when: false

    - name: Accept a valid qemu reset request
      ansible.builtin.include_role:
        name: guest_power
        tasks_from: preflight
      vars:
        guest_power_vmid: "900001"
        guest_power_type: qemu
        guest_power_action: reset

    - name: Assert the valid request resolved qm and a running end state
      ansible.builtin.assert:
        that:
          - guest_power_tool == 'qm'
          - guest_power_wanted_status == 'running'

    - name: Accept a valid lxc shutdown request
      ansible.builtin.include_role:
        name: guest_power
        tasks_from: preflight
      vars:
        guest_power_vmid: 900002
        guest_power_type: lxc
        guest_power_action: shutdown

    - name: Assert the lxc request resolved pct and a stopped end state
      ansible.builtin.assert:
        that:
          - guest_power_tool == 'pct'
          - guest_power_wanted_status == 'stopped'

    - name: Accept a valid startall request for one node with a VM filter
      ansible.builtin.include_role:
        name: guest_power
        tasks_from: preflight
      vars:
        guest_power_action: startall
        guest_power_node: example-node
        guest_power_vms: "900001,900002"

    - name: Accept a valid stopall request for one node without a VM filter
      ansible.builtin.include_role:
        name: guest_power
        tasks_from: preflight
      vars:
        guest_power_action: stopall
        guest_power_node: example-node

    # Survey forms send blank strings for the optional values left empty.
    - name: Accept a node-wide request whose blank guest values are unset
      ansible.builtin.include_role:
        name: guest_power
        tasks_from: preflight
      vars:
        guest_power_action: startall
        guest_power_node: example-node
        guest_power_vmid: ""
        guest_power_type: ""
        guest_power_vms: ""

    - name: Accept a guest request whose blank node and VM filter are unset
      ansible.builtin.include_role:
        name: guest_power
        tasks_from: preflight
      vars:
        guest_power_vmid: "900001"
        guest_power_type: qemu
        guest_power_action: reset
        guest_power_node: ""
        guest_power_vms: ""

    - name: Prove a node-wide request with a VMID is refused at the node gate
      block:
        - name: Run preflight with a node action and a VMID
          ansible.builtin.include_role:
            name: guest_power
            tasks_from: preflight
          vars:
            guest_power_action: startall
            guest_power_node: example-node
            guest_power_vmid: "900001"
            guest_power_type: qemu

        - name: Fail when the request unexpectedly passes
          ansible.builtin.fail:
            msg: "A node-wide request with a VMID unexpectedly passed preflight."
      rescue:
        - name: Assert the rejection came from the node value gate
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert the node action values are valid'

    - name: Prove a node-wide request for an unknown node is refused at the node gate
      block:
        - name: Run preflight with an uninventoried node
          ansible.builtin.include_role:
            name: guest_power
            tasks_from: preflight
          vars:
            guest_power_action: stopall
            guest_power_node: not-in-inventory

        - name: Fail when the request unexpectedly passes
          ansible.builtin.fail:
            msg: "A node-wide request for an unknown node unexpectedly passed preflight."
      rescue:
        - name: Assert the rejection came from the node value gate
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert the node action values are valid'

    - name: Prove a node-wide request without a node is refused at the node gate
      block:
        - name: Run preflight with no node
          ansible.builtin.include_role:
            name: guest_power
            tasks_from: preflight
          vars:
            guest_power_action: startall

        - name: Fail when the request unexpectedly passes
          ansible.builtin.fail:
            msg: "A node-wide request without a node unexpectedly passed preflight."
      rescue:
        - name: Assert the rejection came from the node value gate
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert the node action values are valid'

    - name: Prove a node-wide VM filter that is not a comma list of VMIDs is refused
      block:
        - name: Run preflight with a malformed VM filter
          ansible.builtin.include_role:
            name: guest_power
            tasks_from: preflight
          vars:
            guest_power_action: startall
            guest_power_node: example-node
            guest_power_vms: "900001,abc"

        - name: Fail when the request unexpectedly passes
          ansible.builtin.fail:
            msg: "A malformed node-wide VM filter unexpectedly passed preflight."
      rescue:
        - name: Assert the rejection came from the node value gate
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert the node action values are valid'

    - name: Prove a guest request with a node is refused at the value gate
      block:
        - name: Run preflight with a guest action and a node
          ansible.builtin.include_role:
            name: guest_power
            tasks_from: preflight
          vars:
            guest_power_vmid: "900001"
            guest_power_type: qemu
            guest_power_action: reset
            guest_power_node: example-node

        - name: Fail when the request unexpectedly passes
          ansible.builtin.fail:
            msg: "A guest request carrying a node unexpectedly passed preflight."
      rescue:
        - name: Assert the rejection came from the guest value gate
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert the target values are valid'

    - name: Prove invalid requests fail closed at the value gate
      ansible.builtin.include_tasks: guest_power_contract_reject.yml
      loop:
        - {vmid: "12ab", type: qemu, action: reset}
        - {vmid: "42", type: qemu, action: reset}
        - {vmid: "900001", type: vm, action: reset}
        - {vmid: "900001", type: qemu, action: destroy}
        - {vmid: "900001", type: lxc, action: reset}
      loop_control:
        loop_var: guest_power_case
        label: "{{ guest_power_case }}"

    - name: Prove a missing target fails closed at the presence gate
      block:
        - name: Run preflight with no target
          ansible.builtin.include_role:
            name: guest_power
            tasks_from: preflight

        - name: Fail when the unscoped run unexpectedly passes
          ansible.builtin.fail:
            msg: "An unscoped guest_power run unexpectedly passed preflight."
      rescue:
        - name: Assert the rejection came from the presence gate
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert the target variables are supplied'

    - name: Prove placement parsing skips nodes that did not answer
      ansible.builtin.include_tasks: guest_power_parse_case.yml
      loop:
        - name: empty stdout then a valid answer
          results:
            - {rc: 0, stdout: ""}
            - {rc: 0, stdout: '[{"vmid": 900001, "node": "example-node"}]'}
          want: 1
        - name: non-JSON then unreachable then a valid answer
          results:
            - {rc: 0, stdout: "Shared connection closed."}
            - {unreachable: true, msg: "Host key verification failed."}
            - {rc: 0, stdout: '[{"vmid": 900001, "node": "example-node"}]'}
          want: 1
        - name: non-zero exit then a valid answer
          results:
            - {rc: 255, stdout: '[{"vmid": 1}]'}
            - {rc: 0, stdout: '[{"vmid": 900001, "node": "example-node"}]'}
          want: 1
        - name: no node answers
          results:
            - {rc: 0, stdout: ""}
            - {rc: 0, stdout: "  "}
          want: 0
      loop_control:
        loop_var: guest_power_case
        label: "{{ guest_power_case.name }}"
