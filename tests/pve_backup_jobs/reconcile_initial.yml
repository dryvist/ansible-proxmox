---
pve_backup_jobs_fixture_state:
  - id: fixture-convert
    type: vzdump
    vmid: "4242,4243"
    exclude: "4244"
    storage: fixture-backup-store
    schedule: "02:30"
    enabled: "0"
    mode: snapshot
    compress: zstd
    comment: ""
    prune-backups: {keep-daily: "7", keep-weekly: "4"}
  - id: fixture-insync
    type: vzdump
    pool: fixture-pool-c
    all: "0"
    storage: fixture-backup-store
    schedule: "04:30"
    enabled: "0"
    exclude: "4244"
    mode: snapshot
    compress: zstd
    pbs-change-detection-mode: metadata
    comment: ""
    prune-backups: {keep-daily: 3}
  - id: fixture-cdm-change
    type: vzdump
    pool: fixture-pool-c
    all: "0"
    storage: fixture-backup-store
    schedule: "04:30"
    enabled: "0"
    exclude: "4244"
    mode: snapshot
    compress: zstd
    pbs-change-detection-mode: metadata
    comment: ""
    prune-backups: {keep-daily: 3}
  - id: fixture-cdm-insync
    type: vzdump
    pool: fixture-pool-c
    all: "0"
    storage: fixture-backup-store
    schedule: "04:30"
    enabled: "0"
    exclude: "4244"
    mode: snapshot
    compress: zstd
    pbs-change-detection-mode: data
    comment: ""
    prune-backups: {keep-daily: 3}
  - id: fixture-mode-change
    type: vzdump
    pool: fixture-pool-f
    all: "0"
    storage: fixture-backup-store
    schedule: "04:45"
    enabled: "0"
    exclude: "4244"
    mode: snapshot
    compress: zstd
    pbs-change-detection-mode: metadata
    comment: ""
    prune-backups: {keep-daily: 3}
  - id: fixture-orphan
    type: vzdump
    pool: fixture-pool-gone
    storage: fixture-backup-store
    schedule: "05:30"
    enabled: 0
    mode: snapshot
    compress: zstd
    comment: ""
    prune-backups: {keep-last: "1"}
  - id: fixture-unpin
    type: vzdump
    pool: fixture-pool-d
    node: fixture-node-a
    storage: fixture-backup-store
    schedule: "06:30"
    enabled: 0
    mode: snapshot
    compress: zstd
    comment: ""
    prune-backups: {keep-daily: "7", keep-weekly: "4"}
