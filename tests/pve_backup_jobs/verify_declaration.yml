---
# Pin the pve_backup_jobs declaration guard without a live cluster: run the SAME
# validate.yml the role imports, against fixtures that model both the shape this
# role exists to enforce and the shapes it must refuse.
# Run: ansible-playbook tests/pve_backup_jobs/verify_declaration.yml -i localhost,
#
# The refusals are the point. A guard that is present but never exercised is
# indistinguishable from one that does not fire, and a guest-id list slipping
# past it reintroduces exactly the failure the role was written to remove.
- name: Verify the pve_backup_jobs declaration guard
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    pve_backup_jobs_storage_id: fixture-backup-store
    pve_backup_jobs_pbs_server: fixture-pbs-server
    pve_backup_jobs_pbs_node: fixture-backup-node
    pve_backup_jobs_storage_nodes: [fixture-node-a, fixture-node-b]
    pve_backup_jobs_default_prune: keep-all=1
    # Stands in for the guest map load_tofu publishes on localhost.
    pve_backup_jobs_tofu_guest_map:
      fixture-splunk:
        vmid: 4244
      fixture-pbs:
        vmid: 4242
        fqdn: fixture-pbs-server

  tasks:
    # Both supported selections must pass, or every refusal below proves
    # nothing — a guard that rejects everything is not a guard.
    - name: Accept a pool-scoped declaration
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: validate.yml
      vars:
        pve_backup_jobs_jobs:
          - id: fixture-platform-daily
            pool: fixture-pool
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"
            enabled: false

    - name: Accept an all-node declaration
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: validate.yml
      vars:
        pve_backup_jobs_jobs:
          - id: fixture-all-node
            all: true
            node: fixture-node-b
            storage: fixture-backup-store
            schedule: "02:30"
            enabled: false

    - name: Accept a desired-state name exclusion
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: validate.yml
      vars:
        pve_backup_jobs_jobs:
          - id: fixture-named-exclusion
            all: true
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"
            exclude_names: [fixture-splunk]

    - name: Accept a tag exclusion on an all-node declaration
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: validate.yml
      vars:
        pve_backup_jobs_jobs:
          - id: fixture-tagged-exclusion
            all: true
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"
            exclude_tags: [media]

    - name: Accept a declared change detection mode
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: validate.yml
      vars:
        pve_backup_jobs_jobs:
          - id: fixture-change-detection
            pool: fixture-pool
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"
            pbs_change_detection_mode: data

    - name: Accept a backup-node job that excludes the PBS guest
      # The backup node may run a job when the PBS guest itself is excluded by
      # name; the guard resolves the guest by its published fqdn.
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: validate.yml
      vars:
        pve_backup_jobs_jobs:
          - id: fixture-backup-node-excluded
            all: true
            node: fixture-backup-node
            storage: fixture-backup-store
            schedule: "02:30"
            exclude_names: [fixture-pbs]

    - name: Refuse a declaration carrying a guest-id list
      block:
        - name: Run the guard against a guest-id declaration
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_jobs:
              - id: fixture-by-vmid
                pool: fixture-pool
                node: fixture-node-a
                storage: fixture-backup-store
                schedule: "02:30"
                vmid: "4242,4243"

        - name: Fail because the guest-id declaration was accepted
          ansible.builtin.fail:
            msg: >-
              A declaration carrying a vmid list was ACCEPTED. Guest-id
              selection is what lets a job keep running against a recycled id.
      rescue:
        - name: Record the guest-id refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['vmid'] }}"

    - name: Refuse an exclusion name missing from desired state
      block:
        - name: Run the guard against an unknown guest name
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_jobs:
              - id: fixture-unknown-exclusion
                pool: fixture-pool
                node: fixture-node-a
                storage: fixture-backup-store
                schedule: "02:30"
                exclude_names: [missing-guest]

        - name: Fail because an unknown guest name was accepted
          ansible.builtin.fail:
            msg: "An exclusion name missing from tofu_data was ACCEPTED."
      rescue:
        - name: Record the unknown-name refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['exclude-name'] }}"

    - name: Refuse a declaration that sets both selection modes
      block:
        - name: Run the guard against a declaration with pool and all
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_jobs:
              - id: fixture-both-selections
                pool: fixture-pool
                all: true
                node: fixture-node-a
                storage: fixture-backup-store
                schedule: "02:30"

        - name: Fail because both selection modes were accepted
          ansible.builtin.fail:
            msg: "A declaration setting pool and all was ACCEPTED; PVE forbids both together."
      rescue:
        - name: Record the both-selection refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['both'] }}"

    - name: Refuse a declaration with neither selection mode
      block:
        - name: Run the guard against a declaration with no pool or all
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_jobs:
              - id: fixture-neither-selection
                node: fixture-node-a
                storage: fixture-backup-store
                schedule: "02:30"

        - name: Fail because neither selection mode was accepted
          ansible.builtin.fail:
            msg: "A declaration with neither pool nor all was ACCEPTED; it would protect nothing."
      rescue:
        - name: Record the neither-selection refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['neither'] }}"

    - name: Refuse two jobs sharing one id
      block:
        - name: Run the guard against duplicate ids
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_jobs:
              - id: fixture-dup
                pool: fixture-pool-a
                node: fixture-node-a
                storage: fixture-backup-store
                schedule: "02:30"
              - id: fixture-dup
                pool: fixture-pool-b
                node: fixture-node-b
                storage: fixture-backup-store
                schedule: "03:30"

        - name: Fail because duplicate ids were accepted
          ansible.builtin.fail:
            msg: "Duplicate job ids were ACCEPTED; one of the two intents would vanish silently."
      rescue:
        - name: Record the duplicate-id refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['duplicate'] }}"

    - name: Refuse jobs declared with no PBS server
      block:
        - name: Run the guard with no PBS server declared
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_pbs_server: ""
            pve_backup_jobs_jobs:
              - id: fixture-no-store
                pool: fixture-pool
                node: fixture-node-a
                storage: fixture-backup-store
                schedule: "02:30"

        - name: Fail because a job with no ensured storage was accepted
          ansible.builtin.fail:
            msg: "Jobs were ACCEPTED with no PBS server declared; they would fail hours after converge."
      rescue:
        - name: Record the missing-storage refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['storage'] }}"

    - name: Refuse a job that names no node
      block:
        - name: Run the guard against a node-less declaration
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_jobs:
              - id: fixture-no-node
                pool: fixture-pool
                storage: fixture-backup-store
                schedule: "02:30"

        - name: Fail because a node-less job was accepted
          ansible.builtin.fail:
            msg: "A job with no node was ACCEPTED; it would also back up guests on the backup node."
      rescue:
        - name: Record the missing-node refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['node'] }}"

    - name: Refuse a job that names a node list
      block:
        - name: Run the guard against a node-list declaration
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_jobs:
              - id: fixture-node-list
                pool: fixture-pool
                node: "fixture-node-a,fixture-node-b"
                storage: fixture-backup-store
                schedule: "02:30"

        - name: Fail because a node list was accepted
          ansible.builtin.fail:
            msg: "A node list was ACCEPTED; vzdump matches one node name, so the job would run nowhere."
      rescue:
        - name: Record the node-list refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['node-list'] }}"

    - name: Refuse a job that runs on the backup node
      block:
        - name: Run the guard against a backup-node declaration
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_jobs:
              - id: fixture-on-backup-node
                pool: fixture-pool
                node: fixture-backup-node
                storage: fixture-backup-store
                schedule: "02:30"

        - name: Fail because a job on the backup node was accepted
          ansible.builtin.fail:
            msg: "A job on the backup node was ACCEPTED; its guests would back up onto themselves."
      rescue:
        - name: Record the backup-node refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['backup-node'] }}"

    - name: Refuse a change detection mode PVE does not accept
      block:
        - name: Run the guard against an unknown change detection mode
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_jobs:
              - id: fixture-bad-mode
                pool: fixture-pool
                node: fixture-node-a
                storage: fixture-backup-store
                schedule: "02:30"
                pbs_change_detection_mode: faster

        - name: Fail because an unknown change detection mode was accepted
          ansible.builtin.fail:
            msg: "A pbs_change_detection_mode outside legacy, data and metadata was ACCEPTED."
      rescue:
        - name: Record the change detection refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['change-detection'] }}"

    - name: Refuse a backup-node job that does not exclude the PBS guest
      block:
        - name: Run the guard against a backup-node job with no exclusion
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_jobs:
              - id: fixture-backup-node-unexcluded
                all: true
                node: fixture-backup-node
                storage: fixture-backup-store
                schedule: "02:30"

        - name: Fail because an unexcluded backup-node job was accepted
          ansible.builtin.fail:
            msg: "A job on the backup node without the PBS guest excluded was ACCEPTED."
      rescue:
        - name: Record the backup-node exclusion refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['pbs-node'] }}"

    # Counting the refusals is what makes this test unable to pass vacuously: if
    # a rescue never ran, the list is short and this fails.
    - name: Refuse a tag exclusion combined with names
      block:
        - name: Run the guard against names and exclude_tags
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_jobs:
              - id: fixture-names-and-tags
                names: [fixture-splunk]
                exclude_tags: [media]
                node: fixture-node-a
                storage: fixture-backup-store
                schedule: "02:30"

        - name: Fail because names and exclude_tags were both accepted
          ansible.builtin.fail:
            msg: "A declaration with names and exclude_tags was ACCEPTED."
      rescue:
        - name: Record the names-and-tags refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['names-tags'] }}"

    - name: Refuse a tag exclusion that is a bare string
      block:
        - name: Run the guard against a string exclude_tags
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_jobs:
              - id: fixture-string-tag
                all: true
                node: fixture-node-a
                storage: fixture-backup-store
                schedule: "02:30"
                exclude_tags: media

        - name: Fail because a bare string exclude_tags was accepted
          ansible.builtin.fail:
            msg: "A bare string exclude_tags was ACCEPTED."
      rescue:
        - name: Record the tag-shape refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['tags-shape'] }}"

    - name: Assert every refusal actually fired
      ansible.builtin.assert:
        that:
          - (pve_backup_jobs_refusals | default([]) | sort)
            == ['backup-node', 'both', 'change-detection', 'duplicate', 'exclude-name', 'names-tags', 'neither', 'node', 'node-list', 'pbs-node', 'storage', 'tags-shape', 'vmid']
        fail_msg: >-
          Expected thirteen refusals (vmid, exclude-name, names-tags, tags-shape,
          change-detection, both, neither, duplicate, storage, node, node-list,
          backup-node, pbs-node); got {{ pve_backup_jobs_refusals | default([]) | sort }}.
        success_msg: "PASS: all thirteen declaration refusals fired"
        quiet: false
