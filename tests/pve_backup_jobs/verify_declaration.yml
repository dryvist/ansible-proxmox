---
# Validate declaration fixtures with the role task file.
- name: Verify the pve_backup_jobs declaration guard
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    pve_backup_jobs_storage_id: fixture-backup-store
    pve_backup_jobs_pbs_server: fixture-pbs-server
    pve_backup_jobs_pbs_node: fixture-backup-node
    pve_backup_jobs_storage_nodes: [fixture-node-a, fixture-node-b]
    pve_backup_jobs_default_prune: keep-all=1
    pve_backup_jobs_tofu_guest_map:
      fixture-splunk:
        vmid: 4244
      fixture-pbs:
        vmid: 4242
        fqdn: fixture-pbs-server

  tasks:
    - name: Accept a pool-scoped declaration
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: validate.yml
      vars:
        pve_backup_jobs_jobs:
          - id: fixture-platform-daily
            pool: fixture-pool
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"
            enabled: false

    - name: Accept an all-node declaration
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: validate.yml
      vars:
        pve_backup_jobs_jobs:
          - id: fixture-all-node
            all: true
            node: fixture-node-b
            storage: fixture-backup-store
            schedule: "02:30"
            enabled: false

    - name: Accept a desired-state name exclusion
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: validate.yml
      vars:
        pve_backup_jobs_jobs:
          - id: fixture-named-exclusion
            all: true
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"
            exclude_names: [fixture-splunk]

    - name: Accept a tag exclusion on an all-node declaration
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: validate.yml
      vars:
        pve_backup_jobs_jobs:
          - id: fixture-tagged-exclusion
            all: true
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"
            exclude_tags: [media]

    - name: Accept a declared change detection mode
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: validate.yml
      vars:
        pve_backup_jobs_jobs:
          - id: fixture-change-detection
            pool: fixture-pool
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"
            pbs_change_detection_mode: data

    - name: Accept a declaration on the backup node with its guest excluded
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: validate.yml
      vars:
        pve_backup_jobs_jobs:
          - id: fixture-backup-node-excluded
            all: true
            node: fixture-backup-node
            storage: fixture-backup-store
            schedule: "02:30"
            exclude_names: [fixture-pbs]

    - name: Refuse a guest-id declaration
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: vmid
        pve_backup_jobs_refusal_expected_error: Raw vmid lists are forbidden
        pve_backup_jobs_refusal_jobs:
          - id: fixture-by-vmid
            pool: fixture-pool
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"
            vmid: "4242,4243"

    - name: Refuse an unknown exclusion name
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: exclude-name
        pve_backup_jobs_refusal_expected_error: fixture-unknown-exclusion
        pve_backup_jobs_refusal_jobs:
          - id: fixture-unknown-exclusion
            pool: fixture-pool
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"
            exclude_names: [missing-guest]

    - name: Refuse a declaration with both selection modes
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: both
        pve_backup_jobs_refusal_expected_error: fixture-both-selections
        pve_backup_jobs_refusal_jobs:
          - id: fixture-both-selections
            pool: fixture-pool
            all: true
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"

    - name: Refuse a declaration with neither selection mode
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: neither
        pve_backup_jobs_refusal_expected_error: fixture-neither-selection
        pve_backup_jobs_refusal_jobs:
          - id: fixture-neither-selection
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"

    - name: Refuse duplicate declaration ids
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: duplicate
        pve_backup_jobs_refusal_expected_error: Duplicate backup job id
        pve_backup_jobs_refusal_jobs:
          - id: fixture-duplicate
            pool: fixture-pool-a
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"
          - id: fixture-duplicate
            pool: fixture-pool-b
            node: fixture-node-b
            storage: fixture-backup-store
            schedule: "03:30"

    - name: Refuse declarations without a PBS server
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: storage
        pve_backup_jobs_refusal_expected_error: PBS target is not fully declared
        pve_backup_jobs_refusal_pbs_server: ""
        pve_backup_jobs_refusal_jobs:
          - id: fixture-no-store
            pool: fixture-pool
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"

    - name: Refuse declarations without a node
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: node
        pve_backup_jobs_refusal_expected_error: fixture-no-node
        pve_backup_jobs_refusal_jobs:
          - id: fixture-no-node
            pool: fixture-pool
            storage: fixture-backup-store
            schedule: "02:30"

    - name: Refuse declarations with a node list
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: node-list
        pve_backup_jobs_refusal_expected_error: fixture-node-list
        pve_backup_jobs_refusal_jobs:
          - id: fixture-node-list
            pool: fixture-pool
            node: "fixture-node-a,fixture-node-b"
            storage: fixture-backup-store
            schedule: "02:30"

    - name: Refuse a job on the backup node
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: backup-node
        pve_backup_jobs_refusal_expected_error: fixture-on-backup-node
        pve_backup_jobs_refusal_jobs:
          - id: fixture-on-backup-node
            pool: fixture-pool
            node: fixture-backup-node
            storage: fixture-backup-store
            schedule: "02:30"

    - name: Refuse an unsupported change detection mode
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: change-detection
        pve_backup_jobs_refusal_expected_error: fixture-bad-mode
        pve_backup_jobs_refusal_jobs:
          - id: fixture-bad-mode
            pool: fixture-pool
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"
            pbs_change_detection_mode: faster

    - name: Refuse an unsupported default change detection mode
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: default-change-detection
        pve_backup_jobs_refusal_expected_error: role default
        pve_backup_jobs_refusal_default_mode: faster
        pve_backup_jobs_refusal_jobs: []

    - name: Refuse a backup-node job without its guest excluded
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: pbs-node
        pve_backup_jobs_refusal_expected_error: fixture-backup-node-unexcluded
        pve_backup_jobs_refusal_jobs:
          - id: fixture-backup-node-unexcluded
            all: true
            node: fixture-backup-node
            storage: fixture-backup-store
            schedule: "02:30"

    - name: Refuse names combined with tag exclusions
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: names-tags
        pve_backup_jobs_refusal_expected_error: fixture-names-and-tags
        pve_backup_jobs_refusal_jobs:
          - id: fixture-names-and-tags
            names: [fixture-splunk]
            exclude_tags: [media]
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"

    - name: Refuse a bare string tag exclusion
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: tags-shape
        pve_backup_jobs_refusal_expected_error: fixture-string-tag
        pve_backup_jobs_refusal_jobs:
          - id: fixture-string-tag
            all: true
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"
            exclude_tags: media

    - name: Assert every declaration refusal was recorded
      ansible.builtin.assert:
        that:
          - >-
            (pve_backup_jobs_refusals | default([]) | sort)
            == [
              'backup-node', 'both', 'change-detection',
              'default-change-detection', 'duplicate', 'exclude-name',
              'names-tags', 'neither', 'node', 'node-list', 'pbs-node',
              'storage', 'tags-shape', 'vmid'
            ]
        fail_msg: "Unexpected declaration refusals: {{ pve_backup_jobs_refusals | default([]) | sort }}"
        success_msg: "PASS: all fourteen declaration refusals fired"
        quiet: false
