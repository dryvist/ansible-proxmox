---
# Verify reconcile command construction with a fixture command stub.
- name: Verify the pve_backup_jobs reconcile command construction
  hosts: localhost
  become: false
  gather_facts: false
  environment:
    PATH: "/tmp/pve-backup-jobs-fixture:{{ ansible_env.PATH | default('/usr/bin:/bin') }}"
  vars_files:
    - reconcile_common.yml
    - reconcile_initial.yml
    - reconcile_after_create.yml

  tasks:
    - name: Prepare fixture command state
      ansible.builtin.include_tasks: reconcile_setup.yml

    - name: Run reconcile against the fixture
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: reconcile.yml

    - name: Read the recorded command lines
      ansible.builtin.slurp:
        src: "{{ pve_backup_jobs_stub_dir }}/commands.log"
      register: pve_backup_jobs_command_log

    - name: Assert the expected create, update, and delete commands
      ansible.builtin.assert:
        that:
          - "'set /cluster/backup/fixture-convert' in pve_backup_jobs_commands"
          - "'--pool fixture-pool' in pve_backup_jobs_commands"
          - "'--delete vmid' in pve_backup_jobs_commands"
          - "'--delete vmid,exclude' in pve_backup_jobs_commands"
          - "'set /cluster/backup/fixture-unpin' in pve_backup_jobs_commands"
          - "'--delete node' in pve_backup_jobs_commands"
          - "'--node fixture-node-b' in pve_backup_jobs_commands"
          - "'--exclude 4244' in pve_backup_jobs_new_create"
          - "'create /cluster/backup --id fixture-new' in pve_backup_jobs_commands"
          - "'--all 1' in pve_backup_jobs_all_create"
          - "'--pool' not in pve_backup_jobs_all_create"
          - "'--node fixture-node-all' in pve_backup_jobs_all_create"
          - "'--pbs-change-detection-mode metadata' in pve_backup_jobs_all_create"
          - "'create /cluster/backup --id fixture-cdm' in pve_backup_jobs_commands"
          - "'--pbs-change-detection-mode data' in pve_backup_jobs_cdm_create"
          - "(pve_backup_jobs_commands | regex_findall('set /cluster/backup/fixture-cdm-change') | length) == 1"
          - "'--pbs-change-detection-mode data' in pve_backup_jobs_cdm_change"
          - "'fixture-cdm-insync' not in pve_backup_jobs_commands"
          - "'--mode stop' in pve_backup_jobs_mode_change"
          - "'fixture-mode-change' in pve_backup_jobs_commands"
          - "'--enabled 1' not in pve_backup_jobs_commands"
          - "'fixture-insync' not in pve_backup_jobs_commands"
          - "'delete /cluster/backup/fixture-orphan' in pve_backup_jobs_commands"
          - "(pve_backup_jobs_commands | regex_findall('delete /cluster/backup/') | length) == 1"
        fail_msg: |
          Reconcile issued unexpected commands.
          {{ pve_backup_jobs_commands }}
        success_msg: "PASS: reconcile applies the declared job set"
        quiet: false
      vars:
        pve_backup_jobs_commands: "{{ pve_backup_jobs_command_log.content | b64decode }}"
        pve_backup_jobs_new_create: >-
          {{ pve_backup_jobs_commands.splitlines()
             | select('search', 'create /cluster/backup --id fixture-new')
             | first | default('') }}
        pve_backup_jobs_all_create: >-
          {{ pve_backup_jobs_commands.splitlines()
             | select('search', 'create /cluster/backup --id fixture-all')
             | first | default('') }}
        pve_backup_jobs_cdm_create: >-
          {{ pve_backup_jobs_commands.splitlines()
             | select('search', 'create /cluster/backup --id fixture-cdm')
             | first | default('') }}
        pve_backup_jobs_cdm_change: >-
          {{ pve_backup_jobs_commands.splitlines()
             | select('search', 'set /cluster/backup/fixture-cdm-change')
             | first | default('') }}
        pve_backup_jobs_mode_change: >-
          {{ pve_backup_jobs_commands.splitlines()
             | select('search', 'set /cluster/backup/fixture-mode-change')
             | first | default('') }}

    - name: Write the fixture state after the first reconcile
      ansible.builtin.copy:
        content: "{{ pve_backup_jobs_fixture_state_after_create | to_json }}"
        dest: "{{ pve_backup_jobs_stub_dir }}/state.json"
        mode: "0644"

    - name: Reset the command log
      ansible.builtin.copy:
        content: ""
        dest: "{{ pve_backup_jobs_stub_dir }}/commands.log"
        mode: "0644"

    - name: Verify the second reconcile
      ansible.builtin.include_tasks: reconcile_idempotence.yml

    - name: Remove the fixture directory
      ansible.builtin.file:
        path: "{{ pve_backup_jobs_stub_dir }}"
        state: absent
