---
# Pin the pve_backup_jobs reconcile without a live cluster: `pvesh` is replaced
# by a stub that serves a fixture job set and records every command line it is
# handed, then the role's own reconcile.yml is run against it.
# Run: ansible-playbook tests/pve_backup_jobs/verify_reconcile.yml -i localhost, -c local
#
# These command lines otherwise execute for the first time on a live cluster, so
# a rendering error surfaces during a converge that is already touching backup
# configuration. The fixture covers selector cleanup, an all-node job created
# with `all 1`, and a second converge after the created job is read back in sync.
- name: Verify the pve_backup_jobs reconcile command construction
  hosts: localhost
  become: false
  gather_facts: false
  # Play-level so the stub is ahead of any real pvesh for every task here.
  # Nothing in this play may reach a cluster.
  environment:
    PATH: "/tmp/pve-backup-jobs-fixture:{{ ansible_env.PATH | default('/usr/bin:/bin') }}"
  vars:
    pve_backup_jobs_stub_dir: /tmp/pve-backup-jobs-fixture
    pve_backup_jobs_default_mode: snapshot
    pve_backup_jobs_default_compress: zstd
    pve_backup_jobs_default_prune: keep-daily=7,keep-weekly=4
    pve_backup_jobs_prune_unmanaged: true
    pve_backup_jobs_jobs:
      # Exists, but selects a guest id — the conversion case.
      - id: fixture-convert
        pool: fixture-pool
        storage: fixture-backup-store
        schedule: "02:30"
        enabled: false
      # Does not exist yet — the pool create case, with a node pin.
      - id: fixture-new
        pool: fixture-pool-b
        node: fixture-node-b
        storage: fixture-backup-store
        schedule: "03:30"
        enabled: false
      # Exists and already matches — must produce no command at all, or the
      # role churns the cluster on every converge.
      - id: fixture-insync
        pool: fixture-pool-c
        storage: fixture-backup-store
        schedule: "04:30"
        enabled: false
        prune: keep-daily=3
      # Exists with a node pin the declaration no longer carries — the clear case.
      - id: fixture-unpin
        pool: fixture-pool-d
        storage: fixture-backup-store
        schedule: "06:30"
        enabled: false
      # Does not exist yet — create every guest on one node without a pool.
      - id: fixture-all
        all: true
        node: fixture-node-all
        storage: fixture-backup-store
        schedule: "05:45"
        enabled: false
    # Serves as `pvesh get /cluster/backup`. `fixture-orphan` models the job
    # left behind after the node it named left the cluster.
    pve_backup_jobs_fixture_state:
      - id: fixture-convert
        type: vzdump
        vmid: "4242,4243"
        storage: fixture-backup-store
        schedule: "02:30"
        enabled: 0
        mode: snapshot
        compress: zstd
        comment: ""
        prune-backups: {keep-daily: "7", keep-weekly: "4"}
      - id: fixture-insync
        type: vzdump
        pool: fixture-pool-c
        storage: fixture-backup-store
        schedule: "04:30"
        enabled: 0
        mode: snapshot
        compress: zstd
        comment: ""
        prune-backups: {keep-daily: "3"}
      - id: fixture-orphan
        type: vzdump
        pool: fixture-pool-gone
        storage: fixture-backup-store
        schedule: "05:30"
        enabled: 0
        mode: snapshot
        compress: zstd
        comment: ""
        prune-backups: {keep-last: "1"}
      - id: fixture-unpin
        type: vzdump
        pool: fixture-pool-d
        node: fixture-node-a
        storage: fixture-backup-store
        schedule: "06:30"
        enabled: 0
        mode: snapshot
        compress: zstd
        comment: ""
        prune-backups: {keep-daily: "7", keep-weekly: "4"}
    # The state after the first converge: selector jobs are reconciled and the
    # undeclared orphan has been removed.
    pve_backup_jobs_fixture_state_after_create:
      - id: fixture-convert
        type: vzdump
        pool: fixture-pool
        storage: fixture-backup-store
        schedule: "02:30"
        enabled: 0
        mode: snapshot
        compress: zstd
        comment: ""
        prune-backups: {keep-daily: "7", keep-weekly: "4"}
      - id: fixture-new
        type: vzdump
        pool: fixture-pool-b
        node: fixture-node-b
        storage: fixture-backup-store
        schedule: "03:30"
        enabled: 0
        mode: snapshot
        compress: zstd
        comment: ""
        prune-backups: {keep-daily: "7", keep-weekly: "4"}
      - id: fixture-insync
        type: vzdump
        pool: fixture-pool-c
        storage: fixture-backup-store
        schedule: "04:30"
        enabled: 0
        mode: snapshot
        compress: zstd
        comment: ""
        prune-backups: {keep-daily: "3"}
      - id: fixture-unpin
        type: vzdump
        pool: fixture-pool-d
        storage: fixture-backup-store
        schedule: "06:30"
        enabled: 0
        mode: snapshot
        compress: zstd
        comment: ""
        prune-backups: {keep-daily: "7", keep-weekly: "4"}
      - id: fixture-all
        type: vzdump
        all: 1
        node: fixture-node-all
        storage: fixture-backup-store
        schedule: "05:45"
        enabled: 0
        mode: snapshot
        compress: zstd
        comment: ""
        prune-backups: {keep-daily: "7", keep-weekly: "4"}

  tasks:
    - name: Create the stub directory
      ansible.builtin.file:
        path: "{{ pve_backup_jobs_stub_dir }}"
        state: directory
        mode: "0755"

    - name: Write the fixture job set the stub serves
      ansible.builtin.copy:
        content: "{{ pve_backup_jobs_fixture_state | to_json }}"
        dest: "{{ pve_backup_jobs_stub_dir }}/state.json"
        mode: "0644"

    - name: Reset the recorded command log
      ansible.builtin.copy:
        content: ""
        dest: "{{ pve_backup_jobs_stub_dir }}/commands.log"
        mode: "0644"

    - name: Install the pvesh stub
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          # Serves the fixture on `get`, records everything else verbatim.
          printf '%s\n' "$*" >> {{ pve_backup_jobs_stub_dir }}/commands.log
          [ "$1" = get ] && cat {{ pve_backup_jobs_stub_dir }}/state.json
          exit 0
        dest: "{{ pve_backup_jobs_stub_dir }}/pvesh"
        mode: "0755"

    - name: Run the role's own reconcile against the stub
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: reconcile.yml

    - name: Read back the recorded command lines
      ansible.builtin.slurp:
        src: "{{ pve_backup_jobs_stub_dir }}/commands.log"
      register: pve_backup_jobs_command_log

    - name: Assert the reconcile issued exactly the intended commands
      ansible.builtin.assert:
        that:
          # A stale guest-id list is explicitly removed when the pool selector
          # is applied.
          - "'set /cluster/backup/fixture-convert' in pve_backup_jobs_commands"
          - "'--pool fixture-pool' in pve_backup_jobs_commands"
          - "'--delete vmid' in pve_backup_jobs_commands"
          # A node pin the declaration dropped is cleared, not kept; a declared
          # node is passed as one name on create.
          - "'set /cluster/backup/fixture-unpin' in pve_backup_jobs_commands"
          - "'--delete node' in pve_backup_jobs_commands"
          - "'--node fixture-node-b' in pve_backup_jobs_commands"
          # The create: carries an explicit id so the job is addressable by the
          # declaration afterwards rather than by a generated UUID.
          - "'create /cluster/backup --id fixture-new' in pve_backup_jobs_commands"
          # All-node selection is created with --all 1 and no pool selector.
          - "'--all 1' in pve_backup_jobs_all_create"
          - "'--pool' not in pve_backup_jobs_all_create"
          - "'--node fixture-node-all' in pve_backup_jobs_all_create"
          # Jobs ship disabled; a first full run is a deliberate act.
          - "'--enabled 1' not in pve_backup_jobs_commands"
          # The already-correct job must not be touched.
          - "'fixture-insync' not in pve_backup_jobs_commands"
          # The job left behind is removed, not left reading as coverage.
          - "'delete /cluster/backup/fixture-orphan' in pve_backup_jobs_commands"
          # And nothing else was removed.
          - "(pve_backup_jobs_commands | regex_findall('delete /cluster/backup/') | length) == 1"
        fail_msg: |
          Reconcile issued the wrong commands.
          {{ pve_backup_jobs_commands }}
        success_msg: "PASS: reconcile creates the all-node job with no pool and prunes orphans"
        quiet: false
      vars:
        pve_backup_jobs_commands: "{{ pve_backup_jobs_command_log.content | b64decode }}"
        pve_backup_jobs_all_create: >-
          {{ pve_backup_jobs_commands.splitlines()
             | select('search', 'create /cluster/backup --id fixture-all')
             | first | default('') }}

    - name: Write back the jobs created by the first converge
      ansible.builtin.copy:
        content: "{{ pve_backup_jobs_fixture_state_after_create | to_json }}"
        dest: "{{ pve_backup_jobs_stub_dir }}/state.json"
        mode: "0644"

    - name: Reset the recorded command log for the second converge
      ansible.builtin.copy:
        content: ""
        dest: "{{ pve_backup_jobs_stub_dir }}/commands.log"
        mode: "0644"

    - name: Run a second reconcile after reading back the created all-node job
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: reconcile.yml

    - name: Read back the second converge command lines
      ansible.builtin.slurp:
        src: "{{ pve_backup_jobs_stub_dir }}/commands.log"
      register: pve_backup_jobs_second_command_log

    - name: Assert the all-node job is in sync on the second converge
      ansible.builtin.assert:
        that:
          - pve_backup_jobs_second_commands | trim == 'get /cluster/backup --output-format json'
        fail_msg: >-
          Second converge should only read the current jobs, got:
          {{ pve_backup_jobs_second_commands }}
        success_msg: "PASS: all-node job is in sync after creation"
        quiet: false
      vars:
        pve_backup_jobs_second_commands: "{{ pve_backup_jobs_second_command_log.content | b64decode }}"

    - name: Remove the stub directory
      ansible.builtin.file:
        path: "{{ pve_backup_jobs_stub_dir }}"
        state: absent
