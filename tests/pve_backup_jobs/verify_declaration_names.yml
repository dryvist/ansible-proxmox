---
# Pin the names-based declaration guard against the role's own validate.yml.
# Run: ansible-playbook tests/pve_backup_jobs/verify_declaration_names.yml -i localhost, -c local
- name: Verify pve_backup_jobs names declaration guard
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    pve_backup_jobs_storage_id: fixture-backup-store
    pve_backup_jobs_pbs_server: fixture-pbs-server
    pve_backup_jobs_pbs_node: fixture-backup-node
    pve_backup_jobs_storage_nodes: [fixture-node-a, fixture-node-b]
    pve_backup_jobs_default_prune: keep-all=1
    pve_backup_jobs_tofu_guest_map:
      fixture-splunk:
        vmid: 4244
      fixture-app-1:
        vmid: 4241
      fixture-app-2:
        vmid: 4242

  tasks:
    - name: Accept a guest selected by desired-state name
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: validate.yml
      vars:
        pve_backup_jobs_jobs:
          - id: fixture-named-guest
            names: [fixture-app-1, fixture-app-2]
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"

    - name: Refuse a declaration that combines names and pool
      block:
        - name: Run the guard against names and pool
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_jobs:
              - id: fixture-names-and-pool
                pool: fixture-pool
                names: [fixture-app-1]
                node: fixture-node-a
                storage: fixture-backup-store
                schedule: "02:30"

        - name: Fail because names and pool were both accepted
          ansible.builtin.fail:
            msg: "A declaration with names and pool was ACCEPTED."
      rescue:
        - name: Record the names-and-pool refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['names-pool'] }}"

    - name: Refuse a declaration that combines names and exclude_names
      block:
        - name: Run the guard against names and exclude_names
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_jobs:
              - id: fixture-names-and-exclusion
                names: [fixture-app-1]
                exclude_names: [fixture-splunk]
                node: fixture-node-a
                storage: fixture-backup-store
                schedule: "02:30"

        - name: Fail because names and exclude_names were both accepted
          ansible.builtin.fail:
            msg: "A declaration with names and exclude_names was ACCEPTED."
      rescue:
        - name: Record the names-and-exclusion refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['names-exclude'] }}"

    - name: Refuse an empty names list
      block:
        - name: Run the guard against empty names
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_jobs:
              - id: fixture-empty-names
                names: []
                node: fixture-node-a
                storage: fixture-backup-store
                schedule: "02:30"

        - name: Fail because empty names were accepted
          ansible.builtin.fail:
            msg: "An empty names list was ACCEPTED."
      rescue:
        - name: Record the empty-names refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['empty-names'] }}"

    - name: Refuse an unknown selected guest name
      block:
        - name: Run the guard against an unknown selected guest
          ansible.builtin.include_role:
            name: pve_backup_jobs
            tasks_from: validate.yml
          vars:
            pve_backup_jobs_jobs:
              - id: fixture-unknown-guest
                names: [fixture-missing-guest]
                node: fixture-node-a
                storage: fixture-backup-store
                schedule: "02:30"

        - name: Fail because an unknown selected guest name was accepted
          ansible.builtin.fail:
            msg: "A selected guest name fixture-missing-guest missing from tofu_data was ACCEPTED."
      rescue:
        - name: Record the unknown-name refusal
          ansible.builtin.set_fact:
            pve_backup_jobs_refusals: "{{ pve_backup_jobs_refusals | default([]) + ['guest-name'] }}"

    - name: Assert every refusal actually fired
      ansible.builtin.assert:
        that:
          - (pve_backup_jobs_refusals | default([]) | sort)
            == ['empty-names', 'guest-name', 'names-exclude', 'names-pool']
        fail_msg: >-
          Expected four names refusals (names-pool, names-exclude, empty-names,
          guest-name); got {{ pve_backup_jobs_refusals | default([]) | sort }}.
        success_msg: "PASS: all four names declaration refusals fired"
        quiet: false
