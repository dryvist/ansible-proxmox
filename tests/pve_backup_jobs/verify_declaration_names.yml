---
# Verify names declarations with fixtures and the role validation task file.
- name: Verify pve_backup_jobs names declaration guard
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    pve_backup_jobs_storage_id: fixture-backup-store
    pve_backup_jobs_pbs_server: fixture-pbs-server
    pve_backup_jobs_pbs_node: fixture-backup-node
    pve_backup_jobs_storage_nodes: [fixture-node-a, fixture-node-b]
    pve_backup_jobs_default_prune: keep-all=1
    pve_backup_jobs_tofu_guest_map:
      fixture-splunk:
        vmid: 4244
      fixture-app-1:
        vmid: 4241
      fixture-app-2:
        vmid: 4242

  tasks:
    - name: Accept a guest selected by desired-state name
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: validate.yml
      vars:
        pve_backup_jobs_jobs:
          - id: fixture-named-guest
            names: [fixture-app-1, fixture-app-2]
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"

    - name: Refuse names combined with a pool
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: names-pool
        pve_backup_jobs_refusal_expected_error: fixture-names-and-pool
        pve_backup_jobs_refusal_jobs:
          - id: fixture-names-and-pool
            pool: fixture-pool
            names: [fixture-app-1]
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"

    - name: Refuse names combined with exclusions
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: names-exclude
        pve_backup_jobs_refusal_expected_error: fixture-names-and-exclusion
        pve_backup_jobs_refusal_jobs:
          - id: fixture-names-and-exclusion
            names: [fixture-app-1]
            exclude_names: [fixture-splunk]
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"

    - name: Refuse an empty names list
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: empty-names
        pve_backup_jobs_refusal_expected_error: fixture-empty-names
        pve_backup_jobs_refusal_jobs:
          - id: fixture-empty-names
            names: []
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"

    - name: Refuse an unknown selected guest name
      ansible.builtin.include_tasks: assert_declaration_refusal.yml
      vars:
        pve_backup_jobs_refusal_id: guest-name
        pve_backup_jobs_refusal_expected_error: fixture-unknown-guest
        pve_backup_jobs_refusal_jobs:
          - id: fixture-unknown-guest
            names: [fixture-missing-guest]
            node: fixture-node-a
            storage: fixture-backup-store
            schedule: "02:30"

    - name: Assert every names refusal was recorded
      ansible.builtin.assert:
        that:
          - (pve_backup_jobs_refusals | default([]) | sort)
            == ['empty-names', 'guest-name', 'names-exclude', 'names-pool']
        fail_msg: "Unexpected names refusals: {{ pve_backup_jobs_refusals | default([]) | sort }}"
        success_msg: "PASS: all four names declaration refusals fired"
        quiet: false
