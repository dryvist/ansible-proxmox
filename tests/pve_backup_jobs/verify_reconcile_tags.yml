---
# Pin the exclude_tags reconcile without a live cluster: the pvesh stub serves
# the fixture jobs and records command lines from the role's own reconcile.yml.
# The guest map is NOT stubbed. tofu_data is supplied and the role's own
# pve_backup_jobs_tofu_guest_map formula builds it, so this also proves guest
# tags survive that combine.
# Run: ansible-playbook tests/pve_backup_jobs/verify_reconcile_tags.yml -i localhost, -c local
- name: Verify pve_backup_jobs tag exclusion reconcile command construction
  hosts: localhost
  become: false
  gather_facts: false
  # Play-level so the stub is ahead of any real pvesh for every task here.
  environment:
    PATH: "/tmp/pve-backup-jobs-tags-fixture:{{ ansible_env.PATH | default('/usr/bin:/bin') }}"
  vars:
    pve_backup_jobs_stub_dir: /tmp/pve-backup-jobs-tags-fixture
    pve_backup_jobs_default_mode: snapshot
    pve_backup_jobs_default_compress: zstd
    pve_backup_jobs_default_pbs_change_detection_mode: metadata
    pve_backup_jobs_default_prune: keep-all=1
    pve_backup_jobs_prune_unmanaged: true
    pve_backup_jobs_tags_tofu_fixture:
      containers:
        fixture-media-app:
          vmid: 4301
          tags: [container, media]
        fixture-media-named:
          vmid: 4302
          tags: [media]
        fixture-media-lookalike:
          vmid: 4303
          tags: [shared-media-data]
        fixture-plain-app:
          vmid: 4304
          tags: []
        fixture-skip-named:
          vmid: 4305
          tags: [sandbox]
      vms:
        fixture-media-vm:
          vmid: 4306
          tags: [media]
        fixture-plain-vm:
          vmid: 4307
    pve_backup_jobs_jobs:
      # Exists, but its exclusion predates the tag. The tag-resolved guest must
      # be added, and the guest that is both named and tagged must appear once.
      - id: fixture-tags-union
        all: true
        node: fixture-node-a
        storage: fixture-backup-store
        schedule: "06:00"
        enabled: false
        exclude_names: [fixture-skip-named, fixture-media-named]
        exclude_tags: [media]
      # Does not exist yet. The tag alone selects the exclusions.
      - id: fixture-tags-only
        all: true
        node: fixture-node-b
        storage: fixture-backup-store
        schedule: "06:10"
        enabled: false
        exclude_tags: [media]
      # Exists and already matches. It carries no exclude_tags, so it must not
      # be touched.
      - id: fixture-no-tags
        all: true
        node: fixture-node-c
        storage: fixture-backup-store
        schedule: "06:20"
        enabled: false
        exclude_names: [fixture-skip-named]
      # Does not exist yet and excludes nothing. No --exclude argument at all.
      - id: fixture-no-exclusions
        all: true
        node: fixture-node-d
        storage: fixture-backup-store
        schedule: "06:30"
        enabled: false
    # Serves as `pvesh get /cluster/backup`. Only the first converge reads it.
    pve_backup_jobs_fixture_state:
      - id: fixture-tags-union
        type: vzdump
        all: 1
        node: fixture-node-a
        storage: fixture-backup-store
        schedule: "06:00"
        enabled: "0"
        exclude: "4302,4305"
        mode: snapshot
        compress: zstd
        pbs-change-detection-mode: metadata
        comment: ""
        prune-backups: { keep-all: "1" }
      - id: fixture-no-tags
        type: vzdump
        all: 1
        node: fixture-node-c
        storage: fixture-backup-store
        schedule: "06:20"
        enabled: "0"
        exclude: "4305"
        mode: snapshot
        compress: zstd
        pbs-change-detection-mode: metadata
        comment: ""
        prune-backups: { keep-all: "1" }
    # The state after the first converge: the union is applied to the existing
    # job and the two new jobs are created. The untouched job is unchanged.
    pve_backup_jobs_fixture_state_after_create:
      - id: fixture-tags-union
        type: vzdump
        all: 1
        node: fixture-node-a
        storage: fixture-backup-store
        schedule: "06:00"
        enabled: 0
        exclude: "4301,4302,4305,4306"
        mode: snapshot
        compress: zstd
        pbs-change-detection-mode: metadata
        comment: ""
        prune-backups: { keep-all: "1" }
      - id: fixture-tags-only
        type: vzdump
        all: 1
        node: fixture-node-b
        storage: fixture-backup-store
        schedule: "06:10"
        enabled: 0
        exclude: "4301,4302,4306"
        mode: snapshot
        compress: zstd
        pbs-change-detection-mode: metadata
        comment: ""
        prune-backups: { keep-all: "1" }
      - id: fixture-no-tags
        type: vzdump
        all: 1
        node: fixture-node-c
        storage: fixture-backup-store
        schedule: "06:20"
        enabled: 0
        exclude: "4305"
        mode: snapshot
        compress: zstd
        pbs-change-detection-mode: metadata
        comment: ""
        prune-backups: { keep-all: "1" }
      - id: fixture-no-exclusions
        type: vzdump
        all: 1
        node: fixture-node-d
        storage: fixture-backup-store
        schedule: "06:30"
        enabled: 0
        mode: snapshot
        compress: zstd
        pbs-change-detection-mode: metadata
        comment: ""
        prune-backups: { keep-all: "1" }

  tasks:
    # load_tofu publishes tofu_data as a host fact on localhost. The role's
    # default guest-map formula reads it through hostvars, which carries host
    # facts but not play vars, so the fixture is published the same way.
    - name: Publish the fixture inventory as tofu_data on localhost
      ansible.builtin.set_fact:
        tofu_data: "{{ pve_backup_jobs_tags_tofu_fixture }}"

    - name: Create the stub directory
      ansible.builtin.file:
        path: "{{ pve_backup_jobs_stub_dir }}"
        state: directory
        mode: "0755"

    - name: Write the fixture job set the stub serves
      ansible.builtin.copy:
        content: "{{ pve_backup_jobs_fixture_state | to_json }}"
        dest: "{{ pve_backup_jobs_stub_dir }}/state.json"
        mode: "0644"

    - name: Reset the recorded command log
      ansible.builtin.copy:
        content: ""
        dest: "{{ pve_backup_jobs_stub_dir }}/commands.log"
        mode: "0644"

    - name: Install the pvesh stub
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          # Serves the fixture on `get`, records everything else verbatim.
          printf '%s\n' "$*" >> {{ pve_backup_jobs_stub_dir }}/commands.log
          [ "$1" = get ] && cat {{ pve_backup_jobs_stub_dir }}/state.json
          exit 0
        dest: "{{ pve_backup_jobs_stub_dir }}/pvesh"
        mode: "0755"

    - name: Run the role's own reconcile against the stub
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: reconcile.yml

    - name: Read back the recorded command lines
      ansible.builtin.slurp:
        src: "{{ pve_backup_jobs_stub_dir }}/commands.log"
      register: pve_backup_jobs_command_log

    - name: Assert tag exclusions reach the reconcile command lines
      ansible.builtin.assert:
        that:
          # A media-tagged guest absent from exclude_names is excluded. The
          # guest that is both named and tagged appears once in the union.
          - "'set /cluster/backup/fixture-tags-union' in pve_backup_jobs_commands"
          - "'--exclude 4301,4302,4305,4306' in pve_backup_jobs_union_set"
          - "'--exclude 4301,4302,4306' in pve_backup_jobs_tags_create"
          # A job with no exclude_tags and no exclusions gets no --exclude.
          - "'--exclude' not in pve_backup_jobs_plain_create"
          # The job that already matches is not touched.
          - "'fixture-no-tags' not in pve_backup_jobs_commands"
          # Exact tag match: shared-media-data does not match media. Untagged
          # guests (container and VM) are not excluded.
          - "'4303' not in pve_backup_jobs_commands"
          - "'4304' not in pve_backup_jobs_commands"
          - "'4307' not in pve_backup_jobs_commands"
          # Nothing was removed.
          - "'delete /cluster/backup' not in pve_backup_jobs_commands"
        fail_msg: |
          Tag exclusions were not reconciled as intended.
          {{ pve_backup_jobs_commands }}
        success_msg: "PASS: tag exclusions merge with name exclusions and match tags exactly"
        quiet: false
      vars:
        pve_backup_jobs_commands: "{{ pve_backup_jobs_command_log.content | b64decode }}"
        pve_backup_jobs_union_set: >-
          {{ pve_backup_jobs_commands.splitlines()
             | select('search', 'set /cluster/backup/fixture-tags-union')
             | first | default('') }}
        pve_backup_jobs_tags_create: >-
          {{ pve_backup_jobs_commands.splitlines()
             | select('search', 'create /cluster/backup --id fixture-tags-only')
             | first | default('') }}
        pve_backup_jobs_plain_create: >-
          {{ pve_backup_jobs_commands.splitlines()
             | select('search', 'create /cluster/backup --id fixture-no-exclusions')
             | first | default('') }}

    - name: Write back the jobs created by the first converge
      ansible.builtin.copy:
        content: "{{ pve_backup_jobs_fixture_state_after_create | to_json }}"
        dest: "{{ pve_backup_jobs_stub_dir }}/state.json"
        mode: "0644"

    - name: Reset the recorded command log for the second converge
      ansible.builtin.copy:
        content: ""
        dest: "{{ pve_backup_jobs_stub_dir }}/commands.log"
        mode: "0644"

    - name: Run a second reconcile after reading back the tag-excluded jobs
      ansible.builtin.include_role:
        name: pve_backup_jobs
        tasks_from: reconcile.yml

    - name: Read back the second converge command lines
      ansible.builtin.slurp:
        src: "{{ pve_backup_jobs_stub_dir }}/commands.log"
      register: pve_backup_jobs_second_command_log

    - name: Assert the tag-excluded jobs are in sync on the second converge
      ansible.builtin.assert:
        that:
          - pve_backup_jobs_second_commands | trim == 'get /cluster/backup --output-format json'
        fail_msg: >-
          Second converge should only read the current jobs, got:
          {{ pve_backup_jobs_second_commands }}
        success_msg: "PASS: tag-excluded jobs are in sync after reconcile"
        quiet: false
      vars:
        pve_backup_jobs_second_commands: "{{ pve_backup_jobs_second_command_log.content | b64decode }}"

    - name: Remove the stub directory
      ansible.builtin.file:
        path: "{{ pve_backup_jobs_stub_dir }}"
        state: absent
