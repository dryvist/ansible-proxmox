---
- name: Verify the pve_node_exporter packaged collectors unit contract
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    pve_node_exporter_version: "1.12.1"
    pve_node_exporter_user: node-exporter
    pve_node_exporter_listen_address: fixture
    pve_node_exporter_port: 9100
    pve_node_exporter_textfile_collector_enabled: true
    pve_node_exporter_textfile_collector_dir: /var/lib/node_exporter/textfile_collector
    pve_node_exporter_packaged_collectors_enabled: false
    pve_node_exporter_packaged_collectors_dir: /var/lib/prometheus/node-exporter
    pve_node_exporter_extra_args: []
    pve_node_exporter_test_template_path: >-
      {{ playbook_dir }}/../../roles/pve_node_exporter/templates/node_exporter.service.j2
    pve_node_exporter_test_tasks_path: >-
      {{ playbook_dir }}/../../roles/pve_node_exporter/tasks/packaged_collectors.yml
    pve_node_exporter_test_zfs_template_path: >-
      {{ playbook_dir }}/../../roles/pve_node_exporter/templates/zfs_exporter.service.j2
    pve_node_exporter_test_zfs_tasks_path: >-
      {{ playbook_dir }}/../../roles/pve_node_exporter/tasks/zfs_exporter.yml
    pve_node_exporter_test_zfs_properties:
      - available
      - quota
      - referenced
      - refquota
      - used
      - usedbysnapshots

  tasks:
    - name: Render the unit with packaged collectors enabled
      ansible.builtin.set_fact:
        pve_node_exporter_test_enabled_unit: >-
          {{ lookup('ansible.builtin.template', pve_node_exporter_test_template_path) }}
      vars:
        pve_node_exporter_packaged_collectors_enabled: true

    - name: Render the unit with packaged collectors disabled
      ansible.builtin.set_fact:
        pve_node_exporter_test_disabled_unit: >-
          {{ lookup('ansible.builtin.template', pve_node_exporter_test_template_path) }}
      vars:
        pve_node_exporter_packaged_collectors_enabled: false

    - name: Assert the unit includes both textfile collector directories when enabled
      ansible.builtin.assert:
        that:
          - >-
            '--collector.textfile.directory=/var/lib/node_exporter/textfile_collector'
            in pve_node_exporter_test_enabled_unit
          - "'--collector.textfile.directory=/var/lib/prometheus/node-exporter' in pve_node_exporter_test_enabled_unit"
          - >-
            (pve_node_exporter_test_enabled_unit
            | regex_findall('--collector.textfile.directory=')) | length == 2
        quiet: true

    - name: Assert the unit includes only the original directory when disabled
      ansible.builtin.assert:
        that:
          - >-
            '--collector.textfile.directory=/var/lib/node_exporter/textfile_collector'
            in pve_node_exporter_test_disabled_unit
          - >-
            '--collector.textfile.directory=/var/lib/prometheus/node-exporter'
            not in pve_node_exporter_test_disabled_unit
          - >-
            (pve_node_exporter_test_disabled_unit
            | regex_findall('--collector.textfile.directory=')) | length == 1
        quiet: true

    - name: Load the node_exporter role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/pve_node_exporter/defaults/main.yml"

    - name: Read the packaged collector task file
      ansible.builtin.set_fact:
        pve_node_exporter_packaged_collectors_task_source: >-
          {{ lookup('ansible.builtin.file', pve_node_exporter_test_tasks_path) }}

    - name: Assert the packaged collector task loops over the three default timers
      ansible.builtin.assert:
        that:
          - pve_node_exporter_packaged_collectors_timers | length == 3
          - >-
            pve_node_exporter_packaged_collectors_timers
            == [
            'prometheus-node-exporter-smartmon.timer',
            'prometheus-node-exporter-nvme.timer',
            'prometheus-node-exporter-ipmitool-sensor.timer'
            ]
          - "'ansible.builtin.systemd:' in pve_node_exporter_packaged_collectors_task_source"
          - "'loop:' in pve_node_exporter_packaged_collectors_task_source"
          - "'pve_node_exporter_packaged_collectors_timers' in pve_node_exporter_packaged_collectors_task_source"
        quiet: true

    - name: Render the zfs_exporter unit from the role defaults
      ansible.builtin.set_fact:
        pve_node_exporter_test_zfs_unit: >-
          {{ lookup('ansible.builtin.template', pve_node_exporter_test_zfs_template_path) }}
      vars:
        ansible_default_ipv4:
          address: fixture

    - name: Render the zfs_exporter unit with another declared port
      ansible.builtin.set_fact:
        pve_node_exporter_test_zfs_unit_other_port: >-
          {{ lookup('ansible.builtin.template', pve_node_exporter_test_zfs_template_path,
          template_vars={'pve_node_exporter_zfs_exporter_port': 19134}) }}
      vars:
        ansible_default_ipv4:
          address: fixture

    - name: Assert the zfs_exporter unit runs the pinned release on its own declared port
      ansible.builtin.assert:
        that:
          - pve_node_exporter_zfs_exporter_enabled | bool
          - pve_node_exporter_zfs_exporter_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
          - >-
            ('Description=Prometheus zfs_exporter (v' ~ pve_node_exporter_zfs_exporter_version ~ ')')
            in pve_node_exporter_test_zfs_unit
          - "'ExecStart=/usr/local/bin/zfs_exporter ' in pve_node_exporter_test_zfs_unit"
          - "'User=node-exporter' in pve_node_exporter_test_zfs_unit"
          - pve_node_exporter_zfs_exporter_port == 9134
          - pve_node_exporter_zfs_exporter_port != pve_node_exporter_port
          - >-
            (pve_node_exporter_test_zfs_unit | regex_findall('--web[.]listen-address=[^ ]+'))
            == ['--web.listen-address=fixture:9134']
          - >-
            (pve_node_exporter_test_zfs_unit_other_port | regex_findall('--web[.]listen-address=[^ ]+'))
            == ['--web.listen-address=fixture:19134']
        quiet: true

    - name: Assert the zfs_exporter unit collects only the per-dataset usage properties
      ansible.builtin.assert:
        that:
          - >-
            (pve_node_exporter_zfs_exporter_filesystem_properties | sort)
            == (pve_node_exporter_test_zfs_properties | sort)
          - >-
            (pve_node_exporter_zfs_exporter_volume_properties | sort)
            == (pve_node_exporter_test_zfs_properties | sort)
          - >-
            (pve_node_exporter_test_zfs_unit | regex_findall('--collector[.]([a-z-]+)') | sort)
            == ['dataset-filesystem', 'dataset-volume']
          - >-
            (pve_node_exporter_test_zfs_unit | regex_findall('--no-collector[.]([a-z-]+)') | sort)
            == ['dataset-snapshot', 'pool']
          - >-
            (pve_node_exporter_test_zfs_unit | regex_findall('--properties[.]([a-z-]+)=') | sort)
            == ['dataset-filesystem', 'dataset-volume']
          - >-
            (pve_node_exporter_test_zfs_unit
            | regex_findall('--properties[.]dataset-filesystem=([a-z,]+)')
            | join(',') | split(',') | sort)
            == (pve_node_exporter_test_zfs_properties | sort)
          - >-
            (pve_node_exporter_test_zfs_unit
            | regex_findall('--properties[.]dataset-volume=([a-z,]+)')
            | join(',') | split(',') | sort)
            == (pve_node_exporter_test_zfs_properties | sort)
        quiet: true

    - name: Render the zfs_exporter download pin for amd64
      ansible.builtin.set_fact:
        pve_node_exporter_test_zfs_url_amd64: "{{ pve_node_exporter_zfs_exporter_download_url }}"
        pve_node_exporter_test_zfs_checksum_amd64: "{{ pve_node_exporter_zfs_exporter_checksum }}"
      vars:
        ansible_architecture: x86_64

    - name: Render the zfs_exporter download pin for arm64
      ansible.builtin.set_fact:
        pve_node_exporter_test_zfs_url_arm64: "{{ pve_node_exporter_zfs_exporter_download_url }}"
        pve_node_exporter_test_zfs_checksum_arm64: "{{ pve_node_exporter_zfs_exporter_checksum }}"
      vars:
        ansible_architecture: aarch64

    - name: Select the zfs_exporter download task
      ansible.builtin.set_fact:
        pve_node_exporter_test_zfs_download: >-
          {{ (lookup('ansible.builtin.file', pve_node_exporter_test_zfs_tasks_path)
          | from_yaml | select('contains', 'ansible.builtin.get_url')
          | first)['ansible.builtin.get_url'] }}

    - name: Assert the pinned zfs_exporter tarball checksum is always verified
      ansible.builtin.assert:
        that:
          - >-
            pve_node_exporter_test_zfs_url_amd64
            == ('https://github.com/pdf/zfs_exporter/releases/download/v'
            ~ pve_node_exporter_zfs_exporter_version ~ '/zfs_exporter-'
            ~ pve_node_exporter_zfs_exporter_version ~ '.linux-amd64.tar.gz')
          - >-
            pve_node_exporter_test_zfs_url_arm64
            == ('https://github.com/pdf/zfs_exporter/releases/download/v'
            ~ pve_node_exporter_zfs_exporter_version ~ '/zfs_exporter-'
            ~ pve_node_exporter_zfs_exporter_version ~ '.linux-arm64.tar.gz')
          - pve_node_exporter_test_zfs_checksum_amd64 is match('^sha256:[0-9a-f]{64}$')
          - pve_node_exporter_test_zfs_checksum_arm64 is match('^sha256:[0-9a-f]{64}$')
          - pve_node_exporter_test_zfs_checksum_amd64 != pve_node_exporter_test_zfs_checksum_arm64
          - "'pve_node_exporter_zfs_exporter_download_url' in pve_node_exporter_test_zfs_download.url"
          - "'pve_node_exporter_zfs_exporter_checksum' in pve_node_exporter_test_zfs_download.checksum"
          - "'omit' not in pve_node_exporter_test_zfs_download.checksum"
          - "'default' not in pve_node_exporter_test_zfs_download.checksum"
        quiet: true
