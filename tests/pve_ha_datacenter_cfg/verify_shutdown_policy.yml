# ---------------------------------------------------------------------------
# The HA shutdown policy is set through pvesh (mocked here), not by editing
# datacenter.cfg. This pins: the legacy top-level datacenter.cfg key is
# removed, `pvesh set` is called when the cluster's current policy differs,
# any other key already in the `ha` property survives, and a second pass
# against an already-correct policy calls `pvesh set` no further.
#
# Runs the role's OWN tasks/datacenter_cfg.yml against a mock pvesh binary and
# a temp datacenter.cfg, so it cannot pass against a stale copy of the logic.
# ---------------------------------------------------------------------------
---
- name: Verify pve_ha shutdown-policy reconciliation via pvesh
  hosts: localhost
  become: false
  gather_facts: false

  vars:
    pve_ha_datacenter_cfg_path: /tmp/pve_ha_datacenter_cfg_test/datacenter.cfg
    pve_ha_pvesh_bin: "{{ playbook_dir }}/mock-pvesh"
    pve_ha_shutdown_policy: freeze
    pve_ha_mock_state: /tmp/pve_ha_datacenter_cfg_test/cluster_options.json
    pve_ha_mock_log: /tmp/pve_ha_datacenter_cfg_test/pvesh_set.log

  environment:
    PVESH_MOCK_STATE: "{{ pve_ha_mock_state }}"
    PVESH_MOCK_LOG: "{{ pve_ha_mock_log }}"

  tasks:
    - name: Create the temporary directory
      ansible.builtin.file:
        path: "{{ pve_ha_datacenter_cfg_path | dirname }}"
        state: directory
        mode: "0755"

    - name: Create a datacenter.cfg carrying only unmanaged keys plus the invalid legacy key
      ansible.builtin.copy:
        dest: "{{ pve_ha_datacenter_cfg_path }}"
        content: |
          keyboard: en-us
          migration: secure
          shutdown_policy: freeze
        mode: "0640"

    - name: Seed cluster options with another ha key and no shutdown_policy yet
      ansible.builtin.copy:
        dest: "{{ pve_ha_mock_state }}"
        content: '{"keyboard": "en-us", "ha": {"some_other_key": "1"}}'
        mode: "0644"

    - name: Reset the mock invocation log
      ansible.builtin.copy:
        dest: "{{ pve_ha_mock_log }}"
        content: ""
        mode: "0644"

    - name: Reconcile the shutdown policy
      ansible.builtin.include_role:
        name: pve_ha
        tasks_from: datacenter_cfg.yml

    - name: Read the datacenter.cfg file
      ansible.builtin.slurp:
        src: "{{ pve_ha_datacenter_cfg_path }}"
      register: pve_ha_merged_cfg

    - name: Read the mock cluster options after the first pass
      ansible.builtin.slurp:
        src: "{{ pve_ha_mock_state }}"
      register: pve_ha_options_after_first

    - name: Read the mock invocation log after the first pass
      ansible.builtin.slurp:
        src: "{{ pve_ha_mock_log }}"
      register: pve_ha_log_after_first

    - name: Assert the legacy key is gone, pvesh set was called, and the other ha key survived
      ansible.builtin.assert:
        that:
          - "'keyboard: en-us' in (pve_ha_merged_cfg.content | b64decode)"
          - >-
            (pve_ha_merged_cfg.content | b64decode).splitlines()
            | select('match', '^[ \t]*shutdown_policy[ \t]*:') | list | length == 0
          - (pve_ha_options_after_first.content | b64decode | from_json).ha.shutdown_policy == 'freeze'
          - (pve_ha_options_after_first.content | b64decode | from_json).ha.some_other_key == '1'
          - "'set shutdown_policy=freeze' in (pve_ha_log_after_first.content | b64decode)"
        fail_msg: >-
          The merge left the invalid top-level key in place, did not set the
          policy via pvesh, or dropped another key already in ha.

    - name: Reconcile again against an already-correct policy
      ansible.builtin.include_role:
        name: pve_ha
        tasks_from: datacenter_cfg.yml

    - name: Read the mock invocation log after the idempotent pass
      ansible.builtin.slurp:
        src: "{{ pve_ha_mock_log }}"
      register: pve_ha_log_after_idempotent

    - name: Assert a second pass with no drift calls pvesh set no further
      ansible.builtin.assert:
        that:
          - (pve_ha_log_after_idempotent.content | b64decode) == (pve_ha_log_after_first.content | b64decode)
        fail_msg: A converge against an already-correct policy should not call pvesh set again.

    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ pve_ha_datacenter_cfg_path | dirname }}"
        state: absent
