---
# Pin the pve_ha replication derivation without a live cluster or the S3
# inventory pipeline: feed synthetic containers_from_tofu/vms_from_tofu and
# INCLUDE the real roles/pve_ha/tasks/replication_scope.yml (rather than
# restating its expressions), so a drift in the role fails here instead of
# passing against a stale copy. The storage-preflight portion below (which
# needs live `pvesh` command output in the real role) stays a synthetic
# re-implementation, fed from fixtures shaped like real pvesh/tofu output.
# Run: ansible-playbook tests/pve_ha_replication/verify_replication_targets.yml -i localhost,
#
# The fixture is a code-path model, NOT a snapshot of live inventory, but it
# tracks reality where it matters: each guest's replication partner is its
# OWN declared `ha_replication_target` attribute (set alongside `node` in the
# tofu desired state) — postgres-apps and iac-platform each publish their
# own; nautobot/vikunja/shared-app happen to share one; missing-target-ct is
# present but publishes no attribute at all (a desired-state gap); missing-vm
# is absent from vms_from_tofu entirely.
- name: Verify pve_ha replication scope + node-affinity resolution
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    pve_ha_replication_jobnum: 0
    pve_ha_replication_affinity_rule: apps-replication-nodes
    pve_ha_replication_ct_hostnames:
      - postgres-apps         # present, node-c, target node-d
      - nautobot              # present, node-b, target node-a
      - vikunja               # present, node-a, target node-b
      - missing-target-ct     # present, node-c, NO ha_replication_target -> unsafe
      - shared-app            # present, node-a, target node-b, storage on ALL nodes
    pve_ha_replication_vm_names:
      - iac-platform          # present, node-b, target node-e
      - missing-vm            # absent from vms_from_tofu -> unsafe
    containers_from_tofu:
      postgres-apps: {ansible_pct_vmid: 602000, node: node-c, ha_replication_target: node-d}
      nautobot: {ansible_pct_vmid: 605000, node: node-b, ha_replication_target: node-a}
      vikunja: {ansible_pct_vmid: 605010, node: node-a, ha_replication_target: node-b}
      missing-target-ct: {ansible_pct_vmid: 699000, node: node-c}
      shared-app: {ansible_pct_vmid: 606000, node: node-a, ha_replication_target: node-b}
    vms_from_tofu:
      iac-platform:
        vmid: 110130
        node: node-b
        ha_replication_target: node-e
        disks:
          - {datastore: local-zfs, path: vm-110130-disk-0}
      # missing-vm deliberately absent.

    # Synthetic `pvesh get /storage` output. Mirrors the real incident: local-zfs
    # is only on node-a+node-c, NOT node-b — so vikunja's job (target node-b) and
    # iac-platform's job (target node-e) must be detected as broken (local-zfs
    # absent on node-e too). `bulk` models the "target HAS the storage" pass
    # case. `shared-nfs` has no `nodes` key at all (omitted, like
    # /etc/pve/storage.cfg having no `nodes` line) — must be treated as
    # available on every node.
    pve_ha_storage_cfg_fixture:
      - storage: local-zfs
        nodes: "node-a,node-c"
      - storage: bulk
        nodes: "node-a,node-b,node-d"
      - storage: shared-nfs
        # nodes key deliberately absent -> available on ALL nodes

    # Synthetic per-guest LXC config (what `pvesh get /nodes/<n>/lxc/<v>/config`
    # returns), keyed by hostname. postgres-apps' target (node-d) HAS bulk, so
    # it passes; missing-target-ct is unsafe and never reaches this check.
    pve_ha_guest_configs_fixture:
      vikunja:
        rootfs: "local-zfs:subvol-605010-disk-0,size=8G"
        mp0: "local-zfs:subvol-605010-disk-1,mp=/var/lib/vikunja,size=10G"
      nautobot:
        rootfs: "bulk:subvol-605000-disk-0,size=8G"
      shared-app:
        rootfs: "shared-nfs:subvol-606000-disk-0,size=8G"
      postgres-apps:
        rootfs: "bulk:subvol-602000-disk-0,size=8G"

  tasks:
    - name: Include the real replication-scope derivation
      ansible.builtin.include_tasks: ../../roles/pve_ha/tasks/replication_scope.yml

    - name: Assert every guest with a declared ha_replication_target resolved
      ansible.builtin.assert:
        that:
          - (pve_ha_replication_guests | selectattr('viable') | map(attribute='hostname') | sort)
            == ['iac-platform', 'nautobot', 'postgres-apps', 'shared-app', 'vikunja']
          - (pve_ha_replication_guests | selectattr('hostname', 'eq', 'vikunja') | first).target == 'node-b'
          - (pve_ha_replication_guests | selectattr('hostname', 'eq', 'nautobot') | first).target == 'node-a'
          - (pve_ha_replication_guests | selectattr('hostname', 'eq', 'postgres-apps') | first).target == 'node-d'
          - (pve_ha_replication_guests | selectattr('hostname', 'eq', 'postgres-apps') | first).pair == ['node-c', 'node-d']
          - (pve_ha_replication_guests | selectattr('hostname', 'eq', 'nautobot') | first).pair == ['node-b', 'node-a']
        fail_msg: >-
          pve_ha replication target derivation is wrong:
          {{ pve_ha_replication_guests }}
        success_msg: >-
          each guest's target comes from its OWN declared ha_replication_target
          attribute — postgres-apps and iac-platform each have theirs;
          nautobot/vikunja/shared-app happen to share the same partner but
          each still resolves from its own attribute, not a shared default.

    - name: Assert the VM resolves to a vm:<id> SID
      ansible.builtin.assert:
        that:
          - (pve_ha_replication_guests | selectattr('hostname', 'eq', 'iac-platform') | first).kind == 'vm'
          - (pve_ha_replication_guests | selectattr('hostname', 'eq', 'iac-platform') | first).sid == 'vm:110130'
          - (pve_ha_replication_guests | selectattr('hostname', 'eq', 'iac-platform') | first).target == 'node-e'
        fail_msg: >-
          VM SID resolution is wrong:
          {{ pve_ha_replication_guests | selectattr('hostname', 'eq', 'iac-platform') | list }}
        success_msg: "iac-platform (a VM) resolves to sid=vm:110130, target=node-e (its declared ha_replication_target)."

    - name: Assert unsafe singletons are exactly the target-less and absent guests
      ansible.builtin.assert:
        that:
          - (pve_ha_unsafe_singletons | sort) == ['missing-target-ct', 'missing-vm']
        fail_msg: >-
          unsafe-singleton selection is wrong: {{ pve_ha_unsafe_singletons }}
        success_msg: >-
          missing-target-ct (present, but no ha_replication_target attribute)
          and missing-vm (absent from vms_from_tofu) are both refused; every
          guest with a declared target is not.

    # --- rule-naming (mirrors affinity_rules.yml's "keep the live rule name
    # for whichever pair currently carries it" logic, since it reads from the
    # cluster rather than a hardcoded pair) ---
    - name: Group viable replication guests by their [node, target] pair
      ansible.builtin.set_fact:
        pve_ha_replication_pair_groups: >-
          {{ pve_ha_replication_guests | default([]) | selectattr('viable') | groupby('pair_key') }}

    - name: Fixture a live rule named apps-replication-nodes over node-a,node-b (nautobot/vikunja's pair)
      ansible.builtin.set_fact:
        pve_ha_rules_raw:
          stdout: '[{"rule": "apps-replication-nodes", "nodes": "node-a,node-b"}]'

    - name: Resolve the current node set of the legacy-named replication rule
      ansible.builtin.set_fact:
        pve_ha_legacy_replication_rule_pair_key: >-
          {{ ((pve_ha_rules_raw.stdout | from_json)
              | selectattr('rule', 'equalto', pve_ha_replication_affinity_rule) | list
              | map(attribute='nodes') | first | default('', true))
             | split(',') | reject('equalto', '') | sort | join(',') }}

    - name: Name each pair group's node-affinity rule
      ansible.builtin.set_fact:
        pve_ha_replication_rules: >-
          {{ pve_ha_replication_rules | default([]) + [ {
               'name': (pve_ha_replication_affinity_rule
                        if item.0 == pve_ha_legacy_replication_rule_pair_key
                        else pve_ha_replication_affinity_rule ~ '-' ~ (item.0 | regex_replace(',', '-'))),
               'nodes': item.1[0].pair,
               'sids': item.1 | map(attribute='sid') | list
             } ] }}
      loop: "{{ pve_ha_replication_pair_groups }}"
      loop_control:
        label: "{{ item.0 }}"

    - name: Assert the pair matching the live rule's nodes keeps that name; others get derived names
      ansible.builtin.assert:
        that:
          # nautobot+vikunja share pair node-a,node-b, which matches the live
          # rule's nodes -> keeps the name apps-replication-nodes
          - (pve_ha_replication_rules | selectattr('name', 'eq', pve_ha_replication_affinity_rule) | first).sids
            | sort == ['ct:605000', 'ct:605010', 'ct:606000']
          # postgres-apps' pair (node-c,node-d) does NOT match the live rule
          # -> gets its own derived name, never renaming the live rule
          - (pve_ha_replication_rules | rejectattr('name', 'eq', pve_ha_replication_affinity_rule)
             | selectattr('sids', 'contains', 'ct:602000') | list | length) == 1
          - (pve_ha_replication_rules | length) == 3
        fail_msg: >-
          rule naming is wrong: {{ pve_ha_replication_rules }}
        success_msg: >-
          the pair matching the live apps-replication-nodes rule's nodes
          (nautobot/vikunja/shared-app, all on node-a/node-b) keeps that
          name; postgres-apps (node-c/node-d) and iac-platform (node-b/node-e)
          each get their own derived rule name instead of renaming the live one.

    # --- pvesr target-storage validation (mirrors replication_jobs.yml, fed
    # from the pve_ha_storage_cfg_fixture / pve_ha_guest_configs_fixture vars
    # above instead of `pvesh get /storage` / `pvesh get .../lxc/<vmid>/config`) ---
    - name: Parse storage-to-nodes availability (empty list = all nodes)
      ansible.builtin.set_fact:
        pve_ha_storage_nodes: >-
          {{ pve_ha_storage_nodes | default({}) | combine({
               item.storage: (item.nodes | default('') | split(',')
                              | reject('equalto', '') | list)
             }) }}
      loop: "{{ pve_ha_storage_cfg_fixture }}"
      loop_control:
        label: "{{ item.storage }}"

    - name: Assert a storage with no `nodes` line resolves to "available everywhere"
      ansible.builtin.assert:
        that:
          - pve_ha_storage_nodes['shared-nfs'] == []
          - pve_ha_storage_nodes['local-zfs'] | sort == ['node-a', 'node-c']
        fail_msg: >-
          storage-to-nodes parsing is wrong: {{ pve_ha_storage_nodes }}
        success_msg: >-
          shared-nfs (no nodes line) resolves to [] (all nodes); local-zfs
          resolves to exactly its listed nodes.

    - name: Resolve each CONTAINER job's required storage ids from its volumes
      ansible.builtin.set_fact:
        pve_ha_replication_job_storages: >-
          {{ pve_ha_replication_job_storages | default([]) + [ {
               'hostname': item.hostname,
               'target': item.target,
               'storages': (pve_ha_guest_configs_fixture[item.hostname] | dict2items
                 | selectattr('key', 'match', '^(rootfs|mp[0-9]+)$')
                 | rejectattr('value', 'match', '^/')
                 | map(attribute='value')
                 | map('regex_replace', '^([^:]+):.*$', '\1')
                 | unique | list)
             } ] }}
      loop: "{{ pve_ha_replication_guests | selectattr('viable') | selectattr('kind', 'equalto', 'ct') | list }}"
      loop_control:
        label: "{{ item.hostname }}"

    - name: Resolve each VM job's required storage ids from its published disks
      ansible.builtin.set_fact:
        pve_ha_replication_job_storages: >-
          {{ pve_ha_replication_job_storages | default([]) + [ {
               'hostname': item.hostname,
               'target': item.target,
               'storages': (item.disks | default([]) | map(attribute='datastore') | unique | list)
             } ] }}
      loop: "{{ pve_ha_replication_guests | selectattr('viable') | selectattr('kind', 'equalto', 'vm') | list }}"
      loop_control:
        label: "{{ item.hostname }}"

    - name: Resolve which jobs have a target that lacks a required storage
      ansible.builtin.set_fact:
        pve_ha_replication_job_violations: >-
          {{ pve_ha_replication_job_violations | default([]) + (
               [ {'hostname': job.hostname, 'target': job.target, 'storage': storage} ]
               if (pve_ha_storage_nodes[storage] | default([]) | length > 0
                   and job.target not in pve_ha_storage_nodes[storage])
               else []
             ) }}
      loop: "{{ pve_ha_replication_job_storages | subelements('storages') }}"
      loop_control:
        loop_var: pair
        label: "{{ pair.0.hostname }} / {{ pair.1 }}"
      vars:
        job: "{{ pair.0 }}"
        storage: "{{ pair.1 }}"

    - name: Assert the target-storage check detects both broken jobs and passes the rest
      ansible.builtin.assert:
        that:
          # vikunja's target (node-b) lacks local-zfs -> DETECTED
          - (pve_ha_replication_job_violations
             | selectattr('hostname', 'eq', 'vikunja') | list | length) == 1
          - (pve_ha_replication_job_violations
             | selectattr('hostname', 'eq', 'vikunja') | first).storage == 'local-zfs'
          # iac-platform's target (node-e) lacks local-zfs -> DETECTED (VM disk path)
          - (pve_ha_replication_job_violations
             | selectattr('hostname', 'eq', 'iac-platform') | list | length) == 1
          - (pve_ha_replication_job_violations
             | selectattr('hostname', 'eq', 'iac-platform') | first).storage == 'local-zfs'
          # nautobot's target (node-a) HAS bulk -> passes, no violation
          - (pve_ha_replication_job_violations
             | selectattr('hostname', 'eq', 'nautobot') | list | length) == 0
          # postgres-apps' target (node-d) HAS bulk -> passes, no violation
          - (pve_ha_replication_job_violations
             | selectattr('hostname', 'eq', 'postgres-apps') | list | length) == 0
          # shared-app's storage has no nodes restriction -> available
          # everywhere, including its target (node-b) -> passes, no violation
          - (pve_ha_replication_job_violations
             | selectattr('hostname', 'eq', 'shared-app') | list | length) == 0
        fail_msg: >-
          pvesr target-storage validation is wrong: {{ pve_ha_replication_job_violations }}
        success_msg: >-
          target-storage validation detects vikunja's broken node-b target and
          iac-platform's broken node-e target (both missing local-zfs, the VM
          case sourced from published disks rather than a live config read),
          and passes nautobot/postgres-apps (bulk present) + shared-app (no
          nodes restriction = available everywhere).
