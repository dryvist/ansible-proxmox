---
# ---------------------------------------------------------------------------
# The HA class of every managed guest is DERIVED, not listed. This pins the
# derivation itself: who needs a relocation replica falls out of anti-affinity
# group membership plus the one explicit immovable declaration, so a guest
# added later is classified with no edit to any list.
#
# Runs through include_role so the ROLE's own defaults supply the expressions —
# a drift in the role fails here rather than passing against a restated copy.
# ---------------------------------------------------------------------------
- name: Verify pve_ha derives one class per guest
  hosts: localhost
  become: false
  gather_facts: false

  vars:
    pve_ha_anti_affinity_groups:
      - name: peers
        hostnames: [peer-a, peer-b]
    pve_ha_immovable_guests:
      bind-mounted: "bind mounts cannot replicate"
    pve_ha_ct_hostnames: [peer-a, peer-b, lone-app, bind-mounted]
    pve_ha_vm_names: [lone-vm]
    pve_ha_fail_on_unresolved: true

  tasks:
    - name: Derive classes for a mixed set
      ansible.builtin.include_role:
        name: pve_ha
        tasks_from: classification.yml
        public: true

    - name: Assert each guest lands in exactly one class
      ansible.builtin.assert:
        that:
          # Anti-affinity membership IS the application_ha assertion.
          - (pve_ha_class_application | sort) == ['peer-a', 'peer-b']
          - pve_ha_class_immovable == ['bind-mounted']
          # Singleton is the remainder, and singleton == needs a replica.
          - pve_ha_replication_ct_hostnames == ['lone-app']
          - pve_ha_replication_vm_names == ['lone-vm']
        fail_msg: >-
          class derivation wrong: application={{ pve_ha_class_application }},
          immovable={{ pve_ha_class_immovable }},
          replicated={{ pve_ha_replication_ct_hostnames }}
        success_msg: >-
          application_ha comes from the anti-affinity group, immovable from its
          declaration, and everything else defaults to singleton.

# The whole point of deriving rather than listing: nothing to forget. Same
# fixture with one extra guest and no other edit.
- name: Verify a guest added later is classified with no list edit
  hosts: localhost
  become: false
  gather_facts: false

  vars:
    pve_ha_anti_affinity_groups:
      - name: peers
        hostnames: [peer-a, peer-b]
    pve_ha_immovable_guests:
      bind-mounted: "bind mounts cannot replicate"
    pve_ha_ct_hostnames: [peer-a, peer-b, lone-app, bind-mounted, added-later]
    pve_ha_vm_names: []
    pve_ha_fail_on_unresolved: true

  tasks:
    - name: Derive classes for the widened set
      ansible.builtin.include_role:
        name: pve_ha
        tasks_from: classification.yml
        public: true

    - name: Assert the new guest inherits the singleton replica requirement
      ansible.builtin.assert:
        that:
          - "'added-later' in pve_ha_replication_ct_hostnames"
        fail_msg: >-
          a newly HA-managed guest did not derive as a singleton, so it would
          not be held to the replica requirement.
        success_msg: >-
          a new guest defaults to singleton and inherits the replica
          requirement with no list edit.

- name: Verify a contradictory immovable declaration is refused
  hosts: localhost
  become: false
  gather_facts: false

  vars:
    pve_ha_anti_affinity_groups:
      - name: peers
        hostnames: [peer-a, peer-b]
    pve_ha_ct_hostnames: [peer-a, peer-b]
    pve_ha_vm_names: []
    pve_ha_fail_on_unresolved: true

  tasks:
    - name: Assert immovable-and-peered is refused
      block:
        - name: Derive a contradictory declaration
          ansible.builtin.include_role:
            name: pve_ha
            tasks_from: classification.yml
          vars:
            pve_ha_immovable_guests:
              peer-a: "claims both"

        - name: Report that the contradiction was accepted
          ansible.builtin.fail:
            msg: >-
              a guest declared immovable while asserting a peer was accepted.
      rescue:
        - name: Confirm the contradiction was the reason
          ansible.builtin.assert:
            that:
              - "'different node-loss stories' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              failed for a different reason:
              {{ ansible_failed_result.msg | default('') }}

    - name: Assert an immovable exemption for an unmanaged guest is refused
      block:
        - name: Derive an inert exemption
          ansible.builtin.include_role:
            name: pve_ha
            tasks_from: classification.yml
          vars:
            pve_ha_immovable_guests:
              never-managed: "stale entry"

        - name: Report that the inert exemption was accepted
          ansible.builtin.fail:
            msg: >-
              an immovable exemption naming a guest under no HA management was
              accepted; it silently exempts nothing.
      rescue:
        - name: Confirm the inert exemption was the reason
          ansible.builtin.assert:
            that:
              - "'under no HA management' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              failed for a different reason:
              {{ ansible_failed_result.msg | default('') }}
