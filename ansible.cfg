[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Refuse unverified host keys. Pinned verification (the reviewed known_hosts
# from Doppler SSH_KNOWN_HOSTS) applies when running via scripts/run-ansible.sh;
# direct ansible-playbook runs verify against the operator's own known_hosts
# and fail closed for unknown hosts. A rebuilt node/guest fails closed until
# re-harvested. LXC pushes use pct, not SSH.
host_key_checking = True
retry_files_enabled = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .cache/facts
fact_caching_timeout = 86400
stdout_callback = ansible.builtin.default
result_format = yaml
callbacks_enabled = profile_tasks
interpreter_python = auto_silent
deprecation_warnings = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
# ServerAlive* is what bounds a DEAD connection. Without it a node that stops
# answering mid-task — a reboot, a wedged interface, a dropped NAT mapping —
# leaves ssh blocked on a socket nothing will ever close, and the converge waits
# on it forever with no output and no failure. Observed: 19 minutes on a single
# task with no process running on any node. Four missed 15s probes fail the
# connection in about a minute, so an unreachable host is reported as
# unreachable instead of stalling the run.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4
