---
# Re-run role tests when an upstream source-of-truth repo (terraform-proxmox)
# cuts a release. Triggered in real time via repository_dispatch
# (event_type=upstream-released), fanned out by terraform-proxmox's release
# workflow.
#
# Runs the data contract and every Molecule scenario after an upstream release.
#
# Security: client_payload.* (sender-controlled) is not interpolated anywhere
# here — this listener only calls reusable workflows with fixed inputs.
name: Upstream Revalidate

on:
  repository_dispatch:
    types: [upstream-released]

permissions:
  contents: read

jobs:
  data-contract:
    permissions:
      contents: read
    uses: ./.github/workflows/_data-contract.yml

  static-contracts:
    name: Static contracts
    permissions:
      contents: read
    uses: ./.github/workflows/_static-contracts.yml

  revalidate:
    name: Molecule Test
    permissions:
      contents: read
    uses: JacobPEvans/.github/.github/workflows/_molecule.yml@v1
    with:
      full_suite: true
      scenario_discovery: directories
      scenario_name_profile: lower_underscore
      scenario_require_molecule_yml: true
      discover_timeout_minutes: 360
      pull_request_discover_timeout_minutes: 360
      runner_label: ubuntu-latest
      public_and_fork_hosted: true
      timeout_minutes: 15
      pull_request_timeout_minutes: 32
      python_version: "3.14"
      python_install_mode: pip_requirements
      requirements_files: '["requirements-ci.txt"]'
      ansible_home_mode: shared
      molecule_roles_path: roles
      galaxy_cache_enabled: true
      galaxy_cache_prefix: ansible-galaxy-v2-
      galaxy_install_mode: requirements
      galaxy_force_install: true
      fail_fast: false
      max_parallel: 12
      docker_timeout_seconds: 0
      docker_prune: false
      pre_steps_script: .github/scripts/pull-molecule-image.sh
      extra_env: ANSIBLE_ALLOW_BROKEN_CONDITIONALS=1
      molecule_workdir_mode: repo_root
      molecule_scenario_arg: matrix
      instance_suffix: false
      isolate_ephemeral_directory: false
      doppler_enabled: false
      test_secret_env_map: "{}"
      use_homarr_token: false
