---
name: OpenHands CI Fix

# Started by the PR Reconcile sweep: one workflow_dispatch per head commit of a
# pull request whose code checks failed. The called workflow handles gating,
# attempt caps, daily limits and concurrency.
on:
  workflow_dispatch:
    inputs:
      failure_run_id:
        description: ID of the failed run
        required: true
        type: string
      failure_head_branch:
        description: Head branch of the failed run
        required: true
        type: string

# The called workflow's jobs request exactly these scopes (fix commit, pull
# request comment through the issues API, run logs); a caller that grants
# less fails at graph validation.
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix:
    uses: JacobPEvans/.github-ai/.github/workflows/cc-ci-fix.yml@5743e07e094f6ca410a4b85a0d3681064013f946 # v2.16.0
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
      OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
      GH_APP_CLAUDE_BOT_ID: ${{ secrets.GH_APP_CLAUDE_BOT_ID }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
    with:
      # Hosted runners cannot reach the model router; the review pool can.
      runner_label: review
      agent: openhands
      local_model: medium
      daily_run_limit: "20"
      failure_conclusion: failure
      failure_run_id: ${{ inputs.failure_run_id }}
      failure_head_branch: ${{ inputs.failure_head_branch }}
      failure_head_repository: ${{ github.repository }}
      failure_actor: ${{ github.actor }}
      repo_context: "Ansible playbooks and roles for configuring Proxmox VE host"
      ci_structure: >-
        CI Gate aggregates lint, syntax, contract, and Molecule checks. PRs into
        develop use changed-role scenarios; PRs into main and non-PR runs use
        the full Molecule matrix.
