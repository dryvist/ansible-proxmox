---
# CI Gate — thin wrapper around the shared ansible CI gate.
#
# Lint and molecule live in dryvist/.github/.github/workflows/_ansible-ci.yml.
# This repo uses its defaults: ansible-lint over the whole project, the
# `default` molecule scenario, and molecule deps from requirements-ci.txt.
#
# The shared workflow runs with emit_gate:false and this wrapper aggregates its
# own "Merge Gate" instead, so the repo-local data-contract job sits INSIDE the
# required check rather than beside it. The check name is unchanged, so branch
# protection needs no edit — it still requires only "Merge Gate".

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: dryvist/.github/.github/workflows/_ansible-ci.yml@main
    with:
      emit_gate: false

  data-contract:
    name: Data Contract
    needs: ci
    if: ${{ needs.ci.outputs.ansible == 'true' }}
    uses: ./.github/workflows/_data-contract.yml

  gate:
    name: Merge Gate
    needs: [ci, data-contract]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          allowed-skips: data-contract
          jobs: ${{ toJSON(needs) }}
