---
name: Molecule Test

on:
  # CI Gate owns PR and branch-push triggers so shared scenario selection and
  # every Molecule result feed the same required Merge Gate.
  workflow_call:
    inputs:
      scenarios:
        description: >-
          JSON scenario list from the shared Ansible CI workflow. An empty
          string requests every scenario; [] means contracts apply without a
          Molecule scenario for this change.
        type: string
        default: ""
  # Manual trigger for ad-hoc full-matrix runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Static contract tests. These are cheap, scenario-independent, and were
  # previously wedged in front of the molecule steps in the same job, so a
  # molecule failure said nothing about them and vice versa.
  contracts:
    name: Static contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      # The apt caching-proxy hook exists for the UNREACHABLE case, which a
      # molecule container cannot present. The test extracts the script from the
      # role rather than copying it, so role drift fails here.
      - name: Verify the apt caching-proxy auto-detect hook
        run: python3 tests/apt_proxy_detect/test_detect.py

      - name: Verify pve guest evacuation static safety contract
        run: python3 tests/pve_guest_evacuation/test_archive_contract.py

      - name: Verify bulk data comparison static safety contract
        run: python3 tests/pve_bulk_data_compare/test_contract.py

      - name: Verify full-system stress NVMe JSON contract
        run: python3 tests/pve_full_system_stress/test_nvme_sample.py

  # Use the shared role-to-scenario selection. When no narrowed list is passed,
  # discover the full matrix for pushes, promotions, and shared inputs.
  discover:
    name: Discover scenarios
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ inputs.scenarios != '' && inputs.scenarios || steps.list.outputs.scenarios }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: List all molecule scenarios when no narrowed list is supplied
        id: list
        if: ${{ inputs.scenarios == '' }}
        run: |
          set -euo pipefail
          mapfile -t all_scenarios < <(
            find molecule -mindepth 2 -maxdepth 2 -name molecule.yml \
              -printf '%h\n' | sed 's#.*/##' | sort
          )
          if [ "${#all_scenarios[@]}" -eq 0 ]; then
            echo "::error::No Molecule scenarios discovered."
            exit 1
          fi
          for scenario in "${all_scenarios[@]}"; do
            if [[ ! "$scenario" =~ ^[a-z0-9_]+$ ]]; then
              echo "::error::Rejected scenario name outside [a-z0-9_]."
              exit 1
            fi
          done
          scenario_json=$(printf '%s\n' "${all_scenarios[@]}" | jq -R . | jq -sc .)
          echo "scenarios=$scenario_json" >> "$GITHUB_OUTPUT"

  molecule:
    name: Molecule (${{ matrix.scenario }})
    needs: discover
    if: ${{ needs.discover.outputs.scenarios != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      # LOAD-BEARING. These ran as serial steps in one job, so the first failing
      # scenario left every later one `skipped` — and in a run listing a skipped
      # step is indistinguishable from one that would have passed. That is how
      # one scenario stayed broken across 8 consecutive runs while the 9
      # scenarios behind it reported nothing at all. Each scenario now gets its
      # own independent verdict.
      fail-fast: false
      max-parallel: 6
      matrix:
        scenario: ${{ fromJSON(needs.discover.outputs.scenarios) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      # `install` covers both sections of requirements.yml. Do not narrow this to
      # `collection install` or `role install` — each silently ignores the other
      # section, so a dependency can go missing with a zero exit status.
      # Cache Galaxy content keyed on requirements.yml. On a hit the collections
      # (and any roles) are already present, so the install below is skipped;
      # on a miss (requirements.yml changed) it runs and repopulates the cache.
      # Same key/paths as dryvist/.github's _ansible-ci.yml so a warm run of
      # either workflow warms the other.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible dependencies
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy install -r requirements.yml

      # The shared workflow supplies only scenario names declared in this
      # caller's filter map; the full-matrix fallback discovers directories.
      # Fetch the platform image before molecule needs it, retrying transient
      # registry errors. Molecule's own create step retries twice and then fails
      # the scenario, which reads as a broken role rather than a bad minute at
      # the registry. See the script header for why this is not a retry of
      # `molecule test`.
      - name: Pre-pull the ${{ matrix.scenario }} scenario image
        run: .github/scripts/pull-molecule-image.sh "$SCENARIO"
        env:
          SCENARIO: ${{ matrix.scenario }}

      - name: Run the ${{ matrix.scenario }} molecule scenario
        run: molecule test -s "$SCENARIO"
        env:
          SCENARIO: ${{ matrix.scenario }}
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
