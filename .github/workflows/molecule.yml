---
name: Molecule Test

on:
  push:
    branches: [main, develop]
  workflow_call: {}
  # Manual trigger for ad-hoc full-matrix runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Static contract tests. These are cheap, scenario-independent, and were
  # previously wedged in front of the molecule steps in the same job, so a
  # molecule failure said nothing about them and vice versa.
  contracts:
    name: Static contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      # The apt caching-proxy hook exists for the UNREACHABLE case, which a
      # molecule container cannot present. The test extracts the script from the
      # role rather than copying it, so role drift fails here.
      - name: Verify the apt caching-proxy auto-detect hook
        run: python3 tests/apt_proxy_detect/test_detect.py

      - name: Verify pve guest evacuation static safety contract
        run: python3 tests/pve_guest_evacuation/test_archive_contract.py

      - name: Verify bulk data comparison static safety contract
        run: python3 tests/pve_bulk_data_compare/test_contract.py

  # Discover scenarios and roles from the tree, then derive the PR matrix from
  # role references. Main promotions and shared inputs run all; CI harness edits
  # use the default smoke scenario. Pushes run all.
  discover:
    name: Discover scenarios
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.select.outputs.scenarios }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Select scenarios for this change
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mapfile -t all_scenarios < <(
            find molecule -mindepth 2 -maxdepth 2 -name molecule.yml \
              -printf '%h\n' | sed 's#.*/##' | sort
          )
          if [ "${#all_scenarios[@]}" -eq 0 ]; then
            echo "::error::No Molecule scenarios discovered."
            exit 1
          fi
          mapfile -t role_names < <(find roles -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          if [ "${#role_names[@]}" -eq 0 ]; then
            echo "::error::No Ansible roles discovered."
            exit 1
          fi
          for role in "${role_names[@]}"; do
            if [[ ! "$role" =~ ^[a-z0-9_]+$ ]]; then
              echo "::error::Rejected role name outside [a-z0-9_]."
              exit 1
            fi
          done
          role_pattern=$(printf '%s|' "${role_names[@]}")
          role_pattern=${role_pattern%|}
          for scenario in "${all_scenarios[@]}"; do
            if [[ ! "$scenario" =~ ^[a-z0-9_]+$ ]]; then
              echo "::error::Rejected scenario name outside [a-z0-9_]."
              exit 1
            fi
            if ! grep -R -E -q -w --include='*.yml' --include='*.yaml' \
              -- "$role_pattern" "molecule/$scenario"; then
              echo "::error::Scenario has no resolvable role references."
              exit 1
            fi
          done

          full_matrix=false
          reason="no Molecule inputs changed"
          selected_paths=$(mktemp)
          changed_paths=$(mktemp)
          trap 'rm -f "$selected_paths" "$changed_paths"' EXIT
          if [ "$EVENT_NAME" != pull_request ]; then
            full_matrix=true
            reason="non-pull-request event"
          elif [ "$BASE_REF" = main ]; then
            full_matrix=true
            reason="promotion pull request targets main"
          else
            if [ -z "$BASE_SHA" ]; then
              echo "::error::Pull request base SHA is missing; refusing to narrow."
              exit 1
            fi
            git diff --name-only -z "$BASE_SHA...HEAD" > "$changed_paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                roles/*/meta/*|molecule/shared/*|molecule/resources/*|.config/molecule/*|playbooks/*|requirements.yml|requirements-ci.txt|ansible.cfg)
                  full_matrix=true
                  reason="shared inputs changed"
                  break
                  ;;
                .github/workflows/*|.github/scripts/*)
                  printf '%s\n' default >> "$selected_paths"
                  reason="CI harness changed; run default smoke scenario"
                  ;;
                roles/*/*)
                  role=${path#roles/}
                  role=${role%%/*}
                  if [[ ! "$role" =~ ^[a-z0-9_]+$ || ! -d "roles/$role" ]]; then
                    full_matrix=true
                    reason="role path is not in the current tree"
                    break
                  fi
                  # A role referenced by another role may affect multiple
                  # scenarios; widen instead of guessing which dependents run.
                  if grep -R -q -w --include='*.yml' --include='*.yaml' \
                    --exclude-dir="$role" -- "$role" roles/; then
                    full_matrix=true
                    reason="role dependency changed"
                    break
                  fi
                  hits=0
                  while IFS= read -r -d '' candidate; do
                    scenario=${candidate#molecule/}
                    scenario=${scenario%%/*}
                    if [ -f "molecule/$scenario/molecule.yml" ]; then
                      if ! grep -F -q -x -- "$scenario" "$selected_paths"; then
                        printf '%s\n' "$scenario" >> "$selected_paths"
                      fi
                      hits=1
                    fi
                  done < <(grep -R -l -Z -w --include='*.yml' --include='*.yaml' -- "$role" molecule/ || true)
                  if [ "$hits" -eq 0 ]; then
                    full_matrix=true
                    reason="changed role has no Molecule scenario; "
                    reason+="widening to full matrix"
                  else
                    reason="changed role coverage"
                  fi
                  ;;
                molecule/*/*)
                  scenario=${path#molecule/}
                  scenario=${scenario%%/*}
                  if [ -f "molecule/$scenario/molecule.yml" ]; then
                    if ! grep -F -q -x -- "$scenario" "$selected_paths"; then
                      printf '%s\n' "$scenario" >> "$selected_paths"
                    fi
                    reason="changed scenario coverage"
                  else
                    full_matrix=true
                    reason="molecule path is not a known scenario"
                    break
                  fi
                  ;;
              esac
            done < "$changed_paths"
          fi

          if [ "$full_matrix" = true ]; then
            scenarios=("${all_scenarios[@]}")
          else
            mapfile -t scenarios < <(sort -u "$selected_paths")
          fi
          if [ "${#scenarios[@]}" -gt 0 ]; then
            mapfile -t scenarios < <(printf '%s\n' "${scenarios[@]}" | sort -u)
            scenario_json=$(printf '%s\n' "${scenarios[@]}" | jq -R . | jq -sc .)
          else
            scenario_json='[]'
          fi
          echo "scenarios=$scenario_json" >> "$GITHUB_OUTPUT"
          echo "### Molecule selection" >> "$GITHUB_STEP_SUMMARY"
          printf '\n%s; selected %s of %s scenarios.\n' \
            "$reason" "${#scenarios[@]}" "${#all_scenarios[@]}" >> "$GITHUB_STEP_SUMMARY"
          echo "$reason: $scenario_json"

  molecule:
    name: Molecule (${{ matrix.scenario }})
    needs: discover
    if: ${{ needs.discover.outputs.scenarios != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      # LOAD-BEARING. These ran as serial steps in one job, so the first failing
      # scenario left every later one `skipped` — and in a run listing a skipped
      # step is indistinguishable from one that would have passed. That is how
      # one scenario stayed broken across 8 consecutive runs while the 9
      # scenarios behind it reported nothing at all. Each scenario now gets its
      # own independent verdict.
      fail-fast: false
      max-parallel: 6
      matrix:
        scenario: ${{ fromJSON(needs.discover.outputs.scenarios) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      # `install` covers both sections of requirements.yml. Do not narrow this to
      # `collection install` or `role install` — each silently ignores the other
      # section, so a dependency can go missing with a zero exit status.
      # Cache Galaxy content keyed on requirements.yml. On a hit the collections
      # (and any roles) are already present, so the install below is skipped;
      # on a miss (requirements.yml changed) it runs and repopulates the cache.
      # Same key/paths as dryvist/.github's _ansible-ci.yml so a warm run of
      # either workflow warms the other.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible dependencies
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy install -r requirements.yml

      # molecule/default/verify.yml imports tests/container_start_contract.yml,
      # so the `default` scenario also carries the container start contract.
      # SCENARIO reaches the script through env, not through GitHub expression
      # interpolation into the shell. The value is a repository directory name
      # and this workflow now runs on pull_request, so it is untrusted input;
      # `discover` additionally allow-lists it to [a-z0-9_].
      # Fetch the platform image before molecule needs it, retrying transient
      # registry errors. Molecule's own create step retries twice and then fails
      # the scenario, which reads as a broken role rather than a bad minute at
      # the registry. See the script header for why this is not a retry of
      # `molecule test`.
      - name: Pre-pull the ${{ matrix.scenario }} scenario image
        run: .github/scripts/pull-molecule-image.sh "$SCENARIO"
        env:
          SCENARIO: ${{ matrix.scenario }}

      - name: Run the ${{ matrix.scenario }} molecule scenario
        run: molecule test -s "$SCENARIO"
        env:
          SCENARIO: ${{ matrix.scenario }}
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
