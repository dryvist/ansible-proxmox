---
name: Molecule Test

on:
  push:
    branches: [main]
  # Callable so the upstream-revalidate listener can re-run role tests when
  # terraform-proxmox cuts a release; manual trigger for ad-hoc runs.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  molecule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      # `install` covers both sections of requirements.yml. Do not narrow this to
      # `collection install` or `role install` — each silently ignores the other
      # section, so a dependency can go missing with a zero exit status.
      - name: Install Ansible dependencies
        run: ansible-galaxy install -r requirements.yml

      # The inventory-load and pve_ha fixture checks moved to _data-contract.yml
      # so they run on pull requests. This workflow triggers only on
      # push-to-main, which meant those checks could not fail a PR.

      # The apt caching-proxy hook exists for the UNREACHABLE case, which a
      # molecule container cannot present. The test extracts the script from the
      # role rather than copying it, so role drift fails here.
      - name: Verify the apt caching-proxy auto-detect hook
        run: python3 tests/apt_proxy_detect/test_detect.py

      # molecule/default/verify.yml imports tests/container_start_contract.yml.
      - name: Run default molecule test and container start contract
        run: molecule test
        env:
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Run pve evacuation-gate molecule test
        run: molecule test -s pve_evacuation_gate
        env:
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Run nas_storage molecule test
        run: molecule test -s nas_storage
        env:
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Run media_lxc_features molecule test
        run: molecule test -s media_lxc_features
        env:
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Run ssh_ca_trust molecule test
        run: molecule test -s ssh_ca_trust
        env:
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Run root_authorized_keys molecule test
        run: molecule test -s root_authorized_keys
        env:
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
