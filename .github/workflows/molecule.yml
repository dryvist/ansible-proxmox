---
name: Molecule Test

on:
  push:
    branches: [main]
  # Callable so the upstream-revalidate listener can re-run role tests when
  # terraform-proxmox cuts a release; manual trigger for ad-hoc runs.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  molecule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      # load_tofu.yml (imported by verify_inventory.yml) include_role's the
      # shared inventory_resolve role, so it must be installed before the run.
      - name: Install Ansible roles
        run: ansible-galaxy role install -r requirements.yml

      - name: Verify OpenTofu inventory loading
        run: |
          cp tests/inventory_load/tofu_inventory.json inventory/tofu_inventory.json
          mkdir -p /tmp/ansible-tmp
          ANSIBLE_LOCAL_TEMP=/tmp/ansible-tmp \
          TOFU_INVENTORY_PATH=$PWD/inventory/tofu_inventory.json \
          PROXMOX_VE_HOSTNAME=localhost \
          PROXMOX_VM_SSH_USERNAME=root \
          ansible-playbook tests/inventory_load/verify_inventory.yml -i inventory/hosts.yml -c local

      # molecule/default/verify.yml imports tests/container_start_contract.yml.
      - name: Run default molecule test and container start contract
        run: molecule test
        env:
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Run nas_storage molecule test
        run: molecule test -s nas_storage
        env:
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Run media_lxc_features molecule test
        run: molecule test -s media_lxc_features
        env:
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Run ssh_ca_trust molecule test
        run: molecule test -s ssh_ca_trust
        env:
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Run root_authorized_keys molecule test
        run: molecule test -s root_authorized_keys
        env:
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
