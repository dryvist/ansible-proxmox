---
name: CI Fix (Claude)

# Thin caller for dryvist/ai-workflows cc-ci-fix. When CI Gate fails on a PR
# branch, Claude analyzes the failure and pushes a verified fix commit to that
# branch (max 2 attempts/PR). The reusable handles gating, attempt-capping,
# daily limits, and concurrency — so this wrapper stays minimal.
on:
  workflow_run:
    workflows: ["CI Gate"] # the required merge gate (Ansible Lint + Molecule Test)
    types: [completed]
  workflow_dispatch: # manual trigger for testing / re-runs

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci-fix:
    uses: dryvist/ai-workflows/.github/workflows/cc-ci-fix.yml@aa4ed4a4bca92a3094bf4432689ddc5d84b98649 # v0.48.3
    secrets: inherit
    with:
      repo_context: "Ansible playbooks and roles for configuring Proxmox VE host"
      ci_structure: >-
        CI Gate aggregates lint, syntax, contract, and Molecule checks. PRs into
        develop use changed-role scenarios; PRs into main and non-PR runs use
        the full Molecule matrix.
