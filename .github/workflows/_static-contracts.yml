---
name: Repository Static Contracts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contracts:
    name: Static contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install CI requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Verify the apt caching-proxy auto-detect hook
        run: python3 tests/apt_proxy_detect/test_detect.py

      - name: Verify pve guest evacuation static safety contract
        run: python3 tests/pve_guest_evacuation/test_archive_contract.py

      - name: Verify bulk data comparison static safety contract
        run: python3 tests/pve_bulk_data_compare/test_contract.py

      - name: Verify full-system stress NVMe JSON contract
        run: python3 tests/pve_full_system_stress/test_nvme_sample.py

      - name: Verify CI scope policy
        run: python3 tests/workflow_policy/test_ci_scope.py
