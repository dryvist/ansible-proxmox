---
collections:
  - name: ansible.posix
    version: ">=2.1.0"
  - name: community.general
    version: ">=12.0.0"
  # RustFS inventory resolver fetches the published inventory natively.
  - name: amazon.aws
    version: ">=9.0.0"
  - name: community.hashi_vault
    version: ">=6.0.0"
  # proxmox_cluster (pve_cluster role) — wraps pvecm create/join via the PVE API.
  # Ceiling at <2.0.0: validate_certs default flips to true at 2.0.0; opt in
  # deliberately rather than inherit the change silently.
  - name: community.proxmox
    version: ">=2.0.0,<2.1.0"

roles:
  # Shared inventory resolver consumed by playbooks/load_tofu.yml — replaces the
  # per-repo resolution-tier copy-paste. Pinned to the release that first ships
  # the role.
  - name: inventory_resolve
    src: https://github.com/dryvist/homelab-contracts.git
    scm: git
    version: 9aba451e9de0956f9c308d72a65e86924e243f23
  # Cribl Edge must run on every Proxmox host — without a local agent, host
  # signals have no approved route into Splunk. Shared with
  # ansible-proxmox-apps (Edge containers) rather than copied, which is why it
  # lives in homelab-contracts.
  # PIN: update to the merge commit of homelab-contracts#48 before rollout.
  - name: cribl_edge
    src: https://github.com/dryvist/homelab-contracts.git
    scm: git
    version: 0b6b244b67b81187a1420cfdd4dedc433df1da25
  # Packs are the unit of Cribl config. Host collection is defined in a
  # versioned pack, never templated per node.
  - name: cribl_packs
    src: https://github.com/dryvist/homelab-contracts.git
    scm: git
    version: 0b6b244b67b81187a1420cfdd4dedc433df1da25
