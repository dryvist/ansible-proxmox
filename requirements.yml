---
collections:
  - name: ansible.posix
    version: ">=2.1.0"
  - name: community.general
    version: ">=12.0.0"
  # RustFS inventory resolver fetches the published inventory natively.
  - name: amazon.aws
    version: ">=9.0.0"
  - name: community.hashi_vault
    version: ">=6.0.0"
  # proxmox_cluster (pve_cluster role) — wraps pvecm create/join via the PVE API.
  # Ceiling at <2.0.0: validate_certs default flips to true at 2.0.0; opt in
  # deliberately rather than inherit the change silently.
  - name: community.proxmox
    version: ">=2.0.0,<2.1.0"

  # Shared homelab roles (cribl_edge, cribl_packs, inventory_resolve). A
  # collection, not `roles:`
  # git entries: `ansible-galaxy role install` archives the whole repo, then
  # picks what to install by taking the SHORTEST path above any meta/main.yml
  # it finds. The name in the entry selects nothing. A repo holding one role
  # resolves to that role and looks correct; add a second role that sorts
  # shorter and the same pin silently installs that one instead, still under
  # the requested name. A collection installs from the subdirectory holding
  # galaxy.yml, so every role in it is addressed unambiguously by FQCN.
  # Cribl Edge must run on every Proxmox host — without a local agent, host
  # signals have no approved route into Splunk. Shared with
  # ansible-proxmox-apps (Edge containers) rather than copied.
  # PIN: the merge commit of homelab-contracts#56, which declares Edge's own
  # system_metrics source. The role templates the whole of inputs.yml, so every
  # source Edge ships enabled by default was being dropped on the first
  # converge — these hosts have run node_exporter with nothing consuming it and
  # no host CPU/memory/disk/network series reaching Splunk. Also picks up #54
  # (splitting hypervisor syslog out of the os catch-all by host).
  # An immutable SHA, not a branch — a moving ref would let an unreviewed
  # contracts change reach a converge here without a PR in this repo.
  # Now at homelab-contracts#58, which makes inventory_resolve report the
  # underlying error on every failure path, instead of naming one presumed
  # cause regardless of what actually failed.
  - name: https://github.com/dryvist/homelab-contracts.git#/ansible/
    type: git
    version: c5e139cb7ccb286016020dd85c2f1d9c3b5a376f

# No `roles:` section — inventory_resolve comes from the collection above, by
# FQCN, for the reason stated there. Its old git-scm `roles:` entry installed
# another role's tasks under the name roles/inventory_resolve, and the pin still
# read correct, so nothing surfaced it.
