---
collections:
  - name: ansible.posix
    version: ">=2.1.0"
  - name: community.general
    version: ">=12.0.0"
  # RustFS inventory resolver fetches the published inventory natively.
  - name: amazon.aws
    version: ">=9.0.0"
  - name: community.hashi_vault
    version: ">=6.0.0"
  # proxmox_cluster (pve_cluster role) — wraps pvecm create/join via the PVE API.
  # Ceiling at <2.0.0: validate_certs default flips to true at 2.0.0; opt in
  # deliberately rather than inherit the change silently.
  - name: community.proxmox
    version: ">=2.0.0,<2.1.0"

  # Shared homelab roles (cribl_edge, cribl_packs). A collection, not `roles:`
  # git entries: `ansible-galaxy role install` resolves a git source at the
  # repository ROOT only, so a role kept in a subdirectory is unreachable that
  # way. A collection installs from the subdirectory that holds galaxy.yml.
  # Cribl Edge must run on every Proxmox host — without a local agent, host
  # signals have no approved route into Splunk. Shared with
  # ansible-proxmox-apps (Edge containers) rather than copied.
  # PIN: the merge commit of homelab-contracts#56, which declares Edge's own
  # system_metrics source. The role templates the whole of inputs.yml, so every
  # source Edge ships enabled by default was being dropped on the first
  # converge — these hosts have run node_exporter with nothing consuming it and
  # no host CPU/memory/disk/network series reaching Splunk. Also picks up #54
  # (splitting hypervisor syslog out of the os catch-all by host).
  # An immutable SHA, not a branch — a moving ref would let an unreviewed
  # contracts change reach a converge here without a PR in this repo.
  - name: https://github.com/dryvist/homelab-contracts.git#/ansible/
    type: git
    version: 3356d6095040f59887e553948e6cd0a84cb85bc5

roles:
  # Shared inventory resolver consumed by playbooks/load_tofu.yml — replaces the
  # per-repo resolution-tier copy-paste. Pinned to the release that first ships
  # the role.
  - name: inventory_resolve
    src: https://github.com/dryvist/homelab-contracts.git
    scm: git
    version: 9aba451e9de0956f9c308d72a65e86924e243f23
