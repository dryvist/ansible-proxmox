---
# Commission a Dell PowerEdge node for cluster join.
#
# Targets: hosts in the `poweredge` group (R410, R710, future PowerEdge models).
# Prerequisites: PVE 9.x bare-metal install already complete via iDRAC vKVM,
# node joined to the cluster (`pvecm add`), SSH key auth from the controller
# to root@<mgmt_ip>.
#
# Usage:
#   ansible-playbook -i inventory playbooks/commission_poweredge.yml -l <node-name>
#
# Inventory: real values for the `poweredge` group are sourced from
# inventory/group_vars/poweredge/secrets.sops.yml (gitignored) OR from the
# terraform_inventory.json produced by terraform-proxmox (which carries the
# poweredge_nodes output declared via SOPS-encrypted terraform.sops.json).
# See inventory/host_vars/poweredge-node.yml.example for the schema.

- name: Load Terraform host services
  import_playbook: load_terraform.yml

- name: Validate PVE 9 baseline before commissioning roles run
  hosts: poweredge
  become: true
  gather_facts: true
  tags:
    - always
    - preflight

  tasks:
    - name: Read pveversion
      ansible.builtin.command: pveversion --verbose
      register: pveversion_out
      changed_when: false
      check_mode: false

    - name: Assert Proxmox VE major version is 9.x
      ansible.builtin.assert:
        that:
          - "'pve-manager/9.' in pveversion_out.stdout"
        fail_msg: |
          PVE 9.x is required for this playbook (no PVE 8 fallback).
          Detected:
          {{ pveversion_out.stdout }}

    - name: Assert kernel meets PVE 9 baseline (6.8+)
      ansible.builtin.assert:
        that:
          - ansible_kernel is version('6.8', '>=')
        fail_msg: "Kernel {{ ansible_kernel }} below PVE 9 baseline 6.8. Reboot into the new kernel before running this playbook."

- name: Commission PowerEdge node
  hosts: poweredge
  become: true
  gather_facts: true

  roles:
    - role: common
      tags:
        - common

    - role: ntp
      tags:
        - ntp
      vars:
        ntp_serve: false  # PowerEdge nodes are NTP clients of the cluster's existing ntp server (see site.yml)

    - role: kernel_tuning
      tags:
        - kernel_tuning

    - role: ulimits
      tags:
        - ulimits

    - role: zfs_swap
      tags:
        - zfs_swap

    - role: lxc_features
      tags:
        - lxc_features

    - role: nas_storage
      tags:
        - nas_storage
      when: poweredge_enable_nas_storage | default(false)

    - role: proxmox_monitoring
      tags:
        - monitoring
      vars:
        proxmox_monitoring_healthchecks_ping_url: >-
          {{ lookup('env', 'HEALTHCHECK_PING_KEY') |
             default('', true) |
             ternary('https://hc-ping.com/' ~ lookup('env', 'HEALTHCHECK_PING_KEY') ~ '/' ~ inventory_hostname, '') }}

    # crash_diagnostics intentionally NOT applied during commissioning.
    # Apply it from site.yml only after the cluster is healthy with the new
    # node — it makes intentional changes that need a quiet baseline first.
