---
# Main playbook for Proxmox VE server configuration
#
# Usage: See README.md or CLAUDE.md for environment configuration

- name: Load Terraform host services
  import_playbook: load_terraform.yml

- name: Configure Proxmox VE servers
  hosts: proxmox
  become: true
  gather_facts: true

  roles:
    - role: common
      tags:
        - common

    - role: zfs_swap
      tags:
        - zfs_swap

    - role: kernel_tuning
      tags:
        - kernel_tuning

    - role: ulimits
      tags:
        - ulimits

    - role: proxmox_monitoring
      tags:
        - monitoring
      vars:
        proxmox_monitoring_healthchecks_ping_url: "https://hc-ping.com/{{ lookup('env', 'HEALTHCHECK_PING_KEY') }}/proxmox"

    - role: crash_diagnostics
      tags:
        - crash_diagnostics

    - role: lxc_features
      tags:
        - lxc_features

    - role: nas_storage
      tags:
        - nas_storage

    - role: ntp
      tags:
        - ntp
      vars:
        ntp_serve: true
        ntp_allow_cidrs:
          - "192.168.0.0/16"
          - "10.0.0.0/8"

    - role: idrac_kiosk
      tags:
        - idrac_kiosk
