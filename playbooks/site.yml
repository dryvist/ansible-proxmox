---
# Main playbook for Proxmox VE server configuration
#
# Usage: See README.md or CLAUDE.md for environment configuration

- name: Load OpenTofu host services
  import_playbook: load_tofu.yml

# Bring power-managed nodes (the offline-DR leg) UP before the main play so they
# are reachable for configuration. Inert unless a host sets pve_power_managed:
# true and idrac_power_autocycle is on. ipmitool runs on the controller
# (idrac_power_controller); wait_for_connection blocks until SSH is up.
- name: Power on power-managed nodes (iDRAC auto-cycle)
  hosts: proxmox
  gather_facts: false

  tasks:
    - name: Power on via iDRAC
      ansible.builtin.include_role:
        name: idrac_power
      vars:
        idrac_power_action: "on"
      when:
        - pve_power_managed | default(false) | bool
        - idrac_power_autocycle | default(true) | bool
      tags:
        - idrac_power

- name: Configure Proxmox VE servers
  hosts: proxmox
  become: true
  gather_facts: true

  roles:
    # Proxmox apt repositories first (no-subscription, deb822). Runs before any
    # other role so every node — including freshly commissioned ones — is on the
    # correct channel before the first apt operation. This is what makes a fresh
    # node fully configurable from a single site.yml run (no manual repo fixup).
    - role: pve_repositories
      tags:
        - pve_repositories
        - repositories

    - role: common
      tags:
        - common

    # Host network contract. Detection is read-only and always runs; it catches
    # a management address that has drifted off the untagged bridge, which
    # makes a node unreachable while it is still running. Enforcement is
    # opt-in via pve_host_network_enforce.
    - role: pve_host_network
      tags:
        - pve_host_network
        - network

    # Inter-node root SSH trust (known_hosts) — must precede anything that SSHes
    # between nodes (syncoid replication, pvecm). Idempotent; survives renames.
    - role: cluster_ssh_trust
      tags:
        - cluster_ssh_trust

    - role: zfs_swap
      tags:
        - zfs_swap

    - role: kernel_tuning
      tags:
        - kernel_tuning

    - role: ulimits
      tags:
        - ulimits

    - role: proxmox_monitoring
      tags:
        - monitoring
      vars:
        proxmox_monitoring_healthchecks_ping_url: "https://hc-ping.com/{{ lookup('env', 'HEALTHCHECK_PING_KEY') }}/proxmox"
        # The capacity monitor installs only when it has somewhere to report.
        # Left unset the role skips it silently, so the alarm reads as deployed
        # and fires never. Its own check, separate from the node liveness ping
        # above, so a filling pool and a dead node stay distinguishable.
        proxmox_monitoring_zfs_capacity_deadman_url: "https://hc-ping.com/{{ lookup('env', 'HEALTHCHECK_PING_KEY') }}/zfs-capacity"

    - role: crash_diagnostics
      tags:
        - crash_diagnostics

    # Reset a wedged node instead of leaving it dark. Runs after
    # crash_diagnostics so a panic is still captured before the reset, and
    # before the syslog forwarder so the arming itself is logged off-box.
    - role: node_watchdog
      tags:
        - node_watchdog
        - watchdog

    # Ship every node's journal/syslog to the central pipeline (HAProxy syslog
    # VIP -> Cribl Edge -> Splunk os index). Target CNAME comes from
    # PROXMOX_SUBDOMAIN (Doppler); the port default mirrors terraform-proxmox
    # pipeline_constants.syslog_ports.linux (see the role defaults).
    - role: pve_syslog_forwarder
      tags:
        - pve_syslog_forwarder
        - syslog

    # Structured hypervisor health telemetry (stall detection, clocksource,
    # replication, HA state, memory pressure, guest drift) as one key=value line
    # per node per minute. Ordered AFTER the forwarder so the rsyslog rule that
    # routes this tag exists before the timer starts emitting — otherwise the
    # first samples fall through to the host-syslog rule and land in the shared
    # OS index, which is precisely the split this avoids.
    - role: pve_health_telemetry
      tags:
        - pve_health_telemetry
        - syslog
        - monitoring

    # Prometheus node_exporter (pinned version, systemd) on :9100, bound to the
    # node's management IP so host metrics stay on the management VLAN.
    - role: pve_node_exporter
      tags:
        - pve_node_exporter
        - node_exporter

    - role: lxc_features
      tags:
        - lxc_features

    - role: nas_storage
      tags:
        - nas_storage

    # Verify the HBA is genuine JBOD/non-RAID passthrough before ZFS trusts
    # the array built on top of it as the reference standard.
    - role: hba_storcli
      tags:
        - hba_storcli

    - role: zfs_pools
      tags:
        - zfs_pools

    # Local ZFS snapshot retention (sanoid) for the datasets zfs_pools manages.
    # Layer 1 protection (rollback); cross-node replication is a separate role.
    - role: sanoid
      tags:
        - sanoid

    # Cluster vzdump jobs, selected by pool rather than by guest id. Runs after
    # zfs_pools so the datasets a backup storage sits on already exist. Inert
    # until pve_backup_jobs_manage is set AND a job set is declared, and the
    # declared jobs ship disabled — a first full run is a deliberate act.
    - role: pve_backup_jobs
      tags:
        - pve_backup_jobs
        - backup

    # Root-only media LXC features (bind-mounts, keyctl, /dev/net/tun) that the
    # BPG provider's API token cannot set. Runs AFTER OpenTofu creates the
    # media LXC shells and zfs_pools mounts the bulk/data dataset, and
    # BEFORE ansible-proxmox-apps converges the services. See the role README.
    - role: media_lxc_features
      tags:
        - media_lxc_features

    # Root-only Docker-in-LXC features (nesting, keyctl, fuse) for the AI
    # orchestration guests. Selection is tofu-tag driven and keeps the role
    # VMID-agnostic.
    - role: docker_lxc_features
      tags:
        - docker_lxc_features

    # Root-only AMD GPU passthrough (/dev/dri + /dev/kfd) for the inference LXC
    # (llm-fast) — same root@pam-only contract as media_lxc_features.
    # Runs after OpenTofu creates the shell, before ansible-proxmox-apps installs llama.cpp.
    - role: lxc_gpu_features
      tags:
        - lxc_gpu_features

    - role: ntp
      tags:
        - ntp
      vars:
        ntp_serve: true
        ntp_allow_cidrs:
          - "192.168.0.0/16"
          - "10.0.0.0/8"

    # OpenBao SSH client-CA trust (ssh-certificate-authority ADR): pinned-
    # fingerprint CA fetch, principals map, sshd drop-in with effective-config
    # assertion + human-key lockout guard, and pct push into local LXCs. Runs
    # after ntp — certificate validity is time-bound, and the role's first
    # preflight asserts the clock is synchronized.
    - role: ssh_ca_trust
      tags:
        - ssh_ca_trust

    # Cross-node ZFS replication (syncoid, layer 2). Pull model — runs on the
    # backup node; inert until syncoid_jobs is set.
    # The healthcheck is not optional decoration: syncoid_healthcheck_url was
    # empty, so a job that failed on one dataset was visible only as a non-zero
    # exit code inside a cron run nobody reads. Wiring it makes a failed
    # replication page, and — because healthchecks expects a ping every cycle —
    # makes a run that never happens page too.
    - role: syncoid
      tags:
        - syncoid
      vars:
        syncoid_healthcheck_url: "https://hc-ping.com/{{ lookup('env', 'HEALTHCHECK_PING_KEY') }}/syncoid"

    # Insert-only SQLite warm standby — one consumer of the generic
    # <pool>/databases storage namespace. Daily appends new rows from a source
    # DB into a queryable archive (never deletes). Inert until
    # sqlite_standby_jobs is set (per host). Runs after zfs_pools (dataset) and
    # syncoid; the namespace is snapshotted (sanoid) and replicated (syncoid).
    - role: sqlite_standby
      tags:
        - sqlite_standby
      vars:
        sqlite_standby_healthcheck_url: "https://hc-ping.com/{{ lookup('env', 'HEALTHCHECK_PING_KEY') }}/sqlite-standby"

    # Postgres dump archive pull + Tier-2 cloud upload — the Postgres consumer
    # of docs/DATABASE_DR_STANDARD.md. Inert until postgres_standby_jobs is set
    # (per host). Tier-2 targets are env-wired (Doppler/SOPS); an unset key
    # drops that target, leaving Tier 1 (sanoid + syncoid) intact.
    - role: postgres_standby
      tags:
        - postgres_standby
      vars:
        postgres_standby_healthcheck_url: "https://hc-ping.com/{{ lookup('env', 'HEALTHCHECK_PING_KEY') }}/postgres-standby"
        postgres_standby_s3_targets: >-
          {{ [
               {'name': 'RUSTFS',
                'bucket': lookup('env', 'POSTGRES_DR_RUSTFS_BUCKET'),
                'prefix': 'postgres',
                'endpoint_url': lookup('env', 'POSTGRES_DR_RUSTFS_ENDPOINT'),
                'access_key': lookup('env', 'POSTGRES_DR_RUSTFS_ACCESS_KEY'),
                'secret_key': lookup('env', 'POSTGRES_DR_RUSTFS_SECRET_KEY')},
               {'name': 'AWS',
                'bucket': lookup('env', 'POSTGRES_DR_AWS_BUCKET'),
                'prefix': 'postgres',
                'access_key': lookup('env', 'POSTGRES_DR_AWS_ACCESS_KEY'),
                'secret_key': lookup('env', 'POSTGRES_DR_AWS_SECRET_KEY')}
             ] | selectattr('access_key', 'ne', '') | list }}

    # Daily tar of the local pmxcfs mount (/etc/pve: cluster.conf,
    # storage.cfg, firewall/HA/replication config, ACLs) into the generic
    # <pool>/databases archive namespace — same shape as sqlite_standby /
    # postgres_standby above, new source. pmxcfs replicates cluster-wide, so
    # running this on any one member captures the whole cluster; inert unless
    # a host sets pve_config_backup_enabled: true (the node that already owns
    # the <pool>/databases dataset).
    - role: pve_config_backup
      tags:
        - pve_config_backup
      vars:
        pve_config_backup_healthcheck_url: "https://hc-ping.com/{{ lookup('env', 'HEALTHCHECK_PING_KEY') }}/pve-config-backup"

    # Daily bare-mirror of every configured owner's PUBLIC repositories.
    # Public repos only (v1) -- no credential of any kind, cloned/fetched
    # anonymously. Inert unless a host sets git_mirror_enabled: true and a
    # non-empty git_mirror_owners (the node that already owns the
    # <pool>/git-mirror dataset). See roles/git_mirror/README.md.
    - role: git_mirror
      tags:
        - git_mirror
      vars:
        git_mirror_healthcheck_url: "https://hc-ping.com/{{ lookup('env', 'HEALTHCHECK_PING_KEY') }}/git-mirror"

    - role: idrac_kiosk
      tags:
        - idrac_kiosk

    # Scheduled local power-off (systemd timer) for normally-off nodes so a node
    # brought up for a window is not left running overnight. Inert unless a host
    # sets node_auto_poweroff_enabled: true (e.g. pve3). The OS powers itself
    # off; idrac_power (IPMI) handles powering a node back on.
    - role: node_auto_poweroff
      tags:
        - node_auto_poweroff

    # Scheduled IPMI power-ON (systemd timer) so a normally-off DR node wakes for
    # its backup windows with no human and no scheduled ansible run — the wake
    # half of the autonomous cycle (node_auto_poweroff is the sleep half). Runs on
    # the always-on controller; inert unless a host sets node_scheduled_wake_
    # targets (e.g. pve1 -> pve3). The woken node replicates on boot (syncoid
    # boot trigger) and powers itself off on completion.
    - role: node_scheduled_wake
      tags:
        - node_scheduled_wake

    # Wake-on-LAN persistence for non-power-managed hosts (no BMC/iDRAC) that
    # are meant to stay always-on. Inert unless a host sets
    # wol_enable_enabled: true (e.g. pve4). BIOS/UEFI WoL must already be on;
    # this covers the OS side, which resets to disabled on every boot without it.
    - role: wol_enable
      tags:
        - wol_enable

    # NVIDIA host GPU driver, so LXC guests can be handed the card via device
    # passthrough. Inert unless a host sets nvidia_driver_enabled: true, and
    # fails loud if opted in on a node with no NVIDIA card on the PCI bus.
    # Reports rather than takes the reboot the driver switch needs.
    - role: nvidia_driver
      tags:
        - nvidia_driver

# Proxmox VE HA (resources + anti-affinity) for the tier-0 guests. Imported here
# rather than left as a standalone playbook so pve_ha_enabled cannot be forgotten
# on a routine converge — it previously existed only as a hand-typed -e on this
# standalone file, which site.yml never included, so HA silently did nothing on
# every node loss. The role stays INERT unless pve_ha_enabled is true (set in
# inventory group_vars, not per-run). Re-imports load_tofu.yml; import_playbook
# is safe to repeat.
- name: Configure Proxmox VE HA for tier-0 guests
  import_playbook: ha.yml

# Cribl Edge on every host. Imported here rather than left as a standalone
# playbook so it is enforced by the standard converge — a node without a local
# Edge agent has no approved route for host signals into Splunk, and would
# otherwise stay silently uncovered until someone remembered to run it.
# Placed after host configuration so the packages and users it depends on
# exist, and before the power-down leg so power-managed nodes are still up.
- name: Cribl Edge on Proxmox hosts
  import_playbook: cribl_edge.yml

# Gracefully power down the power-managed nodes at the very END of the run (the
# offline-DR leg returns to off after its targets are seeded). NOTE: a mid-run
# failure stops subsequent plays, so the node may be left powered on (re-run or
# power off manually) — a guaranteed-off (block/always) refinement is tracked.
- name: Power off power-managed nodes (iDRAC auto-cycle)
  hosts: proxmox
  gather_facts: false

  tasks:
    - name: Power off via iDRAC (graceful ACPI)
      ansible.builtin.include_role:
        name: idrac_power
      vars:
        idrac_power_action: "off"
      when:
        - pve_power_managed | default(false) | bool
        - idrac_power_autocycle | default(true) | bool
      tags:
        - idrac_power
