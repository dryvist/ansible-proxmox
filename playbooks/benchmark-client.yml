---
- name: Validate the benchmark client request
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    benchmark_client_default_images:
      - bigcodebench/bigcodebench-evaluate@sha256:a3cd34ec3840a49d6b7afb240f4bdd47c350bc5991043fd0a91773830f7cd405
    benchmark_client_default_tools:
      uv: "0.13.1"
      node: "24.21.0"
  tasks:
    - name: Require a valid node and client request
      ansible.builtin.assert:
        that:
          - node is defined
          - node | string in (groups['proxmox'] | default([]))
          - vmid is defined
          - vmid | string is match('^[1-9][0-9]{2,8}$')
          - gpu_guest_vmid is defined
          - gpu_guest_vmid | string is match('^[1-9][0-9]{2,8}$')
          - vmid | string != gpu_guest_vmid | string
          - state is defined
          - state in ['present', 'absent']
          - >-
            state == 'absent' or
            ((cores | default('') | string) is match('^[1-9][0-9]?$') and
             (memory_mb | default('') | string) is match('^[1-9][0-9]{2,5}$') and
             (disk_gb | default('') | string) is match('^[1-9][0-9]{1,3}$') and
             (template | default('') | string | trim | length > 0))
          - >-
            state == 'absent' or
            (engine_url | default('') | string) is match('^https?://[^\s@]+/v1/?$')
        fail_msg: >-
          Provide an inventory node, distinct numeric client and guest VMIDs,
          state present or absent, and valid present-state sizing, template,
          and OpenAI-compatible engine URL values.
        quiet: true

    - name: Parse the optional image and tool overrides
      ansible.builtin.set_fact:
        benchmark_client_images: >-
          {{ (images | from_json)
             if (images is defined and images is string and images | trim | length > 0)
             else (images | default(benchmark_client_default_images)) }}
        benchmark_client_tools: >-
          {{ benchmark_client_default_tools |
             combine((tools | from_json)
                     if (tools is defined and tools is string and tools | trim | length > 0)
                     else (tools | default({}))) }}

    - name: Validate image digests and tool pins
      ansible.builtin.assert:
        that:
          - benchmark_client_images is sequence
          - benchmark_client_images is not string
          - benchmark_client_images | select('string') | list | length == benchmark_client_images | length
          - state == 'absent' or benchmark_client_images | length > 0
          - benchmark_client_images | map('string') | select('match', '^[^@\s]+@sha256:[a-f0-9]{64}$') | list | length == benchmark_client_images | length
          - benchmark_client_tools.uv is defined
          - benchmark_client_tools.uv | string is match('^[0-9]+\.[0-9]+\.[0-9]+$')
          - benchmark_client_tools.node is defined
          - benchmark_client_tools.node | string is match('^[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: >-
          Images must be a JSON array of digest-pinned references, and uv and
          node must each be pinned to a semantic version.
        quiet: true

    - name: Explain the read-only check-mode result
      ansible.builtin.debug:
        msg: >-
          Check mode validates the request and reads guest configuration only;
          it does not create, start, configure, install, pull, stop, or destroy guests.
      when: ansible_check_mode

- name: Reconcile the benchmark client on its selected node
  hosts: proxmox
  become: true
  gather_facts: false
  vars:
    benchmark_client_images: "{{ hostvars['localhost'].benchmark_client_images }}"
    benchmark_client_tools: "{{ hostvars['localhost'].benchmark_client_tools }}"
    benchmark_client_config_path: "/etc/pve/lxc/{{ vmid }}.conf"
    benchmark_client_gpu_config_path: "/etc/pve/qemu-server/{{ gpu_guest_vmid }}.conf"
  tasks:
    - name: Skip nodes other than the selected node
      ansible.builtin.debug:
        msg: "This request targets a different inventory node."
      when: inventory_hostname != node

    - name: Read the target container config path
      ansible.builtin.stat:
        path: "{{ benchmark_client_config_path }}"
      register: benchmark_client_target_file
      when: inventory_hostname == node

    - name: Read the GPU guest configuration for bridge, VLAN, and storage
      ansible.builtin.command:
        argv:
          - qm
          - config
          - "{{ gpu_guest_vmid | string }}"
      register: benchmark_client_gpu_config
      changed_when: false
      check_mode: false
      when:
        - inventory_hostname == node
        - state == 'present'

    - name: Parse the source guest network and storage settings
      ansible.builtin.set_fact:
        benchmark_client_source_net0: >-
          {{ (benchmark_client_gpu_config.stdout_lines
              | select('match', '^net0:') | list | first | default(''))
             | regex_replace('^net0:\s*', '') }}
        benchmark_client_source_disk: >-
          {{ benchmark_client_gpu_config.stdout_lines
             | select('match', '^(scsi|virtio|sata|ide)[0-9]+:')
             | list | first | default('') }}
      when:
        - inventory_hostname == node
        - state == 'present'

    - name: Require a source bridge, VLAN tag, and disk storage
      ansible.builtin.assert:
        that:
          - benchmark_client_source_net0 | regex_findall('bridge=([^,]+)') | length == 1
          - benchmark_client_source_net0 | regex_findall('tag=([^,]+)') | length == 1
          - benchmark_client_source_disk | regex_search('^[^:]+:\s*[^:]+:.+$') is not none
        fail_msg: >-
          The selected guest must have a tagged bridge and a disk whose storage
          can host the benchmark client.
        quiet: true
      when:
        - inventory_hostname == node
        - state == 'present'

    - name: Derive the benchmark client bridge, VLAN, and storage
      ansible.builtin.set_fact:
        benchmark_client_bridge: "{{ benchmark_client_source_net0 | regex_findall('bridge=([^,]+)') | first }}"
        benchmark_client_vlan: "{{ benchmark_client_source_net0 | regex_findall('tag=([^,]+)') | first }}"
        benchmark_client_storage: "{{ benchmark_client_source_disk | regex_replace('^[^:]+:\\s*([^:]+):.*$', '\\1') }}"
        benchmark_client_net0: >-
          name=eth0,bridge={{ benchmark_client_source_net0 | regex_findall('bridge=([^,]+)') | first }},
          tag={{ benchmark_client_source_net0 | regex_findall('tag=([^,]+)') | first }},firewall=1,ip=dhcp
      when:
        - inventory_hostname == node
        - state == 'present'

    - name: Read an existing client configuration
      ansible.builtin.command:
        argv:
          - pct
          - config
          - "{{ vmid | string }}"
      register: benchmark_client_existing_config
      changed_when: false
      check_mode: false
      when:
        - inventory_hostname == node
        - benchmark_client_target_file.stat.exists

    - name: Derive the existing client tag
      ansible.builtin.set_fact:
        benchmark_client_existing_tags: >-
          {{ (benchmark_client_existing_config.stdout_lines
              | select('match', '^tags:') | list | first | default(''))
             | regex_replace('^tags:\s*', '') }}
      when:
        - inventory_hostname == node
        - benchmark_client_target_file.stat.exists

    - name: Refuse to change or destroy a client without its ownership tag
      ansible.builtin.assert:
        that:
          - benchmark_client_existing_tags | regex_search('(^|;)benchmark-client($|;)') is not none
        fail_msg: "The target guest exists without the benchmark-client ownership tag."
        quiet: true
      when:
        - inventory_hostname == node
        - benchmark_client_target_file.stat.exists

    - name: Read the existing client status
      ansible.builtin.command:
        argv:
          - pct
          - status
          - "{{ vmid | string }}"
      register: benchmark_client_status
      changed_when: false
      check_mode: false
      when:
        - inventory_hostname == node
        - benchmark_client_target_file.stat.exists

    - name: Explain the absent check-mode result
      ansible.builtin.debug:
        msg: "Check mode found a tagged target; stop and destroy are skipped."
      when:
        - inventory_hostname == node
        - state == 'absent'
        - benchmark_client_target_file.stat.exists
        - ansible_check_mode

    - name: Stop the tagged client before destruction
      ansible.builtin.command:
        argv:
          - pct
          - stop
          - "{{ vmid | string }}"
      changed_when: true
      when:
        - inventory_hostname == node
        - state == 'absent'
        - benchmark_client_target_file.stat.exists
        - "'status: running' in benchmark_client_status.stdout"
        - not ansible_check_mode

    - name: Destroy the tagged benchmark client
      ansible.builtin.command:
        argv:
          - pct
          - destroy
          - "{{ vmid | string }}"
          - --purge
          - "1"
      changed_when: true
      when:
        - inventory_hostname == node
        - state == 'absent'
        - benchmark_client_target_file.stat.exists
        - not ansible_check_mode

    - name: Explain the present check-mode result
      ansible.builtin.debug:
        msg: >-
          Check mode validated the source guest and target tag; client
          provisioning and in-container checks are skipped.
      when:
        - inventory_hostname == node
        - state == 'present'
        - ansible_check_mode

    - name: Create the unprivileged benchmark client
      ansible.builtin.command:
        argv:
          - pct
          - create
          - "{{ vmid | string }}"
          - "{{ template }}"
          - --rootfs
          - "{{ benchmark_client_storage }}:{{ disk_gb }}"
          - --cores
          - "{{ cores | string }}"
          - --memory
          - "{{ memory_mb | string }}"
          - --features
          - nesting=1,keyctl=1
          - --net0
          - "{{ benchmark_client_net0 | regex_replace('\\s+', '') }}"
          - --hostname
          - "benchmark-client-{{ vmid }}"
          - --tags
          - benchmark-client
          - --unprivileged
          - "1"
          - --onboot
          - "0"
      changed_when: true
      when:
        - inventory_hostname == node
        - state == 'present'
        - not benchmark_client_target_file.stat.exists
        - not ansible_check_mode

    - name: Read the provisioned client configuration
      ansible.builtin.command:
        argv:
          - pct
          - config
          - "{{ vmid | string }}"
      register: benchmark_client_config
      changed_when: false
      check_mode: false
      when:
        - inventory_hostname == node
        - state == 'present'
        - not ansible_check_mode

    - name: Require the client configuration to match this request
      ansible.builtin.assert:
        that:
          - >-
            (benchmark_client_config.stdout_lines
             | select('match', '^tags:') | list | first | default(''))
            is search('(^|;)benchmark-client($|;)')
          - >-
            (benchmark_client_config.stdout_lines
             | select('match', '^cores:') | list | first | default(''))
            is search('^cores:\s*' ~ (cores | string) ~ '$')
          - >-
            (benchmark_client_config.stdout_lines
             | select('match', '^memory:') | list | first | default(''))
            is search('^memory:\s*' ~ (memory_mb | string) ~ '$')
          - >-
            (benchmark_client_config.stdout_lines
             | select('match', '^net0:') | list | first | default(''))
            is search('bridge=' ~ benchmark_client_bridge ~ '.*tag=' ~ benchmark_client_vlan)
          - >-
            (benchmark_client_config.stdout_lines
             | select('match', '^rootfs:') | list | first | default(''))
            is search('^rootfs:\s*' ~ benchmark_client_storage ~ ':')
          - >-
            (benchmark_client_config.stdout_lines
             | select('match', '^features:') | list | first | default(''))
            is search('nesting=1')
          - >-
            (benchmark_client_config.stdout_lines
             | select('match', '^features:') | list | first | default(''))
            is search('keyctl=1')
          - >-
            (benchmark_client_config.stdout_lines
             | select('match', '^unprivileged:') | list | first | default(''))
            is search('^unprivileged:\s*1$')
        fail_msg: >-
          The tagged client configuration differs from the requested CPU,
          memory, bridge, VLAN, or storage. Destroy and recreate it to change sizing.
        quiet: true
      when:
        - inventory_hostname == node
        - state == 'present'
        - not ansible_check_mode

    - name: Read the client status after provisioning
      ansible.builtin.command:
        argv:
          - pct
          - status
          - "{{ vmid | string }}"
      register: benchmark_client_status_after
      changed_when: false
      check_mode: false
      when:
        - inventory_hostname == node
        - state == 'present'
        - not ansible_check_mode

    - name: Start the benchmark client when stopped
      ansible.builtin.command:
        argv:
          - pct
          - start
          - "{{ vmid | string }}"
      changed_when: true
      when:
        - inventory_hostname == node
        - state == 'present'
        - "'status: stopped' in benchmark_client_status_after.stdout"
        - not ansible_check_mode

    - name: Update package indexes in the client
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ vmid | string }}"
          - --
          - apt-get
          - update
      register: benchmark_client_apt_update
      changed_when: false
      when:
        - inventory_hostname == node
        - state == 'present'
        - not ansible_check_mode

    - name: Install Docker and benchmark runtime prerequisites
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ vmid | string }}"
          - --
          - env
          - DEBIAN_FRONTEND=noninteractive
          - apt-get
          - install
          - --yes
          - --no-install-recommends
          - ca-certificates
          - curl
          - docker.io
          - python3
          - python3-venv
      register: benchmark_client_apt_install
      changed_when: >-
        'Unpacking ' in benchmark_client_apt_install.stdout or
        'Setting up ' in benchmark_client_apt_install.stdout
      when:
        - inventory_hostname == node
        - state == 'present'
        - not ansible_check_mode

    - name: Read Docker service state
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ vmid | string }}"
          - --
          - systemctl
          - "{{ item }}"
          - docker
      loop:
        - is-active
        - is-enabled
      register: benchmark_client_docker_state
      changed_when: false
      failed_when: false
      when:
        - inventory_hostname == node
        - state == 'present'
        - not ansible_check_mode

    - name: Enable and start Docker when inactive
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ vmid | string }}"
          - --
          - systemctl
          - enable
          - --now
          - docker
      register: benchmark_client_docker_enable
      changed_when: >-
        benchmark_client_docker_state.results[0].stdout != 'active' or
        benchmark_client_docker_state.results[1].stdout != 'enabled'
      when:
        - inventory_hostname == node
        - state == 'present'
        - >-
          benchmark_client_docker_state.results[0].stdout != 'active' or
          benchmark_client_docker_state.results[1].stdout != 'enabled'
        - not ansible_check_mode
      failed_when: benchmark_client_docker_enable.rc != 0

    - name: Read the installed uv version
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ vmid | string }}"
          - --
          - uv
          - --version
      register: benchmark_client_uv_version
      changed_when: false
      failed_when: false
      when:
        - inventory_hostname == node
        - state == 'present'
        - not ansible_check_mode

    - name: Install the pinned uv release when needed
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ vmid | string }}"
          - --
          - bash
          - -euo
          - pipefail
          - -c
          - >-
            curl --proto '=https' --tlsv1.2 -LsSf
            https://astral.sh/uv/{{ benchmark_client_tools.uv }}/install.sh
            | env UV_INSTALL_DIR=/usr/local/bin UV_NO_MODIFY_PATH=1 sh
      changed_when: true
      when:
        - inventory_hostname == node
        - state == 'present'
        - benchmark_client_uv_version.rc != 0 or benchmark_client_uv_version.stdout != 'uv ' ~ benchmark_client_tools.uv
        - not ansible_check_mode

    - name: Read the installed Node version
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ vmid | string }}"
          - --
          - node
          - --version
      register: benchmark_client_node_version
      changed_when: false
      failed_when: false
      when:
        - inventory_hostname == node
        - state == 'present'
        - not ansible_check_mode

    - name: Install the pinned Node release when needed
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ vmid | string }}"
          - --
          - bash
          - -euo
          - pipefail
          - -c
          - |
            version='{{ benchmark_client_tools.node }}'
            archive="node-v${version}-linux-x64.tar.xz"
            temporary_directory="$(mktemp -d)"
            trap 'rm -rf "$temporary_directory"' EXIT
            curl -fsSLo "${temporary_directory}/${archive}" "https://nodejs.org/dist/v${version}/${archive}"
            curl -fsSL "https://nodejs.org/dist/v${version}/SHASUMS256.txt" \
              | grep -F "  ${archive}" \
              | sha256sum --check --status
            mkdir -p "/opt/node-v${version}"
            tar -xJf "${temporary_directory}/${archive}" -C "/opt/node-v${version}" --strip-components=1
            for binary in node npm npx; do
              ln -sfn "/opt/node-v${version}/bin/${binary}" "/usr/local/bin/${binary}"
            done
      changed_when: true
      when:
        - inventory_hostname == node
        - state == 'present'
        - benchmark_client_node_version.rc != 0 or benchmark_client_node_version.stdout != 'v' ~ benchmark_client_tools.node
        - not ansible_check_mode

    - name: Verify the installed tool versions
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ vmid | string }}"
          - --
          - "{{ item.command }}"
          - "{{ item.argument }}"
      loop:
        - command: uv
          argument: --version
        - command: node
          argument: --version
      loop_control:
        label: "{{ item.command }}"
      register: benchmark_client_tool_versions
      changed_when: false
      when:
        - inventory_hostname == node
        - state == 'present'
        - not ansible_check_mode

    - name: Require the pinned tool versions
      ansible.builtin.assert:
        that:
          - benchmark_client_tool_versions.results[0].stdout == 'uv ' ~ benchmark_client_tools.uv
          - benchmark_client_tool_versions.results[1].stdout == 'v' ~ benchmark_client_tools.node
        fail_msg: "The benchmark client does not have the requested uv and Node versions."
        quiet: true
      when:
        - inventory_hostname == node
        - state == 'present'
        - not ansible_check_mode

    - name: Inspect which images are already present
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ vmid | string }}"
          - --
          - docker
          - image
          - inspect
          - "{{ item }}"
      loop: "{{ benchmark_client_images }}"
      loop_control:
        label: "{{ item.split('@') | first }}"
      register: benchmark_client_image_inspections
      changed_when: false
      failed_when: false
      when:
        - inventory_hostname == node
        - state == 'present'
        - not ansible_check_mode

    - name: Pull missing digest-pinned images
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ vmid | string }}"
          - --
          - docker
          - pull
          - "{{ item.item }}"
      loop: "{{ benchmark_client_image_inspections.results | default([]) }}"
      loop_control:
        label: "{{ item.item.split('@') | first }}"
      changed_when: true
      when:
        - inventory_hostname == node
        - state == 'present'
        - item.rc != 0
        - not ansible_check_mode

    - name: Verify the engine API responds from the client
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ vmid | string }}"
          - --
          - curl
          - --fail
          - --silent
          - --show-error
          - --max-time
          - "10"
          - --output
          - /dev/null
          - "{{ engine_url | regex_replace('/+$', '') }}/models"
      register: benchmark_client_engine_check
      changed_when: false
      no_log: true
      when:
        - inventory_hostname == node
        - state == 'present'
        - not ansible_check_mode
