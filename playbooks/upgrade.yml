---
# Upgrade Proxmox VE nodes to the latest point release, snapshotting each
# target before its serial HA-aware upgrade and version check.
# Scheduled every Saturday; after the first Saturday (UTC), it targets nothing.
# Usage (test — power-on, snapshot and reboot are skipped in check mode):
#   ./scripts/run-ansible.sh playbooks/upgrade.yml --check --diff
# Usage (apply one node — run with console access available; it reboots):
#   ./scripts/run-ansible.sh playbooks/upgrade.yml -e upgrade_nodes=<node>

- name: Resolve the upgrade targets
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - always
  tasks:
    - name: Target nothing on Saturdays after the first of the month (UTC)
      ansible.builtin.set_fact:
        upgrade_hosts: >-
          {{ [] if (now(utc=true, fmt='%w') == '6' and now(utc=true, fmt='%d') | int > 7)
             else (upgrade_nodes | default('proxmox', true)) }}

    - name: Report the upgrade targets
      ansible.builtin.debug:
        msg: "Upgrade targets: {{ upgrade_hosts if upgrade_hosts else 'none (not the first Saturday of the month, UTC)' }}"

    - name: Group the upgrade targets
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: upgrade_targets
      loop: "{{ query('inventory_hostnames', upgrade_hosts) if upgrade_hosts else [] }}"

- name: Power on powered-off quorum voters
  hosts: proxmox
  become: true
  gather_facts: false
  tags:
    - always
  tasks:
    - name: Power on and rejoin listed voters
      when:
        - not ansible_check_mode
        - groups['upgrade_targets'] | default([]) | length > 0
        - (proxmox_node_name | default(inventory_hostname)) in pve_quorum_guard_powered_off_voters
      block:
        - name: Power on this voter with the iDRAC role
          ansible.builtin.include_role:
            name: idrac_power
          vars:
            idrac_power_action: "on"

        - name: Wait for this voter to rejoin the cluster
          ansible.builtin.include_role:
            name: pve_upgrade
            tasks_from: wait_full_quorum

- name: Snapshot the root dataset before upgrading
  import_playbook: snapshot.yml
  vars:
    pve_snapshot_hosts: upgrade_targets

- name: Upgrade Proxmox VE nodes
  hosts: upgrade_targets
  become: true
  gather_facts: true

  # Every voter is powered on by the play above, so none is discounted and the
  # guard requires one vote of headroom: the node about to reboot.
  vars:
    pve_quorum_guard_min_headroom: 1
    pve_quorum_guard_powered_off_voters: []

  # One node at a time. Without this, `-l proxmox` apt-upgrades and reboots every
  # node in the cluster simultaneously: corosync loses quorum, HA guests have
  # nowhere to migrate to, and the estate goes down all at once. Serial rolling
  # is the only safe shape for an operation that reboots.
  serial: 1

  # Stop the rollout at the first node that fails rather than carrying on into
  # the next one. A node that failed to upgrade or failed to come back is a
  # reason to look, not a reason to do it again elsewhere.
  max_fail_percentage: 0

  pre_tasks:
    - name: Require every expected vote before touching this node
      ansible.builtin.include_role:
        name: pve_upgrade
        tasks_from: wait_full_quorum
      tags:
        - always

    - name: Require quorum headroom before touching this node
      ansible.builtin.import_role:
        name: pve_quorum_guard
      tags:
        - always

  roles:
    - role: pve_repositories
      tags:
        - pve_repositories
    - role: nvidia_driver
      tags:
        - nvidia_driver
    - role: pve_upgrade
      tags:
        - pve_upgrade
