---
# Power-act on one Proxmox guest by VMID, on whichever node it is live on.
#
# Required extra vars: guest_power_vmid, guest_power_type (qemu|lxc),
# guest_power_action (start|stop|shutdown|reboot|reset). The node is read from
# the cluster's live placement, never supplied. Transport is the same root SSH
# access the proxmox inventory hosts already use; no API token is involved.
#
# Node-wide: guest_power_action=startall|stopall with guest_power_node (a proxmox
# inventory host) and optional guest_power_vms (comma VMIDs). No VMID or type.
# The node's own pvesh call runs the action; the read-back play then has no host.
#
# load_tofu.yml runs first so the proxmox hosts carry proxmox_user_from_tofu,
# the login user that ansible_user resolves from.

- name: Load OpenTofu host services
  ansible.builtin.import_playbook: load_tofu.yml

- name: Power-act on one Proxmox guest
  hosts: localhost
  become: false
  gather_facts: false

  roles:
    - role: guest_power
      tags:
        - guest_power

- name: Read the guest's end state back on its live node
  hosts: guest_power_node
  become: false
  gather_facts: false

  tasks:
    - name: Confirm the guest is in the wanted state
      ansible.builtin.command:
        argv: ["{{ hostvars['localhost'].guest_power_tool }}", status, "{{ guest_power_vmid }}"]
      register: guest_power_readback
      changed_when: false
      failed_when: >-
        ('status: ' ~ hostvars['localhost'].guest_power_wanted_status)
        not in guest_power_readback.stdout
      tags:
        - guest_power
