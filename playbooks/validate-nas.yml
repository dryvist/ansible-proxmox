---
- name: Load OpenTofu inventory
  import_playbook: load_tofu.yml

# Validates the SMB service on whichever nodes actually declare a share.
# Under the per-dataset contract most nodes declare none, so this play is a
# no-op there rather than a failure.
#
# Dataset existence, quotas and mountpoints are deliberately NOT checked here:
# zfs_pools owns them and asserts them itself. Re-checking them from this
# playbook would test the same declaration twice and still miss the thing only
# this playbook can prove -- that Samba actually serves the share.
- name: Validate Proxmox SMB shares
  hosts: proxmox
  become: true
  gather_facts: true

  vars:
    nas_validate_shares: "{{ (nas_storage_from_tofu | default({}, true)).shares | default([], true) }}"
    nas_validate_user: "{{ ((nas_storage_from_tofu | default({}, true)).managed_users | default([], true) | first) | default({}, true) }}"
    # Same identity source as the role: a login name is a secret, so it is
    # resolved from OpenBao rather than read out of the declaration.
    nas_validate_bao_addr: >-
      {{ lookup('env', 'BAO_ADDR')
         | default(lookup('env', 'VAULT_ADDR') | default('', true), true) }}
    nas_validate_bao_token: "{{ lookup('env', 'BAO_TOKEN') | default('', true) }}"
    nas_validate_bao_path: secret/data/apps/nas
    # Empty rather than undefined, for the same reason as the role's default:
    # indexing an undefined variable raises before `default()` applies.
    nas_validate_secrets: {}

  tasks:
    - name: Skip nodes that declare no share
      ansible.builtin.meta: end_host
      when: nas_validate_shares | length == 0

    - name: Verify each declared share path exists
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ nas_validate_shares }}"
      loop_control:
        label: "{{ item.name }} -> {{ item.path }}"
      register: nas_validate_paths

    - name: Assert every share path is a directory
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: >-
          Share {{ item.item.name }} points at {{ item.item.path }}, which is
          not a directory. The dataset behind it is missing -- run zfs_pools.
      loop: "{{ nas_validate_paths.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    # testparm reports the EFFECTIVE config, so this catches a share that
    # rendered but was rejected, which a file-exists check cannot.
    - name: Read the effective Samba configuration
      ansible.builtin.command:
        cmd: testparm -s
      register: nas_validate_testparm
      changed_when: false

    - name: Assert every declared share is present in the effective config
      ansible.builtin.assert:
        that:
          - "'[' ~ item.name ~ ']' in nas_validate_testparm.stdout"
        fail_msg: >-
          Share {{ item.name }} is declared but absent from the effective
          Samba configuration -- Samba parsed the file and dropped it.
      loop: "{{ nas_validate_shares }}"
      loop_control:
        label: "{{ item.name }}"

    # Resolve the managed account's credentials from OpenBao. Skipped rather
    # than failed when the converge has no token, so the config checks above
    # still run without credentials.
    - name: Read the managed-account identity from OpenBao
      ansible.builtin.uri:
        url: "{{ nas_validate_bao_addr }}/v1/{{ nas_validate_bao_path }}"
        headers:
          X-Vault-Token: "{{ nas_validate_bao_token }}"
        follow_redirects: all
      register: nas_validate_bao_read
      delegate_to: localhost
      run_once: true
      become: false
      no_log: true
      when:
        - nas_validate_user.secret_prefix is defined
        - nas_validate_bao_addr | length > 0
        - nas_validate_bao_token | length > 0

    - name: Set the managed-account identity map
      ansible.builtin.set_fact:
        nas_validate_secrets: >-
          {{ ((nas_validate_bao_read.json | default({}, true)).data
              | default({}, true)).data | default({}, true) }}
      run_once: true
      no_log: true
      when: not (nas_validate_bao_read.skipped | default(false))

    # The only check here that exercises the SERVICE rather than its config.
    - name: Authenticate to the share list as the managed account
      ansible.builtin.command:
        cmd: >-
          smbclient -L localhost -U {{
            nas_validate_secrets[nas_validate_user.secret_prefix ~ '_username'] }}%{{
            nas_validate_secrets[nas_validate_user.secret_prefix ~ '_password'] }}
      register: nas_validate_smbclient
      changed_when: false
      no_log: true
      when:
        - nas_validate_user.secret_prefix is defined
        - nas_validate_secrets is defined
        - nas_validate_secrets[nas_validate_user.secret_prefix ~ '_username'] | default('', true) | length > 0
        - nas_validate_secrets[nas_validate_user.secret_prefix ~ '_password'] | default('', true) | length > 0

    - name: Assert the served share list matches the declaration
      ansible.builtin.assert:
        that:
          - item.name in nas_validate_smbclient.stdout
        fail_msg: >-
          Share {{ item.name }} is configured but smbd did not advertise it to
          an authenticated client.
      loop: "{{ nas_validate_shares }}"
      loop_control:
        label: "{{ item.name }}"
      when: not (nas_validate_smbclient.skipped | default(false))
