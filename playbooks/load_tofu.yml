---
- name: Load OpenTofu Host Services
  hosts: localhost
  become: false
  gather_facts: false
  tags: always

  # Inventory source resolution (priority order, first that resolves wins):
  #   1. TOFU_INVENTORY_PATH  — explicit local path / pin (tests, overrides)
  #   2. S3 published artifact — `terragrunt apply` publishes the RAW tofu output
  #      to the state bucket; CI runners and cloud agents fetch it with only
  #      scoped read creds (no checkout, no toolchain). Location override:
  #      TOFU_INVENTORY_S3_URI, else derived from the AWS account id.
  #   3. inventory/tofu_inventory.json — the local gitignored cache (dev)
  # The artifact is consumed RAW (standard tofu output); the tasks below adapt it
  # into per-host facts.
  vars:
    tofu_inventory_path: "{{ lookup('env', 'TOFU_INVENTORY_PATH') | default('', true) }}"
    tofu_inventory_local: "{{ playbook_dir }}/../inventory/tofu_inventory.json"
    tofu_inventory_s3_uri: "{{ lookup('env', 'TOFU_INVENTORY_S3_URI') | default('', true) }}"
    tofu_inventory_s3_region: "{{ lookup('env', 'TOFU_INVENTORY_S3_REGION') | default('us-east-2', true) }}"

  tasks:
    - name: Stat the explicit TOFU_INVENTORY_PATH
      ansible.builtin.stat:
        path: "{{ tofu_inventory_path }}"
      register: tofu_inv_explicit
      when: tofu_inventory_path | length > 0

    - name: Resolve inventory from the explicit path when it exists
      ansible.builtin.set_fact:
        tofu_inventory_resolved: "{{ tofu_inventory_path }}"
      when:
        - tofu_inventory_path | length > 0
        - tofu_inv_explicit.stat.exists | default(false)

    # Native amazon.aws modules (boto3 from the dev shell) — no `aws` CLI
    # dependency. Both lookups are best-effort: on missing creds/boto3 the
    # chain falls through to the local cache, mirroring the explicit-path step.
    - name: Resolve the published S3 inventory
      when: tofu_inventory_resolved is not defined
      block:
        - name: Derive the AWS account when no S3 URI is set
          amazon.aws.aws_caller_info:
          register: tofu_inv_aws_acct
          failed_when: false
          when: tofu_inventory_s3_uri | length == 0

        - name: Compute the effective S3 inventory URI
          ansible.builtin.set_fact:
            tofu_inventory_s3_effective: >-
              {{
                tofu_inventory_s3_uri if tofu_inventory_s3_uri | length > 0
                else (
                  's3://terraform-proxmox-state-useast2-'
                  ~ tofu_inv_aws_acct.account
                  ~ '/terraform-proxmox/inventory/ansible_inventory.json'
                ) if tofu_inv_aws_acct.account is defined
                else ''
              }}

        # Inventory resolution is read-only and must work under --check too
        # (tempfile creates no path in check mode, which would blow up the
        # download's dest templating before failed_when applies) — so the
        # fetch pair always really runs (check_mode: false).
        - name: Fetch the published inventory from S3
          when: tofu_inventory_s3_effective | length > 0
          block:
            - name: Create a temp file for the S3 inventory
              ansible.builtin.tempfile:
                state: file
                suffix: tofu_inventory.json
              register: tofu_inv_tmp
              check_mode: false

            - name: Download the inventory from S3
              amazon.aws.s3_object:
                bucket: "{{ tofu_inventory_s3_effective | regex_replace('^s3://([^/]+)/.*$', '\\1') }}"
                object: "{{ tofu_inventory_s3_effective | regex_replace('^s3://[^/]+/', '') }}"
                dest: "{{ tofu_inv_tmp.path }}"
                mode: get
                region: "{{ tofu_inventory_s3_region }}"
              register: tofu_inv_s3
              changed_when: false
              failed_when: false
              check_mode: false

            # failed_when:false masks the module's failed flag, so success is
            # judged by the artifact itself: the GET overwrote the empty temp
            # file with content.
            - name: Stat the downloaded inventory
              ansible.builtin.stat:
                path: "{{ tofu_inv_tmp.path }}"
              register: tofu_inv_s3_stat

            - name: Resolve inventory from the S3 download when it succeeded
              ansible.builtin.set_fact:
                tofu_inventory_resolved: "{{ tofu_inv_tmp.path }}"
              when: (tofu_inv_s3_stat.stat.size | default(0)) > 0

    - name: Stat the local inventory cache
      ansible.builtin.stat:
        path: "{{ tofu_inventory_local }}"
      register: tofu_inv_localstat
      when: tofu_inventory_resolved is not defined

    - name: Resolve inventory from the local cache when present
      ansible.builtin.set_fact:
        tofu_inventory_resolved: "{{ tofu_inventory_local }}"
      when:
        - tofu_inventory_resolved is not defined
        - tofu_inv_localstat.stat.exists | default(false)

    - name: Fail when no inventory source resolves
      ansible.builtin.fail:
        msg: |
          OpenTofu inventory could not be resolved from any source:
            1. TOFU_INVENTORY_PATH : {{ tofu_inventory_path | default('(unset)', true) }}
            2. S3 artifact         : {{ tofu_inventory_s3_effective | default('(no AWS creds / URI)', true) }}
            3. local cache         : {{ tofu_inventory_local }}

          Provide ONE of:
            - Read creds for the S3 artifact (CI: OIDC role; agents: scoped role);
              optionally set TOFU_INVENTORY_S3_URI to override the location.
            - TOFU_INVENTORY_PATH pointing at a local copy.
            - Run terraform-proxmox apply so the after-hook publishes + syncs.
      when: tofu_inventory_resolved is not defined

    - name: Load tofu inventory JSON
      ansible.builtin.include_vars:
        file: "{{ tofu_inventory_resolved }}"
        name: tofu_data

    - name: Validate NAS host_services structure
      ansible.builtin.assert:
        that:
          - tofu_data is defined
          - tofu_data.host_services is defined
          - tofu_data.host_services.nas is defined
          - tofu_data.host_services.nas.zfs_dataset is defined
          - tofu_data.host_services.nas.mount_point is defined
          - tofu_data.host_services.nas.directories is defined
        fail_msg: |
          tofu_data.host_services.nas is missing or incomplete in
          tofu_inventory.json.

          Expected terraform-proxmox ansible_inventory output to include the
          NAS contract under host_services.nas.

          Re-run terraform-proxmox apply or export ansible_inventory again.

    - name: Inject OpenTofu NAS config onto proxmox hosts
      ansible.builtin.add_host:
        name: "{{ item }}"
        nas_storage_from_tofu: "{{ tofu_data.host_services.nas }}"
      loop: "{{ groups['proxmox'] | default([]) }}"

    # Per-node ZFS storage (node_storage) is optional — present only once the
    # terraform-proxmox multi-node contract is applied. Keyed by each host's
    # `proxmox_node_name` (the tofu node name; e.g. an inventory host
    # `node-a` maps to tofu node `pve2`), defaulting to inventory_hostname.
    - name: Inject OpenTofu per-node ZFS storage onto proxmox hosts
      ansible.builtin.add_host:
        name: "{{ item }}"
        zfs_pools_from_tofu: >-
          {{ (tofu_data.node_storage | default({}))[hostvars[item].proxmox_node_name | default(item)] | default({}) }}
        cluster_nodes_from_tofu: "{{ tofu_data.nodes | default({}) }}"
      loop: "{{ groups['proxmox'] | default([]) }}"

    # Service -> VMID resolution for media_lxc_features. The tofu
    # `containers` dict is keyed by service hostname and carries each container's
    # current `vmid`; project it to { service: vmid } so the role can key its
    # feature map by service and follow any VMID renumber with no role change.
    # The role only resolves the services it knows about, so the extra
    # (non-media) entries are harmless.
    - name: Inject OpenTofu service -> vmid map onto proxmox hosts
      ansible.builtin.add_host:
        name: "{{ item }}"
        media_lxc_features_service_vmids_from_tofu: >-
          {{
            dict(
              (tofu_data.containers | default({})) | dict2items
              | selectattr('value.vmid', 'defined')
              | map(attribute='key') | list
              | zip(
                  (tofu_data.containers | default({})) | dict2items
                  | selectattr('value.vmid', 'defined')
                  | map(attribute='value.vmid') | list
                )
            )
          }}
      loop: "{{ groups['proxmox'] | default([]) }}"

    # Service -> VMID resolution for lxc_gpu_features (GPU passthrough). Same
    # projection as the media map above, exposed under its own var so the GPU
    # role has no coupling to media naming. Extra (non-GPU) entries are harmless.
    - name: Inject OpenTofu service -> vmid map for GPU passthrough onto proxmox hosts
      ansible.builtin.add_host:
        name: "{{ item }}"
        lxc_gpu_features_service_vmids_from_tofu: >-
          {{
            dict(
              (tofu_data.containers | default({})) | dict2items
              | selectattr('value.vmid', 'defined')
              | map(attribute='key') | list
              | zip(
                  (tofu_data.containers | default({})) | dict2items
                  | selectattr('value.vmid', 'defined')
                  | map(attribute='value.vmid') | list
                )
            )
          }}
      loop: "{{ groups['proxmox'] | default([]) }}"

    # Splunk VM identity (node + vmid) for the sanoid/syncoid replication config.
    # Lets host_vars derive the source node + vmid from tofu instead of
    # hard-coding node names (keyed by splunk instance, currently "splunk").
    - name: Inject OpenTofu Splunk VM identity onto proxmox hosts
      ansible.builtin.add_host:
        name: "{{ item }}"
        splunk_vm_from_tofu: "{{ tofu_data.splunk_vm | default({}) }}"
      loop: "{{ groups['proxmox'] | default([]) }}"
