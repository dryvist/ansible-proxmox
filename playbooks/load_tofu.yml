---
- name: Load OpenTofu Host Services
  hosts: localhost
  become: false
  gather_facts: false
  tags: always

  tasks:
    # Inventory resolution (TOFU_INVENTORY_PATH -> RustFS via OpenBao ->
    # opt-in local cache) is delegated to the shared inventory_resolve
    # role (dryvist/homelab-contracts), which ends with `tofu_data` loaded. The
    # repo-specific NAS assert and add_host group mapping stay below.
    - name: Resolve the published OpenTofu inventory
      ansible.builtin.include_role:
        name: dryvist.homelab.inventory_resolve
      vars:
        inventory_resolve_required_keys: [node_storage]

    # SMB shares are declared ON the dataset they serve, inside
    # node_storage.<node>.pools.<pool>.datasets.<dataset>.smb, with the
    # node-level Samba SERVICE settings under node_storage.<node>.smb.
    #
    # This replaces the former global host_services.nas, which had no node
    # selector at all: every node built an identical NAS, with identical share
    # names at an identical mount point, so "which node is the NAS?" had no
    # answer. Here the map key IS the selector, and a share cannot reference a
    # dataset that does not exist because it is declared inside one.
    #
    # Built as JSON and decoded rather than emitted directly: a template that
    # opens with {% set %} is no longer a single expression, so it renders to
    # TEXT and the structure would arrive as a string.
    - name: Build the per-node NAS configuration from node_storage
      ansible.builtin.set_fact:
        nas_storage_by_node_json: >-
          {%- set out = {} -%}
          {%- for node, ns in (tofu_data.node_storage | default({}, true)).items() -%}
            {%- set shares = [] -%}
            {%- for pool, pd in (ns.pools | default({}, true)).items() -%}
              {%- for dsname, ds in (pd.datasets | default({}, true)).items() -%}
                {%- if ds.smb | default({}, true) -%}
                  {%- set _ = shares.append(ds.smb | combine({
                        'name': ds.smb.share_name,
                        'path': ds.mountpoint | default('/' ~ pool ~ '/' ~ dsname, true)})) -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {%- if shares -%}
              {%- set _ = out.update({node: (ns.smb | default({}, true))
                                            | combine({'shares': shares})}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out | to_json }}

    - name: Decode the per-node NAS configuration
      ansible.builtin.set_fact:
        nas_storage_by_node: "{{ nas_storage_by_node_json | from_json }}"

    # A node with no shared dataset gets {} and the nas_storage role skips
    # entirely. That is the normal case for most nodes, not an error -- which
    # is why the role no longer asserts that at least one share exists.
    - name: Inject OpenTofu NAS config onto proxmox hosts
      ansible.builtin.add_host:
        name: "{{ item }}"
        nas_storage_from_tofu: >-
          {{ nas_storage_by_node[hostvars[item].proxmox_node_name | default(item)]
             | default({}, true) }}
      loop: "{{ groups['proxmox'] | default([]) }}"

    # Per-node ZFS storage (node_storage) is optional — present only once the
    # terraform-proxmox multi-node contract is applied. Keyed by each host's
    # `proxmox_node_name` (the tofu node name; e.g. an inventory host
    # `node-a` maps to tofu node `node-b`), defaulting to inventory_hostname.
    - name: Inject OpenTofu per-node ZFS storage onto proxmox hosts
      ansible.builtin.add_host:
        name: "{{ item }}"
        zfs_pools_from_tofu: >-
          {{ (tofu_data.node_storage | default({}))[hostvars[item].proxmox_node_name | default(item)] | default({}) }}
        cluster_nodes_from_tofu: "{{ tofu_data.nodes | default({}) }}"
      loop: "{{ groups['proxmox'] | default([]) }}"

    # A node_storage entry is looked up by proxmox_node_name, so a node key
    # that drifts from tofu's (a rename on one side only) resolves to an empty
    # map -- and zfs_pools then no-ops at rc=0 with changed=0, which reads as
    # "already converged". That is exactly what a stale ordinal-style key did
    # while tofu had already moved to the hardware-keyed form.
    #
    # Not asserted per host: a node legitimately absent from node_storage is
    # allowed. What is never legitimate is a NON-EMPTY node_storage matching
    # NO host at all, which is the signature of a key-scheme drift.
    - name: Assert the node_storage lookup matched at least one host
      ansible.builtin.assert:
        that:
          - (tofu_data.node_storage | default({})) | length == 0
            or (groups['proxmox'] | default([])
                | map('extract', hostvars, 'zfs_pools_from_tofu')
                | select('truthy') | list | length) > 0
        fail_msg: >-
          The published inventory declares
          {{ (tofu_data.node_storage | default({})) | length }} node_storage
          entries ({{ (tofu_data.node_storage | default({})).keys() | list }}),
          but none matched a host's proxmox_node_name
          ({{ groups['proxmox'] | default([])
              | map('extract', hostvars, 'proxmox_node_name') | list }}).
          Every consuming role would skip silently at rc=0. The two key schemes
          have drifted -- reconcile the inventory key with the tofu node name.
        success_msg: >-
          node_storage matched
          {{ groups['proxmox'] | default([])
             | map('extract', hostvars, 'zfs_pools_from_tofu')
             | select('truthy') | list | length }} of
          {{ groups['proxmox'] | default([]) | length }} hosts.
      when: groups['proxmox'] | default([]) | length > 0

    # Base LXC appliance template. tofu creates every container from
    # `local:vztmpl/<this>`, so each node must hold it; pve_repositories does the
    # download. Optional on purpose — an inventory published before tofu-proxmox
    # started emitting the key simply leaves it unset, and pve_repositories then
    # ensures nothing rather than guessing a filename that would be wrong.
    - name: Inject the base LXC template name onto proxmox hosts
      ansible.builtin.add_host:
        name: "{{ item }}"
        ct_template_from_tofu: "{{ tofu_data.ct_template | default('') }}"
      loop: "{{ groups['proxmox'] | default([]) }}"

    # Service -> VMID resolution for media_lxc_features. The tofu
    # `containers` dict is keyed by service hostname and carries each container's
    # current `vmid`; project it to { service: vmid } so the role can key its
    # feature map by service and follow any VMID renumber with no role change.
    # The role only resolves the services it knows about, so the extra
    # (non-media) entries are harmless.
    - name: Inject OpenTofu service -> vmid map onto proxmox hosts
      ansible.builtin.add_host:
        name: "{{ item }}"
        media_lxc_features_service_vmids_from_tofu: >-
          {{
            dict(
              (tofu_data.containers | default({})) | dict2items
              | selectattr('value.ansible_pct_vmid', 'defined')
              | map(attribute='key') | list
              | zip(
                  (tofu_data.containers | default({})) | dict2items
                  | selectattr('value.ansible_pct_vmid', 'defined')
                  | map(attribute='value.ansible_pct_vmid') | list
                )
            )
          }}
      loop: "{{ groups['proxmox'] | default([]) }}"

    # Service -> VMID resolution for lxc_gpu_features (GPU passthrough). Same
    # projection as the media map above, exposed under its own var so the GPU
    # role has no coupling to media naming. Extra (non-GPU) entries are harmless.
    - name: Inject OpenTofu service -> vmid map for GPU passthrough onto proxmox hosts
      ansible.builtin.add_host:
        name: "{{ item }}"
        lxc_gpu_features_service_vmids_from_tofu: >-
          {{
            dict(
              (tofu_data.containers | default({})) | dict2items
              | selectattr('value.ansible_pct_vmid', 'defined')
              | map(attribute='key') | list
              | zip(
                  (tofu_data.containers | default({})) | dict2items
                  | selectattr('value.ansible_pct_vmid', 'defined')
                  | map(attribute='value.ansible_pct_vmid') | list
                )
            )
          }}
      loop: "{{ groups['proxmox'] | default([]) }}"

    # Fail loud when the projection comes out empty against a non-empty
    # container map. Both maps above are consumed by roles that iterate them:
    # an empty map makes those roles no-op at rc=0 with changed=0, which reads
    # as "already converged" and is indistinguishable from success. Every task
    # is skipped, nothing is reported, and the guests quietly never receive
    # their device bindings.
    #
    # That is not hypothetical — it is what a wrong attribute name did here.
    - name: Assert the service -> vmid projections resolved
      ansible.builtin.assert:
        that:
          - (tofu_data.containers | default({})) | length == 0
            or (hostvars[groups['proxmox'][0]].lxc_gpu_features_service_vmids_from_tofu
                | default({}) | length) > 0
        fail_msg: >-
          The published inventory has
          {{ (tofu_data.containers | default({})) | length }} containers, but the
          service -> vmid projection resolved to none. The container entries do
          not carry the attribute this projection selects on, so every consuming
          role would skip silently at rc=0. Compare the key names in the
          published ansible_inventory against the selectattr above.
        success_msg: >-
          Service -> vmid projection resolved
          {{ hostvars[groups['proxmox'][0]].lxc_gpu_features_service_vmids_from_tofu
             | default({}) | length }} of
          {{ (tofu_data.containers | default({})) | length }} containers.
      when: groups['proxmox'] | default([]) | length > 0

    # Splunk VM identity (node + vmid) for the sanoid/syncoid replication config.
    # Lets host_vars derive the source node + vmid from tofu instead of
    # hard-coding node names (keyed by splunk instance, currently "splunk").
    - name: Inject OpenTofu Splunk VM identity onto proxmox hosts
      ansible.builtin.add_host:
        name: "{{ item }}"
        splunk_vm_from_tofu: "{{ tofu_data.splunk_vm | default({}) }}"
      loop: "{{ groups['proxmox'] | default([]) }}"

    # Raw container identity map (service-key -> { vmid, node, ... }) for the
    # sanoid/syncoid replication config. Lets host_vars derive a container's
    # current vmid from tofu (e.g. containers_from_tofu['s3'].vmid)
    # instead of hard-coding it, so a VMID renumber flows through with no edit.
    # Pass-through like splunk_vm/nas above; `| default({})` keeps it inert when
    # the key is absent (e.g. the hermetic test fixture).
    - name: Inject OpenTofu container identity onto proxmox hosts
      ansible.builtin.add_host:
        name: "{{ item }}"
        containers_from_tofu: "{{ tofu_data.containers | default({}) }}"
      loop: "{{ groups['proxmox'] | default([]) }}"

    # Estate domain, so host_vars can build guest FQDNs (e.g. the
    # postgres_standby source_host) instead of hard-coding an IP or domain.
    # Empty when absent (test fixture) — consumers gate on non-empty.
    - name: Inject OpenTofu domain onto proxmox hosts
      ansible.builtin.add_host:
        name: "{{ item }}"
        domain_from_tofu: "{{ tofu_data.domain | default('') }}"
      loop: "{{ groups['proxmox'] | default([]) }}"
