---
# Replace the image of OCI-image LXCs (tag oci-app) while keeping each CT's
# CT-owned mpN volumes. One node at a time; a failed CT stops the rollout.
#
# Dry run is the default: the run reads state and prints the planned actions.
# Applying needs an explicit opt-out, with the request as extra vars:
#   ./scripts/run-ansible.sh playbooks/oci_app_upgrade.yml -e @request.yml -e oci_app_upgrade_dry_run=false
#
# request.yml holds oci_app_upgrades, a list of {vmid, image, template,
# current_template, health_url}. See roles/oci_app_upgrade/README.md.

- name: Load OpenTofu inventory (containers_from_tofu -> proxmox hosts)
  ansible.builtin.import_playbook: load_tofu.yml

- name: Validate the OCI app image upgrade request
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  tasks:
    - name: Require a request with at least one CT
      ansible.builtin.assert:
        that:
          - oci_app_upgrades is defined
          - oci_app_upgrades | length > 0
        fail_msg: Pass oci_app_upgrades as extra vars, for example with -e @request.yml.
        quiet: true

    - name: Require unique VMIDs in the request
      ansible.builtin.assert:
        that:
          - (oci_app_upgrades | map(attribute='vmid') | map('string') | unique | list | length) == (oci_app_upgrades | length)
        fail_msg: Each VMID may appear only once in oci_app_upgrades.
        quiet: true

    - name: Require each request entry to be complete and well formed
      ansible.builtin.assert:
        that:
          - (item.vmid | string) is match('^[1-9][0-9]{2,8}$')
          - item.image | default('') | length > 0
          - item.template is match('^[^:/]+:vztmpl/[^/]+$')
          - item.current_template is match('^[^:/]+:vztmpl/[^/]+$')
          - item.health_url is match('^https?://')
        fail_msg: >-
          Each entry needs vmid, image, template and current_template as storage
          volids (storage:vztmpl/name), and health_url as an http(s) URL.
        quiet: true
      loop: "{{ oci_app_upgrades }}"
      loop_control:
        label: "{{ item.vmid | default('unset') }}"

- name: Upgrade OCI-image LXC images one node at a time
  hosts: proxmox
  become: true
  gather_facts: true

  # One node at a time. Each node's pass touches only the requested CTs it hosts,
  # and a failed CT stops the rollout before the next node starts.
  serial: 1
  max_fail_percentage: 0

  pre_tasks:
    - name: Require every expected vote before touching this node
      ansible.builtin.include_role:
        name: pve_upgrade
        tasks_from: wait_full_quorum

  roles:
    - role: oci_app_upgrade
