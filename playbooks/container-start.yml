---
# Start explicitly approved LXC guests with pct start over SSH.
#
# The published tofu inventory is authoritative for VMID and hostname; the start
# runs on the node live placement reports. The role is inert unless
# container_start_services (inventory/group_vars/all.yml) is non-empty.

- name: Load OpenTofu host services
  import_playbook: load_tofu.yml

- name: Start explicitly approved Proxmox containers
  hosts: localhost
  become: false
  gather_facts: false

  roles:
    - role: container_start
      tags:
        - container_start
