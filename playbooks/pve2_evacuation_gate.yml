---
# Persistent source-integrity gate for tofu-proxmox#816.  This is intentionally
# separate from site.yml: it is temporary migration control-plane state, not a
# fleet-wide host role.

- name: Load OpenTofu host services
  import_playbook: load_tofu.yml

- name: Configure the pve2 evacuation integrity gate
  hosts: pve2
  become: true
  gather_facts: true

  roles:
    - role: pve_evacuation_gate
      tags:
        - pve_evacuation_gate
        - migration
