---
# Archive exactly one guest to shared staging storage hosted by a third node.
# There is deliberately no restore, probe, cutover, source deletion, storage
# creation, or cluster membership work in this standalone playbook.
# pve_guest_evacuation_source_node has no default: an unset value must be an
# error, never a silent fall-back to some other node.
- name: Archive one guest for a node evacuation
  hosts: "{{ pve_guest_evacuation_source_node }}"
  become: true
  gather_facts: false
  serial: 1
  roles:
    - role: pve_guest_evacuation
