---
- name: Inspect which images are already present
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ vmid | string }}"
      - --
      - docker
      - image
      - inspect
      - "{{ item }}"
  loop: "{{ benchmark_client_images }}"
  loop_control:
    label: "{{ item.split('@') | first }}"
  register: benchmark_client_image_inspections
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname == node
    - state == 'present'
    - not ansible_check_mode
- name: Pull missing digest-pinned images
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ vmid | string }}"
      - --
      - docker
      - pull
      - "{{ item.item }}"
  loop: "{{ benchmark_client_image_inspections.results | default([]) }}"
  loop_control:
    label: "{{ item.item.split('@') | first }}"
  changed_when: true
  when:
    - inventory_hostname == node
    - state == 'present'
    - item.rc != 0
    - not ansible_check_mode
- name: Verify the engine API responds from the client
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ vmid | string }}"
      - --
      - curl
      - --fail
      - --silent
      - --show-error
      - --max-time
      - "10"
      - --output
      - /dev/null
      - "{{ engine_url | regex_replace('/+$', '') }}/models"
  register: benchmark_client_engine_check
  changed_when: false
  no_log: true
  when:
    - inventory_hostname == node
    - state == 'present'
    - not ansible_check_mode
