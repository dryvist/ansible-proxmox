---
- name: Preserve pve540 high-value data on pve3
  hosts: pve3
  become: true
  gather_facts: false

  vars:
    pve540_preservation_source: pve540.jacobpevans.com
    pve540_preservation_base: /bulk/scratch/pve540-evac-816
    pve540_preservation_key: /root/.ssh/pve540-preserve-816
    pve540_preservation_paths:
      - appdata
      - databases
      - backups
    pve540_preservation_sources:
      - "root@{{ pve540_preservation_source }}:/bulk/./appdata"
      - "root@{{ pve540_preservation_source }}:/bulk/./databases"
      - "root@{{ pve540_preservation_source }}:/bulk/./backups"
    pve540_preservation_known_hosts: >-
      {{ lookup('env', 'SSH_KNOWN_HOSTS').splitlines()
         | select('search', '(^|,)pve540\.jacobpevans\.com([, ]|$)')
         | list }}

  tasks:
    - name: Require the reviewed pve540 host key
      ansible.builtin.assert:
        that:
          - pve540_preservation_known_hosts | length == 1
          - "'ssh-ed25519' in pve540_preservation_known_hosts[0]"
        fail_msg: >-
          SSH_KNOWN_HOSTS must contain exactly one reviewed ED25519 key for
          pve540.jacobpevans.com.

    - name: Ensure root SSH configuration exists on pve3
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Pin the reviewed pve540 host key on pve3
      ansible.builtin.known_hosts:
        path: /root/.ssh/known_hosts
        name: pve540.jacobpevans.com
        key: "{{ pve540_preservation_known_hosts[0] }}"
        state: present

    - name: Create an immutable preservation run identifier
      ansible.builtin.command:
        argv:
          - date
          - -u
          - +%Y%m%dT%H%M%SZ
      register: pve540_preservation_run_id
      changed_when: false

    - name: Ensure the issue 816 preservation base exists
      ansible.builtin.file:
        path: "{{ pve540_preservation_base }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Atomically create an isolated preservation directory
      ansible.builtin.tempfile:
        path: "{{ pve540_preservation_base }}"
        prefix: "high-value-{{ pve540_preservation_run_id.stdout }}."
        state: directory
      register: pve540_preservation_directory

    - name: Select the isolated preservation directory
      ansible.builtin.set_fact:
        pve540_preservation_root: "{{ pve540_preservation_directory.path }}"

    - name: Protect the isolated preservation directory
      ansible.builtin.file:
        path: "{{ pve540_preservation_root }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Preserve and verify the high-value pve540 trees
      block:
        - name: Create a temporary migration transport key on pve3
          ansible.builtin.command:
            argv:
              - ssh-keygen
              - -q
              - -t
              - ed25519
              - -N
              - ""
              - -C
              - pve540-preserve-816
              - -f
              - "{{ pve540_preservation_key }}"
            creates: "{{ pve540_preservation_key }}"

        - name: Read the temporary migration public key
          ansible.builtin.slurp:
            src: "{{ pve540_preservation_key }}.pub"
          register: pve540_preservation_public_key

        - name: Calculate the temporary key expiry on pve3
          ansible.builtin.command:
            argv:
              - date
              - -u
              - -d
              - +2 hours
              - +%Y%m%d%H%M%SZ
          register: pve540_preservation_key_expiry
          changed_when: false

        - name: Build the restricted temporary authorization
          ansible.builtin.set_fact:
            pve540_preservation_authorized_key: >-
              restrict,expiry-time="{{ pve540_preservation_key_expiry.stdout }}"
              {{ pve540_preservation_public_key.content | b64decode | trim }}

        - name: Ensure pve540 root SSH configuration exists
          ansible.builtin.file:
            path: /root/.ssh
            state: directory
            owner: root
            group: root
            mode: "0700"
          delegate_to: pve540

        - name: Authorize the temporary migration key on pve540
          ansible.builtin.lineinfile:
            path: /root/.ssh/authorized_keys
            line: "{{ pve540_preservation_authorized_key }}"
            create: true
            owner: root
            group: root
            mode: "0600"
          delegate_to: pve540

        - name: Verify strict temporary transport from pve3 to pve540
          ansible.builtin.command:
            argv:
              - ssh
              - -i
              - "{{ pve540_preservation_key }}"
              - -o
              - IdentitiesOnly=yes
              - -o
              - BatchMode=yes
              - -o
              - StrictHostKeyChecking=yes
              - root@pve540.jacobpevans.com
              - "true"
          changed_when: false

        - name: Discover every selected pve540 ZFS dataset
          ansible.builtin.shell:
            cmd: |
              set -Eeuo pipefail
              zfs list -H -o name -r bulk/appdata
              zfs list -H -o name -r bulk/databases
              zfs list -H -o name -r bulk/backups
            executable: /bin/bash
          register: pve540_preservation_datasets
          changed_when: false
          delegate_to: pve540

        - name: Read selected dataset write state
          ansible.builtin.command:
            argv: >-
              {{ ['zfs', 'get', '-H', '-o', 'name,value,source', 'readonly']
                 + pve540_preservation_datasets.stdout_lines }}
          register: pve540_preservation_readonly_before
          changed_when: false
          delegate_to: pve540

        - name: Require writable and idle source datasets before freezing
          block:
            - name: Require every selected source dataset to be writable
              ansible.builtin.assert:
                that:
                  - pve540_preservation_datasets.stdout_lines | length >= 3
                  - >-
                    pve540_preservation_readonly_before.stdout_lines
                    | reject('search', '\toff\t') | list | length == 0
                  - >-
                    pve540_preservation_readonly_before.stdout_lines
                    | reject('search', '\t(local|default|inherited from .+)$')
                    | list | length == 0
                fail_msg: >-
                  The preservation playbook only restores the reviewed all-off
                  readonly state and local/default/inherited property sources;
                  stop on any different source state.

            - name: Detect open handles in the selected source trees
              ansible.builtin.command:
                argv:
                  - lsof
                  - -nP
                  - +D
                  - /bulk/appdata
                  - +D
                  - /bulk/databases
                  - +D
                  - /bulk/backups
              register: pve540_preservation_open_handles
              changed_when: false
              failed_when: pve540_preservation_open_handles.rc not in [0, 1]
              delegate_to: pve540

            - name: Require no source writers or readers before freezing
              ansible.builtin.assert:
                that:
                  - pve540_preservation_open_handles.rc == 1
                fail_msg: >-
                  A process has an open handle in a selected pve540 source tree;
                  quiesce it before the final preservation pass.

        - name: Freeze every selected pve540 dataset read-only
          block:
            - name: Set every selected dataset read-only
              ansible.builtin.command:
                argv:
                  - zfs
                  - set
                  - readonly=on
                  - "{{ item }}"
              loop: "{{ pve540_preservation_datasets.stdout_lines }}"
              changed_when: true
              delegate_to: pve540

            - name: Record the completed source freeze
              ansible.builtin.set_fact:
                pve540_preservation_frozen: true
          rescue:
            - name: Roll back a partial source freeze exactly
              ansible.builtin.command:
                argv: >-
                  {{ ['zfs', 'set', 'readonly=off', item.split() | first]
                     if (item.split() | last) == 'local'
                     else ['zfs', 'inherit', 'readonly', item.split() | first] }}
              loop: "{{ pve540_preservation_readonly_before.stdout_lines }}"
              changed_when: true
              delegate_to: pve540

            - name: Stop after rolling back the incomplete source freeze
              ansible.builtin.fail:
                msg: Failed to freeze every selected pve540 dataset read-only.

        - name: Measure the frozen source trees conservatively
          ansible.builtin.command:
            argv:
              - ssh
              - -i
              - "{{ pve540_preservation_key }}"
              - -o
              - IdentitiesOnly=yes
              - -o
              - BatchMode=yes
              - -o
              - StrictHostKeyChecking=yes
              - root@pve540.jacobpevans.com
              - >-
                du -sb /bulk/appdata /bulk/databases /bulk/backups |
                awk '{ total += $1 } END { print total }'
          register: pve540_preservation_source_bytes
          changed_when: false

        - name: Read pve3 staging size and capacity
          ansible.builtin.command:
            argv:
              - df
              - --output=size,avail
              - --block-size=1
              - /bulk/scratch
          register: pve540_preservation_capacity
          changed_when: false

        - name: Preserve 20 percent pve3 pool headroom after the copy
          ansible.builtin.assert:
            that:
              - >-
                (pve540_preservation_capacity.stdout_lines[-1].split()[1] | int)
                - (pve540_preservation_source_bytes.stdout | int)
                >=
                (pve540_preservation_capacity.stdout_lines[-1].split()[0] | int) / 5
            fail_msg: >-
              The selected source trees do not fit while preserving 20 percent
              headroom on pve3 bulk/scratch.

        - name: Copy the high-value pve540 trees
          ansible.builtin.command:
            argv: >-
              {{ ['rsync', '-aHAXS', '--numeric-ids', '--relative',
                  '-e', 'ssh -i ' ~ pve540_preservation_key ~ ' -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes']
                 + pve540_preservation_sources
                 + [pve540_preservation_root ~ '/'] }}
          register: pve540_preservation_rsync
          changed_when: pve540_preservation_rsync.rc == 0

        - name: Prove content and metadata need no further rsync changes
          ansible.builtin.command:
            argv: >-
              {{ ['rsync', '-aHAXScni', '--numeric-ids', '--relative',
                  '-e', 'ssh -i ' ~ pve540_preservation_key ~ ' -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes']
                 + pve540_preservation_sources
                 + [pve540_preservation_root ~ '/'] }}
          register: pve540_preservation_verify_rsync
          changed_when: false
          failed_when: >-
            pve540_preservation_verify_rsync.rc != 0
            or pve540_preservation_verify_rsync.stdout | length > 0

        - name: Generate and compare SHA-256 manifests
          ansible.builtin.shell:
            cmd: |
              set -Eeuo pipefail
              source_tmp=$(mktemp {{ pve540_preservation_root }}/.SOURCE.SHA256SUMS.XXXXXX)
              destination_tmp=$(mktemp {{ pve540_preservation_root }}/.DESTINATION.SHA256SUMS.XXXXXX)
              trap 'rm -f "$source_tmp" "$destination_tmp"' EXIT
              ssh -i {{ pve540_preservation_key }} -o IdentitiesOnly=yes \
                -o BatchMode=yes -o StrictHostKeyChecking=yes \
                root@{{ pve540_preservation_source }} \
                'cd /bulk && find {{ pve540_preservation_paths | join(" ") }} -type f -print0 | sort -z | xargs -0r sha256sum' \
                > "$source_tmp"
              (
                cd {{ pve540_preservation_root }}
                find {{ pve540_preservation_paths | join(" ") }} -type f -print0 | sort -z | xargs -0r sha256sum \
                  > "$destination_tmp"
              )
              cmp --silent "$source_tmp" "$destination_tmp"
              mv -f "$source_tmp" {{ pve540_preservation_root }}/SOURCE.SHA256SUMS
              mv -f "$destination_tmp" {{ pve540_preservation_root }}/DESTINATION.SHA256SUMS
            executable: /bin/bash
          changed_when: true
      always:
        - name: Restore every selected pve540 readonly property exactly
          ansible.builtin.command:
            argv: >-
              {{ ['zfs', 'set', 'readonly=off', item.split() | first]
                 if (item.split() | last) == 'local'
                 else ['zfs', 'inherit', 'readonly', item.split() | first] }}
          loop: "{{ pve540_preservation_readonly_before.stdout_lines }}"
          when: pve540_preservation_frozen | default(false)
          changed_when: true
          delegate_to: pve540

        - name: Revoke the temporary migration key from pve540
          ansible.builtin.lineinfile:
            path: /root/.ssh/authorized_keys
            line: "{{ pve540_preservation_authorized_key | default('') }}"
            state: absent
          delegate_to: pve540

        - name: Remove the temporary migration key from pve3
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ pve540_preservation_key }}"
            - "{{ pve540_preservation_key }}.pub"
