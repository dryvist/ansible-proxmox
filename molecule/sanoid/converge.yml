---
- name: Converge
  hosts: all
  become: false
  gather_facts: true

  vars:
    # A representative per-criticality assignment. Package install + timer are
    # skipped under Docker; this proves the role converges and sanoid.conf
    # renders the templates and dataset sections from the contract.
    sanoid_datasets:
      "rpool/data/nas":
        use_template: critical
        recursive: "yes"
      "rpool/data/subvol-100-disk-0":
        use_template: critical
      "rpool/data/vm-101-disk-1":
        use_template: critical
      "bulk/appdata":
        use_template: critical
      "nvme1/siem/cribl-pq":
        use_template: scratch
    sanoid_replica_retention_enabled: true
    syncoid_default_options: "--recursive --no-sync-snap --quiet"
    syncoid_jobs:
      - name: replica-recursive
        target: bulk/replica/source/recursive
      - name: replica-nonrecursive
        options: "--no-sync-snap --quiet"
        target: bulk/replica/source/nonrecursive

  roles:
    - role: sanoid
