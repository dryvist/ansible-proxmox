---
- name: Prepare
  hosts: all
  gather_facts: false

  tasks:
    # /etc/modprobe.d ships with kmod on every real host but is absent from the
    # slim base image, so create it here rather than making the role mkdir a
    # directory that always exists in production.
    - name: Install Python and stage the modprobe.d directory
      ansible.builtin.raw: |
        apt-get update && apt-get install -y python3
        mkdir -p /etc/modprobe.d
      changed_when: true
