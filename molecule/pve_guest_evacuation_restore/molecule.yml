---
platforms:
  - name: pve-guest-evacuation-restore-test
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-debian12-ansible:latest}"
    pre_build_image: true
    privileged: true
    tmpfs:
      - /run
      - /tmp

# This is a standalone role, not Molecule's implicit role-under-test.
provisioner:
  config_options:
    defaults:
      roles_path: ${MOLECULE_SCENARIO_DIRECTORY}/../../roles
