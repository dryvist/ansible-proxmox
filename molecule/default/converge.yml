---
- name: Converge
  hosts: all
  # Note: become: false since Docker containers run as root
  become: false
  gather_facts: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Include kernel_tuning role
      ansible.builtin.include_role:
        name: kernel_tuning
      tags:
        - kernel_tuning

    - name: Include ulimits role
      ansible.builtin.include_role:
        name: ulimits
      vars:
        # Skip systemd reload in containers (no systemd PID 1)
        ulimits_skip_systemd_reload: true
      tags:
        - ulimits

    - name: Include crash_diagnostics role
      ansible.builtin.include_role:
        name: crash_diagnostics
      tags:
        - crash_diagnostics

    # The capacity monitor installs only when a transport is configured. That
    # gate is the reason it was absent from every host for so long — with no
    # transport set anywhere, the block was skipped, and a skipped task is
    # indistinguishable from a converged one. Converging it here with a
    # transport set is what makes verify.yml able to assert it actually lands.
    - name: Include proxmox_monitoring role
      ansible.builtin.include_role:
        name: proxmox_monitoring
      vars:
        # Unroutable on purpose: this proves DEPLOYMENT, never delivery. The
        # script is not executed here, so nothing is ever sent.
        proxmox_monitoring_zfs_capacity_deadman_url: "http://deadman.invalid/zfs-capacity"
        # Everything else off, so a failure here can only be the capacity
        # monitor. sysstat/atop want systemd units a container has no init for.
        proxmox_monitoring_enable_sysstat: false
        proxmox_monitoring_enable_atop: false
        proxmox_monitoring_enable_healthchecks: false
        proxmox_monitoring_enable_pvesr_telemetry: false
      tags:
        - proxmox_monitoring

    # Note: common role requires specific packages (lm-sensors, rasdaemon)
    # Note: zfs_swap role requires ZFS which is not available in containers
    # Note: nas_storage role requires ZFS which is not available in containers
    # Note: GRUB configuration in crash_diagnostics is skipped in containers (no GRUB)
    # Full integration tests should run on actual Proxmox hosts
