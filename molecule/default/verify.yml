---
- name: Verify
  hosts: all
  # Note: become: false since Docker containers run as root
  become: false
  gather_facts: true

  # Load role defaults so the crash_diagnostics_* variables referenced below
  # resolve. verify.yml runs as a standalone play and does not inherit
  # role vars unless explicitly imported.
  vars_files:
    - ../../roles/crash_diagnostics/defaults/main.yml

  tasks:
    - name: Verify sysctl configuration file exists
      ansible.builtin.stat:
        path: /etc/sysctl.d/10-proxmox-tuning.conf
      register: sysctl_file
      failed_when: not sysctl_file.stat.exists

    - name: Verify ulimits configuration file exists
      ansible.builtin.stat:
        path: /etc/security/limits.d/90-ansible.conf
      register: limits_file
      failed_when: not limits_file.stat.exists

    - name: Verify systemd limits directory exists
      ansible.builtin.stat:
        path: /etc/systemd/system.conf.d
      register: systemd_dir
      failed_when: not systemd_dir.stat.exists

    - name: Verify systemd limits configuration exists
      ansible.builtin.stat:
        path: /etc/systemd/system.conf.d/limits.conf
      register: systemd_limits
      failed_when: not systemd_limits.stat.exists

    - name: Verify /etc/kernel/cmdline exists (if boot params enabled)
      ansible.builtin.stat:
        path: /etc/kernel/cmdline
      register: kernel_cmdline_file
      # This is only expected to exist on actual Proxmox systems, not in molecule Docker containers
      failed_when: false
      changed_when: false

    - name: Display kernel cmdline content if it exists
      ansible.builtin.debug:
        msg: "Kernel cmdline found (requires Proxmox): {{ kernel_cmdline_file.stat.exists }}"
      changed_when: false

    # --- crash_diagnostics role assertions ---

    - name: Verify memory-config log directory
      ansible.builtin.stat:
        path: "{{ crash_diagnostics_memory_log_dir }}"
      register: crash_diag_memory_log_dir

    - name: Assert memory-config log directory is valid
      ansible.builtin.assert:
        that:
          - crash_diag_memory_log_dir.stat.exists
          - crash_diag_memory_log_dir.stat.isdir
        fail_msg: "{{ crash_diagnostics_memory_log_dir }} is missing or not a directory"

    - name: Verify memory-config-logger script
      ansible.builtin.stat:
        path: "{{ crash_diagnostics_memory_logger_script }}"
      register: crash_diag_memory_logger

    - name: Assert memory-config-logger script is valid
      ansible.builtin.assert:
        that:
          - crash_diag_memory_logger.stat.exists
          - crash_diag_memory_logger.stat.executable
        fail_msg: "{{ crash_diagnostics_memory_logger_script }} is missing or not executable"

    - name: Verify mce-monitor script
      ansible.builtin.stat:
        path: "{{ crash_diagnostics_mce_monitor_script }}"
      register: crash_diag_mce_monitor

    - name: Assert mce-monitor script is valid
      ansible.builtin.assert:
        that:
          - crash_diag_mce_monitor.stat.exists
          - crash_diag_mce_monitor.stat.executable
        fail_msg: "{{ crash_diagnostics_mce_monitor_script }} is missing or not executable"

    - name: Verify strace is installed (crash_diagnostics package)
      ansible.builtin.command: which strace
      changed_when: false

    # The ZFS capacity monitor. Until now nothing asserted this role DEPLOYS
    # anything: its install block is gated on a transport being configured, no
    # transport was set anywhere, and so it silently no-opped on every host
    # while the converge reported success.
    - name: Stat the deployed capacity monitor script
      ansible.builtin.stat:
        path: /usr/local/bin/zfs-capacity-monitor.sh
      register: zfs_capacity_script

    - name: Read the deployed capacity monitor script
      ansible.builtin.slurp:
        src: /usr/local/bin/zfs-capacity-monitor.sh
      register: zfs_capacity_body
      when: zfs_capacity_script.stat.exists

    - name: Stat the capacity monitor state directory
      ansible.builtin.stat:
        path: /var/lib/zfs-capacity-monitor
      register: zfs_capacity_state

    - name: Read root's crontab
      ansible.builtin.command: crontab -l -u root
      register: zfs_capacity_cron
      changed_when: false
      failed_when: false

    - name: Assert the capacity monitor actually deployed
      ansible.builtin.assert:
        that:
          - zfs_capacity_script.stat.exists
          - zfs_capacity_script.stat.executable
          - zfs_capacity_state.stat.exists
          - zfs_capacity_state.stat.isdir
          - "'zfs-capacity-monitor.sh' in zfs_capacity_cron.stdout"
        fail_msg: >-
          The capacity monitor did not deploy. A transport is configured in
          converge.yml, so the install block must run — if this fails, the gate
          in tasks/main.yml is skipping it again and every host silently loses
          its pool free-space alarm.

    - name: Assert the rendered script carries the transport and band contract
      ansible.builtin.assert:
        that:
          # Jinja must be fully substituted — an unrendered variable would make
          # the script a syntax error only discovered when cron ran it. The
          # delimiter is built by concatenation because Ansible rejects literal
          # template delimiters inside an expression.
          - "('{' ~ '{') not in (zfs_capacity_body.content | b64decode)"
          - "'deadman.invalid/zfs-capacity' in (zfs_capacity_body.content | b64decode)"
          # The top band cannot exceed what `zpool list -o capacity` can report:
          # ZFS slop keeps it near 96.8%, so a higher band never fires.
          - "'POOL_THRESHOLDS=(50 75 85 90 94)' in (zfs_capacity_body.content | b64decode)"
        fail_msg: "The rendered capacity monitor lost its transport or band contract"

    # The smartd tasks are gated to physical hosts, so a container converge
    # cannot assert the deployed file. What it can assert is the directive
    # contract itself, which is where the regression would land: `-a` tracks
    # only NORMALIZED attribute values, and the sector-health counters stay
    # pinned at 100 normalized while their raw counts climb. Drop the -R
    # directives and smartd keeps running, keeps looking configured, and stops
    # reporting accumulating bad sectors entirely.
    - name: Assert smartd tracks raw sector-health counters
      ansible.builtin.assert:
        that:
          - "'-R 5!' in crash_diagnostics_smartd_directives"
          - "'-R 197!' in crash_diagnostics_smartd_directives"
          - "'-R 198!' in crash_diagnostics_smartd_directives"
          # -C/-U must stay at their non-zero-report defaults. The increase-only
          # '+' form announces a counter once and then goes quiet, so a counter
          # that rose while the log pipeline was down is never mentioned again.
          - "'-C 197+' not in crash_diagnostics_smartd_directives"
          - "'-U 198+' not in crash_diagnostics_smartd_directives"
        fail_msg: >-
          crash_diagnostics_smartd_directives lost its raw sector-counter
          tracking: reallocated and pending sectors will accumulate without a
          single syslog line.

# The shared PR CI runs the default Molecule scenario, so importing the native
# contract here makes the start-only gates mandatory before merge as well as in
# the repository's post-merge Molecule workflow.
- name: Run the container start contract
  ansible.builtin.import_playbook: ../../tests/container_start_contract.yml

- name: Run the container start authentication contract
  ansible.builtin.import_playbook: ../../tests/container_start_auth_contract.yml

- name: Run the Ansible runner token contract
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  tasks:
    - name: Verify Proxmox module secret masking
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - tests/test_container_start_module_contract.py
          - -v
        chdir: "{{ playbook_dir | dirname | dirname }}"
      changed_when: false

    - name: Verify runner token ownership and cleanup
      ansible.builtin.command:
        argv:
          - python3
          - tests/test_run_ansible_runner.py
          - -v
        chdir: "{{ playbook_dir | dirname | dirname }}"
      changed_when: false
