---
- name: Verify
  hosts: all
  # Note: become: false since Docker containers run as root
  become: false
  gather_facts: true

  # Load role defaults so the crash_diagnostics_* variables referenced below
  # resolve. verify.yml runs as a standalone play and does not inherit
  # role vars unless explicitly imported.
  vars_files:
    - ../../roles/crash_diagnostics/defaults/main.yml

  tasks:
    - name: Verify sysctl configuration file exists
      ansible.builtin.stat:
        path: /etc/sysctl.d/10-proxmox-tuning.conf
      register: sysctl_file
      failed_when: not sysctl_file.stat.exists

    - name: Verify ulimits configuration file exists
      ansible.builtin.stat:
        path: /etc/security/limits.d/90-ansible.conf
      register: limits_file
      failed_when: not limits_file.stat.exists

    - name: Verify systemd limits directory exists
      ansible.builtin.stat:
        path: /etc/systemd/system.conf.d
      register: systemd_dir
      failed_when: not systemd_dir.stat.exists

    - name: Verify systemd limits configuration exists
      ansible.builtin.stat:
        path: /etc/systemd/system.conf.d/limits.conf
      register: systemd_limits
      failed_when: not systemd_limits.stat.exists

    - name: Verify /etc/kernel/cmdline exists (if boot params enabled)
      ansible.builtin.stat:
        path: /etc/kernel/cmdline
      register: kernel_cmdline_file
      # This is only expected to exist on actual Proxmox systems, not in molecule Docker containers
      failed_when: false
      changed_when: false

    - name: Display kernel cmdline content if it exists
      ansible.builtin.debug:
        msg: "Kernel cmdline found (requires Proxmox): {{ kernel_cmdline_file.stat.exists }}"
      changed_when: false

    # --- crash_diagnostics role assertions ---

    - name: Verify memory-config log directory
      ansible.builtin.stat:
        path: "{{ crash_diagnostics_memory_log_dir }}"
      register: crash_diag_memory_log_dir

    - name: Assert memory-config log directory is valid
      ansible.builtin.assert:
        that:
          - crash_diag_memory_log_dir.stat.exists
          - crash_diag_memory_log_dir.stat.isdir
        fail_msg: "{{ crash_diagnostics_memory_log_dir }} is missing or not a directory"

    - name: Verify memory-config-logger script
      ansible.builtin.stat:
        path: "{{ crash_diagnostics_memory_logger_script }}"
      register: crash_diag_memory_logger

    - name: Assert memory-config-logger script is valid
      ansible.builtin.assert:
        that:
          - crash_diag_memory_logger.stat.exists
          - crash_diag_memory_logger.stat.executable
        fail_msg: "{{ crash_diagnostics_memory_logger_script }} is missing or not executable"

    - name: Verify mce-monitor script
      ansible.builtin.stat:
        path: "{{ crash_diagnostics_mce_monitor_script }}"
      register: crash_diag_mce_monitor

    - name: Assert mce-monitor script is valid
      ansible.builtin.assert:
        that:
          - crash_diag_mce_monitor.stat.exists
          - crash_diag_mce_monitor.stat.executable
        fail_msg: "{{ crash_diagnostics_mce_monitor_script }} is missing or not executable"

    - name: Verify strace is installed (crash_diagnostics package)
      ansible.builtin.command: which strace
      changed_when: false

# The shared PR CI runs the default Molecule scenario, so importing the native
# contract here makes the start-only gates mandatory before merge as well as in
# the repository's post-merge Molecule workflow.
- name: Run the container start contract
  ansible.builtin.import_playbook: ../../tests/container_start_contract.yml

- name: Run the container start authentication contract
  ansible.builtin.import_playbook: ../../tests/container_start_auth_contract.yml

- name: Run the Ansible runner token contract
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  tasks:
    - name: Verify Proxmox module secret masking
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - tests/test_container_start_module_contract.py
          - -v
        chdir: "{{ playbook_dir | dirname | dirname }}"
      changed_when: false

    - name: Verify runner token ownership and cleanup
      ansible.builtin.command:
        argv:
          - python3
          - tests/test_run_ansible_runner.py
          - -v
        chdir: "{{ playbook_dir | dirname | dirname }}"
      changed_when: false
