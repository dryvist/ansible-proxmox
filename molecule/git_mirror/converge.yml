---
- name: Converge
  hosts: all
  become: false
  gather_facts: true

  vars:
    # Directory creation and timer enable are Docker-skipped; this proves the
    # script + timer render the expected contract from the job definition.
    git_mirror_enabled: true
    git_mirror_healthcheck_url: "https://hc-ping.example/git-mirror"
    git_mirror_archive_dir: "/bulk/git-mirror"
    git_mirror_owners:
      - example-org
      - example-user

  roles:
    - role: git_mirror
