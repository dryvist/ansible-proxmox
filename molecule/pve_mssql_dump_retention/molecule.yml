---
platforms:
  - name: proxmox-pve-mssql-dump-retention-test
    # renovate: datasource=docker depName=mirror.gcr.io/geerlingguy/docker-debian12-ansible
    image: "${MOLECULE_IMAGE:-mirror.gcr.io/geerlingguy/docker-debian12-ansible:latest@sha256:43b3f59882ccc0ba5deb3b3ecac727084bb082a3230b5258c500395694b5497f}"
    pre_build_image: true
    privileged: true
    tmpfs:
      - /run
      - /tmp

driver:
  name: docker

provisioner:
  config_options:
    defaults:
      roles_path: ${MOLECULE_SCENARIO_DIRECTORY}/../../roles
scenario:
  # Converge rebuilds its fixture tree and the role then deletes archived sources,
  # so a second converge cannot report zero changes; idempotence is asserted in the
  # exercise tasks (second run is a no-op) instead.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
