    image: "${MOLECULE_IMAGE:-debian:stable-slim}"
    pre_build_image: true
    privileged: true
    tmpfs:
      - /run
      - /tmp

provisioner:
  inventory:
    group_vars:
      all:
        nas_storage_passwords:
          homeassistant_smb_password: molecule-pass
