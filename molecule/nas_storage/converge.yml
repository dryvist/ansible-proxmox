---
- name: Converge
  hosts: all
  become: false
  gather_facts: true

  vars:
    # No OpenBao in the container, so supply the map the role would read from
    # it. BOTH halves of the identity live here: the login name is deliberately
    # different from the secret_prefix below, so a role that took the name from
    # the declaration instead of resolving it would create the wrong account
    # and verify.yml's pdbedit lookup would miss.
    nas_storage_secrets:
      smb_user_username: "molecule-resolved-user"
      smb_user_password: "molecule-pass"
    # Shaped exactly as playbooks/load_tofu.yml derives it from
    # node_storage.<node>: the node-level `smb` service block, plus one entry
    # per dataset that declared an `smb` block, with `name`/`path` filled in.
    # The role no longer creates these datasets -- zfs_pools does -- so the
    # paths here stand in for mountpoints that already exist.
    nas_storage_from_tofu:
      group_name: "nas"
      workgroup: "WORKGROUP"
      macos_optimized: true
      managed_users:
        - secret_prefix: "smb_user"
          unix_groups:
            - "nas"
          shell: "/usr/sbin/nologin"
          create_home: false
      shares:
        - name: "jdrive"
          share_name: "jdrive"
          path: "/bulk/jdrive"
          valid_users: "@nas"
          comment: "General file share"
        # Every optional attribute left null, exactly as tofu serialises an
        # undeclared `optional(...)`. Jinja treats null as DEFINED, so this
        # case is what catches a template that tests `is defined` instead of
        # truthiness and renders "comment = None" into smb.conf.
        - name: "models"
          share_name: "models"
          path: "/bulk/models"
          valid_users: null
          comment: null
          browsable: null
          read_only: null
          force_group: null
          create_mask: null
          directory_mask: null
          time_machine: null
          time_machine_max_size: null
        - name: "timemachine"
          share_name: "timemachine"
          path: "/bulk/timemachine"
          valid_users: "@nas"
          force_group: "nas"
          time_machine: true
          time_machine_max_size: "600G"
          comment: "Mac Time Machine target"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Include nas_storage role
      ansible.builtin.include_role:
        name: nas_storage
      tags:
        - nas_storage
