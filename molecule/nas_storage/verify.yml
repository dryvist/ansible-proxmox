---
- name: Verify
  hosts: all
  become: false
  gather_facts: true

  tasks:
    # The role creates the SHARE directory for each declared share. It no
    # longer creates a NAS root or a fixed subdirectory list -- those were
    # dataset mountpoints, and zfs_pools owns datasets now.
    - name: Verify share directories exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /bulk/jdrive
        - /bulk/models
        - /bulk/timemachine
      register: nas_dirs

    - name: Assert share directories exist with the NAS group
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.gr_name == "nas"
        fail_msg: "Missing or mis-grouped share directory {{ item.item }}"
      loop: "{{ nas_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert the role did NOT create a dataset mountpoint of its own
      ansible.builtin.stat:
        path: /mnt/nas
      register: nas_legacy_root

    - name: The old global NAS root must be gone
      ansible.builtin.assert:
        that:
          - not nas_legacy_root.stat.exists
        fail_msg: >-
          /mnt/nas still exists, so the role is still building the old global
          per-node NAS. Shares must live on their declared dataset instead.

    - name: Verify Samba config files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/samba/smb.conf
        - /etc/samba/smb.conf.d/jdrive.conf
        - /etc/samba/smb.conf.d/models.conf
        - /etc/samba/smb.conf.d/timemachine.conf
      register: samba_config_files

    - name: Assert Samba config files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Missing Samba config file {{ item.item }}"
      loop: "{{ samba_config_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    # testparm parses the rendered result. It is the check that would catch a
    # share whose null attribute rendered as the literal "None".
    - name: Validate effective Samba configuration
      ansible.builtin.command:
        cmd: testparm -s
      changed_when: false

    # The account is created under the name from the SECRET MAP
    # ("molecule-resolved-user"), not the one from the declaration -- the
    # declaration has no name at all. A role that skipped resolution would
    # create nothing, or create an account named after the prefix, and this
    # lookup would fail either way.
    - name: Verify the managed Samba account exists under its RESOLVED name
      ansible.builtin.command:
        cmd: "pdbedit -L -u molecule-resolved-user"
      changed_when: false

    - name: Verify the resolved account exists as a unix user
      ansible.builtin.command:
        cmd: "getent passwd molecule-resolved-user"
      changed_when: false

    # The fingerprint is keyed by PREFIX, not by login name: a filename on a
    # shared host is a publication too.
    - name: Verify Samba password fingerprint is keyed by prefix
      ansible.builtin.stat:
        path: /etc/samba/password-fingerprints/smb_user.sha256
      register: samba_fingerprint
      failed_when: not samba_fingerprint.stat.exists

    - name: Assert no fingerprint is keyed by the login name
      ansible.builtin.stat:
        path: /etc/samba/password-fingerprints/molecule-resolved-user.sha256
      register: samba_fingerprint_by_name
      failed_when: samba_fingerprint_by_name.stat.exists

    - name: Read the all-nulls share config
      ansible.builtin.slurp:
        src: /etc/samba/smb.conf.d/models.conf
      register: nas_models_share

    # This is the assertion the whole fixture exists for. tofu serialises an
    # undeclared optional() as explicit null, and Jinja's `is defined` is TRUE
    # for null -- so a template testing definedness emits "comment = None" and
    # "valid users = None", which is a silently WRONG share rather than a
    # missing one.
    - name: Assert null attributes fell back instead of rendering "None"
      ansible.builtin.assert:
        that:
          - "'[models]' in (nas_models_share.content | b64decode)"
          - "'None' not in (nas_models_share.content | b64decode)"
          - "'comment' not in (nas_models_share.content | b64decode)"
          - "'valid users = @nas' in (nas_models_share.content | b64decode)"
          - "'create mask = 0664' in (nas_models_share.content | b64decode)"
          - "'force group = nas' in (nas_models_share.content | b64decode)"
          - "'fruit:time machine' not in (nas_models_share.content | b64decode)"
        fail_msg: >-
          A null share attribute leaked into smb.conf.d/models.conf:
          {{ nas_models_share.content | b64decode }}

    - name: Read the explicitly-configured share config
      ansible.builtin.slurp:
        src: /etc/samba/smb.conf.d/jdrive.conf
      register: nas_jdrive_share

    - name: Assert declared attributes are honoured
      ansible.builtin.assert:
        that:
          - "'[jdrive]' in (nas_jdrive_share.content | b64decode)"
          - "'path = \"/bulk/jdrive\"' in (nas_jdrive_share.content | b64decode)"
          - "'comment = General file share' in (nas_jdrive_share.content | b64decode)"

    - name: Read global smb.conf
      ansible.builtin.slurp:
        src: /etc/samba/smb.conf
      register: nas_smb_conf

    - name: Assert macOS (vfs_fruit) tuning is present globally
      ansible.builtin.assert:
        that:
          - "'vfs objects = catia fruit streams_xattr' in (nas_smb_conf.content | b64decode)"
          - "'fruit:metadata = stream' in (nas_smb_conf.content | b64decode)"
        fail_msg: "Global vfs_fruit macOS tuning missing from smb.conf"

    - name: Read Time Machine share config
      ansible.builtin.slurp:
        src: /etc/samba/smb.conf.d/timemachine.conf
      register: nas_tm_share

    - name: Assert the Time Machine share is enabled AND capped
      ansible.builtin.assert:
        that:
          - "'[timemachine]' in (nas_tm_share.content | b64decode)"
          - "'fruit:time machine = yes' in (nas_tm_share.content | b64decode)"
          - "'fruit:time machine max size = 600G' in (nas_tm_share.content | b64decode)"
        fail_msg: >-
          The Time Machine share must render both the flag and its size cap.
          An uncapped Time Machine target grows until the pool is full.
