---
driver:
  name: docker

platforms:
  - name: proxmox-lxc-features-test
    # renovate: datasource=docker depName=mirror.gcr.io/library/debian
    image: "${MOLECULE_IMAGE:-mirror.gcr.io/library/debian:stable-slim@sha256:fbfb4059d2127120aa05b6e6064523d2102552f0cf0026ddf0701c12f1f8f3e0}"
    pre_build_image: true
    privileged: true
    tmpfs:
      - /run
      - /tmp

provisioner:
  config_options:
    defaults:
      roles_path: ${MOLECULE_SCENARIO_DIRECTORY}/../../roles
  inventory:
    group_vars:
      all:
        lxc_features_test_service_vmids:
          fixture-container: 90110

verifier:
  name: ansible
