---
driver:
  name: docker

platforms:
  - name: proxmox-lxc-features-test
    # renovate: datasource=docker depName=mirror.gcr.io/library/debian
    image: "${MOLECULE_IMAGE:-mirror.gcr.io/library/debian:stable-slim@sha256:a717a33469731894e77e912ea7d714e27c2dc38ee6554fd1a3102e92999cfc66}"
    pre_build_image: true
    privileged: true
    tmpfs:
      - /run
      - /tmp

provisioner:
  config_options:
    defaults:
      roles_path: ${MOLECULE_SCENARIO_DIRECTORY}/../../roles
  inventory:
    group_vars:
      all:
        lxc_features_test_service_vmids:
          fixture-container: 90110

verifier:
  name: ansible
