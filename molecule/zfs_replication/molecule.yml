---
platforms:
  - name: proxmox-zfs-replication-test
    # renovate: datasource=docker depName=mirror.gcr.io/geerlingguy/docker-debian12-ansible
    image: "${MOLECULE_IMAGE:-mirror.gcr.io/geerlingguy/docker-debian12-ansible:latest@sha256:fc679fe5eb029c5ceeed3beb9c8a7ee116de371e7f62e3341d5a4dba79853004}"
    pre_build_image: true
    privileged: true
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  env:
    GUEST_BACKUP_S3_BUCKET: example-bucket
