---
- name: Verify
  hosts: all
  become: true
  gather_facts: true

  # No "defaults are defined" assertion here. A verify play does not include
  # the role, so its defaults/main.yml is never loaded into this play's scope
  # and such an assertion can only ever fail — it tested the harness, not the
  # role. That the defaults load is already proven by the converge play, which
  # runs the role and would fail without them.
  tasks:
    - name: Assert ipmitool was NOT installed under Docker (tasks skipped)
      ansible.builtin.command: dpkg -s ipmitool
      register: ipmitool_check
      changed_when: false
      failed_when: false

    - name: Confirm the power tasks were inert in-container
      ansible.builtin.assert:
        that:
          - ipmitool_check.rc != 0
        fail_msg: "ipmitool was installed — Docker-skip guard did not hold"

    # The power-restore policy is compared against a value parsed out of
    # `ipmitool chassis status`, which only runs against a real BMC. Exercise
    # that parse here instead, including the wider spacing older BMC
    # generations emit — a parse that silently yields '' would re-issue the
    # `chassis policy` call on every converge and report a change every time.
    - name: Assert the power-restore policy parse reads the configured value
      ansible.builtin.assert:
        that:
          - (idrac_sample_tight | regex_search(idrac_policy_re)
             | default('', true)).split(':') | last | trim == 'always-on'
          - (idrac_sample_wide | regex_search(idrac_policy_re)
             | default('', true)).split(':') | last | trim == 'previous'
          - (idrac_sample_absent | regex_search(idrac_policy_re)
             | default('', true)).split(':') | last | trim == ''
        fail_msg: "idrac_power no longer parses the chassis status policy line as expected"
      vars:
        idrac_policy_re: 'Power Restore Policy\s*:\s*\S+'
        idrac_sample_tight: "Power Restore Policy: always-on"
        idrac_sample_wide: "Power Restore Policy     : previous"
        idrac_sample_absent: "System Power         : on"
