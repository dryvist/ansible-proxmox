---
- name: Converge
  hosts: all
  become: false
  gather_facts: true

  vars:
    pve_evacuation_gate_enabled: true
    pve_evacuation_gate_prohibited_replication_ids:
      - 602000-0
    pve_evacuation_gate_smart_devices:
      - device: /dev/bus/4
        type: sat+megaraid
        index: 0
        serial: test-serial-a
      - device: /dev/bus/4
        type: sat+megaraid
        index: 1
        serial: test-serial-b
      - device: /dev/bus/4
        type: sat+megaraid
        index: 2
        serial: test-serial-c

  roles:
    - role: pve_evacuation_gate
