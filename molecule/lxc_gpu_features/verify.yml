---
- name: Verify
  hosts: all
  become: false
  gather_facts: false

  vars:
    ansible_virtualization_type: docker
    nvidia_conf: "/etc/pve/lxc/{{ lxc_gpu_features_test_service_vmids['llm-ada-lovelace-6X-16G'] }}.conf"
    untagged_conf_paths:
      - "/etc/pve/lxc/{{ lxc_gpu_features_test_service_vmids['llm-fast'] }}.conf"
      - "/etc/pve/lxc/{{ lxc_gpu_features_test_service_vmids['llm-blackwell-7-96'] }}.conf"
      - "/etc/pve/lxc/{{ lxc_gpu_features_test_engine_vmids.llama_cpp }}.conf"
      - "/etc/pve/lxc/{{ lxc_gpu_features_test_engine_vmids.vllm }}.conf"

    # These are literal output lines, not rebuilt with the role's filters.
    expected_nvidia_lines:
      - "lxc.cgroup2.devices.allow: c 195:* rwm"
      - "lxc.cgroup2.devices.allow: c 510:* rwm"
      - "lxc.mount.entry: /dev/nvidia0 dev/nvidia0 none bind,optional,create=file"
      - "lxc.mount.entry: /dev/nvidiactl dev/nvidiactl none bind,optional,create=file"
      - "lxc.mount.entry: /dev/nvidia-uvm dev/nvidia-uvm none bind,optional,create=file"
      - >-
        lxc.mount.entry: /dev/nvidia-uvm-tools dev/nvidia-uvm-tools none
        bind,optional,create=file

  tasks:
    # Publish role defaults to later verification tasks and rerun the read-only
    # config preflight. Docker skips pct/device discovery and the writer loop.
    - name: Run the role policy preflight
      ansible.builtin.include_role:
        name: lxc_gpu_features
        public: true

    - name: Check the running legacy guest shutdown call record
      ansible.builtin.stat:
        path: "/run/mock-pct/{{ lxc_gpu_features_test_legacy_vmids.running }}.calls"
      register: legacy_running_calls

    - name: Check the already-stopped legacy guest shutdown call record
      ansible.builtin.stat:
        path: "/run/mock-pct/{{ lxc_gpu_features_test_legacy_vmids.stopped }}.calls"
      register: legacy_stopped_calls

    - name: Read the mocked running-guest state after handoff
      ansible.builtin.command:
        cmd: "cat /run/mock-pct/{{ lxc_gpu_features_test_legacy_vmids.running }}.status"
      register: legacy_running_after
      changed_when: false

    - name: Read the mocked stopped-guest state after handoff
      ansible.builtin.command:
        cmd: "cat /run/mock-pct/{{ lxc_gpu_features_test_legacy_vmids.stopped }}.status"
      register: legacy_stopped_after
      changed_when: false

    - name: Confirm only a running legacy GPU guest received graceful shutdown
      ansible.builtin.assert:
        that:
          - "legacy_running_after.stdout | trim == 'status: stopped'"
          - "legacy_stopped_after.stdout | trim == 'status: stopped'"
          - legacy_running_calls.stat.exists
          - not legacy_stopped_calls.stat.exists
        fail_msg: >-
          Legacy guest handoff must gracefully stop a running guest and leave
          an already stopped guest unchanged.

    - name: Read the tagged NVIDIA container's rendered config
      ansible.builtin.slurp:
        src: "{{ nvidia_conf }}"
      register: nvidia_raw

    - name: Decode the tagged NVIDIA config
      ansible.builtin.set_fact:
        nvidia_lines: "{{ (nvidia_raw.content | b64decode).splitlines() | select('truthy') | list }}"

    - name: Assert every expected NVIDIA passthrough line was written
      ansible.builtin.assert:
        that:
          - item in nvidia_lines
        fail_msg: >-
          Missing from {{ nvidia_conf }}: "{{ item }}".
          Rendered: {{ nvidia_lines }}
      loop: "{{ expected_nvidia_lines }}"

    - name: Assert the tagged NVIDIA guest received no AMD device bindings
      ansible.builtin.assert:
        that:
          - nvidia_lines | select('search', '/dev/dri|/dev/kfd|226:|235:') | list | length == 0
        fail_msg: AMD device lines leaked into {{ nvidia_conf }}

    - name: Read all untagged guest configs
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: "{{ untagged_conf_paths }}"
      register: untagged_config_contents

    - name: Assert untagged guest configs have no GPU device access
      ansible.builtin.assert:
        that:
          - >-
            (item.content | b64decode).splitlines()
            | select('search', lxc_gpu_features_unsafe_gpu_access_regex)
            | list | length == 0
        fail_msg: >-
          Untagged config {{ item.source }} unexpectedly contains GPU device access.
      loop: "{{ untagged_config_contents.results }}"
      loop_control:
        label: "{{ item.source }}"

    - name: Assert the untagged guest's TUN allow is accepted
      ansible.builtin.assert:
        that:
          - "'lxc.cgroup2.devices.allow: c 10:200 rwm' in (item.content | b64decode).splitlines()"
        fail_msg: The TUN c 10:200 character-device allow must remain permitted.
      loop: "{{ untagged_config_contents.results }}"
      when: >-
        (item.source | basename)
        == ((lxc_gpu_features_test_service_vmids['llm-fast'] | string) ~ '.conf')
      loop_control:
        label: "{{ item.source }}"

    - name: Prove a GPU line in an untagged live config fails the role assertion
      block:
        - name: Inject an unauthorized GPU mount into an untagged fixture config
          ansible.builtin.lineinfile:
            path: "/etc/pve/lxc/{{ lxc_gpu_features_test_service_vmids['llm-blackwell-7-96'] }}.conf"
            line: "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir"
            state: present

        - name: Rerun the role preflight against the unauthorized config
          ansible.builtin.include_role:
            name: lxc_gpu_features

        - name: Fail if the role accepted an untagged GPU config
          ansible.builtin.fail:
            msg: The role accepted GPU device access in an untagged guest config.
      rescue:
        - name: Confirm the live-config assertion rejected the untagged GPU line
          ansible.builtin.assert:
            that:
              - "(ansible_failed_result | to_json) is search('Refusing GPU passthrough: untagged VMID')"
            fail_msg: >-
              Expected the untagged live-config guard to fail, got:
              {{ ansible_failed_result | to_json }}
      always:
        - name: Remove the unauthorized GPU mount fixture
          ansible.builtin.lineinfile:
            path: "/etc/pve/lxc/{{ lxc_gpu_features_test_service_vmids['llm-blackwell-7-96'] }}.conf"
            line: "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir"
            state: absent

    - name: Prove two tagged guests on one node fail the catalog assertion
      vars:
        containers_from_tofu:
          first:
            node: test-pve-node
            ansible_pct_vmid: "90102"
            tags: [gpu-passthrough]
          second:
            node: test-pve-node
            ansible_pct_vmid: "90103"
            tags: [gpu-passthrough]
        lxc_gpu_features_gpu_passthrough_vmids_from_tofu: ["90102", "90103"]
      block:
        - name: Rerun the role with two gpu-passthrough catalog entries
          ansible.builtin.include_role:
            name: lxc_gpu_features

        - name: Fail if the role accepted two tagged guests on one node
          ansible.builtin.fail:
            msg: The role accepted two gpu-passthrough guests on one node.
      rescue:
        - name: Confirm the per-node catalog assertion rejected the duplicate
          ansible.builtin.assert:
            that:
              - "(ansible_failed_result | to_json) is search('More than one container on Proxmox node')"
            fail_msg: >-
              Expected the per-node tagged-guest assertion to fail, got:
              {{ ansible_failed_result | to_json }}

    - name: Accept one serving and one llm-gpu-small tagged guest on one node
      vars:
        containers_from_tofu:
          serving:
            node: test-pve-node
            ansible_pct_vmid: "90102"
            tags: [gpu-passthrough]
          small:
            node: test-pve-node
            ansible_pct_vmid: "90103"
            tags: [gpu-passthrough, llm-gpu-small]
        lxc_gpu_features_gpu_passthrough_vmids_from_tofu: ["90102", "90103"]
      ansible.builtin.include_role:
        name: lxc_gpu_features
        tasks_from: assert_gpu_policy

    - name: Prove two llm-gpu-small tagged guests on one node fail the catalog assertion
      vars:
        containers_from_tofu:
          first:
            node: test-pve-node
            ansible_pct_vmid: "90102"
            tags: [gpu-passthrough, llm-gpu-small]
          second:
            node: test-pve-node
            ansible_pct_vmid: "90103"
            tags: [gpu-passthrough, llm-gpu-small]
        lxc_gpu_features_gpu_passthrough_vmids_from_tofu: ["90102", "90103"]
      block:
        - name: Check the policy with two llm-gpu-small catalog entries
          ansible.builtin.include_role:
            name: lxc_gpu_features
            tasks_from: assert_gpu_policy

        - name: Fail if the policy accepted two llm-gpu-small guests on one node
          ansible.builtin.fail:
            msg: The policy accepted two llm-gpu-small guests on one node.
      rescue:
        - name: Confirm the per-node catalog assertion rejected the second small guest
          ansible.builtin.assert:
            that:
              - "(ansible_failed_result | to_json) is search('More than one container on Proxmox node')"
            fail_msg: >-
              Expected the per-node llm-gpu-small assertion to fail, got:
              {{ ansible_failed_result | to_json }}

    - name: Prove a direct configure include cannot bypass the tag guard
      block:
        - name: Include the writer directly for an untagged fixture VMID
          ansible.builtin.include_role:
            name: lxc_gpu_features
            tasks_from: configure_container
          loop:
            - key: "{{ lxc_gpu_features_test_service_vmids['llm-blackwell-7-96'] }}"
              value:
                dri: false
                kfd: false
                nvidia: true
          loop_control:
            loop_var: gpu_ct
            label: "container {{ gpu_ct.key }}"

        - name: Fail if the direct writer accepted an untagged VMID
          ansible.builtin.fail:
            msg: The direct configure include accepted an untagged GPU guest.
      rescue:
        - name: Confirm the direct include hit the VMID tag assertion
          ansible.builtin.assert:
            that:
              - "(ansible_failed_result | to_json) is search('not in the published gpu-passthrough tag list')"
            fail_msg: >-
              Expected the direct writer guard to fail, got:
              {{ ansible_failed_result | to_json }}

    - name: Report the policy and writer checks that ran
      ansible.builtin.debug:
        msg: >-
          Verified the tagged NVIDIA writer, all untagged configs, the TUN
          exception, refusal of untagged live GPU access, duplicate catalog
          rejection, and the direct-include guard across
          {{ expected_nvidia_lines | length }} expected NVIDIA lines.
