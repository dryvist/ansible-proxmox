---
driver:
  name: docker

provisioner:
  config_options:
    defaults:
      roles_path: ${MOLECULE_SCENARIO_DIRECTORY}/../../roles

platforms:
  - name: proxmox-zfs-pools-test
    image: "${MOLECULE_IMAGE:-mirror.gcr.io/library/debian:stable-slim}"
    pre_build_image: true
    privileged: true
    tmpfs:
      - /run
      - /tmp
