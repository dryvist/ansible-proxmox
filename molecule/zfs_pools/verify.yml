---
- name: Verify
  hosts: all
  become: false
  gather_facts: true

  vars_files:
    - ../../roles/zfs_pools/defaults/main.yml

  vars:
    zfs_pools_from_tofu:
      pools:
        tank:
          datasets:
            backups:
              quota: "1T"
              properties:
                recordsize: "1M"
                compression: "zstd"
            splunk:
              quota: "500G"
              pvesm_id: tank-splunk

  tasks:
    - name: Re-derive pools from the injected node_storage contract
      ansible.builtin.set_fact:
        zfs_pools_check: "{{ zfs_pools_from_tofu.pools | default({}) }}"

    - name: Assert the contract exposes tank/backups with a 1T quota
      ansible.builtin.assert:
        that:
          - "'tank' in zfs_pools_check"
          - zfs_pools_check.tank.datasets.backups.quota == '1T'
          # Confirms the byte-comparison used for idempotent quota drift.
          - (zfs_pools_check.tank.datasets.backups.quota | human_to_bytes) == 1099511627776
          # Confirms the per-dataset properties map resolves through the contract.
          - zfs_pools_check.tank.datasets.backups.properties.recordsize == '1M'
          - zfs_pools_check.tank.datasets.backups.properties.compression == 'zstd'
        fail_msg: "node_storage contract did not resolve as expected"

    - name: Assert the role default reserves root dataset headroom
      ansible.builtin.assert:
        that:
          - zfs_pools_root_refreservation == '6G'
          - zfs_pools_root_refreservation | human_to_bytes == 6442450944
          - zfs_pools_root_dataset == ''
        fail_msg: "The root reservation defaults changed"

    - name: Resolve a ZFS root with findmnt when no host override is set
      ansible.builtin.include_tasks: ../../roles/zfs_pools/tasks/root_dataset_resolution.yml
      vars:
        zfs_pools_root_findmnt_argv:
          - printf
          - "%s"
          - "zfs tank/ROOT/findmnt"

    - name: Assert findmnt supplies the missing root dataset
      ansible.builtin.assert:
        that:
          - zfs_pools_root_mount_fstype == 'zfs'
          - zfs_pools_root_dataset_resolved == 'tank/ROOT/findmnt'
          - not (zfs_pools_root_mount_findmnt_result.skipped | default(false))

    - name: Preserve a host_vars root dataset override
      ansible.builtin.include_tasks: ../../roles/zfs_pools/tasks/root_dataset_resolution.yml
      vars:
        zfs_pools_root_dataset: tank/ROOT/host-override

    - name: Assert the host_vars root dataset override takes precedence
      ansible.builtin.assert:
        that:
          - zfs_pools_root_mount_fstype == 'zfs'
          - zfs_pools_root_dataset_resolved == 'tank/ROOT/host-override'
          - zfs_pools_root_mount_findmnt_result.skipped | default(false)

    - name: Run root reservation handling for a non-ZFS root
      ansible.builtin.include_tasks: ../../roles/zfs_pools/tasks/root_reservation.yml
      vars:
        zfs_pools_root_findmnt_argv:
          - printf
          - "%s"
          - "ext4 /dev/vda1"

    - name: Assert a non-ZFS root has no reservation dataset or ZFS read
      ansible.builtin.assert:
        that:
          - zfs_pools_root_mount_fstype == 'ext4'
          - zfs_pools_root_dataset_resolved | length == 0
          - zfs_pools_root_reservation_current.skipped | default(false)

    - name: Keep the unresolved ZFS root assertion effective
      block:
        - name: Run root reservation handling without a ZFS source
          ansible.builtin.include_tasks: ../../roles/zfs_pools/tasks/root_reservation.yml
          vars:
            zfs_pools_root_findmnt_argv:
              - printf
              - "%s"
              - zfs
      rescue:
        - name: Record the expected ZFS-root assertion failure
          ansible.builtin.set_fact:
            zfs_pools_root_unresolved_assert_failed: true

    - name: Assert an unresolved ZFS root still fails the reservation guard
      ansible.builtin.assert:
        that:
          - zfs_pools_root_unresolved_assert_failed | default(false)

    - name: Assert the node-local bulk dataset defaults
      ansible.builtin.assert:
        that:
          - zfs_pools_bulk_pool_name == 'bulk'
          - zfs_pools_bulk_node_parent_dataset == 'bulk/' ~ inventory_hostname
          - >-
            zfs_pools_bulk_node_parent_properties ==
            {'canmount': 'off', 'mountpoint': 'none'}
          - zfs_pools_bulk_node_dataset_compression == 'lz4'
          - zfs_pools_bulk_node_dataset_specs | map(attribute='name') | list == ['apt-cache', 'atop']
          - zfs_pools_bulk_node_dataset_specs[0].mountpoint == '/var/cache/apt'
          - zfs_pools_bulk_node_dataset_specs[0].quota == '5G'
          - zfs_pools_bulk_node_dataset_specs[1].mountpoint == '/var/log/atop'
          - zfs_pools_bulk_node_dataset_specs[1].quota == '3G'
        fail_msg: "The node-local bulk dataset defaults changed"

    - name: Assert the per-dataset pvesm_id registration field resolves
      ansible.builtin.assert:
        that:
          # Confirms `pvesm_id` plumbs through the contract, so the
          # dataset_pvesm_register include gate would fire on a real host.
          - zfs_pools_check.tank.datasets.splunk.pvesm_id == 'tank-splunk'
          - zfs_pools_check.tank.datasets.splunk.pvesm_id | length > 0
        fail_msg: "pvesm_id did not resolve through the node_storage contract"

    - name: Probe for ZFS pools (should be absent in the molecule container)
      ansible.builtin.command:
        cmd: zpool list
      register: zfs_pools_zpool_probe
      changed_when: false
      failed_when: false

    - name: Assert the role skipped ZFS under Docker (no pool created)
      ansible.builtin.assert:
        that:
          - zfs_pools_zpool_probe.rc != 0
        fail_msg: "Unexpected zpool present — Docker skip guard may be broken"

    # Import policy: the role now declares the cachefile property and enables
    # the zfs-import units. Both are ZFS/systemd work and must stay behind the
    # same Docker guard as everything else in the role.
    - name: Probe for the ZFS cache file
      ansible.builtin.stat:
        path: /etc/zfs/zpool.cache
      register: zfs_pools_cachefile_probe

    # An enabled unit is a symlink under /etc/systemd/system; none may exist,
    # and the enable would have errored anyway (the unit is not installed here).
    - name: Probe for zfs-import unit enablement symlinks
      ansible.builtin.find:
        paths: /etc/systemd/system
        patterns: "zfs-import*"
        file_type: any
        recurse: true
      register: zfs_pools_import_unit_probe

    - name: Assert the import policy tasks were skipped under Docker
      ansible.builtin.assert:
        that:
          - not zfs_pools_cachefile_probe.stat.exists
          - zfs_pools_import_unit_probe.files | length == 0
        fail_msg: >-
          Import-policy tasks ran in the container — the Docker skip guard on
          import_policy.yml may be broken.

    # Ad-hoc property overrides cannot touch real ZFS in the container, so a
    # stub `zfs` answers reads from fixture files and records every invocation
    # — the same pattern the syncoid scenario uses for its retired-replica
    # guard. vm_disk_properties.yml is included directly because main.yml
    # gates it behind the Docker skip; the file itself has no ZFS of its own
    # and runs against the stub.
    - name: Install the zfs stub the ad-hoc property tasks run against
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          # Record every invocation verbatim; serve `zfs list` and `zfs get`
          # reads from the fixture files and let everything else succeed.
          printf '%s\n' "$*" >> /tmp/zfs-pools-vmprop.log
          if [ "$1" = list ]; then
            for p do :; done
            if grep -Fxq "$p" /tmp/zfs-pools-present.txt 2>/dev/null; then
              printf '%s\n' "$p"
              exit 0
            fi
            printf "cannot open '%s': dataset does not exist\n" "$p" >&2
            exit 1
          fi
          if [ "$1" = get ]; then
            # zfs get [-Hp] -o value <prop> <dataset>: property at position
            # 5, dataset at 6 — the only two get forms the task file runs.
            while read -r ds prop value; do
              if [ "$ds" = "$6" ] && [ "$prop" = "$5" ]; then
                printf '%s\n' "$value"
                exit 0
              fi
            done < /tmp/zfs-pools-get.txt
            printf "cannot open '%s': dataset does not exist\n" "$6" >&2
            exit 1
          fi
          exit 0
        dest: /usr/local/bin/zfs
        mode: "0755"

    - name: Reset the recorded skips and deferred reservations
      ansible.builtin.set_fact:
        zfs_pools_vmdisk_missing: []
        zfs_pools_reservation_deferred: []

    # Branch 1 — the reservation fits the parent's available (needed 800G
    # against 900G free): the set runs after the full read path.
    - name: Seed the fits-case zfs fixtures
      ansible.builtin.copy:
        content: |
          bulk/replica/nodex/subvol-902000-disk-1 reservation 0
          bulk/replica/nodex/subvol-902000-disk-1 used 107374182400
          bulk/replica/nodex available 966367641600
        dest: /tmp/zfs-pools-get.txt
        mode: "0644"

    - name: Seed the fits-case present datasets
      ansible.builtin.copy:
        content: "bulk/replica/nodex/subvol-902000-disk-1\n"
        dest: /tmp/zfs-pools-present.txt
        mode: "0644"

    - name: Reset the zfs stub log for the fits case
      ansible.builtin.copy:
        content: ""
        dest: /tmp/zfs-pools-vmprop.log
        mode: "0644"

    - name: Apply ad-hoc properties where the reservation fits
      ansible.builtin.include_tasks: ../../roles/zfs_pools/tasks/vm_disk_properties.yml
      vars:
        zfs_pools_vmdisk:
          key: bulk/replica/nodex/subvol-902000-disk-1
          value:
            reservation: "900G"

    - name: Read the zfs stub log for the fits case
      ansible.builtin.slurp:
        src: /tmp/zfs-pools-vmprop.log
      register: zfs_pools_fits_log

    - name: Assert the fitting reservation was set through the full read path
      ansible.builtin.assert:
        that:
          - >-
            (zfs_pools_fits_log.content | b64decode).splitlines()
            == ['list -H -o name bulk/replica/nodex/subvol-902000-disk-1',
                'get -H -o value reservation bulk/replica/nodex/subvol-902000-disk-1',
                'get -Hp -o value used bulk/replica/nodex/subvol-902000-disk-1',
                'get -Hp -o value available bulk/replica/nodex',
                'set reservation=900G bulk/replica/nodex/subvol-902000-disk-1']
          - zfs_pools_reservation_deferred == []
          - zfs_pools_vmdisk_missing == []
        fail_msg: >-
          The fitting reservation did not run the expected command sequence.
          Stub log: {{ zfs_pools_fits_log.content | b64decode }}

    # Branch 2 — the reservation exceeds the parent's available (needed 800G
    # against 700G free): the quota on the same dataset still sets (quotas are
    # not gated), the reservation does not, and the shortfall in bytes is
    # recorded with the dataset named.
    - name: Seed the short-case zfs fixtures
      ansible.builtin.copy:
        content: |
          bulk/replica/nodey/subvol-902000-disk-1 reservation 0
          bulk/replica/nodey/subvol-902000-disk-1 quota 0
          bulk/replica/nodey/subvol-902000-disk-1 used 107374182400
          bulk/replica/nodey available 751619276800
        dest: /tmp/zfs-pools-get.txt
        mode: "0644"

    - name: Seed the short-case present datasets
      ansible.builtin.copy:
        content: "bulk/replica/nodey/subvol-902000-disk-1\n"
        dest: /tmp/zfs-pools-present.txt
        mode: "0644"

    - name: Reset the zfs stub log for the short case
      ansible.builtin.copy:
        content: ""
        dest: /tmp/zfs-pools-vmprop.log
        mode: "0644"

    - name: Reset the recorded skips and deferred reservations for the short case
      ansible.builtin.set_fact:
        zfs_pools_vmdisk_missing: []
        zfs_pools_reservation_deferred: []

    - name: Apply ad-hoc properties where the reservation is short
      ansible.builtin.include_tasks: ../../roles/zfs_pools/tasks/vm_disk_properties.yml
      vars:
        zfs_pools_vmdisk:
          key: bulk/replica/nodey/subvol-902000-disk-1
          value:
            reservation: "900G"
            quota: "500G"

    - name: Read the zfs stub log for the short case
      ansible.builtin.slurp:
        src: /tmp/zfs-pools-vmprop.log
      register: zfs_pools_short_log

    - name: Assert a short reservation is skipped, quota applied, shortfall recorded
      ansible.builtin.assert:
        that:
          - >-
            'set quota=500G bulk/replica/nodey/subvol-902000-disk-1'
            in (zfs_pools_short_log.content | b64decode)
          - >-
            'set reservation=900G bulk/replica/nodey/subvol-902000-disk-1'
            not in (zfs_pools_short_log.content | b64decode)
          - >-
            'get -Hp -o value available bulk/replica/nodey'
            in (zfs_pools_short_log.content | b64decode)
          - >-
            zfs_pools_reservation_deferred
            == [{'dataset': 'bulk/replica/nodey/subvol-902000-disk-1',
            'reservation': '900G', 'needed_bytes': 858993459200,
            'available_bytes': 751619276800, 'shortfall_bytes': 107374182400}]
          - zfs_pools_vmdisk_missing == []
        fail_msg: >-
          The short reservation did not warn-and-continue as declared.
          Stub log: {{ zfs_pools_short_log.content | b64decode }}
          Deferred: {{ zfs_pools_reservation_deferred }}

    # Branch 3 — the leaf does not exist yet (the first pull has not run):
    # only the existence check runs, the properties are skipped with a
    # warning, and the converge continues.
    - name: Seed the missing-case zfs fixtures
      ansible.builtin.copy:
        content: |
          bulk/replica/nodez/subvol-902000-disk-1 reservation 0
        dest: /tmp/zfs-pools-get.txt
        mode: "0644"

    - name: Seed the missing-case present datasets as empty
      ansible.builtin.copy:
        content: ""
        dest: /tmp/zfs-pools-present.txt
        mode: "0644"

    - name: Reset the zfs stub log for the missing case
      ansible.builtin.copy:
        content: ""
        dest: /tmp/zfs-pools-vmprop.log
        mode: "0644"

    - name: Reset the recorded skips and deferred reservations for the missing case
      ansible.builtin.set_fact:
        zfs_pools_vmdisk_missing: []
        zfs_pools_reservation_deferred: []

    - name: Apply ad-hoc properties for a missing leaf dataset
      ansible.builtin.include_tasks: ../../roles/zfs_pools/tasks/vm_disk_properties.yml
      vars:
        zfs_pools_vmdisk:
          key: bulk/replica/nodez/subvol-902000-disk-1
          value:
            reservation: "900G"

    - name: Read the zfs stub log for the missing case
      ansible.builtin.slurp:
        src: /tmp/zfs-pools-vmprop.log
      register: zfs_pools_missing_log

    - name: Assert the missing leaf is a warning skip and not a failure
      ansible.builtin.assert:
        that:
          - >-
            (zfs_pools_missing_log.content | b64decode).splitlines()
            == ['list -H -o name bulk/replica/nodez/subvol-902000-disk-1']
          - zfs_pools_vmdisk_missing == ['bulk/replica/nodez/subvol-902000-disk-1']
          - zfs_pools_reservation_deferred == []
        fail_msg: >-
          The missing leaf did not skip cleanly. Stub log:
          {{ zfs_pools_missing_log.content | b64decode }}
