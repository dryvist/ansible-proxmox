---
- name: Verify
  hosts: all
  become: false
  gather_facts: true

  vars_files:
    - ../../roles/zfs_pools/defaults/main.yml

  vars:
    zfs_pools_from_tofu:
      pools:
        tank:
          datasets:
            backups:
              quota: "1T"
              properties:
                recordsize: "1M"
                compression: "zstd"
            splunk:
              quota: "500G"
              pvesm_id: tank-splunk

  tasks:
    - name: Re-derive pools from the injected node_storage contract
      ansible.builtin.set_fact:
        zfs_pools_check: "{{ zfs_pools_from_tofu.pools | default({}) }}"

    - name: Assert the contract exposes tank/backups with a 1T quota
      ansible.builtin.assert:
        that:
          - "'tank' in zfs_pools_check"
          - zfs_pools_check.tank.datasets.backups.quota == '1T'
          # Confirms the byte-comparison used for idempotent quota drift.
          - (zfs_pools_check.tank.datasets.backups.quota | human_to_bytes) == 1099511627776
          # Confirms the per-dataset properties map resolves through the contract.
          - zfs_pools_check.tank.datasets.backups.properties.recordsize == '1M'
          - zfs_pools_check.tank.datasets.backups.properties.compression == 'zstd'
        fail_msg: "node_storage contract did not resolve as expected"

    - name: Assert the role default reserves root dataset headroom
      ansible.builtin.assert:
        that:
          - zfs_pools_root_refreservation == '6G'
          - zfs_pools_root_refreservation | human_to_bytes == 6442450944
          - zfs_pools_root_dataset == ''
        fail_msg: "The root reservation defaults changed"

    - name: Resolve a ZFS root with findmnt when no host override is set
      ansible.builtin.include_tasks: ../../roles/zfs_pools/tasks/root_dataset_resolution.yml
      vars:
        zfs_pools_root_findmnt_argv:
          - printf
          - "%s"
          - "zfs tank/ROOT/findmnt"

    - name: Assert findmnt supplies the missing root dataset
      ansible.builtin.assert:
        that:
          - zfs_pools_root_mount_fstype == 'zfs'
          - zfs_pools_root_dataset_resolved == 'tank/ROOT/findmnt'
          - not (zfs_pools_root_mount_findmnt_result.skipped | default(false))

    - name: Preserve a host_vars root dataset override
      ansible.builtin.include_tasks: ../../roles/zfs_pools/tasks/root_dataset_resolution.yml
      vars:
        zfs_pools_root_dataset: tank/ROOT/host-override

    - name: Assert the host_vars root dataset override takes precedence
      ansible.builtin.assert:
        that:
          - zfs_pools_root_mount_fstype == 'zfs'
          - zfs_pools_root_dataset_resolved == 'tank/ROOT/host-override'
          - zfs_pools_root_mount_findmnt_result.skipped | default(false)

    - name: Run root reservation handling for a non-ZFS root
      ansible.builtin.include_tasks: ../../roles/zfs_pools/tasks/root_reservation.yml
      vars:
        zfs_pools_root_findmnt_argv:
          - printf
          - "%s"
          - "ext4 /dev/vda1"

    - name: Assert a non-ZFS root has no reservation dataset or ZFS read
      ansible.builtin.assert:
        that:
          - zfs_pools_root_mount_fstype == 'ext4'
          - zfs_pools_root_dataset_resolved | length == 0
          - zfs_pools_root_reservation_current.skipped | default(false)

    - name: Keep the unresolved ZFS root assertion effective
      block:
        - name: Run root reservation handling without a ZFS source
          ansible.builtin.include_tasks: ../../roles/zfs_pools/tasks/root_reservation.yml
          vars:
            zfs_pools_root_findmnt_argv:
              - printf
              - "%s"
              - zfs
      rescue:
        - name: Record the expected ZFS-root assertion failure
          ansible.builtin.set_fact:
            zfs_pools_root_unresolved_assert_failed: true

    - name: Assert an unresolved ZFS root still fails the reservation guard
      ansible.builtin.assert:
        that:
          - zfs_pools_root_unresolved_assert_failed | default(false)

    - name: Assert the node-local bulk dataset defaults
      ansible.builtin.assert:
        that:
          - zfs_pools_bulk_pool_name == 'bulk'
          - zfs_pools_bulk_node_parent_dataset == 'bulk/' ~ inventory_hostname
          - >-
            zfs_pools_bulk_node_parent_properties ==
            {'canmount': 'off', 'mountpoint': 'none'}
          - zfs_pools_bulk_node_dataset_compression == 'lz4'
          - zfs_pools_bulk_node_dataset_specs | map(attribute='name') | list == ['apt-cache', 'atop']
          - zfs_pools_bulk_node_dataset_specs[0].mountpoint == '/var/cache/apt'
          - zfs_pools_bulk_node_dataset_specs[0].quota == '5G'
          - zfs_pools_bulk_node_dataset_specs[1].mountpoint == '/var/log/atop'
          - zfs_pools_bulk_node_dataset_specs[1].quota == '3G'
        fail_msg: "The node-local bulk dataset defaults changed"

    - name: Assert the per-dataset pvesm_id registration field resolves
      ansible.builtin.assert:
        that:
          # Confirms `pvesm_id` plumbs through the contract, so the
          # dataset_pvesm_register include gate would fire on a real host.
          - zfs_pools_check.tank.datasets.splunk.pvesm_id == 'tank-splunk'
          - zfs_pools_check.tank.datasets.splunk.pvesm_id | length > 0
        fail_msg: "pvesm_id did not resolve through the node_storage contract"

    - name: Probe for ZFS pools (should be absent in the molecule container)
      ansible.builtin.command:
        cmd: zpool list
      register: zfs_pools_zpool_probe
      changed_when: false
      failed_when: false

    - name: Assert the role skipped ZFS under Docker (no pool created)
      ansible.builtin.assert:
        that:
          - zfs_pools_zpool_probe.rc != 0
        fail_msg: "Unexpected zpool present — Docker skip guard may be broken"

    # Import policy: the role now declares the cachefile property and enables
    # the zfs-import units. Both are ZFS/systemd work and must stay behind the
    # same Docker guard as everything else in the role.
    - name: Probe for the ZFS cache file
      ansible.builtin.stat:
        path: /etc/zfs/zpool.cache
      register: zfs_pools_cachefile_probe

    # An enabled unit is a symlink under /etc/systemd/system; none may exist,
    # and the enable would have errored anyway (the unit is not installed here).
    - name: Probe for zfs-import unit enablement symlinks
      ansible.builtin.find:
        paths: /etc/systemd/system
        patterns: "zfs-import*"
        file_type: any
        recurse: true
      register: zfs_pools_import_unit_probe

    - name: Assert the import policy tasks were skipped under Docker
      ansible.builtin.assert:
        that:
          - not zfs_pools_cachefile_probe.stat.exists
          - zfs_pools_import_unit_probe.files | length == 0
        fail_msg: >-
          Import-policy tasks ran in the container — the Docker skip guard on
          import_policy.yml may be broken.
