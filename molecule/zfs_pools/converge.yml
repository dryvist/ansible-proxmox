---
- name: Converge
  hosts: all
  become: false
  gather_facts: true

  vars:
    # Mirrors a terraform-proxmox ansible_inventory.node_storage entry, the
    # live per-node contract (tank raidz1 + tank/backups). ZFS/pvesm tasks are
    # skipped under Docker; this proves the role converges and the contract
    # plumbing resolves. The `splunk` dataset additionally carries `pvesm_id`
    # to exercise the per-dataset zfspool-registration include gate.
    zfs_pools_from_tofu:
      pools:
        tank:
          type: zfspool
          raid: raidz1
          protected: true
          register: true
          content:
            - images
            - rootdir
          datasets:
            backups:
              quota: "1T"
              properties:
                recordsize: "1M"
                compression: "zstd"
            splunk:
              quota: "500G"
              pvesm_id: tank-splunk

  roles:
    - role: zfs_pools
