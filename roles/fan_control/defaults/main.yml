---
fan_control_api_url: http://127.0.0.1:11987
# renovate: datasource=github-releases depName=codifryed/coolercontrol
fan_control_coolercontrol_version: "5.0.1"
fan_control_active_mode: raised
fan_control_bao_addr: >-
  {{ lookup('env', 'BAO_ADDR')
     | default(lookup('env', 'VAULT_ADDR') | default('', true), true) }}
fan_control_bao_token: "{{ lookup('env', 'BAO_TOKEN') | default('', true) }}"
fan_control_bao_kv_mount: secret
fan_control_bao_path: apps/fan-control-write
fan_control_board_curve:
  - [30, 55]
  - [40, 70]
  - [50, 85]
  - [60, 100]
fan_control_gpu_curve:
  - [30, 45]
  - [40, 65]
  - [55, 85]
  - [70, 100]
fan_control_function_uid: 683e8b10-ff1a-4a6a-9e8b-683e8b100001
fan_control_board_profile_uid: 683e8b10-ff1a-4a6a-9e8b-683e8b100002
fan_control_gpu_profile_uid: 683e8b10-ff1a-4a6a-9e8b-683e8b100003
