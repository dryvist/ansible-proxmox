---
# Common role defaults

common_packages:
  - htop
  - iotop
  - lm-sensors
  - rasdaemon

# Search domain for host resolv.conf: the tofu-published domain when the
# inventory is loaded (site.yml), else the node's own domain fact.
common_dns_search_domain: >-
  {{ hostvars['localhost'].tofu_data.domain
     if hostvars['localhost'].tofu_data is defined
     else ansible_domain }}

# Outbound system mail (Proxmox notifications, cron mail, apt/unattended-upgrades
# output) relays through the existing Mailpit LXC instead of postfix's out-of-the-box
# empty relayhost, which tries direct-to-MX delivery on port 25 — permanently
# blocked outbound on this network. Left unfixed, mail queues forever (observed:
# 700+ KB / 32 messages stuck on one node alone) and nobody is warned, because the
# bounce goes back into the same broken pipe.
#
# Same internal-relay pattern already used by Zammad (see ansible-proxmox-apps
# inventory/group_vars/zammad_group.yml: zammad_smtp_host) — no auth, no TLS,
# LAN-only. Mail lands in Mailpit's web UI (http://mailpit.<domain>:8025) instead
# of a real inbox; it does NOT reach a human by itself. Proxmox's own critical
# notifications already reach a human today via the `proxman` webhook target in
# notifications.cfg (confirmed firing in the journal on every event), so this
# does not regress alerting — it only stops the pointless SMTP retries and the
# unbounded mailq growth for general system mail.
#
common_postfix_relay_enabled: true
common_postfix_relay_host: "mailpit.{{ domain_from_tofu }}"
# Pinned to 1025 (terraform-proxmox notification_ports.mailpit_smtp) since this
# repo does not inject tofu_data.constants (same reasoning as
# pve_syslog_forwarder_target_port) — keep in sync with
# tofu-proxmox/modules/proxmox-stack/constants.tf.
common_postfix_relay_port: 1025
