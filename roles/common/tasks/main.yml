---
# Common role tasks

# Proxmox apt repository management (no-subscription, deb822 .sources) lives in
# the pve_repositories role, which runs immediately before this role in site.yml.
# That role is the single source of truth for which Proxmox/Ceph repositories are
# enabled, so every node — including freshly commissioned ones — is on the
# no-subscription channel automatically, before any apt operation here. This role
# only refreshes the cache and installs the baseline packages.

# Estate timezone doctrine: every host logs UTC so no consumer ever needs a
# per-source timezone override (which the Cribl pipeline provably strips).
# Nodes installed interactively defaulted to a local zone and stamped every
# RFC3164 syslog line hours off; enforce UTC here so a rebuilt or newly
# commissioned node can never reintroduce the skew.
- name: Set the system timezone to UTC
  community.general.timezone:
    name: Etc/UTC
  notify: Restart rsyslog for the timezone change
  tags:
    - common

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags:
    - common
    - packages

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  tags:
    - common
    - packages

- name: Create systemd override directories for common services
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - docker
    - rasdaemon
    - lm-sensors
  tags:
    - common
    - services

- name: Configure restart policies for common services
  ansible.builtin.copy:
    content: |
      [Service]
      Restart=on-failure
      RestartSec=5s
    dest: "/etc/systemd/system/{{ item }}.service.d/restart-policy.conf"
    owner: root
    group: root
    mode: "0644"
  loop:
    - docker
    - rasdaemon
    - lm-sensors
  notify: Reload systemd daemon
  tags:
    - common
    - services

- name: Enable rasdaemon service
  ansible.builtin.systemd:
    name: rasdaemon
    enabled: true
    state: started
  tags:
    - common
    - services

- name: Enable lm-sensors service
  ansible.builtin.systemd:
    name: lm-sensors
    enabled: true
    state: started
  tags:
    - common
    - services

# Host DNS: every node resolves via its OWN subnet's gateway (the UniFi
# VLAN gateway relays DNS), derived from live facts — never a hard-coded
# cross-VLAN literal. Hand-set 10.0.1.1 entries left pve1/pve3/pve4
# resolving across VLANs, which flapped every FQDN-dependent host service
# (rsyslog forwarding, CRM loops) whenever inter-VLAN policy or the
# default-VLAN gateway hiccuped.
- name: Resolve host DNS via the node's own gateway
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    mode: "0644"
    content: |
      # Managed by Ansible (common role) — do not edit manually.
      search {{ common_dns_search_domain }}
      nameserver {{ ansible_default_ipv4.gateway }}
  when: ansible_default_ipv4.gateway is defined
  tags:
    - common
    - dns

# Postfix ships with an empty relayhost, so it tries direct-to-MX delivery on
# port 25 — blocked outbound on this network — and mail queues forever with no
# one warned (the bounce goes back into the same broken pipe). Relay through the
# Mailpit LXC instead, same pattern as Zammad's outbound mail (see
# common_postfix_relay_host in defaults/main.yml for the full rationale).
- name: Relay outbound mail through Mailpit instead of direct-to-MX
  when: common_postfix_relay_enabled | bool
  tags:
    - common
    - postfix
  block:
    - name: Assert the OpenTofu domain resolved for the Mailpit relay target
      ansible.builtin.assert:
        that:
          - domain_from_tofu | default('') | length > 0
        fail_msg: >-
          common_postfix_relay_host needs domain_from_tofu, which
          playbooks/load_tofu.yml injects onto every proxmox host. Run this
          role via site.yml (or another play that imports load_tofu.yml first),
          not standalone.
        quiet: true

    - name: Set postfix relayhost to the Mailpit LXC
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: "^relayhost\\s*="
        line: "relayhost = [{{ common_postfix_relay_host }}]:{{ common_postfix_relay_port }}"
      notify: Restart postfix
