---
# Common role tasks

- name: Proxmox no-subscription repository
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-no-subscription"
    state: "{{ 'absent' if (proxmox_subscription_key is not none and proxmox_remove_nosubscription_repo | bool) else 'present' }}"
    filename: pve-no-subscription
  tags:
    - common
    - repositories

- name: Proxmox enterprise repository
  ansible.builtin.apt_repository:
    repo: "deb https://enterprise.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-enterprise"
    state: "{{ 'present' if proxmox_subscription_key is not none else 'absent' }}"
    filename: pve-enterprise
  tags:
    - common
    - repositories

- name: Store Proxmox subscription key
  ansible.builtin.copy:
    content: "{{ proxmox_subscription_key }}"
    dest: /etc/pve/subscription
    owner: root
    group: root
    mode: "0600"
  when: proxmox_subscription_key is not none
  no_log: true
  tags:
    - common
    - repositories

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags:
    - common
    - packages

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  tags:
    - common
    - packages

- name: Create systemd override directories for common services
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - docker
    - rasdaemon
    - lm-sensors
  tags:
    - common
    - services

- name: Configure restart policies for common services
  ansible.builtin.copy:
    content: |
      [Service]
      Restart=on-failure
      RestartSec=5s
    dest: "/etc/systemd/system/{{ item }}.service.d/restart-policy.conf"
    owner: root
    group: root
    mode: "0644"
  loop:
    - docker
    - rasdaemon
    - lm-sensors
  notify: Reload systemd daemon
  tags:
    - common
    - services

- name: Enable rasdaemon service
  ansible.builtin.systemd:
    name: rasdaemon
    enabled: true
    state: started
  tags:
    - common
    - services

- name: Enable lm-sensors service
  ansible.builtin.systemd:
    name: lm-sensors
    enabled: true
    state: started
  tags:
    - common
    - services
