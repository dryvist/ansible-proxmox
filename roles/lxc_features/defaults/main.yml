---
# Root-only Proxmox LXC features for guests selected by the
# `container-nesting` capability tag. The service -> VMID projection comes from
# playbooks/load_tofu.yml; no guest names or VMIDs live in role configuration.

lxc_features_service_vmids_from_tofu: {}

lxc_features_desired_tokens:
  - nesting=1
  - keyctl=1
  - fuse=1

lxc_features_desired_features: "{{ lxc_features_desired_tokens | join(',') }}"
