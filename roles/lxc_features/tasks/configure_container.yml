---
# item.key = Tofu service key; item.value = current VMID

- name: "Read current config for container {{ item.value }}"
  ansible.builtin.command:
    cmd: "pct config {{ item.value }}"
  register: lxc_features_cfg
  changed_when: false
  tags:
    - lxc_features

- name: "Parse current features for container {{ item.value }}"
  ansible.builtin.set_fact:
    lxc_features_current_tokens: >-
      {{
        lxc_features_cfg.stdout_lines
        | select('match', '^features:')
        | map('regex_replace', '^features:\s*', '')
        | list | first | default('')
        | split(',') | select('truthy') | list
      }}
  tags:
    - lxc_features

- name: "Apply required features to container {{ item.value }}"
  when:
    - (lxc_features_current_tokens | sort)
      != (lxc_features_desired_tokens | sort)
  block:
    - name: "Set required features on container {{ item.value }}"
      ansible.builtin.command:
        cmd: >-
          pct set {{ item.value }} --features
          {{ lxc_features_desired_features }}
      changed_when: true
      notify: Restart changed LXC feature containers
      register: lxc_features_set
      tags:
        - lxc_features

    - name: "Record feature change for container {{ item.value }}"
      ansible.builtin.set_fact:
        lxc_features_changed: "{{ lxc_features_changed + [item.value | string] }}"
      when: lxc_features_set is defined and lxc_features_set.changed
      tags:
        - lxc_features
