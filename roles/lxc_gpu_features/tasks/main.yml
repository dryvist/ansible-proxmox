---
# lxc_gpu_features role tasks
#
# Applies root-only AMD GPU device passthrough to GPU LXCs that the BPG Proxmox
# API token cannot set (403; root@pam only). Runs over native root SSH,
# idempotently, only on vmids that actually exist on the host.
#
# The feature map is keyed by SERVICE NAME. The effective vmid -> features map is
# built here by resolving each service's CURRENT vmid from the tofu
# inventory (lxc_gpu_features_service_vmids), so a vmid renumber needs no role
# change — only tofu_inventory.json updates. Services without a resolved
# vmid (not in the inventory) contribute nothing.

- name: Require the published container catalog and gpu-passthrough VMID list
  ansible.builtin.assert:
    that:
      - lxc_gpu_features_container_catalog_from_tofu is defined
      - lxc_gpu_features_container_catalog_from_tofu is mapping
      - lxc_gpu_features_gpu_passthrough_vmids_from_tofu is defined
      - lxc_gpu_features_gpu_passthrough_vmids_from_tofu is sequence
      - lxc_gpu_features_gpu_passthrough_vmids_from_tofu is not string
    fail_msg: >-
      GPU passthrough is disabled: the published container catalog and
      gpu-passthrough VMID list must be supplied by playbooks/load_tofu.yml.
      Refusing to write GPU access without that tag projection.
  tags:
    - lxc_gpu_features

- name: Select gpu-passthrough entries from the published container catalog
  ansible.builtin.set_fact:
    lxc_gpu_features_gpu_passthrough_catalog_entries: >-
      {{
        lxc_gpu_features_container_catalog_from_tofu | dict2items
        | selectattr('value.tags', 'defined')
        | selectattr('value.tags', 'contains', 'gpu-passthrough') | list
      }}
  tags:
    - lxc_gpu_features

- name: Require node and VMID metadata for every gpu-passthrough container
  ansible.builtin.assert:
    that:
      - >-
        lxc_gpu_features_gpu_passthrough_catalog_entries
        | selectattr('value.node', 'defined') | list | length
        == lxc_gpu_features_gpu_passthrough_catalog_entries | length
      - >-
        lxc_gpu_features_gpu_passthrough_catalog_entries
        | selectattr('value.ansible_pct_vmid', 'defined') | list | length
        == lxc_gpu_features_gpu_passthrough_catalog_entries | length
      - >-
        lxc_gpu_features_gpu_passthrough_vmids_from_tofu | map('string') | sort
        == lxc_gpu_features_gpu_passthrough_catalog_entries
           | map(attribute='value.ansible_pct_vmid') | map('string') | sort
    fail_msg: >-
      The gpu-passthrough projection must match catalog entries, and every
      tagged entry must include node and ansible_pct_vmid metadata.
  tags:
    - lxc_gpu_features

- name: Assert at most one gpu-passthrough container per Proxmox node
  ansible.builtin.assert:
    that:
      - >-
        lxc_gpu_features_gpu_passthrough_catalog_entries
        | selectattr('value.node', 'equalto', lxc_gpu_features_gpu_passthrough_node)
        | list | length <= 1
    fail_msg: >-
      More than one container on Proxmox node {{ lxc_gpu_features_gpu_passthrough_node }}
      is tagged gpu-passthrough; at most one GPU-passthrough container is allowed per node.
  loop: >-
    {{ lxc_gpu_features_gpu_passthrough_catalog_entries
       | map(attribute='value.node') | unique | list }}
  loop_control:
    loop_var: lxc_gpu_features_gpu_passthrough_node
    label: "Proxmox node {{ lxc_gpu_features_gpu_passthrough_node }}"
  tags:
    - lxc_gpu_features

- name: Select GPU services that have a vmid in the tofu inventory
  ansible.builtin.set_fact:
    lxc_gpu_features_selected: >-
      {{
        lxc_gpu_features_map | dict2items
        | selectattr('key', 'in', lxc_gpu_features_service_vmids)
        | list
      }}
  tags:
    - lxc_gpu_features

- name: Resolve the GPU service feature map to current vmids
  ansible.builtin.set_fact:
    lxc_gpu_features_service_resolved: >-
      {{
        dict(
          (
            lxc_gpu_features_selected
            | map(attribute='key')
            | map('extract', lxc_gpu_features_service_vmids)
            | map('string') | list
          )
          | zip(lxc_gpu_features_selected | map(attribute='value') | list)
        )
      }}
  tags:
    - lxc_gpu_features

- name: Resolve NVIDIA-tagged guests to current vmids
  ansible.builtin.set_fact:
    lxc_gpu_features_nvidia_resolved: >-
      {{
        dict(
          (lxc_gpu_features_nvidia_vmids_from_tofu | default({}) | dict2items
           | map(attribute='value') | map('string') | list)
          | zip(
              [lxc_gpu_features_nvidia_guest_features]
              * (lxc_gpu_features_nvidia_vmids_from_tofu | default({}) | length)
            )
        )
      }}
  tags:
    - lxc_gpu_features

- name: Combine service and engine GPU feature mappings
  ansible.builtin.set_fact:
    lxc_gpu_features_resolved: >-
      {{ lxc_gpu_features_service_resolved | combine(lxc_gpu_features_nvidia_resolved) }}
  tags:
    - lxc_gpu_features

- name: Restrict the GPU writer map to gpu-passthrough VMIDs
  ansible.builtin.set_fact:
    lxc_gpu_features_resolved: >-
      {{
        lxc_gpu_features_resolved | dict2items
        | selectattr('key', 'in', lxc_gpu_features_gpu_passthrough_vmids_from_tofu | map('string') | list)
        | list | items2dict
      }}
  tags:
    - lxc_gpu_features

- name: Find all LXC configuration files on this node
  ansible.builtin.find:
    paths: /etc/pve/lxc
    patterns: "*.conf"
    file_type: file
    recurse: false
  register: lxc_gpu_features_live_configs
  check_mode: false
  tags:
    - lxc_gpu_features

- name: Read all LXC configuration files on this node
  ansible.builtin.slurp:
    src: "{{ lxc_gpu_features_config_file.path }}"
  loop: "{{ lxc_gpu_features_live_configs.files | default([]) }}"
  loop_control:
    loop_var: lxc_gpu_features_config_file
    label: "{{ lxc_gpu_features_config_file.path }}"
  register: lxc_gpu_features_live_config_contents
  check_mode: false
  tags:
    - lxc_gpu_features

- name: Refuse GPU device access in untagged LXC configurations
  ansible.builtin.assert:
    that:
      - >-
        (lxc_gpu_features_config_content.lxc_gpu_features_config_file.path
         | basename | regex_replace('\\.conf$', '') | string)
        in (lxc_gpu_features_gpu_passthrough_vmids_from_tofu | map('string') | list)
        or
        ((lxc_gpu_features_config_content.content | b64decode).splitlines()
         | select('search', lxc_gpu_features_unsafe_gpu_access_regex)
         | list | length == 0)
    fail_msg: >-
      Refusing GPU passthrough: untagged VMID
      {{ lxc_gpu_features_config_content.lxc_gpu_features_config_file.path
         | basename | regex_replace('\\.conf$', '') }} has GPU device access in
      {{ lxc_gpu_features_config_content.lxc_gpu_features_config_file.path }}.
      Remove the device lines or assign gpu-passthrough to the sole approved
      container on this node.
  loop: "{{ lxc_gpu_features_live_config_contents.results | default([]) }}"
  loop_control:
    loop_var: lxc_gpu_features_config_content
    label: "{{ lxc_gpu_features_config_content.lxc_gpu_features_config_file.path }}"
  tags:
    - lxc_gpu_features

- name: Enumerate LXC containers present on this host
  ansible.builtin.command:
    cmd: pct list
  register: lxc_gpu_features_pct_list
  changed_when: false
  # Read-only; a check run needs the live container list to preview GPU features.
  check_mode: false
  when: ansible_virtualization_type | default('') != 'docker'
  tags:
    - lxc_gpu_features

- name: Build the set of vmids present on this host
  ansible.builtin.set_fact:
    lxc_gpu_features_present: >-
      {{
        lxc_gpu_features_pct_list.stdout_lines | default([])
        | map('regex_search', '^\d+')
        | select('truthy')
        | list
      }}
  when: ansible_virtualization_type | default('') != 'docker'
  tags:
    - lxc_gpu_features

- name: Log the legacy GPU guest runtime handoff decision
  ansible.builtin.debug:
    msg: >-
      GPU engine legacy handoff candidates={{ lxc_gpu_features_legacy_engine_vmids_from_tofu | default({}) | length }};
      candidates present on this host={{
        (lxc_gpu_features_legacy_engine_vmids_from_tofu | default({}) | dict2items
         | map(attribute='value') | map('string') | select('in', lxc_gpu_features_present | default([]))
         | list | length)
      }}.
  when: ansible_virtualization_type | default('') != 'docker'
  tags:
    - lxc_gpu_features

- name: Resolve the pre-cutover GPU guest candidates present on this host
  ansible.builtin.set_fact:
    lxc_gpu_features_engine_handoff_present: >-
      {{ lxc_gpu_features_engine_handoff_vmids_from_tofu | default({}) | dict2items
         | map(attribute='value') | map('string')
         | select('in', lxc_gpu_features_present | default([])) | list }}
  when: ansible_virtualization_type | default('') != 'docker'
  tags:
    - lxc_gpu_features

- name: Log the explicit pre-cutover GPU guest decisions
  ansible.builtin.debug:
    msg: >-
      GPU engine pre-cutover stop requested={{ lxc_gpu_features_engine_handoff_pre_stop | bool }};
      selected candidates={{ lxc_gpu_features_engine_handoff_vmids_from_tofu | default({}) | length }};
      candidates present on this host={{ lxc_gpu_features_engine_handoff_present | default([]) | length }}.
  when: ansible_virtualization_type | default('') != 'docker'
  tags:
    - lxc_gpu_features

- name: Require a GPU guest candidate when pre-cutover stop is requested
  ansible.builtin.assert:
    that:
      - lxc_gpu_features_engine_handoff_present | default([]) | length > 0
    fail_msg: >-
      Pre-cutover GPU handoff was requested, but no published GPU guest
      candidate exists on this host. Confirm the inventory and host limit before
      applying a selector change.
    success_msg: >-
      Pre-cutover GPU handoff will stop
      {{ lxc_gpu_features_engine_handoff_present | length }} candidate(s) on this host.
  when:
    - ansible_virtualization_type | default('') != 'docker'
    - lxc_gpu_features_engine_handoff_pre_stop | bool
  tags:
    - lxc_gpu_features

- name: Gracefully stop GPU guest candidates before a selector-changing apply
  ansible.builtin.include_tasks: manage_engine_legacy.yml
  loop: >-
    {{ lxc_gpu_features_engine_handoff_vmids_from_tofu | default({}) | dict2items }}
  loop_control:
    loop_var: lxc_gpu_features_legacy_guest
    label: "GPU engine handoff candidate {{ lxc_gpu_features_legacy_guest.value }}"
  when:
    - ansible_virtualization_type | default('') != 'docker'
    - lxc_gpu_features_engine_handoff_pre_stop | bool
    - (lxc_gpu_features_legacy_guest.value | string) in (lxc_gpu_features_present | default([]))
  tags:
    - lxc_gpu_features

- name: Stop the old GPU guest before applying replacement passthrough
  ansible.builtin.include_tasks: manage_engine_legacy.yml
  loop: >-
    {{ lxc_gpu_features_legacy_engine_vmids_from_tofu | default({}) | dict2items }}
  loop_control:
    loop_var: lxc_gpu_features_legacy_guest
    label: "legacy GPU guest {{ lxc_gpu_features_legacy_guest.value }}"
  when:
    - ansible_virtualization_type | default('') != 'docker'
    - (lxc_gpu_features_legacy_guest.value | string) in (lxc_gpu_features_present | default([]))
  tags:
    - lxc_gpu_features

# NVIDIA character-device majors are handed out dynamically at module load, so
# unlike the AMD constants they are read off the host's real device nodes.
# `stat -c '%t'` prints the major in hex.
#
# Runs once per host and only when some container on it actually asks for
# nvidia, so this costs nothing on the AMD nodes.
# `shell`, not `command`, and the quoting is the entire reason. The command
# module splits on whitespace, so an unquoted `stat -c %t %n` passes `%n` as a
# FILENAME rather than as part of the format string. stat then prints only the
# major for each real device and writes `cannot statx '%n'` to stderr, so the
# parse below sees lines with no path in them at all — and produces device
# entries pointing at strings like "1ff".
- name: Enumerate the host's NVIDIA character devices
  ansible.builtin.shell:
    cmd: >-
      find {{ lxc_gpu_features_nvidia_device_root }}
      -maxdepth {{ lxc_gpu_features_nvidia_device_depth }}
      -name 'nvidia*' -type c -exec stat -c '%t %n' {} +
  register: lxc_gpu_features_nvidia_find
  changed_when: false
  # Read-only; a check run needs the live device nodes to preview GPU mappings.
  check_mode: false
  # An absent /dev/nvidia* set is not an error here — it is the "host driver not
  # installed, or the nodes did not survive the last reboot" case, which the
  # assert below names explicitly rather than letting find's exit code decide.
  # It does NOT excuse stat failing: that is a malformed command, not an absent
  # device, so anything on stderr fails the task.
  failed_when: lxc_gpu_features_nvidia_find.stderr | default('') | trim | length > 0
  when:
    - ansible_virtualization_type | default('') != 'docker'
    - lxc_gpu_features_nvidia_requested | bool
  tags:
    - lxc_gpu_features

- name: Resolve the NVIDIA device paths and their majors
  ansible.builtin.set_fact:
    lxc_gpu_features_nvidia_paths: >-
      {{ lxc_gpu_features_nvidia_lines | map('split', ' ') | map('last') | list }}
    lxc_gpu_features_nvidia_majors: >-
      {{ lxc_gpu_features_nvidia_lines | map('split', ' ') | map('first')
         | map('int', 0, 16) | unique | list }}
  vars:
    lxc_gpu_features_nvidia_lines: >-
      {{ (lxc_gpu_features_nvidia_find.stdout_lines | default([]))
         | select('truthy') | list }}
  when:
    - ansible_virtualization_type | default('') != 'docker'
    - lxc_gpu_features_nvidia_requested | bool
  tags:
    - lxc_gpu_features

# Fail loud rather than write a config that binds nothing. A container whose
# device entries point at paths the host does not have starts perfectly happily
# and simply has no GPU — there is no error anywhere, and the symptom surfaces
# much later as an inference workload silently running on CPU.
#
# Non-emptiness alone is NOT enough, and assuming it was is what let a
# malformed enumerate command through: it produced a non-empty list whose
# entries were bare majors rather than paths. Every entry must look like an
# absolute path under the device root, or the parse did not do what it claims.
- name: Fail loud when NVIDIA passthrough is requested but the host has no device nodes
  ansible.builtin.assert:
    that:
      - lxc_gpu_features_nvidia_paths | default([]) | length > 0
      - >-
        lxc_gpu_features_nvidia_paths | default([])
        | reject('match', '^' ~ lxc_gpu_features_nvidia_device_root ~ '/')
        | list | length == 0
    fail_msg: >-
      NVIDIA passthrough is requested for a container on this host, but no
      /dev/nvidia* character devices exist. Install the host driver (the
      nvidia_driver role) and confirm the nodes are present AFTER a reboot --
      they are created on demand, so on a headless host they can be absent even
      with the driver installed and loaded. nvidia-persistenced does NOT create
      them; the nvidia-device-nodes.service oneshot (nvidia-modprobe -c 0 -u)
      does, and that unit is what must be enabled.
      Resolved paths were: {{ lxc_gpu_features_nvidia_paths | default([]) }}.
      If that list is non-empty but its entries are not absolute paths under
      {{ lxc_gpu_features_nvidia_device_root }}, the devices exist and the
      ENUMERATION is malformed — check the stat format string is quoted as one
      argument rather than split into a format plus a filename.
  when:
    - ansible_virtualization_type | default('') != 'docker'
    - lxc_gpu_features_nvidia_requested | bool
  tags:
    - lxc_gpu_features

- name: Reset the changed-container accumulator
  ansible.builtin.set_fact:
    lxc_gpu_features_changed: []
  tags:
    - lxc_gpu_features

- name: Apply GPU passthrough to each present GPU container
  ansible.builtin.include_tasks: configure_container.yml
  loop: "{{ lxc_gpu_features_resolved | default({}) | dict2items }}"
  loop_control:
    loop_var: gpu_ct
    label: "container {{ gpu_ct.key }}"
  when:
    - ansible_virtualization_type | default('') != 'docker'
    - gpu_ct.key in lxc_gpu_features_present | default([])
  tags:
    - lxc_gpu_features
