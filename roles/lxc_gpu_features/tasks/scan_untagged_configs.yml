---
# Refuse to proceed while any untagged LXC config on this node already holds
# GPU device access. Live configs include containers Tofu does not manage.

- name: Find the LXC configuration files of every container not tagged gpu-passthrough
  ansible.builtin.find:
    paths: /etc/pve/lxc
    patterns: "*.conf"
    excludes: >-
      {{ lxc_gpu_features_gpu_passthrough_vmids_from_tofu
         | map('regex_replace', '$', '.conf') | list }}
    file_type: file
    recurse: false
  register: lxc_gpu_features_live_configs
  check_mode: false
  tags:
    - lxc_gpu_features

- name: Require the LXC configuration directory to be readable
  ansible.builtin.assert:
    that:
      - lxc_gpu_features_live_configs.skipped_paths | default({}) | length == 0
    fail_msg: >-
      Cannot scan LXC configurations for GPU device access:
      {{ lxc_gpu_features_live_configs.skipped_paths | default({}) }}
  tags:
    - lxc_gpu_features

- name: Read the untagged LXC configuration files
  ansible.builtin.slurp:
    src: "{{ lxc_gpu_features_config_file.path }}"
  loop: "{{ lxc_gpu_features_live_configs.files }}"
  loop_control:
    loop_var: lxc_gpu_features_config_file
    label: "{{ lxc_gpu_features_config_file.path }}"
  register: lxc_gpu_features_live_config_contents
  check_mode: false
  no_log: true
  tags:
    - lxc_gpu_features

- name: Refuse GPU device access in untagged LXC configurations
  ansible.builtin.assert:
    that:
      - lxc_gpu_features_gpu_lines | length == 0
    fail_msg: >-
      Refusing GPU passthrough: untagged VMID
      {{ lxc_gpu_features_config_content.source | basename | replace('.conf', '') }}
      has GPU device access in {{ lxc_gpu_features_config_content.source }}:
      {{ lxc_gpu_features_gpu_lines }}.
      Remove those lines, or tag the sole approved container on this node
      gpu-passthrough in OpenTofu.
  vars:
    lxc_gpu_features_gpu_lines: >-
      {{ (lxc_gpu_features_config_content.content | b64decode).splitlines()
         | select('search', lxc_gpu_features_unsafe_gpu_access_regex) | list }}
  loop: "{{ lxc_gpu_features_live_config_contents.results }}"
  loop_control:
    loop_var: lxc_gpu_features_config_content
    label: "{{ lxc_gpu_features_config_content.source }}"
  tags:
    - lxc_gpu_features
