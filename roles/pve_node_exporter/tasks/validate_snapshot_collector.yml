---
# Included from main.yml when the snapshot collector is enabled, and run
# directly by tests/pve_node_exporter/verify_unit.yml.

- name: Assert the zfs_exporter snapshot collector configuration is valid
  ansible.builtin.assert:
    that:
      - pve_node_exporter_zfs_exporter_snapshot_properties | length > 0
      - pve_node_exporter_zfs_exporter_snapshot_excludes | reject('contains', '@') | list | length == 0
    fail_msg: >-
      pve_node_exporter_zfs_exporter_snapshot_properties must not be empty,
      and every pve_node_exporter_zfs_exporter_snapshot_excludes entry must
      contain '@' (zfs_exporter applies --exclude to filesystems and
      volumes too). Excludes missing '@':
      {{ pve_node_exporter_zfs_exporter_snapshot_excludes | reject('contains', '@') | list | join(', ') }}
    quiet: true
  tags:
    - pve_node_exporter
