---
# Prometheus node_exporter for Proxmox VE hosts: a pinned upstream release
# installed as a native systemd service, exposing host metrics on :9100 for
# the central Prometheus/Cribl scrape.

# Pinned upstream release. Renovate-friendly single source for the version;
# bump deliberately (the checksum below must move with it when set).
# renovate: datasource=github-releases depName=prometheus/node_exporter
pve_node_exporter_version: "1.12.1"

# Where the release tarball comes from. Standard GitHub releases URL; override
# to point at a local mirror (e.g. the apt-cacher / artifact LXC) if nodes
# must not reach the internet at converge time.
pve_node_exporter_download_url: >-
  https://github.com/prometheus/node_exporter/releases/download/v{{ pve_node_exporter_version }}/node_exporter-{{ pve_node_exporter_version }}.linux-{{ pve_node_exporter_arch }}.tar.gz

# Integrity pin for the tarball ("sha256:<hex>"), per-arch from the release's
# sha256sums.txt. Refresh both hashes when bumping the version; an empty
# string skips the check (get_url still only downloads when the versioned
# dest is absent).
pve_node_exporter_checksum: >-
  sha256:{{ {
    'amd64': 'b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63',
    'arm64': 'ad35b605f9954b9f1ffddf5ba054bdc5a98d790b9eae5291e1eeb83f1ecbd0e7',
  }[pve_node_exporter_arch] }}

# GOARCH name derived from the host fact; covers the amd64/arm64 fleet.
pve_node_exporter_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, 'amd64') }}"

# Bind to the node's management IP (the default-route interface fact — derived
# at runtime, never hardcoded) so metrics are only reachable on the management
# VLAN. Set to 0.0.0.0 to listen on every interface.
pve_node_exporter_listen_address: "{{ (ansible_default_ipv4 | default({})).address | default('0.0.0.0') }}"

# Standard node_exporter port.
pve_node_exporter_port: 9100

# Dedicated no-login system user the service runs as.
pve_node_exporter_user: node-exporter

# Versioned install root; the active binary is /usr/local/bin/node_exporter.
pve_node_exporter_install_dir: /opt/node_exporter

# Optional textfile collector: drop *.prom files into this directory (cron
# jobs, ZFS scripts, ...) and node_exporter exposes them as metrics.
pve_node_exporter_textfile_collector_enabled: true
pve_node_exporter_textfile_collector_dir: /var/lib/node_exporter/textfile_collector

# Control installation and activation of Debian's packaged hardware collectors.
pve_node_exporter_packaged_collectors_enabled: true
# Set the directory where the packaged collectors write metric files.
pve_node_exporter_packaged_collectors_dir: /var/lib/prometheus/node-exporter
# Set the packages installed for the packaged hardware collectors.
pve_node_exporter_packaged_collectors_packages:
  - prometheus-node-exporter-collectors
  - smartmontools
  - nvme-cli
  - ipmitool
# Set the packaged hardware collector timers enabled by this role.
pve_node_exporter_packaged_collectors_timers:
  - prometheus-node-exporter-smartmon.timer
  - prometheus-node-exporter-nvme.timer
  - prometheus-node-exporter-ipmitool-sensor.timer

# Extra CLI flags appended verbatim to the service ExecStart (e.g.
# ["--no-collector.wifi"]).
pve_node_exporter_extra_args: []

# Per-dataset ZFS space accounting from pdf/zfs_exporter, installed beside
# node_exporter as its own pinned systemd service on its own port. It runs as
# pve_node_exporter_user and binds pve_node_exporter_listen_address.
pve_node_exporter_zfs_exporter_enabled: true

# Pinned upstream release; the checksums below must move with it.
# renovate: datasource=github-releases depName=pdf/zfs_exporter
pve_node_exporter_zfs_exporter_version: "2.5.1"

pve_node_exporter_zfs_exporter_download_url: >-
  https://github.com/pdf/zfs_exporter/releases/download/v{{ pve_node_exporter_zfs_exporter_version }}/zfs_exporter-{{ pve_node_exporter_zfs_exporter_version }}.linux-{{ pve_node_exporter_arch }}.tar.gz

# Integrity pin for the tarball ("sha256:<hex>"), per-arch, equal to the
# SHA256 digests GitHub publishes for the release assets. Always enforced:
# refresh both hashes when bumping the version.
pve_node_exporter_zfs_exporter_checksum: >-
  sha256:{{ {
    'amd64': '2caed451cfb0abbd0494b1200aa3bcc134921f12a2a21efe001a4ac9d79d0e32',
    'arm64': '031d8dfd9aab29ac38c29e13b017f01203c0fc48a7f2e8465dd0b5c5bced995e',
  }[pve_node_exporter_arch] }}

# Standard zfs_exporter port.
pve_node_exporter_zfs_exporter_port: 9134

# Versioned install root; the active binary is /usr/local/bin/zfs_exporter.
pve_node_exporter_zfs_exporter_install_dir: /opt/zfs_exporter

# ZFS properties exported per filesystem and per volume: one series per
# dataset and property. The pool and snapshot collectors stay off, so no
# pool or per-snapshot series are exported. ZFS defines quota and refquota
# for filesystems only, so volumes report 0 for both.
pve_node_exporter_zfs_exporter_filesystem_properties:
  - available
  - quota
  - referenced
  - refquota
  - used
  - usedbysnapshots
pve_node_exporter_zfs_exporter_volume_properties:
  - available
  - quota
  - referenced
  - refquota
  - used
  - usedbysnapshots

# Extra CLI flags appended verbatim to the zfs_exporter ExecStart (e.g.
# ["--exclude=^rpool/data/"]).
pve_node_exporter_zfs_exporter_extra_args: []
