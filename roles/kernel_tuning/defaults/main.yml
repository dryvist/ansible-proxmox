---
# Kernel Tuning role defaults

# Swap behavior - lower = prefer RAM (10-30 for SSD/NVMe)
kernel_tuning_swappiness: 10

# VFS cache pressure - lower = keep directory/inode caches longer
kernel_tuning_vfs_cache_pressure: 50

# Dirty page writeback - optimized for NVMe
kernel_tuning_dirty_ratio: 10
kernel_tuning_dirty_background_ratio: 5

# Memory overcommit - heuristic (default, safe for homelab)
kernel_tuning_overcommit_memory: 0

# Sysctl config file path
kernel_tuning_sysctl_file: /etc/sysctl.d/10-proxmox-tuning.conf

# ------------------------------------------------------------------------------
# Proxmox Boot Parameters (written to /etc/kernel/cmdline)
# ------------------------------------------------------------------------------

# Enable boot parameter management
kernel_tuning_boot_params_enabled: false

# Clocksource selection. Empty means "let the kernel choose", which is what you
# almost always want: the kernel prefers TSC where it is usable and demotes it
# automatically via the clocksource watchdog if it ever drifts, logging the
# reason. Forcing a clocksource replaces that judgement with a permanent guess.
#
# Do not set these to hpet/unstable as a blanket stability measure. HPET is read
# over MMIO from a single shared counter, so it cannot be served from the vDSO
# and concurrent reads across cores serialize. Measured on two hosts of the same
# class and memory size in this estate: 2816 ns per clock_gettime on the host
# forced to HPET versus 37 ns on the host left on TSC — 76x. A hypervisor reads
# the clock on every scheduler tick, I/O completion and packet timestamp, so at
# that multiple the clocksource becomes a system-wide serialization point.
#
# The Zen1 TSC concern this once guarded against is triggered by C6 entry, which
# is already addressed directly by kernel_tuning_disable_zen_c6 and
# kernel_tuning_disable_deep_cstates. Prefer fixing the trigger over forcing a
# slow clock on top of it.
kernel_tuning_clocksource: ""
kernel_tuning_tsc_mode: ""

# Disable SMT (Simultaneous Multithreading) for improved stability on some Zen1 systems
# Set to true to add 'nosmt' parameter (workaround for rare arithmetic/lockup issues)
kernel_tuning_disable_smt: false

# Disable deep C-states for improved stability on some AMD systems
# Set to true to add 'processor.max_cstate=1' parameter
# This prevents the CPU from entering deep sleep states (C2+) which can cause freeze issues
kernel_tuning_disable_deep_cstates: false

# Watchdog and panic parameters (crash diagnostics)
kernel_tuning_nmi_watchdog: 1
kernel_tuning_softlockup_panic: 1
kernel_tuning_hung_task_panic: 1

# MCE (Machine Check Exception) reporting level (1-3, higher = more verbose)
kernel_tuning_mce_level: 3

# EDAC error reporting
kernel_tuning_edac_report: 1

# Zen1 C6 hard-lock erratum mitigation: clear the core+package C6 enable bits
# in the AMD power-management MSRs at boot (msr-tools + a oneshot unit).
# processor.max_cstate=1 alone does NOT prevent C6 entry on first-gen Zen —
# this is the software equivalent of the BIOS "Global C-State Control=Disabled"
# / "Power Supply Idle Control=Typical Current Idle" mitigations. Opt-in per
# host (first-gen Zen parts only).
kernel_tuning_disable_zen_c6: false
