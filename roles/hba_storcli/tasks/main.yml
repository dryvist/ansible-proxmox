---
# Temporary PR used to measure changed-role Molecule selection.
# hba_storcli tasks — install perccli64 (once staged, see defaults) and assert
# every physical drive is Non-RAID/JBOD passthrough. Skipped in Docker and on
# any node with no MegaRAID/PERC-family RAID controller on its PCI bus.

- name: Detect a MegaRAID/PERC-family RAID controller on the PCI bus
  ansible.builtin.command:
    cmd: "lspci -n -d 1000::0104"
  register: hba_storcli_pci_scan
  changed_when: false
  when:
    - hba_storcli_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - hba_storcli

- name: Record whether a MegaRAID/PERC-family controller is present
  ansible.builtin.set_fact:
    hba_storcli_controller_present: "{{ (hba_storcli_pci_scan.stdout | default('', true) | trim | length) > 0 }}"
  when:
    - hba_storcli_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - hba_storcli

- name: Manage perccli64 and verify passthrough on nodes with a controller
  when:
    - hba_storcli_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
    - hba_storcli_controller_present | default(false)
  tags:
    - hba_storcli
  block:
    - name: Check whether a perccli64 binary is already present
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ hba_storcli_binary_search_paths }}"
      register: hba_storcli_existing_binary

    - name: Set the resolved perccli64 path
      ansible.builtin.set_fact:
        hba_storcli_resolved_path: >-
          {{
            (hba_storcli_existing_binary.results | default([], true)
              | selectattr('stat.exists', 'defined')
              | selectattr('stat.exists')
              | map(attribute='item') | list | first) | default('', true)
          }}

    - name: Install perccli64 from the staged package override
      ansible.builtin.apt:
        deb: "{{ hba_storcli_package_path }}"
        state: present
      when:
        - hba_storcli_resolved_path | default('', true) | length == 0
        - hba_storcli_package_path | default('', true) | length > 0

    - name: Download and install perccli64 from the pinned vendor archive
      when:
        - hba_storcli_resolved_path | default('', true) | length == 0
        - hba_storcli_package_path | default('', true) | length == 0
      block:
        - name: Create a temp directory for the perccli archive
          ansible.builtin.tempfile:
            state: directory
            suffix: hba_storcli
          register: hba_storcli_tempdir

        - name: Download the pinned perccli archive
          ansible.builtin.get_url:
            url: "{{ hba_storcli_archive_url }}"
            dest: "{{ hba_storcli_tempdir.path }}/perccli.tar.gz"
            checksum: "{{ hba_storcli_archive_checksum }}"
            headers:
              User-Agent: "{{ hba_storcli_download_user_agent }}"
            mode: "0644"

        - name: Unpack the perccli archive
          ansible.builtin.unarchive:
            src: "{{ hba_storcli_tempdir.path }}/perccli.tar.gz"
            dest: "{{ hba_storcli_tempdir.path }}"
            remote_src: true

        - name: Install the perccli64 .deb from the unpacked archive
          ansible.builtin.apt:
            deb: "{{ hba_storcli_tempdir.path }}/{{ hba_storcli_archive_deb_member }}"
            state: present

      rescue:
        - name: Fail loudly if the pinned archive could not be downloaded or installed
          ansible.builtin.fail:
            msg: >-
              Failed to download or install perccli64 from
              {{ hba_storcli_archive_url }}: {{ ansible_failed_result.msg
              | default(ansible_failed_result, true) }}. If this host cannot
              reach Dell's download server, stage a .deb locally and set
              hba_storcli_package_path to its reachable path instead.

      always:
        - name: Remove the temp directory
          ansible.builtin.file:
            path: "{{ hba_storcli_tempdir.path }}"
            state: absent
          when: hba_storcli_tempdir.path is defined

    - name: Re-resolve the perccli64 path after install
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ hba_storcli_binary_search_paths }}"
      register: hba_storcli_post_install_binary
      when:
        - hba_storcli_resolved_path | default('', true) | length == 0

    - name: Finalize the resolved perccli64 path
      ansible.builtin.set_fact:
        hba_storcli_resolved_path: >-
          {{
            hba_storcli_resolved_path
            if (hba_storcli_resolved_path | default('', true) | length > 0)
            else ((hba_storcli_post_install_binary.results | default([], true)
              | selectattr('stat.exists', 'defined')
              | selectattr('stat.exists')
              | map(attribute='item') | list | first) | default('', true))
          }}

    - name: Query all physical drives on the target controller
      ansible.builtin.command:
        cmd: >-
          {{ hba_storcli_resolved_path }} /c{{ hba_storcli_controller_index }}
          /eall/sall show J
      register: hba_storcli_drive_query
      changed_when: false
      when:
        - hba_storcli_resolved_path | default('', true) | length > 0

    - name: Fail the converge if any drive is not true passthrough
      ansible.builtin.assert:
        that:
          - hba_storcli_bad_drives | default([], true) | length == 0
        fail_msg: >-
          One or more drives behind controller /c{{ hba_storcli_controller_index }}
          are NOT Non-RAID/JBOD passthrough (states outside
          {{ hba_storcli_acceptable_states }}):
          {{ hba_storcli_bad_drives | default([], true) }}.
          A RAID0-wrapped disk hides SMART/TLER and defeats ZFS error handling —
          this must be corrected in the controller BIOS/CLI before the array is
          trusted as the reference standard.
        success_msg: >-
          All {{ hba_storcli_drives | default([], true) | length }} drive(s) on
          /c{{ hba_storcli_controller_index }} verified Non-RAID/JBOD passthrough.
      when:
        - hba_storcli_resolved_path | default('', true) | length > 0
        - hba_storcli_drive_query.stdout | default('', true) | length > 0
