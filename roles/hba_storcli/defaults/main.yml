---
# hba_storcli — install Broadcom/Dell perccli (storcli-family CLI) and assert
# every physical drive behind a MegaRAID-family controller (e.g. Dell PERC
# H730P) is Non-RAID/JBOD passthrough, not a single-disk RAID0 virtual disk.
# Fails the converge on mismatch: a RAID0-wrapped disk hides SMART/TLER and
# defeats ZFS's own error handling, so this must be verified, not inferred
# from indirect smartctl behavior.
#
# Pinned vendor download: Dell's PERCCLI driver page (driver id tdghn) behind
# dl.dell.com. Checksum is the SHA-256 Dell itself publishes for this file;
# get_url enforces it, so a tampered or mismatched download fails the
# converge rather than installing silently. Dell rejects curl's default
# User-Agent, so the download task sends a non-curl one. Bump deliberately —
# re-verify the checksum on Dell's driver page before moving the version.
hba_storcli_archive_version: "7.2313.0_A14"
hba_storcli_archive_url: "https://dl.dell.com/FOLDER09770976M/1/PERCCLI_{{ hba_storcli_archive_version }}_Linux.tar.gz"
hba_storcli_archive_checksum: "sha256:db518857870e62ac3690ffdafcb16f55d8f69537c21eaa717c1daff4232e0a75"
hba_storcli_archive_deb_member: "PERCCLI_{{ hba_storcli_archive_version }}_Linux/perccli_007.2313.0000.0000_all.deb"
hba_storcli_download_user_agent: "ansible-proxmox/hba_storcli"

hba_storcli_enabled: true

# Controller index to query (perccli64 /cN). MegaRAID-family cards are almost
# always /c0; override per-host if a node has more than one.
hba_storcli_controller_index: 0

# Drive states perccli64 reports that are acceptable. "JBOD" and "UGood"
# (Unconfigured Good) both indicate true passthrough; a drive under a RAID0
# virtual disk instead shows state "Onln" attached to a "DG" (drive group).
hba_storcli_acceptable_states:
  - JBOD
  - UGood

# Optional override for air-gapped hosts: a locally-reachable .deb path to
# install from instead of downloading the pinned archive above.
hba_storcli_package_path: ""
hba_storcli_binary_name: perccli64
hba_storcli_binary_search_paths:
  - /opt/MegaRAID/perccli/perccli64
  - /usr/sbin/perccli64
  - /usr/local/sbin/perccli64

# Parsed view of the controller's drive list. Lazily evaluated, so it costs
# nothing until referenced and can be exercised in molecule by setting
# hba_storcli_drive_query to a fixture -- the test then covers the REAL
# expression rather than a copy of it that can drift.
#
# Deliberately plain Jinja rather than json_query: the perccli keys contain
# spaces so they need quoting, and escaped inner quotes do not survive Jinja's
# string literal -- the backslashes reach JMESPath verbatim and it rejects the
# whole expression. A guard whose only job is to fail loudly must not be built
# on a construct that errors before it can evaluate.
hba_storcli_drives: >-
  {{ (((((hba_storcli_drive_query | default({}, true)).stdout
         | default('{}', true) | from_json).Controllers
        | default([], true))[0] | default({}, true))['Response Data']
      | default({}, true))['Drive Information'] | default([], true) }}

# Any drive whose state is outside the accepted passthrough states. Empty list
# means every drive is true passthrough.
hba_storcli_bad_drives: >-
  {{ hba_storcli_drives | default([], true)
     | rejectattr('State', 'in', hba_storcli_acceptable_states) | list }}
