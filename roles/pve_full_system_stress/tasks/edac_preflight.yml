---
- name: Read aggregate EDAC uncorrected-error counters
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      total=0 found=0
      for file in {{ pve_full_system_stress_ue_count_files }}; do
        [[ -r "$file" ]] || continue
        value=$(cat "$file")
        [[ "$value" =~ ^[0-9]+$ ]]
        total=$((total + value))
        found=1
      done
      if ((found == 0)); then
        logger -t pve-full-system-stress -p daemon.err -- \
          "pve_full_system_stress run={{ pve_full_system_stress_run_id }}" \
          "stage={{ pve_full_system_stress_stage }} event=abort reason=edac_counters_unavailable"
        exit 1
      fi
      printf '%s\n' "$total"
  register: pve_full_system_stress_ue_baseline
  changed_when: false
  when: pve_full_system_stress_memory_ecc | bool

- name: Log the EDAC guard decision
  ansible.builtin.command:
    argv:
      - logger
      - -t
      - pve-full-system-stress
      - -p
      - daemon.info
      - --
      - >-
        pve_full_system_stress run={{ pve_full_system_stress_run_id }}
        stage={{ pve_full_system_stress_stage }} event=edac_guard
        memory_ecc=true
        ue_count={{ pve_full_system_stress_ue_baseline.stdout | default('unavailable') | trim }}
  changed_when: false
  when: pve_full_system_stress_memory_ecc | bool

- name: Refuse the stage when EDAC already reports an uncorrected error
  ansible.builtin.assert:
    that:
      - pve_full_system_stress_ue_baseline.stdout | int == 0
    fail_msg: EDAC reports an uncorrected memory error; no stress stage may start.
    quiet: true
  when: pve_full_system_stress_memory_ecc | bool

- name: Log that EDAC counters do not apply without ECC
  ansible.builtin.command:
    argv:
      - logger
      - -t
      - pve-full-system-stress
      - -p
      - daemon.info
      - --
      - >-
        pve_full_system_stress run={{ pve_full_system_stress_run_id }}
        stage={{ pve_full_system_stress_stage }} event=edac_guard
        memory_ecc=false decision=not_applicable
  changed_when: false
  when: not (pve_full_system_stress_memory_ecc | bool)
