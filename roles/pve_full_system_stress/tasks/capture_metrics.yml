---
- name: Record DIMM inventory without serial numbers
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      dmidecode -t memory | awk '
        /Memory Device$/ { device++ }
        /^[[:space:]]*(Locator|Bank Locator|Size|Type|Speed|Configured Memory Speed|Manufacturer|Part Number|Rank):/ {
          gsub(/^[[:space:]]+/, "")
          gsub(/[[:space:]]+/, "_")
          print "dimm=" device " " $0
        }
      ' | while IFS= read -r line; do
        logger -t pve-full-system-stress -p daemon.info -- \
          "pve_full_system_stress run={{ pve_full_system_stress_run_id }} stage={{ pve_full_system_stress_stage }}" \
          "event=dimm phase={{ pve_full_system_stress_phase }} ${line}"
      done
  changed_when: false
  when: pve_full_system_stress_stage in ['memory', 'combined']

- name: Record EDAC corrected and uncorrected counters
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      find /sys/devices/system/edac/mc -type f \( -name ce_count -o -name ue_count \) -print0 |
        while IFS= read -r -d '' file; do
          value=$(cat "$file")
          controller=$(basename "$(dirname "$file")")
          logger -t pve-full-system-stress -p daemon.info -- \
            "pve_full_system_stress run={{ pve_full_system_stress_run_id }} stage={{ pve_full_system_stress_stage }}" \
            "event=edac phase={{ pve_full_system_stress_phase }}" \
            "mc=${controller} counter=$(basename "$file") value=${value}"
        done
  changed_when: false
  when: pve_full_system_stress_stage in ['memory', 'combined']

- name: Record campaign kernel hardware errors
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      pattern='mce:|machine check|hardware error|uncorrected|EDAC.*(UE|uncorrected)|NVRM.*Xid|Xid [0-9]+'
      events=$(journalctl -k --since "{{ pve_full_system_stress_campaign_started_at }}" \
        --no-pager -o cat | grep -Ei "$pattern" || true)
      if [[ -z "$events" ]]; then
        logger -t pve-full-system-stress -p daemon.info -- \
          "pve_full_system_stress run={{ pve_full_system_stress_run_id }} stage={{ pve_full_system_stress_stage }}" \
          "event=kernel_errors phase={{ pve_full_system_stress_phase }} count=0"
      else
        while IFS= read -r line; do
          logger -t pve-full-system-stress -p daemon.err -- \
            "pve_full_system_stress run={{ pve_full_system_stress_run_id }} stage={{ pve_full_system_stress_stage }}" \
            "event=kernel_error phase={{ pve_full_system_stress_phase }} detail=${line}"
        done <<< "$events"
      fi
  changed_when: false
  when: pve_full_system_stress_stage in ['memory', 'gpu', 'combined']

- name: Record k10temp, CPU frequency, and hardware throttle counters
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      max=0 count=0
      shopt -s nullglob
      for sensor in /sys/class/hwmon/hwmon*; do
        [[ -r "$sensor/name" && $(cat "$sensor/name") == k10temp ]] || continue
        for input in "$sensor"/temp*_input; do
          [[ -r "$input" ]] || continue
          value=$(cat "$input")
          ((value > max)) && max=$value
          count=$((count + 1))
        done
      done
      ((count > 0))
      alarm=0
      for sensor in /sys/class/hwmon/hwmon*; do
        [[ -r "$sensor/name" && $(cat "$sensor/name") == k10temp ]] || continue
        for input in "$sensor"/temp*_crit_alarm; do
          [[ -r "$input" && $(cat "$input") == 1 ]] && alarm=1
        done
      done
      throttle=0 throttle_found=0
      for file in /sys/devices/system/cpu/cpu*/thermal_throttle/*_throttle_count; do
        [[ -r "$file" ]] || continue
        throttle=$((throttle + $(cat "$file")))
        throttle_found=1
      done
      [[ "$throttle_found" == 1 ]] || throttle=unavailable
      min_freq=0
      for file in /sys/devices/system/cpu/cpu[0-9]*/cpufreq/scaling_cur_freq; do
        [[ -r "$file" ]] || continue
        value=$(cat "$file")
        if ((min_freq == 0 || value < min_freq)); then min_freq=$value; fi
      done
      ((min_freq > 0)) || min_freq=unavailable
      logger -t pve-full-system-stress -p daemon.info -- \
        "pve_full_system_stress run={{ pve_full_system_stress_run_id }} stage={{ pve_full_system_stress_stage }}" \
        "event=cpu phase={{ pve_full_system_stress_phase }} k10temp_max_mC=${max}" \
        "cpu_throttle_count=${throttle} cpu_min_freq_khz=${min_freq} cpu_crit_alarm=${alarm}"
      ((alarm == 0))
  changed_when: false
  when: pve_full_system_stress_stage in ['cpu', 'combined']

- name: Record NVIDIA temperature, power, clocks, and throttle reasons
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      output=$(nvidia-smi --query-gpu=temperature.gpu,power.draw,clocks.gr,clocks.mem,clocks_throttle_reasons.active --format=csv,noheader,nounits)
      output=${output// /}
      logger -t pve-full-system-stress -p daemon.info -- \
        "pve_full_system_stress run={{ pve_full_system_stress_run_id }} stage={{ pve_full_system_stress_stage }}" \
        "event=gpu phase={{ pve_full_system_stress_phase }} gpu_csv=${output}"
  changed_when: false
  when: pve_full_system_stress_stage in ['gpu', 'combined']

- name: Record rpool NVMe temperature after storage and combined stages
  ansible.builtin.include_tasks:
    file: nvme_health.yml
    apply:
      tags:
        - never
        - pve_full_system_stress
  tags:
    - never
    - pve_full_system_stress
  vars:
    pve_full_system_stress_nvme_phase: "{{ pve_full_system_stress_phase }}"
  when:
    - pve_full_system_stress_phase == 'after'
    - pve_full_system_stress_stage in ['storage', 'combined']
