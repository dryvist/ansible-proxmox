---
- name: Require enough time for a clean stage shutdown
  ansible.builtin.assert:
    that:
      - pve_full_system_stress_duration_seconds | int > pve_full_system_stress_workload_margin_seconds | int
    fail_msg: A stress stage must exceed the workload shutdown margin.
    quiet: true

- name: Read the current schedule time
  ansible.builtin.command:
    argv: [date, -u, +%s]
  register: pve_full_system_stress_schedule_now
  changed_when: false

- name: Calculate a start time that cannot overlap the prior stage
  ansible.builtin.set_fact:
    pve_full_system_stress_stage_unit: >-
      pve-full-system-stress-{{ pve_full_system_stress_run_id }}-{{ pve_full_system_stress_stage }}
    pve_full_system_stress_stage_target_epoch: >-
      {{ pve_full_system_stress_schedule_base.stdout | int + pve_full_system_stress_schedule_offset | int }}
    pve_full_system_stress_stage_delay_seconds: >-
      {{ [1, (pve_full_system_stress_schedule_base.stdout | int
              + pve_full_system_stress_schedule_offset | int
              - pve_full_system_stress_schedule_now.stdout | int)] | max }}
    pve_full_system_stress_stage_index: >-
      {{ pve_full_system_stress_stage_order.index(pve_full_system_stress_stage) }}

- name: Resolve the previous stage and its remaining timers
  ansible.builtin.set_fact:
    pve_full_system_stress_previous_stage: >-
      {{ pve_full_system_stress_stage_order[pve_full_system_stress_stage_index | int - 1]
         if pve_full_system_stress_stage_index | int > 0 else '' }}
    pve_full_system_stress_future_stages: >-
      {{ pve_full_system_stress_stage_order[pve_full_system_stress_stage_index | int + 1 :] }}
    pve_full_system_stress_stage_argv: >-
      {{ ['systemd-run',
          '--unit=' ~ pve_full_system_stress_stage_unit,
          '--on-active=' ~ (pve_full_system_stress_stage_delay_seconds | int) ~ 's',
          '--timer-property=AccuracySec=1s',
          '--property=RuntimeMaxSec=' ~ (pve_full_system_stress_duration_seconds | int) ~ 's',
          '--property=TimeoutStopSec=15s',
          '--property=KillMode=control-group',
          '--property=StandardOutput=journal',
          '--property=StandardError=journal',
          '--property=SyslogIdentifier=pve-full-system-stress',
          '--service-type=exec', '--no-block', '--', '/bin/bash', '-c'] }}

- name: Append the detached stage watchdog and workload arguments
  ansible.builtin.set_fact:
    pve_full_system_stress_stage_argv: >-
      {{ pve_full_system_stress_stage_argv
         + [pve_full_system_stress_stage_watchdog_script,
            'pve-full-system-stress-stage',
            pve_full_system_stress_run_id,
            pve_full_system_stress_stage,
            pve_full_system_stress_duration_seconds | string,
            pve_full_system_stress_sample_seconds | string,
            pve_full_system_stress_cpu_temp_limit_c | string,
            pve_full_system_stress_watch_gpu | ternary('true', 'false'),
            pve_full_system_stress_campaign_started_at,
            pve_full_system_stress_gpu_vmids | join(','),
            pve_full_system_stress_llm_unit_pattern,
            pve_full_system_stress_previous_stage,
            pve_full_system_stress_future_stages | join(','),
            pve_full_system_stress_rpool,
            pve_full_system_stress_scratch_file | default(''),
            pve_full_system_stress_active_path,
            '--component']
         + [pve_full_system_stress_components[0].cwd | default('')]
         + pve_full_system_stress_components[0].argv }}
  vars:
    pve_full_system_stress_stage_watchdog_script: |
      set -Eeuo pipefail
      run_id=$1 stage=$2 duration=$3 sample_seconds=$4 cpu_limit_c=$5
      watch_gpu=$6 campaign_started_at=$7 gpu_vmids_csv=$8 llm_pattern=$9
      previous_stage=${10} future_stages_csv=${11} rpool=${12} scratch_file=${13}
      lock_path=${14}
      shift 14
      log() {
        logger -t pve-full-system-stress -p "$1" -- \
          "pve_full_system_stress run=${run_id} stage=${stage} ${*:2}"
      }
      declare -a child_pids=()
      abort_reason=''
      stage_succeeded=false
      cancel_future() {
        local future unit
        IFS=',' read -r -a future_array <<< "${future_stages_csv}"
        for future in "${future_array[@]}"; do
          [[ -n "$future" ]] || continue
          unit="pve-full-system-stress-${run_id}-${future}"
          log daemon.err "event=guard_decision guard=future_stage unit=${unit} decision=stop"
          systemctl stop "${unit}.timer" "${unit}.service" >/dev/null 2>&1 || true
        done
      }
        stop_children() {
          local pid state live
          for pid in "${child_pids[@]}"; do kill -TERM "$pid" >/dev/null 2>&1 || true; done
          for _ in 1 2 3 4 5; do
            live=0
            for pid in "${child_pids[@]}"; do
              state=$(ps -o stat= -p "$pid" 2>/dev/null | tr -d '[:space:]' || true)
              [[ -z "$state" || "$state" == Z* ]] || live=1
            done
            if ((live == 0)); then break; fi
            sleep 1
          done
          for pid in "${child_pids[@]}"; do
            state=$(ps -o stat= -p "$pid" 2>/dev/null | tr -d '[:space:]' || true)
            if [[ -n "$state" && "$state" != Z* ]]; then kill -KILL "$pid" >/dev/null 2>&1 || true; fi
            wait "$pid" >/dev/null 2>&1 || true
          done
          child_pids=()
        }
      release_lock() {
        if [[ -r "${lock_path}/run-id" ]] && [[ $(cat "${lock_path}/run-id") == "${run_id}" ]]; then
          rm -f "${lock_path}/run-id"
          rmdir "${lock_path}" 2>/dev/null || true
        fi
      }
      on_exit() {
        local rc=$?
        trap - EXIT TERM INT
        if [[ "$rc" == 0 && "$stage_succeeded" == true ]]; then
          log daemon.info "event=stage_end outcome=success end_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$stage" == combined ]]; then
            log daemon.info "event=campaign_end outcome=success end_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            release_lock
          fi
        else
          [[ -n "$abort_reason" ]] || abort_reason=stage_failed
          log daemon.err "event=abort reason=${abort_reason}"
          cancel_future
          stop_children
          log daemon.err "event=stage_end outcome=abort reason=${abort_reason} end_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          log daemon.err "event=campaign_end outcome=abort reason=${abort_reason} end_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          release_lock
        fi
      }
      on_signal() { abort_reason=runtime_limit_or_signal; exit 143; }
      trap on_exit EXIT
      trap on_signal TERM INT
      abort() { abort_reason=$1; exit 1; }
      stage_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      log daemon.info "event=stage_start start_utc=${stage_started_at} duration_seconds=${duration}"
      if [[ "$stage" == memory ]]; then
        log daemon.info "event=campaign_start start_utc=${campaign_started_at}"
      fi
      if [[ -n "$previous_stage" ]]; then
        if journalctl -t pve-full-system-stress --no-pager -o cat \
          | grep -F "run=${run_id} stage=${previous_stage} event=stage_end" \
          | grep -Fq 'outcome=success'; then
          log daemon.info "event=guard_decision guard=previous_stage decision=clear"
        else
          log daemon.err "event=guard_decision guard=previous_stage decision=abort"
          abort previous_stage_incomplete
        fi
      fi
      if [[ "$stage" == memory ]]; then
        dimm_layout=$(dmidecode -t memory | awk '
          /Memory Device$/ { device++ }
          /^[[:space:]]*(Locator|Bank Locator|Size|Type|Speed|Configured Memory Speed|Manufacturer|Part Number|Rank):/ {
            gsub(/^[[:space:]]+/, "")
            gsub(/[[:space:]]+/, "_")
            print "dimm=" device " " $0
          }
        ')
        [[ -n "$dimm_layout" ]] || abort dimm_layout_unavailable
        while IFS= read -r line; do log daemon.info "event=dimm ${line}"; done <<< "$dimm_layout"
      fi
      edac_counts() {
        local file value ce=0 ue=0 found_ue=0
        shopt -s nullglob
        for file in /sys/devices/system/edac/mc/*/ce_count; do
          [[ -r "$file" ]] || continue
          value=$(cat "$file") || return 2
          [[ "$value" =~ ^[0-9]+$ ]] || return 2
          ce=$((ce + value))
        done
        for file in /sys/devices/system/edac/mc/*/ue_count; do
          [[ -r "$file" ]] || continue
          value=$(cat "$file") || return 2
          [[ "$value" =~ ^[0-9]+$ ]] || return 2
          ue=$((ue + value))
          found_ue=1
        done
        ((found_ue == 1)) || return 2
        printf '%s %s\n' "$ce" "$ue"
      }
      kernel_counts() {
        local events
        events=$(journalctl -k --since "$campaign_started_at" --no-pager -o cat) || return 2
        mce_count=$(grep -Eic 'mce:|machine check|hardware error|uncorrected|EDAC.*(UE|uncorrected)' <<< "$events" || true)
        xid_count=$(grep -Eic 'NVRM.*Xid|Xid [0-9]+' <<< "$events" || true)
      }
      serving_guard() {
        local running vmid active
        local -a declared_vmids
        IFS=',' read -r -a declared_vmids <<< "$gpu_vmids_csv"
        running=$(pct list | awk '$2 == "running" {print $1}') || return 2
        for vmid in "${declared_vmids[@]}"; do
          [[ -n "$vmid" ]] || continue
          grep -Fxq "$vmid" <<< "$running" || continue
          active=$(pct exec "$vmid" -- systemctl list-units --type=service --state=active --no-legend --no-pager) || return 2
          if grep -Eiq "$llm_pattern" <<< "$active"; then return 1; fi
        done
      }
      sample_cpu() {
        local sensor name input value count=0 max=0 alarm=0 throttle=0 throttle_found=0 min_freq=0
        shopt -s nullglob
        for sensor in /sys/class/hwmon/hwmon*; do
          [[ -r "$sensor/name" ]] || continue
          name=$(cat "$sensor/name")
          [[ "$name" == k10temp ]] || continue
          for input in "$sensor"/temp*_input; do
            [[ -r "$input" ]] || continue
            value=$(cat "$input") || return 2
            [[ "$value" =~ ^[0-9]+$ ]] || return 2
            ((value > max)) && max=$value
            count=$((count + 1))
          done
          for input in "$sensor"/temp*_crit_alarm; do
            [[ ! -r "$input" || $(cat "$input") != 1 ]] || alarm=1
          done
        done
        ((count > 0)) || return 2
        for input in /sys/devices/system/cpu/cpu*/thermal_throttle/*_throttle_count; do
          [[ -r "$input" ]] || continue
          value=$(cat "$input") || return 2
          throttle=$((throttle + value))
          throttle_found=1
        done
        [[ "$throttle_found" == 1 ]] || throttle=unavailable
        for input in /sys/devices/system/cpu/cpu[0-9]*/cpufreq/scaling_cur_freq; do
          [[ -r "$input" ]] || continue
          value=$(cat "$input") || return 2
          if ((min_freq == 0 || value < min_freq)); then min_freq=$value; fi
        done
        ((min_freq > 0)) || min_freq=unavailable
        logger -t pve-full-system-stress -p daemon.info -- \
          "pve_full_system_stress run=${run_id} stage=${stage}" \
          "event=sample cpu_temp_mC=${max} cpu_temp_limit_mC=$((cpu_limit_c * 1000))" \
          "cpu_throttle_count=${throttle} cpu_min_freq_khz=${min_freq}"
        ((max < cpu_limit_c * 1000 && alarm == 0)) || return 1
      }
      sample_gpu() {
        local data limit_text gpu_temp power sm_clock mem_clock throttle limit
        data=$(nvidia-smi --query-gpu=temperature.gpu,power.draw,clocks.gr,clocks.mem,clocks_throttle_reasons.active --format=csv,noheader,nounits) || return 2
        [[ "$data" != *$'\n'* ]] || return 2
        IFS=',' read -r gpu_temp power sm_clock mem_clock throttle <<< "$data"
        gpu_temp=${gpu_temp//[[:space:]]/}
        power=${power//[[:space:]]/}
          sm_clock=${sm_clock//[[:space:]]/}
          mem_clock=${mem_clock//[[:space:]]/}
          throttle=${throttle//[[:space:]]/}
          [[ "$gpu_temp" =~ ^[0-9]+$ && "$power" =~ ^[0-9]+([.][0-9]+)?$ \
            && "$sm_clock" =~ ^[0-9]+$ && "$mem_clock" =~ ^[0-9]+$ ]] || return 2
        limit_text=$(nvidia-smi -q -d TEMPERATURE) || return 2
        limit=$(awk -F: 'tolower($1) ~ /gpu max operating temp/ {gsub(/[[:space:]cC]/, "", $2); print $2; exit}' <<< "$limit_text")
        [[ "$limit" =~ ^[0-9]+$ ]] || return 2
        logger -t pve-full-system-stress -p daemon.info -- \
          "pve_full_system_stress run=${run_id} stage=${stage}" \
          "event=sample gpu_temp_c=${gpu_temp} gpu_temp_limit_c=${limit}" \
          "gpu_power_w=${power} gpu_sm_clock_mhz=${sm_clock}" \
          "gpu_mem_clock_mhz=${mem_clock} gpu_throttle_active=${throttle}"
        ((gpu_temp < limit)) || return 1
      }
      sample_nvme() {
        local leaves leaf parent device smart warning temperature warning_hex index=0
        leaves=$(zpool status -P "$rpool" | awk '$1 ~ /^\/dev\// {print $1}') || return 2
        [[ -n "$leaves" ]] || return 2
        while IFS= read -r leaf; do
          parent=$(lsblk -nro PKNAME -- "$leaf" | head -1) || return 2
          device=$leaf
          [[ -z "$parent" ]] || device="/dev/${parent}"
          smart=$(nvme smart-log "$device") || return 2
          warning=$(awk -F: 'tolower($1) ~ /critical_warning/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit}' <<< "$smart")
          temperature=$(awk -F: 'tolower($1) == "temperature" {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit}' <<< "$smart")
          warning_hex=${warning#0x}
          temperature=${temperature//[[:space:]cC]/}
          [[ "$warning_hex" =~ ^[0-9a-fA-F]+$ && "$temperature" =~ ^[0-9]+$ ]] || return 2
          logger -t pve-full-system-stress -p daemon.info -- \
            "pve_full_system_stress run=${run_id} stage=${stage}" \
            "event=sample nvme_device_index=${index} nvme_temp_c=${temperature}" \
            "nvme_critical_warning=${warning}"
          ((16#${warning_hex} == 0)) || return 1
          index=$((index + 1))
        done <<< "$leaves"
      }
      guard_sample() {
        local edac mce_count=0 xid_count=0 rc
        edac=$(edac_counts) || { abort edac_counters_unavailable; }
        read -r current_ce current_ue <<< "$edac"
        ((current_ue == 0)) || { abort edac_ue; }
        kernel_counts || { abort kernel_journal_unavailable; }
        ((mce_count == 0)) || { abort mce_detected; }
        ((xid_count == 0)) || { abort xid_detected; }
        if serving_guard; then
          serving_decision=clear
        else
          rc=$?
          ((rc == 1)) && abort serving_unit_active
          abort serving_guard_unavailable
        fi
        sample_cpu || { rc=$?; ((rc == 1)) && abort cpu_temperature_limit; abort cpu_temperature_sensor_unavailable; }
        gpu_decision=not_required
        if [[ "$watch_gpu" == true ]]; then
          sample_gpu || { rc=$?; ((rc == 1)) && abort gpu_temperature_limit; abort gpu_telemetry_unavailable; }
          gpu_decision=clear
        fi
        nvme_decision=not_required
        if [[ "$stage" == storage || "$stage" == combined ]]; then
          sample_nvme || { rc=$?; ((rc == 1)) && abort nvme_critical_warning; abort nvme_telemetry_unavailable; }
          nvme_decision=clear
        fi
        logger -t pve-full-system-stress -p daemon.info -- \
          "pve_full_system_stress run=${run_id} stage=${stage}" \
          "event=sample edac_ce_count=${current_ce} edac_ue_count=${current_ue}" \
          "mce_count=${mce_count} xid_count=${xid_count}"
        log daemon.info \
          "event=guard_decisions edac=clear mce=clear xid=clear cpu_temp=clear" \
          "serving=${serving_decision} gpu_temp=${gpu_decision} nvme=${nvme_decision}"
      }
      edac_initial=$(edac_counts) || abort edac_counters_unavailable
      read -r baseline_ce baseline_ue <<< "$edac_initial"
      ((baseline_ue == 0)) || abort edac_ue_before_stage
      guard_sample
      [[ "$stage" != memory ]] || :
      component_count=0
      while (($#)); do
        [[ "$1" == --component ]] || abort invalid_component_arguments
        shift
        cwd=$1
        shift
        command=()
        while (($#)) && [[ "$1" != --component ]]; do command+=("$1"); shift; done
        [[ -n "${command[*]}" ]] || abort empty_component_command
        if [[ -n "$cwd" ]]; then
          (cd -- "$cwd" && exec "${command[@]}") &
        else
          "${command[@]}" &
        fi
        child_pids+=("$!")
        component_count=$((component_count + 1))
      done
      ((component_count > 0)) || abort no_components_started
      log daemon.info "event=workloads_start components=${component_count} runtime_seconds=$((duration - 5))"
      next_sample=$((SECONDS + sample_seconds))
      while [[ -n "${child_pids[*]}" ]]; do
        remaining=()
        for pid in "${child_pids[@]}"; do
          state=$(ps -o stat= -p "$pid" 2>/dev/null | tr -d '[:space:]' || true)
          if [[ -n "$state" && "$state" != Z* ]]; then
            remaining+=("$pid")
          elif wait "$pid"; then
            :
          else
            abort workload_failed
          fi
        done
        child_pids=("${remaining[@]}")
        [[ -n "${child_pids[*]}" ]] || break
        if ((SECONDS >= next_sample)); then
          guard_sample
          next_sample=$((SECONDS + sample_seconds))
        fi
        sleep 1
      done
      guard_sample
      if [[ -n "$scratch_file" ]]; then rm -f -- "$scratch_file"; fi
      stage_succeeded=true
- name: Append any additional workload component commands
  ansible.builtin.set_fact:
    pve_full_system_stress_stage_argv: >-
      {{ pve_full_system_stress_stage_argv
         + ['--component', item.cwd | default('')]
         + item.argv }}
  loop: "{{ pve_full_system_stress_components[1:] }}"
  loop_control:
    label: "{{ item.name }}"

- name: Start the detached stage service and watchdog timer
  ansible.builtin.command:
    argv: "{{ pve_full_system_stress_stage_argv }}"
  register: pve_full_system_stress_scheduled
  changed_when: true

- name: Log the accepted stage schedule
  ansible.builtin.command:
    argv:
      - logger
      - -t
      - pve-full-system-stress
      - -p
      - daemon.info
      - --
      - >-
        pve_full_system_stress run={{ pve_full_system_stress_run_id }}
        stage={{ pve_full_system_stress_stage }} event=stage_scheduled
        decision=accepted unit={{ pve_full_system_stress_stage_unit }}.service
        delay_seconds={{ pve_full_system_stress_stage_delay_seconds }}
        runtime_max_seconds={{ pve_full_system_stress_duration_seconds }}
  changed_when: false

- name: Record scheduled stage units and calculate the next stage offset
  ansible.builtin.set_fact:
    pve_full_system_stress_scheduled_stages: >-
      {{ pve_full_system_stress_scheduled_stages | default([])
         + [pve_full_system_stress_stage_unit] }}
    pve_full_system_stress_schedule_offset: >-
      {{ pve_full_system_stress_schedule_offset | int
         + pve_full_system_stress_duration_seconds | int
         + pve_full_system_stress_stage_transition_seconds | int }}
