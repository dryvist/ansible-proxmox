---
- name: Validate the requested full-system stress operation
  ansible.builtin.assert:
    that:
      - pve_full_system_stress_mode in ['start', 'status']
      - pve_full_system_stress_profile in pve_full_system_stress_profiles
    fail_msg: Select the start or status operation and a declared duration profile.
    quiet: true
  tags:
    - never
    - pve_full_system_stress

- name: Start a full-system stress run
  ansible.builtin.include_tasks:
    file: start.yml
    apply:
      tags:
        - never
        - pve_full_system_stress
  when: pve_full_system_stress_mode == 'start'
  tags:
    - never
    - pve_full_system_stress

- name: Report a full-system stress run
  ansible.builtin.include_tasks:
    file: status.yml
    apply:
      tags:
        - never
        - pve_full_system_stress
  when: pve_full_system_stress_mode == 'status'
  tags:
    - never
    - pve_full_system_stress
