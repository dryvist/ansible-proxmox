---
- name: Require an evacuation client distinct from the pve3 server
  ansible.builtin.assert:
    that:
      - inventory_hostname != pve_evacuation_staging_server_inventory_host
    fail_msg: >-
      The evacuation client view belongs on pve2 or standalone pve540, not
      {{ pve_evacuation_staging_server_inventory_host }}.
    quiet: true

- name: Configure and verify this node's independent NFS storage view
  when: ansible_virtualization_type | default('') != 'docker'
  block:
    - name: Discover the pve3 NFS exports from this client
      ansible.builtin.command:
        argv:
          - pvesm
          - scan
          - nfs
          - "{{ pve_evacuation_staging_server_endpoint }}"
      register: pve_evacuation_staging_nfs_scan
      changed_when: false

    - name: Require the exact pve3 staging export from this client
      ansible.builtin.assert:
        that:
          - >-
            pve_evacuation_staging_nfs_scan.stdout_lines
            | select(
                'match',
                '^' ~ (pve_evacuation_staging_mountpoint | regex_escape) ~ '(\s|$)'
              )
            | list | length == 1
        fail_msg: >-
          {{ pve_evacuation_staging_server_endpoint }} does not expose
          {{ pve_evacuation_staging_mountpoint }} to {{ inventory_hostname }}.
        quiet: true

    - name: Read this node's existing evacuation storage view
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/storage/{{ pve_evacuation_staging_storage_id }}"
          - --output-format
          - json
      register: pve_evacuation_staging_storage_current
      changed_when: false
      failed_when: false

    - name: Decode this node's existing evacuation storage view
      ansible.builtin.set_fact:
        pve_evacuation_staging_storage_current_config: >-
          {{ pve_evacuation_staging_storage_current.stdout | from_json }}
      when: pve_evacuation_staging_storage_current.rc == 0

    - name: Require a matching existing evacuation storage view
      ansible.builtin.assert:
        that:
          - pve_evacuation_staging_storage_current_config.type == 'nfs'
          - >-
            pve_evacuation_staging_storage_current_config.server
            == pve_evacuation_staging_server_endpoint
          - >-
            pve_evacuation_staging_storage_current_config.export
            == pve_evacuation_staging_mountpoint
          - >-
            (pve_evacuation_staging_storage_current_config.content | default('')
             | split(',') | reject('equalto', '') | sort | list) == ['backup']
          - >-
            (pve_evacuation_staging_storage_current_config.nodes | default('')
             | split(',') | reject('equalto', '') | sort | list)
            == [pve_evacuation_staging_client_node]
        fail_msg: >-
          Storage ID {{ pve_evacuation_staging_storage_id }} already exists on
          {{ inventory_hostname }} with a different endpoint, export, content,
          or node scope. Refusing to alter an existing storage view.
        quiet: true
      when: pve_evacuation_staging_storage_current.rc == 0

    - name: Add this node's backup-only evacuation storage view
      ansible.builtin.command:
        argv:
          - pvesm
          - add
          - nfs
          - "{{ pve_evacuation_staging_storage_id }}"
          - --server
          - "{{ pve_evacuation_staging_server_endpoint }}"
          - --export
          - "{{ pve_evacuation_staging_mountpoint }}"
          - --content
          - backup
          - --nodes
          - "{{ pve_evacuation_staging_client_node }}"
      when: pve_evacuation_staging_storage_current.rc != 0
      changed_when: true

    - name: Read this node's final evacuation storage view
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/storage/{{ pve_evacuation_staging_storage_id }}"
          - --output-format
          - json
      register: pve_evacuation_staging_storage_final
      changed_when: false

    - name: Decode this node's final evacuation storage view
      ansible.builtin.set_fact:
        pve_evacuation_staging_storage_final_config: >-
          {{ pve_evacuation_staging_storage_final.stdout | from_json }}

    - name: Verify this node's exact backup-only storage view
      ansible.builtin.assert:
        that:
          - pve_evacuation_staging_storage_final_config.type == 'nfs'
          - >-
            pve_evacuation_staging_storage_final_config.server
            == pve_evacuation_staging_server_endpoint
          - >-
            pve_evacuation_staging_storage_final_config.export
            == pve_evacuation_staging_mountpoint
          - >-
            (pve_evacuation_staging_storage_final_config.content | default('')
             | split(',') | reject('equalto', '') | sort | list) == ['backup']
          - >-
            (pve_evacuation_staging_storage_final_config.nodes | default('')
             | split(',') | reject('equalto', '') | sort | list)
            == [pve_evacuation_staging_client_node]
        fail_msg: >-
          {{ inventory_hostname }} did not retain the exact issue-816 NFS
          endpoint, export, backup-only content type, and node-local view.
        quiet: true

    - name: Read this node's active evacuation storage status
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/nodes/{{ pve_evacuation_staging_client_node }}/storage/{{ pve_evacuation_staging_storage_id }}/status"
          - --output-format
          - json
      register: pve_evacuation_staging_storage_status
      changed_when: false

    - name: Verify this node can activate the evacuation storage view
      ansible.builtin.assert:
        that:
          - >-
            ((pve_evacuation_staging_storage_status.stdout | from_json).active
             | default(0) | int) == 1
        fail_msg: >-
          {{ inventory_hostname }} has the storage configuration but cannot
          activate the pve3 evacuation export independently.
        quiet: true
