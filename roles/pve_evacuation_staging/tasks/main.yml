---
- name: Validate the enabled evacuation-staging contract
  ansible.builtin.assert:
    that:
      - pve_evacuation_staging_mode in ['server', 'client']
      - pve_evacuation_staging_pool == 'bulk'
      - pve_evacuation_staging_dataset == 'bulk/evacuation-816'
      - pve_evacuation_staging_mountpoint == '/bulk/evacuation-816'
      - pve_evacuation_staging_manifest_directory == '/bulk/evacuation-816/manifests'
      - pve_evacuation_staging_evidence_directory == '/bulk/evacuation-816/evidence'
      - pve_evacuation_staging_dataset != 'bulk/scratch'
      - pve_evacuation_staging_quota | length > 0
      - pve_evacuation_staging_reservation | length > 0
      - pve_evacuation_staging_pool_headroom | length > 0
      - (pve_evacuation_staging_quota | human_to_bytes) > 0
      - (pve_evacuation_staging_reservation | human_to_bytes) > 0
      - (pve_evacuation_staging_pool_headroom | human_to_bytes) > 0
      - >-
        (pve_evacuation_staging_reservation | human_to_bytes)
        <= (pve_evacuation_staging_quota | human_to_bytes)
      - pve_evacuation_staging_server_endpoint | length > 0
      - pve_evacuation_staging_server_endpoint is not search('\s|,|:')
      - pve_evacuation_staging_export_clients | length == 2
      - pve_evacuation_staging_export_clients | unique | length == 2
      - >-
        pve_evacuation_staging_export_clients
        | reject('equalto', '') | list | length
        == pve_evacuation_staging_export_clients | length
      - >-
        pve_evacuation_staging_export_clients
        | select('search', '\s|,|:') | list | length == 0
      - pve_evacuation_staging_storage_id is match('^[a-z0-9][a-z0-9_-]{0,39}$')
      - pve_evacuation_staging_client_node | length > 0
      - pve_evacuation_staging_nfs_anonymous_user == 'nobody'
      - pve_evacuation_staging_nfs_anonymous_group == 'nogroup'
      - pve_evacuation_staging_backup_directory_mode == '0700'
      - pve_evacuation_staging_manifest_directory_mode == '0700'
      - pve_evacuation_staging_evidence_directory_mode == '0700'
    fail_msg: >-
      Enabling pve_evacuation_staging requires the reviewed issue-816 dataset,
      capacity budget, pve3 endpoint, and exactly the pve2 and pve540
      management clients. The dataset is fixed to bulk/evacuation-816 so the
      role cannot reuse bulk/scratch or another storage namespace.
    quiet: true
  when: pve_evacuation_staging_enabled | bool
  tags:
    - pve_evacuation_staging
    - migration

- name: Configure the dedicated pve3 evacuation staging server
  ansible.builtin.include_tasks: server.yml
  when:
    - pve_evacuation_staging_enabled | bool
    - pve_evacuation_staging_mode == 'server'
  tags:
    - pve_evacuation_staging
    - migration

- name: Configure an independent evacuation staging client view
  ansible.builtin.include_tasks: client.yml
  when:
    - pve_evacuation_staging_enabled | bool
    - pve_evacuation_staging_mode == 'client'
  tags:
    - pve_evacuation_staging
    - migration
