---
- name: Require the configured pve3 staging host
  ansible.builtin.assert:
    that:
      - inventory_hostname == pve_evacuation_staging_server_inventory_host
    fail_msg: >-
      The evacuation staging server role may only run on
      {{ pve_evacuation_staging_server_inventory_host }}, not {{ inventory_hostname }}.
    quiet: true

- name: Provision the pve3 evacuation staging dataset and export
  when: ansible_virtualization_type | default('') != 'docker'
  block:
    - name: Check that the pve3 bulk pool exists
      ansible.builtin.command:
        argv:
          - zpool
          - list
          - -H
          - -o
          - name
          - "{{ pve_evacuation_staging_pool }}"
      register: pve_evacuation_staging_pool_check
      changed_when: false
      failed_when: false

    - name: Require the existing pve3 bulk pool
      ansible.builtin.assert:
        that:
          - pve_evacuation_staging_pool_check.rc == 0
        fail_msg: >-
          Refusing to create a pool for issue 816. The existing
          {{ pve_evacuation_staging_pool }} pool is required on pve3.
        quiet: true

    - name: Read free capacity in the pve3 bulk pool
      ansible.builtin.command:
        argv:
          - zpool
          - list
          - -H
          - -p
          - -o
          - free
          - "{{ pve_evacuation_staging_pool }}"
      register: pve_evacuation_staging_pool_free
      changed_when: false

    - name: Check whether the dedicated evacuation dataset already exists
      ansible.builtin.command:
        argv:
          - zfs
          - list
          - -H
          - -o
          - name
          - "{{ pve_evacuation_staging_dataset }}"
      register: pve_evacuation_staging_dataset_check
      changed_when: false
      failed_when: false

    - name: Read the existing evacuation dataset marker
      ansible.builtin.command:
        argv:
          - zfs
          - get
          - -H
          - -o
          - value
          - org.dryvist:purpose
          - "{{ pve_evacuation_staging_dataset }}"
      register: pve_evacuation_staging_dataset_marker_current
      changed_when: false
      when: pve_evacuation_staging_dataset_check.rc == 0

    - name: Require ownership of an existing evacuation dataset
      ansible.builtin.assert:
        that:
          - >-
            pve_evacuation_staging_dataset_check.rc != 0
            or pve_evacuation_staging_dataset_marker_current.stdout
               == pve_evacuation_staging_dataset_marker
        fail_msg: >-
          {{ pve_evacuation_staging_dataset }} already exists without the
          issue-816 ownership marker. Preserve it for investigation and choose
          an explicitly reviewed staging path instead of adopting it.
        quiet: true

    - name: Read used capacity in an existing evacuation dataset
      ansible.builtin.command:
        argv:
          - zfs
          - get
          - -H
          - -p
          - -o
          - value
          - used
          - "{{ pve_evacuation_staging_dataset }}"
      register: pve_evacuation_staging_dataset_used
      changed_when: false
      when: pve_evacuation_staging_dataset_check.rc == 0

    - name: Read reservation in an existing evacuation dataset
      ansible.builtin.command:
        argv:
          - zfs
          - get
          - -H
          - -p
          - -o
          - value
          - reservation
          - "{{ pve_evacuation_staging_dataset }}"
      register: pve_evacuation_staging_dataset_reservation_current
      changed_when: false
      when: pve_evacuation_staging_dataset_check.rc == 0

    - name: Read quota in an existing evacuation dataset
      ansible.builtin.command:
        argv:
          - zfs
          - get
          - -H
          - -p
          - -o
          - value
          - quota
          - "{{ pve_evacuation_staging_dataset }}"
      register: pve_evacuation_staging_dataset_quota_current
      changed_when: false
      when: pve_evacuation_staging_dataset_check.rc == 0

    - name: Calculate the issue-816 capacity guard
      ansible.builtin.set_fact:
        pve_evacuation_staging_pool_free_bytes: >-
          {{ pve_evacuation_staging_pool_free.stdout | int }}
        pve_evacuation_staging_dataset_used_bytes: >-
          {{ (pve_evacuation_staging_dataset_used | default({})).stdout
             | default('0', true) | int }}
        pve_evacuation_staging_dataset_reservation_bytes: >-
          {{ (pve_evacuation_staging_dataset_reservation_current | default({})).stdout
             | default('0', true) | int }}
        pve_evacuation_staging_dataset_quota_bytes: >-
          {{ pve_evacuation_staging_quota | human_to_bytes }}
        pve_evacuation_staging_dataset_reservation_target_bytes: >-
          {{ pve_evacuation_staging_reservation | human_to_bytes }}
        pve_evacuation_staging_pool_headroom_bytes: >-
          {{ pve_evacuation_staging_pool_headroom | human_to_bytes }}

    - name: Calculate capacity still needed for the staging quota
      ansible.builtin.set_fact:
        pve_evacuation_staging_dataset_current_commitment_bytes: >-
          {{ [pve_evacuation_staging_dataset_used_bytes | int,
              pve_evacuation_staging_dataset_reservation_bytes | int] | max }}
        pve_evacuation_staging_dataset_additional_capacity_bytes: >-
          {{ [
              (pve_evacuation_staging_dataset_quota_bytes | int)
              - ([pve_evacuation_staging_dataset_used_bytes | int,
                  pve_evacuation_staging_dataset_reservation_bytes | int] | max),
              0
             ] | max }}

    - name: Preserve pve3 bulk headroom through the full staging quota
      ansible.builtin.assert:
        that:
          - >-
            (pve_evacuation_staging_dataset_used_bytes | int)
            <= (pve_evacuation_staging_dataset_quota_bytes | int)
          - >-
            (pve_evacuation_staging_dataset_reservation_target_bytes | int)
            <= (pve_evacuation_staging_dataset_quota_bytes | int)
          - >-
            (pve_evacuation_staging_pool_free_bytes | int)
            - (pve_evacuation_staging_dataset_additional_capacity_bytes | int)
            >= (pve_evacuation_staging_pool_headroom_bytes | int)
        fail_msg: >-
          The reviewed issue-816 staging quota cannot fit on pve3 bulk while
          retaining the requested pool headroom. Existing staging data,
          reservation, free space, quota, and headroom are all considered.
        quiet: true

    - name: Create the dedicated pve3 evacuation staging dataset
      ansible.builtin.command:
        argv:
          - zfs
          - create
          - -p
          - -o
          - "mountpoint={{ pve_evacuation_staging_mountpoint }}"
          - -o
          - "quota={{ pve_evacuation_staging_quota }}"
          - -o
          - "reservation={{ pve_evacuation_staging_reservation }}"
          - -o
          - "org.dryvist:purpose={{ pve_evacuation_staging_dataset_marker }}"
          - "{{ pve_evacuation_staging_dataset }}"
      when: pve_evacuation_staging_dataset_check.rc != 0
      changed_when: true

    - name: Read the managed staging dataset mountpoint
      ansible.builtin.command:
        argv:
          - zfs
          - get
          - -H
          - -o
          - value
          - mountpoint
          - "{{ pve_evacuation_staging_dataset }}"
      register: pve_evacuation_staging_mountpoint_current
      changed_when: false

    - name: Repair the managed staging dataset mountpoint
      ansible.builtin.command:
        argv:
          - zfs
          - set
          - "mountpoint={{ pve_evacuation_staging_mountpoint }}"
          - "{{ pve_evacuation_staging_dataset }}"
      when: >-
        pve_evacuation_staging_mountpoint_current.stdout
        != pve_evacuation_staging_mountpoint
      changed_when: true

    - name: Set the managed staging dataset quota
      ansible.builtin.command:
        argv:
          - zfs
          - set
          - "quota={{ pve_evacuation_staging_quota }}"
          - "{{ pve_evacuation_staging_dataset }}"
      when: >-
        (pve_evacuation_staging_dataset_quota_current | default({})).stdout
        | default('') | int
        != pve_evacuation_staging_dataset_quota_bytes | int
      changed_when: true

    - name: Set the managed staging dataset reservation
      ansible.builtin.command:
        argv:
          - zfs
          - set
          - "reservation={{ pve_evacuation_staging_reservation }}"
          - "{{ pve_evacuation_staging_dataset }}"
      when: >-
        (pve_evacuation_staging_dataset_reservation_current | default({})).stdout
        | default('') | int
        != pve_evacuation_staging_dataset_reservation_target_bytes | int
      changed_when: true

    - name: Grant root-squashed NFS clients ownership of the backup surface
      ansible.builtin.file:
        path: "{{ pve_evacuation_staging_mountpoint }}"
        owner: "{{ pve_evacuation_staging_nfs_anonymous_user }}"
        group: "{{ pve_evacuation_staging_nfs_anonymous_group }}"
        mode: "{{ pve_evacuation_staging_backup_directory_mode }}"
        state: directory

    - name: Create the shared comparison manifest directory
      ansible.builtin.file:
        path: "{{ pve_evacuation_staging_manifest_directory }}"
        owner: "{{ pve_evacuation_staging_nfs_anonymous_user }}"
        group: "{{ pve_evacuation_staging_nfs_anonymous_group }}"
        mode: "{{ pve_evacuation_staging_manifest_directory_mode }}"
        state: directory

    - name: Create the pve3-local root-only archive evidence directory
      ansible.builtin.file:
        path: "{{ pve_evacuation_staging_evidence_directory }}"
        owner: root
        group: root
        mode: "{{ pve_evacuation_staging_evidence_directory_mode }}"
        state: directory

    - name: Verify the root-squashed NFS identity can write the backup surface
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - "{{ pve_evacuation_staging_nfs_anonymous_user }}"
          - --
          - test
          - -w
          - "{{ pve_evacuation_staging_mountpoint }}"
      changed_when: false

    - name: Verify the root-squashed NFS identity can write shared manifests
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - "{{ pve_evacuation_staging_nfs_anonymous_user }}"
          - --
          - test
          - -w
          - "{{ pve_evacuation_staging_manifest_directory }}"
      changed_when: false

    - name: Read the root-only archive evidence directory permissions
      ansible.builtin.stat:
        path: "{{ pve_evacuation_staging_evidence_directory }}"
      register: pve_evacuation_staging_evidence_directory_stat

    - name: Verify archive evidence remains pve3-local and root-only
      ansible.builtin.assert:
        that:
          - pve_evacuation_staging_evidence_directory_stat.stat.pw_name == 'root'
          - pve_evacuation_staging_evidence_directory_stat.stat.gr_name == 'root'
          - pve_evacuation_staging_evidence_directory_stat.stat.mode == '0700'
        fail_msg: >-
          The issue-816 archive evidence directory must remain root-only on
          pve3, separate from the root-squashed client backup surface.
        quiet: true

    - name: Install the Debian NFS server package
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable and start the Debian NFS server
      ansible.builtin.systemd:
        name: nfs-server
        enabled: true
        state: started

    - name: Read the managed staging NFS export options
      ansible.builtin.command:
        argv:
          - zfs
          - get
          - -H
          - -o
          - value
          - sharenfs
          - "{{ pve_evacuation_staging_dataset }}"
      register: pve_evacuation_staging_sharenfs_current
      changed_when: false

    - name: Export staging only to the two management clients
      ansible.builtin.command:
        argv:
          - zfs
          - set
          - "sharenfs={{ pve_evacuation_staging_sharenfs }}"
          - "{{ pve_evacuation_staging_dataset }}"
      when: >-
        pve_evacuation_staging_sharenfs_current.stdout
        != pve_evacuation_staging_sharenfs
      changed_when: true

    - name: Read the kernel's active NFS export table
      ansible.builtin.command:
        argv:
          - exportfs
          - -v
      register: pve_evacuation_staging_exportfs
      changed_when: false

    - name: Verify the active root-squashed synchronous NFS export
      ansible.builtin.assert:
        that:
          - pve_evacuation_staging_mountpoint in pve_evacuation_staging_exportfs.stdout
          - "'root_squash' in pve_evacuation_staging_exportfs.stdout"
          - "'sync' in pve_evacuation_staging_exportfs.stdout"
          - >-
            pve_evacuation_staging_sharenfs
            == 'rw=' ~ (pve_evacuation_staging_export_clients | join(':'))
               ~ ',root_squash,sync'
        fail_msg: >-
          pve3 did not activate the reviewed issue-816 NFS export with
          root-squash and synchronous writes.
        quiet: true
