---
# Declarative Proxmox VE backup jobs. A job selects exactly one of a resource
# pool or all guests on one node. Guest-id lists are refused because a reused id
# could silently change which guest the job protects. Fleet inventory uses
# all-node selection so guests need no pool reassignment to receive backups.

# Inert by default. Nothing is created, changed or removed until this is on —
# the same shape as the other roles here that alter live cluster behaviour.
pve_backup_jobs_manage: false

# Backup jobs live in the cluster filesystem, so they are configured from ONE
# node and apply cluster-wide. Set to the inventory hostname that owns this.
pve_backup_jobs_config_host: ""

# Desired job set. Each entry:
#   id        stable job id; the reconcile keys off it
#   pool      pool id to select; mutually exclusive with all
#   all       true to select every guest on node; mutually exclusive with pool
#   node      the ONE node that runs this job. vzdump matches a single node
#             name (PVE format pve-node). Required: a job with no node also
#             protects guests on pve_backup_jobs_pbs_node, which would back
#             them up onto themselves.
#   storage   storage id to write to; pve_backup_jobs_storage_id
#   schedule  systemd calendar expression
#   enabled   false ships the job present-but-off, so a first full run stays a
#             deliberate act rather than a side effect of a converge
#   prune     retention. Leave at keep-all=1: PBS owns retention (see below)
#   mode      snapshot | suspend | stop
#   compress  zstd | gzip | lzo | 0
#   comment   free text shown in the UI
#
# Empty here. The live list is environment data, declared in
# inventory/group_vars/proxmox.yml with the other environment-derived settings.
pve_backup_jobs_jobs: []

# --- Data-mount backup flags -------------------------------------------------
# vzdump skips an LXC mount point with no backup=1 and still exits 0, so a guest
# reads as covered while only its rootfs is in the archive. Roughly thirty
# mounts here predate the desired state's backup default; the desired state
# cannot fix them because `mount_point` is in the container module's
# ignore_changes. Independent of the job reconcile above, and NODE-LOCAL: pct
# only manages guests on the node it runs on.
pve_backup_jobs_manage_mount_flags: false

# vmids whose mounts stay unflagged deliberately. An explicit backup=0 is
# already respected everywhere; this list is for guests whose mounts carry no
# flag at all and should stay that way — re-acquirable bulk rather than service
# state. Object-store and media guests belong here, not a rootfs-only archive of
# a hundred gigabytes already covered by replication.
pve_backup_jobs_mount_flag_exclude_vmids: []

# Guests on THIS node, resolved from the published inventory. The pct calls are
# node-local, so a vmid homed elsewhere would simply fail.
pve_backup_jobs_local_vmids: >-
  {{ (containers_from_tofu | default({})) | dict2items
     | selectattr('value.node', 'defined')
     | selectattr('value.node', 'equalto', pve_backup_jobs_this_pve_node)
     | selectattr('value.ansible_pct_vmid', 'defined')
     | map(attribute='value.ansible_pct_vmid') | list }}

# This host's Proxmox node name, which is not necessarily its inventory key —
# same rationale as pve_ha_this_pve_node.
pve_backup_jobs_this_pve_node: "{{ proxmox_node_name | default(inventory_hostname) }}"

pve_backup_jobs_default_mode: snapshot
pve_backup_jobs_default_compress: zstd
# Retention belongs to PBS. A datastore prune job removes snapshots for every
# writer at once. vzdump pruning would apply per job and see only the snapshots
# that one job wrote. keep-all=1 stops vzdump from pruning.
pve_backup_jobs_default_prune: keep-all=1

# Remove vzdump jobs this role does not declare. On by default because the
# failure being designed out is a job nobody remembers aiming: a job left behind
# after the guest it named was renumbered, or one pinned to a node that has left
# the cluster, is not neutral — it reads as coverage and provides none. With the
# desired list empty the reconcile does nothing at all, so this cannot sweep a
# cluster by accident.
pve_backup_jobs_prune_unmanaged: true

# --- PBS target ---------------------------------------------------------------
# The only backup target. Its storage id is `guests`. `pbs` is the storage TYPE
# (the protocol), so it stays out of the id. Every job names this id.
pve_backup_jobs_storage_id: guests

# FQDN of the Proxmox Backup Server. No default: inventory sets it. A name, never
# an address, so the server can move without a change here.
pve_backup_jobs_pbs_server: ""

# The node that hosts the PBS guest. Guests on this node stay uncovered until a
# second target exists, so no job may run on it.
pve_backup_jobs_pbs_node: ""

# Every PVE node may use the storage.
pve_backup_jobs_storage_nodes: "{{ groups['proxmox'] | map('extract', hostvars, 'proxmox_node_name') | list }}"

# Credentials come from OpenBao KV v2, read on the controller by the same
# mechanism pve_api_tokens and bmc_console_user use. The path holds
# PBS_TOKEN_ID (the full auth id), PBS_TOKEN_SECRET, PBS_FINGERPRINT and
# PBS_DATASTORE. The fingerprint is PINNED: PBS serves a self-signed certificate.
pve_backup_jobs_bao_addr: >-
  {{ lookup('env', 'BAO_ADDR')
     | default(lookup('env', 'VAULT_ADDR') | default('', true), true) }}
pve_backup_jobs_bao_token: "{{ lookup('env', 'BAO_TOKEN') | default('', true) }}"
pve_backup_jobs_bao_kv_mount: secret
pve_backup_jobs_pbs_secret_path: platform/pbs/pve-nodes
