---
# pve_backup_jobs — reconcile the cluster's vzdump job set from a declared
# desired state. Backup jobs live in the cluster filesystem, so all
# work runs on exactly ONE node (pve_backup_jobs_config_host), the same shape
# pve_ha uses for cluster-wide state. Inert unless pve_backup_jobs_manage; all
# CLI work is skipped under Docker so the role stays molecule-testable without a
# live cluster.
#
# Everything goes through the PVE API rather than /etc/pve/jobs.cfg. That file
# also holds job types this role knows nothing about (realm sync, and whatever
# a future release adds), so templating it whole would silently delete them —
# which is the same class of failure this role exists to prevent.

# Validated on EVERY host, outside the reconcile block below. A malformed
# declaration is wrong everywhere, so it should fail on the first host of the
# run rather than only on the single config host, and only once the role is
# enabled — by which point the declaration has been carried unchallenged for as
# long as it took someone to flip the switch.
- name: Validate the declared backup job set
  ansible.builtin.import_tasks: validate.yml
  tags:
    - pve_backup_jobs

# Node-local, and deliberately outside the cluster-wide reconcile block below:
# pct manages only the guests on the node it runs on, so this must run on every
# node rather than on the single config host.
- name: Set backup=1 on unflagged LXC data mounts
  ansible.builtin.import_tasks: mount_flags.yml
  when:
    - pve_backup_jobs_manage_mount_flags | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - pve_backup_jobs

- name: Reconcile cluster backup jobs from the single config host
  when:
    - pve_backup_jobs_manage | bool
    - pve_backup_jobs_jobs | length > 0
    - inventory_hostname == pve_backup_jobs_config_host
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - pve_backup_jobs
  block:
    - name: Read the PBS target credentials from OpenBao
      # Read here, not in validate.yml: validation runs on every host, and only
      # the config host reaches this block. A failed read fails the run.
      community.hashi_vault.vault_kv2_get:
        url: "{{ pve_backup_jobs_bao_addr }}"
        token: "{{ pve_backup_jobs_bao_token }}"
        engine_mount_point: "{{ pve_backup_jobs_bao_kv_mount }}"
        path: "{{ pve_backup_jobs_pbs_secret_path }}"
      register: pve_backup_jobs_pbs_secret
      delegate_to: localhost
      become: false
      no_log: true
      changed_when: false
      check_mode: false

    - name: Require every PBS target credential field
      # A PBS target with an empty field is the silent-skip failure this role
      # exists to prevent: the storage is never defined, every job then fails
      # per guest, and the converge that caused it reported success.
      ansible.builtin.assert:
        that:
          - pve_backup_jobs_pbs_secret.secret.PBS_TOKEN_ID | default('', true) | length > 0
          - pve_backup_jobs_pbs_secret.secret.PBS_TOKEN_SECRET | default('', true) | length > 0
          - pve_backup_jobs_pbs_secret.secret.PBS_FINGERPRINT | default('', true) | length > 0
          - pve_backup_jobs_pbs_secret.secret.PBS_DATASTORE | default('', true) | length > 0
        fail_msg: >-
          pve_backup_jobs: the OpenBao path {{ pve_backup_jobs_pbs_secret_path }}
          is missing PBS_TOKEN_ID, PBS_TOKEN_SECRET, PBS_FINGERPRINT or PBS_DATASTORE.
        quiet: true

    - name: Read PVE storage definitions
      ansible.builtin.uri:
        url: "https://{{ pve_backup_jobs_api_host }}:8006/api2/json/storage"
        method: GET
        headers:
          Authorization: >-
            PVEAPIToken={{ pve_backup_jobs_api_user }}!{{ pve_backup_jobs_api_token_id }}={{ pve_backup_jobs_api_token_secret }}
        validate_certs: "{{ pve_backup_jobs_api_validate_certs | bool }}"
        status_code: 200
      register: pve_backup_jobs_storage_list
      changed_when: false
      check_mode: false
      no_log: true

    - name: Select the declared PBS storage from the PVE storage list
      ansible.builtin.set_fact:
        pve_backup_jobs_existing_storage: >-
          {{ pve_backup_jobs_storage_list.json.data
             | selectattr('storage', 'equalto', pve_backup_jobs_storage_id)
             | first
             | default({}) }}
      changed_when: false
      no_log: true

    - name: Require the existing PBS storage identity to match
      ansible.builtin.assert:
        that:
          - pve_backup_jobs_existing_storage.type | default('') == 'pbs'
          - pve_backup_jobs_existing_storage.server | default('') == pve_backup_jobs_pbs_server
          - pve_backup_jobs_existing_storage.datastore | default('') == pve_backup_jobs_pbs_secret.secret.PBS_DATASTORE
        fail_msg: >-
          PBS storage {{ pve_backup_jobs_storage_id }} already exists with a different type, server or datastore.
          Its server and datastore are fixed; remove and re-add it deliberately to change them.
        quiet: true
      when: pve_backup_jobs_existing_storage | length > 0

    - name: Detect drift in mutable PBS storage settings
      ansible.builtin.set_fact:
        pve_backup_jobs_storage_drift: >-
          {{ pve_backup_jobs_existing_storage | length > 0 and (
               pve_backup_jobs_existing_storage.username | default('') != pve_backup_jobs_pbs_secret.secret.PBS_TOKEN_ID
               or pve_backup_jobs_existing_storage.fingerprint | default('') != pve_backup_jobs_pbs_secret.secret.PBS_FINGERPRINT
               or (pve_backup_jobs_existing_storage.content | default('') | string | split(',')
                   | map('trim') | reject('equalto', '') | unique | list | sort) != ['backup']
               or (pve_backup_jobs_existing_storage.nodes | default('') | string | split(',')
                   | map('trim') | reject('equalto', '') | unique | list | sort)
                  != (pve_backup_jobs_storage_nodes | unique | list | sort)
             ) }}
      changed_when: false
      no_log: true

    - name: Report PBS storage creation in check mode
      ansible.builtin.debug:
        msg: "PBS storage {{ pve_backup_jobs_storage_id }} would be created."
      changed_when: true
      when:
        - ansible_check_mode
        - pve_backup_jobs_existing_storage | length == 0

    - name: Create the PBS backup target storage
      # The fingerprint is PINNED. PBS serves a self-signed certificate, so
      # without it every node either refuses the storage or is asked to trust
      # whatever answers on that name — which is the whole value of pinning.
      ansible.builtin.uri:
        url: "https://{{ pve_backup_jobs_api_host }}:8006/api2/json/storage"
        method: POST
        headers:
          Authorization: >-
            PVEAPIToken={{ pve_backup_jobs_api_user }}!{{ pve_backup_jobs_api_token_id }}={{ pve_backup_jobs_api_token_secret }}
        validate_certs: "{{ pve_backup_jobs_api_validate_certs | bool }}"
        body_format: form-urlencoded
        body:
          storage: "{{ pve_backup_jobs_storage_id }}"
          type: pbs
          # An FQDN, never a literal address: the guest moves, the name does not.
          server: "{{ pve_backup_jobs_pbs_server }}"
          datastore: "{{ pve_backup_jobs_pbs_secret.secret.PBS_DATASTORE }}"
          username: "{{ pve_backup_jobs_pbs_secret.secret.PBS_TOKEN_ID }}"
          password: "{{ pve_backup_jobs_pbs_secret.secret.PBS_TOKEN_SECRET }}"
          fingerprint: "{{ pve_backup_jobs_pbs_secret.secret.PBS_FINGERPRINT }}"
          content: backup
          nodes: "{{ pve_backup_jobs_storage_nodes | join(',') }}"
        status_code: 200
      when:
        - not ansible_check_mode
        - pve_backup_jobs_existing_storage | length == 0
      changed_when: true
      no_log: true

    - name: Report PBS storage update in check mode
      ansible.builtin.debug:
        msg: "PBS storage {{ pve_backup_jobs_storage_id }} would be updated."
      changed_when: true
      when:
        - ansible_check_mode
        - pve_backup_jobs_existing_storage | length > 0
        - pve_backup_jobs_storage_drift

    - name: Update mutable PBS backup target storage settings
      ansible.builtin.uri:
        url: "https://{{ pve_backup_jobs_api_host }}:8006/api2/json/storage/{{ pve_backup_jobs_storage_id }}"
        method: PUT
        headers:
          Authorization: >-
            PVEAPIToken={{ pve_backup_jobs_api_user }}!{{ pve_backup_jobs_api_token_id }}={{ pve_backup_jobs_api_token_secret }}
        validate_certs: "{{ pve_backup_jobs_api_validate_certs | bool }}"
        body_format: form-urlencoded
        body:
          username: "{{ pve_backup_jobs_pbs_secret.secret.PBS_TOKEN_ID }}"
          password: "{{ pve_backup_jobs_pbs_secret.secret.PBS_TOKEN_SECRET }}"
          fingerprint: "{{ pve_backup_jobs_pbs_secret.secret.PBS_FINGERPRINT }}"
          content: backup
          nodes: "{{ pve_backup_jobs_storage_nodes | join(',') }}"
        status_code: 200
      when:
        - not ansible_check_mode
        - pve_backup_jobs_existing_storage | length > 0
        - pve_backup_jobs_storage_drift
      changed_when: true
      no_log: true

    - name: Report PBS storage already matches the declaration
      ansible.builtin.debug:
        msg: "PBS storage {{ pve_backup_jobs_storage_id }} is already current."
      changed_when: false
      when:
        - pve_backup_jobs_existing_storage | length > 0
        - not pve_backup_jobs_storage_drift

    - name: Reconcile the live job set against the declaration
      ansible.builtin.import_tasks: reconcile.yml
