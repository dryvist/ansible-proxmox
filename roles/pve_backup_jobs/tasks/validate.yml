---
# Declaration validation, deliberately separate from the reconcile so it runs on
# every host and can be exercised without a cluster
# (tests/pve_backup_jobs/verify_declaration.yml).
# It reads no credential. The OpenBao read happens on the config host only, in
# main.yml.

- name: Resolve the PBS guest name from the published guest map
  # The guest whose published fqdn matches the PBS server. A job on the PBS node
  # is accepted only when this guest is in its exclude_names; with no matching
  # guest published, no PBS-node job is accepted.
  ansible.builtin.set_fact:
    pve_backup_jobs_pbs_guest_name: >-
      {{ pve_backup_jobs_tofu_guest_map | dict2items
         | selectattr('value.fqdn', 'defined')
         | selectattr('value.fqdn', 'equalto', pve_backup_jobs_pbs_server)
         | map(attribute='key') | first | default('') }}
  tags:
    - pve_backup_jobs

- name: Assert every declared job selects exactly one scope and names a storage
  # Raw guest-id lists keep selecting a number after that number is reused for a
  # different guest. Names are safe because the current id is resolved from the
  # published desired-state inventory on every run.
  ansible.builtin.assert:
    that:
      - item.id | default('') | length > 0
      - >-
        ((item.pool | default('', true) | length > 0) | int
         + (item.all | default(false) | bool | int)
         + ((item.names is defined) | int)) == 1
      - item.storage | default('') | length > 0
      - item.schedule | default('') | length > 0
      - item.vmid is not defined
      - >-
        item.names is not defined
        or (
          item.names is sequence
          and item.names is not string
          and item.names is not mapping
          and (item.names | length) > 0
          and (item.names | select('string') | list | length) == (item.names | length)
          and (item.names | unique | list | length) == (item.names | length)
        )
      - >-
        item.exclude_names is not defined
        or (
          (item.exclude_names | default([], true)) is sequence
          and (item.exclude_names | default([], true)) is not string
          and (item.exclude_names | default([], true)) is not mapping
          and (item.exclude_names | default([], true) | select('string') | list | length)
              == (item.exclude_names | default([], true) | length)
        )
      - >-
        item.exclude_names is not defined
        or (item.pool | default('', true) | length > 0)
        or (item.all | default(false) | bool)
      - item.names is not defined or item.exclude_names is not defined
    fail_msg: >-
      Backup job '{{ item.id | default('<no id>') }}' must declare id, exactly
      one of pool, all: true, or a non-empty unique string names list, storage
      and schedule. Raw vmid lists are forbidden; exclude_names requires pool
      or all and cannot be combined with names.
    quiet: true
  loop: "{{ pve_backup_jobs_jobs }}"
  loop_control:
    label: "{{ item.id | default('<no id>') }}"
  tags:
    - pve_backup_jobs

- name: Assert every declared change detection mode is one PVE accepts
  ansible.builtin.assert:
    that:
      - >-
        item.pbs_change_detection_mode is not defined
        or (item.pbs_change_detection_mode in ['legacy', 'data', 'metadata'])
    fail_msg: >-
      Backup job '{{ item.id | default('<no id>') }}' has
      pbs_change_detection_mode that must be one of legacy, data or metadata.
    quiet: true
  loop: "{{ pve_backup_jobs_jobs }}"
  loop_control:
    label: "{{ item.id | default('<no id>') }}"
  tags:
    - pve_backup_jobs

- name: Assert declared job ids are unique
  # Two entries sharing an id silently collapse: the reconcile applies both to
  # the same job and the last one wins, so one of the two intents disappears
  # with nothing reporting that it did.
  ansible.builtin.assert:
    that:
      - (pve_backup_jobs_jobs | map(attribute='id') | list | unique | length)
        == (pve_backup_jobs_jobs | length)
    fail_msg: "Duplicate backup job id in pve_backup_jobs_jobs; ids must be unique."
    quiet: true
  when: pve_backup_jobs_jobs | length > 0
  tags:
    - pve_backup_jobs

- name: Assert every named guest exclusion resolves to one desired-state VMID
  ansible.builtin.assert:
    that:
      - >-
        (item.exclude_names | default([], true) | unique | list | length)
        == (item.exclude_names | default([], true) | length)
      - >-
        (item.exclude_names | default([], true)
         | reject('in', pve_backup_jobs_tofu_guest_map.keys() | list)
         | list | length) == 0
      - >-
        (item.exclude_names | default([], true)
         | map('extract', pve_backup_jobs_tofu_guest_map)
         | selectattr('vmid', 'defined') | list | length)
        == (item.exclude_names | default([], true) | length)
      - >-
        (item.exclude_names | default([], true)
         | map('extract', pve_backup_jobs_tofu_guest_map)
         | selectattr('vmid', 'defined') | map(attribute='vmid')
         | map('int') | select('gt', 0) | list | length)
        == (item.exclude_names | default([], true) | length)
    fail_msg: >-
      Backup job '{{ item.id | default('<no id>') }}' has exclude_names that
      must be unique names in tofu_data (containers, vms, docker_vms or
      splunk_vm), each with a positive VMID. Raw VMID lists are not accepted.
    quiet: true
  loop: "{{ pve_backup_jobs_jobs }}"
  loop_control:
    label: "{{ item.id | default('<no id>') }}"
  tags:
    - pve_backup_jobs

- name: Assert every tag exclusion is a list of tag names
  # A tag selects guests the job does not name, so it cannot ride on a names
  # selection. Without names the exactly-one rule above already requires pool or
  # all, so only the shape and the pairing with names are checked here.
  ansible.builtin.assert:
    that:
      - >-
        item.exclude_tags is not defined
        or (
          item.exclude_tags is sequence
          and item.exclude_tags is not string
          and item.exclude_tags is not mapping
          and (item.exclude_tags | select('string') | list | length) == (item.exclude_tags | length)
        )
      - item.exclude_tags is not defined or item.names is not defined
    fail_msg: >-
      Backup job '{{ item.id | default('<no id>') }}' has exclude_tags that must
      be a list of tag names, and cannot be combined with names.
    quiet: true
  loop: "{{ pve_backup_jobs_jobs }}"
  loop_control:
    label: "{{ item.id | default('<no id>') }}"
  tags:
    - pve_backup_jobs

- name: Assert every named guest selection resolves to one desired-state VMID
  ansible.builtin.assert:
    that:
      - >-
        (item.names | default([], true) | reject('in', pve_backup_jobs_tofu_guest_map.keys() | list)
         | list | length) == 0
      - >-
        (item.names | default([], true) | map('extract', pve_backup_jobs_tofu_guest_map)
         | selectattr('vmid', 'defined') | list | length)
        == (item.names | default([], true) | length)
      - >-
        (item.names | default([], true) | map('extract', pve_backup_jobs_tofu_guest_map)
         | selectattr('vmid', 'defined') | map(attribute='vmid')
         | map('int') | select('gt', 0) | list | length)
        == (item.names | default([], true) | length)
    fail_msg: >-
      Backup job '{{ item.id | default('<no id>') }}' has names that must
      resolve to guests in tofu_data (containers, vms, docker_vms or splunk_vm),
      each with a positive VMID.
    quiet: true
  loop: "{{ pve_backup_jobs_jobs }}"
  loop_control:
    label: "{{ item.id | default('<no id>') }}"
  tags:
    - pve_backup_jobs

- name: Assert the PBS target is declared when jobs are
  # A job pointing at a storage nothing ensures fails hours after a converge
  # that reported success. Every job must name the one PBS target this role
  # ensures.
  ansible.builtin.assert:
    that:
      - pve_backup_jobs_storage_id | length > 0
      - pve_backup_jobs_pbs_server | length > 0
      - pve_backup_jobs_pbs_node | length > 0
      - pve_backup_jobs_storage_nodes | length > 0
      - pve_backup_jobs_jobs | map(attribute='storage') | reject('equalto', pve_backup_jobs_storage_id) | list | length == 0
    fail_msg: >-
      pve_backup_jobs_jobs is non-empty but the PBS target is not fully declared.
      pve_backup_jobs_storage_id, pve_backup_jobs_pbs_server, pve_backup_jobs_pbs_node
      and pve_backup_jobs_storage_nodes must be set, and every job must name
      pve_backup_jobs_storage_id.
    quiet: true
  when: pve_backup_jobs_jobs | length > 0
  tags:
    - pve_backup_jobs

- name: Assert each job runs on one node that is not the backup node unexcluded
  # vzdump matches one node name per job, so a list would select nothing. A job
  # with no node also covers the backup node's own guests, which would then be
  # backed up onto the same host that holds them. A job on the backup node is
  # accepted only when it excludes the PBS guest by name.
  ansible.builtin.assert:
    that:
      - item.node | default('') | length > 0
      - item.node | default('') | regex_search(',') is none
      - >-
        item.node | default('') != pve_backup_jobs_pbs_node
        or (pve_backup_jobs_pbs_guest_name | length > 0
            and pve_backup_jobs_pbs_guest_name in (item.exclude_names | default([], true)))
    fail_msg: >-
      Backup job '{{ item.id | default('<no id>') }}' must set node to exactly one
      node name, and that node must not be pve_backup_jobs_pbs_node unless the
      job excludes the PBS guest by name.
    quiet: true
  loop: "{{ pve_backup_jobs_jobs }}"
  loop_control:
    label: "{{ item.id | default('<no id>') }}"
  when: pve_backup_jobs_jobs | length > 0
  tags:
    - pve_backup_jobs
