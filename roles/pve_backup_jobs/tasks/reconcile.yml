---
# Reconcile the live vzdump job set against the declaration. Split from main.yml
# so it can be driven against a stubbed `pvesh` without a cluster
# (tests/pve_backup_jobs/verify_reconcile.yml) — the command lines below only
# ever run on a live cluster otherwise, which is the worst place to discover a
# rendering error.

- name: Read the current backup job set
  ansible.builtin.command: pvesh get /cluster/backup --output-format json
  register: pve_backup_jobs_current
  changed_when: false
  # Read-only; a check run needs current backup jobs to preview reconciliation.
  check_mode: false

- name: Index the current vzdump jobs by id
  ansible.builtin.set_fact:
    pve_backup_jobs_observed: >-
      {{ (pve_backup_jobs_current.stdout | from_json)
         | selectattr('type', 'defined') | selectattr('type', 'eq', 'vzdump') | list }}

- name: Reconcile each declared backup job
  # One command covers create and update: the option set is identical, only
  # the verb and the path differ. `--delete vmid` clears a guest-id selector
  # when switching to pool/all; `--delete pool` and `--delete all` clear the
  # previous selector when switching to names. `--delete node` clears a node
  # pin the declaration no longer carries.
  ansible.builtin.command:
    argv: >-
      {{
        ['pvesh',
         (pve_backup_jobs_existing | length > 0) | ternary('set', 'create'),
         (pve_backup_jobs_existing | length > 0)
           | ternary('/cluster/backup/' ~ item.id, '/cluster/backup')]
        + ((pve_backup_jobs_existing | length > 0) | ternary([], ['--id', item.id]))
        + ((item.names is defined)
           | ternary(
               ['--vmid', pve_backup_jobs_desired.vmid | map('string') | join(',')],
               pve_backup_jobs_desired.all
               | ternary(['--all', '1'], ['--pool', pve_backup_jobs_desired.pool])
             ))
        + ['--storage', item.storage,
           '--schedule', item.schedule,
           '--enabled', pve_backup_jobs_desired.enabled,
           '--mode', pve_backup_jobs_desired.mode,
           '--compress', pve_backup_jobs_desired.compress,
           '--comment', pve_backup_jobs_desired.comment,
           '--prune-backups', item.prune | default(pve_backup_jobs_default_prune)]
        + (((pve_backup_jobs_desired.exclude | length) > 0)
           | ternary(
               ['--exclude', pve_backup_jobs_desired.exclude | map('string') | join(',')],
               []
             ))
        + (((pve_backup_jobs_desired.node | length) > 0)
           | ternary(['--node', pve_backup_jobs_desired.node], []))
        + (((pve_backup_jobs_clear | length) > 0)
           | ternary(['--delete', pve_backup_jobs_clear | join(',')], []))
      }}
  vars:
    pve_backup_jobs_existing: >-
      {{ pve_backup_jobs_observed | selectattr('id', 'eq', item.id) | list }}
    pve_backup_jobs_found: "{{ (pve_backup_jobs_existing | first) | default({}, true) }}"
    pve_backup_jobs_desired:
      pool: "{{ item.pool | default('') }}"
      all: "{{ item.all | default(false) | bool }}"
      node: "{{ item.node | default('') }}"
      storage: "{{ item.storage }}"
      schedule: "{{ item.schedule }}"
      enabled: "{{ (item.enabled | default(false) | bool) | ternary('1', '0') }}"
      mode: "{{ item.mode | default(pve_backup_jobs_default_mode) }}"
      compress: "{{ item.compress | default(pve_backup_jobs_default_compress) }}"
      comment: "{{ item.comment | default('') }}"
      vmid: >-
        {{ item.names | default([])
           | map('extract', pve_backup_jobs_tofu_guest_map)
           | map(attribute='vmid') | map('int') | unique | list | sort }}
      exclude: >-
        {{ item.exclude_names | default([])
           | map('extract', pve_backup_jobs_tofu_guest_map)
           | map(attribute='vmid') | map('int') | unique | list | sort }}
    # PVE can return numeric fields as numbers or strings. Normalize them here
    # (and below for retention/exclude lists) so JSON representation alone does
    # not cause an update on every converge.
    pve_backup_jobs_actual:
      pool: "{{ pve_backup_jobs_found.pool | default('', true) | string }}"
      all: "{{ pve_backup_jobs_found.all | default(false) | bool }}"
      node: "{{ pve_backup_jobs_found.node | default('', true) | string }}"
      storage: "{{ pve_backup_jobs_found.storage | default('', true) | string }}"
      schedule: "{{ pve_backup_jobs_found.schedule | default('', true) | string }}"
      enabled: "{{ (pve_backup_jobs_found.enabled | default(0, true) | bool) | ternary('1', '0') }}"
      mode: "{{ pve_backup_jobs_found.mode | default('', true) | string }}"
      compress: "{{ pve_backup_jobs_found.compress | default('', true) | string }}"
      comment: "{{ pve_backup_jobs_found.comment | default('', true) | string }}"
      vmid: >-
        {{ pve_backup_jobs_found.vmid | default('', true) | string
           | split(',') | map('trim') | reject('equalto', '')
           | map('int') | unique | list | sort }}
      exclude: >-
        {{ pve_backup_jobs_found.exclude | default('', true) | string
           | split(',') | map('trim') | reject('equalto', '')
           | map('int') | list | sort }}
    # Fields the live job carries that the declaration does not. `--delete`
    # removes them; the API would otherwise keep them and they would keep
    # deciding what runs.
    pve_backup_jobs_clear: >-
      {{ (['vmid'] if (pve_backup_jobs_found.vmid is defined
                       and not (item.names is defined)) else [])
         + (['node'] if (pve_backup_jobs_found.node is defined
                         and (item.node | default('') | length) == 0) else [])
         + (['pool'] if ((pve_backup_jobs_desired.all or (item.names is defined))
                         and (pve_backup_jobs_found.pool | default('') | length > 0)) else [])
         + (['all'] if ((pve_backup_jobs_found.all | default(false) | bool)
                        and not pve_backup_jobs_desired.all) else [])
         + (['exclude'] if (pve_backup_jobs_desired.exclude | length == 0
                            and (pve_backup_jobs_found.exclude | default('', true) | string | length > 0)) else []) }}
    # The API returns retention as a dict and accepts it as a string, so the
    # declared string is parsed rather than the returned dict flattened —
    # one direction, and it fails loudly on a malformed declaration.
    pve_backup_jobs_prune_desired: >-
      {{ dict((item.prune | default(pve_backup_jobs_default_prune)).split(',')
              | map('ansible.builtin.split', '=') | list) }}
    pve_backup_jobs_prune_actual: >-
      {{ dict(
           (pve_backup_jobs_found['prune-backups'] | default({}, true)
            | dict2items | map(attribute='key') | list)
           | zip(
               pve_backup_jobs_found['prune-backups'] | default({}, true)
               | dict2items | map(attribute='value') | map('string') | list
             )
         ) }}
  loop: "{{ pve_backup_jobs_jobs }}"
  loop_control:
    label: "{{ item.id }}"
  when: >-
    pve_backup_jobs_existing | length == 0
    or pve_backup_jobs_desired != pve_backup_jobs_actual
    or pve_backup_jobs_prune_desired != pve_backup_jobs_prune_actual
    or pve_backup_jobs_clear | length > 0
  changed_when: true

- name: Remove backup jobs this role does not declare
  # A job left behind is not neutral. One pinned to a node that has left the
  # cluster, or aimed at a guest id that has since been reused, still reads
  # as coverage on the schedule page while protecting nothing that was meant
  # to be protected.
  ansible.builtin.command:
    argv: ["pvesh", "delete", "/cluster/backup/{{ item.id }}"]
  loop: >-
    {{ pve_backup_jobs_observed
       | rejectattr('id', 'in', pve_backup_jobs_jobs | map(attribute='id') | list) | list }}
  loop_control:
    label: "{{ item.id }}"
  when: pve_backup_jobs_prune_unmanaged | bool
  changed_when: true
