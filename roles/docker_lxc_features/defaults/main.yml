---
# docker_lxc_features role defaults
#
# Root-only LXC feature flags for Docker guests. The BPG Proxmox provider's
# API token cannot set `keyctl` or `fuse` on these shells, so this role
# applies the host-side `pct set --features` step after create.
#
# Selection rule: every container whose tofu inventory tags include `docker`
# gets these features — the same rule playbooks/site/01a-docker-daemon.yml
# uses to pin the fuse-overlayfs storage driver, so every Docker LXC gets
# both the daemon config and the kernel features it needs.

docker_lxc_features_desired_tokens:
  - nesting=1
  - keyctl=1
  - fuse=1

docker_lxc_features_desired_features: "{{ docker_lxc_features_desired_tokens | join(',') }}"
