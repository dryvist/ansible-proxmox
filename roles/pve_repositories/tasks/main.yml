---
# pve_repositories role tasks — keep the Proxmox apt repositories on the
# no-subscription channel using the deb822 .sources format (PVE 9 default),
# idempotently. Each Proxmox repo is its own .sources file, so this manages them
# individually via ansible.builtin.deb822_repository and leaves the Debian base
# repositories (debian.sources) untouched.

- name: Ensure the PVE no-subscription repository is enabled
  ansible.builtin.deb822_repository:
    name: proxmox
    types: deb
    uris: http://download.proxmox.com/debian/pve
    suites: "{{ ansible_distribution_release }}"
    components: pve-no-subscription
    signed_by: "{{ pve_repositories_keyring }}"
    enabled: true
    state: present
  when: pve_repositories_manage | bool
  tags:
    - pve_repositories
    - repositories

- name: Ensure the Ceph no-subscription repository is enabled
  ansible.builtin.deb822_repository:
    name: ceph
    types: deb
    uris: "http://download.proxmox.com/debian/ceph-{{ pve_repositories_ceph_release }}"
    suites: "{{ ansible_distribution_release }}"
    components: no-subscription
    signed_by: "{{ pve_repositories_keyring }}"
    enabled: true
    state: present
  when: pve_repositories_manage | bool
  tags:
    - pve_repositories
    - repositories

- name: Ensure the PVE enterprise repository is present but disabled
  ansible.builtin.deb822_repository:
    name: pve-enterprise
    types: deb
    uris: https://enterprise.proxmox.com/debian/pve
    suites: "{{ ansible_distribution_release }}"
    components: pve-enterprise
    signed_by: "{{ pve_repositories_keyring }}"
    enabled: false
    state: present
  when: pve_repositories_manage | bool
  tags:
    - pve_repositories
    - repositories

# apt accepts exactly ONE Acquire::http::Proxy value, so a caching pair cannot be
# expressed as config at all — a second line replaces the first rather than
# adding a fallback. Proxy-Auto-Detect is apt's own hook for this: it runs a
# script per fetch and uses whatever the script prints, or no proxy at all when
# the script prints DIRECT. So a dead cache degrades to a direct fetch instead of
# failing every apt call on the node, which the old single hardcoded URL did.
- name: Install the apt caching-proxy auto-detect hook
  ansible.builtin.copy:
    dest: /usr/local/bin/apt-proxy-detect
    content: |
      #!/bin/bash
      # Ansible managed - pve_repositories role
      # Print the first reachable caching proxy, else DIRECT (no proxy).
      for url in {{ pve_repositories_apt_proxies | map('quote') | join(' ') }}; do
        hostport=${url#*://}; hostport=${hostport%%/*}
        host=${hostport%%:*}; port=${hostport##*:}
        [ "$port" = "$host" ] && port={{ pve_repositories_apt_proxy_default_port }}
        if timeout 2 bash -c "exec 3<>/dev/tcp/${host}/${port}" 2>/dev/null; then
          echo "$url"
          exit 0
        fi
      done
      echo DIRECT
    owner: root
    group: root
    mode: "0755"
  when:
    - pve_repositories_manage | bool
    - pve_repositories_apt_proxies | length > 0
  tags:
    - pve_repositories
    - repositories

- name: Configure apt to use the caching proxy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/00acng-proxy
    content: |
      // Ansible managed - pve_repositories role
      // Route apt http:// fetches through the caching proxy (apt-cacher-ng).
      Acquire::http::Proxy-Auto-Detect "/usr/local/bin/apt-proxy-detect";
    owner: root
    group: root
    mode: "0644"
  when:
    - pve_repositories_manage | bool
    - pve_repositories_apt_proxies | length > 0
  tags:
    - pve_repositories
    - repositories

- name: Remove the apt caching proxy config and hook when unset
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/apt.conf.d/00acng-proxy
    - /usr/local/bin/apt-proxy-detect
  when:
    - pve_repositories_manage | bool
    - pve_repositories_apt_proxies | length == 0
  tags:
    - pve_repositories
    - repositories

# Ensure the configured LXC (CT) templates are present on `local` storage so a
# freshly commissioned node can have containers created by OpenTofu without a
# manual `pveam download`. Gated on the same master switch as the repos above.
- name: Ensure the configured CT templates are present
  ansible.builtin.include_tasks: ct_templates.yml
  when:
    - pve_repositories_manage | bool
    # Nothing to ensure when the tofu inventory was not loaded (see the default).
    # Skipping here avoids a pointless `pveam list` on every such run.
    - pve_repositories_ct_templates | length > 0
  tags:
    - pve_repositories
    - ct_templates
