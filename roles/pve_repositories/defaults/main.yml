---
# pve_repositories role defaults

# Master switch. Set false to leave the node's apt repositories untouched.
pve_repositories_manage: true

# Ceph repo channel codename used in the no-subscription Ceph repository URI.
pve_repositories_ceph_release: squid

# Keyring that signs the Proxmox repositories (PVE 9 / Debian 13 default).
pve_repositories_keyring: /usr/share/keyrings/proxmox-archive-keyring.gpg

# Optional apt caching proxies (e.g. apt-cacher-ng) for HTTP repositories. Empty
# disables proxying. When set, apt routes http:// fetches through the first
# reachable entry, which caches packages and reaches upstream mirrors more
# reliably than each node does. Real values are injected per environment (see
# group_vars), never hardcoded here.
#
# A LIST, because the cache is an HA pair: apt accepts exactly one
# `Acquire::http::Proxy` value, so expressing a pair needs the
# `Acquire::http::Proxy-Auto-Detect` hook (tasks/main.yml) rather than more
# config lines. A single-entry list still works and gains a real benefit over
# the old scalar: an unreachable sole cache now falls back to DIRECT instead of
# failing every apt call on the node.
pve_repositories_apt_proxies: []

# Port assumed when an entry above carries no explicit `:port`. Sourced from the
# published tofu constants when this play loaded them, with a literal fallback
# for the plays that do not (same pattern as pve_syslog_forwarder).
pve_repositories_apt_proxy_default_port: >-
  {{ (hostvars['localhost']['tofu_data']['constants']['service_ports']['apt_cacher_ng'] | default(3142))
     if (hostvars['localhost']['tofu_data'] is defined) else 3142 }}

# LXC (CT) appliance templates to ensure on `local` storage. OpenTofu creates
# containers from `local:vztmpl/<template>`, so every node must have these
# present or container creation fails on a fresh node. Each is downloaded only
# when missing (see tasks/ct_templates.yml).
#
# Derived from the published tofu inventory (`ct_template`), injected by
# playbooks/load_tofu.yml. deployment.json is the single place the base image is
# named; this used to restate the filename here with a comment asking whoever
# bumped it to edit both repos, and the two had already drifted.
#
# Empty when the inventory was not loaded (playbooks/upgrade.yml deliberately
# skips it) or predates the key. Empty means ensure nothing — a hardcoded guess
# would be exactly the drift this replaces, and an OS upgrade has no reason to
# fetch templates. Override explicitly to pin extra templates on a node.
pve_repositories_ct_templates: >-
  {{ [ct_template_from_tofu] if (ct_template_from_tofu | default('') | length > 0) else [] }}
