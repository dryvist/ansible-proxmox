---
# Wires a specific ZFS fault signature (checksum error, long I/O delay, zed
# queue overflow) directly to a Zammad ticket. See defaults/main.yml and the
# templates for why: pve_health_telemetry's journal->syslog pipe is the
# general-purpose path, and this role deliberately bypasses it for one
# narrow, already-proven-real trigger, because a log nobody reads is not a
# control (Zammad #17242 -- the pipe this would otherwise rely on has its
# own known reliability gap).
- name: Wire the ZFS fault alert
  when: zfs_fault_alert_enabled | bool
  tags:
    - zfs_fault_alert
  block:
    - name: Assert the OpenBao read credentials were passed as extra vars
      ansible.builtin.assert:
        that:
          - zfs_fault_alert_openbao_addr | length > 0
          - zfs_fault_alert_openbao_token | length > 0
          - zfs_fault_alert_zammad_customer | length > 0
        fail_msg: >-
          zfs_fault_alert is enabled but zfs_fault_alert_openbao_addr /
          zfs_fault_alert_openbao_token / zfs_fault_alert_zammad_customer
          were not passed as extra vars. These are never committed -- pass
          them at converge time the same way roles/zammad/tasks/publish_mcp.yml
          does.

    - name: Read the shared Zammad token from OpenBao
      ansible.builtin.uri:
        url: >-
          {{ zfs_fault_alert_openbao_addr }}/v1/{{ zfs_fault_alert_openbao_mount }}/data/{{ zfs_fault_alert_openbao_path }}
        headers:
          X-Vault-Token: "{{ zfs_fault_alert_openbao_token }}"
        return_content: true
      register: zfs_fault_alert_bao_read
      no_log: true

    - name: Extract the token
      ansible.builtin.set_fact:
        zfs_fault_alert_zammad_token: >-
          {{ (zfs_fault_alert_bao_read.json.data.data[zfs_fault_alert_openbao_key])
             | mandatory('OpenBao key ' ~ zfs_fault_alert_openbao_key ~ ' not found at '
                         ~ zfs_fault_alert_openbao_path) }}
      no_log: true

    # The Zammad base URL is internal topology and is never committed as a
    # literal (same reason hermes_agent_zammad_url defaults to ""). Read the
    # same published secret the Hermes agent already reads
    # (secret/ai/mcp/zammad -> ZAMMAD_MCP_URL) rather than requiring a
    # second manually-typed extra var for the same fact.
    - name: Read the published Zammad URL from OpenBao
      ansible.builtin.uri:
        url: "{{ zfs_fault_alert_openbao_addr }}/v1/secret/data/ai/mcp/zammad"
        headers:
          X-Vault-Token: "{{ zfs_fault_alert_openbao_token }}"
        return_content: true
      register: zfs_fault_alert_bao_url_read
      no_log: true
      when: zfs_fault_alert_zammad_url | length == 0

    - name: Set the resolved Zammad URL
      ansible.builtin.set_fact:
        zfs_fault_alert_zammad_url: >-
          {{ (zfs_fault_alert_bao_url_read.json.data.data.ZAMMAD_MCP_URL
              | regex_replace('/api/v1/?$', ''))
             | mandatory('secret/ai/mcp/zammad has no ZAMMAD_MCP_URL -- Zammad may not be deployed yet') }}
      when: zfs_fault_alert_zammad_url | length == 0
      no_log: true

    - name: Create the token directory
      ansible.builtin.file:
        path: /etc/zfs-fault-alert
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write the Zammad token (root-only, never logged)
      ansible.builtin.copy:
        content: "{{ zfs_fault_alert_zammad_token }}"
        dest: /etc/zfs-fault-alert/zammad-token
        owner: root
        group: root
        mode: "0600"
      no_log: true

    # jq builds the ticket payload in zfs-fault-alert.sh. Without it the
    # converge self-check still passes (it only calls curl) while a real
    # firing dies mid-payload -- an alert path that looks armed and is not.
    - name: Install jq (required to build the Zammad ticket payload)
      ansible.builtin.package:
        name: jq
        state: present

    - name: Deploy the shared alert script
      ansible.builtin.template:
        src: zfs-fault-alert.sh.j2
        dest: /usr/local/bin/zfs-fault-alert.sh
        owner: root
        group: root
        mode: "0755"

    # zed only runs a zedlet whose FILENAME begins with the event class, the
    # subclass, or "all", followed by a non-alphabetic character
    # (zed_exec_process in zed_exec.c). A name like zfs-fault-watch.sh matches
    # nothing and is never invoked, so the watcher is installed once per
    # subclass it handles rather than under a single neutral name.
    - name: Deploy the zed dispatch watcher under each subclass it handles
      ansible.builtin.template:
        src: zfs-fault-watch.sh.j2
        dest: "/etc/zfs/zed.d/{{ item }}-zfs-fault-watch.sh"
        owner: root
        group: root
        mode: "0755"
      loop: "{{ zfs_fault_alert_zed_subclasses }}"
      notify: Restart zed to pick up the new zed.d script

    - name: Deploy the missed-events poller script
      ansible.builtin.template:
        src: zfs-missed-events-check.sh.j2
        dest: /usr/local/bin/zfs-missed-events-check.sh
        owner: root
        group: root
        mode: "0755"

    - name: Create the poller's state directory
      ansible.builtin.file:
        path: /var/lib/zfs-fault-alert
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Seed the missed-events cursor to now (never replay history on first deploy)
      # --cursor-file requires systemd >= 254; PVE 8.x (Bookworm) ships 252,
      # so seed by parsing --show-cursor instead -- works on every version.
      ansible.builtin.shell:
        cmd: "set -o pipefail && journalctl -u zfs-zed -n0 --show-cursor | sed -n 's/^-- cursor: //p' > /var/lib/zfs-fault-alert/missed-events.cursor"
        executable: /bin/bash
        creates: /var/lib/zfs-fault-alert/missed-events.cursor
      changed_when: true

    - name: Deploy the missed-events poller unit + timer
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - zfs-missed-events-check.service
        - zfs-missed-events-check.timer
      notify: Reload systemd for zfs_fault_alert

    - name: Flush handlers so units are current before enabling
      ansible.builtin.meta: flush_handlers

    - name: Prove the alert path is actually live -- reaches Zammad with the deployed token
      # Enabling the timer and dropping the zed.d script prove nothing about
      # whether either can actually reach Zammad. --self-check validates the
      # token and connectivity without filing a ticket. A converge that
      # leaves this broken but "deployed" is worse than no alert at all --
      # the operator would believe a trigger exists that does not fire.
      ansible.builtin.command: /usr/local/bin/zfs-fault-alert.sh --self-check
      register: zfs_fault_alert_self_check
      changed_when: false
      failed_when: zfs_fault_alert_self_check.rc != 0

    - name: Report the self-check result
      ansible.builtin.debug:
        var: zfs_fault_alert_self_check.stdout

# Opting a host out has to actually disarm it. Without this, disabling the role
# only skips the block above: the zedlets and the deployed Zammad token stay on
# disk and keep filing tickets on every checksum/delay event forever.
- name: Disarm the ZFS fault alert on a host that has opted out
  when: not (zfs_fault_alert_enabled | bool)
  tags:
    - zfs_fault_alert
  block:
    - name: Remove the zed dispatch watchers, scripts, units and token
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ zfs_fault_alert_zed_subclasses
           | map('regex_replace', '^(.*)$', '/etc/zfs/zed.d/\\1-zfs-fault-watch.sh')
           | list
           + ['/usr/local/bin/zfs-fault-alert.sh',
              '/usr/local/bin/zfs-missed-events-check.sh',
              '/etc/systemd/system/zfs-missed-events-check.service',
              '/etc/systemd/system/zfs-missed-events-check.timer',
              '/etc/zfs-fault-alert'] }}
      notify:
        - Restart zed to pick up the new zed.d script
        - Reload systemd for zfs_fault_alert

# Runs unconditionally (outside both blocks) so turning zfs_fault_alert_enabled
# off actually stops/disables the timer rather than leaving it running with no
# owner. failed_when: false tolerates the unit never having been rendered (a host
# that was never enabled has nothing to stop).
- name: Set the missed-events timer state to match zfs_fault_alert_enabled
  ansible.builtin.systemd:
    name: zfs-missed-events-check.timer
    state: "{{ 'started' if (zfs_fault_alert_enabled | bool) else 'stopped' }}"
    enabled: "{{ zfs_fault_alert_enabled | bool }}"
  failed_when: false
  tags:
    - zfs_fault_alert
