---
# Disabled everywhere by default; a host opts in via host_vars, same pattern
# as wol_enable_enabled / nvidia_driver_enabled.
zfs_fault_alert_enabled: false

# zed dispatches a zedlet only when its filename starts with the event class,
# the subclass, or "all", followed by a non-alphabetic character. The watcher
# is therefore installed once per subclass it handles; adding a subclass here
# also requires a matching arm in templates/zfs-fault-watch.sh.j2.
zfs_fault_alert_zed_subclasses:
  - checksum
  - delay

# Which pool this host's zed dispatch watches. Deliberately per-host, not
# estate-wide -- see the role README for why this does not duplicate
# pve_health_telemetry's "zpool degradation -> ZED, already journal -> syslog"
# design note.
zfs_fault_alert_pool: rpool

# Any zed class=delay event at or above this many milliseconds fires an
# alert. The observed fault signature on pve-w5900 (Zammad #17242) starts at
# ~70000ms; 30000 gives margin above normal load without false-firing.
zfs_fault_alert_delay_threshold_ms: 30000

# How often the companion timer checks zed's own journal for a
# "Missed events" line (queue overflow -- zed dropped events, meaning this
# whole mechanism went blind for that window). This already happened once
# during one of the three real fault bursts this role exists to catch.
zfs_fault_alert_missed_events_check_interval: 2min

# Publishes to the homelab ntfy alert hub (topic "hardware"), which fans out
# to Slack and Zammad on its own -- this role no longer talks to Zammad
# directly. Sized off PROXMOX_SUBDOMAIN, same pattern as
# pve_syslog_forwarder_target_host / idrac_kiosk_kvm_host: fronted services
# are only published under the ingress subdomain, never the estate apex
# (domain_from_tofu).
zfs_fault_alert_ntfy_url: "https://ntfy.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/hardware"

# Optional hub publish-token. Empty by default (auth is not enforced on the
# hub yet); when set, the alert script sends it as a Bearer token.
zfs_fault_alert_ntfy_token: ""
