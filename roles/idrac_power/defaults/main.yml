---
# idrac_power — power-control a rack server's BMC over IPMI (lanplus), used to
# bring a normally-powered-off node (an offline-DR leg) up at the start of a
# site.yml run and shut it down gracefully at the end.
#
# The ipmitool calls run on a CONTROLLER node that can reach the BMC subnet
# (NETWORK_CIDR_BMC) — the target node itself may be powered off, so the power
# op is delegated to the controller and never SSHes to the target. Idempotent:
# queries `chassis power status` first and only acts on a state mismatch.

idrac_power_enabled: true

# Master switch for the site.yml auto-cycle (power on at start, off at end).
# Set -e idrac_power_autocycle=false for quick always-on-only runs (then also
# --limit to exclude the powered-off node).
idrac_power_autocycle: true

# Action for this invocation: "status" (default, no-op), "on", or "off".
# site.yml sets this per power play.
idrac_power_action: status

# Node that runs ipmitool (must reach the BMC subnet, be always-on, and NOT be
# the target being powered). Derived — never hard-coded — from the shared
# PROXMOX_VE_NODES Doppler list (same source of truth as cluster_ssh_trust):
# the first cluster node that is not this target. The list holds Proxmox NODE
# names, which need not equal the Ansible inventory key, so the target is
# excluded under BOTH identities — either one may appear in the list, and
# missing the match would let the node being powered run ipmitool against
# itself. Falls back to the target itself when the list is empty (e.g.
# molecule), which is fine for `status`.
# Override per-host/group if a specific controller is required.
idrac_power_controller: >-
  {{
    ((lookup('env', 'PROXMOX_VE_NODES') | default('', true)
       | regex_findall('[A-Za-z0-9][A-Za-z0-9._-]*')
       | reject('equalto', inventory_hostname)
       | reject('equalto', proxmox_node_name | default(inventory_hostname))
       | list)
     or [inventory_hostname]) | first
  }}

# Seconds to wait for the target's SSH after power-on, and the poll budget
# (x10s, so 60 => 10 min) to confirm a graceful power-off completed. Old rack
# hardware (e.g. a Dell R710) can take ~10 minutes to POST and boot, so these
# default generously; tune per host if your hardware is faster/slower.
idrac_power_boot_timeout: 720
idrac_power_off_retries: 60

# BMC credentials — injected from the environment (Doppler), never committed.
idrac_power_username: "{{ lookup('env', 'IDRAC_USERNAME') }}"
idrac_power_password: "{{ lookup('env', 'IDRAC_PASSWORD') }}"

# Per-host BMC address (ipmitool -H). FQDN preferred over an IP — a hostname
# insulates this from BMC re-addressing (the golden rule). Set in host_vars/<node>
# .yml from the environment (Doppler) / SOPS; never committed, no safe default.
# idrac_power_bmc_host: "node-idrac.<subdomain>"

# What the chassis does when AC returns after a power loss (IPMI "Power
# Restore Policy", the same firmware setting a Dell PowerEdge BIOS calls "AC
# Power Recovery"):
#
#   always-on   power up unconditionally
#   previous    restore whatever state the chassis was in when AC was lost
#   always-off  stay off until told otherwise
#
# `always-on` is the default here because the alternatives make an unattended
# return of AC conditional: `previous` leaves a node that was deliberately
# powered down still down, and — where the firmware records the state at the
# moment of loss rather than the last commanded one — can leave a node that
# was running down as well. A node nobody is present to press a button on
# needs the unconditional setting.
#
# Set via IPMI rather than a vendor BIOS tool: `ipmitool chassis policy` is
# applied by the BMC immediately with no staged BIOS job and no reboot, works
# across vendors and BMC generations, and reuses the credentials and
# controller delegation this role already has.
#
# Set to "" to leave the policy alone (e.g. a node that must stay off until an
# operator decides otherwise).
idrac_power_restore_policy: always-on
