---
# idrac_power tasks — query/set a target node's chassis power via ipmitool.
# All ipmitool calls are delegated to idrac_power_controller (which can reach
# the BMC subnet); the target node may be powered off. Skipped under Docker
# (molecule) and when disabled or no BMC IP is set.

- name: Ensure ipmitool is installed on the controller
  ansible.builtin.apt:
    name: ipmitool
    state: present
    update_cache: true
  delegate_to: "{{ idrac_power_controller }}"
  when:
    - idrac_power_enabled | bool
    - idrac_power_bmc_host | default('') | length > 0
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - idrac_power

- name: Query current chassis power status
  ansible.builtin.command:
    cmd: >-
      ipmitool -I lanplus -H {{ idrac_power_bmc_host }}
      -U {{ idrac_power_username }} -P {{ idrac_power_password }}
      chassis power status
  delegate_to: "{{ idrac_power_controller }}"
  register: idrac_power_status
  changed_when: false
  no_log: true
  when:
    - idrac_power_enabled | bool
    - idrac_power_bmc_host | default('') | length > 0
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - idrac_power

# ipmitool prints "Chassis Power is on" / "Chassis Power is off".
- name: Power on the target (only if currently off)
  ansible.builtin.command:
    cmd: >-
      ipmitool -I lanplus -H {{ idrac_power_bmc_host }}
      -U {{ idrac_power_username }} -P {{ idrac_power_password }}
      chassis power on
  delegate_to: "{{ idrac_power_controller }}"
  changed_when: true
  no_log: true
  when:
    - idrac_power_enabled | bool
    - idrac_power_bmc_host | default('') | length > 0
    - ansible_virtualization_type | default('') != 'docker'
    - idrac_power_action == 'on'
    - "'is on' not in (idrac_power_status.stdout | default(''))"
  tags:
    - idrac_power

- name: Wait for the target to become reachable over SSH
  ansible.builtin.wait_for_connection:
    timeout: "{{ idrac_power_boot_timeout | int }}"
  when:
    - idrac_power_enabled | bool
    - idrac_power_bmc_host | default('') | length > 0
    - ansible_virtualization_type | default('') != 'docker'
    - idrac_power_action == 'on'
  tags:
    - idrac_power

- name: Power off the target gracefully (ACPI soft, only if currently on)
  ansible.builtin.command:
    cmd: >-
      ipmitool -I lanplus -H {{ idrac_power_bmc_host }}
      -U {{ idrac_power_username }} -P {{ idrac_power_password }}
      chassis power soft
  delegate_to: "{{ idrac_power_controller }}"
  changed_when: true
  no_log: true
  when:
    - idrac_power_enabled | bool
    - idrac_power_bmc_host | default('') | length > 0
    - ansible_virtualization_type | default('') != 'docker'
    - idrac_power_action == 'off'
    - "'is off' not in (idrac_power_status.stdout | default(''))"
  tags:
    - idrac_power

- name: Wait for the graceful power-off to complete
  ansible.builtin.command:
    cmd: >-
      ipmitool -I lanplus -H {{ idrac_power_bmc_host }}
      -U {{ idrac_power_username }} -P {{ idrac_power_password }}
      chassis power status
  delegate_to: "{{ idrac_power_controller }}"
  register: idrac_power_off_check
  until: "'is off' in (idrac_power_off_check.stdout | default(''))"
  retries: "{{ idrac_power_off_retries | int }}"
  delay: 10
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - idrac_power_enabled | bool
    - idrac_power_bmc_host | default('') | length > 0
    - ansible_virtualization_type | default('') != 'docker'
    - idrac_power_action == 'off'
  tags:
    - idrac_power

# The power-restore policy is a property of the chassis, not of this
# invocation, so it is reconciled on every run regardless of
# idrac_power_action — including plain `status` runs, which is how a node that
# is never power-cycled by this role still gets the setting.
- name: Query the chassis power restore policy
  ansible.builtin.command:
    cmd: >-
      ipmitool -I lanplus -H {{ idrac_power_bmc_host }}
      -U {{ idrac_power_username }} -P {{ idrac_power_password }}
      chassis status
  delegate_to: "{{ idrac_power_controller }}"
  register: idrac_power_chassis_status
  changed_when: false
  no_log: true
  when:
    - idrac_power_enabled | bool
    - idrac_power_bmc_host | default('') | length > 0
    - idrac_power_restore_policy | default('') | length > 0
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - idrac_power

# `chassis status` prints e.g. "Power Restore Policy : always-on"; the spacing
# around the colon varies by BMC generation, hence the regex rather than a
# substring match. The whole line is matched and then split on the colon
# rather than captured with a group: a policy value carries no colon of its
# own, and this form reads the same wherever it is evaluated.
- name: Set the chassis power restore policy
  ansible.builtin.command:
    cmd: >-
      ipmitool -I lanplus -H {{ idrac_power_bmc_host }}
      -U {{ idrac_power_username }} -P {{ idrac_power_password }}
      chassis policy {{ idrac_power_restore_policy }}
  delegate_to: "{{ idrac_power_controller }}"
  changed_when: true
  no_log: true
  when:
    - idrac_power_enabled | bool
    - idrac_power_bmc_host | default('') | length > 0
    - idrac_power_restore_policy | default('') | length > 0
    - ansible_virtualization_type | default('') != 'docker'
    - idrac_power_restore_policy != idrac_power_current_policy
  vars:
    idrac_power_current_policy: >-
      {{ (idrac_power_chassis_status.stdout | default('', true)
          | regex_search('Power Restore Policy\s*:\s*\S+') | default('', true))
         .split(':') | last | trim }}
  tags:
    - idrac_power
