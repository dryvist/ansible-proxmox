---
# Part 4 of 7 (see main.yml). Confirms no ZFS snapshots or pending frees
# on either node, and that every required dataset is mounted with enough
# free target capacity for the copy.
- name: Read source and target snapshot inventories
  ansible.builtin.command:
    argv: [zfs, list, -H, -t, snapshot, -o, name]
  changed_when: false
  register: pve_frozen_host_bind_copy_source_snapshots

- name: Read target snapshot inventory
  ansible.builtin.command:
    argv: [zfs, list, -H, -t, snapshot, -o, name]
  delegate_to: "{{ pve_frozen_host_bind_copy_target_inventory_host }}"
  changed_when: false
  register: pve_frozen_host_bind_copy_target_snapshots

- name: Read source and target pool freeing state
  ansible.builtin.command:
    argv: [zpool, get, -H, -p, -o, value, freeing, "{{ item.pool }}"]
  changed_when: false
  loop:
    - { side: source, pool: "{{ pve_frozen_host_bind_copy_source_pool }}" }
    - { side: target, pool: "{{ pve_frozen_host_bind_copy_target_pool }}" }
  delegate_to: "{{ pve_frozen_host_bind_copy_target_inventory_host if item.side == 'target' else inventory_hostname }}"
  register: pve_frozen_host_bind_copy_freeing

- name: Require zero snapshots and no pending ZFS frees
  ansible.builtin.assert:
    that:
      - pve_frozen_host_bind_copy_source_snapshots.stdout | trim | length == 0
      - pve_frozen_host_bind_copy_target_snapshots.stdout | trim | length == 0
      - (pve_frozen_host_bind_copy_freeing.results | map(attribute='stdout') | map('trim') | map('int') | sum) == 0
    fail_msg: "Snapshots or pending ZFS frees exist; frozen copy is forbidden."

- name: Read source and target dataset mounted state
  ansible.builtin.command:
    argv: [zfs, get, -H, -o, value, mounted, "{{ item.dataset }}"]
  changed_when: false
  loop: "{{ pve_frozen_host_bind_copy_dataset_checks }}"
  delegate_to: >-
    {{ pve_frozen_host_bind_copy_target_inventory_host
       if item.side == 'target' else inventory_hostname }}
  register: pve_frozen_host_bind_copy_dataset_mounted

- name: Read source and target dataset mountpoints
  ansible.builtin.command:
    argv: [zfs, get, -H, -o, value, mountpoint, "{{ item.dataset }}"]
  changed_when: false
  loop: "{{ pve_frozen_host_bind_copy_dataset_checks }}"
  delegate_to: >-
    {{ pve_frozen_host_bind_copy_target_inventory_host
       if item.side == 'target' else inventory_hostname }}
  register: pve_frozen_host_bind_copy_dataset_mountpoints

- name: Assert all required datasets are mounted
  ansible.builtin.assert:
    that:
      - item.stdout | trim == 'yes'
      - >-
        (pve_frozen_host_bind_copy_dataset_mountpoints.results
        | selectattr('item.side', 'equalto', item.item.side)
        | selectattr('item.dataset', 'equalto', item.item.dataset)
        | map(attribute='stdout') | map('trim') | first)
        == item.item.mountpoint
    fail_msg: >-
      Required {{ item.item.side }} dataset {{ item.item.dataset }} is not
      active at its approved host path.
  loop: "{{ pve_frozen_host_bind_copy_dataset_mounted.results }}"

- name: Read source dataset usage
  ansible.builtin.command:
    argv: [zfs, get, -H, -p, -o, value, used, "{{ item.source_dataset }}"]
  changed_when: false
  loop: "{{ pve_frozen_host_bind_copy_dataset_mappings }}"
  register: pve_frozen_host_bind_copy_source_used

- name: Read target dataset available capacity
  ansible.builtin.command:
    argv: [zfs, get, -H, -p, -o, value, available, "{{ item.target_dataset }}"]
  delegate_to: "{{ pve_frozen_host_bind_copy_target_inventory_host }}"
  changed_when: false
  loop: "{{ pve_frozen_host_bind_copy_dataset_mappings }}"
  register: pve_frozen_host_bind_copy_target_available

- name: Require enough already-active target dataset capacity
  ansible.builtin.assert:
    that:
      - >-
        ((pve_frozen_host_bind_copy_target_available.results
        | selectattr('item.target_dataset', 'equalto', item.target_dataset)
        | map(attribute='stdout') | map('trim') | map('int') | first)
        >=
        ((pve_frozen_host_bind_copy_source_used.results
        | selectattr('item.source_dataset', 'equalto', item.source_dataset)
        | map(attribute='stdout') | map('trim') | map('int') | first)
        + (pve_frozen_host_bind_copy_capacity_margin_bytes | int)))
    fail_msg: >-
      Target dataset {{ item.target_dataset }} has insufficient free
      capacity for {{ item.source_dataset }} plus the required margin.
  loop: "{{ pve_frozen_host_bind_copy_dataset_mappings }}"
