---
# The phases below are ORDER-DEPENDENT and the order is the safety property,
# not a style choice: every check must pass before the next phase runs, and
# no data moves until every check across parts 1-5 has passed. Do not reorder
# these includes.
- name: Run the frozen host-bind copy only when explicitly enabled
  when: pve_frozen_host_bind_copy_enabled | bool
  block:
    - name: Identity, six-container contract, and transport-file assertions
      ansible.builtin.include_tasks: preflight.yml

    - name: SSH transport verification and rsync input derivation
      ansible.builtin.include_tasks: transport.yml

    - name: Approved-container stopped state and bind/device/TUN contract
      ansible.builtin.include_tasks: containers.yml

    - name: ZFS snapshot, freeing, mount, and capacity checks
      ansible.builtin.include_tasks: storage.yml

    - name: Source and target directory state checks
      ansible.builtin.include_tasks: paths.yml

    - name: Immutable pve3 evidence run directory and pre-copy gate
      ansible.builtin.include_tasks: evidence_gate.yml

    - name: Copy, verify, and record the frozen host-bind transfer
      ansible.builtin.include_tasks: transfer.yml
