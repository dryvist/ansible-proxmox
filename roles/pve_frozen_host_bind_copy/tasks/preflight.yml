---
# Included from main.yml's block, in ORDER: identity/contract/transport-file
# assertions must pass before anything below touches SSH, ZFS, or pct.
# Part 1 of 7 — see main.yml for the full sequence and why order matters.
- name: Require the fixed Issue 816 host identities and evidence run identifier
  ansible.builtin.assert:
    that:
      - inventory_hostname == 'pve2'
      - pve_frozen_host_bind_copy_source_inventory_host == 'pve2'
      - pve_frozen_host_bind_copy_target_inventory_host == 'pve540'
      - pve_frozen_host_bind_copy_evidence_inventory_host == 'pve3'
      - pve_frozen_host_bind_copy_target_inventory_host in hostvars
      - pve_frozen_host_bind_copy_evidence_inventory_host in hostvars
      - pve_frozen_host_bind_copy_evidence_dir is match('^/root/[A-Za-z0-9._/-]+$')
      - pve_frozen_host_bind_copy_run_id is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$')
      - pve_frozen_host_bind_copy_capacity_margin_bytes | int >= 0
    fail_msg: >-
      This frozen copy runs only from pve2 to standalone pve540 and writes
      a new root-only evidence directory on pve3. Its identifiers, run id,
      and capacity margin must be explicit and valid.

- name: Require the frozen six-container and dataset contract
  ansible.builtin.assert:
    that:
      - pve_frozen_host_bind_copy_source_pool == 'bulk'
      - pve_frozen_host_bind_copy_target_pool == 'bulk'
      - >-
        pve_frozen_host_bind_copy_allowed_mounts == {
          '703040': [
            {'source': '/bulk/data', 'target': '/data'},
            {'source': '/bulk/appdata/plex', 'target': '/var/lib/plexmediaserver'}
          ],
          '715240': [
            {'source': '/bulk/data', 'target': '/data'},
            {'source': '/bulk/appdata/sonarr', 'target': '/var/lib/sonarr'}
          ],
          '715340': [
            {'source': '/bulk/data', 'target': '/data'},
            {'source': '/bulk/appdata/radarr', 'target': '/var/lib/radarr'}
          ],
          '725140': [
            {'source': '/bulk/data', 'target': '/data'},
            {'source': '/bulk/appdata/prowlarr', 'target': '/var/lib/prowlarr'}
          ],
          '736030': [
            {'source': '/bulk/appdata/seerr', 'target': '/opt/seerr/config'}
          ],
          '736040': [
            {'source': '/bulk/appdata/sortarr', 'target': '/opt/sortarr/data'}
          ]
        }
      - >-
        pve_frozen_host_bind_copy_dataset_mappings == [
          {
            'source_dataset': 'bulk/data',
            'source_mountpoint': '/bulk/data',
            'target_dataset': 'bulk/data',
            'target_mountpoint': '/bulk/data'
          },
          {
            'source_dataset': 'bulk/appdata',
            'source_mountpoint': '/bulk/appdata',
            'target_dataset': 'bulk/appdata',
            'target_mountpoint': '/bulk/appdata'
          }
        ]
      - >-
        pve_frozen_host_bind_copy_tun_cgroup_line
        == 'lxc.cgroup2.devices.allow: c 10:200 rwm'
      - >-
        pve_frozen_host_bind_copy_tun_mount_line
        == 'lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file'
    fail_msg: >-
      The frozen copy contract differs from the six approved pve2 media
      containers, their exact pve540 paths, or the approved bulk datasets.

- name: Require a bounded pve540 rsync destination and dedicated transport files
  ansible.builtin.assert:
    that:
      - pve_frozen_host_bind_copy_target_rsync_host is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
      - pve_frozen_host_bind_copy_target_rsync_host == hostvars[pve_frozen_host_bind_copy_target_inventory_host].ansible_host
      - pve_frozen_host_bind_copy_rsync_identity_file is match('^/root/[A-Za-z0-9._/-]+$')
      - pve_frozen_host_bind_copy_rsync_known_hosts_file is match('^/root/[A-Za-z0-9._/-]+$')
    fail_msg: >-
      The source-host rsync endpoint must be the pve540 inventory endpoint
      and use dedicated root-owned identity and known-hosts files. No
      arbitrary remote shell command or SSH fallback is accepted.

- name: Read the source-host rsync transport files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ pve_frozen_host_bind_copy_rsync_identity_file }}"
    - "{{ pve_frozen_host_bind_copy_rsync_known_hosts_file }}"
  register: pve_frozen_host_bind_copy_transport_files
  changed_when: false

- name: Require root-owned protected source-host rsync transport files
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'root'
      - item.stat.mode in ['0400', '0600']
    fail_msg: >-
      {{ item.item }} must be a root-owned regular transport file with
      mode 0400 or 0600 before a source-host rsync can run.
  loop: "{{ pve_frozen_host_bind_copy_transport_files.results }}"
