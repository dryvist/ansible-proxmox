---
# This role is deliberately inert unless an operator explicitly enables it.
# It performs a one-way, snapshot-free copy only; it never deletes, starts a
# container, changes Proxmox configuration, creates ZFS datasets, or alters a
# pool.
pve_frozen_host_bind_copy_enabled: false

# Inventory identities are intentionally explicit: no implicit topology or
# hostname construction is safe for a one-way data migration.
pve_frozen_host_bind_copy_source_inventory_host: pve2
pve_frozen_host_bind_copy_target_inventory_host: pve540
pve_frozen_host_bind_copy_evidence_inventory_host: pve3

# The source host must already have these root-owned, dedicated transport
# files. The role constructs its own strict rsync SSH command after it proves
# this hostname is the pve540 inventory endpoint and the known-hosts file has
# a reviewed ED25519 entry for it.
pve_frozen_host_bind_copy_target_rsync_host: ""
pve_frozen_host_bind_copy_rsync_identity_file: ""
pve_frozen_host_bind_copy_rsync_known_hosts_file: ""

pve_frozen_host_bind_copy_source_pool: bulk
pve_frozen_host_bind_copy_target_pool: bulk
pve_frozen_host_bind_copy_capacity_margin_bytes: 1073741824
pve_frozen_host_bind_copy_evidence_dir: /root/pve2-to-pve540-frozen-copy

# Every run has a unique pve3 evidence directory. A reused value is rejected
# instead of replacing the prior run's reconstruction record.
pve_frozen_host_bind_copy_run_id: ""
