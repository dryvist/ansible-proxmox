---
# pve_ha — Proxmox VE HA (High Availability) resource + affinity manager.
#
# Configures ha-manager (Proxmox VE 9 "HA rules", not the legacy HA groups) for
# the tier-0 guests so a node failure is handled with ZERO manual action:
#   * a crashed guest auto-restarts (max_restart), and
#   * the redundant PAIRS (the two OpenBao Raft voters, the two Technitium DNS
#     instances, the two Traefik ingress LXCs) are pinned to SEPARATE nodes by
#     anti-affinity, so a single node loss can never take out both halves.
#
# SAFETY: this role is INERT by default. It does nothing unless pve_ha_enabled is
# true. HA config is CLUSTER-WIDE (/etc/pve/ha/*, replicated by pmxcfs) so it is
# applied ONCE from a single node (run_once against pve_ha_config_host), never
# per-node. All CLI work is skipped under Docker so the role is molecule-testable
# in containers without a live cluster.
#
# STORAGE NOTE: these guests live on LOCAL ZFS, not shared storage. On a node
# FAILURE ha-manager can only START a guest on another node if that guest's
# rootfs already exists there (PVE storage replication, pvesr). Two classes of
# guest split on this:
#   * REDUNDANT-PEER guests (openbao/technitium/traefik): each has a peer on
#     another node (OpenBao Raft quorum / the second Technitium instance / the
#     keepalived VRRP VIP), so the surviving peer covers the outage and the
#     failed guest returns when its node heals. They need NO replicated storage;
#     the payload is anti-affinity + in-place auto-restart + orderly return-home.
#   * SINGLETON app guests (pve_ha_replication_ct_hostnames): one instance, no
#     peer, so RELOCATION is the only node-loss story. The replication block
#     below runs pvesr to ship each one's rootfs to the always-on PARTNER node,
#     so ha-manager can start it there. max_relocate=1 is enough — one hop to
#     the partner that holds the replica. Only nodes in pve_ha_replication_pair
#     hold a replica, and the strict node-affinity rule keeps ha-manager off
#     every other node.
pve_ha_enabled: false

# A membership list wrong in EITHER direction (a dead hostname, or a live guest
# never added) produces no error by itself — a dead entry is skipped as
# unresolvable, a missing live one is never considered at all, and both read as
# a clean converge (see pve_ha_ct_hostnames below, corrected 2026-08-15 after
# exactly this class of drift left the live DNS primary with no HA coverage
# while its retired predecessor stayed listed). True fails the run loudly on
# any unresolvable member across tier0_resources/replication_jobs/
# estate_wide_enrollment; set false to fall back to a non-fatal debug line.
pve_ha_fail_on_unresolved: true

# Inventory hostname of the SINGLE node the ha-manager commands run on. HA state
# is cluster-wide, so one node is sufficient and correct. Defaults to
# pve_cluster_primary_host (the pve_cluster role's own primary, set in
# inventory/group_vars/pve_cluster_members.yml as "{{ proxmox_node_prefix }}1")
# so the two roles always agree on which node is primary. Falls back to the
# same "{{ proxmox_node_prefix }}1" expression directly when pve_cluster_primary_host
# is undefined (e.g. a playbook run without the pve_cluster group vars loaded).
pve_ha_config_host: "{{ pve_cluster_primary_host | default(proxmox_node_prefix ~ '1', true) }}"

# This host's Proxmox NODE name, which is not necessarily its inventory key.
# Everything the replication tasks compare against — a /nodes/<x>/ API path,
# the pvesr `source` field, and the tofu `node` value — is a node name, so they
# use this rather than inventory_hostname. Set proxmox_node_name in host_vars
# when the two differ.
pve_ha_this_pve_node: "{{ proxmox_node_name | default(inventory_hostname) }}"

# Per-guest HA restart/relocate bounds and desired state.
pve_ha_max_restart: 3
pve_ha_max_relocate: 1
pve_ha_state: started

# LXC guests to place under HA, identified by HOSTNAME (stable across a VMID
# renumber). The VMID + "ct:" SID are resolved in tasks/main.yml from the tofu
# inventory (containers_from_tofu, injected by load_tofu.yml), so a renumber
# flows through with no edit here. A hostname absent from the inventory is
# skipped with a warning rather than failing the run.
#
# Two classes of guest live here (see the STORAGE NOTE above and the replication
# block below):
#   * REDUNDANT-PEER guests (openbao/technitium/traefik) — a peer on another node
#     carries the service on node loss, so they need no replicated storage; HA
#     gives them in-place restart + anti-affinity.
#   * SINGLETON app guests (postgres-apps/nautobot/vikunja) — one instance, no
#     peer, so RELOCATION to a replica is their only node-loss story. They also
#     appear in pve_ha_replication_ct_hostnames, which ships their rootfs to the
#     always-on partner node so ha-manager can actually start them there.
# VERIFIED AGAINST LIVE 2026-08-15 (pvesh get /cluster/resources). This list was
# wrong in BOTH directions at once: it named `traefik`, which resolves to no
# guest, and `technitium-dns`, which exists but is the STOPPED, retired DNS
# primary — while OMITTING traefik-10, traefik-30 (both halves of the live
# ingress pair) and technitium-30 (the LIVE DNS primary). A dead entry is
# skipped as unresolvable; a missing live guest is never considered at all.
# Both read as a clean converge, so the guest whose failure mode caused an
# estate-wide DNS fault had no HA coverage while its retired predecessor was
# listed. technitium-dns is kept out deliberately — a stopped guest with no
# viable relocation target is worse than one left outside HA.
pve_ha_ct_hostnames:
  - openbao-01
  - openbao-02
  - technitium-30
  - technitium-dns-2
  - traefik-10
  - traefik-30
  # Data platform + shared-Postgres apps tier (live under HA since 2026-07-16;
  # this records what ha-manager already holds so a converge is idempotent).
  # nautobot/vikunja are the pvesr-replicated singletons and also appear in
  # pve_ha_replication_ct_hostnames below.
  - postgres
  - vikunja
  - nautobot
  - zammad
  # postgres-apps deliberately EXCLUDED — verified live 2026-08-15: it has no
  # viable pvesr replica within pve_ha_replication_pair (it runs on the node
  # holding the shared-postgres-apps guest, which is not in that pair). This
  # guard fails loud on exactly that condition (pve_ha_fail_on_unresolved),
  # and it is right to — that is not this guest's home. The honest fix is a
  # per-guest replication pair (postgres-apps needs a different pair than
  # nautobot/vikunja), not shipped here to avoid rushing a modelling change
  # under converge pressure. postgres-apps has NO viable replica TODAY either
  # way; excluding it here only changes whether that fact is visible. Restore
  # it once the per-guest pair design lands (Vikunja #1359/#1362).
  # Media tier: in-place crash auto-restart only (no redundant peer, so no
  # anti-affinity entry; node placement is enforced in the IaC layer — see
  # terraform-proxmox#615). Issue #396.
  - plex
# Extra HA SIDs to manage verbatim (e.g. a VM the tofu container map does not
# cover: "vm:110130"). Merged with the resolved CT SIDs. Empty by default.
pve_ha_extra_sids: []

# Anti-affinity groups: guests that must NEVER share a node (redundant pairs).
# Each: {name, hostnames:[...]}. Rendered as ha-manager resource-affinity rules
# with affinity=negative over the resolved SIDs. A group whose members do not
# all currently resolve is skipped (a half-present pair has nothing to separate).
pve_ha_anti_affinity_groups:
  - name: openbao-voters
    hostnames:
      - openbao-01
      - openbao-02
  - name: technitium-dns
    hostnames:
      - technitium-30
      - technitium-dns-2
  # The Traefik ingress pair — the VRRP VIP peers. Names come from the
  # node_services generator, which builds them as <name_prefix><suffix>, so they
  # are not free-form: a guess here does not fail, it silently skips, because a
  # pair whose members do not all resolve is dropped. That is why this sat inert
  # while it named a guest that never existed.
  #
  # Activates on its own once the second instance is created.
  - name: ingress-traefik
    hostnames:
      - traefik-10
      - traefik-30
  # The Postgres primary/standby pair: a node loss must never take both the
  # primary and its streaming standby.
  # postgres-apps deliberately EXCLUDED — verified live 2026-08-15 (converge):
  # ha-manager rejects a resource-affinity rule referencing a guest that is
  # not itself an HA-managed resource ("cannot use unmanaged resource(s)"),
  # and postgres-apps is deliberately excluded from pve_ha_ct_hostnames above
  # (no viable replica). The "skipped if a member doesn't resolve" guard only
  # checks tofu-inventory resolution, not HA-management status, so a
  # since-excluded guest left in a pair here reaches ha-manager and fails
  # loud rather than skipping quietly. Restore alongside pve_ha_ct_hostnames
  # once the per-guest replication pair design lands (Vikunja #1359/#1362).
  - name: postgres-pair
    hostnames:
      - postgres

# --- Storage replication (pvesr) for the SINGLETON app guests ----------------
# The guests here get a pvesr job that ships their rootfs to the always-on
# PARTNER node, so ha-manager can relocate them on node loss (see STORAGE NOTE).
# Membership in THIS list is the per-guest "relocation is viable" knob — a guest
# in pve_ha_ct_hostnames but NOT here is a redundant-peer guest and gets no
# replica. Hostname-keyed like pve_ha_ct_hostnames; a guest absent from the tofu
# inventory (e.g. not provisioned yet) is skipped with a warning, not a failure.
pve_ha_replication_ct_hostnames:
  # postgres-apps deliberately excluded here too — see the comment above
  # pve_ha_ct_hostnames. A pvesr job targeting a pair it is not homed in
  # would just fail on first sync; membership in this list is a no-op
  # without a viable pair member.
  - nautobot
  - vikunja

# The two nodes that form the replication pair. A guest's pvesr target is the
# pair member that is NOT its current home node. A guest whose home node is
# outside this pair is skipped.
#
# The pair MUST be two nodes that share the guests' storage id. pvesr replicates
# a volume to the SAME storage name on the target, so a target lacking that
# storage fails every run with:
#   (remote_prepare_local_job) storage '<id>' is not available on node '<node>'
#
# These guests live on `local-zfs`, and per /etc/pve/storage.cfg that storage is
# defined on **pve1 and pve3** — pve2 carries `bulk`, not `local-zfs`. The pair
# was pve1+pve2, so every job failed on first sync and no replica ever existed.
# That is what let a singleton sit under HA with nothing to relocate to; see the
# guard in "Resolve singleton app guests with no viable replica" above.
#
# pve3 was previously excluded here as a sleeping DR node. It is always-on now
# (it holds the HA master and runs live services), so it is a valid pvesr peer.
# If pve3 ever returns to sleeping, this pair must change with it — a sleeping
# target cannot accept a replication run.
pve_ha_replication_pair:
  - "{{ proxmox_node_prefix }}1"
  - "{{ proxmox_node_prefix }}3"

# pvesr schedule (systemd-calendar subset) and optional rate limit (MB/s; empty
# = unlimited). */15 matches Proxmox's default; the app guests' real data-loss
# window is covered separately (postgres-apps by streaming replication + WAL
# archiving, the others are near-stateless), so this is a relocation-enabler,
# not the primary durability layer.
pve_ha_replication_schedule: "*/15"
pve_ha_replication_rate: ""

# Job-number suffix for the pvesr job id (<vmid>-<jobnum>). One job per guest.
pve_ha_replication_jobnum: 0

# STRICT node-affinity rule pinning the replication guests to pve_ha_replication_pair.
# This is correctness, not preference: a pvesr replica exists ONLY on the pair, so
# ha-manager must never start one of these guests on any other node (e.g. pve3,
# which holds no replica). A strict rule = run ONLY on the listed nodes, so a
# relocation onto a replica-less node can't happen and then start-fail/flap.
pve_ha_replication_affinity_rule: apps-replication-nodes

# --- Estate-wide HA enrollment ----------------------------------------------
# With this true, EVERY container in the tofu inventory that is not already a
# tier-0 guest above is placed under HA as a HOME-PINNED guest: auto-restart in
# place, and a STRICT node-affinity rule confining it to the single node that
# holds its rootfs.
#
# The pin is what makes estate-wide enrollment safe. These guests live on
# node-local ZFS and have no pvesr replica, so relocation cannot work for them:
# ha-manager would move one to a node lacking its storage, the guest would fail
# to start and park in `error`, and the source node has already self-fenced to
# get there. A strict single-node rule plus max_relocate 0 means HA can only
# restart a guest where its disks are.
#
# A guest whose inventory entry has no `node` is skipped — there is nothing to
# pin it to, and an unpinned guest under HA is worse than one outside HA.
pve_ha_manage_all: false

# Relocation bound for the home-pinned guests. Zero: there is nowhere to go.
pve_ha_pinned_max_relocate: 0

# Prefix for the per-node strict affinity rules (one rule per home node,
# e.g. "pve-ha-home-pve1"), so the rule set stays small and readable.
pve_ha_home_rule_prefix: pve-ha-home
