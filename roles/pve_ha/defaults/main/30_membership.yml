---
# LXC HA membership comes from the `ha-managed` capability tag in Tofu desired
# state. VMID/SID resolution still uses the published inventory, so renumbering
# a tagged guest requires no role edit. Service-specific anti-affinity and
# storage policy remain below.
pve_ha_ct_hostnames: >-
  {{ (containers_from_tofu | default({}) | dict2items)
     | selectattr('value.tags', 'defined')
     | selectattr('value.tags', 'contains', 'ha-managed')
     | map(attribute='key') | list }}
# Extra HA SIDs to manage verbatim for a guest the tofu container/VM maps
# do not cover. NEVER a VM the tofu vms map DOES cover — an extra SID gets no
# home pin and no affinity rule, which is exactly the defect that stranded
# guests with no node-affinity rule during a prior outage. A tofu-known VM
# belongs in pve_ha_vm_names below, which resolves/enrols/pins it the same
# way a container is. Empty by default.
pve_ha_extra_sids: []

# VM HA membership uses the same `ha-managed` capability tag.
pve_ha_vm_names: >-
  {{ (vms_from_tofu | default({}) | dict2items)
     | selectattr('value.tags', 'defined')
     | selectattr('value.tags', 'contains', 'ha-managed')
     | map(attribute='key') | list }}
