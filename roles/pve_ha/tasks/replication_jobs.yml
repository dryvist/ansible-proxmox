---
# Included from main.yml's pvesr replication block (inherits its when/tags).
# Part 1 of 2: resolves each singleton app guest's (container AND VM)
# replication job and fails fast if a job's target node lacks a required
# storage id (see comment below — incident 2026-07-26, a job that silently
# never replicates).
- name: Resolve the replication scope (containers + VMs, per-guest targets)
  ansible.builtin.include_tasks: replication_scope.yml

- name: Refuse an app guest with no replication job
  ansible.builtin.fail:
    msg: >-
      pve_ha replication: no job for {{ item }} —
      {{ 'present in the tofu inventory but publishes no ha_replication_target'
         if (item in pve_ha_replication_ct_by_host or item in pve_ha_replication_vm_by_host)
         else 'absent from the tofu inventory' }}. A singleton listed under
      pve_ha_replication_ct_hostnames/pve_ha_replication_vm_names with no
      viable replica has nowhere to relocate to on node loss.
  loop: "{{ pve_ha_replication_ct_hostnames + pve_ha_replication_vm_names }}"
  when: item in pve_ha_unsafe_singletons and pve_ha_fail_on_unresolved | bool

- name: Warn about an app guest with no replication job (non-fatal mode)
  ansible.builtin.debug:
    msg: >-
      pve_ha replication: no job for {{ item }} —
      {{ 'present in the tofu inventory but publishes no ha_replication_target'
         if (item in pve_ha_replication_ct_by_host or item in pve_ha_replication_vm_by_host)
         else 'absent from the tofu inventory' }}.
  loop: "{{ pve_ha_replication_ct_hostnames + pve_ha_replication_vm_names }}"
  when: item in pve_ha_unsafe_singletons and not (pve_ha_fail_on_unresolved | bool)

# Only the VIABLE guests (those with a declared ha_replication_target) get a job.
- name: Restrict to viable replication jobs
  ansible.builtin.set_fact:
    pve_ha_replication_jobs: "{{ pve_ha_replication_guests | default([]) | selectattr('viable') | list }}"

# pvesr replicates a volume to the SAME storage id on the target node. If the
# target lacks that storage, the job fails asynchronously on first sync and
# the converge still reports success — no replica ever exists, silently.
# (Incident 2026-07-26: the replication target named a node that did not
# carry the guests' storage (local-zfs); every job failed and a
# singleton guest sat under HA with nothing to relocate to.) Prefer pvesh
# over parsing /etc/pve/storage.cfg directly: the API already normalizes the
# ini-style config into JSON the same way the cluster consumes it, so there
# is no risk of a hand-rolled parser disagreeing with pvesr's own view.
# run_once: this is a read-only cluster-wide check (pvesh proxies to any
# node), so one node doing it is enough — no need to repeat it per node.
- name: Read cluster storage configuration
  ansible.builtin.command: pvesh get /storage --output-format json
  register: pve_ha_storage_raw
  changed_when: false
  run_once: true

- name: Parse storage-to-nodes availability (empty list = all nodes)
  ansible.builtin.set_fact:
    pve_ha_storage_nodes: >-
      {{ pve_ha_storage_nodes | default({}) | combine({
           item.storage: (item.nodes | default('') | split(',')
                          | reject('equalto', '') | list)
         }) }}
  loop: "{{ pve_ha_storage_raw.stdout | from_json }}"
  loop_control:
    label: "{{ item.storage }}"
  run_once: true

# Container volumes: query the live LXC config, which covers every mount
# point (rootfs + mpN) — a container's tofu entry does not publish that full
# list, only its primary datastore.
- name: Read each replicated CONTAINER's LXC config (to find its volumes' storage ids)
  ansible.builtin.command: >-
    pvesh get /nodes/{{ item.node }}/lxc/{{ item.vmid }}/config
    --output-format json
  loop: "{{ pve_ha_replication_jobs | selectattr('kind', 'equalto', 'ct') | list }}"
  loop_control:
    label: "{{ item.hostname }}"
  register: pve_ha_guest_configs_raw
  changed_when: false
  run_once: true

- name: Resolve each CONTAINER job's required storage ids from its volumes
  ansible.builtin.set_fact:
    pve_ha_replication_job_storages: >-
      {{ pve_ha_replication_job_storages | default([]) + [ {
           'hostname': item.item.hostname,
           'target': item.item.target,
           'storages': ((item.stdout | from_json) | dict2items
             | selectattr('key', 'match', '^(rootfs|mp[0-9]+)$')
             | rejectattr('value', 'match', '^/')
             | map(attribute='value')
             | map('regex_replace', '^([^:]+):.*$', '\1')
             | unique | list)
         } ] }}
  loop: "{{ pve_ha_guest_configs_raw.results }}"
  loop_control:
    label: "{{ item.item.hostname }}"
  run_once: true

# VM disks: tofu already publishes the full `disks` list (each with its own
# datastore), so there is no need for a second pvesh call — unlike containers,
# whose tofu entry carries only a single primary datastore.
- name: Resolve each VM job's required storage ids from its published disks
  ansible.builtin.set_fact:
    pve_ha_replication_job_storages: >-
      {{ pve_ha_replication_job_storages | default([]) + [ {
           'hostname': item.hostname,
           'target': item.target,
           'storages': (item.disks | default([]) | map(attribute='datastore') | unique | list)
         } ] }}
  loop: "{{ pve_ha_replication_jobs | selectattr('kind', 'equalto', 'vm') | list }}"
  loop_control:
    label: "{{ item.hostname }}"
  run_once: true

- name: Fail if a replication target lacks a volume's required storage
  ansible.builtin.fail:
    msg: >-
      pve_ha replication: guest '{{ item.0.hostname }}' has a volume on
      storage '{{ item.1 }}', but target node '{{ item.0.target }}' does
      not have that storage. pvesr replicates to the SAME storage id on the
      target, so this job would fail on every sync and leave the guest with
      no replica. Nodes that DO have '{{ item.1 }}':
      {{ (pve_ha_storage_nodes[item.1] | length == 0)
         | ternary('ALL (no nodes restriction)',
                   pve_ha_storage_nodes[item.1] | join(', ')) }}.
      Fix by adding '{{ item.1 }}' to '{{ item.0.target }}' in
      /etc/pve/storage.cfg, or changing this guest's declared
      ha_replication_target to a node that shares this storage.
  loop: "{{ pve_ha_replication_job_storages | default([]) | subelements('storages') }}"
  loop_control:
    label: "{{ item.0.hostname }} / {{ item.1 }}"
  when: >-
    (pve_ha_storage_nodes[item.1] | default([]) | length > 0)
    and (item.0.target not in pve_ha_storage_nodes[item.1])
  run_once: true
