---
# Included from main.yml's "Configure cluster-wide HA" block (inherits its
# when/tags). Part 1 of 3: resolves the tier-0 SID set (containers + VMs,
# skipping replica-less singletons) and adds/enforces it in ha-manager.
# Reuse the same hostname -> vmid projection load_tofu.yml builds for the
# media/GPU feature maps, so a VMID renumber flows through with no edit.
- name: Map container hostname -> vmid from the tofu inventory
  ansible.builtin.set_fact:
    pve_ha_vmid_by_host: >-
      {{
        dict(
          (containers_from_tofu | default({})) | dict2items
          | selectattr('value.ansible_pct_vmid', 'defined')
          | map(attribute='key') | list
          | zip(
              (containers_from_tofu | default({})) | dict2items
              | selectattr('value.ansible_pct_vmid', 'defined')
              | map(attribute='value.ansible_pct_vmid') | list
            )
        )
      }}

# Same projection for VMs, keyed by their tofu vms-map key rather than a pct
# vmid — VMs carry a plain `vmid`, not `ansible_pct_vmid` (that field is
# container-tool-specific; VMs use `qm`, not `pct`).
- name: Map VM name -> vmid from the tofu inventory
  ansible.builtin.set_fact:
    pve_ha_vm_vmid_by_host: >-
      {{
        dict(
          (vms_from_tofu | default({})) | dict2items
          | selectattr('value.vmid', 'defined')
          | map(attribute='key') | list
          | zip(
              (vms_from_tofu | default({})) | dict2items
              | selectattr('value.vmid', 'defined')
              | map(attribute='value.vmid') | list
            )
        )
      }}

# A singleton app guest is only safe under HA if it has somewhere to be
# relocated TO. Its two safety mechanisms — the pvesr replica and the strict
# node-affinity pin — are both conditional on the guest being homed in its
# replication pair, but `ha-manager add` below was not. A guest that failed
# that condition still got added, ending up HA-managed with neither a
# replica nor a pin.
#
# That is strictly WORSE than leaving it out of HA. On any node hiccup,
# ha-manager relocates it to a node holding no replica, where it cannot
# start and parks in `error` — and the source node has already self-fenced
# via the HA watchdog to get there. Observed 2026-07-26: one such guest put
# its home node into a reset loop, nine hard resets in a day.
#
# Shared with replication_jobs.yml (which builds the actual pvesr jobs) so
# the two can never disagree on which guest is safe — see the comment there.
# Every HA-managed guest must carry a DECLARED node-loss story — peer-redundant,
# replicated, or a pinned singleton — rather than inheriting one from the gap
# between two lists. Runs before the resource set is built so an unclassified
# guest never reaches ha-manager.
- name: Assert every HA guest carries a declared node-loss story
  ansible.builtin.include_tasks: classification.yml

# Which nodes can actually START each guest, derived from node_storage +
# the nodes map. Consumed by both rule builders below.
- name: Resolve per-guest node eligibility from storage and commissioning
  ansible.builtin.include_tasks: storage_eligibility.yml

- name: Resolve the replication scope (containers + VMs, per-guest pairs)
  ansible.builtin.include_tasks: replication_scope.yml

# Fails loud by default (pve_ha_fail_on_unresolved: true) rather than a debug
# line nobody reads — a silent skip here is how a critical guest went unnoticed
# outside HA coverage for weeks (see the both-directions pve_ha_ct_hostnames
# defect, Vikunja #1359). Set pve_ha_fail_on_unresolved: false to fall back to
# the old warn-only behaviour.
- name: Refuse to place a replica-less singleton under HA
  ansible.builtin.fail:
    msg: >-
      pve_ha: NOT adding {{ pve_ha_unsafe_singletons }} to HA — each is either
      absent from the tofu inventory, or present but publishes no
      `ha_replication_target` (a desired-state gap: add it to the guest's
      container/VM entry alongside `node`), so ha-manager could only
      relocate it to a node that cannot start it. If one is ALREADY under HA,
      remove it until that is true: ha-manager remove ct:<vmid> (or vm:<vmid>)
  when: pve_ha_unsafe_singletons | length > 0 and pve_ha_fail_on_unresolved | bool

- name: Warn about a replica-less singleton (non-fatal mode)
  ansible.builtin.debug:
    msg: >-
      pve_ha: NOT adding {{ pve_ha_unsafe_singletons }} to HA — each is either
      absent from the tofu inventory, or present but publishes no
      `ha_replication_target`.
  when: pve_ha_unsafe_singletons | length > 0 and not (pve_ha_fail_on_unresolved | bool)

- name: Resolve managed tier-0 SIDs (present hosts only) + any extra SIDs
  ansible.builtin.set_fact:
    pve_ha_managed_sids: >-
      {{ (pve_ha_ct_hostnames | reject('in', pve_ha_unsafe_singletons)
          | select('in', pve_ha_vmid_by_host)
          | map('extract', pve_ha_vmid_by_host) | map('string')
          | map('regex_replace', '^(.+)$', 'ct:\1') | list)
         + (pve_ha_vm_names | reject('in', pve_ha_unsafe_singletons)
            | select('in', pve_ha_vm_vmid_by_host)
            | map('extract', pve_ha_vm_vmid_by_host) | map('string')
            | map('regex_replace', '^(.+)$', 'vm:\1') | list)
         + (pve_ha_extra_sids | default([])) }}

- name: Refuse tier-0 hostnames/VM names missing from the inventory
  ansible.builtin.fail:
    msg: >-
      pve_ha: these tier-0 containers/VMs are not in the tofu inventory and
      are SKIPPED: {{ (pve_ha_ct_hostnames | reject('in', pve_ha_vmid_by_host) | list)
      + (pve_ha_vm_names | reject('in', pve_ha_vm_vmid_by_host) | list) }}.
      A membership list wrong in this direction produces no error by itself —
      verify each name against pvesh get /cluster/resources before re-converging.
  when: ((pve_ha_ct_hostnames | reject('in', pve_ha_vmid_by_host) | list)
    + (pve_ha_vm_names | reject('in', pve_ha_vm_vmid_by_host) | list))
    | length > 0 and pve_ha_fail_on_unresolved | bool

- name: Warn about tier-0 hostnames/VM names missing from the inventory (non-fatal mode)
  ansible.builtin.debug:
    msg: >-
      pve_ha: these tier-0 containers/VMs are not in the tofu inventory and
      are SKIPPED: {{ (pve_ha_ct_hostnames | reject('in', pve_ha_vmid_by_host) | list)
      + (pve_ha_vm_names | reject('in', pve_ha_vm_vmid_by_host) | list) }}
  when: ((pve_ha_ct_hostnames | reject('in', pve_ha_vmid_by_host) | list)
    + (pve_ha_vm_names | reject('in', pve_ha_vm_vmid_by_host) | list))
    | length > 0 and not (pve_ha_fail_on_unresolved | bool)

- name: Read current HA resources
  ansible.builtin.command: pvesh get /cluster/ha/resources --output-format json
  register: pve_ha_resources_raw
  changed_when: false

- name: Parse existing HA resource SIDs
  ansible.builtin.set_fact:
    pve_ha_existing_sids: >-
      {{ (pve_ha_resources_raw.stdout | from_json)
         | map(attribute='sid') | list }}

- name: Add tier-0 guests to HA (only those not yet managed)
  ansible.builtin.command: >-
    ha-manager add {{ item }}
    --state {{ pve_ha_state }}
    --max_restart {{ pve_ha_max_restart }}
    --max_relocate {{ pve_ha_max_relocate }}
  loop: "{{ pve_ha_managed_sids }}"
  when: item not in pve_ha_existing_sids
  changed_when: true

- name: Enforce HA params on already-managed guests
  ansible.builtin.command: >-
    ha-manager set {{ item }}
    --state {{ pve_ha_state }}
    --max_restart {{ pve_ha_max_restart }}
    --max_relocate {{ pve_ha_max_relocate }}
  loop: "{{ pve_ha_managed_sids }}"
  when: item in pve_ha_existing_sids
  # ponytail: ha-manager set is idempotent server-side; we do not diff each
  # field, so report unchanged rather than a spurious change every converge.
  changed_when: false
