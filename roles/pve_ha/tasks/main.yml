---
# pve_ha — configure Proxmox VE HA resources + anti-affinity rules for tier-0
# guests. HA state is CLUSTER-WIDE (/etc/pve/ha/*, replicated by pmxcfs), so all
# work runs on exactly ONE node (pve_ha_config_host). Inert unless
# pve_ha_enabled; all CLI work is skipped under Docker so the role is
# molecule-testable without a live cluster.

- name: Refuse to run unless explicitly enabled
  ansible.builtin.assert:
    that:
      - pve_ha_enabled | bool
    fail_msg: >-
      pve_ha is inert by default. Set pve_ha_enabled=true only when you intend to
      place tier-0 guests under Proxmox HA — this changes live cluster behaviour
      (guests become ha-manager-controlled: auto-restart, fence-on-node-loss).
    quiet: true
  tags:
    - pve_ha

- name: Configure cluster-wide HA from the single config host
  when:
    - pve_ha_enabled | bool
    - inventory_hostname == pve_ha_config_host
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - pve_ha
  block:
    - name: Resolve and enforce the tier-0 HA resource set
      ansible.builtin.include_tasks: tier0_resources.yml

    - name: Declare the cluster-wide shutdown policy
      ansible.builtin.include_tasks: datacenter_cfg.yml

    - name: Resolve and enforce anti-affinity and replication-pin rules
      ansible.builtin.include_tasks: affinity_rules.yml

    - name: Resolve and enforce strict home-node pins for the replica-less guests
      ansible.builtin.include_tasks: estate_wide_enrollment.yml

# Storage replication (pvesr) for the SINGLETON app guests, so ha-manager can
# relocate them to the always-on partner node on node loss (see STORAGE NOTE in
# defaults). Unlike the cluster-wide HA config above (run_once on the config
# host), a pvesr job is NODE-LOCAL: `pvesr create-local-job` must run on the node
# that currently hosts the guest (its SOURCE). So this block runs on EVERY node
# and each node creates jobs only for the guests homed on it. The existing-job
# read is cluster-wide, so a job already present anywhere is skipped — idempotent
# across converges and across a later relocation (Proxmox reverses the job's
# direction itself when a replicated guest migrates). Docker-skipped like above.
- name: Configure pvesr storage replication for singleton app guests
  when:
    - pve_ha_enabled | bool
    - (pve_ha_replication_ct_hostnames + pve_ha_replication_vm_names) | length > 0
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - pve_ha
  block:
    - name: Resolve replication jobs and fail fast on a missing target storage
      ansible.builtin.include_tasks: replication_jobs.yml

    - name: Clear permanently-broken jobs and create any that are absent
      ansible.builtin.include_tasks: replication_apply.yml

    # Read-back (Part 3 of 3, with replication_jobs.yml and
    # replication_apply.yml): the passes above reconciled the jobs and rules,
    # so the LIVE cluster must now agree — every HA resource with an enabled
    # pvesr job must be covered by strict node-affinity rules naming exactly
    # its source node plus its replication targets, and must still run and
    # report under --check. A rule naming a node with no replica lets
    # ha-manager recover the guest onto a node that cannot start it. The
    # reads are cluster-wide (pvesh/ha-manager proxy to any node), so
    # run_once like replication_jobs.yml's; the logic itself lives in
    # verify_replication_affinity.yml, pure over parsed inputs, so the
    # offline test can feed it fixtures.
    - name: Verify the live strict rules against the live replication placement
      when: pve_ha_verify_replication_affinity | bool
      block:
        - name: Read live HA rules for the replication-affinity verification
          ansible.builtin.command: ha-manager rules config --output-format json
          register: pve_ha_verify_rules_raw
          changed_when: false
          # Read-only; a check run needs the live rules to verify them.
          check_mode: false
          run_once: true

        - name: Read live replication jobs for the replication-affinity verification
          ansible.builtin.command: pvesh get /cluster/replication --output-format json
          register: pve_ha_verify_jobs_raw
          changed_when: false
          # Read-only; a check run needs the live jobs to verify against.
          check_mode: false
          run_once: true

        - name: Read live HA resources for the replication-affinity verification
          ansible.builtin.command: pvesh get /cluster/ha/resources --output-format json
          register: pve_ha_verify_resources_raw
          changed_when: false
          # Read-only; a check run needs the live resources to verify against.
          check_mode: false
          run_once: true

        - name: Read live guest placement for the replication-affinity node map
          ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
          register: pve_ha_verify_placement_raw
          changed_when: false
          # Read-only; a check run needs live placement for the source fallback.
          check_mode: false
          run_once: true

        - name: Parse the live HA rules for the replication-affinity verification
          ansible.builtin.set_fact:
            pve_ha_verify_rules: "{{ pve_ha_verify_rules_raw.stdout | from_json }}"
          run_once: true

        - name: Parse the live replication jobs for the replication-affinity verification
          ansible.builtin.set_fact:
            pve_ha_verify_jobs: "{{ pve_ha_verify_jobs_raw.stdout | from_json }}"
          run_once: true

        - name: Parse the live HA resources for the replication-affinity verification
          ansible.builtin.set_fact:
            pve_ha_verify_resources: "{{ pve_ha_verify_resources_raw.stdout | from_json }}"
          run_once: true

        - name: Map each guest's current node for the replication-affinity verification
          ansible.builtin.set_fact:
            pve_ha_verify_guest_nodes: >-
              {{ pve_ha_verify_guest_nodes | default({}) | combine({
                   item.vmid | string: item.node
                 }) }}
          loop: "{{ pve_ha_verify_placement_raw.stdout | from_json }}"
          loop_control:
            label: "{{ item.vmid }}"
          run_once: true

        - name: Fail on any replicated guest whose strict rules mismatch its replicas
          ansible.builtin.include_tasks: verify_replication_affinity.yml
          run_once: true

- name: Remove guarded orphaned cloud-init volumes on each node
  when:
    - pve_ha_enabled | bool
    - pve_ha_cloudinit_orphan_cleanup_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - pve_ha
  ansible.builtin.include_tasks: cloudinit_orphan_cleanup.yml
