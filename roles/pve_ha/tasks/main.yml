---
# pve_ha — configure Proxmox VE HA resources + anti-affinity rules for tier-0
# guests. HA state is CLUSTER-WIDE (/etc/pve/ha/*, replicated by pmxcfs), so all
# work runs on exactly ONE node (pve_ha_config_host). Inert unless
# pve_ha_enabled; all CLI work is skipped under Docker so the role is
# molecule-testable without a live cluster.

- name: Refuse to run unless explicitly enabled
  ansible.builtin.assert:
    that:
      - pve_ha_enabled | bool
    fail_msg: >-
      pve_ha is inert by default. Set pve_ha_enabled=true only when you intend to
      place tier-0 guests under Proxmox HA — this changes live cluster behaviour
      (guests become ha-manager-controlled: auto-restart, fence-on-node-loss).
    quiet: true
  tags:
    - pve_ha

- name: Configure cluster-wide HA from the single config host
  when:
    - pve_ha_enabled | bool
    - inventory_hostname == pve_ha_config_host
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - pve_ha
  block:
    # Reuse the same hostname -> vmid projection load_tofu.yml builds for the
    # media/GPU feature maps, so a VMID renumber flows through with no edit.
    - name: Map container hostname -> vmid from the tofu inventory
      ansible.builtin.set_fact:
        pve_ha_vmid_by_host: >-
          {{
            dict(
              (containers_from_tofu | default({})) | dict2items
              | selectattr('value.vmid', 'defined')
              | map(attribute='key') | list
              | zip(
                  (containers_from_tofu | default({})) | dict2items
                  | selectattr('value.vmid', 'defined')
                  | map(attribute='value.vmid') | list
                )
            )
          }}

    # A singleton app guest is only safe under HA if it has somewhere to be
    # relocated TO. Its two safety mechanisms — the pvesr replica and the strict
    # node-affinity pin — are both conditional on the guest being homed in
    # pve_ha_replication_pair, but `ha-manager add` below was not. A guest that
    # failed that condition still got added, ending up HA-managed with neither a
    # replica nor a pin.
    #
    # That is strictly WORSE than leaving it out of HA. On any node hiccup,
    # ha-manager relocates it to a node holding no replica, where it cannot
    # start and parks in `error` — and the source node has already self-fenced
    # via the HA watchdog to get there. Observed 2026-07-26: one such guest put
    # its home node into a reset loop, nine hard resets in a day.
    - name: Resolve singleton app guests with no viable replica
      ansible.builtin.set_fact:
        pve_ha_unsafe_singletons: >-
          {{ pve_ha_replication_ct_hostnames
             | reject('in',
                 (containers_from_tofu | default({})) | dict2items
                 | selectattr('value.vmid', 'defined')
                 | selectattr('value.node', 'defined')
                 | selectattr('value.node', 'in', pve_ha_replication_pair)
                 | map(attribute='key') | list)
             | list }}

    - name: Refuse to place a replica-less singleton under HA
      ansible.builtin.debug:
        msg: >-
          pve_ha: NOT adding {{ pve_ha_unsafe_singletons }} to HA — each is a
          singleton with no pvesr replica on {{ pve_ha_replication_pair }}, so
          ha-manager could only relocate it to a node that cannot start it.
          Give the guest a home node inside the pair (or a working replication
          job), then re-converge. If one is ALREADY under HA, remove it until
          that is true: ha-manager remove ct:<vmid>
      when: pve_ha_unsafe_singletons | length > 0

    - name: Resolve managed tier-0 SIDs (present hosts only) + any extra SIDs
      ansible.builtin.set_fact:
        pve_ha_managed_sids: >-
          {{ (pve_ha_ct_hostnames | reject('in', pve_ha_unsafe_singletons)
              | select('in', pve_ha_vmid_by_host)
              | map('extract', pve_ha_vmid_by_host) | map('string')
              | map('regex_replace', '^(.+)$', 'ct:\1') | list)
             + (pve_ha_extra_sids | default([])) }}

    - name: Warn about tier-0 hostnames missing from the inventory (skipped)
      ansible.builtin.debug:
        msg: >-
          pve_ha: these tier-0 hostnames are not in the tofu inventory and are
          SKIPPED: {{ pve_ha_ct_hostnames | reject('in', pve_ha_vmid_by_host)
          | list }}
      when: (pve_ha_ct_hostnames | reject('in', pve_ha_vmid_by_host) | list)
        | length > 0

    - name: Read current HA resources
      ansible.builtin.command: pvesh get /cluster/ha/resources --output-format json
      register: pve_ha_resources_raw
      changed_when: false

    - name: Parse existing HA resource SIDs
      ansible.builtin.set_fact:
        pve_ha_existing_sids: >-
          {{ (pve_ha_resources_raw.stdout | from_json)
             | map(attribute='sid') | list }}

    - name: Add tier-0 guests to HA (only those not yet managed)
      ansible.builtin.command: >-
        ha-manager add {{ item }}
        --state {{ pve_ha_state }}
        --max_restart {{ pve_ha_max_restart }}
        --max_relocate {{ pve_ha_max_relocate }}
      loop: "{{ pve_ha_managed_sids }}"
      when: item not in pve_ha_existing_sids
      changed_when: true

    - name: Enforce HA params on already-managed guests
      ansible.builtin.command: >-
        ha-manager set {{ item }}
        --state {{ pve_ha_state }}
        --max_restart {{ pve_ha_max_restart }}
        --max_relocate {{ pve_ha_max_relocate }}
      loop: "{{ pve_ha_managed_sids }}"
      when: item in pve_ha_existing_sids
      # ponytail: ha-manager set is idempotent server-side; we do not diff each
      # field, so report unchanged rather than a spurious change every converge.
      changed_when: false

    - name: Resolve anti-affinity rule SID sets (present members only)
      ansible.builtin.set_fact:
        pve_ha_affinity_rules: >-
          {{ pve_ha_affinity_rules | default([]) + [ {
               'name': item.name,
               'sids': (item.hostnames | select('in', pve_ha_vmid_by_host)
                        | map('extract', pve_ha_vmid_by_host) | map('string')
                        | map('regex_replace', '^(.+)$', 'ct:\1') | list)
             } ] }}
      loop: "{{ pve_ha_anti_affinity_groups }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Read current HA rules
      ansible.builtin.command: pvesh get /cluster/ha/rules --output-format json
      register: pve_ha_rules_raw
      changed_when: false

    - name: Parse existing HA rule names
      ansible.builtin.set_fact:
        pve_ha_existing_rules: >-
          {{ (pve_ha_rules_raw.stdout | from_json)
             | map(attribute='rule') | list }}

    - name: Add anti-affinity (negative) rules for redundant pairs
      ansible.builtin.command: >-
        ha-manager rules add resource-affinity {{ item.name }}
        --resources {{ item.sids | join(',') }}
        --affinity negative
        --comment 'pve_ha: keep {{ item.name }} members on separate nodes'
      loop: "{{ pve_ha_affinity_rules }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.sids | length >= 2
        - item.name not in pve_ha_existing_rules
      changed_when: true

    - name: Enforce membership on existing anti-affinity rules
      ansible.builtin.command: >-
        ha-manager rules set resource-affinity {{ item.name }}
        --resources {{ item.sids | join(',') }}
        --affinity negative
      loop: "{{ pve_ha_affinity_rules }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.sids | length >= 2
        - item.name in pve_ha_existing_rules
      # ponytail: idempotent enforce, same rationale as the resource set above.
      changed_when: false

    # SIDs of replication guests that actually have a replica: present in the
    # inventory AND homed in the pair (same scope as the pvesr jobs). A guest
    # outside the pair has no replica, so it must NOT go in the strict rule (a
    # strict rule with no available node would STOP it).
    - name: Resolve replication guest SIDs (present, homed in the always-on pair)
      ansible.builtin.set_fact:
        pve_ha_replication_sids: >-
          {{ pve_ha_replication_ct_hostnames | select('in', pve_ha_vmid_by_host)
             | map('extract', containers_from_tofu | default({}))
             | selectattr('node', 'in', pve_ha_replication_pair)
             | map(attribute='vmid') | map('string')
             | map('regex_replace', '^(.+)$', 'ct:\1') | list }}

    - name: Pin replication guests to the always-on pair (strict; add if absent)
      ansible.builtin.command: >-
        ha-manager rules add node-affinity {{ pve_ha_replication_affinity_rule }}
        --resources {{ pve_ha_replication_sids | join(',') }}
        --nodes {{ pve_ha_replication_pair | join(',') }}
        --strict 1
        --comment 'pve_ha: keep singleton app guests on nodes holding their pvesr replica'
      when:
        - pve_ha_replication_sids | length > 0
        - pve_ha_replication_affinity_rule not in pve_ha_existing_rules
      changed_when: true

    - name: Enforce the replication node-affinity rule (nodes + strict)
      ansible.builtin.command: >-
        ha-manager rules set node-affinity {{ pve_ha_replication_affinity_rule }}
        --resources {{ pve_ha_replication_sids | join(',') }}
        --nodes {{ pve_ha_replication_pair | join(',') }}
        --strict 1
      when:
        - pve_ha_replication_sids | length > 0
        - pve_ha_replication_affinity_rule in pve_ha_existing_rules
      # ponytail: idempotent enforce, same rationale as the resource-affinity set.
      changed_when: false

    # --- Estate-wide enrollment (pve_ha_manage_all) -------------------------
    # Every remaining container joins HA pinned to the single node holding its
    # rootfs. See the defaults for why the pin is the safety property: without
    # it, ha-manager relocates a local-ZFS guest onto a node that cannot start
    # it, after the source node has already self-fenced to get there.
    #
    # Containers only: containers_from_tofu is the container map. A VM that
    # should be HA-managed goes in pve_ha_extra_sids, which is not pinned and so
    # must only carry VMs on storage every node can reach.
    - name: Resolve the home-pinned guests, grouped by their home node
      ansible.builtin.set_fact:
        pve_ha_home_entries: >-
          {{ (containers_from_tofu | default({})) | dict2items
             | rejectattr('key', 'in', pve_ha_ct_hostnames)
             | selectattr('value.vmid', 'defined')
             | selectattr('value.node', 'defined')
             | list }}
      when: pve_ha_manage_all | bool

    - name: Resolve the home-pinned SIDs
      ansible.builtin.set_fact:
        pve_ha_home_sids: >-
          {{ pve_ha_home_entries | map(attribute='value.vmid') | map('string')
             | map('regex_replace', '^(.+)$', 'ct:\1') | list }}
      when: pve_ha_manage_all | bool

    # HA state must follow the guest's CURRENT power state, not a blanket
    # `started`. A large share of the estate is deliberately stopped, and
    # enrolling those with state=started would have HA boot every one of them
    # the moment the rule lands. Enrollment is a management change; it is not
    # licence to change what is running.
    - name: Read current guest power state from the cluster
      ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
      register: pve_ha_cluster_resources_raw
      changed_when: false
      when: pve_ha_manage_all | bool

    - name: Map vmid -> current power status
      ansible.builtin.set_fact:
        pve_ha_status_by_vmid: >-
          {{ dict(
               (pve_ha_cluster_resources_raw.stdout | from_json)
               | selectattr('vmid', 'defined')
               | map(attribute='vmid') | map('string') | list
               | zip(
                   (pve_ha_cluster_resources_raw.stdout | from_json)
                   | selectattr('vmid', 'defined')
                   | map(attribute='status') | list
                 )
             ) }}
      when: pve_ha_manage_all | bool


    - name: Warn about containers with no home node (skipped, cannot be pinned)
      ansible.builtin.debug:
        msg: >-
          pve_ha: these containers have no `node` in the tofu inventory and are
          left OUT of HA — an unpinned guest under HA can be relocated onto a
          node without its storage:
          {{ (containers_from_tofu | default({})) | dict2items
             | rejectattr('value.node', 'defined')
             | map(attribute='key') | list }}
      when:
        - pve_ha_manage_all | bool
        - ((containers_from_tofu | default({})) | dict2items
           | rejectattr('value.node', 'defined') | list) | length > 0

    - name: Add the home-pinned guests to HA (only those not yet managed)
      ansible.builtin.command: >-
        ha-manager add {{ item }}
        --state {{ 'started'
                   if pve_ha_status_by_vmid[item | regex_replace('^ct:', '')]
                      | default('') == 'running'
                   else 'stopped' }}
        --max_restart {{ pve_ha_max_restart }}
        --max_relocate {{ pve_ha_pinned_max_relocate }}
      loop: "{{ pve_ha_home_sids | default([]) }}"
      when:
        - pve_ha_manage_all | bool
        - item not in pve_ha_existing_sids
      changed_when: true

    # Params only. The state of an already-managed guest is left alone: an
    # operator may have stopped or started it deliberately since enrollment.
    - name: Enforce HA params on already-managed home-pinned guests
      ansible.builtin.command: >-
        ha-manager set {{ item }}
        --max_restart {{ pve_ha_max_restart }}
        --max_relocate {{ pve_ha_pinned_max_relocate }}
      loop: "{{ pve_ha_home_sids | default([]) }}"
      when:
        - pve_ha_manage_all | bool
        - item in pve_ha_existing_sids
      # ponytail: idempotent enforce, same rationale as the tier-0 set above.
      changed_when: false

    # One strict rule per home node rather than one per guest: same constraint,
    # a rule set an operator can read.
    - name: Pin each home node's guests to that node (strict; add if absent)
      ansible.builtin.command: >-
        ha-manager rules add node-affinity
        {{ pve_ha_home_rule_prefix }}-{{ item.0 }}
        --resources {{ item.1 | map(attribute='value.vmid') | map('string')
                       | map('regex_replace', '^(.+)$', 'ct:\1')
                       | join(',') }}
        --nodes {{ item.0 }}
        --strict 1
        --comment 'pve_ha: {{ item.0 }} holds these guests rootfs; HA may only restart them here'
      loop: "{{ pve_ha_home_entries | default([]) | groupby('value.node') }}"
      loop_control:
        label: "{{ item.0 }}"
      when:
        - pve_ha_manage_all | bool
        - (pve_ha_home_rule_prefix ~ '-' ~ item.0) not in pve_ha_existing_rules
      changed_when: true

    - name: Enforce membership on the existing home-node pins
      ansible.builtin.command: >-
        ha-manager rules set node-affinity
        {{ pve_ha_home_rule_prefix }}-{{ item.0 }}
        --resources {{ item.1 | map(attribute='value.vmid') | map('string')
                       | map('regex_replace', '^(.+)$', 'ct:\1')
                       | join(',') }}
        --nodes {{ item.0 }}
        --strict 1
      loop: "{{ pve_ha_home_entries | default([]) | groupby('value.node') }}"
      loop_control:
        label: "{{ item.0 }}"
      when:
        - pve_ha_manage_all | bool
        - (pve_ha_home_rule_prefix ~ '-' ~ item.0) in pve_ha_existing_rules
      # ponytail: idempotent enforce, same rationale as the rules above.
      changed_when: false

# Storage replication (pvesr) for the SINGLETON app guests, so ha-manager can
# relocate them to the always-on partner node on node loss (see STORAGE NOTE in
# defaults). Unlike the cluster-wide HA config above (run_once on the config
# host), a pvesr job is NODE-LOCAL: `pvesr create-local-job` must run on the node
# that currently hosts the guest (its SOURCE). So this block runs on EVERY node
# and each node creates jobs only for the guests homed on it. The existing-job
# read is cluster-wide, so a job already present anywhere is skipped — idempotent
# across converges and across a later relocation (Proxmox reverses the job's
# direction itself when a replicated guest migrates). Docker-skipped like above.
- name: Configure pvesr storage replication for singleton app guests
  when:
    - pve_ha_enabled | bool
    - pve_ha_replication_ct_hostnames | length > 0
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - pve_ha
  block:
    - name: Map container hostname -> {vmid, node} from the tofu inventory
      ansible.builtin.set_fact:
        pve_ha_ct_by_host: >-
          {{
            dict(
              (containers_from_tofu | default({})) | dict2items
              | selectattr('value.vmid', 'defined')
              | selectattr('value.node', 'defined')
              | map(attribute='key') | list
              | zip(
                  (containers_from_tofu | default({})) | dict2items
                  | selectattr('value.vmid', 'defined')
                  | selectattr('value.node', 'defined')
                  | map(attribute='value') | list
                )
            )
          }}

    # target = the pair member that is NOT the guest's home node. Guests absent
    # from the inventory, or homed outside the always-on pair, resolve to no job.
    - name: Resolve replication jobs (present guests homed in the always-on pair)
      ansible.builtin.set_fact:
        pve_ha_replication_jobs: >-
          {{ pve_ha_replication_jobs | default([]) + [ {
               'hostname': item,
               'id': (pve_ha_ct_by_host[item].vmid | string) ~ '-'
                     ~ (pve_ha_replication_jobnum | string),
               'source': pve_ha_ct_by_host[item].node,
               'target': (pve_ha_replication_pair
                          | difference([pve_ha_ct_by_host[item].node]) | first)
             } ] }}
      loop: "{{ pve_ha_replication_ct_hostnames }}"
      when:
        - item in pve_ha_ct_by_host
        - pve_ha_ct_by_host[item].node in pve_ha_replication_pair

    - name: Warn about app guests with no replication job (skipped)
      ansible.builtin.debug:
        msg: >-
          pve_ha replication: no job for {{ item }} — absent from the tofu
          inventory, or its home node is outside the always-on pair
          {{ pve_ha_replication_pair }}.
      loop: "{{ pve_ha_replication_ct_hostnames }}"
      when: item not in (pve_ha_replication_jobs | default([])
                         | map(attribute='hostname') | list)

    # pvesr replicates a volume to the SAME storage id on the target node. If the
    # target lacks that storage, the job fails asynchronously on first sync and
    # the converge still reports success — no replica ever exists, silently.
    # (Incident 2026-07-26: pve_ha_replication_pair was pve1+pve2, but the
    # guests' storage (local-zfs) is only on pve1/pve3; every job failed and a
    # singleton guest sat under HA with nothing to relocate to.) Prefer pvesh
    # over parsing /etc/pve/storage.cfg directly: the API already normalizes the
    # ini-style config into JSON the same way the cluster consumes it, so there
    # is no risk of a hand-rolled parser disagreeing with pvesr's own view.
    # run_once: this is a read-only cluster-wide check (pvesh proxies to any
    # node), so one node doing it is enough — no need to repeat it per node.
    - name: Read cluster storage configuration
      ansible.builtin.command: pvesh get /storage --output-format json
      register: pve_ha_storage_raw
      changed_when: false
      run_once: true

    - name: Parse storage-to-nodes availability (empty list = all nodes)
      ansible.builtin.set_fact:
        pve_ha_storage_nodes: >-
          {{ pve_ha_storage_nodes | default({}) | combine({
               item.storage: (item.nodes | default('') | split(',')
                              | reject('equalto', '') | list)
             }) }}
      loop: "{{ pve_ha_storage_raw.stdout | from_json }}"
      loop_control:
        label: "{{ item.storage }}"
      run_once: true

    - name: Read each replication guest's LXC config (to find its volumes' storage ids)
      ansible.builtin.command: >-
        pvesh get /nodes/{{ item.source }}/lxc/{{ pve_ha_ct_by_host[item.hostname].vmid }}/config
        --output-format json
      loop: "{{ pve_ha_replication_jobs | default([]) }}"
      loop_control:
        label: "{{ item.hostname }}"
      register: pve_ha_guest_configs_raw
      changed_when: false
      run_once: true

    - name: Resolve each job's required storage ids from its guest's volumes
      ansible.builtin.set_fact:
        pve_ha_replication_job_storages: >-
          {{ pve_ha_replication_job_storages | default([]) + [ {
               'hostname': item.item.hostname,
               'target': item.item.target,
               'storages': ((item.stdout | from_json) | dict2items
                 | selectattr('key', 'match', '^(rootfs|mp[0-9]+)$')
                 | rejectattr('value', 'match', '^/')
                 | map(attribute='value')
                 | map('regex_replace', '^([^:]+):.*$', '\1')
                 | unique | list)
             } ] }}
      loop: "{{ pve_ha_guest_configs_raw.results }}"
      loop_control:
        label: "{{ item.item.hostname }}"
      run_once: true

    - name: Fail if a replication target lacks a volume's required storage
      ansible.builtin.fail:
        msg: >-
          pve_ha replication: guest '{{ item.0.hostname }}' has a volume on
          storage '{{ item.1 }}', but target node '{{ item.0.target }}' does
          not have that storage. pvesr replicates to the SAME storage id on the
          target, so this job would fail on every sync and leave the guest with
          no replica. Nodes that DO have '{{ item.1 }}':
          {{ (pve_ha_storage_nodes[item.1] | length == 0)
             | ternary('ALL (no nodes restriction)',
                       pve_ha_storage_nodes[item.1] | join(', ')) }}.
          Fix by adding '{{ item.1 }}' to '{{ item.0.target }}' in
          /etc/pve/storage.cfg, or changing pve_ha_replication_pair to a pair
          that shares this storage.
      loop: "{{ pve_ha_replication_job_storages | default([]) | subelements('storages') }}"
      loop_control:
        label: "{{ item.0.hostname }} / {{ item.1 }}"
      when: >-
        (pve_ha_storage_nodes[item.1] | default([]) | length > 0)
        and (item.0.target not in pve_ha_storage_nodes[item.1])
      run_once: true

    # A job that EXISTS is not a job that WORKS. The create step below is
    # create-if-absent, so a job whose replication has permanently broken is
    # skipped on every converge while the guest sits under HA with a replica
    # that is months stale — the same silent-no-replica condition the storage
    # preflight above exists to prevent, arrived at from the other direction.
    #
    # "No common base snapshot" is the one failure that never self-recovers:
    # the source and target no longer share a @__replicate_ snapshot to send an
    # incremental from, so every scheduled run fails identically forever.
    # Proxmox states the remedy in the error itself — delete and re-create the
    # job. Deleting without --force removes the stale volumes on the target, so
    # the re-created job starts from a full sync. Doing it here, before the
    # existing-id read, means the create step below re-creates it in the SAME
    # converge with no second pass and no extra logic.
    #
    # Deliberately narrow: only this error string. A transient failure (target
    # down, disk full, network) clears on its own once the cause is fixed, and
    # deleting a job for one of those would throw away a good replica and force
    # a needless full resync. Everything else stays visible through the
    # pvesr_fail counter the health telemetry emits.
    - name: Read this node's replication job status
      ansible.builtin.command: >-
        pvesh get /nodes/{{ inventory_hostname }}/replication --output-format json
      register: pve_ha_replication_status_raw
      changed_when: false

    - name: Resolve permanently-broken jobs sourced from this node
      ansible.builtin.set_fact:
        pve_ha_broken_replication_ids: >-
          {{ (pve_ha_replication_status_raw.stdout | from_json)
             | selectattr('source', 'equalto', inventory_hostname)
             | selectattr('error', 'defined')
             | selectattr('error', 'search', 'No common base snapshot')
             | map(attribute='id') | list }}

    - name: Delete permanently-broken replication jobs so they are re-created
      ansible.builtin.command: pvesr delete {{ item }}
      loop: "{{ pve_ha_broken_replication_ids }}"
      changed_when: true

    - name: Read current replication jobs (cluster-wide)
      ansible.builtin.command: pvesh get /cluster/replication --output-format json
      register: pve_ha_replication_raw
      changed_when: false

    - name: Parse existing replication job ids
      ansible.builtin.set_fact:
        pve_ha_existing_replication_ids: >-
          {{ (pve_ha_replication_raw.stdout | from_json)
             | map(attribute='id') | list }}

    - name: Create a pvesr job on each guest's source node (only if absent)
      ansible.builtin.command: >-
        pvesr create-local-job {{ item.id }} {{ item.target }}
        --schedule '{{ pve_ha_replication_schedule }}'
        {% if pve_ha_replication_rate | string | length > 0 %}--rate {{ pve_ha_replication_rate }}{% endif %}
        {# No colon: Proxmox percent-encodes it in replication.cfg and re-encodes
           the encoding on each rewrite, so 'pve_ha:' degrades to 'pve_ha%2525253A'
           and keeps growing. Plain words survive round-trips unchanged. #}
        --comment 'pve_ha relocation replica for {{ item.hostname }} -> {{ item.target }}'
      loop: "{{ pve_ha_replication_jobs | default([]) }}"
      loop_control:
        label: "{{ item.id }} ({{ item.source }} -> {{ item.target }})"
      when:
        - inventory_hostname == item.source
        - item.id not in pve_ha_existing_replication_ids
      changed_when: true
