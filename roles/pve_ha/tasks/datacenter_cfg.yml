---
# Cluster-wide HA shutdown policy, via the /cluster/options `ha` property.
# A bare top-level `shutdown_policy` key in datacenter.cfg is outside the
# schema and breaks every ha-manager/pvesh call on the node; the real key is
# `ha.shutdown_policy`, set through the API rather than by editing the file.

- name: Remove the invalid legacy top-level shutdown_policy key
  ansible.builtin.lineinfile:
    path: "{{ pve_ha_datacenter_cfg_path }}"
    regexp: '^[ \t]*shutdown_policy[ \t]*:'
    state: absent
  when: pve_ha_shutdown_policy | length > 0

- name: Read the current cluster HA options
  ansible.builtin.command: "{{ pve_ha_pvesh_bin }} get /cluster/options --output-format json"
  register: pve_ha_cluster_options
  changed_when: false
  when: pve_ha_shutdown_policy | length > 0

- name: Set the cluster HA shutdown policy if it differs
  ansible.builtin.command: >-
    {{ pve_ha_pvesh_bin }} set /cluster/options
    -ha shutdown_policy={{ pve_ha_shutdown_policy }}
  changed_when: true
  when:
    - pve_ha_shutdown_policy | length > 0
    - >-
      ((pve_ha_cluster_options.stdout | from_json).get('ha') or {})
      .get('shutdown_policy', '') != pve_ha_shutdown_policy
