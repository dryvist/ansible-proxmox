---
# Shared by affinity_rules.yml (replication-pair rules) and
# estate_wide_enrollment.yml (home-node pins), included per rule with
# reconcile_name/reconcile_sids set. PVE allows a resource in at most one
# node-affinity rule (ha-manager rejects "already used in another node
# affinity rule" otherwise), but a guest's rule membership can change between
# converges — a replication target appears or moves, a home-pinned singleton
# gains a viable replica. Nothing else strips it from its PREVIOUS rule, so
# it lingers there and blocks the new "add"/"enforce" tasks below. Strip it
# from every other node-affinity rule (or remove that rule if it was its
# only member) before either claims it.
- name: "Strip reassigned members from another node-affinity rule before {{ reconcile_name }}"
  ansible.builtin.command: >-
    ha-manager rules set node-affinity {{ stale_rule.rule }}
    --resources {{ (stale_rule.resources | split(',') | difference(reconcile_sids)) | join(',') }}
    --nodes {{ stale_rule.nodes }}
    --strict {{ stale_rule.strict | default(0) }}
  loop: "{{ pve_ha_node_affinity_rules_raw | rejectattr('rule', 'equalto', reconcile_name) | list }}"
  loop_control:
    loop_var: stale_rule
    label: "{{ stale_rule.rule }}"
  when:
    - (stale_rule.resources | split(',') | intersect(reconcile_sids) | length) > 0
    - (stale_rule.resources | split(',') | difference(reconcile_sids) | length) > 0
  changed_when: true

- name: "Remove a stale node-affinity rule left with no members after reassignment"
  ansible.builtin.command: ha-manager rules remove {{ stale_rule.rule }}
  loop: "{{ pve_ha_node_affinity_rules_raw | rejectattr('rule', 'equalto', reconcile_name) | list }}"
  loop_control:
    loop_var: stale_rule
    label: "{{ stale_rule.rule }}"
  when:
    - (stale_rule.resources | split(',') | intersect(reconcile_sids) | length) > 0
    - (stale_rule.resources | split(',') | difference(reconcile_sids) | length) == 0
  changed_when: true
