---
# Part 3 of 3 (see main.yml). Strict per-node "home pin" rules: an HA-managed
# container with no pvesr replica may only ever be started on the single node
# that holds its rootfs.
#
# The pin is not optional, and it is not the same control as anti-affinity.
# These guests live on node-local ZFS. HA-managed with no node-affinity rule, a
# fence relocates one onto a node where its dataset does not exist; it cannot
# start, HA burns max_restart/max_relocate, and parks it in `error` — a LATCH,
# not a retry, so it stays down until an operator clears it by hand. A negative
# resource-affinity rule keeps a redundant pair apart but says nothing about
# WHERE either half may run, so it does not prevent any of that.
#
# Two scopes, deliberately different:
#   * PINNING (always): every HA-managed container except the pvesr-replicated
#     singletons, which are pinned to the replication pair instead by
#     pve_ha_replication_affinity_rule (affinity_rules.yml).
#   * ENROLLMENT (pve_ha_manage_all only): pulling the REST of the estate into
#     HA. The tier-0 set is enrolled by tier0_resources.yml either way.
#
# Containers only: containers_from_tofu is the container map. A VM that should
# be HA-managed goes in pve_ha_extra_sids, which is not pinned and so must only
# carry VMs on storage every node can reach.
- name: Resolve the home-pin scope
  ansible.builtin.include_tasks: home_pin_scope.yml

- name: Refuse containers with no home node (cannot be pinned)
  ansible.builtin.fail:
    msg: >-
      pve_ha: these containers have no `node` in the tofu inventory and cannot
      be pinned — an unpinned guest under HA can be relocated onto a node
      without its storage: {{ pve_ha_unpinnable_hosts }}
  when:
    - pve_ha_fail_on_unresolved | bool
    - pve_ha_unpinnable_hosts | length > 0

- name: Warn about containers with no home node (non-fatal mode)
  ansible.builtin.debug:
    msg: >-
      pve_ha: these containers have no `node` in the tofu inventory and cannot
      be pinned — an unpinned guest under HA can be relocated onto a node
      without its storage: {{ pve_ha_unpinnable_hosts }}
  when:
    - not (pve_ha_fail_on_unresolved | bool)
    - pve_ha_unpinnable_hosts | length > 0

# Enrollment scope only: the tier-0 guests are already added (and their params
# enforced) by tier0_resources.yml, so re-adding them here would only overwrite
# their bounds with the pinned ones.
- name: Resolve the SIDs to enroll estate-wide
  ansible.builtin.set_fact:
    pve_ha_home_sids: >-
      {{ pve_ha_home_entries | rejectattr('key', 'in', pve_ha_ct_hostnames)
         | map(attribute='value.ansible_pct_vmid') | map('string')
         | map('regex_replace', '^(.+)$', 'ct:\1') | list }}
  when: pve_ha_manage_all | bool

# HA state must follow the guest's CURRENT power state, not a blanket
# `started`. A large share of the estate is deliberately stopped, and
# enrolling those with state=started would have HA boot every one of them
# the moment the rule lands. Enrollment is a management change; it is not
# licence to change what is running.
- name: Read current guest power state from the cluster
  ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
  register: pve_ha_cluster_resources_raw
  changed_when: false
  when: pve_ha_manage_all | bool

- name: Map vmid -> current power status
  ansible.builtin.set_fact:
    pve_ha_status_by_vmid: >-
      {{ dict(
           (pve_ha_cluster_resources_raw.stdout | from_json)
           | selectattr('vmid', 'defined')
           | map(attribute='vmid') | map('string') | list
           | zip(
               (pve_ha_cluster_resources_raw.stdout | from_json)
               | selectattr('vmid', 'defined')
               | map(attribute='status') | list
             )
         ) }}
  when: pve_ha_manage_all | bool

- name: Add the home-pinned guests to HA (only those not yet managed)
  ansible.builtin.command: >-
    ha-manager add {{ item }}
    --state {{ 'started'
               if pve_ha_status_by_vmid[item | regex_replace('^ct:', '')]
                  | default('') == 'running'
               else 'stopped' }}
    --max_restart {{ pve_ha_max_restart }}
    --max_relocate {{ pve_ha_pinned_max_relocate }}
  loop: "{{ pve_ha_home_sids | default([]) }}"
  when:
    - pve_ha_manage_all | bool
    - item not in pve_ha_existing_sids
  changed_when: true

# Params only. The state of an already-managed guest is left alone: an
# operator may have stopped or started it deliberately since enrollment.
- name: Enforce HA params on already-managed home-pinned guests
  ansible.builtin.command: >-
    ha-manager set {{ item }}
    --max_restart {{ pve_ha_max_restart }}
    --max_relocate {{ pve_ha_pinned_max_relocate }}
  loop: "{{ pve_ha_home_sids | default([]) }}"
  when:
    - pve_ha_manage_all | bool
    - item in pve_ha_existing_sids
  # ponytail: idempotent enforce, same rationale as the tier-0 set above.
  changed_when: false

# One strict rule per home node rather than one per guest: same constraint,
# a rule set an operator can read.
- name: Pin each home node's guests to that node (strict; add if absent)
  ansible.builtin.command: >-
    ha-manager rules add node-affinity
    {{ pve_ha_home_rule_prefix }}-{{ item.0 }}
    --resources {{ item.1 | map(attribute='value.ansible_pct_vmid') | map('string')
                   | map('regex_replace', '^(.+)$', 'ct:\1')
                   | join(',') }}
    --nodes {{ item.0 }}
    --strict 1
    --comment 'pve_ha: {{ item.0 }} holds these guests rootfs; HA may only restart them here'
  loop: "{{ pve_ha_home_entries | default([]) | groupby('value.node') }}"
  loop_control:
    label: "{{ item.0 }}"
  when: (pve_ha_home_rule_prefix ~ '-' ~ item.0) not in pve_ha_existing_rules
  changed_when: true

- name: Enforce membership on the existing home-node pins
  ansible.builtin.command: >-
    ha-manager rules set node-affinity
    {{ pve_ha_home_rule_prefix }}-{{ item.0 }}
    --resources {{ item.1 | map(attribute='value.ansible_pct_vmid') | map('string')
                   | map('regex_replace', '^(.+)$', 'ct:\1')
                   | join(',') }}
    --nodes {{ item.0 }}
    --strict 1
  loop: "{{ pve_ha_home_entries | default([]) | groupby('value.node') }}"
  loop_control:
    label: "{{ item.0 }}"
  when: (pve_ha_home_rule_prefix ~ '-' ~ item.0) in pve_ha_existing_rules
  # ponytail: idempotent enforce, same rationale as the rules above.
  changed_when: false
