---
# Pure derivation, no CLI: the HA class each managed guest belongs to.
#
# The class is DERIVED, not listed (see the HA classes block in defaults):
#   * application_ha — a member of a pve_ha_anti_affinity_groups entry. Being
#     in one already asserts a peer exists on another node, so the service
#     survives the guest. No replica, max_relocate 0.
#   * immovable      — a key of pve_ha_immovable_guests, with its reason.
#   * singleton      — everything else, so a guest added later lands here by
#     default and is held to the replica requirement automatically.
#
# There is therefore no "unclassified" case left to guard: a guest cannot fall
# between the lists, because there are no membership lists to fall between.
# What CAN still be wrong is the one declared class, so that is what is checked.

- name: Refuse an immovable declaration that also claims application-level HA
  ansible.builtin.assert:
    that:
      - ((pve_ha_class_immovable | default([]))
         | select('in', pve_ha_class_application | default([])) | list) | length == 0
    fail_msg: >-
      pve_ha: a guest is declared immovable while also being an anti-affinity
      group member. Those are different node-loss stories — the group asserts a
      peer carries the service, immovable asserts nothing can. Pick one.
    quiet: true

# A name here that is under no HA management does nothing at all, and reads as
# a clean converge — the same silent-drift class as a dead membership entry.
- name: Refuse an immovable declaration for a guest that is not HA-managed
  ansible.builtin.assert:
    that:
      - ((pve_ha_class_immovable | default([]))
         | reject('in', (pve_ha_ct_hostnames | default([]))
                        + (pve_ha_vm_names | default([])))
         | list) | length == 0
    fail_msg: >-
      pve_ha: pve_ha_immovable_guests names
      {{ (pve_ha_class_immovable | default([]))
         | reject('in', (pve_ha_ct_hostnames | default([]))
                        + (pve_ha_vm_names | default([]))) | list }},
      which are under no HA management. An exemption for a guest nothing
      manages is inert and hides the drift that produced it.
    quiet: true
  when: pve_ha_fail_on_unresolved | bool
