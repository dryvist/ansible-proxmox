---
# Part 2 of 3 (see main.yml). Anti-affinity rules for redundant pairs, then
# the strict node-affinity pin that keeps singleton app guests on the node
# holding their pvesr replica.
- name: Resolve anti-affinity rule SID sets (present members only)
  ansible.builtin.set_fact:
    pve_ha_affinity_rules: >-
      {{ pve_ha_affinity_rules | default([]) + [ {
           'name': item.name,
           'sids': (item.hostnames | select('in', pve_ha_vmid_by_host)
                    | map('extract', pve_ha_vmid_by_host) | map('string')
                    | map('regex_replace', '^(.+)$', 'ct:\1') | list)
         } ] }}
  loop: "{{ pve_ha_anti_affinity_groups }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read current HA rules
  ansible.builtin.command: pvesh get /cluster/ha/rules --output-format json
  register: pve_ha_rules_raw
  changed_when: false

- name: Parse existing HA rule names
  ansible.builtin.set_fact:
    pve_ha_existing_rules: >-
      {{ (pve_ha_rules_raw.stdout | from_json)
         | map(attribute='rule') | list }}

- name: Add anti-affinity (negative) rules for redundant pairs
  ansible.builtin.command: >-
    ha-manager rules add resource-affinity {{ item.name }}
    --resources {{ item.sids | join(',') }}
    --affinity negative
    --comment 'pve_ha: keep {{ item.name }} members on separate nodes'
  loop: "{{ pve_ha_affinity_rules }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.sids | length >= 2
    - item.name not in pve_ha_existing_rules
  changed_when: true

- name: Enforce membership on existing anti-affinity rules
  ansible.builtin.command: >-
    ha-manager rules set resource-affinity {{ item.name }}
    --resources {{ item.sids | join(',') }}
    --affinity negative
  loop: "{{ pve_ha_affinity_rules }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.sids | length >= 2
    - item.name in pve_ha_existing_rules
  # ponytail: idempotent enforce, same rationale as the resource set above.
  changed_when: false

# Viable replication guests (present + a declared ha_replication_target —
# see replication_scope.yml, included by tier0_resources.yml earlier in this
# same play) grouped by their [node, target] pair. A guest with no target has
# no replica, so it must NOT go in a strict rule (a strict rule with no
# available node would STOP it) — pve_ha_unsafe_singletons already excludes
# those from pve_ha_managed_sids, so grouping only the viable ones here can
# never rule-pin a guest that isn't even under HA.
#
# ONE rule per DISTINCT pair, not one global rule: each guest's target is its
# own declared attribute, so two guests can easily need two different pairs
# (e.g. postgres-apps vs. nautobot/vikunja), and a strict rule naming a node
# with no replica for a guest is worse than no rule.
#
# Rule naming is data-driven, not guessed: whichever pair matches the CURRENT
# live nodes of the rule named pve_ha_replication_affinity_rule (default
# apps-replication-nodes) keeps that name, so the live rule is enforced in
# place rather than renamed and re-created just because the pair grouping
# changed shape. Every other pair gets a derived name.
- name: Resolve the current node set of the legacy-named replication rule (if any)
  ansible.builtin.set_fact:
    pve_ha_legacy_replication_rule_pair_key: >-
      {{ ((pve_ha_rules_raw.stdout | from_json)
          | selectattr('rule', 'equalto', pve_ha_replication_affinity_rule) | list
          | map(attribute='nodes') | first | default('', true))
         | split(',') | reject('equalto', '') | sort | join(',') }}

- name: Group viable replication guests by their [node, target] pair
  ansible.builtin.set_fact:
    pve_ha_replication_pair_groups: >-
      {{ pve_ha_replication_guests | default([]) | selectattr('viable') | groupby('pair_key') }}

- name: Name each pair group's node-affinity rule
  ansible.builtin.set_fact:
    pve_ha_replication_rules: >-
      {{ pve_ha_replication_rules | default([]) + [ {
           'name': (pve_ha_replication_affinity_rule
                    if item.0 == pve_ha_legacy_replication_rule_pair_key
                    else pve_ha_replication_affinity_rule ~ '-' ~ (item.0 | regex_replace(',', '-'))),
           'nodes': item.1[0].pair,
           'sids': item.1 | map(attribute='sid') | list
         } ] }}
  loop: "{{ pve_ha_replication_pair_groups }}"
  loop_control:
    label: "{{ item.0 }}"

- name: Pin each replication pair's viable guests (strict; add if absent)
  ansible.builtin.command: >-
    ha-manager rules add node-affinity {{ item.name }}
    --resources {{ item.sids | join(',') }}
    --nodes {{ item.nodes | join(',') }}
    --strict 1
    --comment 'pve_ha: keep singleton app guests on nodes holding their pvesr replica'
  loop: "{{ pve_ha_replication_rules | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.sids | length > 0
    - item.name not in pve_ha_existing_rules
  changed_when: true

- name: Enforce each replication pair's node-affinity rule (nodes + strict)
  ansible.builtin.command: >-
    ha-manager rules set node-affinity {{ item.name }}
    --resources {{ item.sids | join(',') }}
    --nodes {{ item.nodes | join(',') }}
    --strict 1
  loop: "{{ pve_ha_replication_rules | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.sids | length > 0
    - item.name in pve_ha_existing_rules
  # ponytail: idempotent enforce, same rationale as the resource-affinity set.
  changed_when: false
