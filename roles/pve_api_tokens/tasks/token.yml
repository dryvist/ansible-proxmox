---
# One consumer. A token secret is only ever returned at creation, so the stored
# credential is the source of truth: a token is (re)minted whenever the bucket
# does not hold a secret for this exact token id, or the token is gone from the
# cluster. A mint whose publish then fails is simply re-minted next converge.

- name: Name the identity for {{ pve_api_tokens_consumer.app }}
  ansible.builtin.set_fact:
    pve_api_tokens_user: "{{ pve_api_tokens_consumer.app }}@{{ pve_api_tokens_realm }}"
    pve_api_tokens_id: >-
      {{ pve_api_tokens_consumer.app }}@{{ pve_api_tokens_realm }}!{{ pve_api_tokens_token_name }}
    pve_api_tokens_role_name: "{{ pve_api_tokens_consumer.role | default(pve_api_tokens_role) }}"
    pve_api_tokens_privsep: "{{ pve_api_tokens_consumer.privsep | default(false) | bool }}"
    pve_api_tokens_id_field: "{{ pve_api_tokens_consumer.field_prefix }}_token_id"
    pve_api_tokens_secret_field: "{{ pve_api_tokens_consumer.field_prefix }}_token_secret"

- name: Select ACL paths for {{ pve_api_tokens_consumer.app }}
  ansible.builtin.set_fact:
    pve_api_tokens_acl_paths: "{{ pve_api_tokens_consumer.acl_paths | default(['/']) }}"

- name: Validate the role and ACL paths for {{ pve_api_tokens_consumer.app }}
  ansible.builtin.assert:
    that:
      - pve_api_tokens_acl_paths is sequence
      - pve_api_tokens_acl_paths is not string
      - pve_api_tokens_acl_paths | length > 0
      - pve_api_tokens_acl_paths | length == pve_api_tokens_acl_paths | unique | list | length
      - >-
        pve_api_tokens_consumer.privileges is not defined or
        (pve_api_tokens_role_name != pve_api_tokens_role and
         pve_api_tokens_role_name != 'PVEAuditor')
      - >-
        pve_api_tokens_consumer.privileges is not defined or
        (pve_api_tokens_consumer.privileges is sequence and
         pve_api_tokens_consumer.privileges is not string and
         pve_api_tokens_consumer.privileges | length > 0)
      # A custom-privilege entry is per-guest only: an empty guest set or a
      # missing VMID fails here instead of granting nothing or a wider path.
      - >-
        pve_api_tokens_consumer.privileges is not defined or
        (pve_api_tokens_acl_paths
         | select('match', '^/vms/[0-9]+$') | list | length)
        == pve_api_tokens_acl_paths | length
      - >-
        pve_api_tokens_consumer.acl_path_count is not defined or
        pve_api_tokens_acl_paths | length == pve_api_tokens_consumer.acl_path_count | int
    fail_msg: >-
      {{ pve_api_tokens_consumer.app }}: needs
      {{ pve_api_tokens_consumer.acl_path_count | default('a non-empty set of') }} unique,
      exact /vms/<vmid> ACL paths from
      {{ pve_api_tokens_consumer.acl_source | default('acl_paths') }} (found
      {{ pve_api_tokens_acl_paths | length }}) and a role other than PVEAuditor.
    quiet: true

- name: Read the published credential for {{ pve_api_tokens_consumer.app }}
  community.hashi_vault.vault_kv2_get:
    url: "{{ pve_api_tokens_bao_addr }}"
    token: "{{ pve_api_tokens_bao_token }}"
    engine_mount_point: "{{ pve_api_tokens_kv_mount }}"
    path: "apps/{{ pve_api_tokens_consumer.app }}"
  register: pve_api_tokens_stored
  # Read-only; a check run needs stored token data to preview reconciliation.
  check_mode: false
  failed_when: false
  delegate_to: localhost
  become: false
  no_log: true

# Only a missing path permits writing from scratch. A denied read must stop
# here: writing over a bucket we could not read would drop its other fields.
- name: Reject a denied or unavailable read for {{ pve_api_tokens_consumer.app }}
  ansible.builtin.assert:
    that:
      - >-
        pve_api_tokens_stored.msg is not defined or
        pve_api_tokens_stored.msg is match('^Invalid or missing path')
    quiet: true
    fail_msg: "OpenBao read of apps/{{ pve_api_tokens_consumer.app }} failed; check the publish grant."

- name: Reconcile the custom role for {{ pve_api_tokens_consumer.app }}
  ansible.builtin.include_tasks: custom_role.yml
  when: pve_api_tokens_consumer.privileges is defined

- name: Ensure the dedicated user exists for {{ pve_api_tokens_consumer.app }}
  ansible.builtin.command:
    argv:
      - pveum
      - user
      - add
      - "{{ pve_api_tokens_user }}"
      - --comment
      - "{{ 'Power-management' if pve_api_tokens_consumer.privileges is defined else 'Read-only' }} API identity for {{ pve_api_tokens_consumer.app }} (ansible-proxmox pve_api_tokens)"
  when: >-
    pve_api_tokens_user not in
    (pve_api_tokens_users.stdout | from_json | map(attribute='userid') | list)
  changed_when: true

- name: Grant the default role at the root for {{ pve_api_tokens_consumer.app }}
  ansible.builtin.command:
    argv: [pveum, acl, modify, /, --users, "{{ pve_api_tokens_user }}", --roles, "{{ pve_api_tokens_role_name }}"]
  when: >-
    pve_api_tokens_consumer.privileges is not defined and
    pve_api_tokens_acls.stdout | from_json
    | selectattr('path', 'equalto', '/')
    | selectattr('type', 'equalto', 'user')
    | selectattr('ugid', 'equalto', pve_api_tokens_user)
    | selectattr('roleid', 'equalto', pve_api_tokens_role_name)
    | list | length == 0
  changed_when: true

- name: Remove stale user ACLs for {{ pve_api_tokens_consumer.app }}
  ansible.builtin.command:
    argv: [pveum, acl, delete, "{{ item.path }}", --users, "{{ pve_api_tokens_user }}", --roles, "{{ item.roleid }}"]
  loop: >-
    {{ pve_api_tokens_acls.stdout | from_json
       | selectattr('type', 'equalto', 'user')
       | selectattr('ugid', 'equalto', pve_api_tokens_user) | list }}
  loop_control:
    label: "{{ item.path }} {{ item.roleid }}"
  when:
    - pve_api_tokens_consumer.privileges is defined
    - item.path not in pve_api_tokens_acl_paths or item.roleid != pve_api_tokens_role_name
  changed_when: true

- name: Grant the custom role on each declared path for {{ pve_api_tokens_consumer.app }}
  ansible.builtin.command:
    argv: [pveum, acl, modify, "{{ item }}", --users, "{{ pve_api_tokens_user }}", --roles, "{{ pve_api_tokens_role_name }}", --propagate, '0']
  loop: "{{ pve_api_tokens_acl_paths }}"
  when:
    - pve_api_tokens_consumer.privileges is defined
    - >-
      pve_api_tokens_acls.stdout | from_json
      | selectattr('path', 'equalto', item)
      | selectattr('type', 'equalto', 'user')
      | selectattr('ugid', 'equalto', pve_api_tokens_user)
      | selectattr('roleid', 'equalto', pve_api_tokens_role_name)
      | selectattr('propagate', 'equalto', 0)
      | list | length == 0
  changed_when: true

- name: Remove stale token ACLs for {{ pve_api_tokens_consumer.app }}
  ansible.builtin.command:
    argv: [pveum, acl, delete, "{{ item.path }}", --tokens, "{{ pve_api_tokens_id }}", --roles, "{{ item.roleid }}"]
  loop: >-
    {{ pve_api_tokens_acls.stdout | from_json
       | selectattr('type', 'equalto', 'token')
       | selectattr('ugid', 'equalto', pve_api_tokens_id) | list }}
  loop_control:
    label: "{{ item.path }} {{ item.roleid }}"
  when:
    - pve_api_tokens_consumer.privileges is defined
    - item.path not in pve_api_tokens_acl_paths or item.roleid != pve_api_tokens_role_name
  changed_when: true

- name: Read the user's tokens for {{ pve_api_tokens_consumer.app }}
  ansible.builtin.command:
    argv: [pvesh, get, "/access/users/{{ pve_api_tokens_user }}/token", --output-format, json]
  register: pve_api_tokens_tokens
  changed_when: false
  failed_when: false
  check_mode: false

- name: Decide whether a fresh token is needed for {{ pve_api_tokens_consumer.app }}
  vars:
    pve_api_tokens_bucket: "{{ pve_api_tokens_stored.secret | default({}) }}"
    pve_api_tokens_existing: >-
      {{ (pve_api_tokens_tokens.stdout | from_json | map(attribute='tokenid') | list)
         if pve_api_tokens_tokens.rc == 0 else [] }}
    # A token whose privsep differs from the entry would keep the user's full rights; re-mint it.
    pve_api_tokens_privsep_drift: >-
      {{ ((pve_api_tokens_tokens.stdout | from_json
           | selectattr('tokenid', 'equalto', pve_api_tokens_token_name)
           | map(attribute='privsep', default=0) | map('int') | list)
          if pve_api_tokens_tokens.rc == 0 else [])
         | reject('equalto', (1 if pve_api_tokens_privsep | bool else 0)) | list | length > 0 }}
  ansible.builtin.set_fact:
    pve_api_tokens_token_exists: "{{ pve_api_tokens_existing is contains(pve_api_tokens_token_name) }}"
    pve_api_tokens_mint: >-
      {{ pve_api_tokens_bucket.get(pve_api_tokens_id_field, '') != pve_api_tokens_id
         or pve_api_tokens_bucket.get(pve_api_tokens_secret_field, '') | length == 0
         or pve_api_tokens_existing is not contains(pve_api_tokens_token_name)
         or pve_api_tokens_privsep_drift | bool }}
  no_log: true

- name: Mint and publish a fresh token for {{ pve_api_tokens_consumer.app }}
  when:
    - pve_api_tokens_mint | bool
    - not ansible_check_mode
  block:
    # Nobody holds this token's secret, so removing it breaks no consumer.
    - name: Remove the unpublished token for {{ pve_api_tokens_consumer.app }}
      ansible.builtin.command:
        argv: [pveum, user, token, remove, "{{ pve_api_tokens_user }}", "{{ pve_api_tokens_token_name }}"]
      when: pve_api_tokens_token_exists | bool
      changed_when: true

    - name: Create the token for {{ pve_api_tokens_consumer.app }}
      ansible.builtin.command:
        argv:
          - pveum
          - user
          - token
          - add
          - "{{ pve_api_tokens_user }}"
          - "{{ pve_api_tokens_token_name }}"
          - --privsep
          - "{{ '1' if pve_api_tokens_privsep | bool else '0' }}"
          - --comment
          - "Published to OpenBao apps/{{ pve_api_tokens_consumer.app }}"
          - --output-format
          - json
      register: pve_api_tokens_created
      changed_when: true
      no_log: true

    # Read-merge-write with check-and-set on the version just read, so the
    # bucket's other fields survive and a concurrent writer fails this run
    # instead of being overwritten.
    - name: Publish the token to apps/{{ pve_api_tokens_consumer.app }}
      community.hashi_vault.vault_kv2_write:
        url: "{{ pve_api_tokens_bao_addr }}"
        token: "{{ pve_api_tokens_bao_token }}"
        engine_mount_point: "{{ pve_api_tokens_kv_mount }}"
        path: "apps/{{ pve_api_tokens_consumer.app }}"
        cas: "{{ pve_api_tokens_stored.metadata.version | default(0) }}"
        data: >-
          {{ pve_api_tokens_stored.secret | default({})
             | combine({pve_api_tokens_id_field: pve_api_tokens_id,
                        pve_api_tokens_secret_field: (pve_api_tokens_created.stdout | from_json).value}) }}
      delegate_to: localhost
      become: false
      no_log: true

- name: Grant the custom role to a privsep token on each declared path for {{ pve_api_tokens_consumer.app }}
  ansible.builtin.command:
    argv: [pveum, acl, modify, "{{ item }}", --tokens, "{{ pve_api_tokens_id }}", --roles, "{{ pve_api_tokens_role_name }}", --propagate, '0']
  loop: "{{ pve_api_tokens_acl_paths }}"
  when:
    - pve_api_tokens_consumer.privileges is defined
    - pve_api_tokens_privsep | bool
    # A re-minted token loses its ACLs, and the ACL list read above predates the mint.
    - >-
      pve_api_tokens_mint | bool or
      pve_api_tokens_acls.stdout | from_json
      | selectattr('path', 'equalto', item)
      | selectattr('type', 'equalto', 'token')
      | selectattr('ugid', 'equalto', pve_api_tokens_id)
      | selectattr('roleid', 'equalto', pve_api_tokens_role_name)
      | selectattr('propagate', 'equalto', 0)
      | list | length == 0
  changed_when: true

- name: Read the latest credential for {{ pve_api_tokens_consumer.app }}
  community.hashi_vault.vault_kv2_get:
    url: "{{ pve_api_tokens_bao_addr }}"
    token: "{{ pve_api_tokens_bao_token }}"
    engine_mount_point: "{{ pve_api_tokens_kv_mount }}"
    path: "apps/{{ pve_api_tokens_consumer.app }}"
  register: pve_api_tokens_certificate_stored
  # Read-only; a check run needs stored certificate data to preview publication.
  check_mode: false
  failed_when: false
  delegate_to: localhost
  become: false
  no_log: true
  when: pve_api_tokens_consumer.certificate_field is defined

- name: Reject a denied certificate read for {{ pve_api_tokens_consumer.app }}
  ansible.builtin.assert:
    that:
      - >-
        pve_api_tokens_certificate_stored.msg is not defined or
        pve_api_tokens_certificate_stored.msg is match('^Invalid or missing path')
    quiet: true
    fail_msg: "OpenBao read of apps/{{ pve_api_tokens_consumer.app }} failed; check the publish grant."
  when: pve_api_tokens_consumer.certificate_field is defined

- name: Publish the cluster CA for {{ pve_api_tokens_consumer.app }}
  community.hashi_vault.vault_kv2_write:
    url: "{{ pve_api_tokens_bao_addr }}"
    token: "{{ pve_api_tokens_bao_token }}"
    engine_mount_point: "{{ pve_api_tokens_kv_mount }}"
    path: "apps/{{ pve_api_tokens_consumer.app }}"
    cas: "{{ pve_api_tokens_certificate_stored.metadata.version | default(0) }}"
    data: >-
      {{ pve_api_tokens_certificate_stored.secret | default({})
         | combine({pve_api_tokens_consumer.certificate_field:
                    pve_api_tokens_cluster_ca.content | b64decode}) }}
  delegate_to: localhost
  become: false
  no_log: true
  when:
    - pve_api_tokens_consumer.certificate_field is defined
    - not ansible_check_mode
    - >-
      pve_api_tokens_certificate_stored.secret | default({})
      | dict2items
      | selectattr('key', 'equalto', pve_api_tokens_consumer.certificate_field)
      | map(attribute='value') | first | default('', true)
      != pve_api_tokens_cluster_ca.content | b64decode
