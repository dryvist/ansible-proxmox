---
# NAS Storage role tasks
# Serves already-existing ZFS datasets over Samba.
#
# This role does NOT create datasets, set quotas or manage mountpoints. Those
# belong to zfs_pools, which provisions them from the same per-node
# node_storage declaration that the shares are derived from -- so a share can
# only ever name a dataset that zfs_pools has already made. Two roles both
# creating datasets is how the old global NAS ended up with an identical
# rpool/data/nas on every node.
#
# playbooks/site.yml skips this role entirely on a node that declares no
# share, so reaching here means nas_storage_shares is non-empty.
# systemd tasks are skipped in Docker containers (molecule testing).

# ============================================================
# Input validation
# ============================================================

- name: Validate Samba share definitions
  ansible.builtin.assert:
    that:
      - (nas_storage_shares | map(attribute='name') | list | unique | length) == (nas_storage_shares | length)
      - (nas_storage_shares | map(attribute='path') | list | unique | length) == (nas_storage_shares | length)
      - item.name is defined and item.name | length > 0
      - item.path is defined
      - item.path.startswith('/')
      - "'..' not in item.path"
    fail_msg: "Invalid Samba share definition: {{ item | to_nice_json }}"
  loop: "{{ nas_storage_shares }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - nas_storage
    - nas_storage_samba

- name: Validate managed Samba users
  ansible.builtin.assert:
    that:
      - (nas_storage_managed_users | map(attribute='name') | list | unique | length) == (nas_storage_managed_users | length)
      - item.password_secret_env is defined
      - item.password_secret_env | length > 0
    fail_msg: "Invalid managed Samba user definition: {{ item | to_nice_json }}"
  loop: "{{ nas_storage_managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: nas_storage_managed_users | length > 0
  tags:
    - nas_storage
    - nas_storage_samba

# ============================================================
# Group and directories
# ============================================================

- name: Create NAS group
  ansible.builtin.group:
    name: "{{ nas_storage_group_name }}"
    state: present
  tags:
    - nas_storage
    - nas_storage_samba

- name: Create share directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.force_group | default(nas_storage_group_name, true) }}"
    mode: "{{ item.directory_mask | default('0775', true) }}"
  loop: "{{ nas_storage_shares }}"
  loop_control:
    label: "{{ item.path }}"
  tags:
    - nas_storage

# ============================================================
# Samba installation and account management
# ============================================================

- name: Install Samba packages
  ansible.builtin.apt:
    name: "{{ nas_storage_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - nas_storage
    - nas_storage_samba

- name: Ensure Samba password fingerprint directory exists
  ansible.builtin.file:
    path: "{{ nas_storage_password_fingerprint_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags:
    - nas_storage
    - nas_storage_samba

- name: Read the managed-user Samba passwords from OpenBao
  ansible.builtin.uri:
    url: "{{ nas_storage_bao_addr }}/v1/{{ nas_storage_bao_path }}"
    headers:
      X-Vault-Token: "{{ nas_storage_bao_token }}"
    follow_redirects: all
  register: nas_storage_bao_read
  delegate_to: localhost
  run_once: true
  become: false
  no_log: true
  when:
    - nas_storage_managed_users | length > 0
    - nas_storage_bao_addr | length > 0
    - nas_storage_bao_token | length > 0
  tags:
    - nas_storage
    - nas_storage_samba

- name: Set the managed-user password map
  ansible.builtin.set_fact:
    nas_storage_passwords: >-
      {{ ((nas_storage_bao_read.json | default({}, true)).data | default({}, true)).data
         | default(nas_storage_passwords | default({}, true), true) }}
  run_once: true
  no_log: true
  when:
    - nas_storage_managed_users | length > 0
    - nas_storage_bao_read is defined
    - not nas_storage_bao_read.skipped | default(false)
  tags:
    - nas_storage
    - nas_storage_samba

- name: Verify Samba password secrets are available
  ansible.builtin.assert:
    that:
      - nas_storage_passwords[item.name ~ nas_storage_password_field_suffix] | default('', true) | length > 0
    fail_msg: >-
      No password for managed Samba user {{ item.name }}. It is read from
      {{ nas_storage_bao_path }}, field
      {{ item.name }}{{ nas_storage_password_field_suffix }}. Check that the
      converge has BAO_ADDR and BAO_TOKEN, and that the field exists.
  loop: "{{ nas_storage_managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: nas_storage_managed_users | length > 0
  no_log: true
  tags:
    - nas_storage
    - nas_storage_samba

- name: Create managed NAS users
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: present
    group: "{{ nas_storage_group_name }}"
    groups: "{{ item.unix_groups | default([nas_storage_group_name]) }}"
    append: true
    shell: "{{ item.shell | default('/usr/sbin/nologin') }}"
    create_home: "{{ item.create_home | default(false) }}"
    password_lock: true
    system: true
  loop: "{{ nas_storage_managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: nas_storage_managed_users | length > 0
  tags:
    - nas_storage
    - nas_storage_samba

- name: Build desired Samba password hash map
  ansible.builtin.set_fact:
    nas_storage_password_hashes: >-
      {{
        (nas_storage_password_hashes | default({}))
        | combine({item.name: (nas_storage_passwords[item.name ~ nas_storage_password_field_suffix] | hash('sha256'))})
      }}
  loop: "{{ nas_storage_managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: nas_storage_managed_users | length > 0
  no_log: true
  tags:
    - nas_storage
    - nas_storage_samba

- name: Check existing Samba users
  ansible.builtin.command:
    cmd: "pdbedit -L -u {{ item.name }}"
  register: nas_storage_samba_user_checks
  changed_when: false
  failed_when: false
  loop: "{{ nas_storage_managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: nas_storage_managed_users | length > 0
  tags:
    - nas_storage
    - nas_storage_samba

- name: Check stored password fingerprints
  ansible.builtin.stat:
    path: "{{ nas_storage_password_fingerprint_dir }}/{{ item.name }}.sha256"
  register: nas_storage_password_fingerprint_stats
  loop: "{{ nas_storage_managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: nas_storage_managed_users | length > 0
  no_log: true
  tags:
    - nas_storage
    - nas_storage_samba

- name: Load stored password fingerprints
  ansible.builtin.slurp:
    src: "{{ nas_storage_password_fingerprint_dir }}/{{ item.name }}.sha256"
  register: nas_storage_password_fingerprint_contents
  loop: "{{ nas_storage_managed_users }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: nas_storage_user_index
  when:
    - nas_storage_managed_users | length > 0
    - nas_storage_password_fingerprint_stats.results[nas_storage_user_index].stat.exists
  no_log: true
  tags:
    - nas_storage
    - nas_storage_samba

- name: Add Samba users to passdb
  ansible.builtin.command:
    cmd: "smbpasswd -s -a {{ item.name }}"
    stdin: "{{ nas_storage_passwords[item.name ~ nas_storage_password_field_suffix] }}\n{{ nas_storage_passwords[item.name ~ nas_storage_password_field_suffix] }}"
  loop: "{{ nas_storage_managed_users }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: nas_storage_user_index
  when:
    - nas_storage_managed_users | length > 0
    - nas_storage_samba_user_checks.results[nas_storage_user_index].rc != 0
  changed_when: true
  no_log: true
  tags:
    - nas_storage
    - nas_storage_samba

- name: Rotate Samba passwords when fingerprints drift
  ansible.builtin.command:
    cmd: "smbpasswd -s {{ item.name }}"
    stdin: "{{ nas_storage_passwords[item.name ~ nas_storage_password_field_suffix] }}\n{{ nas_storage_passwords[item.name ~ nas_storage_password_field_suffix] }}"
  loop: "{{ nas_storage_managed_users }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: nas_storage_user_index
  when:
    - nas_storage_managed_users | length > 0
    - nas_storage_samba_user_checks.results[nas_storage_user_index].rc == 0
    - >-
      not nas_storage_password_fingerprint_stats.results[nas_storage_user_index].stat.exists
      or (
        (nas_storage_password_fingerprint_contents.results[nas_storage_user_index].content
          | default('') | b64decode | trim)
        != nas_storage_password_hashes[item.name]
      )
  changed_when: true
  no_log: true
  tags:
    - nas_storage
    - nas_storage_samba

- name: Persist Samba password fingerprints
  ansible.builtin.copy:
    dest: "{{ nas_storage_password_fingerprint_dir }}/{{ item.name }}.sha256"
    content: "{{ nas_storage_password_hashes[item.name] }}\n"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ nas_storage_managed_users }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: nas_storage_user_index
  when:
    - nas_storage_managed_users | length > 0
    - >-
      nas_storage_samba_user_checks.results[nas_storage_user_index].rc != 0
      or not nas_storage_password_fingerprint_stats.results[nas_storage_user_index].stat.exists
      or (
        (nas_storage_password_fingerprint_contents.results[nas_storage_user_index].content
          | default('') | b64decode | trim)
        != nas_storage_password_hashes[item.name]
      )
  no_log: true
  tags:
    - nas_storage
    - nas_storage_samba

# ============================================================
# Samba configuration
# ============================================================

- name: Create Samba include directory
  ansible.builtin.file:
    path: /etc/samba/smb.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - nas_storage
    - nas_storage_samba

- name: Template smb.conf
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    validate: "{{ nas_storage_smb_validate_cmd }}"
  notify: Restart smbd
  tags:
    - nas_storage
    - nas_storage_samba

- name: Template Samba share configurations
  ansible.builtin.template:
    src: share.conf.j2
    dest: "/etc/samba/smb.conf.d/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
    validate: "{{ nas_storage_smb_validate_cmd }}"
  loop: "{{ nas_storage_shares }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart smbd
  tags:
    - nas_storage
    - nas_storage_samba

- name: Enable and start smbd
  ansible.builtin.systemd:
    name: smbd
    enabled: true
    state: started
  when: ansible_virtualization_type != 'docker'
  tags:
    - nas_storage
    - nas_storage_samba
