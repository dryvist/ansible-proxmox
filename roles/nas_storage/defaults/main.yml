---
# NAS Storage role defaults

# OpenTofu-sourced NAS config injected by playbooks/load_tofu.yml.
nas_storage_config: >-
  {{
    nas_storage_from_tofu
    | default(hostvars[inventory_hostname].nas_storage_from_tofu | default({}), true)
  }}

# Samba service configuration, from node_storage.<node>.smb
nas_storage_group_name: "{{ nas_storage_config.group_name | default('nas') }}"
nas_storage_smb_workgroup: "{{ nas_storage_config.workgroup | default('WORKGROUP') }}"

# macOS Finder/Time Machine integration via vfs_fruit (global). Enables
# fruit:* options and per-share `time_machine: true`. Harmless for non-Mac.
nas_storage_macos_optimized: "{{ nas_storage_config.macos_optimized | default(true) }}"
nas_storage_packages:
  - samba
  - samba-common-bin
  - smbclient
nas_storage_password_fingerprint_dir: "/etc/samba/password-fingerprints"

# Samba config validation command. Wrapped in `sh -c` because Ansible's
# template `validate:` parameter runs via shlex.split (no shell), so a bare
# `testparm -s %s 2>/dev/null` would treat `2>/dev/null` as a positional
# hostname argument and fail with
# "ERROR: You must specify both a machine name and an IP address."
# The `%s` is double-quoted to handle Ansible temp paths containing spaces.
nas_storage_smb_validate_cmd: 'sh -c "testparm -s \"%s\" 2>/dev/null"'

# Declarative Samba account management, from node_storage.<node>.smb.
nas_storage_managed_users: "{{ nas_storage_config.managed_users | default([], true) }}"

# Shares, each derived by playbooks/load_tofu.yml from the `smb` block on the
# dataset it serves. There is deliberately NO single-share fallback: a share
# with no dataset behind it is what the per-dataset contract exists to prevent,
# and playbooks/site.yml already skips this role when the list is empty.
nas_storage_shares: "{{ nas_storage_config.shares | default([], true) }}"

# Managed-account identities come from OpenBao, not the process environment.
# The converge runner exports BAO_ADDR and a short-lived BAO_TOKEN for exactly
# this kind of controller-side read (scripts/run-ansible.sh).
#
# Both halves of the identity are secrets: an account is selected by its ROLE
# and resolves to the fields `<secret_prefix>_username` and
# `<secret_prefix>_password`. The login name is never written into the
# declaration, into a field name, or into converge output.
#
# THE POLICY GRANT IS NOT IMPLICIT. An earlier revision of this comment claimed
# the ansible AppRole "already covers secret/data/apps/*". It does not, and by
# design: ansible-converge-policy.hcl.j2 enumerates exact paths and states that
# there is deliberately no apps/* wildcard. Adding a consumer here means adding
# its path there. Without the grant this read returns 403, which under `no_log`
# is indistinguishable from a missing field.
nas_storage_bao_addr: >-
  {{ lookup('env', 'BAO_ADDR')
     | default(lookup('env', 'VAULT_ADDR') | default('', true), true) }}
nas_storage_bao_token: "{{ lookup('env', 'BAO_TOKEN') | default('', true) }}"
nas_storage_bao_path: secret/data/apps/nas
nas_storage_username_field_suffix: _username
nas_storage_password_field_suffix: _password
