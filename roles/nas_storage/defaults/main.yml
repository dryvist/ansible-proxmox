---
# NAS Storage role defaults

# OpenTofu-sourced NAS config injected by playbooks/load_tofu.yml.
nas_storage_config: >-
  {{
    nas_storage_from_tofu
    | default(hostvars[inventory_hostname].nas_storage_from_tofu | default({}), true)
  }}

# ZFS dataset configuration
nas_storage_zfs_dataset: "{{ nas_storage_config.zfs_dataset | default('rpool/data/nas') }}"
nas_storage_zfs_quota: "{{ nas_storage_config.zfs_quota | default('1T') }}"
nas_storage_mount_point: "{{ nas_storage_config.mount_point | default('/mnt/nas') }}"
nas_storage_group_name: "{{ nas_storage_config.group_name | default('nas') }}"

# Samba configuration
nas_storage_smb_share_name: "{{ nas_storage_config.smb_share_name | default('nas') }}"
nas_storage_smb_workgroup: "WORKGROUP"
# macOS Finder/Time Machine integration via vfs_fruit (global). Enables
# fruit:* options and per-share `time_machine: true`. Harmless for non-Mac.
nas_storage_macos_optimized: "{{ nas_storage_config.macos_optimized | default(true) }}"
nas_storage_smb_valid_users: "{{ nas_storage_config.smb_valid_users | default('@' ~ nas_storage_group_name) }}"
nas_storage_packages:
  - samba
  - samba-common-bin
  - smbclient
nas_storage_password_fingerprint_dir: "/etc/samba/password-fingerprints"

# Samba config validation command. Wrapped in `sh -c` because Ansible's
# template `validate:` parameter runs via shlex.split (no shell), so a bare
# `testparm -s %s 2>/dev/null` would treat `2>/dev/null` as a positional
# hostname argument and fail with
# "ERROR: You must specify both a machine name and an IP address."
# The `%s` is double-quoted to handle Ansible temp paths containing spaces.
nas_storage_smb_validate_cmd: 'sh -c "testparm -s \"%s\" 2>/dev/null"'

# Subdirectories to create under mount point
nas_storage_directories: "{{ nas_storage_config.directories | default(['huggingface/hub', 'ollama/models', 'media', 'backups']) }}"

# Declarative Samba account management.
nas_storage_managed_users: "{{ nas_storage_config.managed_users | default([]) }}"

# Backward-compatible single-share fallback when OpenTofu does not provide shares.
nas_storage_shares: >-
  {{
    nas_storage_config.shares
    | default(
        [
          {
            'name': nas_storage_smb_share_name,
            'path': nas_storage_mount_point,
            'valid_users': nas_storage_smb_valid_users,
            'browsable': true,
            'read_only': false,
            'force_group': nas_storage_group_name,
            'create_mask': '0664',
            'directory_mask': '0775',
            'comment': 'Primary NAS root share'
          }
        ]
      )
  }}

# Managed-user Samba passwords come from OpenBao, not the process environment.
# The converge runner exports BAO_ADDR and a short-lived BAO_TOKEN for exactly
# this kind of controller-side read (scripts/run-ansible.sh), and the ansible
# AppRole policy already covers `secret/data/apps/*` — so this needs no new
# grant. A user's password is the field `<name>_smb_password`.
nas_storage_bao_addr: >-
  {{ lookup('env', 'BAO_ADDR')
     | default(lookup('env', 'VAULT_ADDR') | default('', true), true) }}
nas_storage_bao_token: "{{ lookup('env', 'BAO_TOKEN') | default('', true) }}"
nas_storage_bao_path: secret/data/apps/nas
nas_storage_password_field_suffix: _smb_password
