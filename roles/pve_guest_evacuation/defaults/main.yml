---
# Archive-only, single-guest evacuation from pve2 to a pve3-hosted shared
# staging storage. This role is deliberately inert unless explicitly enabled.
pve_guest_evacuation_enabled: false
pve_guest_evacuation_phase: archive
pve_guest_evacuation_source_node: pve2
pve_guest_evacuation_target_node: pve540
pve_guest_evacuation_staging_host: pve3
# The source's Proxmox NODE name. The *_node vars above are inventory keys
# (they are delegate_to targets and hostvars lookups); a /nodes/<x>/ API path
# and the /cluster/resources `node` field are node names. Resolve one from the
# other so the two can differ.
pve_guest_evacuation_source_pve_node: >-
  {{ hostvars[pve_guest_evacuation_source_node].proxmox_node_name
     | default(pve_guest_evacuation_source_node) }}
pve_guest_evacuation_staging_storage: ""
pve_guest_evacuation_staging_server: ""
pve_guest_evacuation_staging_export: ""
pve_guest_evacuation_evidence_dir: ""
pve_guest_evacuation_guest_vmid: null
pve_guest_evacuation_run_id: ""
pve_guest_evacuation_shutdown_timeout: 180
pve_guest_evacuation_staging_headroom_percent: 20
# VZDump's working directory must be local. The staging NFS export uses
# root_squash, which cannot host the remapped workspace of an unprivileged LXC.
pve_guest_evacuation_tmpdir: /var/tmp
# Zero is Proxmox's native auto mode: use half of the available CPU cores.
pve_guest_evacuation_zstd_threads: 0
