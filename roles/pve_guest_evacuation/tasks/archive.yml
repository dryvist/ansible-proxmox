---
# This is intentionally the first, self-contained slice of the evacuation.
# It writes one verified VZDump archive and never restores, migrates, joins a
# cluster, changes storage, or removes the source guest.
#
# The phases below are ORDER-DEPENDENT: each proves a precondition the next
# phase relies on, and the source guest is never touched until every
# preflight check has passed. Do not reorder these includes.

- name: Run preflight checks and resolve the exact guest to archive
  ansible.builtin.include_tasks: preflight_checks.yml

- name: Prove independent staging storage and write preflight evidence
  ansible.builtin.include_tasks: staging_preflight_evidence.yml

- name: Stop the source guest and create the VZDump archive
  ansible.builtin.include_tasks: stop_and_backup.yml

- name: Verify the archive and record verified evidence
  ansible.builtin.include_tasks: verify_and_record.yml
