---
# Crash Diagnostics role defaults

# =============================================================================
# PACKAGE INSTALLATION
# =============================================================================

# Core crash/debug packages
# Note: htop, iotop, lm-sensors, rasdaemon installed by common role
# Note: sysstat installed by proxmox_monitoring role
crash_diagnostics_packages:
  # Crash dump tools
  - kdump-tools # Kernel crash dump capture
  - crash # Kernel crash analysis

  # System tracing
  - strace # System call tracer

  # Network diagnostics
  - tcpdump # Network packet analyzer
  - nmap # Network scanner
  - traceroute # Network path tracing
  - socat # Multipurpose relay

  # Process/file diagnostics
  - lsof # List open files
  - psmisc # fuser, killall, pstree

  # Hardware monitoring
  - smartmontools # Disk SMART monitoring (provides smartd)
  - ipmitool # IPMI/BMC query + ipmievd (SEL to syslog) on hosts with a BMC
  - nvme-cli # NVMe health/SMART CLI (nvme smart-log)
  # Note: lm-sensors CLI + service are provided by the common role; not
  # duplicated here.

  # MCE/EDAC hardware error detection
  # Note: mcelog is deprecated on newer kernels; rasdaemon handles MCE logging
  - rasdaemon # RAS daemon for hardware error logging (replaces mcelog)
  - edac-utils # EDAC (Error Detection and Correction) utilities

  # DIMM identification and memory testing
  - i2c-tools # decode-dimms for DIMM SPD data
  - memtest86+ # Boot-time memory testing

# =============================================================================
# SMART DISK MONITORING (smartd)
# =============================================================================

# smartd config file (device-agnostic; deployed on physical hosts only)
crash_diagnostics_smartd_conf: /etc/smartd.conf

# smartd DEVICESCAN directive line. Auto-discovers all disks and: -a (all
# attributes), -o on (offline data collection), -S on (attribute autosave),
# -s scheduled short (daily 02:00) + long (Saturday 03:00) self-tests, -W
# temperature warning. The -W thresholds (diff, info, crit degrees C) are the
# fleet calibration knob — tune per drive class without editing the template.
crash_diagnostics_smartd_directives: "DEVICESCAN -a -o on -S on -s (S/../.././02|L/../../6/03) -W 4,45,55"

# =============================================================================
# SYSCTL CONFIGURATION
# =============================================================================

# Comprehensive kernel panic and debug settings
crash_diagnostics_sysctl_settings:
  # Panic behavior - auto-reboot after crash
  - name: kernel.panic
    value: "10"
    comment: "Reboot 10 seconds after panic"

  - name: kernel.panic_on_oops
    value: "1"
    comment: "Panic on kernel oops"

  # Soft lockup detection
  - name: kernel.softlockup_panic
    value: "1"
    comment: "Panic on soft lockup (CPU stuck in kernel)"

  - name: kernel.softlockup_all_cpu_backtrace
    value: "1"
    comment: "Dump all CPU backtraces on soft lockup"

  # Hard lockup detection
  - name: kernel.hardlockup_panic
    value: "1"
    comment: "Panic on hard lockup (CPU not responding to NMI)"

  - name: kernel.hardlockup_all_cpu_backtrace
    value: "1"
    comment: "Dump all CPU backtraces on hard lockup"

  # Hung task detection
  - name: kernel.hung_task_panic
    value: "1"
    comment: "Panic on hung task (task stuck in D state)"

  # NMI handling
  - name: kernel.nmi_watchdog
    value: "1"
    comment: "Enable NMI watchdog"

  - name: kernel.panic_on_io_nmi
    value: "1"
    comment: "Panic on I/O channel NMI"

  - name: kernel.panic_on_unrecovered_nmi
    value: "1"
    comment: "Panic on unrecovered NMI"

  - name: kernel.unknown_nmi_panic
    value: "1"
    comment: "Panic on unknown NMI"

  # OOM handling
  - name: vm.panic_on_oom
    value: "{{ crash_diagnostics_panic_on_oom | default(0) }}"
    comment: "Panic on OOM instead of killing processes (default: disabled to allow selective process termination)"

  # Watchdog settings
  - name: kernel.watchdog_thresh
    value: "10"
    comment: "Watchdog threshold in seconds"

  # Logging settings for maximum debug output
  - name: kernel.printk
    value: "7 7 7 7"
    comment: "Log everything (console_loglevel, default_message_loglevel, minimum_console_loglevel, default_console_loglevel)"

  - name: kernel.printk_delay
    value: "0"
    comment: "No delay between printk messages"

  - name: kernel.printk_ratelimit
    value: "0"
    comment: "Disable printk rate limiting"

  - name: kernel.printk_ratelimit_burst
    value: "10000"
    comment: "High burst limit for printk"

  # Note: kernel.print_fatal_signals is not available on all kernels.
  # Note: edac.edac_report is a kernel module parameter (not sysctl) and is set via GRUB instead.

# =============================================================================
# GRUB CONFIGURATION
# =============================================================================

# GRUB drop-in config file (use .d directory for upgrade safety)
crash_diagnostics_grub_dropin: /etc/default/grub.d/99-crash-diagnostics.cfg

# GRUB kernel parameters for panic behavior
# These are set at boot time before sysctl runs
crash_diagnostics_grub_params:
  - nmi_watchdog=1
  - softlockup_panic=1
  - hung_task_panic=1
  - mce=3 # Maximum MCE verbosity (0=off, 1=default, 2=CMCI, 3=all)
  - edac_report=1 # Enable EDAC reporting at boot
  # An NVMe device may advertise a deep non-operational power state that it does
  # not reliably wake from. When that happens every read against the root pool
  # blocks for well over a minute: services stall, sshd stops answering, and the
  # host reads as dead while the kernel is still alive and the drive reports
  # perfect health. Capping the tolerated transition latency at 0 keeps the
  # device in an operational state. Harmless on hosts with no NVMe, and the few
  # idle watts it costs are not worth a hypervisor that power-naps its root disk.
  - nvme_core.default_ps_max_latency_us=0

# Where the sysctl settings above are persisted. This MUST be a file systemd
# actually reads. The module default is /etc/sysctl.conf, which systemd only
# honours through a distro-shipped symlink in /etc/sysctl.d/ — absent that
# symlink the file is ignored in full, and because sysctl_set also applies each
# value live, a converge still reports success while nothing survives the next
# reboot. That is how hosts ended up armed to panic (from the GRUB params above,
# which do persist) but not to reboot, turning every recoverable panic into a
# dark host waiting on a human.
crash_diagnostics_sysctl_file: /etc/sysctl.d/60-crash-diagnostics.conf

# =============================================================================
# CLEANUP
# =============================================================================

# Old sysctl files to remove (replaced by direct sysctl module management)
crash_diagnostics_sysctl_cleanup:
  - /etc/sysctl.d/99-debug.conf
  - /etc/sysctl.d/99-crash-diagnostics.conf
  # Hand-applied stopgap written during the incident that exposed the above.
  # Same settings, superseded by crash_diagnostics_sysctl_file.
  - /etc/sysctl.d/60-crash-reboot.conf

# =============================================================================
# BOOT-TIME MEMORY LOGGING
# =============================================================================

# Directory to store memory configuration logs
crash_diagnostics_memory_log_dir: /var/log/memory-config

# Number of boot logs to retain
crash_diagnostics_memory_log_retention: 30

# Script location
crash_diagnostics_memory_logger_script: /usr/local/bin/memory-config-logger.sh

# =============================================================================
# REAL-TIME MCE MONITORING
# =============================================================================

# MCE monitor log file
crash_diagnostics_mce_log_file: /var/log/mce-monitor.log

# MCE monitor script location
crash_diagnostics_mce_monitor_script: /usr/local/bin/mce-monitor.sh
