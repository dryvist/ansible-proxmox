---
# When Proxmox uses ZFS on root with proxmox-boot-tool, memtest86+ must be
# installed on the separate FAT32 boot partition, NOT in /boot/ on the ZFS root.
# The standard memtest86+ package installs to /boot/ which is inaccessible
# from the boot partition's GRUB configuration.
#
# Every UUID in /etc/kernel/proxmox-boot-uuids is handled, so a mirrored rpool
# gets the memtest files on all of its ESPs. A UUID whose partition no longer
# exists is a normal state after a boot disk replacement — proxmox-boot-tool
# only warns about it — so the lookup reports it for the operator instead of
# failing the play. Running 'proxmox-boot-tool clean' is the operator's call,
# never done from this role.
#
# ESPs are mounted with state=ephemeral, so nothing is written to /etc/fstab.
# The GRUB custom.cfg mechanism only applies where proxmox-boot-tool boots
# through GRUB (legacy BIOS); UEFI hosts run systemd-boot, which ignores
# grub/custom.cfg and cannot execute linux16, so the install is skipped there.

# Earlier versions wrote a permanent fstab line for the temporary mount, keyed
# by kernel device name and without nofail; systemd remounts it at every boot
# and a renamed or missing device can stall boot. Cleanup runs on every host
# regardless of firmware or proxmox-boot-tool state. absent_from_fstab only
# edits fstab — it must not unmount whatever is mounted at the path now, which
# the task after it handles.
- name: Remove legacy fstab entry for the temporary boot mount
  ansible.posix.mount:
    path: /tmp/ansible-boot-partition
    state: absent_from_fstab
  tags:
    - crash_diagnostics
    - memtest

- name: Unmount leftover temporary boot mount
  ansible.posix.mount:
    path: /tmp/ansible-boot-partition
    state: unmounted
  tags:
    - crash_diagnostics
    - memtest

- name: Remove leftover temporary boot mount point
  ansible.builtin.file:
    path: /tmp/ansible-boot-partition
    state: absent
  tags:
    - crash_diagnostics
    - memtest

- name: Check for UEFI boot
  ansible.builtin.stat:
    path: /sys/firmware/efi
  register: crash_diagnostics_uefi_firmware
  tags:
    - crash_diagnostics
    - memtest

- name: Report memtest is not handled on UEFI systemd-boot systems
  ansible.builtin.debug:
    msg: >-
      Boot firmware is UEFI, so proxmox-boot-tool installs systemd-boot, which
      ignores grub/custom.cfg (and linux16 is BIOS-only). memtest86+ is not
      installed on the ESP; configure it through systemd-boot instead.
  when: crash_diagnostics_uefi_firmware.stat.exists
  tags:
    - crash_diagnostics
    - memtest

- name: Check if proxmox-boot-tool manages boot
  ansible.builtin.stat:
    path: /etc/kernel/proxmox-boot-uuids
  register: crash_diagnostics_proxmox_boot_uuids
  tags:
    - crash_diagnostics
    - memtest

- name: Read boot partition UUIDs from proxmox-boot-tool config
  ansible.builtin.slurp:
    src: /etc/kernel/proxmox-boot-uuids
  register: crash_diagnostics_boot_uuids_content
  when: crash_diagnostics_proxmox_boot_uuids.stat.exists
  tags:
    - crash_diagnostics
    - memtest

- name: List boot partition UUIDs from proxmox-boot-tool config
  ansible.builtin.set_fact:
    crash_diagnostics_boot_uuids: >-
      {{ (crash_diagnostics_boot_uuids_content.content | b64decode).splitlines() | select | list }}
  when:
    - crash_diagnostics_proxmox_boot_uuids.stat.exists
    - crash_diagnostics_boot_uuids_content.content is defined
  tags:
    - crash_diagnostics
    - memtest

# proxmox-boot-tool only warns about entries whose partition is gone, so a
# stale UUID here must not fail the play; the rc decides who is handled.
- name: Resolve boot partition UUIDs to block devices
  ansible.builtin.command:
    cmd: "blkid -U {{ item }}"
  loop: "{{ crash_diagnostics_boot_uuids | default([]) }}"
  register: crash_diagnostics_boot_uuid_resolutions
  changed_when: false
  failed_when: false
  # Read-only; a check run needs the resolved devices to preview the install.
  check_mode: false
  loop_control:
    label: "{{ item }}"
  tags:
    - crash_diagnostics
    - memtest

- name: Report boot partition UUIDs that no longer resolve
  ansible.builtin.debug:
    msg: >-
      Boot ESP UUID {{ item.item }} does not resolve to a block device, so the
      memtest86+ install skips it. Run 'proxmox-boot-tool clean' on this host
      to drop the stale entry from /etc/kernel/proxmox-boot-uuids.
  loop: "{{ crash_diagnostics_boot_uuid_resolutions.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  tags:
    - crash_diagnostics
    - memtest

- name: Install memtest86+ on every resolvable boot ESP
  ansible.builtin.include_tasks: memtest_esp.yml
  loop: >-
    {{ crash_diagnostics_boot_uuid_resolutions.results | default([])
       | selectattr('rc', 'equalto', 0) | list }}
  loop_control:
    loop_var: crash_diagnostics_esp_result
    label: "{{ crash_diagnostics_esp_result.item }}"
  vars:
    crash_diagnostics_esp_uuid: "{{ crash_diagnostics_esp_result.item }}"
    crash_diagnostics_esp_device: "{{ crash_diagnostics_esp_result.stdout }}"
    crash_diagnostics_esp_mount: "/tmp/ansible-boot-esp-{{ crash_diagnostics_esp_result.item }}"
  when: not crash_diagnostics_uefi_firmware.stat.exists
  tags:
    - crash_diagnostics
    - memtest
