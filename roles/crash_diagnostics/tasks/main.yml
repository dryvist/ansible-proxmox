---
# Crash Diagnostics role tasks

# =============================================================================
# PACKAGE INSTALLATION
# =============================================================================

- name: Install debugging and crash diagnostic packages
  ansible.builtin.apt:
    name: "{{ crash_diagnostics_packages }}"
    state: present
    cache_valid_time: 3600
  tags:
    - crash_diagnostics
    - packages

# =============================================================================
# MCE/EDAC HARDWARE ERROR MONITORING
# =============================================================================

# NOTE: rasdaemon is also managed by the common role (generic package + service),
# which runs on all systems. This task provides additional constraint:
# it re-ensures rasdaemon is started ONLY on physical hardware, not in VMs/containers.
# The common role's simpler approach is sufficient for most deployments.
# This can be removed if you prefer the common role as single source of truth.

- name: Check if rasdaemon is available
  ansible.builtin.stat:
    path: /usr/sbin/rasdaemon
  register: crash_diagnostics_rasdaemon_binary
  tags:
    - crash_diagnostics
    - rasdaemon

- name: Enable rasdaemon service for hardware error logging
  ansible.builtin.systemd:
    name: rasdaemon
    enabled: true
    state: started
  when:
    - ansible_service_mgr == 'systemd'
    - crash_diagnostics_rasdaemon_binary.stat.exists
    - ansible_virtualization_type == 'NA' or ansible_virtualization_role == 'host'
  tags:
    - crash_diagnostics
    - rasdaemon

# =============================================================================
# SMART DISK MONITORING (smartd)
# =============================================================================
# smartmontools is installed above but smartd is not enabled by default.
# Deploy a device-agnostic config and enable the daemon so SMART self-tests
# and attribute-degradation warnings reach syslog (forwarded to Splunk).
# Physical hosts only — a container/VM has no direct disk access.

- name: Deploy smartd configuration
  ansible.builtin.template:
    src: smartd.conf.j2
    dest: "{{ crash_diagnostics_smartd_conf }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart smartd
  when: ansible_virtualization_type == 'NA' or ansible_virtualization_role == 'host'
  tags:
    - crash_diagnostics
    - smartd

- name: Deploy smartd hotplug re-scan udev rule
  ansible.builtin.template:
    src: 60-smartd-rescan.rules.j2
    dest: "{{ crash_diagnostics_smartd_udev_rule }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev rules
  when: ansible_virtualization_type == 'NA' or ansible_virtualization_role == 'host'
  tags:
    - crash_diagnostics
    - smartd

- name: Enable and start smartd service
  ansible.builtin.systemd:
    name: smartd
    enabled: true
    state: started
  when:
    - ansible_service_mgr == 'systemd'
    - ansible_virtualization_type == 'NA' or ansible_virtualization_role == 'host'
  tags:
    - crash_diagnostics
    - smartd

# =============================================================================
# IPMI/BMC SYSTEM EVENT LOG (ipmievd)
# =============================================================================
# ipmievd (from ipmitool) ships BMC SEL events — PSU/fan/thermal/backplane/DIMM
# faults the OS never sees — to syslog. Only server-class hosts expose a BMC
# via /dev/ipmi0; desktop nodes have none, so gate on the device rather than
# hardcoding which nodes are server-class.

- name: Check for a local IPMI device
  ansible.builtin.stat:
    path: /dev/ipmi0
  register: crash_diagnostics_ipmi_device
  tags:
    - crash_diagnostics
    - ipmi

- name: Enable and start ipmievd (SEL to syslog) on hosts with a BMC
  ansible.builtin.systemd:
    name: ipmievd
    enabled: true
    state: started
  when:
    - ansible_service_mgr == 'systemd'
    - ansible_virtualization_type == 'NA' or ansible_virtualization_role == 'host'
    - crash_diagnostics_ipmi_device.stat.exists
  tags:
    - crash_diagnostics
    - ipmi

# =============================================================================
# SYSCTL CONFIGURATION
# =============================================================================

- name: Remove old manual sysctl debug configs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ crash_diagnostics_sysctl_cleanup }}"
  tags:
    - crash_diagnostics
    - sysctl

- name: Configure crash diagnostics sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ crash_diagnostics_sysctl_file }}"
    state: present
    sysctl_set: true
    reload: false
  loop: "{{ crash_diagnostics_sysctl_settings }}"
  register: crash_diagnostics_sysctl_result
  notify: Reload sysctl
  # Skipped in containers: these are real-kernel settings (nmi_watchdog, etc.)
  # that a container cannot persist, so sysctl_set re-reports "changed" every
  # run (non-idempotent under molecule). Real nodes apply them idempotently.
  when: ansible_virtualization_type != 'docker'
  failed_when:
    - crash_diagnostics_sysctl_result.failed
    - ansible_virtualization_type != 'docker'
  tags:
    - crash_diagnostics
    - sysctl

# sysctl_set applies every value to the running kernel, so the task above reports
# success whether or not the file it wrote will ever be read again — which is
# how this role previously persisted nothing while converging green for months.
# Checking the running kernel here would repeat that mistake, because the
# running kernel is what sysctl_set just wrote to by hand. The only thing worth
# asserting is that the settings will survive a reboot: the file has to live
# where systemd-sysctl looks, and it has to actually contain them.
- name: Assert the sysctl settings are persisted where systemd reads them
  ansible.builtin.assert:
    that:
      - crash_diagnostics_sysctl_file is match('^/etc/sysctl\.d/.+\.conf$')
    fail_msg: >-
      crash_diagnostics_sysctl_file must be a .conf under /etc/sysctl.d/.
      systemd-sysctl reads that directory directly; /etc/sysctl.conf is honoured
      only through a distro-shipped symlink, and when that symlink is absent the
      file is ignored in full with no error.
    quiet: true
  tags:
    - crash_diagnostics
    - sysctl

# Check mode writes nothing to disk and skips the read-back, so there is nothing to prove.
- name: Read back the persisted sysctl file
  ansible.builtin.slurp:
    src: "{{ crash_diagnostics_sysctl_file }}"
  register: crash_diagnostics_sysctl_persisted
  when:
    - ansible_virtualization_type != 'docker'
    - not ansible_check_mode
  tags:
    - crash_diagnostics
    - sysctl

- name: Assert every crash setting survived to disk
  ansible.builtin.assert:
    that:
      - crash_diagnostics_sysctl_persisted.content | b64decode is search('^\s*' ~ (item.name | regex_escape) ~ '\s*=', multiline=True)
    fail_msg: >-
      {{ item.name }} is not present in {{ crash_diagnostics_sysctl_file }}, so
      it will be lost at the next reboot even though it is set right now.
    quiet: true
  loop: "{{ crash_diagnostics_sysctl_settings }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - ansible_virtualization_type != 'docker'
    - not ansible_check_mode
  tags:
    - crash_diagnostics
    - sysctl

# =============================================================================
# GRUB CONFIGURATION
# =============================================================================

- name: Deploy GRUB drop-in config for crash diagnostics
  ansible.builtin.template:
    src: grub.cfg.j2
    dest: "{{ crash_diagnostics_grub_dropin }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Update GRUB
  tags:
    - crash_diagnostics
    - grub

# =============================================================================
# BOOT-TIME MEMORY LOGGING
# =============================================================================

- name: Create memory config log directory
  ansible.builtin.file:
    path: "{{ crash_diagnostics_memory_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - crash_diagnostics
    - memory_logging

- name: Deploy memory config logger script
  ansible.builtin.template:
    src: memory-config-logger.sh.j2
    dest: "{{ crash_diagnostics_memory_logger_script }}"
    owner: root
    group: root
    mode: "0755"
  tags:
    - crash_diagnostics
    - memory_logging

- name: Deploy memory config logger systemd service
  ansible.builtin.template:
    src: memory-config-logger.service.j2
    dest: /etc/systemd/system/memory-config-logger.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags:
    - crash_diagnostics
    - memory_logging

- name: Enable memory config logger service
  ansible.builtin.systemd:
    name: memory-config-logger
    enabled: true
    daemon_reload: true
  when: ansible_service_mgr == 'systemd'
  tags:
    - crash_diagnostics
    - memory_logging

# =============================================================================
# REAL-TIME MCE MONITORING
# =============================================================================

- name: Deploy MCE monitor script
  ansible.builtin.template:
    src: mce-monitor.sh.j2
    dest: "{{ crash_diagnostics_mce_monitor_script }}"
    owner: root
    group: root
    mode: "0755"
  tags:
    - crash_diagnostics
    - mce_monitor

- name: Deploy MCE monitor systemd service
  ansible.builtin.template:
    src: mce-monitor.service.j2
    dest: /etc/systemd/system/mce-monitor.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags:
    - crash_diagnostics
    - mce_monitor

- name: Enable and start MCE monitor service
  ansible.builtin.systemd:
    name: mce-monitor
    enabled: true
    state: started
    daemon_reload: true
  # Only on physical hardware with systemd, not in containers/VMs
  when:
    - ansible_service_mgr == 'systemd'
    - ansible_virtualization_type == 'NA' or ansible_virtualization_role == 'host'
  tags:
    - crash_diagnostics
    - mce_monitor

# =============================================================================
# MEMTEST86+ ON PROXMOX-BOOT-TOOL SYSTEMS (ZFS on root)
# =============================================================================
# When Proxmox uses ZFS on root with proxmox-boot-tool, memtest86+ must be
# installed on the separate FAT32 boot partition, NOT in /boot/ on the ZFS root.
# The standard memtest86+ package installs to /boot/ which is inaccessible
# from the boot partition's GRUB configuration.
#
# Every UUID in /etc/kernel/proxmox-boot-uuids is handled, so a mirrored rpool
# gets the memtest files on all of its ESPs. A UUID whose partition no longer
# exists is a normal state after a boot disk replacement — proxmox-boot-tool
# only warns about it — so the lookup reports it for the operator instead of
# failing the play. Running 'proxmox-boot-tool clean' is the operator's call,
# never done from this role.
#
# ESPs are mounted with state=ephemeral, so nothing is written to /etc/fstab.
# The GRUB custom.cfg mechanism only applies where proxmox-boot-tool boots
# through GRUB (legacy BIOS); UEFI hosts run systemd-boot, which ignores
# grub/custom.cfg and cannot execute linux16, so the install is skipped there.

# Earlier versions wrote a permanent fstab line for the temporary mount, keyed
# by kernel device name and without nofail; systemd remounts it at every boot
# and a renamed or missing device can stall boot. Cleanup runs on every host
# regardless of firmware or proxmox-boot-tool state. absent_from_fstab only
# edits fstab — it must not unmount whatever is mounted at the path now, which
# the task after it handles.
- name: Remove legacy fstab entry for the temporary boot mount
  ansible.posix.mount:
    path: /tmp/ansible-boot-partition
    state: absent_from_fstab
  tags:
    - crash_diagnostics
    - memtest

- name: Unmount leftover temporary boot mount
  ansible.posix.mount:
    path: /tmp/ansible-boot-partition
    state: unmounted
  tags:
    - crash_diagnostics
    - memtest

- name: Remove leftover temporary boot mount point
  ansible.builtin.file:
    path: /tmp/ansible-boot-partition
    state: absent
  tags:
    - crash_diagnostics
    - memtest

- name: Check for UEFI boot
  ansible.builtin.stat:
    path: /sys/firmware/efi
  register: crash_diagnostics_uefi_firmware
  tags:
    - crash_diagnostics
    - memtest

- name: Report memtest is not handled on UEFI systemd-boot systems
  ansible.builtin.debug:
    msg: >-
      Boot firmware is UEFI, so proxmox-boot-tool installs systemd-boot, which
      ignores grub/custom.cfg (and linux16 is BIOS-only). memtest86+ is not
      installed on the ESP; configure it through systemd-boot instead.
  when: crash_diagnostics_uefi_firmware.stat.exists
  tags:
    - crash_diagnostics
    - memtest

- name: Check if proxmox-boot-tool manages boot
  ansible.builtin.stat:
    path: /etc/kernel/proxmox-boot-uuids
  register: crash_diagnostics_proxmox_boot_uuids
  tags:
    - crash_diagnostics
    - memtest

- name: Read boot partition UUIDs from proxmox-boot-tool config
  ansible.builtin.slurp:
    src: /etc/kernel/proxmox-boot-uuids
  register: crash_diagnostics_boot_uuids_content
  when: crash_diagnostics_proxmox_boot_uuids.stat.exists
  tags:
    - crash_diagnostics
    - memtest

- name: List boot partition UUIDs from proxmox-boot-tool config
  ansible.builtin.set_fact:
    crash_diagnostics_boot_uuids: >-
      {{ (crash_diagnostics_boot_uuids_content.content | b64decode).splitlines() | select | list }}
  when:
    - crash_diagnostics_proxmox_boot_uuids.stat.exists
    - crash_diagnostics_boot_uuids_content.content is defined
  tags:
    - crash_diagnostics
    - memtest

# proxmox-boot-tool only warns about entries whose partition is gone, so a
# stale UUID here must not fail the play; the rc decides who is handled.
- name: Resolve boot partition UUIDs to block devices
  ansible.builtin.command:
    cmd: "blkid -U {{ item }}"
  loop: "{{ crash_diagnostics_boot_uuids | default([]) }}"
  register: crash_diagnostics_boot_uuid_resolutions
  changed_when: false
  failed_when: false
  # Read-only; a check run needs the resolved devices to preview the install.
  check_mode: false
  loop_control:
    label: "{{ item }}"
  tags:
    - crash_diagnostics
    - memtest

- name: Report boot partition UUIDs that no longer resolve
  ansible.builtin.debug:
    msg: >-
      Boot ESP UUID {{ item.item }} does not resolve to a block device, so the
      memtest86+ install skips it. Run 'proxmox-boot-tool clean' on this host
      to drop the stale entry from /etc/kernel/proxmox-boot-uuids.
  loop: "{{ crash_diagnostics_boot_uuid_resolutions.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  tags:
    - crash_diagnostics
    - memtest

- name: Install memtest86+ on every resolvable boot ESP
  ansible.builtin.include_tasks: memtest_esp.yml
  loop: >-
    {{ crash_diagnostics_boot_uuid_resolutions.results | default([])
       | selectattr('rc', 'equalto', 0) | list }}
  loop_control:
    loop_var: crash_diagnostics_esp_result
    label: "{{ crash_diagnostics_esp_result.item }}"
  vars:
    crash_diagnostics_esp_uuid: "{{ crash_diagnostics_esp_result.item }}"
    crash_diagnostics_esp_device: "{{ crash_diagnostics_esp_result.stdout }}"
    crash_diagnostics_esp_mount: "/tmp/ansible-boot-esp-{{ crash_diagnostics_esp_result.item }}"
  when: not crash_diagnostics_uefi_firmware.stat.exists
  tags:
    - crash_diagnostics
    - memtest

# =============================================================================
# PANIC DUMP FORWARDING (systemd-pstore)
# =============================================================================
# By default systemd-pstore only copies EFI/ACPI ERST panic dumps to
# /var/lib/systemd/pstore/, a file that is never shipped to Splunk. Setting
# Storage=journal makes it log the dump content into the journal at boot,
# which the existing pve_syslog_forwarder role already forwards.

- name: Ensure pstore.conf.d drop-in directory exists
  ansible.builtin.file:
    path: "{{ crash_diagnostics_pstore_conf_dropin | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_virtualization_type == 'NA' or ansible_virtualization_role == 'host'
  tags:
    - crash_diagnostics
    - pstore

- name: Deploy systemd-pstore journal-storage drop-in
  ansible.builtin.template:
    src: pstore-journal.conf.j2
    dest: "{{ crash_diagnostics_pstore_conf_dropin }}"
    owner: root
    group: root
    mode: "0644"
  when: ansible_virtualization_type == 'NA' or ansible_virtualization_role == 'host'
  tags:
    - crash_diagnostics
    - pstore
