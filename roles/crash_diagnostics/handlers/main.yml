---
# Crash Diagnostics role handlers

# `sysctl -p` with no argument reads /etc/sysctl.conf, which a current Debian
# install does not ship — a freshly commissioned node fails with
# `cannot open "/etc/sysctl.conf": No such file or directory`. This role writes
# its settings to /etc/sysctl.d/ anyway, so --system is both correct and the
# only form that actually loads them.
- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false
  # Some kernel settings require hardware access and may fail in containers
  when: ansible_virtualization_type != 'docker'
  listen: Reload sysctl

- name: Update GRUB
  ansible.builtin.command:
    cmd: update-grub
  changed_when: false
  # update-grub doesn't exist in containers
  when: ansible_virtualization_type != 'docker'
  listen: Update GRUB

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: ansible_service_mgr == 'systemd'
  listen: Reload systemd

- name: Restart smartd
  ansible.builtin.systemd:
    name: smartd
    state: restarted
  when:
    - ansible_service_mgr == 'systemd'
    - ansible_virtualization_type == 'NA' or ansible_virtualization_role == 'host'
  listen: Restart smartd
