---
# local_identities — named Linux accounts for human and access-tier logins.
# Three administrative accounts:
#
#   jevans — the human operator. Passwordless sudo, key-based SSH (both the
#            static declared key AND the OpenBao SSH CA principal), so a
#            person never needs to authenticate directly as root.
#   admin  — break-glass only. Created and sudo-capable, but carries NO
#            static authorized_key by default (root_authorized_keys already
#            owns the "must survive a CA outage" static break-glass key on
#            root; `admin` is the CA-cert-only complement for routine
#            break-glass work that does not need root itself).
#   host-admin — opt-in administrative access tier, CA-certificate-only.
#
# Neither account is exclusive of `root` -- root access is not removed here.
# This role is additive: it creates a better path, it does not close the old
# one. Retiring direct root login is a deliberate, separate, later step once
# every consumer (humans, ansible, iac) is confirmed working over these
# accounts.

local_identities_enabled: true

local_identities_jevans_enabled: true
local_identities_jevans_user: jevans
local_identities_jevans_shell: /bin/bash
# Reuses the same key already declared for VM cloud-init
# (deployment.json vm_ssh_public_key) -- one identity, not a second key to
# rotate separately.
local_identities_jevans_ssh_public_key: "{{ lookup('env', 'VM_SSH_PUBLIC_KEY') | default('', true) }}"

local_identities_admin_enabled: true
local_identities_admin_user: admin
local_identities_admin_shell: /bin/bash

local_identities_host_admin_enabled: false
local_identities_host_admin_user: "{{ host_admin_user | default('host-admin') }}"
local_identities_host_admin_shell: /bin/bash

# Both accounts get NOPASSWD sudo -- they exist specifically to replace
# `ssh root@host`, so gating every command behind a password prompt would
# just reintroduce root-login habits through a side door.
local_identities_sudoers_dir: /etc/sudoers.d

# --- accounts, as data ---
# Every account is one row: user, shell (default /bin/bash), enabled (default
# true), sudo, and optionally principals (the OpenBao SSH CA principals that
# may log in as it; playbooks/site.yml feeds them to ssh_ca_trust, so a row
# needs no other file).
#   sudo: [ALL]        unrestricted passwordless sudo
#   sudo: [<cmd>, ...] exact command allowlist, run as root, no password
#   sudo: []           no sudo; a sudoers file left by an earlier run is removed
# jevans, admin and host-admin keep their own variables above and are rows
# here. A new identity -- another trusted AI, or a read-only account on a
# different host class -- is one row in local_identities_extra_accounts, set
# in the group_vars of the hosts it applies to.
local_identities_builtin_accounts:
  - user: "{{ local_identities_jevans_user }}"
    shell: "{{ local_identities_jevans_shell }}"
    enabled: "{{ local_identities_jevans_enabled }}"
    sudo: [ALL]
  - user: "{{ local_identities_admin_user }}"
    shell: "{{ local_identities_admin_shell }}"
    enabled: "{{ local_identities_admin_enabled }}"
    sudo: [ALL]
  - user: "{{ local_identities_host_admin_user }}"
    shell: "{{ local_identities_host_admin_shell }}"
    enabled: "{{ local_identities_host_admin_enabled }}"
    sudo: [ALL]
local_identities_extra_accounts: []
local_identities_accounts: "{{ local_identities_builtin_accounts + local_identities_extra_accounts }}"

# Root-only read-only diagnostics, for an extra account's `sudo`. Exact
# argument forms, no wildcard beyond a device-name class: a free `*` would let
# smartctl change a drive's SMART settings or dmidecode write a dump file.
# lsblk, lspci, lscpu, nvidia-smi and `zpool status/list` need no root, so they
# are deliberately absent. Command paths are Debian's.
local_identities_readonly_diagnostics_sudo:
  - /usr/sbin/dmidecode -t system
  - /usr/sbin/dmidecode -t baseboard
  - /usr/sbin/dmidecode -t chassis
  - /usr/sbin/dmidecode -t processor
  - /usr/sbin/dmidecode -t memory
  - /usr/sbin/dmidecode -t 39
  - /usr/sbin/dmidecode -s system-manufacturer
  - /usr/sbin/dmidecode -s system-product-name
  - /usr/sbin/dmidecode -s system-serial-number
  - /usr/sbin/dmidecode -s baseboard-product-name
  - /usr/sbin/dmidecode -s bios-version
  - /usr/sbin/smartctl -i /dev/sd[a-z]
  - /usr/sbin/smartctl -a /dev/sd[a-z]
  - /usr/sbin/smartctl -x /dev/sd[a-z]
  - /usr/sbin/smartctl -H /dev/sd[a-z]
  - /usr/sbin/smartctl -i /dev/nvme[0-9]n[0-9]
  - /usr/sbin/smartctl -a /dev/nvme[0-9]n[0-9]
  - /usr/sbin/smartctl -x /dev/nvme[0-9]n[0-9]
  - /usr/sbin/smartctl --scan
  - /usr/bin/ipmitool sdr list
  - /usr/bin/ipmitool sensor list
  - /usr/bin/ipmitool fru print
  - /usr/bin/ipmitool sel list
  - /usr/bin/ipmitool mc info
  - /usr/bin/ipmitool chassis status

# --- backup ingress ---
# A service account for an off-box backup push. Unlike jevans and admin it is
# NOT an administrative identity: no sudo, and its key carries a forced command
# so the session cannot do anything but the one transfer. Deny-by-default; a
# host opts in and specifies the key line.
#
# It exists so a backup push does not authenticate as root. Writing into a
# directory is not an administrative act, and giving a scheduled unattended job
# root on a hypervisor to do it is a far larger grant than the task needs.
local_identities_backup_ingress_enabled: false
local_identities_backup_ingress_user: backup-ingress
# A shell is required, not optional: the forced command is exec'd through it,
# so nologin would break the transfer. The forced command, not the shell, is
# what makes the account unusable interactively.
local_identities_backup_ingress_shell: /bin/bash
# Full authorized_keys-format line INCLUDING its forced-command options.
local_identities_backup_ingress_ssh_public_key: ""
# Directory the account owns. Empty => ownership is managed elsewhere.
local_identities_backup_ingress_dir: ""
