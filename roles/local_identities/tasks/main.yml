---
# local_identities tasks — create the named accounts and grant sudo.
# CA-cert SSH access for these accounts is wired through ssh_ca_trust's
# principals map (see site.yml), not here -- this role owns account
# existence and sudo, not certificate trust.

# One loop creates every account and writes its sudoers entry. jevans, admin
# and host-admin are rows of local_identities_builtin_accounts (defaults);
# anything else -- a CA-only diagnostic account for a trusted AI, say -- is one
# more row in local_identities_extra_accounts. No account gets its own task.
- name: Create the named accounts
  ansible.builtin.user:
    name: "{{ item.user }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    create_home: true
    state: present
  loop: "{{ local_identities_accounts }}"
  loop_control:
    label: "{{ item.user }}"
  when:
    - local_identities_enabled | bool
    - item.enabled | default(true) | bool
  tags:
    - local_identities

# `sudo: [ALL]` is unrestricted passwordless sudo, exactly what jevans, admin
# and host-admin always had. Any other list is an exact command allowlist, run
# as root without a password. An empty list grants none and removes the file a
# previous run wrote, so shrinking a row revokes the grant.
- name: Grant each account its sudo allowlist
  ansible.builtin.copy:
    content: >
      {{ (item.user ~ ' ALL=(ALL) NOPASSWD:ALL') if item.sudo == ['ALL']
         else (item.user ~ ' ALL=(root) NOPASSWD: ' ~ (item.sudo | join(', '))) }}
    dest: "{{ local_identities_sudoers_dir }}/{{ item.user }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  loop: "{{ local_identities_accounts }}"
  loop_control:
    label: "{{ item.user }}"
  when:
    - local_identities_enabled | bool
    - item.enabled | default(true) | bool
    - item.sudo | default([]) | length > 0
  tags:
    - local_identities

- name: Remove the sudoers file of an account that has no sudo
  ansible.builtin.file:
    path: "{{ local_identities_sudoers_dir }}/{{ item.user }}"
    state: absent
  loop: "{{ local_identities_accounts }}"
  loop_control:
    label: "{{ item.user }}"
  when:
    - local_identities_enabled | bool
    - item.enabled | default(true) | bool
    - item.sudo | default([]) | length == 0
  tags:
    - local_identities

- name: Authorize jevans's declared SSH key
  ansible.posix.authorized_key:
    user: "{{ local_identities_jevans_user }}"
    key: "{{ local_identities_jevans_ssh_public_key }}"
    state: present
  when:
    - local_identities_enabled | bool
    - local_identities_jevans_enabled | bool
    - local_identities_jevans_ssh_public_key | length > 0
  tags:
    - local_identities

# A skipped key task leaves an account that exists, has sudo, and cannot be
# logged into -- while the recap still reads changed/ok with failed=0. Say so
# out loud, because "no static key" is only correct when ssh_ca_trust has
# actually placed a principals file for this user on this host; otherwise the
# account has NO authentication path at all and the converge looks clean.
- name: Check whether the CA grants this account a principal on this host
  ansible.builtin.stat:
    path: "/etc/ssh/principals/{{ local_identities_jevans_user }}"
  register: local_identities_jevans_principal
  when:
    - local_identities_enabled | bool
    - local_identities_jevans_enabled | bool
    - local_identities_jevans_ssh_public_key | length == 0
  tags:
    - local_identities

- name: Warn that the account has no way to authenticate
  ansible.builtin.debug:
    msg: >-
      {{ local_identities_jevans_user }} was created with sudo but has NEITHER
      a static SSH key NOR a CA principal on this host, so nobody can log into
      it. The key task was skipped because
      local_identities_jevans_ssh_public_key is empty -- it reads the
      VM_SSH_PUBLIC_KEY environment variable, which this converge did not
      export. Either export it, or run ssh_ca_trust so
      /etc/ssh/principals/{{ local_identities_jevans_user }} exists.
  when:
    - local_identities_enabled | bool
    - local_identities_jevans_enabled | bool
    - local_identities_jevans_ssh_public_key | length == 0
    - not (local_identities_jevans_principal.stat.exists | default(false))
  tags:
    - local_identities

# admin intentionally gets NO static authorized_key here -- it is reached
# only via the OpenBao SSH CA (ssh_ca_trust_principals), which is the point
# of a break-glass account that is not a standing, always-open door.

# --- backup ingress service account ---
# Deliberately has no sudo task: it is a write-into-one-directory identity, not
# an administrative one.
- name: Create the backup ingress account
  ansible.builtin.user:
    name: "{{ local_identities_backup_ingress_user }}"
    shell: "{{ local_identities_backup_ingress_shell }}"
    create_home: true
    state: present
  when:
    - local_identities_enabled | bool
    - local_identities_backup_ingress_enabled | bool
  tags:
    - local_identities

# Fail rather than create an account that cannot be reached. The other accounts
# here can fall back to a CA principal; this one is key-only by design, so a
# missing key is not a degraded state, it is a broken one — and a silent skip
# would leave a passwordless account with no forced command behind it.
- name: Assert the backup ingress key is supplied
  ansible.builtin.assert:
    that:
      - local_identities_backup_ingress_ssh_public_key | length > 0
    fail_msg: >-
      local_identities_backup_ingress_enabled is true but no key line was
      supplied. Refusing to create an unreachable service account.
  when:
    - local_identities_enabled | bool
    - local_identities_backup_ingress_enabled | bool
  tags:
    - local_identities

- name: Authorize the backup ingress key
  ansible.posix.authorized_key:
    user: "{{ local_identities_backup_ingress_user }}"
    key: "{{ local_identities_backup_ingress_ssh_public_key }}"
    exclusive: true
    state: present
  when:
    - local_identities_enabled | bool
    - local_identities_backup_ingress_enabled | bool
  tags:
    - local_identities

- name: Give the backup ingress account its directory
  ansible.builtin.file:
    path: "{{ local_identities_backup_ingress_dir }}"
    state: directory
    owner: "{{ local_identities_backup_ingress_user }}"
    mode: "0750"
  when:
    - local_identities_enabled | bool
    - local_identities_backup_ingress_enabled | bool
    - local_identities_backup_ingress_dir | length > 0
  tags:
    - local_identities

# The directory may predate the account and hold content owned by someone else,
# in which case the account owns the top level and still cannot write inside it.
# `recurse: true` on the file module above would fix that, but it re-stats every
# file on every converge, which is minutes once the tree is large.
#
# So: detect, then act. The probe stops at the FIRST foreign file, so the common
# case (already converged) costs one directory walk that exits immediately, and
# an empty result is a true statement about the whole tree rather than about
# whatever the last chown happened to touch.
- name: Find whether any of the directory is not owned by the backup ingress account
  ansible.builtin.command:
    cmd: >-
      find {{ local_identities_backup_ingress_dir | quote }}
      ! -user {{ local_identities_backup_ingress_user | quote }}
      -print -quit
  register: local_identities_backup_ingress_foreign
  changed_when: false
  check_mode: false
  when:
    - local_identities_enabled | bool
    - local_identities_backup_ingress_enabled | bool
    - local_identities_backup_ingress_dir | length > 0
  tags:
    - local_identities

- name: Take ownership of pre-existing content
  ansible.builtin.command:
    cmd: >-
      chown -R {{ local_identities_backup_ingress_user | quote }}
      {{ local_identities_backup_ingress_dir | quote }}
  when:
    - local_identities_enabled | bool
    - local_identities_backup_ingress_enabled | bool
    - local_identities_backup_ingress_dir | length > 0
    - local_identities_backup_ingress_foreign.stdout | default("") | length > 0
  changed_when: true
  tags:
    - local_identities
