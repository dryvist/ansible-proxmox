---
# pve_notifications — add an ntfy webhook target + matchers to the
# cluster-wide /etc/pve/notifications.cfg. Additive only (see defaults for why
# this is API-driven, not templated) so the existing `proxman` target and any
# other unmanaged targets/matchers are left untouched. All pvesh calls skip
# under Docker so the role is molecule-testable without a live cluster.

- name: Configure ntfy notifications from the single config host
  when:
    - pve_notifications_enabled | bool
    - inventory_hostname == pve_notifications_config_host
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - pve_notifications
  block:
    - name: Assert the ntfy hub target resolved
      ansible.builtin.assert:
        that:
          - lookup('env', 'PROXMOX_SUBDOMAIN') | length > 0
        fail_msg: >-
          pve_notifications needs PROXMOX_SUBDOMAIN (for the ntfy ingress
          hostname).
        quiet: true

    - name: Render the ntfy webhook body and Title header for the PVE API
      ansible.builtin.set_fact:
        pve_notifications_ntfy_body_b64: "{{ pve_notifications_ntfy_body_template | b64encode }}"
        pve_notifications_ntfy_header: "name=Title,value={{ pve_notifications_ntfy_title_template | b64encode }}"

    - name: Check whether the ntfy webhook target already exists
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/cluster/notifications/endpoints/webhook/{{ pve_notifications_ntfy_target }}"
          - --output-format
          - json
      register: pve_notifications_target_check
      changed_when: false
      failed_when: false
      # Read-only; a check run needs the live state to preview any drift.
      check_mode: false

    - name: Create the ntfy webhook target
      ansible.builtin.command:
        argv:
          - pvesh
          - create
          - /cluster/notifications/endpoints/webhook
          - --name
          - "{{ pve_notifications_ntfy_target }}"
          - --url
          - "{{ pve_notifications_ntfy_url }}"
          - --method
          - "{{ pve_notifications_ntfy_method }}"
          - --body
          - "{{ pve_notifications_ntfy_body_b64 }}"
          - --header
          - "{{ pve_notifications_ntfy_header }}"
          - --comment
          - Managed by ansible-proxmox pve_notifications
      when: pve_notifications_target_check.rc != 0
      changed_when: true

    # rc == 0 means the target already exists; keep its URL/method/body/header
    # in sync rather than re-creating (pvesh create fails on a name that exists).
    - name: Update the ntfy webhook target if its URL, method, body or header drifted
      vars:
        _current: "{{ pve_notifications_target_check.stdout | from_json }}"
      ansible.builtin.command:
        argv:
          - pvesh
          - set
          - "/cluster/notifications/endpoints/webhook/{{ pve_notifications_ntfy_target }}"
          - --url
          - "{{ pve_notifications_ntfy_url }}"
          - --method
          - "{{ pve_notifications_ntfy_method }}"
          - --body
          - "{{ pve_notifications_ntfy_body_b64 }}"
          - --header
          - "{{ pve_notifications_ntfy_header }}"
      when:
        - pve_notifications_target_check.rc == 0
        - (pve_notifications_ntfy_url != _current.url) or
          (pve_notifications_ntfy_method != _current.method) or
          (pve_notifications_ntfy_body_b64 != (_current.body | default(''))) or
          ([pve_notifications_ntfy_header] != (_current.header | default([])))
      changed_when: true

    - name: Check which matchers already exist
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/cluster/notifications/matchers/{{ item.name }}"
          - --output-format
          - json
      loop: "{{ pve_notifications_matchers }}"
      loop_control:
        label: "{{ item.name }}"
      register: pve_notifications_matcher_check
      changed_when: false
      failed_when: false
      # Read-only; a check run needs the live state to preview any drift.
      check_mode: false

    - name: Create missing matchers routed at the ntfy target
      ansible.builtin.command:
        argv: >-
          {{
            ['pvesh', 'create', '/cluster/notifications/matchers',
             '--name', item.item.name,
             '--target', pve_notifications_ntfy_target,
             '--match-field', 'exact:type=' + item.item.type,
             '--comment', 'Managed by ansible-proxmox pve_notifications']
            + (['--match-severity', item.item.severity] if item.item.severity is defined else [])
          }}
      loop: "{{ pve_notifications_matcher_check.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.rc != 0
      changed_when: true
