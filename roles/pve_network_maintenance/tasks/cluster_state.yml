---
# Resolve cluster quorum and node health from a /cluster/status body. Pure
# logic, no reads or commands, so the fixture test
# (tests/pve_network_maintenance) includes it with
# pve_network_maintenance_cluster_status_text set to the API JSON.

- name: Resolve cluster quorum, node health, and membership
  ansible.builtin.set_fact:
    pve_network_maintenance_cluster_quorate: >-
      {{ pve_network_maintenance_cluster_quorate_condition }}
    pve_network_maintenance_cluster_nodes_online: >-
      {{ pve_network_maintenance_cluster_nodes_online_condition }}
    pve_network_maintenance_cluster_nodes: >-
      {{ (pve_network_maintenance_cluster_status_text | default('[]', true) | from_json)
         | selectattr('type', 'equalto', 'node')
         | map(attribute='name') | list }}
