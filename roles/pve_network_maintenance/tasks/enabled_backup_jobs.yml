---
# Select the currently enabled vzdump job ids from a /cluster/backup read.
# Pure logic, no reads or commands, so the fixture test
# (tests/pve_network_maintenance) includes it with
# pve_network_maintenance_backup_jobs_raw set to a registered-style result.
# The API returns `enabled` as a number or a string, so the truth value is
# normalized over both shapes.

- name: Select the enabled backup jobs
  ansible.builtin.set_fact:
    pve_network_maintenance_enabled_job_ids: >-
      {%- set jobs = pve_network_maintenance_backup_jobs_raw.stdout | default('[]', true) | from_json -%}
      {%- set enabled = [] -%}
      {%- for job in jobs -%}
        {%- if job.enabled is defined
              and (job.enabled | string | lower) in ['1', 'true', 'yes'] -%}
          {%- set _ = enabled.append(job.id) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ enabled | unique | sort }}
