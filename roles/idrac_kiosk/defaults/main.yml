---
# iDRAC kiosk role defaults
#
# Drives a physical monitor on the pve host with a Wayland kiosk browser
# showing both iDRAC6 HTML5 (noVNC) consoles side-by-side.

# Master switch for the role. When false, no packages, users, or services
# are touched.
#
# OFF by default, and opted into per host. This role drives a physical monitor
# and is wanted on exactly one node; every other node has a Matrox G200 with no
# usable GL, where cage cannot create a renderer and exits immediately. Left
# enabled estate-wide it is a node-killer, not merely useless: cage opens the
# console input devices, the power button among them, and a service that keeps
# dying and restarting eventually delivers a power-key event to logind, whose
# default action is to power the machine off. That is an orderly shutdown with
# no panic and no fault logged anywhere, which is precisely why it reads as an
# unexplained reboot.
idrac_kiosk_enabled: false

# The LXC serving the two iDRAC6 noVNC viewers (Dell R410 + R710). FQDN, never
# a literal IP — a hostname insulates this from the guest re-addressing (the
# golden rule), and resolves via the managed DNS A record. PROXMOX_SUBDOMAIN
# comes from the environment (Doppler), mirroring pve_syslog_forwarder.
idrac_kiosk_kvm_host: "idrac-kvm.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"

# Per-server viewer ports on the LXC.
idrac_kiosk_r410_port: 5410
idrac_kiosk_r710_port: 5710

# On-host directory holding the generated kiosk landing page.
idrac_kiosk_data_dir: /opt/idrac-kiosk

# Unprivileged user that runs the cage + chromium session.
idrac_kiosk_user: kiosk
