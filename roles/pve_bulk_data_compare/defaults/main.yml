---
# The source, target and evidence hosts have NO defaults on purpose: every
# caller must name them, so an unset value fails closed instead of silently
# comparing against whichever node a default happened to name.
pve_bulk_data_compare_enabled: false
pve_bulk_data_compare_run_id: ""
pve_bulk_data_compare_evidence_dir: ""
pve_bulk_data_compare_source_manifest_dir: ""
pve_bulk_data_compare_target_manifest_dir: ""
pve_bulk_data_compare_evidence_manifest_dir: ""
pve_bulk_data_compare_manifest_export: ""
pve_bulk_data_compare_source_dataset: ""
pve_bulk_data_compare_target_dataset: ""
pve_bulk_data_compare_source_path: ""
pve_bulk_data_compare_target_path: ""

# Guests that can write to the compared dataset; every one must be stopped.
# Null, not [], on purpose: an empty list would loop over nothing and the
# writer check would pass because it checked nothing. A caller with no writers
# says so with the acknowledgement below, which prints in the play output.
pve_bulk_data_compare_media_writer_cts: null
pve_bulk_data_compare_no_media_writer_cts: false
