---
- name: Require an explicitly named source, target and evidence host
  ansible.builtin.assert:
    that:
      - pve_bulk_data_compare_source_node is defined
      - pve_bulk_data_compare_source_node | default('') | length > 0
      - pve_bulk_data_compare_target_node is defined
      - pve_bulk_data_compare_target_node | default('') | length > 0
      - pve_bulk_data_compare_evidence_host is defined
      - pve_bulk_data_compare_evidence_host | default('') | length > 0
    fail_msg: >-
      The caller must pass pve_bulk_data_compare_source_node,
      pve_bulk_data_compare_target_node and pve_bulk_data_compare_evidence_host
      explicitly. These have no defaults so an unset value fails closed
      instead of comparing an unintended node.

- name: Require the destruction-gate invocation
  ansible.builtin.assert:
    that:
      - inventory_hostname == pve_bulk_data_compare_source_node
      - pve_bulk_data_compare_source_node != pve_bulk_data_compare_target_node
      - pve_bulk_data_compare_source_dataset == 'bulk/data'
      - pve_bulk_data_compare_target_dataset == 'bulk/data'
      - pve_bulk_data_compare_source_path == '/bulk/data'
      - pve_bulk_data_compare_target_path == '/bulk/data'
      - pve_bulk_data_compare_run_id is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$')
      - pve_bulk_data_compare_evidence_dir | length > 0
      - pve_bulk_data_compare_source_manifest_dir | length > 0
      - pve_bulk_data_compare_target_manifest_dir | length > 0
      - pve_bulk_data_compare_evidence_manifest_dir | length > 0
      - pve_bulk_data_compare_manifest_export | length > 0
      - pve_bulk_data_compare_evidence_dir != '/bulk/data'
      - not pve_bulk_data_compare_evidence_dir.startswith('/bulk/data/')
      - pve_bulk_data_compare_source_manifest_dir != '/bulk/data'
      - not pve_bulk_data_compare_source_manifest_dir.startswith('/bulk/data/')
      - pve_bulk_data_compare_target_manifest_dir != '/bulk/data'
      - not pve_bulk_data_compare_target_manifest_dir.startswith('/bulk/data/')
      - pve_bulk_data_compare_evidence_manifest_dir != '/bulk/data'
      - not pve_bulk_data_compare_evidence_manifest_dir.startswith('/bulk/data/')
    fail_msg: >-
      This role only compares the exact source and target bulk/data datasets,
      with explicit enablement, run id, and evidence-host staging.

- name: Assert pve client manifest staging is mounted and writable
  ansible.builtin.command:
    argv: [test, -d, "{{ item.path }}"]
  delegate_to: "{{ item.name }}"
  loop:
    - {name: "{{ pve_bulk_data_compare_source_node }}", path: "{{ pve_bulk_data_compare_source_manifest_dir }}"}
    - {name: "{{ pve_bulk_data_compare_target_node }}", path: "{{ pve_bulk_data_compare_target_manifest_dir }}"}
  changed_when: false

- name: Assert the evidence host's local manifest directory is ready
  ansible.builtin.command:
    argv: [test, -d, "{{ pve_bulk_data_compare_evidence_manifest_dir }}"]
  delegate_to: "{{ pve_bulk_data_compare_evidence_host }}"
  changed_when: false

- name: Capture pve client manifest mount sources
  ansible.builtin.command:
    argv: [findmnt, -no, SOURCE, --target, "{{ item.path }}"]
  delegate_to: "{{ item.name }}"
  loop:
    - {name: "{{ pve_bulk_data_compare_source_node }}", path: "{{ pve_bulk_data_compare_source_manifest_dir }}"}
    - {name: "{{ pve_bulk_data_compare_target_node }}", path: "{{ pve_bulk_data_compare_target_manifest_dir }}"}
  register: pve_bulk_data_compare_manifest_mounts
  changed_when: false

- name: Assert pve clients use the exact declared manifest export
  ansible.builtin.assert:
    that:
      - pve_bulk_data_compare_manifest_mounts.results | map(attribute='stdout') | map('trim') | unique | list == [pve_bulk_data_compare_manifest_export]
    fail_msg: "Source and target must use the declared NFS manifest export."

- name: Assert the evidence host's local evidence directory is root-only
  ansible.builtin.command:
    argv: [stat, -c, '%u %a', "{{ pve_bulk_data_compare_evidence_dir }}"]
  delegate_to: "{{ pve_bulk_data_compare_evidence_host }}"
  register: pve_bulk_data_compare_evidence_stat
  changed_when: false

- name: Require evidence-host-local evidence directory permissions
  ansible.builtin.assert:
    that: [pve_bulk_data_compare_evidence_stat.stdout == '0 700']
    fail_msg: "Evidence must be a root-owned mode 0700 directory."

- name: Assert no snapshots or deferred freeing exist on either node
  ansible.builtin.shell:
    cmd: |
      set -Eeuo pipefail
      test -z "$(zfs list -H -t snapshot -o name)"
      zpool list -H -o freeing | awk '$1 !~ /^(0|0B|0\.00B)$/ { exit 1 }'
    executable: /bin/bash
  delegate_to: "{{ item }}"
  loop: ["{{ pve_bulk_data_compare_source_node }}", "{{ pve_bulk_data_compare_target_node }}"]
  changed_when: false

- name: Capture pool operation state
  ansible.builtin.command:
    argv: [zpool, status, -v, bulk]
  delegate_to: "{{ item }}"
  loop: ["{{ pve_bulk_data_compare_source_node }}", "{{ pve_bulk_data_compare_target_node }}"]
  register: pve_bulk_data_compare_pool_status
  changed_when: false

- name: Reject scrub resilver or expansion activity
  ansible.builtin.assert:
    that:
      - item.stdout is not search('(scrub|resilver|expand) in progress')
    fail_msg: "{{ item.item }} has an active ZFS pool operation."
  loop: "{{ pve_bulk_data_compare_pool_status.results }}"

- name: Assert every reported bulk vdev counter is zero
  ansible.builtin.assert:
    that:
      - >-
        item.stdout_lines
        | select('match', '^\s+\S+\s+(ONLINE|DEGRADED|FAULTED|OFFLINE|UNAVAIL|REMOVED)\s+[0-9]+\s+[0-9]+\s+[0-9]+\s*$')
        | list | length > 0
      - >-
        item.stdout_lines
        | select('match', '^\s+\S+\s+(ONLINE|DEGRADED|FAULTED|OFFLINE|UNAVAIL|REMOVED)\s+[0-9]+\s+[0-9]+\s+[0-9]+\s*$')
        | reject('match', '^\s+\S+\s+(ONLINE|DEGRADED|FAULTED|OFFLINE|UNAVAIL|REMOVED)\s+0\s+0\s+0\s*$')
        | list | length == 0
    fail_msg: >-
      {{ item.item }} bulk has no parseable vdev rows or has a non-zero
      reported READ, WRITE, or CKSUM counter.
  loop: "{{ pve_bulk_data_compare_pool_status.results }}"

- name: Assert the source completed a clean scrub
  ansible.builtin.assert:
    that:
      - pve_bulk_data_compare_pool_status.results[0].stdout is search('scrub repaired 0B')
      - pve_bulk_data_compare_pool_status.results[0].stdout is search('errors: No known data errors')
    fail_msg: "Source bulk has no zero-repair, zero-known-error scrub."

- name: Assert every known media writer CT is stopped
  ansible.builtin.command:
    argv: [pct, status, "{{ item | string }}"]
  loop: "{{ pve_bulk_data_compare_media_writer_cts }}"
  register: pve_bulk_data_compare_ct_status
  changed_when: false

- name: Reject a running media writer CT
  ansible.builtin.assert:
    that: [item.stdout == 'status: stopped']
    fail_msg: "Media writer CT {{ item.item }} is not stopped."
  loop: "{{ pve_bulk_data_compare_ct_status.results }}"

- name: Capture exact readonly property values and sources
  ansible.builtin.command:
    argv: [zfs, get, -H, -o, 'value,source', readonly, bulk/data]
  delegate_to: "{{ item }}"
  loop: ["{{ pve_bulk_data_compare_source_node }}", "{{ pve_bulk_data_compare_target_node }}"]
  register: pve_bulk_data_compare_readonly_before
  changed_when: false

- name: Require restorable readonly property sources
  ansible.builtin.assert:
    that:
      - item.stdout.split()[0] in ['on', 'off']
      - item.stdout.split()[1] == 'local' or item.stdout.split()[1] == 'default' or item.stdout is search(' inherited from ')
    fail_msg: "Readonly source on {{ item.item }} is not safely restorable."
  loop: "{{ pve_bulk_data_compare_readonly_before.results }}"
