---
# cluster_ssh_trust tasks — seed /root/.ssh/known_hosts with every cluster
# peer's current host keys, by BOTH hostname and management IP, so inter-node
# root SSH never needs a manual ssh-keyscan (and survives renames); and repair
# the pmxcfs-shared authorized_keys if this node's entry has dropped out of
# it. Skipped under Docker (molecule).

- name: Ensure root .ssh directory exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: cluster_ssh_trust_enabled | bool
  tags:
    - cluster_ssh_trust

- name: Seed cluster peer host keys into known_hosts (idempotent)
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: >-
      set -o pipefail;
      touch /root/.ssh/known_hosts;
      before=$(sort -u /root/.ssh/known_hosts | sha1sum);
      scanned=$(ssh-keyscan -T 5 {{ cluster_ssh_trust_scan_targets | join(' ') }} 2>/dev/null || true);
      printf '%s\n' "$scanned" >> /root/.ssh/known_hosts;
      sort -u -o /root/.ssh/known_hosts /root/.ssh/known_hosts;
      after=$(sha1sum /root/.ssh/known_hosts);
      reachable=$(printf '%s\n' "$scanned" | awk 'NF && $1 !~ /^#/ {print $1}' | sort -u | grep -c . || true);
      echo "RESOLVED=$reachable/{{ cluster_ssh_trust_scan_targets | length }}";
      [[ "${before%% *}" == "${after%% *}" ]] && echo UNCHANGED || echo CHANGED
  register: cluster_ssh_trust_seed
  # stdout is now two lines: RESOLVED=<n>/<total> then UNCHANGED|CHANGED.
  # Match the last line exactly, NOT `'CHANGED' in stdout`: "CHANGED" is a
  # substring of "UNCHANGED", so the `in` test reported changed on every run.
  changed_when: cluster_ssh_trust_seed.stdout_lines[-1] == "CHANGED"
  when:
    - cluster_ssh_trust_enabled | bool
    - cluster_ssh_trust_scan_targets | length > 0
    - ansible_virtualization_type != 'docker'
  tags:
    - cluster_ssh_trust

# ssh-keyscan exits non-zero per unreachable peer and the seed step tolerates
# that, because one node being down must not fail the play. Tolerating it
# silently is the problem: when EVERY peer fails to resolve, known_hosts is
# written unchanged and the step reports ok/changed=0 -- identical to a node
# whose trust is already correct. Inter-node root SSH then fails at the next
# syncoid pull with `Host key verification failed`, far from the cause.
#
# Zero keys scanned is never a legitimate steady state for a node that has
# peers, so it fails here rather than being tolerated.
- name: Assert at least one cluster peer's host keys were scanned
  ansible.builtin.assert:
    that:
      - scanned_count | int > 0
    fail_msg: >-
      ssh-keyscan resolved NONE of the {{ cluster_ssh_trust_scan_targets | length }}
      configured scan targets ({{ cluster_ssh_trust_scan_targets | join(', ') }}),
      so known_hosts was not seeded and inter-node root SSH will fail. The
      usual cause is a peer list that no longer matches live cluster
      membership -- compare it against `pvecm nodes`.
    success_msg: >-
      host keys scanned for {{ scanned_count }} of
      {{ cluster_ssh_trust_scan_targets | length }} scan targets
  vars:
    scanned_count: >-
      {{ (cluster_ssh_trust_seed.stdout_lines[0] | default('RESOLVED=0/0'))
         | regex_replace('^RESOLVED=', '') | split('/') | first }}
  when:
    - cluster_ssh_trust_enabled | bool
    - cluster_ssh_trust_scan_targets | length > 0
    - ansible_virtualization_type != 'docker'
    - not cluster_ssh_trust_seed.skipped | default(false)
  tags:
    - cluster_ssh_trust

# --- pmxcfs authorized_keys membership guard (root inter-node SSH) ---
# On current Proxmox VE, every node keeps its OWN per-node keypair in
# /root/.ssh/id_rsa(.pub) -- this is NOT a shared symlink -- and `pvecm
# updatecerts` folds each node's PUBLIC key into the pmxcfs-shared
# /etc/pve/priv/authorized_keys (replicated to every node, normally
# symlinked as /root/.ssh/authorized_keys). Root SSH between nodes
# (qmigrate, pvecm) works only while every node's pubkey is actually present
# in that shared file. If this node's entry silently drops out of it --
# observed live: pve-w1700's line was gone from the shared file while its
# own /root/.ssh/id_rsa was untouched -- the node can no longer authenticate
# outbound OR be authenticated to, and fails with "Permission denied
# (publickey,password)" / "Can't connect to destination address using
# public key", far from this cause. This is independent of known_hosts
# (above): that is HOST verification, this is KEY acceptance.
#
# `pvecm updatecerts --force` is the vendor-native repair (pve-docs
# pvecm(1): "Update the node certificates and generate all needed
# files/directories" -- this includes re-merging this node's pubkey into
# the shared file). Only run it when this node's key is actually missing,
# never unconditionally, so a healthy node's converge stays a true no-op.
- name: Read this node's public key
  ansible.builtin.slurp:
    src: /root/.ssh/id_rsa.pub
  register: cluster_ssh_trust_id_rsa_pub
  when:
    - cluster_ssh_trust_enabled | bool
    - ansible_virtualization_type != 'docker'
  tags:
    - cluster_ssh_trust

- name: Read the shared authorized_keys
  ansible.builtin.slurp:
    src: /etc/pve/priv/authorized_keys
  register: cluster_ssh_trust_shared_authorized_keys
  when:
    - cluster_ssh_trust_enabled | bool
    - ansible_virtualization_type != 'docker'
  tags:
    - cluster_ssh_trust

- name: Determine whether this node's public key is present in the shared authorized_keys
  ansible.builtin.set_fact:
    cluster_ssh_trust_pubkey_present: >-
      {{
        (cluster_ssh_trust_id_rsa_pub.content | b64decode).split()[:2] | join(' ')
        in (cluster_ssh_trust_shared_authorized_keys.content | b64decode)
      }}
  when:
    - cluster_ssh_trust_enabled | bool
    - ansible_virtualization_type != 'docker'
  tags:
    - cluster_ssh_trust

- name: Repair the shared authorized_keys if this node's key is missing (pvecm updatecerts)
  ansible.builtin.command:
    cmd: pvecm updatecerts --force
  changed_when: true
  notify: Restart pveproxy and pvedaemon
  when:
    - cluster_ssh_trust_enabled | bool
    - ansible_virtualization_type != 'docker'
    - not cluster_ssh_trust_pubkey_present
  tags:
    - cluster_ssh_trust

# updatecerts can regenerate this node's certificate; flush the restart
# handler now rather than at end-of-play, so every check below (and every
# later task in this same converge that calls this node's API) sees the
# restarted pveproxy/pvedaemon, not the ones still serving the old cert.
- name: Flush the pveproxy/pvedaemon restart before checking the served certificate
  ansible.builtin.meta: flush_handlers

# Fail closed: if updatecerts ran and this node's key is STILL missing from
# the shared file, its inter-node SSH stays broken and the play must not
# report green. Re-slurp both files (the repair task may have changed the
# shared one) and re-evaluate the identical membership expression.
- name: Re-read this node's public key after the repair attempt
  ansible.builtin.slurp:
    src: /root/.ssh/id_rsa.pub
  register: cluster_ssh_trust_id_rsa_pub
  when:
    - cluster_ssh_trust_enabled | bool
    - ansible_virtualization_type != 'docker'
  tags:
    - cluster_ssh_trust

- name: Re-read the shared authorized_keys after the repair attempt
  ansible.builtin.slurp:
    src: /etc/pve/priv/authorized_keys
  register: cluster_ssh_trust_shared_authorized_keys
  when:
    - cluster_ssh_trust_enabled | bool
    - ansible_virtualization_type != 'docker'
  tags:
    - cluster_ssh_trust

- name: Assert this node's public key is present in the shared authorized_keys after repair
  ansible.builtin.assert:
    that:
      - >-
        (cluster_ssh_trust_id_rsa_pub.content | b64decode).split()[:2] | join(' ')
        in (cluster_ssh_trust_shared_authorized_keys.content | b64decode)
    fail_msg: >-
      this node's public key is still not present in
      /etc/pve/priv/authorized_keys after `pvecm updatecerts --force` --
      inter-node SSH (migration, pvecm) will keep failing for this node.
    success_msg: "this node's public key is present in the shared authorized_keys"
  when:
    - cluster_ssh_trust_enabled | bool
    - ansible_virtualization_type != 'docker'
  tags:
    - cluster_ssh_trust

# --- served-certificate guard ---
# `pvecm updatecerts` can regenerate /etc/pve/local/pve-ssl.pem (the pmxcfs
# `local` symlink always points at THIS node's own cert directory) without
# the already-running pveproxy ever picking it up -- the handler above
# restarts it, this proves the restart actually happened. Uses the
# vendor-shipped `openssl` (present on every PVE node) rather than adding
# community.crypto as a new collection dependency for one fingerprint
# comparison the estate doesn't otherwise need.
- name: Read the pinned certificate's fingerprint
  ansible.builtin.command:
    cmd: openssl x509 -in /etc/pve/local/pve-ssl.pem -noout -fingerprint -sha256
  register: cluster_ssh_trust_pinned_cert
  changed_when: false
  when:
    - cluster_ssh_trust_enabled | bool
    - ansible_virtualization_type != 'docker'
  tags:
    - cluster_ssh_trust

- name: Read pveproxy's served certificate fingerprint
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: >-
      set -o pipefail;
      openssl s_client -connect 127.0.0.1:8006 </dev/null 2>/dev/null
      | openssl x509 -noout -fingerprint -sha256
  register: cluster_ssh_trust_served_cert
  changed_when: false
  when:
    - cluster_ssh_trust_enabled | bool
    - ansible_virtualization_type != 'docker'
  tags:
    - cluster_ssh_trust

- name: Assert pveproxy is serving the pinned certificate
  ansible.builtin.assert:
    that:
      - cluster_ssh_trust_served_cert.stdout == cluster_ssh_trust_pinned_cert.stdout
    fail_msg: >-
      pveproxy is serving {{ cluster_ssh_trust_served_cert.stdout }} but the
      pinned certificate at /etc/pve/local/pve-ssl.pem is
      {{ cluster_ssh_trust_pinned_cert.stdout }} -- pveproxy is still running
      with the certificate from before the repair. Every cross-node API call
      to this node will keep failing TLS verification until it restarts.
    success_msg: "pveproxy is serving the pinned certificate"
  when:
    - cluster_ssh_trust_enabled | bool
    - ansible_virtualization_type != 'docker'
  tags:
    - cluster_ssh_trust

# --- end-to-end reachability proof (the actual litmus test) ---
# Both guards above can pass -- known_hosts seeded, this node's key present
# in the shared file -- while a SPECIFIC peer is still unreachable by IP
# (observed live: pve-w5900 -> pve-r540 worked by name, failed "Host key
# verification failed" by IP). Proving the fix from this converge's own
# output, rather than trusting the two checks above to imply it, is the
# point: run the exact connection native migration/pvecm makes -- root SSH
# by IP, no password, no prompt -- against every peer, from every node,
# every converge. A failure here means the role is still incomplete for
# that pair, not that this task is broken.
- name: Verify SSH to every peer by IP actually succeeds
  ansible.builtin.command:
    cmd: ssh -n -o BatchMode=yes -o ConnectTimeout=5 root@{{ item }} true
  loop: "{{ cluster_ssh_trust_peer_ips }}"
  loop_control:
    label: "{{ item }}"
  register: cluster_ssh_trust_peer_reachability
  changed_when: false
  when:
    - cluster_ssh_trust_enabled | bool
    - cluster_ssh_trust_peer_ips | length > 0
    - ansible_virtualization_type != 'docker'
  tags:
    - cluster_ssh_trust

- name: Assert every peer is reachable by IP
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: >-
      ssh root@{{ item.item }} (by IP, the address native migration/pvecm
      use) failed with rc={{ item.rc }}: {{ item.stderr | default('') }}.
      known_hosts and/or the shared authorized_keys entry for this pair are
      still wrong -- inter-node operations to/from this peer will keep
      failing.
    success_msg: "peer {{ item.item }} reachable by IP"
  loop: "{{ cluster_ssh_trust_peer_reachability.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - cluster_ssh_trust_enabled | bool
    - cluster_ssh_trust_peer_ips | length > 0
    - ansible_virtualization_type != 'docker'
  tags:
    - cluster_ssh_trust
