---
# media_lxc_features role tasks
#
# Applies the root-only LXC features (host bind-mounts, keyctl, /dev/net/tun
# passthrough) that the BPG Proxmox provider's API token cannot set (Proxmox
# restricts them to root@pam ticket auth -> token gets 403). Runs over native
# root SSH, idempotently, only on media vmids that actually exist on the host.
#
# Ordering: terraform-proxmox creates the media LXCs as plain shells ->
# THIS role applies root-only features -> ansible-proxmox-apps converges the
# services. See README.md.
#
# The feature map is keyed by SERVICE NAME. The effective vmid -> features map
# is built here by resolving each service's CURRENT vmid from the tofu
# inventory (media_lxc_features_service_vmids), so a vmid renumber needs no role
# change — only tofu_inventory.json updates. Services without a resolved
# vmid (not in the inventory) contribute nothing.

# ---------------------------------------------------------------------------
# Shared media data root — POSIX layer inside the bulk/data dataset
# ---------------------------------------------------------------------------
# zfs_pools creates/mounts the dataset (from the tofu node_storage contract);
# this prepares what the bind-mounts expose: the shared `media` group (fixed
# GID — it must resolve identically inside every guest the path is mounted
# into) and the group-writable subdirectory skeleton qBittorrent + the *arrs
# hardlink across. Skipped wholesale on hosts where the data root does not
# exist (no bulk pool on this node, or zfs_pools has not run yet).

- name: Probe for the shared media data root
  ansible.builtin.stat:
    path: "{{ media_lxc_features_data_root }}"
  register: media_lxc_features_data_root_stat
  when: ansible_virtualization_type | default('') != 'docker'
  tags:
    - media_lxc_features

- name: Ensure the shared media group exists
  ansible.builtin.group:
    name: "{{ media_lxc_features_data_group }}"
    gid: "{{ media_lxc_features_data_gid }}"
    state: present
  when: media_lxc_features_data_root_stat.stat.exists | default(false)
  tags:
    - media_lxc_features

- name: Ensure data root ownership and group-writable mode
  ansible.builtin.file:
    path: "{{ media_lxc_features_data_root }}"
    state: directory
    owner: root
    group: "{{ media_lxc_features_data_group }}"
    mode: "{{ media_lxc_features_data_dir_mode }}"
  when: media_lxc_features_data_root_stat.stat.exists | default(false)
  tags:
    - media_lxc_features

- name: Ensure media data subdirectories
  ansible.builtin.file:
    path: "{{ media_lxc_features_data_root }}/{{ item }}"
    state: directory
    owner: root
    group: "{{ media_lxc_features_data_group }}"
    mode: "{{ media_lxc_features_data_dir_mode }}"
  loop: "{{ media_lxc_features_data_directories }}"
  loop_control:
    label: "{{ media_lxc_features_data_root }}/{{ item }}"
  when: media_lxc_features_data_root_stat.stat.exists | default(false)
  tags:
    - media_lxc_features

# Grant root the single-GID sub-range so the data-root idmap (container GID
# 13000 -> host GID 13000) is permitted. Without this line in /etc/subgid an
# unprivileged container carrying the lxc.idmap lines refuses to start. The
# default `root:100000:65536` grant stays untouched; this adds the punch-through.
- name: Permit the shared-data GID in the host subgid map
  ansible.builtin.lineinfile:
    path: /etc/subgid
    line: "root:{{ media_lxc_features_data_gid | int }}:1"
    regexp: "^root:{{ media_lxc_features_data_gid | int }}:1$"
    state: present
    create: false
  when:
    - ansible_virtualization_type | default('') != 'docker'
    - media_lxc_features_data_root_stat.stat.exists | default(false)
  tags:
    - media_lxc_features

- name: Select the services that have a vmid in the tofu inventory
  ansible.builtin.set_fact:
    # Drop any service the inventory does not currently place (not yet created /
    # not deployed). Keeps the join below total over what remains.
    media_lxc_features_selected: >-
      {{
        media_lxc_features_map | dict2items
        | selectattr('key', 'in', media_lxc_features_service_vmids)
        | list
      }}
  tags:
    - media_lxc_features

- name: Resolve the service feature map to the current vmids
  ansible.builtin.set_fact:
    # Join the service-keyed features onto each service's CURRENT vmid (resolved
    # from the tofu inventory), producing the vmid-keyed dict the loop below
    # consumes: { "<vmid>": <features> }. VMIDs are stringified to match the
    # `pct list` present-set. A vmid renumber flows in through the inventory and
    # needs NO change here — each service simply lands on its new vmid.
    media_lxc_features_resolved: >-
      {{
        dict(
          (
            media_lxc_features_selected
            | map(attribute='key')
            | map('extract', media_lxc_features_service_vmids)
            | map('string') | list
          )
          | zip(media_lxc_features_selected | map(attribute='value') | list)
        )
      }}
  tags:
    - media_lxc_features

- name: Enumerate LXC containers present on this host
  ansible.builtin.command:
    cmd: pct list
  register: media_lxc_features_pct_list
  changed_when: false
  when: ansible_virtualization_type | default('') != 'docker'
  tags:
    - media_lxc_features

- name: Build the set of vmids present on this host
  ansible.builtin.set_fact:
    # `pct list` columns: "VMID Status ... Name". Keep only lines beginning with
    # digits (skips the header), then take the leading vmid token from each.
    media_lxc_features_present: >-
      {{
        media_lxc_features_pct_list.stdout_lines | default([])
        | map('regex_search', '^\d+')
        | select('truthy')
        | list
      }}
  when: ansible_virtualization_type | default('') != 'docker'
  tags:
    - media_lxc_features

- name: Reset the changed-container accumulator
  ansible.builtin.set_fact:
    media_lxc_features_changed: []
  tags:
    - media_lxc_features

- name: Apply root-only features to each present media container
  ansible.builtin.include_tasks: configure_container.yml
  loop: "{{ media_lxc_features_resolved | default({}) | dict2items }}"
  loop_control:
    loop_var: media_ct
    label: "container {{ media_ct.key }}"
  when:
    - ansible_virtualization_type | default('') != 'docker'
    - media_ct.key in media_lxc_features_present | default([])
  tags:
    - media_lxc_features
