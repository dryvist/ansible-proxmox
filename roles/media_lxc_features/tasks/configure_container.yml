---
# Apply root-only features to a single media LXC container.
# media_ct.key   = container ID (string)
# media_ct.value = { mounts: [...], keyctl: bool, tun: bool }
#
# Idempotency strategy: read the live config with `pct config` FIRST, then make
# each change only when the desired state is absent/different. Any task that
# mutates config appends the vmid to media_lxc_features_changed and notifies the
# restart handler.
#
# The phases below are ORDER-DEPENDENT: bind-mounts must land before ownership
# is reconciled, and the idmap remap must land before the apps converge onto
# the mounted rootfs. Do not reorder these includes. media_ct is inherited
# from this file's own caller (the loop in main.yml).

- name: "Read config and resolve bind-mount host source availability on {{ media_ct.key }}"
  ansible.builtin.include_tasks: mount_preflight.yml

- name: "Set and prune bind-mounts on {{ media_ct.key }}"
  ansible.builtin.include_tasks: bind_mounts.yml

- name: "Reconcile config-mount ownership and the keyctl feature on {{ media_ct.key }}"
  ansible.builtin.include_tasks: ownership_and_keyctl.yml

- name: "Reconcile the /dev/net/tun passthrough on {{ media_ct.key }}"
  ansible.builtin.include_tasks: tun_passthrough.yml

- name: "Reconcile the shared-data idmap on {{ media_ct.key }}"
  ansible.builtin.include_tasks: idmap.yml
