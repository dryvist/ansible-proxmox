---
# Apply root-only features to a single media LXC container.
# media_ct.key   = container ID (string)
# media_ct.value = { mounts: [...], keyctl: bool, tun: bool }
#
# Idempotency strategy: read the live config with `pct config` FIRST, then make
# each change only when the desired state is absent/different. Any task that
# mutates config appends the vmid to media_lxc_features_changed and notifies the
# restart handler.

- name: "Read current config for container {{ media_ct.key }}"
  ansible.builtin.command:
    cmd: "pct config {{ media_ct.key }}"
  register: media_lxc_features_cfg
  changed_when: false
  tags:
    - media_lxc_features

# ---------------------------------------------------------------------------
# Host mount-source existence — a SAFETY GATE for the bind-mounts below
# ---------------------------------------------------------------------------
# A bind-mount whose host source does NOT exist makes `pct` auto-create an empty
# directory and mount it over the in-container target. For an app-config mount
# (bulk/appdata/<app>) that would SHADOW the app's live database with emptiness
# and the app would re-initialise on restart (data loss). So stat every source
# first and only mount the ones that already exist (the shared bulk/data plus any
# appdata dataset zfs_pools has realised). A missing dataset is surfaced loudly
# and skipped, never silently emptied.
- name: "Stat host mount sources on {{ media_ct.key }}"
  ansible.builtin.stat:
    path: "{{ media_src_path }}"
  loop: "{{ media_ct.value.mounts | default([]) | map(attribute='src') | list }}"
  loop_control:
    loop_var: media_src_path
    label: "{{ media_ct.key }} src {{ media_src_path }}"
  register: media_lxc_features_src_stats
  tags:
    - media_lxc_features

- name: "Build the source-exists map on {{ media_ct.key }}"
  ansible.builtin.set_fact:
    media_lxc_features_src_exists: >-
      {{
        dict(
          (media_lxc_features_src_stats.results | default([]) | map(attribute='media_src_path') | list)
          | zip(media_lxc_features_src_stats.results | default([]) | map(attribute='stat.exists') | list)
        )
      }}
  tags:
    - media_lxc_features

- name: "Warn on any missing host mount source on {{ media_ct.key }}"
  ansible.builtin.debug:
    msg: >-
      Host mount source {{ media_missing_src }} does not exist on this node — its
      bind-mount is SKIPPED so it cannot shadow a live config with emptiness. Run
      the zfs_pools role first to realise the dataset.
  loop: >-
    {{
      media_lxc_features_src_exists | dict2items
      | rejectattr('value') | map(attribute='key') | list
    }}
  loop_control:
    loop_var: media_missing_src
    label: "{{ media_ct.key }} MISSING {{ media_missing_src }}"
  tags:
    - media_lxc_features

# ---------------------------------------------------------------------------
# ONE-TIME seed: copy a live config dir into its (empty) dataset BEFORE the mount
# ---------------------------------------------------------------------------
# First cutover only, per owner-bearing (app-config) mount. Guarded inside the
# included file so it runs exactly once: mount-absent + dataset-exists-and-empty +
# container-dir-populated. After the first run the dataset is the source of truth
# and this is a no-op. Runs BEFORE the bind-mounts below so the mount never
# shadows live state with an empty dataset.
- name: "Seed config datasets from live container dirs on {{ media_ct.key }}"
  ansible.builtin.include_tasks: seed_config_dataset.yml
  loop: >-
    {{
      (media_ct.value.mounts | default([]) | selectattr('owner_user', 'defined') | list)
      + (media_ct.value.mounts | default([]) | selectattr('owner_uid', 'defined') | list)
    }}
  loop_control:
    loop_var: media_cfg_mp
    label: "{{ media_ct.key }} seed {{ media_cfg_mp.src }}"
  tags:
    - media_lxc_features

# ---------------------------------------------------------------------------
# Bind-mounts (mp0, mp1, ...) — host path -> in-container target, optional ro
# ---------------------------------------------------------------------------
# Desired line shape (matches `pct config` readback, e.g. CT 252):
#   mpN: <host>,mp=<target>[,ro=1]
# We compare the desired mp string against the current value of that exact mpN
# slot and only `pct set` when missing or different.

- name: "Set bind-mounts on container {{ media_ct.key }}"
  ansible.builtin.command:
    cmd: >-
      pct set {{ media_ct.key }}
      --mp{{ media_mp_idx }}
      {{ media_mp.src }},mp={{ media_mp.dst }}{{ ',ro=1' if (media_mp.ro | default(false)) else '' }}
  loop: "{{ media_ct.value.mounts | default([]) }}"
  loop_control:
    loop_var: media_mp
    index_var: media_mp_idx
    label: "{{ media_ct.key }} mp{{ media_mp_idx }}: {{ media_mp.src }} -> {{ media_mp.dst }}"
  vars:
    media_mp_desired: >-
      {{ media_mp.src }},mp={{ media_mp.dst }}{{ ',ro=1' if (media_mp.ro | default(false)) else '' }}
    media_mp_current: >-
      {{
        media_lxc_features_cfg.stdout_lines
        | select('match', '^mp' ~ media_mp_idx ~ ':')
        | map('regex_replace', '^mp' ~ media_mp_idx ~ ':\s*', '')
        | list | first | default('')
      }}
  when:
    - media_mp_current != media_mp_desired
    # Never mount a host source that does not exist — `pct` would auto-create an
    # empty dir and shadow a live config. A missing dataset is skipped (warned above).
    - media_lxc_features_src_exists[media_mp.src] | default(false)
  changed_when: true
  notify: Restart changed media containers
  register: media_lxc_features_mp_set
  tags:
    - media_lxc_features

- name: "Record bind-mount change for container {{ media_ct.key }}"
  ansible.builtin.set_fact:
    media_lxc_features_changed: "{{ media_lxc_features_changed | default([]) + [media_ct.key] }}"
  when: media_lxc_features_mp_set is defined and media_lxc_features_mp_set.changed
  tags:
    - media_lxc_features

# ---------------------------------------------------------------------------
# Per-app config-mount ownership (mounts carrying `owner_user` or `owner_uid`)
# ---------------------------------------------------------------------------
# A mount whose host dataset must be owned by an in-container app owner (e.g. the
# plex user on bulk/appdata/plex, or seerr's raw uid 1000 on bulk/appdata/seerr)
# gets chowned to that owner's MAPPED host uid/gid (unpriv_base + the in-container
# id). Looped over every owner-bearing mount, so a container with more than one
# app-config mount (download-vpn: qbittorrent + prowlarr) reconciles each. A mount
# carries EITHER owner_user (named, resolved live) OR owner_uid/owner_gid
# (explicit) — the union below selects both; no mount carries both keys.
# Per-mount logic in the included file (idempotent stat-then-chown; non-fatal skip
# when the app user isn't installed yet on a fresh build — the dataset data lives
# off the rootfs and is never at risk).
- name: "Reconcile config-mount ownership on {{ media_ct.key }}"
  ansible.builtin.include_tasks: reconcile_config_owner.yml
  loop: >-
    {{
      (media_ct.value.mounts | default([]) | selectattr('owner_user', 'defined') | list)
      + (media_ct.value.mounts | default([]) | selectattr('owner_uid', 'defined') | list)
    }}
  loop_control:
    loop_var: media_cfg_mp
    label: >-
      {{ media_ct.key }} {{ media_cfg_mp.src }} -> owner
      {{ media_cfg_mp.owner_user | default('uid ' ~ media_cfg_mp.owner_uid | default('?')) }}
  tags:
    - media_lxc_features

# ---------------------------------------------------------------------------
# keyctl feature — MERGE into existing features (preserve tofu-set nesting)
# ---------------------------------------------------------------------------
# Parse the current `features:` line into a key=val map, add keyctl=1 if absent,
# and only `pct set --features` when the merged set differs from the current.

- name: "Ensure keyctl feature on container {{ media_ct.key }}"
  when: media_ct.value.keyctl | default(false)
  tags:
    - media_lxc_features
  block:
    - name: "Parse current features into a token set for {{ media_ct.key }}"
      ansible.builtin.set_fact:
        # `features:` value (e.g. "nesting=1") -> ["nesting=1"]. Empty list when
        # the container has no features line yet.
        media_lxc_features_cur_tokens: >-
          {{
            media_lxc_features_cfg.stdout_lines
            | select('match', '^features:')
            | map('regex_replace', '^features:\s*', '')
            | list | first | default('')
            | split(',') | select('truthy') | list
          }}

    - name: "Compute merged feature tokens (keyctl added, nesting preserved) for {{ media_ct.key }}"
      ansible.builtin.set_fact:
        # Drop any existing keyctl=* token, append keyctl=1, sort for stability.
        # Every other token (e.g. tofu-set nesting=1) is preserved verbatim.
        media_lxc_features_merged_tokens: >-
          {{
            (
              (media_lxc_features_cur_tokens | reject('match', '^keyctl=') | list)
              + ['keyctl=1']
            ) | sort
          }}

    - name: "Apply merged features to container {{ media_ct.key }}"
      ansible.builtin.command:
        cmd: "pct set {{ media_ct.key }} --features {{ media_lxc_features_merged_tokens | join(',') }}"
      when: (media_lxc_features_cur_tokens | sort) != media_lxc_features_merged_tokens
      changed_when: true
      notify: Restart changed media containers
      register: media_lxc_features_feat_set

    - name: "Record feature change for container {{ media_ct.key }}"
      ansible.builtin.set_fact:
        media_lxc_features_changed: "{{ media_lxc_features_changed | default([]) + [media_ct.key] }}"
      when: media_lxc_features_feat_set is defined and media_lxc_features_feat_set.changed

# ---------------------------------------------------------------------------
# /dev/net/tun device passthrough — raw LXC config lines in the .conf file
# ---------------------------------------------------------------------------
# `pct set` has no flag for arbitrary device passthrough, so the standard method
# is two raw lines in /etc/pve/lxc/<vmid>.conf:
#   lxc.cgroup2.devices.allow: c 10:200 rwm
#   lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
#
# IMPORTANT: blockinfile is NOT usable here, for the same reason as the idmap
# section below. Proxmox's pmxcfs rewrites the .conf on every change — it
# relocates raw `lxc.*` keys to the end of the file and strips comment markers —
# so the blockinfile markers vanish and a second run re-appends the lines,
# duplicating the passthrough and eventually making the container refuse to
# start. Instead, compare the present tun line-set to the desired one and only
# rewrite (drop-all + re-add) on a difference; a converged host makes no change
# and triggers no restart.

# One-time cleanup of the stale blockinfile markers left by the earlier
# (withdrawn) implementation. Idempotent: a no-op once the comment lines are gone.
- name: "Remove stale tun blockinfile markers on {{ media_ct.key }}"
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ media_ct.key }}.conf"
    regexp: "ANSIBLE MANAGED BLOCK media_lxc_features tun"
    state: absent
  when: media_ct.value.tun | default(false)
  tags:
    - media_lxc_features

- name: "Read the LXC config to compare the tun passthrough on {{ media_ct.key }}"
  ansible.builtin.slurp:
    src: "/etc/pve/lxc/{{ media_ct.key }}.conf"
  register: media_lxc_features_tun_conf_raw
  when: media_ct.value.tun | default(false)
  tags:
    - media_lxc_features

- name: "Compute the present tun line-set on {{ media_ct.key }}"
  ansible.builtin.set_fact:
    # Only the tun-specific passthrough lines: the cgroup allow for this
    # major:minor and the /dev/net/tun mount entry. Other raw lines (idmap,
    # unrelated mount entries) are left untouched.
    media_lxc_features_cur_tun: >-
      {{
        (media_lxc_features_tun_conf_raw.content | b64decode).splitlines()
        | map('trim')
        | select('match', '^lxc\.cgroup2\.devices\.allow:\s*c ' ~ media_lxc_features_tun_major ~ ':' ~ media_lxc_features_tun_minor ~ ' |^lxc\.mount\.entry:\s*/dev/net/tun ')
        | list
      }}
  when: media_ct.value.tun | default(false)
  tags:
    - media_lxc_features

- name: "Reconcile the /dev/net/tun passthrough on {{ media_ct.key }}"
  when:
    - media_ct.value.tun | default(false)
    - (media_lxc_features_cur_tun | sort)
      != (media_lxc_features_tun_lines | map('trim') | sort)
  tags:
    - media_lxc_features
  block:
    - name: "Drop any existing tun cgroup-allow line on {{ media_ct.key }}"
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ media_ct.key }}.conf"
        regexp: '^lxc\.cgroup2\.devices\.allow:\s*c {{ media_lxc_features_tun_major }}:{{ media_lxc_features_tun_minor }} '
        state: absent

    - name: "Drop any existing tun mount-entry line on {{ media_ct.key }}"
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ media_ct.key }}.conf"
        regexp: '^lxc\.mount\.entry:\s*/dev/net/tun '
        state: absent

    - name: "Write the desired tun passthrough lines on {{ media_ct.key }}"
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ media_ct.key }}.conf"
        line: "{{ item }}"
        insertafter: EOF
        state: present
      loop: "{{ media_lxc_features_tun_lines }}"
      notify: Restart changed media containers

    - name: "Record tun-passthrough change for container {{ media_ct.key }}"
      ansible.builtin.set_fact:
        media_lxc_features_changed: "{{ media_lxc_features_changed | default([]) + [media_ct.key] }}"

# ---------------------------------------------------------------------------
# Shared-data GID idmap — raw LXC config lines in the .conf file
# ---------------------------------------------------------------------------
# Maps host GID 13000 (owner of /bulk/data) 1:1 into the unprivileged container
# so the bind-mounted /data is writable by the in-container `media` user instead
# of showing up as nobody:nogroup. `pct set` has no flag for idmap, so the lines
# live directly in /etc/pve/lxc/<vmid>.conf.
#
# IMPORTANT: blockinfile is NOT usable here. Proxmox's pmxcfs rewrites the .conf
# on every change — it relocates raw `lxc.*` keys to the end of the file and
# strips comment markers — so the blockinfile markers vanish and a second run
# re-appends the lines, duplicating `u 0 100000 65536` and making the container
# refuse to start. Instead, compare the present idmap line-set to the desired
# one and only rewrite (drop-all + re-add) on a difference; a converged host
# makes no change and triggers no restart. Apply BEFORE the apps converge so the
# rootfs remap is harmless (no app data yet).

# One-time cleanup of the stale blockinfile markers left by the earlier
# (withdrawn) implementation. Idempotent: a no-op once the comment lines are gone.
- name: "Remove stale idmap blockinfile markers on {{ media_ct.key }}"
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ media_ct.key }}.conf"
    regexp: "ANSIBLE MANAGED BLOCK media_lxc_features data idmap"
    state: absent
  when: media_ct.value.data_idmap | default(false)
  tags:
    - media_lxc_features

- name: "Read the LXC config to compare the idmap on {{ media_ct.key }}"
  ansible.builtin.slurp:
    src: "/etc/pve/lxc/{{ media_ct.key }}.conf"
  register: media_lxc_features_conf_raw
  when: media_ct.value.data_idmap | default(false)
  tags:
    - media_lxc_features

- name: "Compute the present idmap line-set on {{ media_ct.key }}"
  ansible.builtin.set_fact:
    media_lxc_features_cur_idmap: >-
      {{
        (media_lxc_features_conf_raw.content | b64decode).splitlines()
        | map('trim') | select('match', '^lxc\.idmap:') | list
      }}
  when: media_ct.value.data_idmap | default(false)
  tags:
    - media_lxc_features

- name: "Reconcile the shared-data idmap on {{ media_ct.key }}"
  when:
    - media_ct.value.data_idmap | default(false)
    - (media_lxc_features_cur_idmap | sort)
      != (media_lxc_features_data_idmap_lines | map('trim') | sort)
  tags:
    - media_lxc_features
  block:
    - name: "Drop any existing idmap lines on {{ media_ct.key }}"
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ media_ct.key }}.conf"
        regexp: '^lxc\.idmap:'
        state: absent

    - name: "Write the desired idmap lines on {{ media_ct.key }}"
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ media_ct.key }}.conf"
        line: "{{ item }}"
        insertafter: EOF
        state: present
      loop: "{{ media_lxc_features_data_idmap_lines }}"
      notify: Restart changed media containers

    - name: "Record idmap change for container {{ media_ct.key }}"
      ansible.builtin.set_fact:
        media_lxc_features_changed: "{{ media_lxc_features_changed | default([]) + [media_ct.key] }}"
