---
# media_lxc_features role defaults
#
# Root-only LXC features for the media stack that the BPG Proxmox provider's
# API token CANNOT set: host bind-mounts (mp), the keyctl feature, and
# /dev/net/tun device passthrough. Proxmox restricts all three to root@pam
# *ticket* auth, so the API token gets HTTP 403. OpenTofu creates the media
# LXCs as plain shells; this role applies the root-only bits over native root
# SSH, idempotently.
#
# The feature map is keyed by SERVICE NAME (plex, seerr, sonarr, radarr,
# download-vpn, sortarr) — NOT by raw VMID. Each service's current VMID is resolved at
# run time from the tofu inventory (containers keyed by hostname, each with
# a `vmid`), injected onto proxmox hosts by playbooks/load_tofu.yml as
# `media_lxc_features_service_vmids_from_tofu`. A future VMID renumber needs
# ZERO changes here: the new vmid flows in through tofu_inventory.json and
# each service keeps its features automatically. No IPs, no secrets — safe to
# commit.
#
# Per-service shape:
#   mounts:     list of { src: <host path>, dst: <in-container path>, ro: <bool,
#               default false>, owner_user: <optional in-container user that must
#               OWN this host dataset — chowns src to that user's mapped host
#               uid/gid; for app-private config dirs, vs the shared-GID /data>,
#               owner_uid/owner_gid: <optional explicit in-container uid:gid when
#               the owner is a raw numeric id with no named user — e.g. seerr's
#               Docker `node` (uid 1000). Same mapped-host chown as owner_user,
#               but skips the name lookup. Use one of owner_user OR owner_uid> }
#   keyctl:     bool — ensure features contains keyctl=1, MERGED into existing
#               features (tofu-set nesting=1 is preserved, never dropped)
#   tun:        bool — passthrough /dev/net/tun (char 10:200) into the container
#   data_idmap: bool — punch an LXC idmap so host GID 13000 (the shared `media`
#               group that owns /bulk/data) maps 1:1 into the unprivileged
#               container. Without it, host GID 13000 falls below the unpriv map
#               base (100000) and /data appears as nobody:nogroup inside —
#               read-only to the container's `media` user. Set on every service
#               that bind-mounts /data (all but seerr, which mounts only its own
#               config dataset, not the shared /data).
#
# Only vmids that actually exist on the target host are acted on; absent vmids
# are skipped (tofu may not have created them yet). All tasks are skipped
# under Docker virtualization (molecule).
# Mount layout (bulk-node rebuild): every service bind-mounts the unified
# `bulk/data` dataset (host /bulk/data) -> /data in-container. The single dataset
# is what lets qBittorrent and the *arrs HARDLINK between /data/torrents/* and
# /data/media/* (hardlinks cannot cross the old downloads/media dataset
# boundary). All mounts stay read-write (the role's existing convention; plex is
# read-mostly by usage, not by mount flag).
#
# EVERY media service additionally bind-mounts a PERSISTENT app-config dataset
# (bulk/appdata/<service>) over the directory holding its database + settings, so
# all of its own state survives a container restart OR rebuild instead of living
# on the disposable rootfs. The app rebuilds itself from its own DB on startup —
# no export/replay needed. What each persists:
#   plex          /var/lib/plexmediaserver  identity (machineIdentifier + claim +
#                                            publish) + watch-history DB
#   sonarr        /var/lib/sonarr           sonarr.db (series, history, queue,
#                                            blocklist) + config.xml
#   radarr        /var/lib/radarr           radarr.db + config.xml
#   download-vpn  /var/lib/prowlarr         prowlarr.db (indexers, private-tracker
#                                            auth, app-sync links)
#   seerr         /opt/seerr/config         settings.json + db.sqlite3 (users,
#                                            requests, service registrations)
#   sortarr       /opt/sortarr/data         app config + cache (Sortarr calls
#                                            Sonarr/Radarr/Plex over HTTP; no
#                                            /data mount of its own)
# Ownership is the app's OWN mapped host id (owner_user, or owner_uid for seerr's
# unnamed Docker uid 1000, or sortarr's root uid 0 — its image has no
# PUID/PGID support), not the shared media GID.
media_lxc_features_map:
  plex:  # media streaming
    mounts:
      - { src: /bulk/data, dst: /data }
      - { src: /bulk/appdata/plex, dst: /var/lib/plexmediaserver, owner_user: plex }
    keyctl: false
    tun: false
    data_idmap: true
  seerr:  # request UI (Docker-in-LXC); config-only persistence, no /data mount
    mounts:
      - { src: /bulk/appdata/seerr, dst: /opt/seerr/config, owner_uid: 1000, owner_gid: 1000 }
    keyctl: true
    tun: false
    data_idmap: false
  sonarr:  # TV PVR
    mounts:
      - { src: /bulk/data, dst: /data }
      - { src: /bulk/appdata/sonarr, dst: /var/lib/sonarr, owner_user: media }
    keyctl: false
    tun: false
    data_idmap: true
  radarr:  # movie PVR
    mounts:
      - { src: /bulk/data, dst: /data }
      - { src: /bulk/appdata/radarr, dst: /var/lib/radarr, owner_user: media }
    keyctl: false
    tun: false
    data_idmap: true
  download-vpn:  # qBittorrent + Prowlarr behind Proton WireGuard (both run as the qbittorrent user)
    mounts:
      - { src: /bulk/data, dst: /data }
      - { src: /bulk/appdata/prowlarr, dst: /var/lib/prowlarr, owner_user: qbittorrent }
    keyctl: true
    tun: true
    data_idmap: true
  sortarr:  # media-library insights dashboard (Docker-in-LXC); config-only persistence, no /data mount
    mounts:
      - { src: /bulk/appdata/sortarr, dst: /opt/sortarr/data, owner_uid: 0, owner_gid: 0 }
    keyctl: true
    tun: false
    data_idmap: false

# Service -> VMID resolution, sourced from the tofu inventory and injected
# onto proxmox hosts by playbooks/load_tofu.yml. Defaults to {} when unset
# (e.g. a bare role run without load_tofu), in which case the role resolves
# no containers and acts on nothing — the safe no-op.
media_lxc_features_service_vmids: >-
  {{
    media_lxc_features_service_vmids_from_tofu
    | default(hostvars[inventory_hostname].media_lxc_features_service_vmids_from_tofu | default({}), true)
  }}

# /dev/net/tun device numbers (char major:minor). Stable Linux allocation for
# the TUN/TAP driver. Verified live: `stat -c %t:%T /dev/net/tun` -> a:c8
# (hex) == 10:200 (decimal).
media_lxc_features_tun_major: 10
media_lxc_features_tun_minor: 200

# Raw LXC config lines that pass /dev/net/tun through to the guest. `pct set` has
# no flag for arbitrary device passthrough, so these live directly in
# /etc/pve/lxc/<vmid>.conf. Reconciled the same drop-all/re-add way as the idmap
# lines (see configure_container.yml) because pmxcfs relocates raw `lxc.*` keys
# and strips comment markers, which makes a marker-guarded blockinfile re-append
# duplicates on every run.
media_lxc_features_tun_lines:
  - "lxc.cgroup2.devices.allow: c {{ media_lxc_features_tun_major }}:{{ media_lxc_features_tun_minor }} rwm"
  - "lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file"

# ---------------------------------------------------------------------------
# Shared media data root (host side of the bind-mount)
# ---------------------------------------------------------------------------
# The `bulk/data` DATASET itself (recordsize, auto-snapshot, quota) is declared
# in terraform-proxmox node_storage and realized by the zfs_pools role. This
# role owns the POSIX layer inside it: the shared `media` group and the
# group-writable subdirectory skeleton qBittorrent + the *arrs hardlink across.
# Same owner/group/mode convention as the nas_storage directory tasks
# (owner root, shared group, group-writable), plus setgid (2775) so content the
# apps create keeps the `media` group without per-app umask coupling.
#
# The GID is fixed (13000) because the path is bind-mounted into several LXCs:
# in-container `media` groups must map to the same host GID on every guest.
# Tasks run only when the data root already exists on the host (i.e. zfs_pools
# mounted the dataset there) — nodes without the bulk pool are skipped, and a
# plain directory is never invented on the root filesystem.
media_lxc_features_data_root: /bulk/data
media_lxc_features_data_group: media
media_lxc_features_data_gid: 13000
media_lxc_features_data_dir_mode: "2775"
media_lxc_features_data_directories:
  - torrents
  - torrents/incomplete
  - torrents/movies
  - torrents/tv
  - media
  - media/movies
  - media/tv
  # *arr recycle bin (soft-delete). MUST share the /data filesystem so
  # deletes are atomic moves; the *arrs validate it exists and is writable
  # by the media user before accepting it, so the skeleton owns creating it.
  - media/.recycle

# ---------------------------------------------------------------------------
# Unprivileged-container GID passthrough for the shared data root
# ---------------------------------------------------------------------------
# An unprivileged LXC maps container UID/GID 0..65535 -> host 100000..165535 by
# default, so host GID 13000 (which owns /bulk/data) lands on the overflow id
# (nobody:nogroup) inside the container and the `media` user cannot write. These
# lxc.idmap lines punch GID 13000 straight through (container 13000 -> host
# 13000) while leaving every other id on the default offset, so /data shows up
# as media:media and stays group-writable. The UID map is left at the default.
# The host /etc/subgid must grant root the single-GID sub-range (added by the
# role) or the container refuses to start.
#
# Derived from media_lxc_features_data_gid so a GID change needs no edit here.
media_lxc_features_data_idmap_lines:
  - "lxc.idmap: u 0 100000 65536"
  - "lxc.idmap: g 0 100000 {{ media_lxc_features_data_gid | int }}"
  - "lxc.idmap: g {{ media_lxc_features_data_gid | int }} {{ media_lxc_features_data_gid | int }} 1"
  - >-
    lxc.idmap: g {{ media_lxc_features_data_gid | int + 1 }}
    {{ 100000 + (media_lxc_features_data_gid | int) + 1 }}
    {{ 65536 - (media_lxc_features_data_gid | int) - 1 }}

# ---------------------------------------------------------------------------
# Per-app config-dataset ownership (unprivileged-LXC mapped UID/GID)
# ---------------------------------------------------------------------------
# A mount carrying `owner_user: <name>` (e.g. plex on bulk/appdata/plex) holds an
# app's PRIVATE config, owned by the app USER — unlike the shared /bulk/data,
# which is group-owned via the GID-13000 idmap punch-through. The plex container
# leaves its UID map at the default offset, so the in-container app user (uid N)
# maps to host UID `unpriv_base + N`. The role chowns the HOST dataset to that
# mapped uid/gid (resolved LIVE per container — the ids are package-assigned,
# never hardcoded) so the dir appears as <user>:<user> and stays writable inside.
media_lxc_features_unpriv_base: 100000

# NFS client mounts (media relocation prereq — issue #395, terraform-proxmox#615).
# Lets a relocation target node reach the media library that stays on the
# storage node (exported ro via the tofu node_storage `nfs_export` contract)
# at the SAME host path the `mounts` map expects, so the per-container
# bind-mounts need zero changes. Empty by default — realized only on hosts
# whose host_vars declare entries. Shape:
#   - { src: "<host>:/bulk/data", path: /bulk/data, opts: "ro,soft,timeo=150,nofail,_netdev" }
media_lxc_features_nfs_mounts: []
