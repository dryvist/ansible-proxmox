---
# Select this node's model-store containers from the published inventory,
# minus any hostname in llm_model_store_seed_exclude_hostnames. Split out so
# tests/llm_model_store_seed/verify_exclude_hostnames.yml runs this exact file.

- name: Find this node's llm-fabric model-store containers in the published inventory
  ansible.builtin.set_fact:
    llm_model_store_seed_targets: >-
      {{
        (containers_from_tofu | default({})) | dict2items
        | selectattr('value.node', 'defined')
        | selectattr('value.node', 'equalto', llm_model_store_seed_node_name)
        | selectattr('value.models_mount_path', 'defined')
        | rejectattr('value.models_mount_path', 'equalto', None)
        | rejectattr('value.hostname', 'in', llm_model_store_seed_exclude_hostnames)
        | map(attribute='value') | list
      }}
  tags:
    - llm_model_store_seed
