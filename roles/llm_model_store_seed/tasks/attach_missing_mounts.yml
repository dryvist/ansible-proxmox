---
# Attach a declared-but-not-yet-live models mount natively, the way
# media_lxc_features already applies its own root@pam-only mount_point
# changes. Needed because modules/proxmox-container/main.tf (tofu-proxmox)
# puts mount_point in ignore_changes: the BPG API token can't set it
# (root@pam-only), so terraform never applies a mount_points addition to an
# already-created container — deployment.json can declare the mount and the
# published inventory picks it up, but the live guest never sees it without
# this step.
#
# PVE docs (pct(1), the container config reference): mpN is a container BOOT
# CONFIG key, not a hotpluggable device — a mount_point change only takes
# effect on the container's next start. This matches the estate's own proven
# convention (media_lxc_features/handlers/main.yml): every mount_point change
# is followed by an explicit reboot (running) or start (stopped), never
# assumed to hotplug.
#
# Runs once per node, after the first read_mount_config.yml (so
# llm_model_store_seed_mount_matches reflects the CURRENT live state) and
# before the "require exactly one" assert in seed_node.yml, which reads the
# config again afterward via a second read_mount_config.yml include.

- name: Reset the missing-target accumulator
  ansible.builtin.set_fact:
    llm_model_store_seed_missing: []

# A plain string-keyed attribute lookup ('1') on a zip() tuple resolves via
# Jinja's environment.getattr, which does not fall back to integer indexing
# the way template syntax like item.1 does -- selectattr('1', ...) would
# silently match nothing. Loop + accumulate instead, matching the pattern
# already used for llm_model_store_seed_mount_matches itself.
- name: Identify targets whose declared models mount is not yet live
  ansible.builtin.set_fact:
    llm_model_store_seed_missing: >-
      {{
        llm_model_store_seed_missing
        + ([item.0] if item.1 == [] else [])
      }}
  loop: "{{ llm_model_store_seed_targets | zip(llm_model_store_seed_mount_matches) | list }}"
  loop_control:
    label: "{{ item.0.hostname }}"

- name: Require an allocation spec for every target missing its mount
  ansible.builtin.assert:
    that:
      - item.models_mount_storage is not none
      - item.models_mount_size is not none
    fail_msg: >-
      {{ item.hostname }} declares models_mount_path
      ({{ item.models_mount_path }}) with no live mpN backing it, but the
      published inventory has no models_mount_storage/models_mount_size to
      create one from. Refusing to guess a storage pool or size.
    quiet: true
  loop: "{{ llm_model_store_seed_missing }}"
  loop_control:
    label: "{{ item.hostname }}"

- name: Reset the used-mpN-index accumulator
  ansible.builtin.set_fact:
    llm_model_store_seed_used_mp_idxs: {}

- name: Record each target's currently-used mpN indices
  ansible.builtin.set_fact:
    llm_model_store_seed_used_mp_idxs: >-
      {{
        llm_model_store_seed_used_mp_idxs | combine({
          item.hostname: (
            ((llm_model_store_seed_configs.results
              | selectattr('item.hostname', 'equalto', item.hostname) | first
            ).stdout | from_json) | dict2items
            | selectattr('key', 'match', '^mp[0-9]+$')
            | map(attribute='key') | map('regex_replace', '^mp', '') | map('int') | list
          )
        })
      }}
  loop: "{{ llm_model_store_seed_missing }}"
  loop_control:
    label: "{{ item.hostname }}"

# A container with zero existing mpN entries has no key to take max() of --
# max() on an empty list raises, so -1 is appended as a sentinel first,
# guaranteeing a non-empty list either way (giving index 0 when none exist).
- name: Reset the next-free-mpN-index accumulator
  ansible.builtin.set_fact:
    llm_model_store_seed_next_mp_idx: {}

- name: Find the next free mpN index per target missing its mount
  ansible.builtin.set_fact:
    llm_model_store_seed_next_mp_idx: >-
      {{
        llm_model_store_seed_next_mp_idx | combine({
          item.hostname: ((llm_model_store_seed_used_mp_idxs[item.hostname] + [-1]) | max + 1)
        })
      }}
  loop: "{{ llm_model_store_seed_missing }}"
  loop_control:
    label: "{{ item.hostname }}"

- name: Attach each missing models mount (pct set)
  ansible.builtin.command:
    argv:
      - pct
      - set
      - "{{ item.vmid }}"
      - "--mp{{ llm_model_store_seed_next_mp_idx[item.hostname] }}"
      - >-
        {{ item.models_mount_storage }}:{{ item.models_mount_size }},mp={{
        item.models_mount_path }}{{ ',ro=1' if item.models_mount_read_only else '' }}
  loop: "{{ llm_model_store_seed_missing }}"
  loop_control:
    label: >-
      {{ item.hostname }} mp{{ llm_model_store_seed_next_mp_idx[item.hostname] }}:
      {{ item.models_mount_storage }}:{{ item.models_mount_size }} -> {{ item.models_mount_path }}
  changed_when: true
  notify: Restart changed llm model-store containers
  register: llm_model_store_seed_attach

- name: Record which containers changed, for the restart handler
  ansible.builtin.set_fact:
    llm_model_store_seed_changed: >-
      {{ llm_model_store_seed_missing | map(attribute='vmid') | list }}
  when: llm_model_store_seed_missing | length > 0

# Apply the restart NOW rather than at end-of-play: seed_model.yml (a later
# include in this same run) does not depend on it -- pct set already
# allocates the managed volume synchronously, before any start -- but the
# guest itself will not see the new mount in its own filesystem until it
# restarts, and doing that promptly (not deferred) keeps this role's own log
# output the one place that shows it happened.
- name: Apply the mount-attach restart immediately
  ansible.builtin.meta: flush_handlers

- name: Log the mount-attach restart for each affected container
  ansible.builtin.debug:
    msg: >-
      {{ item.hostname }} (vmid {{ item.vmid }}): attached
      {{ item.models_mount_storage }}:{{ item.models_mount_size }} at
      {{ item.models_mount_path }} and restarted to apply it.
  loop: "{{ llm_model_store_seed_missing }}"
  loop_control:
    label: "{{ item.hostname }}"
