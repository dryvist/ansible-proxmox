---
# Proxmox monitoring setup tasks

- name: Install monitoring packages
  ansible.builtin.apt:
    name:
      - sysstat
      - atop
    state: present
    update_cache: true
  when: proxmox_monitoring_enable_sysstat or proxmox_monitoring_enable_atop

- name: Create systemd override directories for monitoring services
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.name }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - name: sysstat
      enabled: "{{ proxmox_monitoring_enable_sysstat }}"
    - name: atop
      enabled: "{{ proxmox_monitoring_enable_atop }}"
  when: item.enabled
  loop_control:
    label: "{{ item.name }}"

- name: Configure restart policies for monitoring services
  ansible.builtin.copy:
    content: |
      [Service]
      Restart=on-failure
      RestartSec=5s
    dest: "/etc/systemd/system/{{ item.name }}.service.d/restart-policy.conf"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: sysstat
      enabled: "{{ proxmox_monitoring_enable_sysstat }}"
    - name: atop
      enabled: "{{ proxmox_monitoring_enable_atop }}"
  when: item.enabled
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd daemon

- name: Enable sysstat collection
  when: proxmox_monitoring_enable_sysstat
  block:
    - name: Enable sysstat service
      ansible.builtin.systemd:
        name: sysstat
        enabled: true
        state: started

    - name: Enable sysstat collection timer
      ansible.builtin.systemd:
        name: sysstat-collect.timer
        enabled: true
        state: started

    - name: Enable sysstat summary timer
      ansible.builtin.systemd:
        name: sysstat-summary.timer
        enabled: true
        state: started

- name: Enable atop service
  ansible.builtin.systemd:
    name: atop
    enabled: true
    state: started
  when: proxmox_monitoring_enable_atop

- name: Remove legacy crash monitor script and cron job
  block:
    - name: Remove crash monitor cron job
      ansible.builtin.cron:
        name: "crash-monitor"
        state: absent
        user: root

    - name: Remove crash monitor script
      ansible.builtin.file:
        path: /usr/local/bin/crash-monitor.sh
        state: absent

- name: Configure healthchecks.io ping
  when:
    - proxmox_monitoring_enable_healthchecks
    - proxmox_monitoring_healthchecks_ping_url | length > 0
  block:
    - name: Configure healthchecks cron job
      ansible.builtin.cron:
        name: "healthchecks-ping"
        job: >-
          curl -fsS -m 10 --retry 5 -o /dev/null
          {{ proxmox_monitoring_healthchecks_ping_url }}
        minute: "*/{{ proxmox_monitoring_healthchecks_interval }}"
        user: root

# Installs when EITHER transport is configured. Requiring ntfy specifically is
# what kept this off every host: that variable is set nowhere, so the block
# never fired and the capacity sensor was simply absent — silently, because a
# skipped task looks the same as a healthy one.
- name: Configure ZFS capacity monitor
  when:
    - proxmox_monitoring_enable_zfs_capacity
    - (proxmox_monitoring_ntfy_url | length > 0)
      or (proxmox_monitoring_zfs_capacity_deadman_url | length > 0)
  block:
    - name: Create ZFS capacity monitor state directory
      ansible.builtin.file:
        path: /var/lib/zfs-capacity-monitor
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy ZFS capacity monitor script
      ansible.builtin.template:
        src: zfs-capacity-monitor.sh.j2
        dest: /usr/local/bin/zfs-capacity-monitor.sh
        owner: root
        group: root
        mode: "0755"

    - name: Configure ZFS capacity monitor cron job
      ansible.builtin.cron:
        name: "zfs-capacity-monitor"
        job: "/usr/local/bin/zfs-capacity-monitor.sh"
        minute: "*/{{ proxmox_monitoring_zfs_capacity_interval }}"
        user: root

- name: Configure pvesr replication status telemetry
  when: proxmox_monitoring_enable_pvesr_telemetry
  block:
    - name: Deploy pvesr status telemetry script
      ansible.builtin.template:
        src: pvesr-status-telemetry.sh.j2
        dest: /usr/local/bin/pvesr-status-telemetry.sh
        owner: root
        group: root
        mode: "0755"

    - name: Configure pvesr status telemetry cron job
      ansible.builtin.cron:
        name: "pvesr-status-telemetry"
        job: "/usr/local/bin/pvesr-status-telemetry.sh"
        minute: "*/{{ proxmox_monitoring_pvesr_telemetry_interval }}"
        user: root
