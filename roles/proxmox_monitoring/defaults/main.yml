---
# Monitoring configuration defaults


# Healthchecks.io ping interval (minutes via cron)
proxmox_monitoring_healthchecks_interval: 1

# Log retention (days)
proxmox_monitoring_log_retention_days: 90

# Healthchecks.io ping URL (set via vault/external variable - DO NOT commit tokens)
# Example: https://hc-ping.com/your-uuid-here
proxmox_monitoring_healthchecks_ping_url: ""

# Enable/disable individual monitoring components
proxmox_monitoring_enable_sysstat: true
proxmox_monitoring_enable_atop: true
proxmox_monitoring_enable_healthchecks: true
proxmox_monitoring_enable_zfs_capacity: true

# Emit `pvesr status` as key=value telemetry to syslog, which the
# pve_syslog_forwarder role already ships to Cribl and on into Splunk. This
# deliberately does NOT alert — Hermes evaluates it out of Splunk, so alerting
# here would duplicate that and bypass the pipeline of record.
#
# Runs at 5 to match the tightest replication schedule in use, so a missed sync
# is visible within one interval rather than averaged away.
proxmox_monitoring_enable_pvesr_telemetry: true
proxmox_monitoring_pvesr_telemetry_interval: 5

# ZFS pool capacity alerts: notify when a pool crosses a usage band.
# 85 sits between the old 75 warning and the 90 urgent band so every pool —
# and with it every quota-less dataset it backs — alerts above 85% capacity.
#
# The top band is 94, not 97+, because `zpool list -o capacity` is ALLOC/SIZE
# while ZFS withholds slop space (spa_slop_shift default 1/32 = 3.125%) that no
# write can reach. Capacity therefore tops out near 96.8% and a band above that
# never fires — it reads as reassuring silence at the exact moment the pool is
# full. Measured on a 952G pool: 914G USED + 8.30G AVAIL = 922.3G usable, i.e.
# 96.9% of SIZE, matching the 1/32 reserve. At 94% that pool still has ~27G.
#
# Thin volumes are the reason the top band is tight at all: a thin zvol lets a
# guest write until the POOL fills rather than the volume, so the last band has
# to leave enough room for a converge, a rollover, or a restore to finish.
proxmox_monitoring_zfs_capacity_interval: 15
proxmox_monitoring_zfs_capacity_thresholds: [50, 75, 85, 90, 94]

# ZFS DATASET capacity alerts (same script, same band mechanics): every
# filesystem dataset with a quota is checked as used/quota. Quota-less
# datasets share their pool's free space, so their ">85%" moment IS the pool's
# — the pool bands above cover them; per-dataset bands would only duplicate
# that alert once per dataset (noise). bulk/data on the media node is the motivating
# case: its quota caps torrent churn and this fires before writes start
# failing at the quota wall.
proxmox_monitoring_zfs_dataset_capacity_thresholds: [85, 90]

# Deadman URL for the capacity monitor, e.g.
# https://hc-ping.com/<key>/zfs-capacity. Set via vault/external variable — DO
# NOT commit a real URL. Empty disables the capacity monitor entirely, because a
# sensor that cannot reach anyone is indistinguishable from a healthy pool.
#
# A deadman rather than a push endpoint, deliberately. The monitor runs on the
# host whose pool is filling, so anything self-hosted here would share a failure
# domain with the thing it reports on — a push target that dies with the host
# reports nothing and looks calm doing it.
#
# It also supplies the heartbeat the band alerts cannot. Band alerts fire on a
# CHANGE, so a monitor that dies between crossings is silent in exactly the same
# way a monitor watching an idle pool is. Every clean run pings this URL; a
# breach pings <url>/fail. Miss the pings and the deadman fires on its own.
proxmox_monitoring_zfs_capacity_deadman_url: ""
