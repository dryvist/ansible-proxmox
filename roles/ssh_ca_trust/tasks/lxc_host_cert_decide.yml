---
# ssh_ca_trust/lxc_host_cert_decide — parse each container's probe output
# (tasks/lxc_host_cert.yml) into a signing decision. Split out so
# molecule/ssh_ca_trust runs this exact file against a fixture probe.
# Principals are lowercase: ssh matches the lowercased dialed name against a principal exactly.
- name: Clear container host certificate decisions for this probe
  ansible.builtin.set_fact:
    ssh_ca_trust_lxc_host_cert_decisions: []

- name: Decide whether each running container's host certificate needs (re)signing
  vars:
    ssh_ca_trust_lxc_probe_stdout: "{{ item.stdout | default('') }}"
    ssh_ca_trust_lxc_probe_pubkey: >-
      {{ ssh_ca_trust_lxc_probe_stdout | regex_findall('(?m)^PUBKEY=(\S.*)$') | first | default('') }}
    ssh_ca_trust_lxc_probe_hostname: >-
      {{ ssh_ca_trust_lxc_probe_stdout | regex_findall('(?m)^HOSTNAME=(\S+)$') | first | default('') }}
    ssh_ca_trust_lxc_probe_pre_fp: >-
      {{ ssh_ca_trust_lxc_probe_stdout | regex_findall('(?m)^PREFP=(\S+)') | first | default('') }}
    ssh_ca_trust_lxc_probe_present: >-
      {{ ssh_ca_trust_lxc_probe_stdout | regex_findall('(?m)^PRESENT=([01])$') | first | default('') }}
    ssh_ca_trust_lxc_probe_principal: "{{ (ssh_ca_trust_lxc_probe_hostname ~ '.' ~ ssh_ca_trust_host_cert_domain) | lower }}"
  ansible.builtin.set_fact:
    ssh_ca_trust_lxc_host_cert_decisions: >-
      {{ ssh_ca_trust_lxc_host_cert_decisions + [{
           'ctid': item.item,
           'pubkey': ssh_ca_trust_lxc_probe_pubkey,
           'principal': ssh_ca_trust_lxc_probe_principal,
           'pre_fp': ssh_ca_trust_lxc_probe_pre_fp,
           'needs_signing': (lookup('template', 'host_cert_needs_signing.j2', template_vars={
               'ssh_ca_trust_host_cert_present': ssh_ca_trust_lxc_probe_present == '1',
               'ssh_ca_trust_host_cert_probe_text':
                 (ssh_ca_trust_lxc_probe_stdout | regex_findall('(?m)^PROBE_B64=(\S*)$') | first | default('') | b64decode),
               'ssh_ca_trust_host_cert_expected_principal': ssh_ca_trust_lxc_probe_principal,
               'ssh_ca_trust_ca_trust_fetched_fp': ssh_ca_trust_fetched_fp.stdout,
               'ssh_ca_trust_host_cert_now': ssh_ca_trust_host_cert_now,
               'ssh_ca_trust_host_cert_renew_before_days': (ssh_ca_trust_host_cert_renew_before | regex_replace('d$', '') | int),
             }) | trim | bool)
         }] }}
  loop: "{{ ssh_ca_trust_lxc_host_cert_probe.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.rc | default(0) == 0
    - ssh_ca_trust_lxc_probe_pubkey | length > 0
    - ssh_ca_trust_lxc_probe_hostname | length > 0
    - ssh_ca_trust_lxc_probe_pre_fp | length > 0
    - ssh_ca_trust_lxc_probe_present | length > 0

- name: Index each container's pre-signing fingerprint by ctid
  ansible.builtin.set_fact:
    ssh_ca_trust_lxc_host_cert_pre_fp: "{{ ssh_ca_trust_lxc_host_cert_decisions | items2dict(key_name='ctid', value_name='pre_fp') }}"

- name: Warn about containers skipped during the host certificate probe
  ansible.builtin.debug:
    msg: >-
      WARNING: LXC {{ item.item }} {{ ssh_ca_trust_lxc_skip_reason }}.
      Skipping host certificate signing and CA trust push.
  vars:
    ssh_ca_trust_lxc_skip_reason: |-
      {% if item.rc | default(0) in [124, 137] -%}
        host certificate probe timed out
      {%- elif item.stdout | default('') is not search('(?m)^PUBKEY=\S') -%}
        has no Ed25519 host public key
      {%- else -%}
        returned incomplete host certificate probe data
      {%- endif %}
  loop: "{{ ssh_ca_trust_lxc_host_cert_probe.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.item not in ssh_ca_trust_lxc_host_cert_pre_fp
