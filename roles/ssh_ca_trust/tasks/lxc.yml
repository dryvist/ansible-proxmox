---
# ssh_ca_trust/lxc — push CA trust into every RUNNING LXC on this node via
# pct (works regardless of the guest's network/sshd state — no SSH
# chicken-and-egg). Stopped containers are reported as blockers: static-key
# retirement is gated on every guest carrying CA trust, so a skipped guest
# must be visible, never silent.
#
# Also hardens the pushed sshd config to PVE-node parity (no password/kbd-int
# auth, AllowUsers scoped to the declared principal map plus
# ssh_ca_trust_lxc_allow_users_extra) and, where sshd is present, validates
# the rendered drop-in standalone BEFORE it ever becomes the live file, then
# proves the EFFECTIVE config actually reflects that hardening —
# mirroring tasks/main.yml's node-level assert — before recording the
# container as ready in ssh_ca_trust_lxc_ready (default: {} in
# defaults/main.yml, so it's always defined even when this file never runs).
#
# NixOS containers (declared `ostype: nixos` in `pct config`) get the same
# managed files but no drop-in — their sshd_config is generated on the Nix
# side, which must itself declare the trust directives; until it does they
# are recorded not-ready, never failed.

- name: List this node's running LXC containers
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: "set -o pipefail; pct list | awk 'NR>1 && $2==\"running\" {print $1}'"
  register: ssh_ca_trust_lxc_running_raw
  changed_when: false
  # Read-only; a check run needs the real value to preview the trust rollout.
  check_mode: false

- name: List this node's non-running LXC containers
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: "set -o pipefail; pct list | awk 'NR>1 && $2!=\"running\" {print $1}'"
  register: ssh_ca_trust_lxc_stopped_raw
  changed_when: false
  # Read-only; a check run needs the real value to preview the trust rollout.
  check_mode: false

- name: Build running / stopped container lists
  ansible.builtin.set_fact:
    ssh_ca_trust_lxc_running: "{{ ssh_ca_trust_lxc_running_raw.stdout_lines }}"
    ssh_ca_trust_lxc_stopped: "{{ ssh_ca_trust_lxc_stopped_raw.stdout_lines }}"

# Node-side NixOS detection: `pct config` reads /etc/pve/lxc/<ctid>.conf on
# this node — asking the guest would need the very PATH its `pct exec` lacks.
# Drives the PATH-providing exec form and the no-drop-in rules here and in
# tasks/lxc_host_cert.yml.
- name: Read each running container's ostype from its pct config
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: "set -o pipefail; pct config {{ item }} | awk -F': ' '$1==\"ostype\"{print tolower($2)}'"
  register: ssh_ca_trust_lxc_ostype_raw
  changed_when: false
  # Read-only; a check run needs the real value to preview the trust rollout.
  check_mode: false
  loop: "{{ ssh_ca_trust_lxc_running }}"
  loop_control:
    label: "{{ item }}"

- name: Build the per-container NixOS map
  ansible.builtin.set_fact:
    ssh_ca_trust_lxc_nixos: >-
      {{ ssh_ca_trust_lxc_nixos | default({}) | combine({item.item: (item.stdout | trim == 'nixos')}) }}
  loop: "{{ ssh_ca_trust_lxc_ostype_raw.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Select host-admin GPU guests from the published inventory
  ansible.builtin.set_fact:
    ssh_ca_trust_host_admin_guest_vmids: >-
      {%- set ns = namespace(vmids=[]) -%}
      {%- for guest in (containers_from_tofu | default({}, true) | dict2items) -%}
        {%- if guest.value.node | default('') == (proxmox_node_name | default(inventory_hostname))
              and guest.value.ansible_pct_vmid is defined
              and ((guest.value.tags | default([]))
                   | intersect(ssh_ca_trust_host_admin_guest_tags | default([]))
                   | length > 0) -%}
          {%- set ns.vmids = ns.vmids + [guest.value.ansible_pct_vmid | string] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.vmids | to_json | from_json }}

- name: Add running host-admin GPU guests to account convergence
  ansible.builtin.add_host:
    name: "{{ item.key }}"
    groups: host_admin_gpu_guests
    ansible_host: "{{ ansible_host }}"
    ansible_connection: community.proxmox.proxmox_pct_remote
    ansible_user: root
    ansible_ssh_private_key_file: "{{ lookup('env', 'PROXMOX_SSH_KEY_PATH') | default(omit, true) }}"
    proxmox_vmid: "{{ item.value.ansible_pct_vmid }}"
    access_verification_host: "{{ item.value.fqdn }}"
    host_admin_user: "{{ host_admin_user }}"
    local_identities_jevans_enabled: false
    local_identities_admin_enabled: false
    local_identities_host_admin_enabled: true
  loop: "{{ containers_from_tofu | default({}, true) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.value.ansible_pct_vmid is defined
    - item.value.fqdn is defined
    - item.value.node | default('') == (proxmox_node_name | default(inventory_hostname))
    - item.value.ansible_pct_vmid | string in ssh_ca_trust_lxc_running
    - >-
      (item.value.tags | default([])
       | intersect(ssh_ca_trust_host_admin_guest_tags | default([]))
       | length) > 0
  changed_when: false

- name: Report stopped containers as CA-trust blockers
  ansible.builtin.debug:
    msg: >-
      LXC(s) {{ ssh_ca_trust_lxc_stopped | join(', ') }} are not running and
      did NOT receive CA trust — static-key retirement stays blocked for them.
  when: ssh_ca_trust_lxc_stopped | length > 0

# --- SSH host certificates for running containers (rollout gate) ---------
# Split into tasks/lxc_host_cert.yml (probe/decide/sign/install) to keep this
# file under the repo's per-file token budget — see that file for the
# SECURITY note on why the principal must never come from inside the guest.
- name: Issue and install SSH host certificates for running containers
  ansible.builtin.include_tasks: lxc_host_cert.yml
  when: ssh_ca_trust_host_cert_enabled | bool

# --- CA-trust push and readiness (split for the token budget) ------------
- name: Push CA trust into running containers and record readiness
  ansible.builtin.include_tasks: lxc_push.yml
