---
# ssh_ca_trust/host_cert — issue and install this guest's SSH HOST
# certificate, signed by the ssh-client-ca mount's `host-cert` role
# (ansible-proxmox-apps; sign endpoint <mount>/sign/host-cert, cert_type
# host, 90d TTL). Included from tasks/main.yml only when BOTH
# ssh_ca_trust_enabled and ssh_ca_trust_host_cert_enabled are true — it reuses
# the CA fingerprint that block already fetched/verified.
#
# The guest never holds an OpenBao token: the sign call runs on the
# CONTROLLER (delegate_to: localhost) with the same BAO_ADDR/BAO_TOKEN the
# role already uses elsewhere (roles/nas_storage, roles/zfs_fault_alert).

- name: Assert the OpenBao token resolved for host-cert signing
  ansible.builtin.assert:
    that:
      - ssh_ca_trust_host_cert_bao_token | length > 0
    fail_msg: >-
      ssh_ca_trust_host_cert_enabled is true but BAO_TOKEN did not resolve on
      the controller — the sign call needs it (the guest never holds one).
  tags: [ssh_ca_trust]

- name: Slurp this guest's ed25519 host public key
  ansible.builtin.slurp:
    src: /etc/ssh/ssh_host_ed25519_key.pub
  register: ssh_ca_trust_host_cert_pubkey_raw
  tags: [ssh_ca_trust]

- name: Stat the existing host certificate
  ansible.builtin.stat:
    path: "{{ ssh_ca_trust_host_cert_path }}"
  register: ssh_ca_trust_host_cert_stat
  tags: [ssh_ca_trust]

- name: Read the existing host certificate's validity
  ansible.builtin.command:
    cmd: ssh-keygen -Lf {{ ssh_ca_trust_host_cert_path }}
  register: ssh_ca_trust_host_cert_probe
  changed_when: false
  when: ssh_ca_trust_host_cert_stat.stat.exists
  tags: [ssh_ca_trust]

# Same decision this role's tests render directly (see
# templates/host_cert_needs_signing.j2 and molecule/ssh_ca_trust/verify.yml)
# — sign only on absence, near-expiry, wrong principal, or a CA fingerprint
# that no longer matches the pin this role just verified above.
- name: Decide whether the host certificate needs (re)signing
  ansible.builtin.set_fact:
    ssh_ca_trust_host_cert_needs_signing: >-
      {{ lookup('template', 'host_cert_needs_signing.j2', template_vars={
           'ssh_ca_trust_host_cert_present': ssh_ca_trust_host_cert_stat.stat.exists,
           'ssh_ca_trust_host_cert_probe_text': ssh_ca_trust_host_cert_probe.stdout | default(''),
           'ssh_ca_trust_host_cert_expected_principal': ssh_ca_trust_host_cert_fqdn,
           'ssh_ca_trust_ca_trust_fetched_fp': ssh_ca_trust_fetched_fp.stdout,
           'ssh_ca_trust_host_cert_now': ansible_date_time.date ~ 'T' ~ ansible_date_time.time,
           'ssh_ca_trust_host_cert_renew_before_days': (ssh_ca_trust_host_cert_renew_before | regex_replace('d$', '') | int),
         }) | trim | bool }}
  tags: [ssh_ca_trust]

- name: Sign a new host certificate on the controller
  ansible.builtin.uri:
    url: "{{ ssh_ca_trust_bao_addr }}/v1/{{ ssh_ca_trust_mount }}/sign/{{ ssh_ca_trust_host_cert_role }}"
    method: POST
    headers:
      X-Vault-Token: "{{ ssh_ca_trust_host_cert_bao_token }}"
    body_format: json
    body:
      cert_type: host
      public_key: "{{ ssh_ca_trust_host_cert_pubkey_raw.content | b64decode }}"
      valid_principals: "{{ ssh_ca_trust_host_cert_fqdn }}"
    return_content: true
  delegate_to: localhost
  become: false
  register: ssh_ca_trust_host_cert_signed
  no_log: true
  when: ssh_ca_trust_host_cert_needs_signing | bool
  tags: [ssh_ca_trust]

- name: Write the signed host certificate
  ansible.builtin.copy:
    dest: "{{ ssh_ca_trust_host_cert_path }}"
    content: "{{ ssh_ca_trust_host_cert_signed.json.data.signed_key }}"
    owner: root
    group: root
    mode: "0644"
  when: ssh_ca_trust_host_cert_needs_signing | bool
  notify: Reload sshd
  tags: [ssh_ca_trust]
