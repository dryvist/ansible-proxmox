---
# Same scope as the apps CA-trust play: every SSH-reached VM (Windows guests
# use another connection type and drop out here).
- name: Select this node's SSH-reached VM IDs from the published inventory
  ansible.builtin.set_fact:
    ssh_ca_trust_vm_inventory_ids: >-
      {%- set ns = namespace(vmids=[]) -%}
      {%- for guest in (vms_from_tofu | default({}, true) | dict2items) -%}
        {%- if guest.value.node | default('') == (proxmox_node_name | default(inventory_hostname))
              and guest.value.vmid is defined
              and guest.value.ansible_connection | default('') == 'ssh' -%}
          {%- set ns.vmids = ns.vmids + [guest.value.vmid | string] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.vmids | to_json | from_json }}

- name: List running QEMU VMs on this node
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: "set -o pipefail; qm list | awk 'NR>1 && $3==\"running\" {print $1}'"
  register: ssh_ca_trust_vm_running
  changed_when: false
  check_mode: false

- name: Check eligibility and push CA trust into each inventoried SSH-reached VM
  ansible.builtin.include_tasks: vm_guest.yml
  loop: "{{ ssh_ca_trust_vm_running.stdout_lines | intersect(ssh_ca_trust_vm_inventory_ids) }}"
  loop_control:
    loop_var: ssh_ca_trust_vm_id
    label: "{{ ssh_ca_trust_vm_id }}"
