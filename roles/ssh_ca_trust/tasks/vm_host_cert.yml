---
# The host certificate principal comes from qm config, never guest-reported
# hostname data. Only the public host key and certificate are read in-guest.
- name: Resolve the VM host-certificate principal from Proxmox configuration
  ansible.builtin.set_fact:
    ssh_ca_trust_vm_host_cert_name: >-
      {{ ssh_ca_trust_vm_config.stdout | regex_findall('(?m)^name:\s*(\S+)') | first | default('', true) }}

- name: Assert host-certificate inputs are available
  ansible.builtin.assert:
    that:
      - ssh_ca_trust_vm_host_cert_name | length > 0
      - ssh_ca_trust_host_cert_bao_token | length > 0
    fail_msg: >-
      VM host-certificate signing needs a Proxmox-configured name and a
      controller-side OpenBao token.

- name: Read the VM's public host key
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - exec
      - "{{ ssh_ca_trust_vm_id }}"
      - --
      - /bin/cat
      - /etc/ssh/ssh_host_ed25519_key.pub
  register: ssh_ca_trust_vm_host_cert_pubkey_raw
  failed_when: (ssh_ca_trust_vm_host_cert_pubkey_raw.stdout | from_json).get('exitcode', 1) | int != 0
  changed_when: false
  check_mode: false
  no_log: true

- name: Read the VM's current host-certificate validity
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - exec
      - "{{ ssh_ca_trust_vm_id }}"
      - --
      - /bin/sh
      - -c
      - >-
        if [ -f "$1" ]; then
          printf 'PRESENT\n';
          ssh-keygen -Lf "$1";
        else
          printf 'ABSENT\n';
        fi
      - ssh-ca-trust-host-cert
      - "{{ ssh_ca_trust_host_cert_path }}"
  register: ssh_ca_trust_vm_host_cert_probe_raw
  failed_when: (ssh_ca_trust_vm_host_cert_probe_raw.stdout | from_json).get('exitcode', 1) | int != 0
  changed_when: false
  check_mode: false
  no_log: true

- name: Parse the current VM host-certificate state
  ansible.builtin.set_fact:
    ssh_ca_trust_vm_host_cert_probe_data: "{{ (ssh_ca_trust_vm_host_cert_probe_raw.stdout | from_json).get('out-data', '') }}"
  no_log: true

- name: Decide whether the VM host certificate needs signing
  ansible.builtin.set_fact:
    ssh_ca_trust_vm_host_cert_needs_signing: >-
      {{ lookup('template', 'host_cert_needs_signing.j2', template_vars={
           'ssh_ca_trust_host_cert_present': ssh_ca_trust_vm_host_cert_probe_data.startswith('PRESENT\n'),
           'ssh_ca_trust_host_cert_probe_text': (
             ssh_ca_trust_vm_host_cert_probe_data.split('\n', 1)[1]
             if ssh_ca_trust_vm_host_cert_probe_data.startswith('PRESENT\n') else ''
           ),
           'ssh_ca_trust_host_cert_expected_principal': (ssh_ca_trust_vm_host_cert_name ~ '.' ~ ssh_ca_trust_host_cert_domain) | lower,
           'ssh_ca_trust_ca_trust_fetched_fp': ssh_ca_trust_fetched_fp.stdout,
           'ssh_ca_trust_host_cert_now': ssh_ca_trust_host_cert_now,
           'ssh_ca_trust_host_cert_renew_before_days': (ssh_ca_trust_host_cert_renew_before | regex_replace('d$', '') | int)
         }) | trim | bool }}
  no_log: true

- name: Sign a VM host certificate on the controller
  ansible.builtin.uri:
    url: "{{ ssh_ca_trust_bao_addr }}/v1/{{ ssh_ca_trust_mount }}/sign/{{ ssh_ca_trust_host_cert_role }}"
    method: POST
    headers:
      X-Vault-Token: "{{ ssh_ca_trust_host_cert_bao_token }}"
    body_format: json
    body:
      cert_type: host
      public_key: "{{ ((ssh_ca_trust_vm_host_cert_pubkey_raw.stdout | from_json).get('out-data', '') | trim) }}"
      valid_principals: "{{ (ssh_ca_trust_vm_host_cert_name ~ '.' ~ ssh_ca_trust_host_cert_domain) | lower }}"
    return_content: true
  delegate_to: localhost
  become: false
  register: ssh_ca_trust_vm_host_cert_signed
  no_log: true
  when:
    - ssh_ca_trust_vm_host_cert_needs_signing | bool
    - not ansible_check_mode

- name: Install a signed host certificate into the VM through guest-agent stdin
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - exec
      - "{{ ssh_ca_trust_vm_id }}"
      - --pass-stdin
      - --
      - /usr/bin/tee
      - --
      - "{{ ssh_ca_trust_host_cert_path }}"
    stdin: "{{ ssh_ca_trust_vm_host_cert_signed.json.data.signed_key }}"
    stdin_add_newline: false
  register: ssh_ca_trust_vm_host_cert_install
  failed_when: (ssh_ca_trust_vm_host_cert_install.stdout | from_json).get('exitcode', 1) | int != 0
  changed_when: true
  when:
    - ssh_ca_trust_vm_host_cert_needs_signing | bool
    - not ansible_check_mode
  no_log: true

- name: Set VM host-certificate file mode to 0644
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - exec
      - "{{ ssh_ca_trust_vm_id }}"
      - --
      - /bin/chmod
      - "0644"
      - "{{ ssh_ca_trust_host_cert_path }}"
  register: ssh_ca_trust_vm_host_cert_chmod
  failed_when: (ssh_ca_trust_vm_host_cert_chmod.stdout | from_json).get('exitcode', 1) | int != 0
  changed_when: false
  when:
    - ssh_ca_trust_vm_host_cert_needs_signing | bool
    - not ansible_check_mode
  no_log: true

- name: Record a VM host-certificate update for the sshd reload decision
  ansible.builtin.set_fact:
    ssh_ca_trust_vm_changed: true
  when:
    - ssh_ca_trust_vm_host_cert_needs_signing | bool
    - not ansible_check_mode
