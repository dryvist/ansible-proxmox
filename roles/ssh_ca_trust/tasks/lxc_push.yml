---
# ssh_ca_trust/lxc_push — the per-container CA-trust push and readiness
# record, included from tasks/lxc.yml (split out to keep that file under the
# repo's per-file token budget). Expects ssh_ca_trust_lxc_running and
# ssh_ca_trust_lxc_nixos from lxc.yml.

# One pct exec per container writes the managed files (CA keys, principals
# map, signed host certificate), best-effort installs openssh-server on an
# apt-based guest that lacks it and, on a Debian guest, writes the hardened
# drop-in — then, where sshd is present, validates and reloads only on
# change. LXCs are converged over pct, so a guest without sshd — or a NixOS
# guest, whose sshd_config the Nix side generates (this role only writes the
# files that config points at, never the config) — is fine, just not-ready.
- name: Push CA trust into running containers
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      {% set nixos = ssh_ca_trust_lxc_nixos[item | string] | default(false) %}
      {% set fp_files = ssh_ca_trust_lxc_fingerprint_files_nixos if nixos else ssh_ca_trust_fingerprint_files %}
      {% if nixos %}
      # NixOS: `pct exec` runs commands with an empty PATH — every in-guest
      # command below goes through the current-system env so bare names
      # resolve. Debian guests keep the bare form they have always had.
      gx=(pct exec {{ item }} -- /run/current-system/sw/bin/env PATH=/run/current-system/sw/bin)
      {% else %}
      gx=(pct exec {{ item }} --)
      {% endif %}
      # Fingerprint the managed files BEFORE writing. Writing identical bytes is
      # harmless, but reloading sshd in every container on every converge is not,
      # and reporting `changed` unconditionally hides real drift in the noise.
      # Includes the host-cert path so a renewal-only run (cert re-signed, but
      # the CA/dropin/principals content unchanged) still counts as a change —
      # harmless to include when host-cert is disabled or absent, since `cat`
      # on that path then just contributes nothing (stderr swallowed).
      fingerprint() {
        "${gx[@]}" sh -c \
          'cat {{ fp_files }} 2>/dev/null | md5sum' \
          2>/dev/null || echo absent
      }
      # A cert-only renewal already wrote the new cert (the "Install each
      # signed host certificate" task above, earlier in this same play) before
      # this task ever runs — so fingerprinting fresh here would compare the
      # post-install state against itself and miss the change. Use the
      # snapshot the probe task took BEFORE signing/installing instead, when
      # one exists (host-cert enabled); otherwise fall back to a fresh probe,
      # matching this task's original behavior when host-cert is disabled.
      before="{{ (ssh_ca_trust_lxc_host_cert_pre_fp | default({}))[item] | default('') }}"
      if [ -z "$before" ]; then before=$(fingerprint); fi
      {% if nixos %}
      "${gx[@]}" mkdir -p {{ ssh_ca_trust_principals_dir }}
      {% else %}
      "${gx[@]}" mkdir -p {{ ssh_ca_trust_principals_dir }} /etc/ssh/sshd_config.d
      {% endif %}
      # One argument per entry, one line each. A `join('\n')` inside this block
      # scalar hands printf the two characters `\n` verbatim, which collapses a
      # multi-entry list into one malformed line (and one principal nobody has).
      printf '%s\n' {% for key in [ssh_ca_trust_fetched.content | trim] + ssh_ca_trust_extra_ca_keys %}"{{ key }}" {% endfor %}\
        | "${gx[@]}" tee {{ ssh_ca_trust_ca_file }} > /dev/null
      {% for user, principals in ssh_ca_trust_lxc_principals.items() %}
      printf '%s\n' {% for principal in principals %}"{{ principal }}" {% endfor %}\
        | "${gx[@]}" tee {{ ssh_ca_trust_principals_dir }}/{{ user }} > /dev/null
      {% endfor %}
      {% if item | string in ssh_ca_trust_host_admin_guest_vmids %}
      printf '%s\n' {% for principal in ssh_ca_trust_host_admin_principals %}"{{ principal }}" {% endfor %}\
        | "${gx[@]}" tee {{ ssh_ca_trust_principals_dir }}/{{ ssh_ca_trust_host_admin_user }} > /dev/null
      {% else %}
      "${gx[@]}" rm -f {{ ssh_ca_trust_principals_dir }}/{{ ssh_ca_trust_host_admin_user }}
      {% endif %}
      {% if not nixos %}
      # Best-effort, non-fatal: install openssh-server only on an apt-based
      # guest that doesn't already have it. A non-apt guest (e.g. an
      # "unmanaged" NixOS container) or one whose install fails is left alone
      # and simply reported not-ready below — never a failed loop item over
      # one container's package manager.
      if ! "${gx[@]}" sh -c 'command -v sshd' > /dev/null 2>&1; then
        if "${gx[@]}" sh -c 'command -v apt-get' > /dev/null 2>&1; then
          "${gx[@]}" sh -c \
            'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server' \
            > /dev/null 2>&1 || true
          "${gx[@]}" sh -c \
            'systemctl enable --now ssh 2>/dev/null || systemctl enable --now sshd 2>/dev/null || true' \
            > /dev/null 2>&1 || true
        fi
      fi
      {# Rendered from templates/lxc_sshd_hardening.conf.j2 — the SAME file
         the ssh_ca_trust Molecule scenario renders directly onto a real
         sshd, so a content regression here fails CI there. One printf arg
         per line, same reasoning as the CA-keys/principals writes above:
         join('\n') hands printf the two characters \n verbatim. #}
      {# Staged to a `.new` path, never straight to the live drop-in — a bad
         render must never leave a broken config on disk for the next sshd
         restart/reboot to trip over. Validated standalone (sshd -t -f, the
         same pattern Ansible's own `template: validate:` uses — see the
         Molecule converge.yml counterpart) before the atomic rename into
         place; `set -euo pipefail` means a failed validate aborts this
         script before the rename runs, so whatever was already live (or
         nothing) is what's still on disk. #}
      printf '%s\n' {% for line in lookup('template', 'lxc_sshd_hardening.conf.j2').splitlines() %}"{{ line }}" {% endfor %}\
        | "${gx[@]}" tee {{ ssh_ca_trust_dropin }}.new > /dev/null
      "${gx[@]}" chmod 0644 {{ ssh_ca_trust_ca_file }} {{ ssh_ca_trust_dropin }}.new
      {% else %}
      # NixOS: no drop-in, no staged copy — the Nix side generates sshd_config
      # and declares TrustedUserCAKeys/AuthorizedPrincipalsFile pointing at
      # the same paths this role writes; there is nothing to render here.
      "${gx[@]}" chmod 0644 {{ ssh_ca_trust_ca_file }}
      {% endif %}
      ready=0
      if "${gx[@]}" sh -c 'command -v sshd' > /dev/null 2>&1; then
        # sshd -t needs the privilege-separation dir, which a bare `pct exec`
        # shell lacks (systemd normally creates it at sshd start) — create it
        # so the config test doesn't abort with "Missing privilege separation
        # directory: /run/sshd".
        "${gx[@]}" mkdir -p /run/sshd
        {% if not nixos %}
        # Validate the STAGED file standalone before it ever becomes the live
        # drop-in — a rendering bug must fail here, not brick the guest's
        # sshd on its next restart.
        "${gx[@]}" sshd -t -f {{ ssh_ca_trust_dropin }}.new
        "${gx[@]}" mv {{ ssh_ca_trust_dropin }}.new {{ ssh_ca_trust_dropin }}
        {% endif %}
        after=$(fingerprint)
        # Validate on every run: the trust config is what lets the CA in, so a
        # guest that would refuse to start sshd must surface now, not at the
        # next restart.
        "${gx[@]}" sshd -t
        if [ "$before" != "$after" ]; then
          {% if nixos %}
          # try-restart: the NixOS unit is sshd and it may be socket-activated.
          "${gx[@]}" sh -c 'systemctl try-restart sshd 2>/dev/null || true'
          {% else %}
          # try-restart: a reload's SIGHUP re-exec cannot rebind a socket-activated sshd's port.
          "${gx[@]}" sh -c 'systemctl try-restart ssh 2>/dev/null || systemctl try-restart sshd 2>/dev/null || true'
          {% endif %}
        fi
        # `sshd -t` only proves syntax; assert the EFFECTIVE config.
        effective=$("${gx[@]}" sshd -T)
        {% if not nixos %}
        # It must actually carry the hardening — a competing drop-in or
        # main-file directive, or one a per-guest cloud-init already set,
        # would otherwise silently win. Mirrors tasks/main.yml's
        # node-level effective-config assert. Fail loud (not a warning): a
        # hardened-looking drop-in that some other fragment overrides is a
        # security gap, not a readiness note.
        fail=0
        echo "$effective" | grep -qx 'passwordauthentication no' || fail=1
        echo "$effective" | grep -qx 'kbdinteractiveauthentication no' || fail=1
        echo "$effective" | grep -qF 'trustedusercakeys {{ ssh_ca_trust_ca_file }}' || fail=1
        # sshd -T prints either one `allowusers a b` line or one line per user,
        # depending on the OpenSSH version, so compare the sorted set of users.
        expected_users=$(printf '%s\n' {{ ((ssh_ca_trust_lxc_principals.keys() | list) + ssh_ca_trust_lxc_allow_users_extra + ([ssh_ca_trust_host_admin_user] if item | string in ssh_ca_trust_host_admin_guest_vmids else [])) | unique | map('quote') | join(' ') }} | sort -u)
        effective_users=$(echo "$effective" | awk '$1 == "allowusers" { for (i = 2; i <= NF; i++) print $i }' | sort -u)
        [ "$effective_users" = "$expected_users" ] || fail=1
        {% if ssh_ca_trust_host_cert_enabled | bool %}
        echo "$effective" | grep -qF 'hostcertificate {{ ssh_ca_trust_host_cert_path }}' || fail=1
        {% endif %}
        # ForceCommand has no on-wire "unset" value other than its absence or
        # the literal default "none" — either is fine, any real command is not.
        fc_line=$(echo "$effective" | grep -i '^forcecommand ' | head -n1 || true)
        if [ -n "$fc_line" ] && [ "$fc_line" != "forcecommand none" ]; then
          fail=1
        fi
        if [ "$fail" -eq 1 ]; then
          echo "HARDEN_FAIL {{ item }}: effective sshd config does not carry the hardening — a competing fragment is overriding it" >&2
          echo "$effective" >&2
          exit 1
        fi
        ready=1
        {% else %}
        # The Nix side owns the config, so the only thing this role can assert
        # is that the deployed Nix declaration trusts the CA file it just
        # wrote. Until it does, the files above are inert: record the container
        # NOT READY and move on — never fail the loop item, never edit Nix-side
        # sshd config from here.
        if echo "$effective" | grep -qF 'trustedusercakeys {{ ssh_ca_trust_ca_file }}'; then
          ready=1
        else
          echo "NOT_READY {{ item }}: sshd -T does not show trustedusercakeys {{ ssh_ca_trust_ca_file }}" \
            "— the Nix-side sshd declaration is not deployed yet; CA trust files are in place" >&2
        fi
        {% endif %}
      else
        {% if not nixos %}
        # No sshd to validate against — move the staged drop-in into place
        # unvalidated, same as before this file ever had a staging step.
        "${gx[@]}" mv {{ ssh_ca_trust_dropin }}.new {{ ssh_ca_trust_dropin }}
        {% endif %}
        after=$(fingerprint)
      fi
      if [ "$before" != "$after" ]; then echo "RESULT=changed"; else echo "RESULT=unchanged"; fi
      echo "READY=$ready"
  loop: "{{ ssh_ca_trust_lxc_running }}"
  register: ssh_ca_trust_lxc_push
  # A NixOS container's failures stay per-item — the remaining containers must
  # still converge, and the failed one surfaces as NOT READY below (same
  # contract as a guest without sshd). Debian keeps failing the run.
  failed_when: >-
    ssh_ca_trust_lxc_push.rc | default(0) != 0
    and not (ssh_ca_trust_lxc_nixos[item | string] | default(false))
  # 'RESULT=changed' is not a substring of 'RESULT=unchanged', so this cannot
  # match the negative case the way a bare 'CHANGED' test would.
  changed_when: "'RESULT=changed' in ssh_ca_trust_lxc_push.stdout"

- name: Record per-container hardened-sshd readiness
  ansible.builtin.set_fact:
    ssh_ca_trust_lxc_ready: >-
      {{ ssh_ca_trust_lxc_ready | default({}) | combine({item.item: ('READY=1' in (item.stdout | default('')))}) }}
  loop: "{{ ssh_ca_trust_lxc_push.results }}"
  loop_control:
    label: "{{ item.item }}"
