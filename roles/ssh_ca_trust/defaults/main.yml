---
# ssh_ca_trust — distribute trust in the OpenBao SSH client CA
# (ssh-certificate-authority ADR on the docs site).
#
# Automation (AI agents, Ansible, CI) authenticates with short-TTL SSH
# certificates signed by the OpenBao CA at `ssh-client-ca/`; humans stay on
# static authorized_keys (a CA outage must never lock a human out). This role
# makes a host TRUST that CA: it writes the CA public key, a per-user
# AuthorizedPrincipalsFile map, and a late-numbered sshd_config.d drop-in —
# then proves the EFFECTIVE sshd config and that a static key still works
# before finishing (lockout guard).
#
# The CA public key is fetched from OpenBao's unauthenticated public_key
# endpoint but is only trusted after its fingerprint matches the PINNED value
# below — the pin comes from the trusted ceremony (the openbao converge prints
# it under the human-gated bootstrap token; it is committed and human-reviewed
# here). Fail-closed: no pin, or a mismatch, aborts the role. Never
# trust-on-first-use.

# Two-condition activation gate. The role is a NO-OP unless BOTH a pinned CA
# fingerprint exists AND rollout is explicitly enabled for this host group.
# Separating "a pin exists" from "roll out today" keeps a stray/stale
# SSH_CA_FINGERPRINT from distributing trust estate-wide, and enables staged,
# host-class-by-host-class activation (flip rollout per group_vars once proven).
# When active it is still fail-closed on a fingerprint MISMATCH.
ssh_ca_trust_rollout_enabled: false
ssh_ca_trust_enabled: "{{ (ssh_ca_trust_ca_fingerprint | length > 0) and (ssh_ca_trust_rollout_enabled | bool) }}"

# OpenBao endpoint. HA standbys 307-redirect; the uri task follows redirects.
ssh_ca_trust_bao_addr: >-
  {{ lookup('env', 'BAO_ADDR')
     | default(lookup('env', 'VAULT_ADDR') | default('', true), true) }}
ssh_ca_trust_mount: ssh-client-ca

# PINNED CA public-key fingerprint (the `ssh-keygen -l` SHA256:... form).
# Recorded from the openbao converge's "SSH CA fingerprint" output — a
# verified, human-gated session — and committed via group_vars/env. Empty
# leaves the role a no-op (see the activation gate): distributing trust
# without a pin would be TOFU.
ssh_ca_trust_ca_fingerprint: "{{ lookup('env', 'SSH_CA_FINGERPRINT') | default('', true) }}"

# Extra trusted CA public keys (full authorized-keys-format lines). CA
# ROTATION path: append the NEW issuer's public key here first, propagate,
# re-sign clients via the new issuer, then drop the old key after every old
# cert's TTL has drained (multi-issuer API on the OpenBao side).
ssh_ca_trust_extra_ca_keys: []

# principal -> login-user map for THIS host class (per-group data,
# default-deny: a principal reaches a user only where a group opts in).
# PVE-node default: only the `ansible` principal may become root. The
# `ai-agent` principal is NEVER a hypervisor root — it maps to guest-level
# accounts on hosts that opt in via group_vars.
ssh_ca_trust_principals:
  root: [ansible]

# Also push CA trust into this node's LXC containers via pct (no SSH
# chicken-and-egg: pct reaches a guest regardless of its network/sshd state).
# Trusts the same two automation principals as the PVE-node map, in
# lockstep: `ansible` and `semaphore` on root; `ai-agent` only via override.
ssh_ca_trust_manage_lxc: true
ssh_ca_trust_lxc_principals:
  root: [ansible, semaphore]

# Extra AllowUsers entries for a container that also has a NON-root user
# logging in over SSH (e.g. a git-over-ssh service user, an sftp-only user,
# an rsync/backup-pull user) — set per-host/group via inventory, never here.
# AllowUsers is built from ssh_ca_trust_lxc_principals' keys (root, today)
# PLUS this list, so such a container isn't silently locked out by a
# principal map that only covers the automation login.
ssh_ca_trust_lxc_allow_users_extra: []

# Per-container hardened-sshd readiness, keyed by CTID, populated by
# tasks/lxc.yml. A role default (not a mid-task set_fact) so it stays a
# DEFINED, EMPTY structure — never undefined — whenever lxc.yml doesn't run
# at all (ssh_ca_trust_manage_lxc: false, the node has no LXCs, or the
# activation gate above is closed). Read by nobody yet in this role; it
# exists so a later per-host `ansible_connection` flip has something to check
# instead of re-deriving readiness itself.
ssh_ca_trust_lxc_ready: {}

ssh_ca_trust_ca_file: /etc/ssh/trusted-user-ca-keys.pem
ssh_ca_trust_principals_dir: /etc/ssh/principals
# Late-numbered so it wins over distro/local snippets in sshd_config.d.
ssh_ca_trust_dropin: /etc/ssh/sshd_config.d/99-openbao-ca.conf

# --- SSH host certificates (rollout gate, off by default) ----------------
# Issues and installs a signed SSH HOST certificate on this guest — sshd then
# PRESENTS it to connecting clients, who trust the CA instead of pinning a
# per-host key (TOFU). A separate rollout gate from ssh_ca_trust_enabled
# above so the two stage independently — but still nested under it in
# tasks/main.yml, since it reuses the same pinned CA fingerprint fetch/verify.
ssh_ca_trust_host_cert_enabled: false
# Role on the ssh-client-ca mount (ansible-proxmox-apps) whose sign endpoint
# issues host certs: <mount>/sign/<role>, cert_type host, 90d TTL.
ssh_ca_trust_host_cert_role: host-cert
# Re-sign once fewer than this many days remain before expiry. Only the "Nd"
# form is parsed — see templates/host_cert_needs_signing.j2.
ssh_ca_trust_host_cert_renew_before: 45d
ssh_ca_trust_host_cert_path: /etc/ssh/ssh_host_ed25519_key-cert.pub
# Same domain source roles/common already uses (tofu-published when the
# inventory is loaded, else the node's own domain fact) — never a literal.
ssh_ca_trust_host_cert_domain: >-
  {{ hostvars['localhost'].tofu_data.domain
     if hostvars['localhost'].tofu_data is defined
     else ansible_domain }}
ssh_ca_trust_host_cert_fqdn: "{{ inventory_hostname }}.{{ ssh_ca_trust_host_cert_domain }}"
# The converge runner exports BAO_ADDR/BAO_TOKEN for exactly this (same
# pattern as roles/nas_storage) — the guest itself never holds a token; the
# sign call runs delegate_to: localhost.
ssh_ca_trust_host_cert_bao_token: "{{ lookup('env', 'BAO_TOKEN') | default('', true) }}"
