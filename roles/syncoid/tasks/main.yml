---
# syncoid role tasks — install, render the replication wrapper, schedule it.
# Package install + cron are Docker-skipped; the wrapper still renders so
# molecule can verify the generated commands.

- name: Install sanoid (provides syncoid)
  ansible.builtin.apt:
    name: "{{ syncoid_package }}"
    state: present
    update_cache: true
  when:
    - syncoid_enabled
    - ansible_virtualization_type != 'docker'
  tags:
    - syncoid

- name: Ensure syncoid log directory exists
  ansible.builtin.file:
    path: "{{ syncoid_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: syncoid_enabled
  tags:
    - syncoid

# syncoid's `zfs receive` creates the target dataset but NOT its ancestors, so a
# job whose parent is missing fails every run with "cannot open <parent>:
# dataset does not exist" — permanently, and only in the wrapper's log. Create
# the parents here so adding a job for a new source node just works. `-p` is
# idempotent and creates every missing ancestor, not just one level.
- name: Ensure the parent dataset of each replication target exists
  ansible.builtin.shell:
    cmd: >-
      zfs list -H -o name {{ item | quote }} >/dev/null 2>&1
      || { zfs create -p {{ item | quote }} && echo CREATED; }
  loop: "{{ syncoid_jobs | map(attribute='target') | map('dirname') | unique | sort }}"
  changed_when: "'CREATED' in syncoid_parent.stdout"
  register: syncoid_parent
  when:
    - syncoid_enabled
    - syncoid_jobs | length > 0
    - ansible_virtualization_type != 'docker'
  tags:
    - syncoid

- name: Deploy syncoid replication wrapper
  ansible.builtin.template:
    src: syncoid-replicate.sh.j2
    dest: /usr/local/bin/syncoid-replicate.sh
    owner: root
    group: root
    mode: "0755"
  when: syncoid_enabled
  tags:
    - syncoid

# Destroy replicas whose pull job is gone (syncoid_retired_replica_datasets).
# Runs after the wrapper renders, so a dataset is only destroyed once nothing
# this role renders can pull it again.
- name: Destroy retired replica datasets
  ansible.builtin.import_tasks: retired_datasets.yml
  tags:
    - syncoid

# Trigger == cron: the default for always-on nodes. A node that is powered off at
# cron time never fires it — which is why a normally-off DR node uses trigger ==
# boot below instead.
- name: Schedule syncoid replication (cron trigger)
  ansible.builtin.template:
    src: syncoid.cron.j2
    dest: /etc/cron.d/syncoid
    owner: root
    group: root
    mode: "0644"
  when:
    - syncoid_enabled
    - syncoid_trigger == 'cron'
    - syncoid_jobs | length > 0
  tags:
    - syncoid

# The schedule used to live in root's user crontab. Leaving that entry behind
# after the move to /etc/cron.d would double every run, so remove it explicitly
# regardless of trigger — this is migration cleanup, not trigger handling.
- name: Remove the legacy syncoid user-crontab entry
  ansible.builtin.cron:
    name: "syncoid-replicate"
    user: "{{ syncoid_user }}"
    state: absent
  when:
    - syncoid_enabled
    - ansible_virtualization_type != 'docker'
  tags:
    - syncoid

# Rendering the file only when cron is the trigger does not unschedule it:
# template writes when its `when` passes, so flipping syncoid_trigger to boot
# (or emptying syncoid_jobs) leaves the previously-written file behind and the
# node keeps a wall-clock run nothing declares. Observed live on the DR node,
# which carried both a stale daily entry and the on-boot unit. Declared state
# has to include the absence.
- name: Remove the syncoid cron file when cron is not the trigger
  ansible.builtin.file:
    path: /etc/cron.d/syncoid
    state: absent
  when:
    - syncoid_enabled
    - syncoid_trigger != 'cron' or syncoid_jobs | length == 0
  tags:
    - syncoid

# Trigger == boot: a oneshot that runs the wrapper once each boot, for a
# normally-off DR node woken (node_scheduled_wake) for short windows where the
# wall-clock cron would never fire. With syncoid_boot_poweroff_on_complete it
# chains to the node_auto_poweroff oneshot so the node powers off when done. The
# unit always renders (so molecule verifies the contract); enable is Docker-skipped.
- name: Deploy the on-boot syncoid replication service (boot trigger)
  ansible.builtin.template:
    src: syncoid-replicate-on-boot.service.j2
    dest: /etc/systemd/system/syncoid-replicate-on-boot.service
    owner: root
    group: root
    mode: "0644"
  when:
    - syncoid_enabled
    - syncoid_trigger == 'boot'
    - syncoid_jobs | length > 0
  notify: Reload systemd daemon
  tags:
    - syncoid

# Apply any pending daemon-reload now so the enable below acts on the fresh unit.
- name: Reload systemd before enabling the on-boot service
  ansible.builtin.meta: flush_handlers

- name: Enable the on-boot syncoid replication service (boot trigger)
  ansible.builtin.systemd:
    name: syncoid-replicate-on-boot.service
    enabled: true
  when:
    - syncoid_enabled
    - syncoid_trigger == 'boot'
    - syncoid_jobs | length > 0
    - ansible_virtualization_type != 'docker'
  tags:
    - syncoid

# Mirror of the cron removal above, and the reason both matter: flipping a node
# from boot to cron without this leaves the on-boot unit enabled alongside the
# new cron entry, so replication fires twice — once at boot, once on schedule.
- name: Check whether the on-boot syncoid service is present
  ansible.builtin.stat:
    path: /etc/systemd/system/syncoid-replicate-on-boot.service
  register: syncoid_boot_unit
  when:
    - syncoid_enabled
    - syncoid_trigger != 'boot' or syncoid_jobs | length == 0
  tags:
    - syncoid

# Stop as well as disable, so a flip mid-uptime does not leave the unit loaded
# and ready to fire again before the next reboot. Gated on the stat above rather
# than blanket error suppression — a systemd failure on a unit that IS there
# still needs to fail the run.
- name: Remove the on-boot syncoid service when boot is not the trigger
  ansible.builtin.systemd:
    name: syncoid-replicate-on-boot.service
    enabled: false
    state: stopped
  when:
    - syncoid_enabled
    - syncoid_trigger != 'boot' or syncoid_jobs | length == 0
    - syncoid_boot_unit.stat.exists | default(false)
    - ansible_virtualization_type != 'docker'
  tags:
    - syncoid

# Opt-in immediate replication: run the wrapper now instead of waiting for cron.
# Needed to seed (or refresh) a normally-off DR node during the maintenance
# window it is powered on for — its cron would otherwise never fire while the
# node is down. Enable with -e syncoid_run_now=true. The wrapper logs per job and
# does not abort on a single failed job.
#
# Loop the schedule groups: the wrapper runs ONE group per invocation and
# defaults to "default", so a bare call silently seeded only that group and left
# every other group's datasets untouched — with nothing in the output to say so.
- name: Run syncoid replication now (opt-in seed/refresh for a maintenance window)
  ansible.builtin.command:
    cmd: /usr/local/bin/syncoid-replicate.sh {{ item }}
  loop: "{{ syncoid_jobs | map(attribute='schedule', default='default') | unique | sort }}"
  when:
    - syncoid_enabled
    - syncoid_jobs | length > 0
    - syncoid_run_now | bool
    - ansible_virtualization_type != 'docker'
  changed_when: true
  tags:
    - syncoid

# --- Weekly restore check of the replica (default: the object-store replica) ---
#
# Freshness proves a copy was pulled; it does not prove the copy reads back.
# When a replica dataset is declared (syncoid_restore_check_* defaults), a
# weekly timer clones its newest snapshot read-only, verifies the object
# store's bucket directory inside the clone, and always destroys it — the
# script's EXIT trap owns the destroy, so failure paths cannot leave one
# behind. Units always render (so molecule and the tests/ harness verify the
# contract); enabling the timer is Docker-skipped, like every enable here.
- name: Deploy the restore-check script
  ansible.builtin.template:
    src: syncoid-restore-check.sh.j2
    dest: /usr/local/bin/syncoid-restore-check.sh
    owner: root
    group: root
    mode: "0755"
  when: syncoid_restore_check_wants | bool
  tags:
    - syncoid

- name: Deploy the restore-check service unit
  ansible.builtin.template:
    src: syncoid-restore-check.service.j2
    dest: /etc/systemd/system/syncoid-restore-check.service
    owner: root
    group: root
    mode: "0644"
  when: syncoid_restore_check_wants | bool
  notify: Reload systemd daemon
  tags:
    - syncoid

- name: Deploy the restore-check timer unit
  ansible.builtin.template:
    src: syncoid-restore-check.timer.j2
    dest: /etc/systemd/system/syncoid-restore-check.timer
    owner: root
    group: root
    mode: "0644"
  when: syncoid_restore_check_wants | bool
  notify: Reload systemd daemon
  tags:
    - syncoid

# Apply any pending daemon-reload now so the enable below acts on the fresh unit.
- name: Reload systemd before enabling the restore-check timer
  ansible.builtin.meta: flush_handlers

- name: Enable the restore-check timer
  ansible.builtin.systemd:
    name: syncoid-restore-check.timer
    enabled: true
    state: started
  when:
    - syncoid_restore_check_wants | bool
    - ansible_virtualization_type != 'docker'
  tags:
    - syncoid

# Declared state includes the absence: disabling the check (or un-declaring the
# dataset) must unschedule the timer, not leave a weekly run nothing declares —
# the same contract the cron/boot trigger handling above enforces. Gated on a
# stat rather than blanket error suppression — a systemd failure on a unit that
# IS there still needs to fail the run.
- name: Check whether the restore-check timer is present
  ansible.builtin.stat:
    path: /etc/systemd/system/syncoid-restore-check.timer
  register: syncoid_restore_check_installed
  when: not (syncoid_restore_check_wants | bool)
  tags:
    - syncoid

- name: Stop and disable the restore-check timer when not wanted
  ansible.builtin.systemd:
    name: syncoid-restore-check.timer
    enabled: false
    state: stopped
  when:
    - not (syncoid_restore_check_wants | bool)
    - syncoid_restore_check_installed.stat.exists | default(false)
    - ansible_virtualization_type != 'docker'
  tags:
    - syncoid

- name: Remove the restore-check script and units when not wanted
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/syncoid-restore-check.sh
    - /etc/systemd/system/syncoid-restore-check.service
    - /etc/systemd/system/syncoid-restore-check.timer
  when: not (syncoid_restore_check_wants | bool)
  notify: Reload systemd daemon
  tags:
    - syncoid
