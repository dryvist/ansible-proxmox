---
# Retired replica datasets (syncoid_retired_replica_datasets): destroy
# replicas whose pull job is gone. Declared literally in host_vars, never
# discovered, and validated before anything runs — an entry naming anything
# outside bulk/replica/, or carrying a wildcard, a snapshot marker, '..' or
# whitespace, fails the converge instead of reaching zfs.

- name: Refuse a retired replica dataset path that is not a literal replica leaf
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^bulk/replica/')
      - "'*' not in item"
      - "'@' not in item"
      - "'..' not in item"
      - item is not search('\\s')
    fail_msg: >-
      syncoid_retired_replica_datasets entries must be literal dataset paths
      under bulk/replica/ with no wildcard, no snapshot marker, no '..' and no
      whitespace; refused: {{ item | quote }}
    quiet: true
  loop: "{{ syncoid_retired_replica_datasets }}"
  when: syncoid_enabled
  tags:
    - syncoid

# One pass per declared path, in the declared order. `-r` covers the dataset
# and its own snapshots and children; `-R` (dependents outside the subtree) is
# deliberately not used, and no parent is ever named. A path that is absent
# reports no change, so the converge after a successful destroy is a no-op. A
# destroy that fails (busy mid-receive, permission) fails the task rather than
# reading as a skip.
- name: Destroy each present retired replica dataset
  ansible.builtin.shell:
    cmd: |
      if zfs list -H -o name {{ item | quote }} >/dev/null 2>&1; then
        zfs destroy -r {{ item | quote }} && echo DESTROYED
      else
        echo ABSENT
      fi
  loop: "{{ syncoid_retired_replica_datasets }}"
  loop_control:
    label: "{{ item }}"
  register: syncoid_retired_destroy
  changed_when: "'DESTROYED' in syncoid_retired_destroy.stdout"
  when:
    - syncoid_enabled
    - ansible_virtualization_type != 'docker'
  tags:
    - syncoid
