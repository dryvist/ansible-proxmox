---
# syncoid role defaults — cross-node ZFS replication (layer 2 of resiliency).
#
# PULL model: run this on the TARGET (backup) node; it SSHes to each source to
# pull snapshots. Pull-from-backup is safer than push — a compromised source
# cannot reach the backup. Inert until syncoid_jobs is set. SSH trust from this
# node's syncoid_user to each source host is a prerequisite, set up out of band.

syncoid_enabled: true
syncoid_package: sanoid # provides both sanoid and syncoid
syncoid_user: root
syncoid_log_dir: /var/log/syncoid
syncoid_cron_hour: 2
syncoid_cron_minute: 17

# Additional schedule groups beyond `default`, as {name: {hour, minute}}.
#
# One replication cadence per node is not enough once a node pulls datasets with
# genuinely different RPOs: a 3 GB configuration volume wants hourly, while a
# multi-hundred-GB appdata namespace does not. Without groups the only way to
# tighten one is to tighten all of them, which is why this exists.
#
# A job opts in with `schedule: <name>`; jobs that name nothing stay in
# `default` (syncoid_cron_hour/minute), so adding this changes no existing node.
# Each group with at least one job emits one cron line; a group with no jobs
# emits nothing.
syncoid_extra_schedules: {}

# Optional healthchecks.io URL; "<url>" pinged on success, "<url>/fail" if any
# job failed. Without this, a failed dataset is exit-code-only (see the
# wrapper template), so set this to get an actual alert.
syncoid_healthcheck_url: ""
# Per-schedule-group healthcheck URLs, as {group: url}. One shared URL means a
# failing group is masked by a passing one: the check reflects whichever group
# pinged last, so a group that stopped replicating still reads green. A group
# absent here falls back to syncoid_healthcheck_url.
syncoid_healthcheck_urls: {}
# Opt-in: run replication immediately during the play (not just install cron).
# Set true to seed/refresh a normally-off DR node while it is up for a window;
# the scheduled cron never fires on a node that is powered off at cron time.
syncoid_run_now: false

# How replication is triggered on this node:
#   cron — a daily cron at syncoid_cron_hour:syncoid_cron_minute (always-on nodes)
#   boot — a systemd oneshot that runs once each boot, for a normally-off DR node
#          woken (node_scheduled_wake) for short windows where the wall-clock
#          cron would never fire. Pairs with poweroff-on-complete below.
syncoid_trigger: cron
# Cap the on-boot run so a hung pull cannot keep a DR node powered up forever
# (the node_auto_poweroff timer is the ultimate backstop). systemd TimeoutStartSec.
syncoid_boot_timeout: "2h"
# When syncoid_trigger == boot, chain to this unit via systemd OnSuccess=/
# OnFailure= so the node powers OFF the moment the on-boot run finishes (success
# OR failure). Reuses node_auto_poweroff's poweroff oneshot, so that role must be
# enabled (node_auto_poweroff_enabled: true). Set false to leave the node up
# after the boot run and rely only on the node_auto_poweroff timer.
syncoid_boot_poweroff_on_complete: false
syncoid_boot_oncomplete_unit: node-auto-poweroff.service

# Integrate with sanoid: replicate existing sanoid snapshots instead of making
# syncoid's own (--no-sync-snap), recurse the tree, stay quiet for cron.
syncoid_default_options: "--recursive --no-sync-snap --quiet"

# Replication jobs (empty by default). Each pulls source -> local target:
#   syncoid_jobs:
#     - name: node-a-nas
#       source: "root@node-a:rpool/data/nas"
#       target: "tank/replica/node-a/nas"
#     - name: node-a-splunk-hot
#       source: "root@node-a:nvme1/siem/splunk-hot"
#       target: "tank/replica/node-a/splunk-hot"
#       schedule: hourly   # optional; must name a key in syncoid_extra_schedules
syncoid_jobs: []

# Weekly restore check of a replica (default: the object-store replica).
#
# Freshness proves a copy was pulled; it does not prove the copy READS BACK. On
# the node that holds the replica, a weekly timer clones the newest snapshot
# read-only to a throwaway dataset, confirms the object store's bucket
# directory inside it, and always destroys the clone — so a replica that exists
# but cannot be restored is caught within a week instead of at the moment of a
# disaster.
syncoid_restore_check_enabled: false
# Placeholder replica dataset. Runtime inventory supplies the real value.
syncoid_restore_check_dataset: "example/dataset"
# Bucket directory the check must find, non-empty, inside the clone (see README).
# Placeholder bucket directory. Runtime inventory supplies the real value.
syncoid_restore_check_bucket: "example-bucket"
# The bucket directory is located by a bounded search under the clone mount,
# because the store's data directory inside the replicated volume is not
# published here either. Depth 5 covers <mount>/<data-dir>/<bucket> with
# headroom; raise it only if the layout ever grows past that.
syncoid_restore_check_search_depth: 5
# Weekly systemd timer. The nominal minute is deliberately off the
# :00/:15/:30/:45 grid and away from the minutes other schedules own on the
# replicating node (sanoid snapshots ~:00, the syncoid cron lines at :17/:37),
# so the clone never races an in-flight pull or snapshot. Keep that property
# when overriding.
syncoid_restore_check_on_calendar: "Sat *-*-* 05:52:00"
# systemd RandomizedDelaySec; FixedRandomDelay=true pins one offset per boot,
# so the effective run time is stable for a given uptime.
syncoid_restore_check_randomized_delay_sec: "1h"
# systemd TimeoutStartSec cap on the service: a hung zfs command must not
# wedge the timer's job forever.
syncoid_restore_check_timeout: "30min"
# Where the clone's temporary mountpoint is created (mktemp -d). /run is
# tmpfs: gone at boot, never persisted.
syncoid_restore_check_tmp_dir: /run
# The syslog logger binary the script invokes. A variable rather than a bare
# `logger` so the tests/ harness can render a recording stub, and a host
# whose logger lives off the pinned PATH can point at it explicitly.
syncoid_restore_check_logger: logger
# Everything off unless the role is enabled, the check is opted in, and a
# dataset was actually declared — the declared state includes the absence.
syncoid_restore_check_wants: "{{ syncoid_enabled | bool
  and syncoid_restore_check_enabled | bool
  and (syncoid_restore_check_dataset | default('') | length > 0) }}"

# Replica datasets left behind by jobs syncoid_jobs no longer carries. Removing
# a job stops the pull, not the storage: the replica it left behind keeps
# consuming quota on the target pool forever. List literal `bulk/replica/...`
# paths here to destroy them; each entry is validated (replica prefix, no
# wildcard, snapshot marker, '..' or whitespace, no child datasets — declare
# leaves, not namespaces) and skipped only when literally absent, so a converge
# after the first destroy is a clean no-op. Any other `zfs list` error fails.
# `zfs destroy -r` removes the dataset and its own snapshots and children,
# never a parent.
syncoid_retired_replica_datasets: []
