---
# This standalone restore reads pve3 archive evidence and writes only to pve540
# plus a new pve3 evidence record. It never delegates a state-changing action
# to pve2 and it never starts or removes a guest.

- name: Read the pve3 staging evidence directory metadata
  ansible.builtin.stat:
    path: "{{ pve_guest_evacuation_restore_evidence_dir }}"
  delegate_to: "{{ pve_guest_evacuation_restore_staging_host }}"
  register: pve_guest_evacuation_restore_evidence_dir_stat

- name: Require root-only pve3 staging evidence storage
  ansible.builtin.assert:
    that:
      - pve_guest_evacuation_restore_evidence_dir_stat.stat.isdir | default(false)
      - pve_guest_evacuation_restore_evidence_dir_stat.stat.pw_name == 'root'
      - pve_guest_evacuation_restore_evidence_dir_stat.stat.gr_name == 'root'
      - pve_guest_evacuation_restore_evidence_dir_stat.stat.mode == '0700'
    fail_msg: >-
      {{ pve_guest_evacuation_restore_evidence_dir }} must already be a
      root-only pve3-local evidence directory before a restore can run.
    quiet: true

- name: Read the immutable verified archive evidence from pve3
  ansible.builtin.slurp:
    src: "{{ pve_guest_evacuation_restore_archive_evidence_path }}"
  delegate_to: "{{ pve_guest_evacuation_restore_staging_host }}"
  register: pve_guest_evacuation_restore_archive_evidence_raw

- name: Decode the verified archive evidence
  ansible.builtin.set_fact:
    pve_guest_evacuation_restore_archive_evidence: >-
      {{ pve_guest_evacuation_restore_archive_evidence_raw.content
         | b64decode | from_json }}

- name: Require the exact completed pve2 archive evidence
  ansible.builtin.assert:
    that:
      - pve_guest_evacuation_restore_archive_evidence.schema_version | int == 1
      - pve_guest_evacuation_restore_archive_evidence.checkpoint == 'archive_verified'
      - pve_guest_evacuation_restore_archive_evidence.run_id == pve_guest_evacuation_restore_archive_run_id
      - pve_guest_evacuation_restore_archive_evidence.guest.vmid | int == pve_guest_evacuation_restore_expected_vmid | int
      - pve_guest_evacuation_restore_archive_evidence.guest.type == pve_guest_evacuation_restore_expected_guest_type
      - pve_guest_evacuation_restore_archive_evidence.guest.source_node == pve_guest_evacuation_restore_source_node
      - pve_guest_evacuation_restore_archive_evidence.guest.target_node == pve_guest_evacuation_restore_target_node
      - pve_guest_evacuation_restore_archive_evidence.guest.config_digest == pve_guest_evacuation_restore_expected_config_digest
      - pve_guest_evacuation_restore_archive_evidence.guest.config.digest == pve_guest_evacuation_restore_expected_config_digest
      - pve_guest_evacuation_restore_archive_evidence.archive.status == 'verified'
      - pve_guest_evacuation_restore_archive_evidence.archive.sha256 == pve_guest_evacuation_restore_expected_archive_sha256
      - pve_guest_evacuation_restore_archive_evidence.archive.volid | length > 0
      - pve_guest_evacuation_restore_archive_evidence.archive.extracted_config | trim | length > 0
      - pve_guest_evacuation_restore_archive_evidence.staging.host == pve_guest_evacuation_restore_staging_host
      - pve_guest_evacuation_restore_archive_evidence.staging.storage is match('^[a-z0-9][a-z0-9_-]{0,39}$')
      - pve_guest_evacuation_restore_archive_evidence.staging.server | length > 0
      - pve_guest_evacuation_restore_archive_evidence.staging.export is match('^/[^ ]+$')
    fail_msg: >-
      The selected evidence is not the exact completed, verified pve2 archive
      requested for this restore. Preserve the archive and evidence and supply
      the matching VMID, type, config digest, and archive SHA-256.
    quiet: true

- name: Record the exact verified archive identity
  ansible.builtin.set_fact:
    pve_guest_evacuation_restore_archive: "{{ pve_guest_evacuation_restore_archive_evidence.archive }}"
    pve_guest_evacuation_restore_source_config: "{{ pve_guest_evacuation_restore_archive_evidence.guest.config }}"

- name: Read pve540 storage configuration
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - /storage
      - --output-format
      - json
  register: pve_guest_evacuation_restore_storage_raw
  changed_when: false

- name: Decode pve540 staging and target storage records
  ansible.builtin.set_fact:
    pve_guest_evacuation_restore_storage_records: >-
      {{ pve_guest_evacuation_restore_storage_raw.stdout | from_json }}
    pve_guest_evacuation_restore_staging_storage_records: >-
      {{ (pve_guest_evacuation_restore_storage_raw.stdout | from_json)
         | selectattr('storage', 'equalto', pve_guest_evacuation_restore_archive_evidence.staging.storage)
         | list }}
    pve_guest_evacuation_restore_target_storage_records: >-
      {{ (pve_guest_evacuation_restore_storage_raw.stdout | from_json)
         | selectattr('storage', 'equalto', pve_guest_evacuation_restore_target_storage)
         | list }}

- name: Require exactly one independently configured pve3 staging storage record
  ansible.builtin.assert:
    that:
      - pve_guest_evacuation_restore_staging_storage_records | length == 1
      - pve_guest_evacuation_restore_staging_storage_records[0].type == 'nfs'
      - pve_guest_evacuation_restore_staging_storage_records[0].server == pve_guest_evacuation_restore_archive_evidence.staging.server
      - pve_guest_evacuation_restore_staging_storage_records[0].export == pve_guest_evacuation_restore_archive_evidence.staging.export
      - >-
        (pve_guest_evacuation_restore_staging_storage_records[0].content | default('')
         | split(',') | reject('equalto', '') | sort | list) == ['backup']
      - not (pve_guest_evacuation_restore_staging_storage_records[0].disable | default(0) | bool)
      - >-
        pve_guest_evacuation_restore_staging_storage_records[0].nodes is not defined
        or pve_guest_evacuation_restore_target_node
           in pve_guest_evacuation_restore_staging_storage_records[0].nodes.split(',')
    fail_msg: >-
      Standalone pve540 must independently expose the exact active backup-only
      pve3 staging storage recorded by the selected archive evidence.
    quiet: true

- name: Require a distinct explicit pve540 target storage
  ansible.builtin.assert:
    that:
      - pve_guest_evacuation_restore_target_storage != pve_guest_evacuation_restore_archive_evidence.staging.storage
      - pve_guest_evacuation_restore_target_storage_records | length == 1
      - not (pve_guest_evacuation_restore_target_storage_records[0].disable | default(0) | bool)
      - >-
        pve_guest_evacuation_restore_target_storage_records[0].nodes is not defined
        or pve_guest_evacuation_restore_target_node
           in pve_guest_evacuation_restore_target_storage_records[0].nodes.split(',')
      - >-
        (pve_guest_evacuation_restore_expected_guest_type == 'qemu'
         and 'images' in (pve_guest_evacuation_restore_target_storage_records[0].content | default('')).split(','))
        or
        (pve_guest_evacuation_restore_expected_guest_type == 'lxc'
         and 'rootdir' in (pve_guest_evacuation_restore_target_storage_records[0].content | default('')).split(','))
    fail_msg: >-
      The explicit restore destination must be distinct from the backup-only
      staging storage and support this guest type on pve540.
    quiet: true

- name: Read pve540 staging and target storage activation state
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ pve_guest_evacuation_restore_target_node }}/storage/{{ item }}/status"
      - --output-format
      - json
  loop:
    - "{{ pve_guest_evacuation_restore_archive_evidence.staging.storage }}"
    - "{{ pve_guest_evacuation_restore_target_storage }}"
  register: pve_guest_evacuation_restore_storage_status_raw
  changed_when: false

- name: Require active pve540 staging and target storage
  ansible.builtin.assert:
    that:
      - (item.stdout | from_json).active | int == 1
    fail_msg: >-
      pve540 cannot activate {{ item.item }}. Preserve all evidence and resolve
      storage reachability before a restore is attempted.
    quiet: true
  loop: "{{ pve_guest_evacuation_restore_storage_status_raw.results }}"

- name: Resolve the selected archive path through pve540 storage
  ansible.builtin.command:
    argv:
      - pvesm
      - path
      - "{{ pve_guest_evacuation_restore_archive.volid }}"
  register: pve_guest_evacuation_restore_archive_path_raw
  changed_when: false

- name: Record the pve540 archive path
  ansible.builtin.set_fact:
    pve_guest_evacuation_restore_archive_path: "{{ pve_guest_evacuation_restore_archive_path_raw.stdout | trim }}"

- name: Require a nonempty zstd archive path on pve540
  ansible.builtin.stat:
    path: "{{ pve_guest_evacuation_restore_archive_path }}"
  register: pve_guest_evacuation_restore_archive_stat

- name: Verify the selected archive file identity
  ansible.builtin.assert:
    that:
      - pve_guest_evacuation_restore_archive_path is match('^/[^ ]+[.]zst$')
      - pve_guest_evacuation_restore_archive_stat.stat.isreg | default(false)
      - pve_guest_evacuation_restore_archive_stat.stat.size | int > 0
    fail_msg: >-
      pve540 cannot resolve the selected verified archive as a nonempty zstd
      file. Do not restore from another archive or storage path.
    quiet: true

- name: Calculate the pve540 archive SHA-256
  ansible.builtin.command:
    argv:
      - sha256sum
      - "{{ pve_guest_evacuation_restore_archive_path }}"
  register: pve_guest_evacuation_restore_archive_sha256_raw
  changed_when: false

- name: Require the archive SHA-256 recorded in pve3 evidence
  ansible.builtin.assert:
    that:
      - pve_guest_evacuation_restore_archive_sha256_raw.stdout.split()[0] == pve_guest_evacuation_restore_expected_archive_sha256
    fail_msg: >-
      The archive SHA-256 on pve540 differs from the pve3 verified archive
      evidence. Preserve both artifacts; no restore was attempted.
    quiet: true

- name: Verify the compressed archive stream
  ansible.builtin.command:
    argv:
      - zstd
      - -t
      - "{{ pve_guest_evacuation_restore_archive_path }}"
  changed_when: false

- name: Extract the archived Proxmox configuration on pve540
  ansible.builtin.command:
    argv:
      - pvesm
      - extractconfig
      - "{{ pve_guest_evacuation_restore_archive.volid }}"
  register: pve_guest_evacuation_restore_archive_config_raw
  changed_when: false

- name: Require the archived configuration recorded in pve3 evidence
  ansible.builtin.assert:
    that:
      - >-
        pve_guest_evacuation_restore_archive_config_raw.stdout | trim
        == pve_guest_evacuation_restore_archive.extracted_config | trim
    fail_msg: >-
      pve540 extracted configuration differs from the configuration recorded
      with the verified archive. Preserve the archive and investigate the
      evidence mismatch before restoring.
    quiet: true

- name: Assert no ZFS snapshots exist on standalone pve540
  ansible.builtin.command:
    argv:
      - zfs
      - list
      - -H
      - -t
      - snapshot
      - -o
      - name
  register: pve_guest_evacuation_restore_snapshots
  changed_when: false

- name: Refuse a restore while pve540 has ZFS snapshots
  ansible.builtin.assert:
    that:
      - pve_guest_evacuation_restore_snapshots.stdout | trim | length == 0
    fail_msg: >-
      pve540 has ZFS snapshots. This restore neither creates nor uses snapshots;
      preserve the evidence and remove that ambiguity before retrying.
    quiet: true

- name: Check for an existing target QEMU VMID
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ pve_guest_evacuation_restore_target_node }}/qemu/{{ pve_guest_evacuation_restore_expected_vmid }}/config"
      - --output-format
      - json
  register: pve_guest_evacuation_restore_existing_qemu
  changed_when: false
  failed_when: false

- name: Check for an existing target LXC VMID
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ pve_guest_evacuation_restore_target_node }}/lxc/{{ pve_guest_evacuation_restore_expected_vmid }}/config"
      - --output-format
      - json
  register: pve_guest_evacuation_restore_existing_lxc
  changed_when: false
  failed_when: false

- name: Refuse to replace any existing pve540 guest VMID
  ansible.builtin.assert:
    that:
      - pve_guest_evacuation_restore_existing_qemu.rc != 0
      - pve_guest_evacuation_restore_existing_lxc.rc != 0
    fail_msg: >-
      VMID {{ pve_guest_evacuation_restore_expected_vmid }} already exists on
      pve540. This restore never overwrites or removes a target guest.
    quiet: true

- name: Derive the archive's backed volume-key contract
  ansible.builtin.set_fact:
    pve_guest_evacuation_restore_volume_key_pattern: >-
      {{ (pve_guest_evacuation_restore_expected_guest_type == 'qemu')
         | ternary('^(ide|sata|scsi|virtio)[0-9]+$|^(efidisk|tpmstate)0$',
                   '^(rootfs|mp[0-9]+)$') }}

- name: Record the archive's backed volume keys
  ansible.builtin.set_fact:
    pve_guest_evacuation_restore_expected_volume_keys: >-
      {{ pve_guest_evacuation_restore_source_config | dict2items
         | selectattr('key', 'match', pve_guest_evacuation_restore_volume_key_pattern)
         | selectattr('value', 'match', '^[A-Za-z0-9][A-Za-z0-9._-]*:')
         | map(attribute='key') | list | sort }}

- name: Require at least one backed volume in the selected archive
  ansible.builtin.assert:
    that:
      - pve_guest_evacuation_restore_expected_volume_keys | length > 0
    fail_msg: >-
      The verified archive evidence contains no backed guest volumes. Preserve
      it and investigate rather than restoring an incomplete guest.
    quiet: true

- name: Record backed LXC mountpoint volume keys
  ansible.builtin.set_fact:
    pve_guest_evacuation_restore_lxc_mountpoint_volume_keys: >-
      {{ pve_guest_evacuation_restore_expected_volume_keys
         | select('match', '^mp[0-9]+$') | list }}

- name: Refuse automatic restore of LXC archives with additional backed mounts
  ansible.builtin.assert:
    that:
      - >-
        pve_guest_evacuation_restore_expected_guest_type != 'lxc'
        or pve_guest_evacuation_restore_lxc_mountpoint_volume_keys | length == 0
        or pve_guest_evacuation_restore_lxc_mountpoint_strategy == 'manifested_copy'
    fail_msg: >-
      The selected LXC archive has backed mountpoint volumes
      ({{ pve_guest_evacuation_restore_lxc_mountpoint_volume_keys | join(', ') }}).
      Proxmox can recreate their volume configuration without restoring their
      archived payload, so this role refuses the restore before creating a
      target guest. Preserve the archive and use a volume-manifested restore
      procedure that proves every mountpoint payload.
    quiet: true

- name: Restore the verified QEMU archive without starting it
  ansible.builtin.command:
    argv:
      - qmrestore
      - "{{ pve_guest_evacuation_restore_archive_path }}"
      - "{{ pve_guest_evacuation_restore_expected_vmid | string }}"
      - --storage
      - "{{ pve_guest_evacuation_restore_target_storage }}"
  when: pve_guest_evacuation_restore_expected_guest_type == 'qemu'
  changed_when: true

- name: Restore the verified LXC archive without starting it
  ansible.builtin.command:
    argv:
      - pct
      - restore
      - "{{ pve_guest_evacuation_restore_expected_vmid | string }}"
      - "{{ pve_guest_evacuation_restore_archive_path }}"
      - --storage
      - "{{ pve_guest_evacuation_restore_target_storage }}"
  when: pve_guest_evacuation_restore_expected_guest_type == 'lxc'
  changed_when: true

- name: Read the restored target guest configuration
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ pve_guest_evacuation_restore_target_node }}/{{ pve_guest_evacuation_restore_expected_guest_type }}/{{ pve_guest_evacuation_restore_expected_vmid }}/config"
      - --output-format
      - json
  register: pve_guest_evacuation_restore_target_config_raw
  changed_when: false

- name: Read the restored target guest status
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ pve_guest_evacuation_restore_target_node }}/{{ pve_guest_evacuation_restore_expected_guest_type }}/{{ pve_guest_evacuation_restore_expected_vmid }}/status/current"
      - --output-format
      - json
  register: pve_guest_evacuation_restore_target_status_raw
  changed_when: false

- name: Decode the restored target guest state
  ansible.builtin.set_fact:
    pve_guest_evacuation_restore_target_config: "{{ pve_guest_evacuation_restore_target_config_raw.stdout | from_json }}"
    pve_guest_evacuation_restore_target_status: "{{ pve_guest_evacuation_restore_target_status_raw.stdout | from_json }}"

- name: Record restored target volume keys and volume identifiers
  ansible.builtin.set_fact:
    pve_guest_evacuation_restore_target_volume_items: >-
      {{ pve_guest_evacuation_restore_target_config | dict2items
         | selectattr('key', 'in', pve_guest_evacuation_restore_expected_volume_keys)
         | list }}
    pve_guest_evacuation_restore_target_volume_ids: >-
      {{ pve_guest_evacuation_restore_target_config | dict2items
         | selectattr('key', 'in', pve_guest_evacuation_restore_expected_volume_keys)
         | map(attribute='value') | map('regex_replace', ',.*$', '') | list }}

- name: Verify the restored configuration and stopped target state
  ansible.builtin.assert:
    that:
      - pve_guest_evacuation_restore_target_config.digest | default('') | length > 0
      - pve_guest_evacuation_restore_target_status.status == 'stopped'
      - >-
        pve_guest_evacuation_restore_target_volume_items | map(attribute='key')
        | list | sort == pve_guest_evacuation_restore_expected_volume_keys
      - >-
        pve_guest_evacuation_restore_target_volume_items | map(attribute='value')
        | reject('match', '^' ~ (pve_guest_evacuation_restore_target_storage | regex_escape) ~ ':')
        | list | length == 0
    fail_msg: >-
      pve540 did not restore the expected guest configuration, backed volumes,
      or stopped state. Preserve this target guest for investigation; no
      automatic rollback or deletion is permitted.
    quiet: true

- name: Resolve each restored target volume on the explicit storage
  ansible.builtin.command:
    argv:
      - pvesm
      - path
      - "{{ item }}"
  loop: "{{ pve_guest_evacuation_restore_target_volume_ids }}"
  register: pve_guest_evacuation_restore_target_volume_paths
  changed_when: false

- name: Verify every restored target volume exists
  ansible.builtin.stat:
    path: "{{ item.stdout | trim }}"
  loop: "{{ pve_guest_evacuation_restore_target_volume_paths.results }}"
  register: pve_guest_evacuation_restore_target_volume_stats

- name: Require all restored target volumes to be present
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
    fail_msg: >-
      Restored volume {{ item.item.item }} is not present on the explicit
      pve540 target storage. Preserve the failed target for investigation.
    quiet: true
  loop: "{{ pve_guest_evacuation_restore_target_volume_stats.results }}"

- name: Record a completed restore evidence checkpoint
  ansible.builtin.include_tasks: write_evidence.yml
  vars:
    pve_guest_evacuation_restore_checkpoint: >-
      {{ (pve_guest_evacuation_restore_expected_guest_type == 'lxc'
          and pve_guest_evacuation_restore_lxc_mountpoint_volume_keys | length > 0)
         | ternary('restore_pending_managed_mount_copy', 'restore_verified') }}
