---
# This standalone restore reads pve3 archive evidence and writes only to pve540
# plus a new pve3 evidence record. It never delegates a state-changing action
# to pve2 and it never starts or removes a guest.
#
# The phases below are ORDER-DEPENDENT: each proves a precondition the next
# phase relies on, and no restore command runs until every check has passed.
# Do not reorder these includes.

- name: Prove archive evidence and pve540 storage match the request
  ansible.builtin.include_tasks: evidence_and_storage.yml

- name: Verify the archive itself before any restore command runs
  ansible.builtin.include_tasks: archive_verify.yml

- name: Run the final preflight checks and the restore command
  ansible.builtin.include_tasks: preflight_and_restore.yml

- name: Verify the restored guest and record evidence
  ansible.builtin.include_tasks: verify_and_record.yml
