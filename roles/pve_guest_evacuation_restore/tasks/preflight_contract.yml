---
- name: Require an explicitly named source, target and staging host
  ansible.builtin.assert:
    that:
      - pve_guest_evacuation_restore_source_node is defined
      - pve_guest_evacuation_restore_source_node | default('') | length > 0
      - pve_guest_evacuation_restore_target_node is defined
      - pve_guest_evacuation_restore_target_node | default('') | length > 0
      - pve_guest_evacuation_restore_staging_host is defined
      - pve_guest_evacuation_restore_staging_host | default('') | length > 0
    fail_msg: >-
      The caller must pass pve_guest_evacuation_restore_source_node,
      pve_guest_evacuation_restore_target_node and
      pve_guest_evacuation_restore_staging_host explicitly. These have no
      defaults so an unset value fails closed instead of restoring onto an
      unintended node.

- name: Validate the exact restore-only invocation
  ansible.builtin.assert:
    that:
      - inventory_hostname == pve_guest_evacuation_restore_target_node
      - pve_guest_evacuation_restore_source_node != pve_guest_evacuation_restore_target_node
      - pve_guest_evacuation_restore_target_node in hostvars
      - pve_guest_evacuation_restore_staging_host in hostvars
      - pve_guest_evacuation_restore_evidence_dir is match('^/[^ ]+$')
      - pve_guest_evacuation_restore_archive_run_id is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$')
      - pve_guest_evacuation_restore_run_id is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$')
      - pve_guest_evacuation_restore_archive_run_id != pve_guest_evacuation_restore_run_id
      - pve_guest_evacuation_restore_expected_vmid | string is match('^[1-9][0-9]*$')
      - pve_guest_evacuation_restore_expected_guest_type in ['qemu', 'lxc']
      - pve_guest_evacuation_restore_expected_config_digest is match('^[A-Fa-f0-9]{40,64}$')
      - pve_guest_evacuation_restore_expected_archive_sha256 is match('^[A-Fa-f0-9]{64}$')
      - pve_guest_evacuation_restore_target_storage is match('^[a-z0-9][a-z0-9_-]{0,39}$')
      - pve_guest_evacuation_restore_lxc_mountpoint_strategy in ['refuse', 'manifested_copy']
      # Both records must stay directly inside the declared evidence dir: one
      # path segment, .json, no traversal out of it.
      - >-
        pve_guest_evacuation_restore_archive_evidence_path
        is match('^' ~ (pve_guest_evacuation_restore_evidence_dir | regex_escape) ~ '/[^/ ]+[.]json$')
      - >-
        pve_guest_evacuation_restore_result_evidence_path
        is match('^' ~ (pve_guest_evacuation_restore_evidence_dir | regex_escape) ~ '/restore-[^/ ]+[.]json$')
    fail_msg: >-
      Restore runs only on the declared standalone target with an explicit
      destination storage and exact VMID, type, source-config digest, archive
      SHA-256, archive run id, and separate restore run id. Both evidence
      records must remain in the staging host's root-only evidence directory.
    quiet: true
