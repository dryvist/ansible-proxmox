---
pve_textfile_collectors_script_dir: /usr/local/lib/pve-textfile-collectors
pve_textfile_collectors_textfile_dir: "{{ pve_node_exporter_textfile_collector_dir | default('/var/lib/node_exporter/textfile_collector') }}"
pve_textfile_collectors_timeout_seconds: 20
pve_textfile_collectors_txg_root: /proc/spl/kstat/zfs
pve_textfile_collectors_zpool_command: zpool
pve_textfile_collectors_awk_command: awk
pve_textfile_collectors_date_command: date
pve_textfile_collectors_corosync_cmapctl_command: corosync-cmapctl
pve_textfile_collectors_corosync_quorumtool_command: corosync-quorumtool
pve_textfile_collectors_ha_manager_command: ha-manager
pve_textfile_collectors_cgroup_root: /sys/fs/cgroup/lxc
pve_textfile_collectors_zvol_root: /dev/zvol
pve_textfile_collectors_collectors:
  zpool_status:
    interval_seconds: 60
    enabled: true
  zpool_iostat:
    interval_seconds: 60
    enabled: true
  zfs_txg:
    interval_seconds: 60
    enabled: true
  pool_fill:
    interval_seconds: 300
    enabled: true
  corosync:
    interval_seconds: 30
    enabled: true
  ha:
    interval_seconds: 30
    enabled: true
  guest_disk_io:
    interval_seconds: 60
    enabled: true
