---
# nvidia_driver role defaults — install NVIDIA's own host driver on a Proxmox
# node so LXC guests can be given the GPU via device passthrough.
#
# Inert by default: opt a host in with nvidia_driver_enabled: true in its
# host_vars. On every other node the role no-ops.
nvidia_driver_enabled: false

# PCI vendor id that identifies an NVIDIA device. Passed to `lspci -d <id>:`,
# which filters on the vendor field itself rather than on rendered text. Used as
# a hardware gate so an accidental opt-in on a GPU-less node fails loud at
# converge time rather than installing a driver for hardware that isn't there.
nvidia_driver_pci_vendor_id: "10de"

# Where the driver comes from: NVIDIA's own apt repository for this Debian
# release, NOT Debian's non-free component.
#
# Two reasons, both load-bearing:
#
#  1. Version alignment host <-> container. In LXC passthrough the container
#     loads no kernel module of its own; its userland libraries must match the
#     *host's* kernel module version exactly or `nvidia-smi` in the guest fails
#     with "Driver/library version mismatch". Guest images pull from this same
#     NVIDIA repository, so sourcing the host from it too is the only
#     arrangement that stays matched across upgrades.
#  2. Debian's `nvidia-driver` lives in the `non-free` component, which this
#     estate's nodes do not enable. Adding `non-free` would widen every node's
#     package surface to get one driver onto one node; a separate .sources file
#     scoped to the opted-in host does not.
#
# This is a FLAT apt repository ("deb <uri>/ /"), which is why the suite below
# is "/" and no components are set. Do not copy the suite+component shape used
# by pve_repositories here — apt rejects it against this URI.
nvidia_driver_repo_uri: >-
  https://developer.download.nvidia.com/compute/cuda/repos/debian{{
  ansible_distribution_major_version }}/x86_64/
#
# The key filename is the key id NVIDIA currently signs this repository with.
# It is not stable across NVIDIA key rotations, and a rotation shows up as an
# apt NO_PUBKEY failure naming the new id — replace it here rather than
# reaching for [trusted=yes], which disables signature verification entirely.
nvidia_driver_repo_key_url: >-
  https://developer.download.nvidia.com/compute/cuda/repos/debian{{
  ansible_distribution_major_version }}/x86_64/8793F200.pub

# Exact driver series this role installs. Deliberately NOT a floating
# "latest" — this role's whole reason to exist is that the container's
# userland must match the HOST's kernel module version exactly, and NVIDIA's
# apt repository serves more than one series at once: as of this pin,
# nvidia-open itself is at 595.91.07-1, while nvidia-persistenced and
# nvidia-smi (pulled in transitively, see below) are packaged separately at
# 615.71.09-2 and would resolve there on a plain `apt install nvidia-open`
# with no pin. Bump deliberately, together with every guest image that pulls
# the same repository, and re-verify both package versions on NVIDIA's repo
# before moving this.
# renovate: ignore — NVIDIA's own apt repo (nvidia_driver_repo_uri above) has
# no Renovate datasource; bump by hand and re-verify against the repo.
nvidia_driver_version: "595.91.07"

# The Proxmox ABI pinned for this host. pve_upgrade_kernel_version is declared
# in host_vars and is shared with the upgrade role so DKMS headers, boot
# selection, and the pre-reboot check all use one version.
nvidia_driver_kernel_version: "{{ pve_upgrade_kernel_version | default(ansible_kernel, true) }}"

# Apt metadata must be fresh before resolving NVIDIA's version-pinning package;
# otherwise a previously cached index can make the package appear unavailable.
nvidia_driver_apt_cache_valid_time: 0

# Driver packages. `nvidia-open` is NVIDIA's own meta-package for the open
# kernel modules (Turing and newer, so Ada/Ampere/Blackwell cards are
# covered -- Blackwell in particular REQUIRES the open modules, per NVIDIA's
# own driver README; there is no closed-source option for it). It pulls
# nvidia-kernel-open-dkms, the CUDA userland, and nvidia-persistenced.
#
# `nvidia-driver-pinning-<version>` is NVIDIA's own package for this exact
# problem: it ships apt preferences that hold the WHOLE nvidia dependency
# chain -- including nvidia-persistenced and whatever transitively provides
# nvidia-smi -- to this series, so a plain `apt upgrade` cannot drift any of
# them onto the repo's newer default series while nvidia-open itself stays
# pinned below. Order matters: it must be present so apt's resolver sees the
# preference before (or in the same transaction as) resolving nvidia-open's
# dependencies.
#
# It is also where `nvidia-smi` comes from, and that is not obvious from the
# dependency chain: no package in this list is NAMED nvidia-smi. `nvidia-
# driver-cuda` both Provides and Conflicts the standalone `nvidia-smi`
# package, so adding that package here to "make sure" the tool is present
# makes the whole install unsolvable — apt cannot satisfy nvidia-open and
# nvidia-smi at once. Verify a provider with `apt-cache show`'s Provides
# field before adding a package to this list; reading only the Depends
# chain is what got it added.
nvidia_driver_packages:
  - "nvidia-driver-pinning-{{ nvidia_driver_version }}"
  - "nvidia-open={{ nvidia_driver_version }}-1"

# Host-specific packages for optional validation or workload tooling.
nvidia_driver_packages_extra: []

# Remove only DKMS series explicitly found in host_vars; the empty default
# leaves every other NVIDIA installation untouched.
nvidia_driver_dkms_versions_to_remove: []

# Optional CUDA stress utility, built in the cache dataset so its source and
# executable stay out of the root filesystem. The immutable source revision
# keeps the build repeatable; select the GPU's virtual compute capability per
# host when enabling it.
nvidia_driver_gpu_burn_enabled: false
# renovate: datasource=git-refs depName=https://github.com/wilicc/gpu-burn versioning=git
nvidia_driver_gpu_burn_version: 0d19c94dcb2e9b6858b7586a4c327674cd67113b
nvidia_driver_gpu_burn_compute: "75"
nvidia_driver_gpu_burn_cuda_path: /usr/local/cuda
nvidia_driver_gpu_burn_dir: /var/lib/llm-cache/bin/gpu-burn

# Install headers only for the kernel selected for boot. A floating header
# metapackage can build DKMS against a different kernel than the one pinned.
nvidia_driver_header_packages:
  - "proxmox-headers-{{ nvidia_driver_kernel_version }}"

# nouveau is the in-tree open-source driver. It binds the card at boot and the
# NVIDIA module cannot load while it holds the device, so it is blacklisted and
# the initramfs regenerated. Takes effect on the next reboot.
nvidia_driver_blacklist_nouveau: true

# nvidia-persistenced keeps the driver resident so the GPU does not fall out of
# initialised state between clients.
nvidia_driver_persistenced_enabled: true

# Materialise the device nodes at boot. This is a SEPARATE concern from
# persistenced, and conflating the two is a mistake this role already made.
#
# Measured on a headless host, 27 seconds after boot, with persistenced already
# active: /dev/nvidia0, /dev/nvidiactl and /dev/nvidia-modeset existed —
# /dev/nvidia-uvm and /dev/nvidia-uvm-tools did NOT. They appeared moments later,
# created by the first process to touch the GPU, which happened to be the check
# itself. persistenced does not create them.
#
# That matters because an LXC guest cannot create them either: the container has
# no kernel module to load. A device bind pointing at a path the host lacks
# leaves the container running with no GPU and no error anywhere — and every CUDA
# runtime needs Unified Memory, so the guest fails at inference, far from the
# cause.
#
# It also means any check that reads the nodes has already created them. The
# property worth asserting is that they exist while nothing is touching the GPU,
# which is only observable on a fresh boot before anything else runs.
#
# Note the majors are genuinely dynamic, not merely "documented as dynamic":
# across a single reboot on the same host, nvidia-uvm moved 507 -> 510 and the
# nvidia-caps nodes moved 510 -> 236. Anything consuming these must read the
# major off the node, never hardcode it.
nvidia_driver_device_nodes_unit_enabled: true
nvidia_driver_device_nodes_unit_name: nvidia-device-nodes.service

# Optional maximum graphics clock in MHz. Null leaves the GPU clock unlocked.
# A configured value is applied at boot by a separate unit from the power cap.
nvidia_driver_graphics_clock_max_mhz: null

# Optional per-host power cap in watts (e.g. a Max-Q-class card whose factory
# board power exceeds what a given chassis/PSU should sustain continuously).
# Undefined (the default) is a no-op -- the unit below is installed but does
# nothing differently; it is only the applied cap that is skipped.
#
# This is a boot-time systemd unit rather than a one-shot `nvidia-smi -pl`
# task because both persistence mode and any power limit RESET at every
# reboot and at every driver unload/reload (nvidia-smi's own docs) -- a task
# that only ran once at role-apply time would silently stop holding the cap
# after the very next reboot, with nothing reporting it.
nvidia_driver_power_limit_w: null
