---
# nvidia_driver tasks — install NVIDIA's own host driver on an opted-in Proxmox
# node so LXC guests can be handed the GPU via device passthrough.
#
# Inert unless nvidia_driver_enabled is true, so this is a no-op on every node
# without a card. Under Docker (molecule) there is no PCI bus and no kernel to
# build a module for, so the hardware steps are guarded off the same way
# wol_enable guards its ethtool steps.

# `lspci -d <vendor>:` filters on the vendor id itself and exits 0 with empty
# output when nothing matches. Grepping the rendered `lspci -nn` text instead
# is what broke the first version of this gate: the id appears as "[10de:2702]",
# so a pattern anchored on a leading colon matched nothing and the assert below
# failed on a host that plainly has the card.
- name: Detect NVIDIA PCI devices on this host
  ansible.builtin.command:
    cmd: "lspci -n -d {{ nvidia_driver_pci_vendor_id }}:"
  register: nvidia_driver_lspci
  changed_when: false
  when:
    - nvidia_driver_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - nvidia_driver

# Fail loud rather than silently install a driver for absent hardware: an
# opt-in on the wrong host would otherwise pull DKMS and a kernel module onto a
# node that can never use them, and report success doing it.
- name: Fail loud when the host was opted in but has no NVIDIA GPU
  ansible.builtin.assert:
    that:
      - nvidia_driver_lspci.stdout | trim | length > 0
    fail_msg: >-
      nvidia_driver_enabled is true on this host but no PCI device with vendor
      id {{ nvidia_driver_pci_vendor_id }} is present. Remove the opt-in from
      this host's host_vars, or check the card is seated and on the bus.
  when:
    - nvidia_driver_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - nvidia_driver

# Guards against enabling a version pin (an "=" in the package spec) without
# the matching NVIDIA pinning package: apt would then resolve nvidia-open's
# OWN version correctly but leave its dependencies -- nvidia-persistenced and
# whatever transitively provides nvidia-smi -- free to float onto the
# repository's newest series. That is the exact host/guest version mismatch
# this role exists to prevent, and nothing about it fails loudly on its own:
# the install succeeds, the services start, and only an inference workload
# fails later with "Driver/library version mismatch".
- name: Fail loud when a pinned driver version has no matching apt pinning package
  ansible.builtin.assert:
    that:
      - >-
        (nvidia_driver_packages | select('search', '=') | list | length) == 0
        or (nvidia_driver_packages | select('match', '^nvidia-driver-pinning-') | list | length) > 0
    fail_msg: >-
      nvidia_driver_packages pins an exact version (one entry contains "=")
      but carries no nvidia-driver-pinning-<version> package. Add NVIDIA's
      pinning package alongside the version pin, or apt will resolve
      nvidia-open's dependencies against the repository's newest series
      instead of the pinned one.
  when:
    - nvidia_driver_enabled | bool
  tags:
    - nvidia_driver

- name: Blacklist the nouveau driver
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-nouveau.conf
    content: |
      # Ansible managed - nvidia_driver role
      # nouveau binds the card at boot and the NVIDIA kernel module cannot load
      # while it holds the device. Takes effect on the next reboot.
      blacklist nouveau
      options nouveau modeset=0
    owner: root
    group: root
    mode: "0644"
  notify: Regenerate the initramfs
  when:
    - nvidia_driver_enabled | bool
    - nvidia_driver_blacklist_nouveau | bool
  tags:
    - nvidia_driver

- name: Add NVIDIA's apt repository
  ansible.builtin.deb822_repository:
    name: nvidia-cuda
    types: deb
    uris: "{{ nvidia_driver_repo_uri | trim }}"
    # A flat repository: the suite is the literal "/" and there are no
    # components. See the defaults for why this differs from every other repo
    # this estate manages.
    suites: /
    signed_by: "{{ nvidia_driver_repo_key_url | trim }}"
    enabled: true
    state: present
  when:
    - nvidia_driver_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - nvidia_driver

- name: Install the kernel headers DKMS builds against
  ansible.builtin.apt:
    name: "{{ nvidia_driver_header_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - nvidia_driver_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - nvidia_driver

- name: Install the NVIDIA driver and host support packages
  ansible.builtin.apt:
    name: "{{ nvidia_driver_packages + nvidia_driver_packages_extra }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  notify: Regenerate the initramfs
  when:
    - nvidia_driver_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - nvidia_driver

- name: Checkout the pinned GPU Burn source
  ansible.builtin.git:
    repo: https://github.com/wilicc/gpu-burn.git
    dest: "{{ nvidia_driver_gpu_burn_dir }}"
    version: "{{ nvidia_driver_gpu_burn_version }}"
    update: true
  register: nvidia_driver_gpu_burn_checkout
  when:
    - nvidia_driver_enabled | bool
    - nvidia_driver_gpu_burn_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - nvidia_driver

- name: Build GPU Burn for this GPU's compute capability
  ansible.builtin.command:
    cmd: >-
      make COMPUTE={{ nvidia_driver_gpu_burn_compute | replace('.', '') }}
      CUDAPATH={{ nvidia_driver_gpu_burn_cuda_path }}
    chdir: "{{ nvidia_driver_gpu_burn_dir }}"
  register: nvidia_driver_gpu_burn_build
  changed_when: "'Nothing to be done' not in nvidia_driver_gpu_burn_build.stdout"
  when:
    - nvidia_driver_enabled | bool
    - nvidia_driver_gpu_burn_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - nvidia_driver

- name: Check whether nouveau is still holding the GPU
  ansible.builtin.command:
    cmd: lsmod
  register: nvidia_driver_lsmod
  changed_when: false
  when:
    - nvidia_driver_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - nvidia_driver

# Keeps the driver resident between clients.
#
# Enabled unconditionally so the reboot brings it up; only STARTED once nouveau
# is gone, because until then the NVIDIA module cannot bind the card and the
# service would fail to start on a converge that is otherwise correct.
- name: Enable nvidia-persistenced so the driver stays resident
  ansible.builtin.systemd_service:
    name: nvidia-persistenced
    enabled: true
    state: "{{ 'started' if 'nouveau' not in nvidia_driver_lsmod.stdout else omit }}"
  when:
    - nvidia_driver_enabled | bool
    - nvidia_driver_persistenced_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - nvidia_driver

# THIS is what makes the device nodes exist from boot onward — not persistenced,
# which was measured leaving /dev/nvidia-uvm absent. See the role defaults.
- name: Install the boot-time NVIDIA device-node unit
  ansible.builtin.template:
    src: nvidia-device-nodes.service.j2
    dest: "/etc/systemd/system/{{ nvidia_driver_device_nodes_unit_name }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - nvidia_driver_enabled | bool
    - nvidia_driver_device_nodes_unit_enabled | bool
  tags:
    - nvidia_driver

- name: Enable the boot-time NVIDIA device-node unit
  ansible.builtin.systemd_service:
    name: "{{ nvidia_driver_device_nodes_unit_name }}"
    enabled: true
    daemon_reload: true
    state: "{{ 'started' if 'nouveau' not in nvidia_driver_lsmod.stdout else omit }}"
  when:
    - nvidia_driver_enabled | bool
    - nvidia_driver_device_nodes_unit_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - nvidia_driver

# Persistence mode and any power limit reset at every reboot and at every
# driver unload/reload (nvidia-smi's own docs), so a cap is only durable as a
# boot-time unit, not a one-shot task run at converge time. Installed
# whenever a cap is set; a host with no cap gets no unit at all, rather than
# an unapplied one, so `systemctl status` on an uncapped host shows nothing
# to read the wrong conclusion from.
- name: Install the boot-time NVIDIA power-limit unit
  ansible.builtin.template:
    src: nvidia-power-limit.service.j2
    dest: /etc/systemd/system/nvidia-power-limit.service
    owner: root
    group: root
    mode: "0644"
  register: nvidia_driver_power_limit_unit_file
  when:
    - nvidia_driver_enabled | bool
    - nvidia_driver_power_limit_w is not none
  tags:
    - nvidia_driver

- name: Read the supported NVIDIA GPU power-limit ranges
  ansible.builtin.command:
    cmd: nvidia-smi --query-gpu=power.min_limit,power.max_limit --format=csv,noheader,nounits
  register: nvidia_driver_power_limit_range
  changed_when: false
  when:
    - nvidia_driver_enabled | bool
    - nvidia_driver_power_limit_w is not none
    - ansible_virtualization_type | default('') != 'docker'
    - "'nouveau' not in nvidia_driver_lsmod.stdout"
  tags:
    - nvidia_driver

- name: Require nvidia-smi to report supported GPU power limits
  ansible.builtin.assert:
    that:
      - nvidia_driver_power_limit_range.stdout_lines | length > 0
    fail_msg: >-
      nvidia-smi returned no GPU power-limit ranges; refusing to apply the
      requested NVIDIA power limit.
  when:
    - nvidia_driver_enabled | bool
    - nvidia_driver_power_limit_w is not none
    - ansible_virtualization_type | default('') != 'docker'
    - "'nouveau' not in nvidia_driver_lsmod.stdout"
  tags:
    - nvidia_driver

- name: Reject NVIDIA power limits outside each GPU's supported range
  ansible.builtin.assert:
    that:
      - (item.split(',') | first | trim | float) <= (nvidia_driver_power_limit_w | float)
      - (item.split(',') | last | trim | float) >= (nvidia_driver_power_limit_w | float)
    fail_msg: >-
      Requested NVIDIA power limit {{ nvidia_driver_power_limit_w }} W is
      outside this GPU's supported range ({{ item | trim }} W, min,max);
      refusing to rely on the driver to clamp the value.
  loop: "{{ nvidia_driver_power_limit_range.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item | trim }} W (min,max)"
  when:
    - nvidia_driver_enabled | bool
    - nvidia_driver_power_limit_w is not none
    - ansible_virtualization_type | default('') != 'docker'
    - "'nouveau' not in nvidia_driver_lsmod.stdout"
  tags:
    - nvidia_driver

- name: Enable the boot-time NVIDIA power-limit unit
  ansible.builtin.systemd_service:
    name: nvidia-power-limit.service
    enabled: true
    daemon_reload: true
    state: "{{ ('restarted' if nvidia_driver_power_limit_unit_file.changed else 'started') if 'nouveau' not in nvidia_driver_lsmod.stdout else omit }}"
  when:
    - nvidia_driver_enabled | bool
    - nvidia_driver_power_limit_w is not none
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - nvidia_driver

- name: Read back the live NVIDIA GPU power limits
  ansible.builtin.command:
    cmd: nvidia-smi --query-gpu=power.limit --format=csv,noheader,nounits
  register: nvidia_driver_power_limit_readback
  changed_when: false
  when:
    - nvidia_driver_enabled | bool
    - nvidia_driver_power_limit_w is not none
    - ansible_virtualization_type | default('') != 'docker'
    - "'nouveau' not in nvidia_driver_lsmod.stdout"
  tags:
    - nvidia_driver

- name: Require nvidia-smi to report live GPU power limits
  ansible.builtin.assert:
    that:
      - nvidia_driver_power_limit_readback.stdout_lines | length > 0
    fail_msg: >-
      nvidia-smi returned no live GPU power limits after starting the
      power-limit unit.
  when:
    - nvidia_driver_enabled | bool
    - nvidia_driver_power_limit_w is not none
    - ansible_virtualization_type | default('') != 'docker'
    - "'nouveau' not in nvidia_driver_lsmod.stdout"
  tags:
    - nvidia_driver

- name: Assert the live NVIDIA GPU power limits match the requested cap
  ansible.builtin.assert:
    that:
      - ((item | float) - (nvidia_driver_power_limit_w | float)) | abs <= 1
    fail_msg: >-
      nvidia-smi reports a GPU power limit of {{ item | trim }} W; expected
      {{ nvidia_driver_power_limit_w }} W within 1 W.
  loop: "{{ nvidia_driver_power_limit_readback.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item | trim }} W"
  when:
    - nvidia_driver_enabled | bool
    - nvidia_driver_power_limit_w is not none
    - ansible_virtualization_type | default('') != 'docker'
    - "'nouveau' not in nvidia_driver_lsmod.stdout"
  tags:
    - nvidia_driver

# Surfaced, not acted on. Rebooting a hypervisor evacuates or interrupts every
# guest on it, so that is an operator decision taken inside a maintenance
# window -- not something a converge does on its own.
- name: Report that a reboot is required to complete the driver switch
  ansible.builtin.debug:
    msg: >-
      REBOOT REQUIRED on {{ inventory_hostname }}: nouveau is still loaded, so
      the NVIDIA kernel module cannot bind the GPU yet. Reboot inside a
      maintenance window, then confirm both `nvidia-smi` and the presence of
      /dev/nvidia* character devices.
  when:
    - nvidia_driver_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
    - "'nouveau' in nvidia_driver_lsmod.stdout"
  tags:
    - nvidia_driver
