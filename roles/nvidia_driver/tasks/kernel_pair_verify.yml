---
- name: Read DKMS status before removing excluded NVIDIA series
  ansible.builtin.command:
    cmd: dkms status
  register: nvidia_driver_dkms_before_cleanup
  changed_when: false
  check_mode: false
  when:
    - nvidia_driver_enabled | bool
    - nvidia_driver_dkms_versions_to_remove | length > 0
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - nvidia_driver

- name: Remove excluded NVIDIA DKMS series from every kernel
  ansible.builtin.command:
    argv:
      - dkms
      - remove
      - "nvidia/{{ item }}"
      - --all
  loop: "{{ nvidia_driver_dkms_versions_to_remove }}"
  loop_control:
    label: "nvidia/{{ item }}"
  register: nvidia_driver_dkms_cleanup
  changed_when: true
  when:
    - nvidia_driver_enabled | bool
    - nvidia_driver_dkms_versions_to_remove | length > 0
    - ansible_virtualization_type | default('') != 'docker'
    - >-
      nvidia_driver_dkms_before_cleanup.stdout is search(
        '(?m)^nvidia/' ~ (item | regex_escape) ~ '(?:,|:)'
      )
  tags:
    - nvidia_driver

- name: Read DKMS status for the selected NVIDIA kernel pair
  ansible.builtin.command:
    cmd: dkms status
  register: nvidia_driver_dkms_status
  changed_when: false
  check_mode: false
  when:
    - nvidia_driver_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - nvidia_driver

- name: Require the declared NVIDIA DKMS version to be installed for the pinned kernel
  ansible.builtin.assert:
    that:
      - >-
        nvidia_driver_dkms_status.stdout_lines
        | select(
            'search',
            '^nvidia/' ~ (nvidia_driver_version | regex_escape) ~ ', '
            ~ (nvidia_driver_kernel_version | regex_escape) ~ ', [^:]+: installed$'
          )
        | list
        | length > 0
    success_msg: >-
      NVIDIA DKMS {{ nvidia_driver_version }} is installed for
      {{ nvidia_driver_kernel_version }}.
    fail_msg: >-
      NVIDIA DKMS {{ nvidia_driver_version }} is not installed for the pinned
      kernel {{ nvidia_driver_kernel_version }}; refusing to continue.
  when:
    - nvidia_driver_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - nvidia_driver
