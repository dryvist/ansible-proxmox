---
- name: Rebuild initramfs for pinned interface
  ansible.builtin.command:
    cmd: update-initramfs -u -k all
  changed_when: true

- name: Apply extra routed interfaces
  ansible.builtin.command:
    argv:
      - ifup
      - "{{ item.name }}"
  loop: "{{ pve_host_network_extra_interfaces }}"
  when: item.name | default('', true) | trim | length > 0
  changed_when: false
