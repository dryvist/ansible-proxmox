---
# Detect, and optionally enforce, the host network contract.

- name: Collect the interface holding the default route
  ansible.builtin.set_fact:
    pve_host_network_primary_iface: "{{ ansible_facts.default_ipv4.interface | default('') }}"
  tags: [always]

# The fault this role exists to catch. The default route must leave via the
# untagged bridge; any other interface holding it (typically a tagged
# <parent>.<vid> sub-interface) means the management address has drifted.
- name: Detect a management address off the untagged bridge
  ansible.builtin.set_fact:
    pve_host_network_drift: >-
      {{ pve_host_network_primary_iface != pve_host_network_bridge
         and pve_host_network_primary_iface != '' }}
  tags: [always]

- name: Report the detected host network contract
  ansible.builtin.debug:
    msg:
      - "bridge:  {{ pve_host_network_bridge }}"
      - "uplink:  {{ pve_host_network_uplink }}"
      - "primary: {{ pve_host_network_primary_iface | default('none') }}"
      - "drift:   {{ pve_host_network_drift }}"
  tags: [always]

- name: Fail when the management address is not on the untagged bridge
  ansible.builtin.fail:
    msg: >-
      Host management address is on '{{ pve_host_network_primary_iface }}'
      instead of the untagged bridge '{{ pve_host_network_bridge }}'.
      If the switch port delivers untagged frames this host can transmit but
      not receive, and will appear powered off while actually running. Move the
      address onto {{ pve_host_network_bridge }}, or set
      pve_host_network_fail_on_drift=false if this host is a deliberate
      exception.
  when:
    - pve_host_network_drift | bool
    - pve_host_network_fail_on_drift | bool
    - not (pve_host_network_enforce | bool)
  tags: [always]

- name: Enforce the pinned host uplink and bridge configuration
  when: pve_host_network_enforce | bool
  block:
    - name: Require a pinned uplink identity
      ansible.builtin.assert:
        that:
          - pve_host_network_uplink is match('^nic[0-9]+$')
          - pve_host_network_uplink_mac is match('^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$')
        fail_msg: >-
          Refusing to enforce host networking without a nicN uplink name, its
          permanent MAC. The MAC is required before any network file is written.

    - name: Read the current management address when no override is configured
      ansible.builtin.command:
        argv:
          - ip
          - -o
          - -4
          - addr
          - show
          - dev
          - "{{ pve_host_network_primary_iface }}"
      register: pve_host_network_address_listing
      changed_when: false
      when:
        - pve_host_network_address | default('', true) | trim | length == 0
        - pve_host_network_primary_iface | length > 0

    - name: Resolve management address and gateway
      ansible.builtin.set_fact:
        pve_host_network_address_resolved: >-
          {{ pve_host_network_address | default('', true) | trim
             or ((pve_host_network_address_listing | default({'stdout': ''})).stdout
                 | default('', true)
                 | regex_findall('inet +([0-9.]+/[0-9]+)')
                 | first | default('', true)) }}
        pve_host_network_gateway_resolved: >-
          {{ pve_host_network_gateway | default('', true) | trim
             or (ansible_facts.default_ipv4 | default({})).gateway
                | default('', true) }}

    - name: Require the management address and gateway before writing files
      ansible.builtin.assert:
        that:
          - pve_host_network_address_resolved | trim | length > 0
          - pve_host_network_gateway_resolved | trim | length > 0
        fail_msg: >-
          Refusing to write host network files without a current management
          address and gateway. Set explicit inventory overrides when the
          default-route facts do not describe the desired bridge configuration.

    - name: Ensure the Proxmox link-file directory exists
      ansible.builtin.file:
        path: /usr/local/lib/systemd/network
        state: directory
        mode: "0755"

    - name: Render the MAC-pinned uplink name
      ansible.builtin.template:
        src: uplink.link.j2
        dest: /usr/local/lib/systemd/network/10-pve-host-uplink.link
        mode: "0644"
      notify: Rebuild initramfs for pinned interface
      register: pve_host_network_link_render

    - name: Render the interfaces file
      ansible.builtin.template:
        src: interfaces.j2
        dest: /etc/network/interfaces
        mode: "0644"
        backup: true
        # Rejects a render that would leave the host with no address.
        # validate does not run through a shell, so this must be a single command.
        validate: grep -q '^[[:space:]]*address[[:space:]]' %s
      register: pve_host_network_interfaces_render

    - name: Report the required controlled reboot
      ansible.builtin.debug:
        msg: >-
          Host networking files are staged. Reboot is required before the
          pinned interface name and bridge configuration take effect; perform
          the reboot from an approved maintenance window with console or iDRAC.
      when: >-
        pve_host_network_link_render is changed or
        pve_host_network_interfaces_render is changed
