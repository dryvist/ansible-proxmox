---
# Host network contract for hypervisor nodes.
#
# The host management address must live on the untagged bridge, not on a
# tagged VLAN sub-interface, so that it matches the switch port's native VLAN.
# A host whose address sits on a tagged sub-interface while the port delivers
# untagged frames can transmit but never receive: inbound traffic lands on a
# bridge with no address and is dropped. Every unicast probe then fails and the
# node is indistinguishable from one that is powered off.
#
# Detection is read-only and always runs. Enforcement is opt-in.

# Detect drift only. The role never rewrites host networking unless this is
# explicitly enabled: a bad render disconnects the node with no remote way back.
pve_host_network_enforce: false

# Bridge that must carry the host management address, untagged. Guests still
# tag freely: the bridge stays VLAN-aware.
pve_host_network_bridge: vmbr0

# Stable physical uplink name. Inventory supplies its permanent MAC; the role
# writes the matching systemd .link and bridge config together.
pve_host_network_uplink: nic0
pve_host_network_uplink_mac: ""

pve_host_network_vlan_aware: true
pve_host_network_vids: "2-4094"

# Optional management address (CIDR) and gateway overrides. Empty values use
# the current default-route interface address and gathered gateway facts.
pve_host_network_address: ""
pve_host_network_gateway: ""

# Fail the play when drift is detected. Set false to warn instead.
pve_host_network_fail_on_drift: true
