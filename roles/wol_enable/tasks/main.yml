---
# wol_enable tasks — enable Wake-on-LAN now and persist it across reboots via
# a udev rule (ethtool's `wol g` setting does not survive a reboot on its
# own). Under Docker (molecule) there is no real WoL-capable NIC, so the
# ethtool install/read/set steps are skipped; the udev rule still renders,
# proving the persisted contract -- matching the node_scheduled_wake pattern.

- name: Assert an interface is configured when WoL is enabled
  ansible.builtin.assert:
    that:
      - wol_enable_interface | trim | length > 0
    fail_msg: >-
      wol_enable_enabled is true but wol_enable_interface is empty -- set it
      in this host's host_vars to the physical NIC enslaved to the bridge
      (e.g. enp5s0), not the bridge itself.
  when:
    - wol_enable_enabled | bool
  tags:
    - wol_enable

- name: Ensure ethtool is installed
  ansible.builtin.apt:
    name: ethtool
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - wol_enable_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - wol_enable

- name: Read the interface's current Wake-on-LAN support and state
  ansible.builtin.command:
    cmd: "ethtool {{ wol_enable_interface }}"
  register: wol_enable_ethtool
  changed_when: false
  when:
    - wol_enable_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - wol_enable

- name: Extract the NIC's supported Wake-on-LAN modes
  ansible.builtin.set_fact:
    wol_enable_supported_modes: >-
      {{ wol_enable_ethtool.stdout
         | regex_search('Supports Wake-on:\s*(\S+)', '\1')
         | first | default('') }}
  when:
    - wol_enable_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - wol_enable

# Fail loud rather than silently no-op: a node whose NIC cannot do magic-packet
# wake will never respond to a WoL send, and that is a hardware fact worth
# surfacing at converge time, not discovering during an outage.
- name: Fail loud when the NIC does not support magic-packet Wake-on-LAN
  ansible.builtin.assert:
    that:
      - "'g' in wol_enable_supported_modes"
    fail_msg: >-
      {{ wol_enable_interface }} does not advertise magic-packet (g)
      Wake-on-LAN support (supports: '{{ wol_enable_supported_modes }}').
  when:
    - wol_enable_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - wol_enable

- name: Set Wake-on-LAN to magic packet now
  ansible.builtin.command:
    cmd: "ethtool -s {{ wol_enable_interface }} wol g"
  changed_when: "'Wake-on: g' not in wol_enable_ethtool.stdout"
  when:
    - wol_enable_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - wol_enable

- name: Persist Wake-on-LAN across reboots via a udev rule
  ansible.builtin.template:
    src: 99-wol-enable.rules.j2
    dest: /etc/udev/rules.d/99-wol-enable.rules
    owner: root
    group: root
    mode: "0644"
  when:
    - wol_enable_enabled | bool
  tags:
    - wol_enable

# Publishing the MAC into this node's own Proxmox config is what makes
# `pvenode wakeonlan <node>` usable from another node: the command reads the
# target's `wakeonlan` key out of /etc/pve and refuses when it is unset. The
# node reads its own address here rather than carrying it in inventory, so no
# real hardware identifier is committed.
- name: Read the interface's permanent hardware address
  ansible.builtin.command:
    cmd: "ethtool -P {{ wol_enable_interface }}"
  register: wol_enable_permaddr
  changed_when: false
  when:
    - wol_enable_enabled | bool
    - wol_enable_node_config | bool
    - wol_enable_mac | trim | length == 0
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - wol_enable

# Prefer the permanent address: the runtime MAC of a bridge-enslaved port can
# be rewritten, and the magic packet has to name the address the NIC listens
# for while the host is off. Some drivers report an all-zero permanent
# address, which is not one -- fall back to the runtime address there.
- name: Resolve the Wake-on-LAN MAC address
  ansible.builtin.set_fact:
    wol_enable_mac_resolved: >-
      {{ wol_enable_mac | trim
         | default(wol_enable_permaddr_found, true)
         | default(ansible_facts[wol_enable_interface].macaddress | default('', true), true) }}
  vars:
    # regex_search returns the match or None; the single-item list lets reject
    # drop an all-zero permanent address without iterating the string itself.
    wol_enable_permaddr_found: >-
      {{ [wol_enable_permaddr.stdout | default('', true)
          | regex_search('(?i)[0-9a-f]{2}(?::[0-9a-f]{2}){5}') | default('', true)]
         | reject('equalto', '00:00:00:00:00:00') | first | default('', true) }}
  when:
    - wol_enable_enabled | bool
    - wol_enable_node_config | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - wol_enable

- name: Assert a Wake-on-LAN MAC address was resolved
  ansible.builtin.assert:
    that:
      - wol_enable_mac_resolved | trim | length > 0
    fail_msg: >-
      Could not determine a MAC address for {{ wol_enable_interface }} --
      `ethtool -P` reported none and the interface has no runtime address.
      Set wol_enable_mac in this host's host_vars, or wol_enable_node_config
      to false to skip publishing the node's wakeonlan key.
  when:
    - wol_enable_enabled | bool
    - wol_enable_node_config | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - wol_enable

- name: Read this node's currently configured wakeonlan address
  ansible.builtin.command:
    cmd: "pvenode config get"
  register: wol_enable_node_cfg
  changed_when: false
  when:
    - wol_enable_enabled | bool
    - wol_enable_node_config | bool
    - ansible_virtualization_type | default('') != 'docker'
  tags:
    - wol_enable

# A bare MAC, not `mac=<addr>`: it is the property string's default key, so the
# bare form parses on both the current and the previous major release.
- name: Publish the wakeonlan address into this node's Proxmox config
  ansible.builtin.command:
    cmd: "pvenode config set --wakeonlan {{ wol_enable_mac_resolved }}"
  changed_when: true
  when:
    - wol_enable_enabled | bool
    - wol_enable_node_config | bool
    - ansible_virtualization_type | default('') != 'docker'
    - wol_enable_mac_resolved | lower not in (wol_enable_node_cfg.stdout | default('') | lower)
  tags:
    - wol_enable
