---
# wol_enable role defaults — persist Wake-on-LAN (magic packet) on a host's
# physical NIC across reboots.
#
# Discovered the hard way on a workstation node: BIOS Wake-on-LAN was enabled, but
# `ethtool` still reported `Wake-on: d` (disabled) on every boot -- the NIC
# driver resets its Wake-on mode to the hardware default on every bring-up, so
# `ethtool -s <iface> wol g` alone does not survive a reboot. A udev rule that
# re-applies it on every interface `add` event is the standard fix; this role
# covers the OS side only. BIOS/UEFI Wake-on-LAN must still be enabled -- this
# role cannot set BIOS options.
#
# Inert by default: opt a host in by setting wol_enable_enabled: true and
# wol_enable_interface in its host_vars.
wol_enable_enabled: false

# The physical NIC to enable Wake-on-LAN on, e.g. enp5s0. Not the bridge
# (vmbr0): a Linux bridge device does not itself support Wake-on-LAN, only the
# physical interface enslaved to it. Required (fails loud) when enabled.
wol_enable_interface: ""

# Publish the interface's MAC into this Proxmox node's own config as the
# `wakeonlan` key, so `pvenode wakeonlan <node>` works from any other node in
# the cluster. Without that key set, the built-in wake command has no address
# to send to and refuses. The key lives in /etc/pve, so it is replicated to
# every node and readable by whichever node is still up.
wol_enable_node_config: true

# MAC address the magic packet is sent to. Left empty on purpose: the node
# discovers its own NIC's permanent hardware address at converge time
# (`ethtool -P`, falling back to the runtime address when the NIC reports no
# permanent one). Real hardware identifiers therefore never enter this
# repository. Set it in host_vars only to override the discovered value.
wol_enable_mac: ""
