---
# This procedure deliberately copies only after archive and restore evidence
# bind a fresh target skeleton to the stopped source. It never uses a ZFS
# snapshot and never creates a destination volume or directory.
#
# The phases below are ORDER-DEPENDENT: each proves a precondition the next
# phase's copy relies on. Do not reorder these includes.

- name: Prove evidence trust chain and reserve the immutable result path
  ansible.builtin.include_tasks: evidence_preflight.yml

- name: Prove final guest state and build the managed-volume mappings
  ansible.builtin.include_tasks: guest_state.yml

- name: Resolve every managed volume to one exact ZFS dataset identity
  ansible.builtin.include_tasks: resolve_volumes.yml

- name: Run the final pre-copy safety gates
  ansible.builtin.include_tasks: transfer_gates.yml

- name: Copy, verify, and record the managed-volume transfer
  ansible.builtin.include_tasks: copy_and_verify.yml
