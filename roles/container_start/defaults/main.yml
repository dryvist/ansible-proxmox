---
# Explicit service-name allowlist. Empty means no node reads or writes.
container_start_services: []

# Nodes asked for live placement (/cluster/resources); the first to answer is
# used. The start itself runs on the node the container is live on.
container_start_nodes: "{{ groups['proxmox'] | default([]) }}"

# Bounded running-state verification.
container_start_verify_retries: 12
container_start_verify_delay_seconds: 5
