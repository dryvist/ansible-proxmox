---
# Explicit service-name allowlist. Empty means no API reads or writes.
container_start_services: []

# Proxmox API authentication follows the live Doppler/OpenBao contract used by
# the Proxmox provider: user@realm!token-id=secret. Active runs validate and
# split this value in tasks/auth.yml before any API request.
container_start_api_host: "{{ lookup('env', 'PROXMOX_VE_HOSTNAME') | default('', true) }}"
container_start_api_token: "{{ lookup('env', 'PROXMOX_VE_API_TOKEN') | default('', true) }}"
container_start_api_validate_certs: >-
  {{ lookup('env', 'PROXMOX_VE_INSECURE')
     | default('false', true) | bool | ternary(false, true) }}

# Bounded API operation and running-state verification.
container_start_timeout_seconds: 60
container_start_verify_retries: 12
container_start_verify_delay_seconds: 5
