---
- name: "Find the declared LXC in live placement: {{ container_start_target.key }}"
  ansible.builtin.set_fact:
    container_start_identity_info:
      proxmox_vms: >-
        {{ container_start_live
           | selectattr('vmid', 'defined')
           | selectattr('vmid', 'equalto', container_start_target.value.vmid | int)
           | list }}

- name: "Validate the live LXC identity: {{ container_start_target.key }}"
  ansible.builtin.include_tasks: validate_identity.yml

- name: "Record the start decision: {{ container_start_target.key }}"
  ansible.builtin.debug:
    msg: >-
      container_start {{ container_start_target.key }} (vmid
      {{ container_start_target.value.vmid }}) on node {{ _live.node }}:
      status '{{ _live.status }}' ->
      {{ 'already running, no start' if _live.status == 'running' else 'pct start' }}.
  vars:
    _live: "{{ container_start_identity_info.proxmox_vms[0] }}"

- name: "Start the container on its live node: {{ container_start_target.key }}"
  ansible.builtin.command:
    argv: [pct, start, "{{ container_start_target.value.vmid | int }}"]
  delegate_to: "{{ container_start_identity_info.proxmox_vms[0].node }}"
  changed_when: true
  when: container_start_identity_info.proxmox_vms[0].status != 'running'

- name: "Verify the container reaches running: {{ container_start_target.key }}"
  ansible.builtin.command:
    argv: [pct, status, "{{ container_start_target.value.vmid | int }}"]
  delegate_to: "{{ container_start_identity_info.proxmox_vms[0].node }}"
  register: container_start_verify
  changed_when: false
  until: "'status: running' in container_start_verify.stdout"
  retries: "{{ container_start_verify_retries }}"
  delay: "{{ container_start_verify_delay_seconds }}"
