---
# sanoid role tasks — install sanoid, render its config, enable the timer.
# Package install and the systemd timer are skipped under Docker (molecule);
# config rendering still runs so the contract can be verified in-container.

- name: Validate replica retention targets
  ansible.builtin.assert:
    that:
      - sanoid_replica_job_targets | length > 0
      - sanoid_replica_job_targets | select('match', '^bulk/replica/') | length == sanoid_replica_job_targets | length
    fail_msg: "Replica retention requires non-empty syncoid targets under bulk/replica/."
  vars:
    sanoid_replica_job_targets: "{{ syncoid_jobs | default([]) | map(attribute='target') | list }}"
  when: sanoid_replica_retention_enabled
  tags:
    - sanoid

- name: Add live replica datasets to the retention policy
  ansible.builtin.set_fact:
    sanoid_replica_datasets: >-
      {{
        sanoid_replica_datasets | combine({
          item.target: {'use_template': 'replica'} |
          combine(
            {'recursive': 'yes'}
            if '--recursive' in sanoid_replica_job_options.split() else {}
          )
        })
      }}
  vars:
    sanoid_replica_job_options: "{{ item.options | default(syncoid_default_options | default('')) }}"
  loop: "{{ syncoid_jobs | default([]) }}"
  when: sanoid_replica_retention_enabled
  tags:
    - sanoid

- name: Apply shorter retention to guest disk datasets on rpool
  ansible.builtin.set_fact:
    sanoid_effective_datasets: >-
      {{
        sanoid_effective_datasets | default(sanoid_datasets) | combine({
          item.key: item.value | combine({
            'use_template': sanoid_rpool_guest_template_name
          })
        })
      }}
  loop: >-
    {{
      sanoid_datasets | dict2items
      | selectattr('key', 'match', sanoid_rpool_guest_dataset_pattern)
      | list
    }}
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  tags:
    - sanoid

- name: Install sanoid
  ansible.builtin.apt:
    name: "{{ sanoid_package }}"
    state: present
    update_cache: true
  when:
    - sanoid_enabled
    - ansible_virtualization_type != 'docker'
  tags:
    - sanoid

- name: Ensure sanoid config directory exists
  ansible.builtin.file:
    path: "{{ sanoid_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: sanoid_enabled
  tags:
    - sanoid

- name: Render sanoid.conf
  ansible.builtin.template:
    src: sanoid.conf.j2
    dest: "{{ sanoid_config_dir }}/sanoid.conf"
    owner: root
    group: root
    mode: "0644"
  when: sanoid_enabled
  tags:
    - sanoid

- name: Enable and start the sanoid timer
  ansible.builtin.systemd:
    name: sanoid.timer
    enabled: true
    state: started
  when:
    - sanoid_enabled
    - sanoid_timer_enabled
    - ansible_virtualization_type != 'docker'
  tags:
    - sanoid

# The timer is the ONLY thing that takes snapshots on a systemd host. The sanoid
# package also ships /etc/cron.d/sanoid, but that entry is guarded by
# `[ ! -d /run/systemd/system ]` — always false here — so it fires every 15
# minutes and deliberately does nothing. That guard is correct (it is the
# package's fallback for non-systemd systems) and the file is a dpkg conffile,
# so it is left alone rather than deleted.
#
# The consequence is a diagnostic trap worth naming: `journalctl` shows a sanoid
# CRON line every 15 minutes whether or not snapshots are actually being taken,
# so cron activity is NOT evidence that sanoid is running. Found live on the
# primary node with the timer disabled and the last snapshot a day old. Check
# `systemctl is-enabled sanoid.timer`, never the cron log.
- name: Disable the sanoid timer when snapshots are not wanted
  ansible.builtin.systemd:
    name: sanoid.timer
    enabled: false
    state: stopped
  when:
    - sanoid_enabled
    - not sanoid_timer_enabled
    - ansible_virtualization_type != 'docker'
  tags:
    - sanoid
