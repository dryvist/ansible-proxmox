---
# sanoid role defaults — ZFS snapshot scheduling + retention.
#
# Datasets are assigned per host (group_vars/host_vars) by criticality tier.
# The role is inert until sanoid_datasets is populated (templates alone take no
# snapshots).

sanoid_enabled: true
sanoid_package: sanoid
sanoid_timer_enabled: true
sanoid_timer_randomized_delay_sec: 90
sanoid_config_dir: /etc/sanoid

# Retention templates by criticality tier. Quote yes/no so YAML keeps them
# strings — sanoid wants literal yes/no, not Python booleans (True/False).
sanoid_templates:
  critical:
    frequently: 0
    hourly: 36
    daily: 30
    weekly: 8
    monthly: 6
    yearly: 0
    autosnap: "yes"
    autoprune: "yes"
  rpool_guest:
    frequently: 0
    hourly: 6
    daily: 7
    weekly: 4
    monthly: 0
    yearly: 0
    autosnap: "yes"
    autoprune: "yes"
  media:
    frequently: 0
    hourly: 0
    daily: 14
    weekly: 4
    monthly: 3
    yearly: 0
    autosnap: "yes"
    autoprune: "yes"
  # Warm/standby/backup databases (daily-cadence, long history). hot/primary
  # databases that need point-in-time recovery use the `critical` template.
  database:
    frequently: 0
    hourly: 0
    daily: 30
    weekly: 8
    monthly: 12
    yearly: 3
    autosnap: "yes"
    autoprune: "yes"
  monthly:
    frequently: 0
    hourly: 0
    daily: 0
    weekly: 0
    monthly: 1
    yearly: 0
    autosnap: "yes"
    autoprune: "yes"
  scratch:
    autosnap: "no"
    autoprune: "no"

# Per-dataset assignment (empty by default). Set in inventory, e.g.:
#   sanoid_datasets:
#     "rpool/data/nas": { use_template: critical, recursive: "yes" }
#     "nvme1/siem/cribl-pq": { use_template: scratch }
sanoid_datasets: {}

# Guest disk datasets on the root pool use a shorter retention template. Other
# datasets, including non-guest datasets on that pool, retain their assignment.
sanoid_rpool_guest_dataset_pattern: '^rpool/data/(vm|subvol)-[0-9]+-disk-[0-9]+$'
sanoid_rpool_guest_template_name: rpool_guest

# Optional retention policy for live syncoid replica targets.
sanoid_replica_retention_enabled: false
sanoid_replica_datasets: {}
sanoid_replica_templates:
  replica:
    autosnap: "no"
    autoprune: "yes"
    frequently: 0
    # The newest hourly is the newest replicated instant.
    hourly: 1
    daily: 14
    weekly: 0
    monthly: 6
    yearly: 0
