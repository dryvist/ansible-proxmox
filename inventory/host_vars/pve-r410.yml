---
# Host vars for the RETIRED node (formerly the backup/replica target).
#
# It is absent from the corosync nodelist, has no /etc/pve/nodes/ directory and
# is unreachable, so it is not in pve_cluster_members. Its datasets, snapshot
# policy and postgres dump-archive jobs have MOVED to host_vars/pve-r540.yml
# along with the data itself; they are deliberately not duplicated here.
# Leaving them declared on a node that no longer serves the data would mean a
# converge re-creates a second dump writer and a second snapshot schedule for an
# archive nothing replicates — two writers for one archive, and the
# unreplicated one indistinguishable from the real one.
#
# What remains is the inert scheduler guards, so a converge reconciles leftovers
# to absent rather than resuming anything.

# Keep the retired node free of locally scheduled ZFS snapshots and cross-node
# replication. The sanoid role reconciles this to a stopped, disabled timer; the
# empty syncoid job list removes its cron schedule and the legacy root crontab
# entry.
sanoid_timer_enabled: false
syncoid_jobs: []

# The postgres dump-archive jobs that used to live here moved to
# host_vars/pve-r540.yml with the datasets. Explicitly empty rather than
# removed, so a converge of this node tears down the deployed sync script
# instead of leaving an orphan that keeps writing to an archive nothing
# replicates.
postgres_standby_jobs: []

# Insert-only SQLite warm-standby jobs (sqlite_standby role). The storage is
# engine-agnostic and generic; the per-database specifics (source host/path,
# tables) are environment-specific, so they are populated per deployment rather
# than committed. Uncomment and fill in to activate:
# sqlite_standby_jobs:
#   - name: "events-archive"
#     source_host: "root@10.0.x.y"
#     source_path: "/var/lib/app/live.db"
#     archive_path: "/bulk/databases/events/archive.db"
#     tables:
#       - { name: "events", key: "id" }
