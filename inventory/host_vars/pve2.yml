---
# Migration window (tofu-proxmox#816): keep the legacy and replacement node
# free of locally scheduled ZFS snapshots and cross-node replication until the
# workload evacuation is complete.  The sanoid role reconciles this to a
# stopped, disabled timer; the empty syncoid job list removes its cron schedule
# and the legacy root crontab entry.
sanoid_timer_enabled: false
syncoid_jobs: []

# Reboot-persistent source-integrity gate for the pve2 -> pve-r540 evacuation.
# The explicit serials prevent a stale MegaRAID index from starting a long SMART
# test against the wrong disk.  `initial` records the current scrub and fresh
# extended SMART results; after the historical checksum evidence is preserved
# and deliberately cleared, `zero_error_reverification` requires a second scrub
# with no device error counters before the source becomes migration-trusted.
pve_evacuation_gate_enabled: true
pve_evacuation_gate_pool: bulk
pve_evacuation_gate_phase: initial
pve_evacuation_gate_protected_node: pve2
pve_evacuation_gate_prohibited_replication_ids:
  - 602000-0
pve_evacuation_gate_smart_devices:
  - device: /dev/bus/4
    type: sat+megaraid
    index: 0
    serial: K1H644UD
  - device: /dev/bus/4
    type: sat+megaraid
    index: 1
    serial: K1GUZHYD
  - device: /dev/bus/4
    type: sat+megaraid
    index: 2
    serial: 372IK3DGFE1C

# Host vars for the node being retired (formerly the backup/replica target).
#
# Its dataset snapshot policy and its postgres dump-archive jobs have MOVED to
# host_vars/pve-r540.yml along with the datasets themselves; they are not
# duplicated here. Leaving them declared on a node that no longer serves the
# data would mean a converge of this node re-creates a second dump writer and a
# second snapshot schedule for an archive nothing replicates — two writers for
# one archive, and the unreplicated one indistinguishable from the real one.
#
# What stays here is the evacuation gate above and the inert scheduler guards,
# so a converge reconciles leftovers to absent rather than resuming anything.

# Insert-only SQLite warm-standby jobs (sqlite_standby role). The storage is
# engine-agnostic and generic; the per-database specifics (source host/path,
# tables) are environment-specific, so they are populated per deployment rather
# than committed. Uncomment and fill in to activate:
# sqlite_standby_jobs:
#   - name: "events-archive"
#     source_host: "root@10.0.x.y"
#     source_path: "/var/lib/app/live.db"
#     archive_path: "/bulk/databases/events/archive.db"
#     tables:
#       - { name: "events", key: "id" }

# The postgres dump-archive jobs that used to live here moved to
# host_vars/pve-r540.yml with the datasets. Explicitly empty rather than removed,
# so a converge of this node tears down the deployed sync script instead of
# leaving an orphan that keeps writing to an archive nothing replicates.
postgres_standby_jobs: []
