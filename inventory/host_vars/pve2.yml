---
# Host vars for pve2 (secondary, always-on — the backup/replica target).
#
# Layer-2 protection (cross-node ZFS replication via syncoid, PULL model): pve2
# pulls the Splunk VM disk snapshots from its source node into
# bulk/replica/<node>. The source NODE NAME is derived from tofu
# (splunk_vm_from_tofu, injected by load_tofu) — never hard-coded — so this
# follows the VM if it is ever defined on a different node. The vmid and the
# vm-<id>-disk-<n> leaves use Proxmox's default naming (kept as-is); bulk is
# pve2's own local pool. The bulk/replica/<node> parent is created by zfs_pools
# from the terraform-proxmox node_storage declaration; syncoid creates the
# per-disk leaves.
#
# Prereqs (verified live): root SSH pve2->source works (PVE cluster keys +
# cluster_ssh_trust known_hosts); each source disk has a snapshot for
# --no-sync-snap (sanoid on the source provides ongoing ones).
#
# disk-1 was an empty leftover (removed); replicate the OS disk (0) and
# /opt/splunk config+indexes (2). Whole-disk for now; excluding the volatile
# index tier is the tracked critical/volatile follow-up.
# Nested `| default` guards: these vars are only rendered when the syncoid role
# runs, which can happen without load_tofu.yml if an operator scopes a run with
# --limit excluding localhost (--limit filters hosts, not tags, so tags: always
# on the localhost play does not save it). Falling back to the test-fixture
# vmid/node here means a scoped run still replicates the right disks by
# default; a genuine renumber always flows through load_tofu.yml on a full run.
syncoid_jobs:
  - name: "splunk-{{ ((splunk_vm_from_tofu | default({})).splunk | default({})).vmid | default('90200') }}-disk0"
    source: "root@{{ ((splunk_vm_from_tofu | default({})).splunk | default({})).node | default(proxmox_node_prefix ~ '1') }}:rpool/data/vm-{{ ((splunk_vm_from_tofu | default({})).splunk | default({})).vmid | default('90200') }}-disk-0"
    target: "bulk/replica/{{ ((splunk_vm_from_tofu | default({})).splunk | default({})).node | default(proxmox_node_prefix ~ '1') }}/vm-{{ ((splunk_vm_from_tofu | default({})).splunk | default({})).vmid | default('90200') }}-disk-0"
  - name: "splunk-{{ ((splunk_vm_from_tofu | default({})).splunk | default({})).vmid | default('90200') }}-disk2"
    source: "root@{{ ((splunk_vm_from_tofu | default({})).splunk | default({})).node | default(proxmox_node_prefix ~ '1') }}:rpool/data/vm-{{ ((splunk_vm_from_tofu | default({})).splunk | default({})).vmid | default('90200') }}-disk-2"
    target: "bulk/replica/{{ ((splunk_vm_from_tofu | default({})).splunk | default({})).node | default(proxmox_node_prefix ~ '1') }}/vm-{{ ((splunk_vm_from_tofu | default({})).splunk | default({})).vmid | default('90200') }}-disk-2"
  # Object-storage (RustFS) DR: pull the splunk-addons data volume
  # (subvol-<id>-disk-1 = /srv/object-storage) from node 1. The vmid resolves from
  # the tofu inventory (containers_from_tofu['object-storage']), never hard-coded.
  # The container is pinned to node 1, so the source node is fixed via
  # proxmox_node_prefix — the same "fixed node" pattern the pve3 databases/appdata
  # jobs use for node 2, never a hard-coded node name. bulk/replica/<node1> already
  # exists (the splunk jobs above target it); syncoid creates the per-disk leaf.
  - name: "object-storage-disk1"
    source: "root@{{ proxmox_node_prefix }}1:rpool/data/subvol-{{ ((containers_from_tofu | default({}))['object-storage'] | default({})).vmid | default('902000') }}-disk-1"
    target: "bulk/replica/{{ proxmox_node_prefix }}1/subvol-{{ ((containers_from_tofu | default({}))['object-storage'] | default({})).vmid | default('902000') }}-disk-1"

# Layer-1 protection (local ZFS snapshots via sanoid) for the warm-standby
# database namespace. Recursive so any bulk/databases/<instance> child inherits
# the daily-cadence, long-history `database` retention template. These snapshots
# are what preserve pre-prune history (even though the live source is pruned)
# and what syncoid ships to pve3. The bulk/databases parent is created by
# zfs_pools from the terraform-proxmox node_storage declaration — apply that
# first (see the zfs_pools README "Database storage namespace").
# bulk/data (the unified media dataset the pve2 media LXCs bind-mount) is
# DELIBERATELY absent here: terraform-proxmox declares it with
# com.sun:auto-snapshot=false because torrent churn would bloat snapshots, and
# the media payload is re-acquirable. If the library half ever deserves
# snapshots, that means either splitting it back out or accepting short-lived
# sanoid retention on the whole dataset — a maintainer decision, not a default.
sanoid_datasets:
  "bulk/databases":
    use_template: database
    recursive: "yes"
    # Per-dataset override of the template's `hourly: 0`. The template is right
    # for a warm standby that is continuously current, but this dataset is a
    # DUMP ARCHIVE: the dump lands at 02:32 and daily-only snapshots run at
    # 00:00, so a dump written today is first captured at tomorrow's 00:00 and
    # only then replicated — roughly two days from write to off-node copy.
    # Hourly closes that to same-day. Overriding here rather than in the shared
    # template keeps `database` meaning what it says for warm standbys.
    hourly: 24
  # Persistent app config/state (e.g. bulk/appdata/plex = Plex identity + watch
  # history). HOT data that changes constantly (watch progress) and wants
  # point-in-time recovery, so the `critical` template (hourly) — not the
  # daily-cadence `database` one. Recursive so every bulk/appdata/<app> child
  # inherits it.
  "bulk/appdata":
    use_template: critical
    recursive: "yes"

# Insert-only SQLite warm-standby jobs (sqlite_standby role). The storage is
# engine-agnostic and generic; the per-database specifics (source host/path,
# tables) are environment-specific, so they are populated per deployment rather
# than committed. Uncomment and fill in to activate:
# sqlite_standby_jobs:
#   - name: "events-archive"
#     source_host: "root@10.0.x.y"
#     source_path: "/var/lib/app/live.db"
#     archive_path: "/bulk/databases/events/archive.db"
#     tables:
#       - { name: "events", key: "id" }

# Postgres dump archive pull (postgres_standby role, docs/DATABASE_DR_STANDARD.md).
# Mirrors the shared-postgres guest's pg-backup directory into the replicated
# bulk/databases namespace above (sanoid `database` template + pve3 syncoid pull
# cover it with no per-instance edit). The source guest is addressed by FQDN
# derived from tofu (hostname + domain) — never a literal IP or domain. Gated on
# domain_from_tofu so a scoped run without load_tofu.yml stays inert instead of
# pulling from a bogus host.
postgres_standby_jobs: >-
  {{ [] if (domain_from_tofu | default('') | length == 0) else [
       {'name': 'postgres',
        'source_host': 'root@' ~ (((containers_from_tofu | default({}))['postgres'] | default({})).hostname | default('postgres')) ~ '.' ~ domain_from_tofu,
        'source_dir': '/var/lib/postgresql/backups',
        'archive_dir': '/bulk/databases/postgres'},
       {'name': 'postgres-ai',
        'source_host': 'root@' ~ (((containers_from_tofu | default({}))['postgres-ai-1'] | default({})).hostname | default('postgres-ai-1')) ~ '.' ~ domain_from_tofu,
        'source_dir': '/var/lib/postgresql/backups',
        'archive_dir': '/bulk/databases/postgres-ai'}
     ] }}
