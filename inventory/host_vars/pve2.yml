---
# Migration window (tofu-proxmox#816): keep the legacy and replacement node
# free of locally scheduled ZFS snapshots and cross-node replication until the
# workload evacuation is complete.  The sanoid role reconciles this to a
# stopped, disabled timer; the empty syncoid job list removes its cron schedule
# and the legacy root crontab entry.
sanoid_timer_enabled: false
syncoid_jobs: []

# Host vars for pve2 (secondary, always-on — the backup/replica target).
#
# The dataset policy remains declared below, but its scheduler is disabled for
# the migration window.  It resumes only when this explicit guard is removed.
# bulk/data (the unified media dataset the pve2 media LXCs bind-mount) is
# DELIBERATELY absent here: terraform-proxmox declares it with
# com.sun:auto-snapshot=false because torrent churn would bloat snapshots, and
# the media payload is re-acquirable. If the library half ever deserves
# snapshots, that means either splitting it back out or accepting short-lived
# sanoid retention on the whole dataset — a maintainer decision, not a default.
sanoid_datasets:
  "bulk/databases":
    use_template: database
    recursive: "yes"
    # Per-dataset override of the template's `hourly: 0`. The template is right
    # for a warm standby that is continuously current, but this dataset is a
    # DUMP ARCHIVE: the dump lands at 02:32 and daily-only snapshots run at
    # 00:00, so a dump written today is first captured at tomorrow's 00:00 and
    # only then replicated — roughly two days from write to off-node copy.
    # Hourly closes that to same-day. Overriding here rather than in the shared
    # template keeps `database` meaning what it says for warm standbys.
    hourly: 24
  # Persistent app config/state (e.g. bulk/appdata/plex = Plex identity + watch
  # history). HOT data that changes constantly (watch progress) and wants
  # point-in-time recovery, so the `critical` template (hourly) — not the
  # daily-cadence `database` one. Recursive so every bulk/appdata/<app> child
  # inherits it.
  "bulk/appdata":
    use_template: critical
    recursive: "yes"

# Insert-only SQLite warm-standby jobs (sqlite_standby role). The storage is
# engine-agnostic and generic; the per-database specifics (source host/path,
# tables) are environment-specific, so they are populated per deployment rather
# than committed. Uncomment and fill in to activate:
# sqlite_standby_jobs:
#   - name: "events-archive"
#     source_host: "root@10.0.x.y"
#     source_path: "/var/lib/app/live.db"
#     archive_path: "/bulk/databases/events/archive.db"
#     tables:
#       - { name: "events", key: "id" }

# Postgres dump archive pull (postgres_standby role, docs/DATABASE_DR_STANDARD.md).
# Mirrors the shared-postgres guest's pg-backup directory into the replicated
# bulk/databases namespace above (sanoid `database` template + pve3 syncoid pull
# cover it with no per-instance edit). The source guest is addressed by FQDN
# derived from tofu (hostname + domain) — never a literal IP or domain. Gated on
# domain_from_tofu so a scoped run without load_tofu.yml stays inert instead of
# pulling from a bogus host.
postgres_standby_jobs: >-
  {{ [] if (domain_from_tofu | default('') | length == 0) else [
       {'name': 'postgres',
        'source_host': 'root@' ~ (((containers_from_tofu | default({}))['postgres'] | default({})).hostname | default('postgres')) ~ '.' ~ domain_from_tofu,
        'source_dir': '/var/lib/postgresql/backups',
        'archive_dir': '/bulk/databases/postgres'},
       {'name': 'postgres-ai',
        'source_host': 'root@' ~ (((containers_from_tofu | default({}))['postgres-ai-1'] | default({})).hostname | default('postgres-ai-1')) ~ '.' ~ domain_from_tofu,
        'source_dir': '/var/lib/postgresql/backups',
        'archive_dir': '/bulk/databases/postgres-ai'}
     ] }}
