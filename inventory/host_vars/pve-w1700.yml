---
# Host vars for pve-w1700 (primary, always-on — currently the Splunk node).
#
# Layer-1 protection (local ZFS snapshots via sanoid) for the Splunk all-in-one
# VM's OS and configuration disks, so the snapshots exist for syncoid to pull
# (and as a rollback point). Neither VMIDs nor pools nor volume names are
# hard-coded: they resolve at runtime from the S3 tofu inventory injected by
# load_tofu.yml (splunk_vm_from_tofu / containers_from_tofu), so a renumber or a
# storage-tier move flows through with no edit here. What IS written down is the
# policy — WHICH disks are protected; see the policy block further down.
#
# The critical/volatile split that used to be a follow-up here is DONE: the hot,
# warm and cold index tiers now live on their own pool, which carries no sanoid
# entry anywhere in this file. That is deliberate and load-bearing — Splunk owns
# index durability through its own bucket archival, so snapshotting a constantly
# rewritten index tier only pins dead blocks. Disk 2 is now configuration and
# logs only, which is why an hourly cadence is cheap here.
#
# Object storage is NOT protected from this layer. It is erasure-coded across
# nodes and owns its own redundancy; a storage-layer snapshot underneath it would
# reintroduce exactly the duplication that erasure coding replaces.
#
# NOTE (generalization, follow-up): this assumes Splunk runs on pve-w1700. When the
# layout is generalized (data-driven from splunk_vm_from_tofu across nodes),
# this moves out of a per-host file. See docs design + follow-up issue.
# sanoid_datasets is only rendered when the sanoid role runs, which can happen
# without load_tofu.yml if an operator scopes a run with --limit excluding
# localhost (--limit filters hosts, not tags, so `tags: always` on the localhost
# play does not save it).
#
# This used to fall back to a test-fixture VMID. It must not. A guessed VMID
# renders a syntactically valid sanoid.conf for a guest that does not exist,
# which silently drops the real Splunk disks from every snapshot policy — and
# the run reports success. That is strictly worse than failing: a scoped run
# once proposed replacing vm-200-disk-0/-disk-2 with vm-90200-*, a VMID that has
# never existed on this estate, immediately before the hand-built recovery
# copies were due to be deleted.
#
# So: resolve, and fail loudly with the actual remedy when unresolved. Every
# `| mandatory(...)` below is bare — a `default()` to its left would satisfy it
# unconditionally, because mandatory rejects only UNDEFINED.
#
# The default() calls that DO appear sit on the enclosing container, never on
# the value being asserted, and use the boolean-aware two-argument form so an
# explicitly-null container is replaced rather than passed through. Attribute
# access on the replacement still yields Undefined, so the guard still fires —
# verified by rendering with each container set to null and confirming the run
# fails with the message below rather than a Jinja traceback.

# The `postgres` guest's mp0 (`/var/lib/postgresql`) carries BOTH the cluster's
# PGDATA and `/var/lib/postgresql/backups`, the nightly per-database pg_dump
# archive for nautobot, vikunja and zammad.
#
# That archive had NO snapshot of any kind. Verified 2026-08-10 on the live
# node: `zfs list -t snapshot | grep -c <vmid>` returned 0 on every reachable
# node, and this file listed only the Splunk disks. It is also the tier with the
# only restore that has actually been proven to work (see int_homelab
# docs/runbooks/nautobot-logical-restore.md), so losing the dataset would have
# taken out the estate's one demonstrated recovery path.
#
# `hourly: 24` rather than the template's daily-only cadence, for the reason
# already recorded against `bulk/databases` on pve-r540: this is a DUMP ARCHIVE
# written once a night, and sanoid's daily snapshot fires at midnight while the
# dump lands ~02:30, so a daily-only policy captures each dump roughly a day
# late. Hourly closes that to same-day without changing what `database` means
# for warm standbys.
postgres_vmid: >-
  {{ ((containers_from_tofu | default({}, true))['postgres'] | default({}, true)).vmid
     | mandatory('containers_from_tofu is unset, so the postgres VMID cannot be
       resolved. Run playbooks/load_tofu.yml — it targets localhost, so any
       --limit must include localhost. Refusing to guess a VMID.') }}

# --- Protected-disk POLICY (opt-in), and the derived paths ------------------
#
# The dataset PATHS below are derived; only the POLICY is written down. The
# previous revision named 'rpool/data/vm-<id>-disk-<n>' literally, which wrote
# the POOL into a snapshot policy — and a pool is exactly what a storage-tier
# migration changes. When that happens sanoid keeps snapshotting the old, now
# frozen dataset: snapshot counts and timestamps stay healthy while capturing
# nothing. That already happened once on another node, to two OpenBao raft
# voters, and no count- or age-based check can see it, because the counts and
# the ages are correct and merely describe the wrong dataset.
#
# The policy is OPT-IN and there is deliberately no exclusion list. A disk is
# protected only by being named here, so the index tiers staying out of every
# snapshot policy remains a STATED decision (see the header above: Splunk owns
# index durability through its own bucket archival) rather than something that
# happens to fall out of a filter. Iterating every published disk with a
# tier-only override map — as pve-w5900 does — would enrol the hot/warm and
# cold index tiers here, because such a map changes a template and never
# excludes.
#
# Splunk's disks are named by INTERFACE, not by index. The VOLUME name is read
# from the published `disks` list, which carries the name PROXMOX assigned; it
# is never built by counting, because indices are allocated per (vmid, storage)
# as next-free, so on a guest whose volume was ever moved a counted name is the
# RETAINED pre-move copy — a frozen dataset that looks perfectly healthy.
#
# The interface list is iterated (not the disk list filtered) so that an
# interface that stops being published fails the converge instead of silently
# dropping that disk's coverage at rc=0.
splunk_protected_disk_interfaces:
  - scsi0 # OS disk
  - virtio1 # configuration + logs; hourly cadence is cheap because of that

# The postgres mp0 volume (see above). Its INDEX is the one name still written
# down here, because a container publishes only its ROOTFS datastore — no
# mount-point volume name reaches this file at all. The pool it sits on is
# derived from that published datastore, which is what a tier migration moves,
# so the residual risk is narrowed to a re-allocated mount-point index.
# Publishing container mount points upstream would close it.
postgres_protected_volume_index: 1

sanoid_datasets_json: >-
  {
  {%- set ns = namespace(sep='') -%}
  {%- set splunk = ((splunk_vm_from_tofu | default({}, true)).splunk | default({}, true)).disks
        | mandatory('pve-w1700: the Splunk VM publishes no .disks, so its dataset
          paths cannot be resolved. Run playbooks/load_tofu.yml (it targets
          localhost, so any --limit must include localhost); if the published
          inventory predates the disks field, apply tofu-proxmox first.
          Refusing to guess a pool or a volume name.') -%}
  {%- for iface in splunk_protected_disk_interfaces -%}
    {%- set disk = splunk | selectattr('interface', 'eq', iface) | list | first
          | mandatory('pve-w1700: the Splunk VM publishes no disk on interface "'
            ~ iface ~ '", named in splunk_protected_disk_interfaces. The guest
            was re-attached or the interface renamed; reconcile that list against
            the published disks rather than letting the disk lose coverage.') -%}
    {%- set root = pve_dataset_root_by_storage[disk.datastore]
          | mandatory('pve-w1700: the Splunk VM has a protected disk on storage "'
            ~ disk.datastore ~ '", which resolves to no ZFS dataset root. A
            dir-type storage has no per-guest dataset and cannot be snapshotted;
            move that disk to a zfspool storage or declare the storage in
            node_storage.') -%}
    {{ ns.sep }}{{ (root ~ '/' ~ disk.path) | to_json }}:
    {{- {'use_template': 'critical'} | to_json }}
    {%- set ns.sep = ',' -%}
  {%- endfor -%}
  {%- set pg = (containers_from_tofu | default({}, true))['postgres'] | default({}, true) -%}
  {%- set pg_ds = pg.datastore
        | mandatory('pve-w1700: the postgres container publishes no .datastore,
          so its dataset pool cannot be resolved. Run playbooks/load_tofu.yml
          (--limit must include localhost); if the published inventory predates
          the datastore field, apply tofu-proxmox first.') -%}
  {%- set pg_root = pve_dataset_root_by_storage[pg_ds]
        | mandatory('pve-w1700: the postgres container is on storage "' ~ pg_ds
          ~ '", which resolves to no ZFS dataset root. A dir-type storage has no
          per-guest dataset and cannot be snapshotted; move the guest to a
          zfspool storage or declare the storage in node_storage.') -%}
  {{ ns.sep }}{{ (pg_root ~ '/subvol-' ~ postgres_vmid ~ '-disk-'
                  ~ postgres_protected_volume_index) | to_json }}:
  {{- {'use_template': 'database', 'hourly': 24} | to_json }}
  {%- set ns.sep = ',' -%}
  {#- Workstation backup archive. Written by an append-only push (the sender
      runs without --delete), so snapshots cost almost nothing: they only pin
      blocks that would otherwise be freed, and nothing here is rewritten.
      Snapshots are what actually makes the archive undeletable — the absence
      of a delete flag on the sender is a client-side convention, not an
      enforced property. hourly is off because the push is nightly. This is a
      literal dataset, not tofu-derived: it is node-local storage, not a
      guest volume, so there is no published VMID to resolve. -#}
  {{ ns.sep }}{{ 'rpool/data/nas' | to_json }}:
  {{- {'use_template': 'critical', 'hourly': 0} | to_json }}
  }
sanoid_datasets: "{{ sanoid_datasets_json | from_json }}"

# Offline-DR wake controller. This node is always-on and can reach the BMC
# subnet, so it runs the node_scheduled_wake timers that power a normally-off
# DR node ON for its replication windows. The BMC address + credentials come
# from the environment (Doppler), never committed. Default schedule (03:00 +
# 15:00) lives in the role defaults.
#
# Empty: the only previous target is now always-on and no longer needs waking.
# Add an entry here again if a future normally-off DR leg needs this mechanism.
node_scheduled_wake_targets: []

# Clear the CPU C6-state enable MSR bits at boot (kernel_tuning role);
# the cmdline max_cstate limit alone does not cover this idle state.
kernel_tuning_disable_zen_c6: true

# Keep TSC as the clocksource and skip the timekeeping watchdog, rather than
# letting the watchdog demote TSC and fall back to HPET.
#
# Left to itself the kernel picks TSC here, then its watchdog demotes it and
# prints "TSC found unstable... Use 'tsc=unstable'". Taking that advice is what
# this host used to do, and it lands on HPET — measured at 2816 ns per
# clock_gettime versus 37 ns for TSC on the same-class host, 76x. HPET is an
# MMIO read of a single shared counter, so it cannot come from the vDSO and
# concurrent reads across cores serialize.
#
# nowatchdog rather than unstable is defensible on this specific CPU because:
#   - it advertises constant_tsc and nonstop_tsc (invariant TSC);
#   - the cross-CPU synchronization check reports no TSC warp, which is the
#     failure mode that would genuinely make TSC unsafe;
#   - the demotion is driven by 0.85 ms of skew over a 497 ms interval (0.17%)
#     measured *against HPET* — and a reference clock that slow distorts the
#     comparison it is being used for.
#
# The tradeoff is real: with the watchdog off, genuine TSC drift would go
# undetected rather than being demoted automatically. Chrony corrects wall
# clock, but guest timekeeping is worth watching after this change.
kernel_tuning_tsc_mode: nowatchdog

# --- STAGED-ONLY: Plex relocation prereqs (issue #395, terraform-proxmox#615) ---
# Uncomment BOTH blocks only after the staged node_storage entries are applied
# upstream (fast/appdata parent dataset exists here + the library dataset on the
# storage node carries its nfs_export) — GATE-A in terraform-proxmox#615.
# Until then the syncoid cron would fail nightly (no recv parent) and the NFS
# mount would error (no export), so they stay commented, same staged convention
# as the upstream deployment manifest.
#
# media_lxc_features_nfs_mounts:
#   - src: "{{ proxmox_node_names.storage }}:/bulk/data"
#     path: /bulk/data
#     opts: ro,soft,timeo=150,nofail,_netdev
#
# syncoid_jobs:
#   # Appdata seed/refresh for the relocation: pull Plex's identity +
#   # watch-history dataset from the storage node into the local fast pool.
#   # Repeated runs keep it fresh until the cutover flip; after the flip this
#   # job is REMOVED (the dataset becomes live here, direction would invert).
#   - name: "plex-appdata-relocation"
#     source: "root@{{ proxmox_node_names.storage }}:bulk/appdata/plex"
#     target: "fast/appdata/plex"

# The iDRAC kiosk drives a physical monitor and belongs to this node alone. It
# is off everywhere else: the other nodes have no usable GL, where the kiosk
# cannot start and a restart loop can power the node off through the console
# power button.
idrac_kiosk_enabled: true

# --- Workstation backup ingress ---
# This node receives the workstation's off-box media push. The push
# authenticates as a dedicated service account with no sudo, not as root:
# writing into one directory is not an administrative act, and a scheduled
# unattended job should not hold root on a hypervisor to do it.
#
# The key line carries a forced command that confines the session to this one
# directory and strips delete flags, so the archive is append-only as an
# enforced property rather than a sender-side convention. Snapshots on
# rpool/data/nas cover the other case, a client that overwrites in place.
#
# The line is read from the secret store, not committed, so the forced command
# can be corrected without a repo round-trip.
local_identities_backup_ingress_enabled: true
local_identities_backup_ingress_dir: /mnt/nas/backups/workstation
local_identities_backup_ingress_ssh_public_key: "{{ lookup('community.hashi_vault.vault_kv2_get',
  'workstation-backup-key',
  engine_mount_point='config',
  url=lookup('env', 'BAO_ADDR'),
  token=lookup('env', 'BAO_TOKEN')).secret.authorized_key_line }}"
