---
# Host vars for this node (the R710).
#
# This node is always-on:
#   - node_auto_poweroff_enabled is false: no scheduled poweroff timer.
#   - syncoid runs on the wall-clock cron trigger, because a boot trigger on an
#     always-on node only fires when the node happens to reboot. It was left on
#     `boot` after the always-on change and that turned out to BE the replication
#     RPO: measured 2026-07-29, this node's copy of the node-2 appdata namespace
#     was ~9.6 h behind the source (source snapshot 11:05, replica 02:00), with
#     ~24 h the normal case. Every hour the node stays up past its last boot is
#     RPO. The cron trigger decouples replication from reboots entirely.
# pve_power_managed still lets a manual site.yml run power-cycle this node for
# maintenance (the idrac_power auto-cycle bookends).
pve_power_managed: true
idrac_power_bmc_host: "{{ lookup('env', 'PVE3_BMC_HOSTNAME') | default('', true) }}"
node_auto_poweroff_enabled: false
syncoid_trigger: cron
# Every 4 h on the hour. Passed straight through to ansible.builtin.cron, so
# crontab step syntax works here. 4 h is a deliberate compromise: the pulls are
# incremental over sanoid snapshots and cheap, but the sources include a pool
# that has been degraded, so this is not the place to be aggressive. Tighten
# once the node-2 pool rebuild lands and its redundancy is back.
syncoid_cron_hour: "*/4"
syncoid_boot_poweroff_on_complete: false

# The Splunk configuration disk is ~4 GB of text that changes whenever anything
# is reconfigured, and its incrementals are kilobytes — so a 4 h RPO on it buys
# nothing and costs a day's worth of config edits in a restore. It gets its own
# hourly group. The index tiers are NOT here and never will be: they live on a
# separate pool with no snapshots at all, because Splunk archives its own
# buckets. Offset off the hour so it does not collide with the */4 run.
syncoid_extra_schedules:
  hourly:
    hour: "*"
    minute: "37"

# Per-minute healthchecks liveness ping stays off pending its own follow-up
# (unrelated to the always-on change above).
proxmox_monitoring_enable_healthchecks: false

# Layer-2 protection (cross-node ZFS replication via syncoid, PULL model): pve3
# is the second (offline-DR) replica target. It pulls the Splunk VM disk
# snapshots from its source node into bulk/replica/<node> — the same jobs pve2
# runs into bulk/replica/<node>, so both always-on (pve2) and offline-DR (pve3)
# legs hold an independent copy. The source NODE NAME is derived from tofu
# (splunk_vm_from_tofu, injected by load_tofu) — never hard-coded — so this
# follows the VM if it is ever defined on a different node. bulk is pve3's own
# local raidz2 pool; the bulk/replica/<node> parent is created by zfs_pools from
# the terraform-proxmox node_storage declaration, and syncoid creates the
# per-disk leaves.
#
# Prereqs (verified live): root SSH pve3->source works (PVE cluster keys +
# cluster_ssh_trust known_hosts); each source disk has a sanoid snapshot for
# --no-sync-snap. Replicate the OS disk (0) and /opt/splunk config+indexes (2);
# disk-1 was an empty leftover. Whole-disk for now; excluding the volatile index
# tier is the tracked critical/volatile follow-up.
# These vars are only rendered when the syncoid role runs, which can happen
# without load_tofu.yml if an operator scopes a run with --limit excluding
# localhost (--limit filters hosts, not tags, so `tags: always` on the localhost
# play does not save it).
#
# They used to fall back to a test-fixture vmid/node. They must not. A guessed
# VMID produces replication jobs whose source dataset does not exist, so the
# replica the whole protection scheme depends on is never created — while the
# run itself reports success. Guessing the node is the same class of error.
# Resolve each once, and fail loudly with the remedy when unresolved.
splunk_vmid: >-
  {{ ((splunk_vm_from_tofu | default({})).splunk | default({})).vmid
     | mandatory('splunk_vm_from_tofu is unset, so the Splunk VMID cannot be
       resolved. Run playbooks/load_tofu.yml — it targets localhost, so any
       --limit must include localhost. Refusing to guess a VMID.') }}
splunk_node: >-
  {{ ((splunk_vm_from_tofu | default({})).splunk | default({})).node
     | mandatory('splunk_vm_from_tofu is unset, so the Splunk node cannot be
       resolved. Run playbooks/load_tofu.yml (see splunk_vmid above).
       Refusing to guess a node.') }}

syncoid_jobs:
  - name: "splunk-{{ splunk_vmid }}-disk0"
    source: "root@{{ splunk_node }}:rpool/data/vm-{{ splunk_vmid }}-disk-0"
    target: "bulk/replica/{{ splunk_node }}/vm-{{ splunk_vmid }}-disk-0"
  # disk-2 is the Splunk configuration + log volume (NOT indexes — those are on
  # their own pool and are never replicated). Small, text, frequently edited:
  # hourly, per syncoid_extra_schedules above.
  - name: "splunk-{{ splunk_vmid }}-disk2"
    schedule: hourly
    source: "root@{{ splunk_node }}:rpool/data/vm-{{ splunk_vmid }}-disk-2"
    target: "bulk/replica/{{ splunk_node }}/vm-{{ splunk_vmid }}-disk-2"
  # Object storage is deliberately NOT replicated here. It is erasure-coded
  # across nodes and owns its own redundancy, so a ZFS replica underneath it
  # would duplicate what erasure coding already provides.
  #
  # Database warm-standby DR: pull the whole bulk/databases namespace from the
  # always-on node 2 into this offline-DR leg (recursive via default options, so
  # every bulk/databases/<instance> child comes along). The source node is fixed
  # by design (node 2, the warm-standby home), unlike the splunk jobs whose source
  # node is derived from tofu; the prefix comes from proxmox_node_prefix so the
  # node name is never hard-coded. Refreshes only during this node's power-on
  # windows.
  - name: "databases"
    source: "root@{{ proxmox_node_prefix }}2:bulk/databases"
    target: "bulk/replica/{{ proxmox_node_prefix }}2/databases"
  # App config/state DR: pull the whole bulk/appdata namespace from the always-on
  # node 2 (recursive via default options, so every bulk/appdata/<app> child comes
  # along). Same pull pattern (and same proxmox_node_prefix parameterization) as
  # the databases job. Refreshes only during this node's power-on windows.
  - name: "appdata"
    source: "root@{{ proxmox_node_prefix }}2:bulk/appdata"
    target: "bulk/replica/{{ proxmox_node_prefix }}2/appdata"
