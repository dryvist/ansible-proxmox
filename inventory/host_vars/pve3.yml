---
# Host vars for pve3 (the R710 — a normally-off offline-DR leg).
#
# Autonomous wake -> replicate -> sleep cycle. pve3 is normally OFF to save power
# and comes up only for its backup windows:
#   - WAKE: the always-on controller (see pve1 host_vars node_scheduled_wake_
#     targets) issues an IPMI power-on twice a day. The BMC address comes from the
#     environment (Doppler PVE3_BMC_IP) — never committed.
#   - REPLICATE: on boot, the syncoid role runs the PULL jobs below once
#     (syncoid_trigger: boot). The wall-clock cron is the WRONG trigger here — it
#     would never fire inside a short power-on window.
#   - SLEEP: syncoid chains to the node_auto_poweroff oneshot on completion
#     (syncoid_boot_poweroff_on_complete), so pve3 powers off the moment
#     replication finishes (success OR failure). The 22:00 node_auto_poweroff
#     timer stays as a guaranteed-off backstop if a run ever hangs.
# pve_power_managed also lets a manual site.yml run power-cycle pve3 for
# maintenance (the idrac_power auto-cycle bookends).
pve_power_managed: true
idrac_power_bmc_ip: "{{ lookup('env', 'PVE3_BMC_IP') | default('', true) }}"
node_auto_poweroff_enabled: true
syncoid_trigger: boot
syncoid_boot_poweroff_on_complete: true

# Normally-off node: do NOT run the per-minute healthchecks liveness ping — it
# would sit "down" and alarm whenever pve3 is (intentionally) off. A freshness
# deadman for the DR replicas is a tracked follow-up.
proxmox_monitoring_enable_healthchecks: false

# Layer-2 protection (cross-node ZFS replication via syncoid, PULL model): pve3
# is the second (offline-DR) replica target. It pulls the Splunk VM disk
# snapshots from its source node into bulk/replica/<node> — the same jobs pve2
# runs into bulk/replica/<node>, so both always-on (pve2) and offline-DR (pve3)
# legs hold an independent copy. The source NODE NAME is derived from tofu
# (splunk_vm_from_tofu, injected by load_tofu) — never hard-coded — so this
# follows the VM if it is ever defined on a different node. bulk is pve3's own
# local raidz2 pool; the bulk/replica/<node> parent is created by zfs_pools from
# the terraform-proxmox node_storage declaration, and syncoid creates the
# per-disk leaves.
#
# Prereqs (verified live): root SSH pve3->source works (PVE cluster keys +
# cluster_ssh_trust known_hosts); each source disk has a sanoid snapshot for
# --no-sync-snap. Replicate the OS disk (0) and /opt/splunk config+indexes (2);
# disk-1 was an empty leftover. Whole-disk for now; excluding the volatile index
# tier is the tracked critical/volatile follow-up.
syncoid_jobs:
  - name: "splunk-{{ splunk_vm_from_tofu.splunk.vmid }}-disk0"
    source: "root@{{ splunk_vm_from_tofu.splunk.node }}:rpool/data/vm-{{ splunk_vm_from_tofu.splunk.vmid }}-disk-0"
    target: "bulk/replica/{{ splunk_vm_from_tofu.splunk.node }}/vm-{{ splunk_vm_from_tofu.splunk.vmid }}-disk-0"
  - name: "splunk-{{ splunk_vm_from_tofu.splunk.vmid }}-disk2"
    source: "root@{{ splunk_vm_from_tofu.splunk.node }}:rpool/data/vm-{{ splunk_vm_from_tofu.splunk.vmid }}-disk-2"
    target: "bulk/replica/{{ splunk_vm_from_tofu.splunk.node }}/vm-{{ splunk_vm_from_tofu.splunk.vmid }}-disk-2"
  # Object-storage (RustFS) DR: pull the splunk-addons data volume
  # (subvol-202000-disk-1 = /srv/object-storage) from node 1 into this offline-DR
  # leg. The container is pinned to node 1, so the source node is fixed via
  # proxmox_node_prefix (same pattern as the databases/appdata jobs below that fix
  # node 2) — never a hard-coded node name. Refreshes only during power-on windows.
  - name: "object-storage-disk1"
    source: "root@{{ proxmox_node_prefix }}1:rpool/data/subvol-202000-disk-1"
    target: "bulk/replica/{{ proxmox_node_prefix }}1/subvol-202000-disk-1"
  # MinIO (vmid 107) data volume — CURRENT live splunk-addons store during the
  # MinIO->RustFS migration soak (holds the real app tarballs today). Offline-DR
  # leg; same pull pattern as above. Drop after MinIO decommission.
  - name: "minio-disk1"
    source: "root@{{ proxmox_node_prefix }}1:rpool/data/subvol-107-disk-1"
    target: "bulk/replica/{{ proxmox_node_prefix }}1/subvol-107-disk-1"
  # Database warm-standby DR: pull the whole bulk/databases namespace from the
  # always-on node 2 into this offline-DR leg (recursive via default options, so
  # every bulk/databases/<instance> child comes along). The source node is fixed
  # by design (node 2, the warm-standby home), unlike the splunk jobs whose source
  # node is derived from tofu; the prefix comes from proxmox_node_prefix so the
  # node name is never hard-coded. Refreshes only during this node's power-on
  # windows.
  - name: "databases"
    source: "root@{{ proxmox_node_prefix }}2:bulk/databases"
    target: "bulk/replica/{{ proxmox_node_prefix }}2/databases"
  # App config/state DR: pull the whole bulk/appdata namespace from the always-on
  # node 2 (recursive via default options, so every bulk/appdata/<app> child comes
  # along). Same pull pattern (and same proxmox_node_prefix parameterization) as
  # the databases job. Refreshes only during this node's power-on windows.
  - name: "appdata"
    source: "root@{{ proxmox_node_prefix }}2:bulk/appdata"
    target: "bulk/replica/{{ proxmox_node_prefix }}2/appdata"
