---
# Corosync link1 on the dedicated unmanaged switch: interface address only,
# no gateway. Link-local (169.254.98.0/24) never routes, so this is pure
# point-to-point wiring for corosync's second ring. The cluster corosync.conf
# change that consumes these addresses is separate and reviewed; declaring the
# interfaces now makes it one edit when the switch and cabling exist.
pve_host_network_extra_interfaces:
  - name: eno2
    address: 169.254.98.12/24
    comment: corosync link1 (dedicated switch)
