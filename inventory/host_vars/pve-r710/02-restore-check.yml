---
# Weekly restore check of the object-store replica pulled by the "object-store"
# job in 01-syncoid-jobs.yml.
#
# Freshness alone does not prove the replica is usable: a pull that succeeds
# every hour still leaves a copy that cannot be mounted or read back — a
# corrupt receive, a clone that collides with the live mount, a bucket that
# silently emptied. This timer clones the newest snapshot read-only once a
# week and reads the bucket back, so a replica that exists but cannot be
# restored is caught within a week instead of at the moment of a disaster.
#
# The dataset mirrors that job's target exactly, derived from the published
# inventory the same way (this guest has already moved once; a renumber or
# relocation flows through with no edit here). The schedule default
# (Saturday 05:52 + up to 1 h fixed random delay) sits between the 04:17 and
# 08:17 default-group pulls, off the hourly :37 pull, off sanoid's ~:00
# snapshot minute, and off the :00/:15/:30/:45 grid — see the role defaults.
syncoid_restore_check_enabled: true
syncoid_restore_check_dataset: >-
  bulk/replica/{{ object_store_node }}/subvol-{{ object_store_vmid }}-disk-1
