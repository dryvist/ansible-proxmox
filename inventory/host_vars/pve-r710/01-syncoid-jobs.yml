---
# syncoid replication jobs for this node.
#
# Split out of the single host_vars file, which reached the repository per-file
# token limit. Ansible loads every file under host_vars/<host>/ exactly as it
# loaded host_vars/<host>.yml, so nothing changed name, value or precedence.


syncoid_pinned_jobs:
  - name: "splunk-{{ splunk_vmid }}-disk0"
    sanoid_replica_class: fast
    source: >-
      {{ 'root@' ~ splunk_node ~ ':' ~
         hostvars[splunk_node].pve_dataset_root_by_storage[
           splunk_protected_disks_by_interface['scsi0'].datastore] ~ '/' ~
         splunk_protected_disks_by_interface['scsi0'].path }}
    target: >-
      {{ 'bulk/replica/' ~ splunk_node ~ '/' ~
         splunk_protected_disks_by_interface['scsi0'].path }}
  # Pull only the OS and configuration/log interfaces; Splunk owns index
  # durability through bucket archival. The published volume names follow moves.
  - name: "splunk-{{ splunk_vmid }}-disk2"
    schedule: hourly
    sanoid_replica_class: fast
    source: >-
      {{ 'root@' ~ splunk_node ~ ':' ~
         hostvars[splunk_node].pve_dataset_root_by_storage[
           splunk_protected_disks_by_interface['virtio1'].datastore] ~ '/' ~
         splunk_protected_disks_by_interface['virtio1'].path }}
    target: >-
      {{ 'bulk/replica/' ~ splunk_node ~ '/' ~
         splunk_protected_disks_by_interface['virtio1'].path }}
  # Object storage IS replicated, because it owns no redundancy of its own.
  #
  # This previously read that it was erasure-coded across nodes and therefore
  # needed no ZFS replica. That was not true of the deployment: the store runs
  # as a single server process over a single directory, on one guest. There is
  # no erasure set and no second instance, so nothing underneath it was ever
  # protecting it — and with this job absent, the replica left behind went
  # stale where it stood.
  #
  # It is also the highest-consequence dataset on the estate: it holds the
  # remote state, the desired-state object, the published inventory, and the
  # bucket other backups are written INTO. A backup target with no copy of its
  # own is the one that turns a disk failure into an unrecoverable one.
  #
  # Distributed mode upstream is still under test at the pinned version. When
  # it is production-ready and actually deployed as an erasure set, revisit
  # this — but delete the job in the same change that proves the replacement
  # exists, not on the strength of an assumption about how it is deployed.
  # Node and VMID both come from the published inventory, like the splunk jobs
  # above: this guest has already moved once, and a pull job naming a node it no
  # longer runs on fails every cycle while the replica it left behind ages.
  - name: "object-store"
    schedule: hourly
    sanoid_replica_class: fast
    source: "root@{{ object_store_node }}:bulk/object/subvol-{{ object_store_vmid }}-disk-1"
    target: "bulk/replica/{{ object_store_node }}/subvol-{{ object_store_vmid }}-disk-1"
  #
  # Database DR: pull the whole bulk/databases namespace off the storage node
  # (recursive via default options, so every bulk/databases/<instance> child
  # comes along). What this carries is the logical dump archive, not a live
  # database volume — a snapshot of a running cluster is inconsistent by
  # construction, so the dump is the thing worth having on a second pool.
  #
  # The source node moved with the storage role: these two jobs previously named
  # node 2, whose datasets now live on node 540. A pull job pointed at a node
  # that no longer serves the dataset does not degrade quietly — it fails every
  # cycle while the replica it left behind ages, so the source has to follow the
  # data. The source node is fixed by design (the storage home), unlike the
  # splunk jobs whose source node is derived from tofu; the prefix comes from
  # proxmox_node_names.storage so the node name is never hard-coded.
  - name: "databases"
    sanoid_replica_class: fast
    source: "root@{{ proxmox_node_names.storage }}:bulk/databases"
    target: "bulk/replica/{{ proxmox_node_names.storage }}/databases"
  # App config/state DR: pull the whole bulk/appdata namespace off the same
  # storage node (recursive via default options, so every bulk/appdata/<app>
  # child comes along). Same pull pattern and same proxmox_node_names
  # parameterization as the databases job.
  - name: "appdata"
    sanoid_replica_class: slow
    source: "root@{{ proxmox_node_names.storage }}:bulk/appdata"
    target: "bulk/replica/{{ proxmox_node_names.storage }}/appdata"
  # Personal files (home videos, photos, music): irreplaceable, same pull pattern.
  - name: "home-videos"
    sanoid_replica_class: slow
    source: "root@{{ proxmox_node_names.storage }}:bulk/home-videos"
    target: "bulk/replica/{{ proxmox_node_names.storage }}/home-videos"
  - name: "photos"
    sanoid_replica_class: slow
    source: "root@{{ proxmox_node_names.storage }}:bulk/photos"
    target: "bulk/replica/{{ proxmox_node_names.storage }}/photos"
  - name: "music"
    sanoid_replica_class: slow
    source: "root@{{ proxmox_node_names.storage }}:bulk/music"
    target: "bulk/replica/{{ proxmox_node_names.storage }}/music"
  - name: "jdrive"
    sanoid_replica_class: slow
    source: "root@{{ proxmox_node_names.storage }}:bulk/jdrive"
    target: "bulk/replica/{{ proxmox_node_names.storage }}/jdrive"
  # Guest service-state volumes on the bulk node. These were replicated until
  # 2026-07-25 and then silently stopped: the guests were REBUILT with new
  # dataset suffixes (disk-0 became disk-1, and so on) and the job list still
  # named the old ones. Nothing failed loudly, because a job that is simply
  # absent produces no error — the copies left behind just aged in place while
  # their fresh local autosnaps made them look current.
  #
  # Stale replicas whose source no longer exists are destroyed, not kept.
  #
  # Media guests are NOT here on purpose: their rootfs is re-acquirable and
  # their state already rides along in the appdata job above.
  - name: "ct-110021-disk1"  # openbao-21
    source: "root@pve-r540:bulk/subvol-110021-disk-1"
    target: "bulk/replica/pve-r540/subvol-110021-disk-1"
  - name: "ct-405000-disk2"  # langfuse rootfs
    source: "root@pve-r540:bulk/subvol-405000-disk-2"
    target: "bulk/replica/pve-r540/subvol-405000-disk-2"
  - name: "ct-405000-disk3"  # langfuse /opt/langfuse
    source: "root@pve-r540:bulk/subvol-405000-disk-3"
    target: "bulk/replica/pve-r540/subvol-405000-disk-3"
  - name: "ct-514000-disk2"  # qdrant rootfs
    source: "root@pve-r540:bulk/subvol-514000-disk-2"
    target: "bulk/replica/pve-r540/subvol-514000-disk-2"
  - name: "ct-514000-disk3"  # qdrant data
    source: "root@pve-r540:bulk/subvol-514000-disk-3"
    target: "bulk/replica/pve-r540/subvol-514000-disk-3"
  - name: "ct-515010-disk2"  # llamaindex rootfs
    source: "root@pve-r540:bulk/subvol-515010-disk-2"
    target: "bulk/replica/pve-r540/subvol-515010-disk-2"
  - name: "ct-515010-disk3"  # llamaindex data
    source: "root@pve-r540:bulk/subvol-515010-disk-3"
    target: "bulk/replica/pve-r540/subvol-515010-disk-3"
  - name: "ct-518010-disk1"  # 518010
    source: "root@pve-r540:bulk/subvol-518010-disk-1"
    target: "bulk/replica/pve-r540/subvol-518010-disk-1"
  - name: "ct-519010-disk2"  # postgres-ai-2 rootfs
    source: "root@pve-r540:bulk/subvol-519010-disk-2"
    target: "bulk/replica/pve-r540/subvol-519010-disk-2"
  - name: "ct-519010-disk3"  # postgres-ai-2 data
    source: "root@pve-r540:bulk/subvol-519010-disk-3"
    target: "bulk/replica/pve-r540/subvol-519010-disk-3"
  - name: "ct-5310010-disk1"  # technitium-dns-2
    source: "root@pve-r540:bulk/subvol-5310010-disk-1"
    target: "bulk/replica/pve-r540/subvol-5310010-disk-1"

# Root-pool guest-disk pulls, generated from the published inventory. The
# recursive rpool/data peer pull that used to sit in the pinned list above
# carried these, but it also swept in guests that pvesr already replicates
# and the ephemeral agent-sandbox guests. One job per guest disk replaces it:
#
# - the guest runs on the storage node (proxmox_node_names.storage);
# - the disk's datastore resolves through the storage node's
#   pve_dataset_root_by_storage to the node's root pool (rpool/data) — disks
#   on any other storage stay out, covered by their own jobs or policies;
# - the guest has no ha_replication_target, or it names a node other than this
#   syncoid target; guests pvesr sends to this node stay out;
# - the guest is not tagged agent-sandbox (see
#   syncoid_retired_replica_datasets below);
# - the guest is not tagged shared-media-data; its rootfs is re-acquirable and
#   its state already rides along in the appdata job.
#
# Each job is non-recursive per disk (options drops --recursive), stays in the
# default schedule, and uses the slow replica retention template. A container
# has exactly one rootfs, so its dataset is 'subvol-<vmid>-disk-0' (the same
# derivation the sanoid per-node expressions use); a VM's disk names come from
# the published per-disk `path`, never by counting.
#
# Built as JSON and decoded: a folded scalar whose template opens with
# {% set %} renders as TEXT (see load_tofu.yml's NAS note), so the structure
# goes through | to_json / | from_json. Like the object-store expressions in
# the pinned list, every input resolves from the published inventory and the
# expression fails loudly when load_tofu.yml has not run — a guessed dataset
# path would render jobs whose source does not exist while the run reports
# success.
syncoid_rootpool_jobs_json: >-
  {%- set jobs = [] -%}
  {%- set storage_node = proxmox_node_names.storage -%}
  {%- set dataset_roots = hostvars[storage_node].pve_dataset_root_by_storage -%}
  {%- for ct_entry in (containers_from_tofu | mandatory(
        'containers_from_tofu is unset, so the storage-node root-pool guest
        disk jobs cannot be listed. Run playbooks/load_tofu.yml — it targets
        localhost, so any --limit must include localhost. Refusing to guess
        dataset paths.')) | dict2items -%}
    {%- set ct = ct_entry.value -%}
    {%- if ct.node | default('') == storage_node
          and 'agent-sandbox' not in (ct.tags | default([]))
          and 'shared-media-data' not in (ct.tags | default([]))
          and (ct.ha_replication_target | default('', true)) != inventory_hostname -%}
      {%- set datastore = ct.datastore | mandatory(
            'container ' ~ ct_entry.key ~ ' publishes no .datastore, so its
            root-pool dataset path cannot be resolved. The published
            inventory predates that field; apply tofu-proxmox first.') -%}
      {%- if dataset_roots[datastore] | default('') == 'rpool/data' -%}
        {%- set _ = jobs.append({
              'name': 'rootpool-' ~ ct.vmid ~ '-disk-0',
              'source': 'root@' ~ storage_node ~ ':rpool/data/subvol-' ~ ct.vmid ~ '-disk-0',
              'target': 'bulk/replica/' ~ storage_node ~ '/rpool/data/subvol-' ~ ct.vmid ~ '-disk-0',
              'options': '--no-sync-snap --quiet',
              'sanoid_replica_class': 'slow'}) -%}
      {%- endif -%}
    {%- endif -%}
  {%- endfor -%}
  {%- for vm_entry in (vms_from_tofu | mandatory(
        'vms_from_tofu is unset, so the storage-node root-pool guest disk
        jobs cannot be listed. Run playbooks/load_tofu.yml (see
        containers_from_tofu above). Refusing to guess dataset paths.')) | dict2items -%}
    {%- set vm = vm_entry.value -%}
    {%- if vm.node | default('') == storage_node
          and 'agent-sandbox' not in (vm.tags | default([]))
          and 'shared-media-data' not in (vm.tags | default([]))
          and (vm.ha_replication_target | default('', true)) != inventory_hostname -%}
      {%- for disk in vm.disks | mandatory(
            'VM ' ~ vm_entry.key ~ ' publishes no .disks, so its dataset paths
            cannot be resolved. The published inventory predates that field;
            apply tofu-proxmox first.') -%}
        {%- set datastore = disk.datastore | mandatory(
              'VM ' ~ vm_entry.key ~ ' has a disk publishing no .datastore, so
              its root-pool dataset path cannot be resolved. The published
              inventory predates that field; apply tofu-proxmox first.') -%}
        {%- set path = disk.path | mandatory(
              'VM ' ~ vm_entry.key ~ ' has a disk publishing no .path, so its
              dataset path cannot be resolved. Proxmox, not this repo,
              assigns each volume name; never derive it by counting.') -%}
        {%- if dataset_roots[datastore] | default('') == 'rpool/data' -%}
          {%- set _ = jobs.append({
                'name': 'rootpool-' ~ vm.vmid ~ '-' ~ (path | regex_replace('^.*-(disk-[0-9]+)$', '\\1')),
                'source': 'root@' ~ storage_node ~ ':rpool/data/' ~ path,
                'target': 'bulk/replica/' ~ storage_node ~ '/rpool/data/' ~ path,
                'options': '--no-sync-snap --quiet',
                'sanoid_replica_class': 'slow'}) -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endif -%}
  {%- endfor -%}
  {{ jobs | to_json }}

syncoid_jobs: "{{ syncoid_pinned_jobs + (syncoid_rootpool_jobs_json | from_json) }}"

# Retired replicas: datasets stranded under bulk/replica/ by the recursive
# peer rpool/data pull that used to sit in syncoid_jobs above. Removing a job
# stops the pull, not the storage, so these two (an ephemeral sandbox guest's
# disks, tagged agent-sandbox in the published inventory) are declared here
# for the syncoid role to destroy once: every entry must be a literal path —
# the role refuses wildcards, snapshot markers, '..' and whitespace — and a
# path that is already gone is skipped, so the converge after a destroy is a
# clean no-op. Dropping an entry once it reports absent is the cleanup.
syncoid_retired_replica_datasets:
  - "bulk/replica/pve-r540/rpool/data/vm-515100-disk-0"
  - "bulk/replica/pve-r540/rpool/data/vm-515100-disk-1"
