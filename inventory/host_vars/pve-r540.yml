---
# Live Ethernet MAC recorded 2026-10-05; pin identity rather than PCI slot.
pve_host_network_uplink: nic0
pve_host_network_uplink_mac: "d0:94:66:3e:ae:81"

# Host vars for the replacement storage node — now the primary home for
# persistent application state and the database dump archive, and the source
# the DR leg pulls from.
#
# The migration-window guard that kept snapshots off here is removed. It was
# correct while this node held nothing; it is not correct now that the node
# carries the live application state, because a node holding state with no
# snapshots has no rollback point for any of it, and sanoid snapshots are the
# prerequisite for the syncoid pulls that put a copy on another node's pool
# (syncoid runs with --no-sync-snap: no snapshot here means nothing to send).
sanoid_enabled: true
sanoid_timer_enabled: true

# The unified media dataset is DELIBERATELY absent here: terraform-proxmox
# declares it with com.sun:auto-snapshot=false because acquisition churn would
# bloat snapshots, and the payload is re-acquirable. That is also why the
# `media` retention template is assigned to no dataset anywhere — a deliberate
# non-assignment, not an oversight, and it stays that way. Snapshotting it
# would pin the churn it was excluded for and dwarf everything else on the pool.
#
# Entries:
# - bulk/databases: the nightly dump archive. `hourly: 24` overrides the
#   template's `hourly: 0` — the template suits a warm standby that is
#   continuously current, but this is written once a night, so a daily-only
#   snapshot leaves a fresh dump uncaptured (and un-replicated) until the
#   following midnight, roughly two days from write to off-pool copy. Overriding
#   here rather than in the shared template keeps `database` meaning what it says.
# - bulk/appdata: persistent app config/state. Changes constantly and wants
#   point-in-time recovery, so `critical` (hourly). Recursive so per-app
#   children inherit it.
# - the object store's data volume: `critical` for the same reason, and because
#   it holds the remote state, the desired-state object, the published inventory
#   and the bucket other backups are written into. Its dataset path is derived
#   from the published inventory rather than written out, so a renumbered VMID
#   or a relocated guest flows through with no edit here.
#
# Built as an expression because one key is derived; same idiom as the splunk
# and postgres datasets on the always-on node.
object_store_vmid: >-
  {{ ((containers_from_tofu | default({}))['s3'] | default({})).vmid
     | mandatory('containers_from_tofu is unset, so the object-store VMID
       cannot be resolved. Run playbooks/load_tofu.yml — it targets localhost,
       so any --limit must include localhost. Refusing to guess a VMID.') }}

sanoid_datasets: >-
  {{ {
       'bulk/databases': {'use_template': 'database', 'recursive': 'yes', 'hourly': 24},
       'bulk/appdata': {'use_template': 'critical', 'recursive': 'yes'},
       'bulk/subvol-' ~ object_store_vmid ~ '-disk-1': {'use_template': 'critical'}
     } }}

# This node is a replication SOURCE, not a target: the DR leg pulls from it, so
# it runs no pull jobs of its own. Kept declared (rather than omitted) so the
# role reconciles any leftover schedule to absent.
syncoid_enabled: true
syncoid_jobs: []

# Postgres dump archive pull (postgres_standby role, docs/DATABASE_DR_STANDARD.md).
# Mirrors each source guest's pg-backup directory into the bulk/databases
# namespace above, which the sanoid entry snapshots hourly and the DR leg
# replicates off-pool with no per-instance edit.
#
# The dump — not the live dataset — is what earns replication. A ZFS snapshot of
# a running cluster is inconsistent by construction, so replicating the live
# database volume would produce a copy that exists but cannot be trusted to
# restore. A logical dump is consistent and is the correct restore granularity.
#
# Source guests are addressed by FQDN derived from tofu (hostname + domain),
# never a literal address. Gated on domain_from_tofu so a scoped run without
# load_tofu.yml stays inert instead of pulling from a bogus host.
postgres_standby_jobs: >-
  {{ [] if (domain_from_tofu | default('') | length == 0) else [
       {'name': 'postgres',
        'source_host': 'root@' ~ (((containers_from_tofu | default({}))['postgres'] | default({})).hostname | default('postgres')) ~ '.' ~ domain_from_tofu,
        'source_dir': '/',
        'archive_dir': '/bulk/databases/postgres'},
       {'name': 'postgres-ai',
        'source_host': 'root@' ~ (((containers_from_tofu | default({}))['postgres-ai-1'] | default({})).hostname | default('postgres-ai-1')) ~ '.' ~ domain_from_tofu,
        'source_dir': '/',
        'archive_dir': '/bulk/databases/postgres-ai'}
     ] }}

# docker-540 (VMID 915100, the second GitHub Actions CI runner host — see
# ansible-proxmox-apps inventory/host_vars/docker-host-540.yml) carries its
# Docker + containerd data on this zvol. `sync=standard` (the pool default)
# means every build-user creation during a Nix install does a synchronous
# write through this node's HDD RAIDZ2 pool (`bulk`): 32 users took 2m39s in
# a live microbenchmark on the unmodified disk. CI scratch on an ephemeral
# runner disk is disposable — losing in-flight writes on an unclean power
# loss costs nothing a fresh job wouldn't already redo — so fsync can be
# skipped entirely. With sync=disabled the same microbenchmark took ~3.3s
# (~48x) and a full Nix install was 18-28s (was consistently near the 16min
# CI timeout); 6 concurrent installs on this host completed in ~65-69s with
# no OOM or swap. Measured 2026-10-02, Vikunja #3731.
#
# vmid 915100 and the zvol name (bulk/vm-915100-disk-1) are hardcoded rather
# than derived from vms_from_tofu: that dict's per-VM disk list exists to
# avoid counting/guessing a volume name, but reading it generically here
# would mean matching on datastore + slot, which this repo has no existing
# helper for. Hardcoded and comment-pinned to the VM's description (`qm
# config 915100`) until a guest's data disk is a first-class citizen of the
# tofu contract. ponytail: literal vmid, re-derive from vms_from_tofu if a
# second guest ever needs the same override.
zfs_pools_vm_disk_properties:
  bulk/vm-915100-disk-1:
    sync: disabled

# BMC address for the idrac_power role. This node has a BMC but carried no
# address, so the role skipped it entirely -- including the chassis
# power-restore policy, which is what brings a node back unattended when AC
# returns. Inert until the BMC address is set, so the role skips rather than
# failing if it is absent.
#
# Only the address: pve_power_managed is deliberately NOT set here. This node
# is always-on, and that flag drives site.yml's power-on/power-off bookends.
idrac_power_bmc_host: "{{ lookup('env', 'PVE5_BMC_HOSTNAME') | default('', true) }}"
