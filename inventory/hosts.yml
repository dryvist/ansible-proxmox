---
all:
  children:
    proxmox:
      hosts:
        pve1:
          ansible_host: "{{ lookup('env', 'PVE1_VE_HOSTNAME') | default(omit, true) }}"
          ansible_user: "{{ lookup('env', 'PROXMOX_VM_SSH_USERNAME') }}"
          ansible_ssh_private_key_file: "{{ lookup('env', 'PROXMOX_SSH_KEY_PATH') | default(omit, true) }}"
          # Primary node, compute VLAN .10. Renamed from `pve` to `pve1`
          # on 2026-05-30 (see corosync nodelist + /etc/pve/nodes/pve1/).
          proxmox_node_name: pve1
        pve2:
          ansible_host: "{{ lookup('env', 'PVE2_VE_HOSTNAME') | default(omit, true) }}"
          ansible_user: "{{ lookup('env', 'PROXMOX_VM_SSH_USERNAME') }}"
          ansible_ssh_private_key_file: "{{ lookup('env', 'PROXMOX_SSH_KEY_PATH') | default(omit, true) }}"
          proxmox_node_name: pve2
        pve-r710:
          # Renamed from its ordinal key 2026-08-16 to the hardware-keyed form.
          # The env var name is unchanged and still carries the ordinal digit —
          # it names the variable, not the node.
          ansible_host: "{{ lookup('env', 'PVE3_VE_HOSTNAME') | default(omit, true) }}"
          ansible_user: "{{ lookup('env', 'PROXMOX_VM_SSH_USERNAME') }}"
          ansible_ssh_private_key_file: "{{ lookup('env', 'PROXMOX_SSH_KEY_PATH') | default(omit, true) }}"
          proxmox_node_name: pve-r710
          # Commissioned 2026-06-07: `bulk` (raidz2) created + registered,
          # Splunk DR replicas seeded. zfs_pools manages its datasets from tofu
          # node_storage. Corosync membership is decoupled from storage: this
          # node joined the homelab-cluster 2026-05-31.
          pve_node_commissioned: true
        pve-w5900:
          ansible_host: "{{ lookup('env', 'PVE4_VE_HOSTNAME') | default(omit, true) }}"
          ansible_user: "{{ lookup('env', 'PROXMOX_VM_SSH_USERNAME') }}"
          ansible_ssh_private_key_file: "{{ lookup('env', 'PROXMOX_SSH_KEY_PATH') | default(omit, true) }}"
          # Always-on AMD desktop, compute VLAN .14 (reconciled from the .13
          # originally planned here — matches the node name and its live
          # DHCP-assigned address; see tofu-unifi fixed-ips.json). Joined the
          # 4-node homelab-cluster 2026-07-06 (4/4 quorate), no guests placed
          # yet. Like pve1 it stays in the default `proxmox`/`pve_cluster_members`
          # groups (NOT `rack_servers`), so it inherits the compute-node
          # kernel/swap/boot-param baselines from group_vars/proxmox.yml.
          # Commissioned now node bring-up is done; zfs_pools still gates pool
          # creation on tofu node_storage carrying a disk layout for this node,
          # so flipping this alone does not place any storage yet.
          proxmox_node_name: pve-w5900
          pve_node_commissioned: true
          # Opt out of the group-wide AMD Zen1 stability boot params
          # (group_vars/proxmox.yml: clocksource=hpet, tsc=unstable, deep-C-state
          # disable). This node is AMD Zen 3, which has no Zen1 TSC/C-state quirk,
          # so forcing HPET would regress the clocksource and disabling deep
          # C-states would raise idle power for no benefit. Off here (same as the
          # rack_servers baseline); crash_diagnostics GRUB params are managed
          # separately and unaffected.
          kernel_tuning_boot_params_enabled: false
        pve540:
          # NOTE: the env var is PVE5_VE_HOSTNAME, not PVE540_ — every other
          # node matches its prefix (PVE1_/pve1 ...), this one deliberately
          # does not. The Proxmox node name is `pve540` and must stay that way:
          # it is what /etc/pve/nodes/ and corosync use.
          ansible_host: "{{ lookup('env', 'PVE5_VE_HOSTNAME') | default(omit, true) }}"
          ansible_user: "{{ lookup('env', 'PROXMOX_VM_SSH_USERNAME') }}"
          ansible_ssh_private_key_file: "{{ lookup('env', 'PROXMOX_SSH_KEY_PATH') | default(omit, true) }}"
          # Dell R540 (14G), compute VLAN .54, installed 2026-07-26 by unattended
          # ISO. BIOS staged 1.2.11 -> 2.27.0; PERC H730P disks converted to
          # Non-Raid passthrough so ZFS owns them directly. `rpool` mirrors the
          # two 120 GB S3520s; a `bulk` raidz1 spans the three 4 TB drives.
          #
          # NOT yet commissioned: `bulk` was created by hand during bring-up and
          # tofu node_storage carries no pve540 layout, so zfs_pools would not
          # reproduce it. Add that layout and reconcile before flipping
          # pve_node_commissioned, or the pool stays drift.
          #
          # Intended to become the primary storage/ZFS/NFS node as pve2 (R410)
          # is retired — note the migrated datasets carry `sharenfs`, which
          # needs an NFS server present here to apply.
          proxmox_node_name: pve540
      children:
        # Nodes eligible to form/join the cluster. Corosync membership is
        # decoupled from storage commissioning: the R710 joined the 3-node
        # homelab-cluster 2026-05-31 with its `bulk` pool commissioned —
        # zfs_pools gates pool creation on pve_node_commissioned + tofu
        # node_storage, not on this group.
        pve_cluster_members:
          hosts:
            pve1: {}
            pve2: {}
            pve-r710: {}
            pve-w5900: {}
            # pve540 is intentionally absent until it actually joins. It is
            # eligible, but this group drives cluster.yml — listing a node that
            # has not run `pvecm add` invites an unattended join. Add it in the
            # same change that performs the join.
        # Place the offline-DR node in rack_servers so it inherits the
        # rack-server zfs_swap/kernel/ulimit baselines
        # (group_vars/rack_servers.yml) rather than the cluster default.
        # Backup-cycle config is host_vars-driven and unaffected by the move.
        rack_servers:
          hosts:
            pve-r710: {}
            # R540 — a rack server, so it takes the rack zfs_swap/kernel/ulimit
            # baselines rather than the compute-node defaults.
            pve540: {}
