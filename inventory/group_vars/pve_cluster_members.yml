---
# Group vars for the `pve_cluster_members` group — the nodes the `pve_cluster`
# role is permitted to form/join into a cluster.
#
# The allow-list is derived FROM the group membership itself, so adding a host
# to the group is the single source of truth (no second list to keep in sync).
# pve_cluster_enabled stays false here — formation is opted into per-run
# (e.g. `-e pve_cluster_enabled=true`) so a routine site.yml never forms a
# cluster by accident.

pve_cluster_member_hosts: "{{ groups['pve_cluster_members'] | default([]) }}"

# The primary (cluster-creating) node — node 1, control-plane on compute .10.
# Built from proxmox_node_prefix so the node name is never hard-coded; renders to
# the inventory host key for node 1.
pve_cluster_primary_host: "{{ proxmox_node_prefix }}1"

# Cluster name. Non-secret structural value; override per environment if needed.
pve_cluster_name: homelab

# Enables roles/pve_ha (see playbooks/site.yml, which now imports playbooks/ha.yml
# on every converge). Previously this only existed as a hand-typed `-e
# pve_ha_enabled=true` on a standalone playbook that site.yml never included, so
# a node loss got no auto-restart and no relocation — see the audit at
# docs/DR_HA.md and Vikunja #1359. Declared here, in inventory, so it survives a
# routine converge instead of depending on someone remembering the flag.
pve_ha_enabled: true
