---
# Group variables for Proxmox VE servers

# Trust the OpenBao SSH client CA on the PVE nodes and (via pct) their LXC
# containers (ssh-certificate-authority ADR). Additive + lockout-guarded (a
# static break-glass key must still authenticate before the role finishes) and
# the pinned SSH_CA_FINGERPRINT is verified fail-closed. Principals are
# deny-by-default: PVE root:[ansible], LXC root:[ansible] — ai-agent is never a
# hypervisor root. Stopped containers are reported as blockers, not failures.
ssh_ca_trust_rollout_enabled: true

# Node naming: every Proxmox node is addressed as <proxmox_node_prefix><N> — a node
# is just its number with this prefix prepended. Parameterized so node references in
# roles and host_vars never hard-code the real prefix. The REAL prefix is injected at
# runtime via the PROXMOX_NODE_PREFIX env var (e.g. from Doppler); the committed
# default below is a neutral EXAMPLE only and must never carry the real value.
proxmox_node_prefix: "{{ lookup('env', 'PROXMOX_NODE_PREFIX') | default('proxmox', true) }}"

# ZFS Swap Configuration
zfs_swap_size: "96G"
zfs_swap_pool: "rpool"
zfs_swap_dataset: "swap"

# Kernel Tuning - Sysctl
kernel_tuning_swappiness: 10
kernel_tuning_vfs_cache_pressure: 50
kernel_tuning_dirty_ratio: 10
kernel_tuning_dirty_background_ratio: 5
kernel_tuning_overcommit_memory: 0

# Kernel Tuning - Boot Parameters (AMD Zen1 stability)
# NOTE: This role manages boot params via /etc/kernel/cmdline (UEFI) or GRUB (BIOS).
# The crash_diagnostics role ALSO manages GRUB params - they will be merged, not conflict.
# For UEFI systems, only kernel_tuning manages /etc/kernel/cmdline.
kernel_tuning_boot_params_enabled: true
# Clocksource is deliberately not forced here; see the role defaults for the
# measurement. Forcing HPET cost 76x the per-read latency of TSC on this
# estate's own hardware, and the Zen1 TSC concern it guarded against comes from
# C6 entry, which disable_deep_cstates and disable_zen_c6 already address. The
# kernel picks TSC where it is sound and demotes it itself if it ever drifts.
kernel_tuning_disable_smt: false
kernel_tuning_disable_deep_cstates: true

# Ulimits Configuration
ulimits_nofile: 65536
ulimits_nproc: 65536
ulimits_users:
  - "*"
  - root
  - splunk

# LXC Container Features
# Docker-in-LXC containers require nesting, keyctl, and fuse for fuse-overlayfs storage driver.
# The BPG Proxmox Terraform provider cannot set features on privileged containers (requires root@pam).
# This role applies the correct feature flags via pct set on the Proxmox host.
lxc_features_containers:
  "110": "nesting=1,keyctl=1,fuse=1" # mailpit - Docker SMTP relay
  "111": "nesting=1,keyctl=1,fuse=1" # ntfy - Docker push notifications
  "130": "nesting=1,keyctl=1,fuse=1" # mssql - Docker MS SQL Server
  # LLM fabric Docker-in-LXC guests (tofu creates them nesting-only; keyctl
  # and fuse are root@pam-only, so this role applies them post-create)
  "405000": "nesting=1,keyctl=1,fuse=1" # langfuse - Docker LLM observability
  "505000": "nesting=1,keyctl=1,fuse=1" # open-webui - Docker chat UI
  "505010": "nesting=1,keyctl=1,fuse=1" # dify - Docker LLMOps platform
  "505020": "nesting=1,keyctl=1,fuse=1" # langflow - Docker flow builder
  "512000": "nesting=1,keyctl=1,fuse=1" # llm-router-1 - Docker LiteLLM proxy
  "512010": "nesting=1,keyctl=1,fuse=1" # llm-router-2 - Docker LiteLLM proxy
  "512020": "nesting=1,keyctl=1,fuse=1" # llm-router-3 - Docker LiteLLM proxy
  "514000": "nesting=1,keyctl=1,fuse=1" # qdrant - Docker vector database
  # AI-orchestration Docker LXCs are tag-resolved by docker_lxc_features.

# Common packages to install
common_packages:
  - htop
  - iotop
  - lm-sensors
  - rasdaemon

# apt caching proxies (apt-cacher-ng) for Proxmox nodes. Real URLs are injected
# via the APT_PROXY_URL env var (e.g. from Doppler), like http://<acng>:3142, so
# no environment-specific address is committed. Empty disables proxying.
#
# The cache is an HA pair, so APT_PROXY_URL accepts several URLs separated by
# commas and/or whitespace; one URL is still a valid value. Order is the
# preference order — the node uses the first that answers.
pve_repositories_apt_proxies: >-
  {{ lookup('env', 'APT_PROXY_URL') | default('', true) | regex_findall('[^,\s]+') }}
