---
# Group variables for Proxmox VE servers

# The ONE Proxmox login user (ansible_user below), not the API token owner
# (pve_cluster_api_user). Published by tofu-proxmox, top-level sibling of
# proxmox_node, injected by playbooks/load_tofu.yml. `| mandatory` never
# fires on the empty string a missing key resolves to, so this uses the same
# reject/first idiom as proxmox_node_names.primary below -- no literal default.
proxmox_user: "{{ [proxmox_user_from_tofu | default('')] | reject('equalto', '') | list | first }}"

# Enables roles/pve_ha (see playbooks/site.yml, which now imports playbooks/ha.yml
# on every converge). Previously this only existed as a hand-typed `-e
# pve_ha_enabled=true` on a standalone playbook that site.yml never included, so
# a node loss got no auto-restart and no relocation — see the audit at
# docs/DR_HA.md and Vikunja #1359. Declared here, in inventory, so it survives a
# routine converge instead of depending on someone remembering the flag.
#
# Deliberately on the `proxmox` group, not the narrower `pve_cluster_members`
# group: playbooks/ha.yml's play targets `hosts: proxmox`, and pve_ha's own
# first task (an unconditional per-host assert) runs on every host in that
# play — including cluster members outside `pve_cluster_members` (that
# group's membership governs corosync join eligibility, a different and
# narrower concern, and does not cover every node actually in the cluster).
# Placing the flag on `pve_cluster_members` left one such node failing the
# assert on every converge — caught live 2026-08-15.
pve_ha_enabled: true

# NVIDIA driver role's internal guard is derived from the capability group
# built from Tofu node tags in playbooks/load_tofu.yml.
nvidia_driver_enabled: "{{ 'nvidia_gpu_nodes' in group_names }}"

# Access-tier login used where inventory explicitly enables this account.
host_admin_user: host-admin
ssh_ca_trust_host_admin_principals: [ai-agent]
ssh_ca_trust_host_admin_guest_tags: []

# Read-only diagnostic login for a trusted AI session on every Proxmox node: a
# non-root account reached by the `ai-diag` CA principal (ssh-client-ca role
# automation-ai-diag, 15m certs) whose sudo is the exact diagnostics allowlist
# in the local_identities defaults. Another identity or host class is one more
# row here or in that group's group_vars; no new task, template or role.
local_identities_extra_accounts:
  - user: ai-diag
    principals: [ai-diag]
    sudo: "{{ local_identities_readonly_diagnostics_sudo }}"

# Cribl Edge's native GPU metrics require NVIDIA's nvidia-smi utility. Reuse the
# driver opt-in derived from the node's NVIDIA capability group.
cribl_edge_gpu_mode: >-
  {{ 'custom' if (nvidia_driver_enabled | default(false) | bool) else 'disabled' }}

# Trust the OpenBao SSH client CA on the PVE nodes and (via pct) their LXC
# containers (ssh-certificate-authority ADR). Additive + lockout-guarded (a
# static break-glass key must still authenticate before the role finishes) and
# the pinned SSH_CA_FINGERPRINT is verified fail-closed. Principals are
# deny-by-default: PVE and LXC root:[ansible,semaphore]. The host-admin account
# accepts ai-agent only where inventory opts in. Stopped containers are
# reported as blockers, not failures.
ssh_ca_trust_rollout_enabled: true
# Also issue CA-signed SSH host certificates to the nodes and their running
# containers, so clients trust one @cert-authority line instead of pinning
# each host key.
ssh_ca_trust_host_cert_enabled: true

# Node naming: node names are hardware-keyed, so a name can no longer be composed
# from a prefix plus an ordinal — the old `<prefix><N>` scheme could only ever
# produce the retired ordinal names, and every reference built that way rendered a
# host that does not resolve. The committed defaults below are neutral
# EXAMPLES only and must never carry a real name.
#
# Node identity, resolved from the OpenTofu desired state (deployment.json) via
# playbooks/load_tofu.yml. These were previously environment variables naming
# each node by a positional ordinal. That had two failure modes and hit both:
# an ordinal that drifted resolved to a placeholder and the consuming task
# no-opped in silence, and the ordinals outlived the node naming scheme they
# were derived from. Placement is declared once, in the desired state.
#
# Deliberately NO defaults here. An unresolvable name must fail the run loudly:
# a placeholder that reaches ha-manager or a syncoid source is worse than a
# stopped converge, because it looks like success. Both names go through
# `reject('equalto','') | first`, which raises on an empty match — see the
# note on `primary` for why `mandatory` is the wrong tool here.
#
# There is no `dr` key any more. Its only consumer was a cluster-wide
# replication pair, which per-guest `ha_replication_target` replaces — a pair
# is a property of a guest's storage, not of the cluster.
proxmox_node_storage_candidates: >-
  {{ cluster_nodes_from_tofu | default({}, true) | dict2items
     | selectattr('value.cluster_roles', 'defined')
     | selectattr('value.cluster_roles', 'contains', 'storage')
     | map(attribute='key') | list }}

proxmox_node_names:
  # Cluster-creating node; also where the cluster-wide ha-manager commands run.
  # `reject('equalto','') | first`, deliberately, and NOT `| mandatory(...)`:
  # mandatory only fires on an UNDEFINED value, so it sails straight past the
  # empty string an absent key produces — the guard would look present and
  # never fire. `first` on an empty sequence raises for both cases.
  primary: "{{ [primary_node_from_tofu | default('')] | reject('equalto', '') | list | first }}"
  # Storage home — the node that serves the bulk datasets pulled off-node.
  # Exactly one node carries the role; the desired state enforces that at plan
  # time, so more or fewer than one here means the inventory artifact is stale.
  storage: "{{ proxmox_node_storage_candidates | reject('equalto', '') | list | first }}"

# ZFS Swap Configuration
zfs_swap_size: "96G"
zfs_swap_pool: "rpool"
zfs_swap_dataset: "swap"

# Kernel Tuning - Sysctl
kernel_tuning_swappiness: 10
kernel_tuning_vfs_cache_pressure: 50
kernel_tuning_dirty_ratio: 10
kernel_tuning_dirty_background_ratio: 5
kernel_tuning_overcommit_memory: 0

# Kernel Tuning - Boot Parameters (AMD Zen1 stability)
# NOTE: This role manages boot params via /etc/kernel/cmdline (UEFI) or GRUB (BIOS).
# The crash_diagnostics role ALSO manages GRUB params - they will be merged, not conflict.
# For UEFI systems, only kernel_tuning manages /etc/kernel/cmdline.
kernel_tuning_boot_params_enabled: true
# Clocksource is deliberately not forced here; see the role defaults for the
# measurement. Forcing HPET cost 76x the per-read latency of TSC on this
# estate's own hardware, and the Zen1 TSC concern it guarded against comes from
# C6 entry, which disable_deep_cstates and disable_zen_c6 already address. The
# kernel picks TSC where it is sound and demotes it itself if it ever drifts.
kernel_tuning_disable_smt: false
kernel_tuning_disable_deep_cstates: true

# Ulimits Configuration
ulimits_nofile: 65536
ulimits_nproc: 65536
ulimits_users:
  - "*"
  - root
  - splunk

# Common packages to install
common_packages:
  - htop
  - iotop
  - lm-sensors
  - rasdaemon

# node_exporter's drm collector (disabled upstream by default) reads GPU
# metrics from sysfs/DRM; amdgpu is the only driver it currently exposes
# (node_drm_gpu_busy_percent, node_drm_memory_vram_used_bytes, ...). Set
# group-wide rather than a per-host exception: on a node with no amdgpu
# device the collector just finds nothing to report.
pve_node_exporter_extra_args:
  - "--collector.drm"

# The shared inventory publishes the sorted FQDN URL list for guests carrying
# the apt-cache capability tag. The loader requires the list before a converge.
pve_repositories_apt_proxies: >-
  {{ cache_proxy_urls_from_tofu }}

# Corosync voting members that are deliberately not powered on. Their vote
# still counts toward `Highest expected` and so still raises the quorum bar,
# but it can never be cast — pve_quorum_guard subtracts them so the reported
# headroom reflects votes that can actually arrive.
pve_quorum_guard_powered_off_voters:
  - pve-r540

# Reporting threshold, deliberately at 0 rather than the role default of 1:
# with the member above discounted the cluster currently has no headroom, and
# arming the assert before the vote topology changes would fail every converge
# without moving the cluster any closer to tolerating a loss. The guard still
# reports the arithmetic on every run. Raise to 1 once a zero-vote member or an
# external arbiter lands — see roles/pve_quorum_guard/README.md.
pve_quorum_guard_min_headroom: 0

# Storage id -> ZFS dataset root, built from each node's OWN declared storage
# (zfs_pools_from_tofu, injected per host by load_tofu.yml) rather than from a
# second copy of it. Two shapes produce a PVE storage:
#   - a registered POOL puts guest volumes at the pool root  (ssd -> ssd)
#   - a dataset with pvesm_id puts them under it  (nvme-splunk -> nvme/splunk)
# 'local-zfs' is Proxmox's install-time default zfspool and is not declared in
# node_storage, so it is the one entry that must be stated.
#
# Group-level, not per host: every node resolves its own storage through the
# same expression, so a snapshot policy anywhere can name a STORAGE and let the
# pool follow. A pool name written into a snapshot policy is the false green
# this exists to prevent -- once the guest's volume moves tier the policy keeps
# snapshotting the frozen copy, and counts and timestamps stay healthy while
# capturing nothing. Copying this map into a second host_vars file would
# reintroduce the same drift one level up.
#
# Rendered as JSON then parsed -- the same pattern load_tofu.yml uses for
# nas_storage_by_node, because Jinja has no dict comprehension.
#
# Every default() below is the BOOLEAN-AWARE two-argument form. The one-argument
# form substitutes for UNDEFINED only, so a key published as an explicit null
# passes straight through and the .items() beneath it renders garbage: the
# failure surfaces as a from_json parse error about column 2, naming neither the
# key nor the node. Fired both ways against a null `pools` and a null `datasets`
# before and after; the one-argument form produced exactly that.
pve_dataset_root_by_storage_json: >-
  {
  {%- set ns = namespace(sep='') -%}
  {%- for pool_key, pool in ((zfs_pools_from_tofu | default({}, true)).pools | default({}, true)).items() -%}
    {%- if pool.register | default(true) -%}
      {{ ns.sep }}{{ pool_key | to_json }}: {{ pool_key | to_json }}
      {%- set ns.sep = ',' -%}
    {%- endif -%}
    {%- for ds_key, ds in (pool.datasets | default({}, true)).items() -%}
      {%- if ds.pvesm_id | default('') -%}
        {{ ns.sep }}{{ ds.pvesm_id | to_json }}: {{ (pool_key ~ '/' ~ ds_key) | to_json }}
        {%- set ns.sep = ',' -%}
      {%- endif -%}
    {%- endfor -%}
  {%- endfor -%}
  {{ ns.sep }}"local-zfs": "rpool/data"
  }
pve_dataset_root_by_storage: "{{ pve_dataset_root_by_storage_json | from_json }}"

# Splunk protected-disk policy. It applies on whichever node the published
# inventory places the Splunk VM, so it follows a move with no edit.
#
# Opt-in by INTERFACE, with no exclusion list: a disk is protected only by being
# named here, so the hot/warm and cold index tiers (virtio2, virtio3) stay out
# of every snapshot and replication policy as a stated decision -- Splunk owns
# index durability through its own bucket archival.
#
# Volume names and the datastore come from the published `disks` list, which
# carries the name Proxmox assigned. They are never built by counting: indices
# are allocated per (vmid, storage) as next-free, so a counted name can be the
# retained pre-move copy, a frozen dataset that snapshots perfectly while
# capturing nothing.
#
# The interface list is iterated, not the disk list filtered, so an interface
# that stops being published fails the converge instead of silently dropping
# that disk's coverage. Every `| mandatory(...)` is bare: a `default()` on the
# asserted value would satisfy it unconditionally.
splunk_protected_disk_interfaces:
  - scsi0 # OS disk
  - virtio1 # configuration + logs

splunk_protected_disks_json: >-
  {%- set splunk = (splunk_vm_from_tofu | default({}, true)).splunk | default({}, true) -%}
  {%- set disks = splunk.disks | mandatory(
        'The Splunk VM publishes no .disks, so its dataset paths cannot be
          resolved. Run playbooks/load_tofu.yml (it targets localhost, so any
          --limit must include localhost); if the published inventory predates
          the disks field, apply tofu-proxmox first. Refusing to guess a pool
          or a volume name.') -%}
  {%- set out = {} -%}
  {%- for iface in splunk_protected_disk_interfaces -%}
    {%- set message = (splunk.node | default('Splunk')) ~ ': the Splunk VM publishes no disk on interface "'
          ~ iface ~ '", named in splunk_protected_disk_interfaces. Reconcile the list against published disks.' -%}
    {%- set matches = disks | selectattr('interface', 'eq', iface) | list -%}
    {%- if matches | length == 0 -%}
      {{ undef(hint=message) | mandatory(message) }}
    {%- endif -%}
    {%- set _ = out.update({iface: matches[0]}) -%}
  {%- endfor -%}
  {{ out | to_json }}
splunk_protected_disks_by_interface: "{{ splunk_protected_disks_json | from_json }}"

sanoid_splunk_datasets_json: >-
  {
  {%- set splunk = (splunk_vm_from_tofu | default({}, true)).splunk | default({}, true) -%}
  {%- set node = splunk.node | mandatory('The Splunk VM node cannot be resolved from splunk_vm_from_tofu.') -%}
  {%- if node == (proxmox_node_name | default(inventory_hostname)) -%}
    {%- set ns = namespace(sep='') -%}
    {%- for iface in splunk_protected_disk_interfaces -%}
      {%- set disk = splunk_protected_disks_by_interface[iface] -%}
      {%- set datastore = disk.datastore | mandatory(node ~ ': Splunk disk on interface "' ~ iface ~ '" publishes no .datastore.') -%}
      {%- set path = disk.path | mandatory(node ~ ': Splunk disk on interface "' ~ iface ~ '" publishes no .path.') -%}
      {%- set root = pve_dataset_root_by_storage[datastore]
            | mandatory(node ~ ': the Splunk disk on storage "' ~ datastore
              ~ '" resolves to no ZFS dataset root. A dir-type storage has no
              per-guest dataset and cannot be snapshotted; move that disk to a
              zfspool storage or declare the storage in node_storage.') -%}
      {{ ns.sep }}{{ (root ~ '/' ~ path) | to_json }}: {{ {'use_template': 'critical'} | to_json }}
      {%- set ns.sep = ',' -%}
    {%- endfor -%}
  {%- endif -%}
  }
sanoid_splunk_datasets: "{{ sanoid_splunk_datasets_json | from_json }}"

# PBS guest backups (pve_backup_jobs). Jobs are enabled one node at a time.
pve_backup_jobs_manage: true
pve_backup_jobs_prune_unmanaged: false
pve_backup_jobs_config_host: "{{ proxmox_node_names.primary }}"
pve_backup_jobs_pbs_node: pve-w1700
pve_backup_jobs_pbs_server: "{{ hostvars['localhost'].tofu_data.containers.pbs.fqdn }}"
pve_backup_jobs_jobs:
  - {id: guests-pve-r540, all: true, node: pve-r540, storage: guests, schedule: "01:15", enabled: false}
  - {id: guests-pve-r710, all: true, node: pve-r710, storage: guests, schedule: "01:15", enabled: false}
  - {id: guests-pve-w5900, all: true, node: pve-w5900, storage: guests, schedule: "01:15", enabled: true}
