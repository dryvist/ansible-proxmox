---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(\.github/workflows/.*\.lock\.yml|\.github/workflows/agentics-maintenance\.yml|\.github/aw/)
      - id: end-of-file-fixer
        exclude: ^(\.github/workflows/.*\.lock\.yml|\.github/workflows/agentics-maintenance\.yml|\.github/aw/)
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]
        exclude: ^(\.github/workflows/.*\.lock\.yml|\.github/workflows/agentics-maintenance\.yml)

  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-lint
        language: python
        language_version: python3.13
        entry: ansible-lint -v --force-color
        pass_filenames: false
        always_run: true
        additional_dependencies:
          - ansible-lint==26.4.0
          - ansible-core>=2.21.0,<2.22.0
          - packaging

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]
        exclude: ^\.github/aw/
